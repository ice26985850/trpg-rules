<p>一場發生在廢棄車站的遭遇戰。玩家需在被喚醒的屍群合圍前找到出口。</p>
<h2>場景目標</h2>
<ul>
<li>在 3 回合內找到車站控制室鑰匙</li>
<li>避免驚動走廊盡頭的「管理者」</li>
</ul>
<h2>關鍵 NPC</h2>
<ul>
<li>老張：倖存者，知道鑰匙位置，但受傷無法同行</li>
</ul>
<h2>難度提示</h2>
<ul>
<li>售票亭抽屜（DC 12）可找到備用鑰匙</li>
<li>管理者感知範圍 2 格，超過則觸發追逐</li>

title: The Hero's Proof — Monster Catalog
sections:
- heading: The Hero's Proof — Monster Catalog
  text:
  - 'Source of values: System Finalization (Chapter 5 Enemy Challenge Rating (CR) and Boss framework), Traditional Chinese; terms use the "Chinese full name (abbreviation)" format.'
  - 'Enemy value formulas (locked by System Finalization):'
  - '- Health (HP) = `floor(40 × (1 + 0.09 × (CR − 1)))`'
  - '- Attack Bonus (ATK) = `floor(1 + 0.25 × CR)`'
  - '- Evasion (EVA) = `10 + floor(0.15 × CR)`'
  - '- Damage/hit = `floor(6 + 1.2 × CR)`'
  - '- Damage = the base output value per attack, an independent figure from Attack Bonus (ATK) (which governs hit chance); the magnitude gap between the two is an intended design choice (not an error), confirmed by Audit Item 71.'
  - '- Critical Threshold (CritTh) is fixed at 20 (high Challenge Rating (CR) may lower it by 1–2 thresholds)'
  - '- Experience (EXP) = `floor(15 × CR × (1 + CR/15))`; Boss EXP ×4'
  - 'Template fields: Name / Challenge Rating (CR) / Health (HP) / Attack Bonus (ATK) / Evasion (EVA) / Damage Reduction (DR) / Movement / Initiative Bonus / Attack / Skill / Trait / Experience (EXP) / Drop.'
  - Boss phase transitions are uniformly bound to Health (HP) 66% / 33% (unaffected by critical-hit fluctuation).
  - '---'
  tables: []

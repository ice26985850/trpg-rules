- heading: II. Four Demon Generals
  text:
  - Phase transitions bound to Health (HP) 66% / 33%; each general's "Phase Three" is set as the player's critical-hit finishing window (weakened Damage Reduction / exposed core / breakable object).
  tables: []
- heading: Dragon General Ignis Ember-Scale (Drakaina General)
  text:
  - '- Challenge Rating (CR): "40　Health (HP): 720　Attack Bonus (ATK): +11　Evasion (EVA): 16　Damage Reduction (DR): Scales 30% Physical　Movement: 6 tiles　Initiative Bonus: +3　Critical Threshold (CritTh): 20　Experience (EXP): 8,800 (Boss ×4)'
  - '- Attack: Dragon Claw Slash 2d8+11 (Fire rider)'
  - '- Skill: Dragon Breath (AOE cone Fire, Burn 2 rounds) / Aerial Assault (Charge + Fear 2 rounds)'
  - '- Trait: Phase One "Wyrmling Form" scales Damage Reduction 30%; Phase Two (HP 66%) unlocks Dragon Breath and Aerial Assault; Phase Three (HP 33%) "Berserk Form" Damage Reduction drops to 15% and every 2 rounds casts [World-ending Breath] large Area Effect (AOE), entering a critical-hit window. Fire Resistance ×0.5.'
  - '- **Humanoid Image**: A tall, human-shaped figure appears — crimson long hair cascading like flowing lava, a pair of jet-black dragon horns sprouting from her brow, her armor inlaid with layered dragon scales that gleam with a cold metallic sheen under the firelight; her eyes are molten-gold amber, exhaling scorching white smoke with every breath. Though she has restrained her colossal dragon body, the texture of scales and draconic pride still emanate from her very bones — she is the foremost of the Four Demon Generals, the one closest to the "dragon."'
  - '- Battle entrance line: "Stand down, weaklings. My scales shall not warm for you."'
  - '- Drop: Dragon Scale Fragment, Ember-scale Core (Epic enchantment material)'
  tables: []
- heading: Succubus General Lilith Charmshade (Succubus General)
  text:
  - '- Challenge Rating (CR): "44　Health (HP): 776　Attack Bonus (ATK): +12　Evasion (EVA): 16　Damage Reduction (DR): 15% Physical　Movement: 6 tiles　Initiative Bonus: +5　Critical Threshold (CritTh): 20　Experience (EXP): 10,384 (Boss ×4)'
  - '- Attack: Charm Whip Shadow 2d10+12'
  - '- Skill: Illusion Dance (Charm, by level 1–3 rounds) / Desire Bind (Immobilize) / Inner-Demon Split (copies ally appearance)'
  - '- Trait: Phase One "Dance of Seduction" Illusion Dance controls; Phase Two (HP 66%) drains HP from charmed targets to heal self; Phase Three (HP 33%) true form revealed, Inner-Demon Split creates a trust crisis, full output after charm is broken. Shadow Resistance ×0.5, Psychic Immunity.'
  - '- **Humanoid Image**: A standard succubus-type humanoid — bat wings folded behind her like a draped cloak, pointed ears peeking from her charming purple long hair, the corners of her eyes curved with a seductive arc, a smile forever fixed as if calculating the hearts of men. She walks like a cat and speaks like honey; though she has put away the demon''s ferocity, that innate seductive quality still seeps from her gaze and breath.'
  - '- Battle entrance line: "Come now~ just sleep quietly, and it won''t hurt, okay?"'
  - '- Drop: Charmshade''s Tear (Epic accessory material), Mind Orb'
  tables: []
- heading: Necromancer General Morvana Silentgrave (Necromancer General)
  text:
  - '- Challenge Rating (CR): "42　Health (HP): 748　Attack Bonus (ATK): +11　Evasion (EVA): 16　Damage Reduction (DR): 20% Physical　Movement: 4 tiles　Initiative Bonus: +4　Critical Threshold (CritTh): Critical-Hit Immunity　Experience (EXP): 9,576 (Boss ×4)'
  - '- Attack: Necromancer Staff Shadow 2d10+11'
  - '- Skill: Undead Summon (replenishes minions each round) / Life Siphon (Lifesteal) / Death Domain (field-wide DoT)'
  - '- Trait: Phase One "Summon" consumes player Area Effect (AOE); Phase Two (HP 66%) zombie tide and Death Domain; Phase Three (HP 33%) lich transformation, [Critical-Hit Immunity] invincible until core is exposed, must destroy the life-preserving coffin (breakable object) to dispel, [Final Dirge] countdown. Undead; Shadow Resistance ×0.5; Holy Vulnerability ×1.5.'
  - '- **Humanoid Image**: Clad in a pallid shrine-maiden robe, her skin like frost under the moon, her form semi-transparent as if a single breeze could scatter her; spectral blue netherfire drifts slowly around her, her hands cradling a bone staff carved with the names of the dead and festooned with fine bone shards. She speaks as if through a layer of water, gentle to the point of sorrow — a shrine maiden who has kept vigil for the deceased too long and can never return.'
  - '- Battle entrance line: "Sleep well… I will let them keep you company in eternal slumber."'
  - '- Drop: Silentgrave Soul Core (Epic material), Rune of Immortality'
  tables: []
- heading: Slime General Prum Gel (Slime General)
  text:
  - '- Challenge Rating (CR): "46　Health (HP): 808　Attack Bonus (ATK): +12　Evasion (EVA): 16　Damage Reduction (DR): 10% All types　Movement: 4 tiles　Initiative Bonus: +1　Critical Threshold (CritTh): 19 (high CR lowers 1 threshold)　Experience (EXP): 11,224 (Boss ×4)'
  - '- Attack: Sticky Strike Bludgeon 2d10+12 (Acid)'
  - '- Skill: Split (when struck, divides into two bodies) / Acid Corrosion (on hit, target Damage Reduction (DR) −20%, lasts 3 rounds) / Fusion (child body merges and restores to full)'
  - '- Trait: "Phase One \"Splitting Proliferation\" requires Area Effect (AOE) to clear the field (Split: when struck, spawns 1 clone; clone HP = 50% of body''s current HP, treated as half the original CR, max 2 bodies on field (including original), body death clears the field, no infinite splitting); Phase Two (HP 66%) Fusion restores to full + Acid Corrosion; Phase Three (HP 33%) \"Crystallize\" [Critical-Hit Immunity] + high Damage Reduction (80%), must break the crystal with Bludgeon then enter a fragile finish. Critical-Hit Immunity; Acid Immunity.'
  - '- **Humanoid Image**: A translucent, jelly-textured humanoid girl whose body wobbles faintly like jelly, light passing through her refracting into rainbow colors, and a finger-touch makes her "boing" right back. She calls people big brother and big sister in a baby voice, and her eyes light up at the sight of sweets — the most innocent yet slimiest glutton of the four generals, until she melts entirely and wraps her enemies into syrup balls.'
  - '- Battle entrance line: "Prum is hungry~ shall I turn you… into sweet little treats?"'
  - '- Drop: Pure Gel Core (Epic material), Viscous Essence'
  - '---'
  tables: []
- heading: III. Demon Queen
  text: []
  tables: []
- heading: Vercellia Nordheim (The Demon Queen)
  text:
  - '- Challenge Rating (CR): "50　Health (HP): 864　Attack Bonus (ATK): +13　Evasion (EVA): 17　Damage Reduction (DR): 35% All types　Movement: 6 tiles　Initiative Bonus: +6　Critical Threshold (CritTh): 18　Experience (EXP): 13,000 (Boss ×4)'
  - '- Attack: Demon Lord Blade Shadow+Physical 3d12+13'
  - '- Skill: "Four-General Echo (rotates Dragon/Charm/Death/Gel powers) / Sovereign Domain (field-wide debuff) / Four-Element Annihilation (rotating AOE) / Eschaton Judgment (field-wide instakill threat countdown: 5-round countdown; if core not broken / judgment source not destroyed within 5 rounds, field-wide instakill (party wipe); during countdown the core / judgment source is exposed and can be attacked)'
  - '- Trait: Phase One "Sovereign" rotates the four generals'' powers; Phase Two (HP 66%) true Demon Lord form, Sovereign Domain + Four-Element Annihilation; Phase Three (HP 33%) Eschaton, [Eschaton Judgment] instakill countdown, players must break the core within the limit. Can be negotiated / turned / surrendered (Influence Points (IP) ≥ 40 opens the Reconciliation Ending). All-attribute Resistance ×0.5, Psychic Immunity.'
  - '- Drop: Demon Lord Sigil (Legendary material), Crown of Sovereignty'
  - '---'
  tables: []
- heading: IV. The Betrayer
  text: []
  tables: []
- heading: Jeno Gojo (female human traitor, Demon Lord Army "Fifth Demon General")
  text:
  - '- **Identity**: Sex Female | Race Human | Identity Human traitor, Demon Lord Army "Fifth Demon General" (the one who bears the "Four Heavenly Kings yet five people" gag). A former genius knight of the Human Kingdom, falsely accused of cheating and expelled from the guild promotion exam, then angrily joined the Demon Lord Army; a straight-faced tsukkomi character who insists "I''m the fifth, not one of the Four Heavenly Kings." Not fundamentally evil; in Scenario 2 (S2), touching her loneliness can trigger a defection side quest.'
  - '- Challenge Rating (CR): "45　Health (HP): 792　Attack Bonus (ATK): +12　Evasion (EVA): 16　Damage Reduction (DR): 30% Physical　Movement: 7 tiles　Initiative Bonus: +6　Critical Threshold (CritTh): 20　Experience (EXP): 10,800 (Boss ×4)'
  - '- Attack: Formless Blade Pierce 3d10+12 (can copy class moves)'
  - '- Skill: Tactical Foresight (reads player actions ahead, higher Evasion (EVA)) / Copy Ally Skill (counter) / Backstab Crit (guaranteed crit on isolated targets)'
  - '- Trait: Phase One "Guerrilla" high evasion; Phase Two (HP 66%) betrayal revealed, copies ally skills + guaranteed crit on isolated targets; Phase Three (HP 33%) branch — if Influence Points (IP) are sufficient, [Atonement Burst] assists, otherwise [Despair Burst] at full power becomes the hardest fight. Human (no racial resistance).'
  - '- **Humanoid Image**: A human female swordswoman in a black-knight-style cloak, bearing a formless blade, a "traitor''s banner" sigil branded on her left eye; a sharp contrast to the four generals'' alien styles, marking her as the "human traitor."'
  - '- Note: Her "defection assist" is a one-time story / phase-transition mechanic for that battle in S4, not a permanent ally; in solo mode per Clarification B, no extra assist character is added, and she only temporarily becomes a neutral friendly unit in the battle where the Influence Points (IP) threshold is met.'
  - '- Drop: Gojo''s Blade (Legendary weapon material), Traitor''s Banner Shard'
  - '---'
  tables: []
- heading: V. Beyond-the-World (Otherworld) Enemies
  text:
  - 'Not the native Demon Lord Army, but Otherworld entities from the "World Rift". They poured in through the rift after the Demon Lord Castle collapsed in Scenario 8 (see Scenarios 9–11 endgame chapter). Thematic traits distinct from native enemies: **Reality Warp** (randomly changes positioning map / teleports characters), **Rule Nullification** (ignores some native Damage Reduction (DR) / terrain cover), **Beyond-the-World Resistance** (reduces damage from native elements, must use Otherworld-exclusive means to break defense), **Rift Synergy** (high-tier units recover HP each round).'
  - 'Values computed directly from GM Book 10.4 formula (Critical Threshold (CritTh): "CR55–75 lowered by 1 threshold to 19, CR85–99 lowered by 2 thresholds to 18); solo mode per Clarification B: CR−3, enemy count ×0.5.'
  - 'Three-chapter endgame structure: Scenario 9 final battle **Void Sentinel (CR65 mini-boss)**; Scenario 10 final battle **Eclipse Sovereign (CR75 mid-boss)**; Scenario 11 first fight **Eschaton Prophet (CR85 final-boss bodyguard)** then **The Beyond · Singularity (CR99 final boss)**.'
  tables: []
- heading: Rift Vanguard (Otherworld Elite · Outpost)
  text:
  - '- Challenge Rating (CR): "55　Health (HP): 234　Attack Bonus (ATK): +14　Evasion (EVA): 18　Damage Reduction (DR): 25% All types　Movement: 6 tiles　Initiative Bonus: +5　Critical Threshold (CritTh): 19　Experience (EXP): 15,400 (Boss ×4)'
  - '- Attack: Rift Sunder Untyped 3d12+14'
  - '- Skill: Reality Warp (flips positioning map every 3 rounds) / Beyond-the-World Resistance (native element damage reduction 50%)'
  - '- Trait: Phase One "Infiltration" frequent repositioning; Phase Two (HP 50%) triggers Reality Warp; Phase Three (HP 25%) Rift Synergy recovers 5% HP each round.'
  - '- Drop: Rift Shard (Legendary material), Otherworld Crystal'
  tables: []
- heading: Void Sentinel (Otherworld Mini-boss · Scenario 9 final battle)
  text:
  - '- Challenge Rating (CR): "65　Health (HP): 1080　Attack Bonus (ATK): +17　Evasion (EVA): 19　Damage Reduction (DR): 30% All types　Movement: 6 tiles　Initiative Bonus: +6　Critical Threshold (CritTh): 19　Experience (EXP): 20,800 (Boss ×4)'
  - '- Attack: Sentinel Sunder Untyped 3d12+17'
  - '- Skill: Reality Warp (flips positioning map every 2 rounds) / Beyond-the-World Resistance (native element damage reduction 50%) / Sentinel Field (AOE Chill)'
  - '- Trait: Phase One "Border Patrol" repositioning + summons Rift Vanguard; Phase Two (HP 50%) Rule Nullification (ignores a player''s Damage Reduction (DR)); Phase Three (HP 25%) Rift Synergy recovers 6% HP each round.'
  - '- Drop: Sentinel Core (Legendary material), Otherworld Crystal ×2'
  tables: []
- heading: Void Apostle (Otherworld Boss · Scenario 10 outpost tier)
  text:
  - '- Challenge Rating (CR): "70　Health (HP): 288　Attack Bonus (ATK): +18　Evasion (EVA): 20　Damage Reduction (DR): 30% All types　Movement: 7 tiles　Initiative Bonus: +6　Critical Threshold (CritTh): 19　Experience (EXP): 23,800 (Boss ×4)'
  - '- Attack: Void Devour Untyped 4d12+18'
  - '- Skill: Rule Nullification (ignores a player''s Damage Reduction (DR)) / Reality Warp (teleports player units) / Gap Burst (AOE)'
  - '- Trait: Phase One "Erosion" weakens player status; Phase Two (HP 50%) Rule Nullification + Reality Warp; Phase Three (HP 25%) Rift Synergy recovers 8% HP each round. Beyond-the-World Resistance ×0.5.'
  - '- Drop: Void Core (Legendary material), Apostle Sigil'
  tables: []
- heading: Eclipse Sovereign (Otherworld Mid-boss · Scenario 10 final battle)
  text:
  - '- Challenge Rating (CR): "75　Health (HP): 1224　Attack Bonus (ATK): +19　Evasion (EVA): 21　Damage Reduction (DR): 35% All types　Movement: 7 tiles　Initiative Bonus: +7　Critical Threshold (CritTh): 19　Experience (EXP): 27,000 (Boss ×4)'
  - '- Attack: Eclipse Devour Untyped 4d12+19'
  - '- Skill: Rule Nullification (ignores multiple native Damage Reduction (DR)) / Reality Warp (splits positioning map) / Eclipse Domain (field-wide DoT + cover disabled)'
  - '- Trait: Phase One "World Eclipse" weakens player status + summons Void Apostle; Phase Two (HP 50%) full Rule Nullification + Reality Warp; Phase Three (HP 25%) Rift Synergy recovers 9% HP each round, Beyond-the-World Resistance ×0.5.'
  - '- Drop: Eclipse Core (Mythic material), Sovereign Sigil'
  tables: []
- heading: Eschaton Prophet (Otherworld Boss · Final-boss Bodyguard · Scenario 11 pre-fight)
  text:
  - '- Challenge Rating (CR): "85　Health (HP): 1368　Attack Bonus (ATK): +22　Evasion (EVA): 22　Damage Reduction (DR): 35% All types　Movement: 8 tiles　Initiative Bonus: +7　Critical Threshold (CritTh): 18　Experience (EXP): 34,000 (Boss ×4)'
  - '- Attack: Eschaton Decree Untyped 5d12+22'
  - '- Skill: "Reality Warp (flips / splits positioning map) / Rule Nullification (ignores terrain cover and partial immunity) / Prophetic Judgment (AOE instakill threat countdown: 5-round countdown; if core not broken / judgment source not destroyed within 5 rounds, field-wide instakill (party wipe); during countdown the core / judgment source is exposed and can be attacked)'
  - '- Trait: Phase One "Prophecy" reads player intent; Phase Two (HP 50%) Prophetic Judgment countdown; Phase Three (HP 25%) Rift Synergy recovers 10% HP each round. Beyond-the-World Resistance ×0.5, Psychic Immunity. As the bodyguard of The Beyond · Singularity, the Singularity''s true form is revealed only after it falls.'
  - '- Drop: Prophecy Tablet (Mythic material), Eschaton Crown'
  tables: []
- heading: The Beyond · Singularity (Otherworld Endgame Entity · Scenario 11 final battle)
  text:
  - '- Challenge Rating (CR): "99　Health (HP): 1568　Attack Bonus (ATK): +25　Evasion (EVA): 24　Damage Reduction (DR): 40% All types　Movement: 9 tiles　Initiative Bonus: +8　Critical Threshold (CritTh): 18　Experience (EXP): 45,144 (Boss ×4)'
  - '- Attack: Singularity Collapse Untyped 6d12+25'
  - '- Skill: Reality Warp (continuously flips positioning map) / Rule Nullification (ignores most native defenses) / World Collapse (field-wide AOE law collapse)'
  - '- Trait: Phase One "Descent" warps the laws; Phase Two (HP 50%) World Collapse sustained AOE; Phase Three (HP 25%) Rift Synergy recovers 12% HP each round, must be fought swiftly. Beyond-the-World Resistance ×0.5, Psychic Immunity, All-attribute Resistance ×0.5.'
  - '- Drop: Singularity Core (Mythic material), Beyond-the-World Sigil'
  - '*Catalog total entries: 20 Common Monsters (CR1×5 / Challenge Rating (CR) 5×5 / Challenge Rating (CR) 10×5 / Challenge Rating (CR) 20×5) + Four Demon Generals 4 + Demon Queen 1 + The Betrayer 1 + Beyond-the-World Otherworld enemies 6 = 32 types.*'
  tables: []

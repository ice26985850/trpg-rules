        Fields Used: "Stat Bonus (StatBonus) / Durability Base (DurBonus) / Effect Tags (Tags). Mainly used in Smithing to craft accessories (ring / amulet / orb / earring / coin). StatBonus anchors: Common +1, Fine +2, Rare +3, Epic +4 (or Critical Threshold (CritTh) −2 and other specializations), Legendary +5 (or Health (HP) +30 / all-abnormality resist +). Charisma (CHA) / Luck (LUK) both have complete Stat Bonus tiers from Common → Legendary (see table below), on par with other accessory materials, no over-tuning."
      - >
        Note: Mana Crystal's "Mana Point (MP) +10" is a minor attached bonus in the accessory Stat Bonus (StatBonus) field, not the BuffType/BuffVal field, so it does not trigger the 05 §3.5(B) Cap-type Buff table (which only constrains dish buffs). Its main field Magic (MAG) +3 falls within the Rare range, legal.

title: "The Hero's Proof — Material Catalog"
sections:
  - heading: "The Hero's Proof — Material Catalog"
    text:
      - >
        **Material-attribute Driven**: This catalog does not enumerate finished goods; it only lists **Materials** and their **8 unified fields**; finished-product values are determined by material fields × item templates (see `圖鑑/物品圖鑑.md` §1～§2 and Player Book Chapter 4), combining freely by the player.
      - >
        **8 Unified Fields**: ① Damage Base (DmgBase) ② Damage Reduction Base (DRBase) ③ Stat Bonus (StatBonus) ④ Durability Base (DurBonus) ⑤ Effect Tags (Tags) ⑥ Level Requirement & Rarity tier (ReqLv/Rarity) ⑦ Heal Base (HealBase) ⑧ Buff Type & Value (BuffType/BuffVal). A blank "—" means the material does not use that field.
      - >
        **White-template Principle (brief)**: Town shops only sell basic (white-template) gear + low-tier healing/mana potions + basic food; mid-to-high-tier potions, bombs, scrolls, and buff dishes must be self-crafted via "gathering → crafting" or dropped from adventures, and are not stocked on shop shelves (see the general white-template principle at the top of `圖鑑/物品圖鑑.md`).
      - >
        **Numeric Constraints**: All field values must fall within the legal ranges of Section 3 "Rarity → Attribute Cap" in `DesignDoc/05_Manufacturing_System_Value_Framework.md`; finished-product Rarity = max(material Rarity), and finished-product Level Requirement (ReqLv) = max(material ReqLv).
      - >
        **Related Documents**: Examples of finished-product templates are in `圖鑑/物品圖鑑.md`; crafting/gathering rules are in Player Book Chapter 4 and the appendix of `圖鑑/材料圖鑑.md` (gathering life-skill design).
      - "---"
    tables:
      []
  - heading: "0. Material Classification Overview (mapped to gathering / crafting skills)"
    text:
      - >
        **Wild vs Cultivated Tags**: Anything obtained from "Herbalism / Fishing & Hunting" wilderness nodes is tagged "Wild"; anything obtained from "Farming" stronghold facilities is tagged "Cultivated". The two have identical values; only the source and acquisition time differ (cultivated takes 3–14 days to harvest).
      - "---"
    tables:
      - columns:
          - Section
          - Material Category
          - Main Fields Used
          - Crafting Skill Served (Stronghold Facility)
          - Corresponding Gathering Source
        rows:
          - Section: §1
            Material Category: Wood
            Primary Fields Used: Damage Base / Durability Base
            Crafting Skill (Base Facility): Smithing (Forge)
            Corresponding Gathering Source: Logging
          - Section: §2
            Material Category: "Ore & Metal (Raw Ore → Metal Ingot)"
            Primary Fields Used: Damage Base / Damage Reduction Base / Durability Base
            Crafting Skill (Base Facility): "Smithing (Forge · Smelting)"
            Corresponding Gathering Source: Mining
          - Section: §3
            Material Category: "Herbs / Reagents"
            Primary Fields Used: Heal Base / Damage Base (fuse) / Effect Tags
            Crafting Skill (Base Facility): Alchemy (Lab)
            Corresponding Gathering Source: Herbalism / Farming
          - Section: §4
            Material Category: Ingredients
            Primary Fields Used: Buff Type / Buff Value
            Crafting Skill (Base Facility): Cooking (Kitchen)
            Corresponding Gathering Source: Fishing & Hunting / Farming
          - Section: §5
            Material Category: Accessory Materials
            Primary Fields Used: Stat Bonus / Durability Base / Effect Tags
            Crafting Skill (Base Facility): Smithing (Forge)
            Corresponding Gathering Source: Mining / Fishing & Hunting
          - Section: §6
            Material Category: "Other / Hunt & Misc"
            Primary Fields Used: Damage Reduction Base / Buff Type
            Crafting Skill (Base Facility): "Smithing / Cooking"
            Corresponding Gathering Source: Fishing & Hunting
  - heading: "§1 Wood"
    text:
      - >
        Fields Used: "Damage Base (DmgBase) / Durability Base (DurBonus). Mainly used in Smithing to craft weapons (longsword / bow / staff wooden grips, etc.) and light armor frames. Rarity anchors: Common 1d2~1d8, Fine 1d8~1d10, Rare 1d10~1d12, Epic 1d12~2d6, Legendary 2d6~3d8."
      - >
        Verification: Common Wood `1d2` < Ironwood `1d5`; Dragonblood Wood `2d6` reaches the top of the Epic DmgBase range (1d12~2d6), not over-tuned.
      - "---"

  - heading: "III. Life-Skill Products and Material Tables"
    text:
      - >
        Source: Gathering skills (Mining / Logging / Herbalism / Fishing & Hunting / Farming) produce raw materials; crafting skills (Alchemy / Cooking / Smithing) take raw materials × Item Template to produce finished goods. Life Skills do not consume Skill Points (SP).
      - >
        **The complete material list is maintained as a separate volume**: all materials and their 8 unified fields (Damage Base (DmgBase) / DR Base (DRBase) / Stat Bonus (StatBonus) / Durability Base (DurBonus) / Special-effect Tags (Tags) / Level Requirement & Rarity files (ReqLv / Rarity) / Heal Base (HealBase) / Buff Type & Value (BuffType / BuffVal)) are detailed in **`圖鑑/材料圖鑑.md`**. This section retains only each crafting skill's description and a few finished-product examples, to avoid duplicate maintenance. A blank "—" indicates the material does not use that field.
    tables:
      []
  - heading: "3-1 Gathering (Raw Material Sources) — see `材料圖鑑.md`"
    text:
      - The former "Farming" has been split into **Farming (Stronghold)** + **four field-gathering skills (Mining / Logging / Herbalism / Fishing & Hunting)**. For the raw material categories produced by each gathering skill and their corresponding materials, see `材料圖鑑.md` §1 Wood / §2 Ore & Metal / §3 Herbs / §4 Food Ingredients / §5 Accessory Materials / §6 Hunt Materials. Gathering DCs and node distribution are in Player Book Chapter 4.
    tables:
      []
  - heading: "3-2 Alchemy — Herbs → Potions / Bombs / Scrolls (Facility: Laboratory)"
    text:
      - >
        Uses the herb's `HealBase` / `DmgBase` / `Tags` to generate finished products (see Item Templates Potion / Bomb / Scroll). Beginner Healing / Mana Potions can be bought in shops; the rest are self-crafted / dropped.
    tables:
      []
  - heading: "3-3 Cooking — Ingredients → Dishes (Facility: Kitchen)"
    text:
      - >
        **Basic Food (sold at Basic Shops, for Health (HP) recovery)**: Basic food is not listed under the self-crafted dish column, but sold directly by town Basic Shops (see the Basic Shop General Principle at top). Named examples below:
      - >
        - **Holy Light Wheat Bread**: Type Basic Food; Rarity Common; Recommended Level 1; Effect Restores Health (HP) 1d6 +2, and grants temporary Health (HP) max +5 (Buff Level 1, lasts for combat); Shop Sale Price **20 Gold (G)** (White-board Price = Base Price floor(20×1^1.3)=20 × (1+0.15×0)=20G, aligned with the "basic food priced by white-board price" dish pricing formula). Does not occupy the dish slot; can be carried and used in combat.
      - >
        All dishes are uniformly "self-crafted (kitchen)", not sold in shops (except basic food).
      - >
        If self-crafted dishes are traded between players or bought by NPCs, sale price = main ingredient base price × (1 + 0.4 × buff level) (buff level 1~3); basic food is instead priced by white-board price (Audit Item 41).

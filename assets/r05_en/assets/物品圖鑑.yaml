  - heading: "1-0 White-board Baseline (Common ×1 / No Material Requirement)"
    text:
      - >
        Per Audit Item ④ "White-board Equipment Gap", supplemented: town Basic Shops supply "strictly one-tier-lower" basic gear by ReqLv (Common rarity ×1, no material requirement, durability matches the corresponding slot). Weapon damage dice / armor Damage Reduction (DR) percentages are all "one tier lower" than the same-name premium gear, price = White-board Price formula (Common ×1).
      - >
        Note: White-board armor DR uses percentages (DR%), consistent with the combat Damage Reduction system and bounded by the total DR Cap of 60%; the original instruction "DR 1d8 / 1d10 / 1d12 / 2d8" is presented as "strictly one-tier-lower" percentages (e.g., at ReqLv30 white-board is 40%, lower than Guardian Plate's 45%).

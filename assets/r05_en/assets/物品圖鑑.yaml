  - heading: "II. Consumable"
    text:
      - >
        Price formula: Base Price × (1 + 0.10 × (Recommended Level − 1)).
      - >
        The "Acquisition" column indicates: Shop-sold (white-board basic) / Self-crafted (Alchemy) / Drop. The "Price" in the table is the **Crafting Cost Baseline** (not the shop sale price).
      - >
        High-tier consumable prices follow the White-board Price formula × Rarity Multiplier (Audit Item ⑥): ReqLv20 Epic ×20 = White-board Price 3,781 ×20 = 75,620G; ReqLv30 Legendary ×35 = White-board Price 8,902 ×35 = 311,570G.
      - >
        Bombs / scrolls and mid/high-tier potions are **not stocked on shop shelves** (see the Basic Shop General Principle at top), and can only be Alchemy-crafted or dropped by monsters; and they are **for personal use or delivery of commissions/quests only, and may not be resold to shops or specialty merchants for cash** (cutting the gathering → Alchemy farm loop; see GM Book §4.4).
      - ---

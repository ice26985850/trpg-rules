  - heading: "Item Templates and Material → Finished Product Conversion Formulas (Audit Gap Filled)"
    text:
      - >
        Players freely combine "materials (8 unified fields) × item templates" to produce finished goods. This catalog does not exhaustively list finished products, only defining how each template maps material fields to finished-product values. There are six template types:
      - >
        General rule: unused fields are left blank with "—"; `ReqLv` determines the finished product's level requirement and base price (see top formula and Section IV quick reference), `Rarity` determines the rarity multiplier (Common ×1 / Fine ×3 / Rare ×8 / Epic ×20 / Legendary ×35). Finished white-board price = Base Price × (1 + 0.15 × (ReqLv − 1)) × Rarity Multiplier.
    tables:
      - columns:
          - Item Template
          - Material 8 Fields → Finished Product Value Mapping
        rows:
          - Item Template: Weapon (Weapon)
            Material 8 Fields → Finished Product Value Mapping: "`DmgBase` accumulates into base weapon damage (damage die); `DRBase` converts to Damage Reduction (Sunder / Block); `StatBonus` converts to attribute bonus (STR/DEX/MAG or accuracy); `DurBonus` converts to Durability (Weapon 40 / Heavy 60); `Tags` convert to special effects (Elemental / Critical, etc.); `ReqLv/Rarity` determines level requirement and price multiplier."
          - Item Template: Armor (Armor)
            Material 8 Fields → Finished Product Value Mapping: "`DRBase` converts to Damage Reduction (Physical reduction %); `StatBonus` converts to attribute bonus (MAG+1, CON≥12, etc.); `DurBonus` converts to Durability (Armor 50 / Heavy Armor 80); `Tags` convert to resistances / special (Fire resist, reduced critical damage taken); `ReqLv/Rarity` determines requirement and multiplier."
          - Item Template: Accessory (Accessory)
            Material 8 Fields → Finished Product Value Mapping: "`StatBonus` converts to attribute bonus (STR/DEX/MAG/LUK/HP/MP/CritTh/EVA, etc.); `DurBonus` converts to Durability (60); `BuffType/BuffVal` converts to passive buff (Critical damage +%, drop rate +%); `Tags` convert to resistances; `ReqLv/Rarity` determines requirement and multiplier."
          - Item Template: Potion (Potion)
            Material 8 Fields → Finished Product Value Mapping: "`HealBase` → healing amount (restores HP/MP die); `DmgBase` → damage (offensive potion); `Tags` → added status (Burn / Purify); `BuffType/BuffVal` → temporary buff; `ReqLv/Rarity` determines level and base price."
          - Item Template: Bomb (Bomb)
            Material 8 Fields → Finished Product Value Mapping: "`DmgBase` → area damage die (AOE radius 1); `Tags` → element and added status (Fire / Frost + Chill); `ReqLv/Rarity` determines level and base price; `DurBonus` not applicable (consumables have no durability)."
          - Item Template: Scroll (Scroll)
            Material 8 Fields → Finished Product Value Mapping: "`DmgBase`/`Tags` determine area and status (AOE radius, EVA−%, Blind / Burn, etc.); `HealBase` converts to purify / cleanse effect; `ReqLv/Rarity` determines level and base price; `DurBonus` not applicable."
  - heading: "3-5 Accessory Materials (for Smithing) — see `材料圖鑑.md` §5"

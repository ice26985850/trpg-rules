  - heading: VIII. Skill Level Growth Table (all classes) 
    text:
      - > note: "Active Skillmax level (Lv5) cumulativecost **14 SP** (formula `C(n)=4+n(n−1)/2`) ; Passive Skillmax level (Lv3) cumulative **7 SP**; Utility Skillfixed 1 level, cost **2 SP**。SP totalamountbased onBi-Dice-An 1.6: character creation 8 SP, CL2 fromper level +1 → `cumulative SP = 7 + CL`, Lv40 approx. 47 SP; players mustoffense/support/Passive choose between, cannot max all。"
      - >  (original draftpreviously miswritten `C(n)=4+n(n−1)`, that formulacumulativeis 4/6/10/16/24 (max level 24 SP) , andabovevalue tablecontradicts; based onthis instruction"max level 14 SP, remove 24 erroneous statement"and aud-dice unifiedformulacorrectedis `C(n)=4+n(n−1)/2`, yields 4/5/7/10/14。) 

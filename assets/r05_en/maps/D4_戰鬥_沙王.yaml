scenario: D4
section: "D4 Desert·Sand King Altar (CR12)"
map_type: battle
grid_scale: "1 cell = 2 m"
title: D4_Battle_Sand King
# Coordinates are exact grid coordinates (col, row, 0–9) for distance and range calculations
# Front and back rows are 2 cells apart (4m); enemy is above, our side is below

battle:
  cols: 10
  rows: 10
  lines:
    - {row: 3, side: enemy, role: front, color: "#FF8A8A"}

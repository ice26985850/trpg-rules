name: Dungeon Module D8 — Ancient Ruins
description: 'Recommended Rank: A/S (Challenge Rating (CR) 35–40) | Theme: Lost civilization ruins, top-tier resource farming. Access: Guild commission A-Ruin1 / S-Ruin1 (corresponding to Rank A→S, CL 35–40); or designated by the GM as a leveling ground. Map: `maps/D8_古代遺跡.yaml` + `maps/D8_古代遺跡.svg`. This work has no multiclass; solo entry follows the player-count adjustment rules (GM Book 13.1: Challenge Rating (CR) −3, enemy count ×0.5, no allies). Exploration round rules, traps (17.4), chests (17.5), rest (17.6), retreat (17.3) are detailed in GM Book Chapter 17. On the positioning map, enemies are at top, allies at bottom, with front and back rows spaced 2 squares (4m) apart; solo entry adjusts per GM Book 13.1 (Challenge Rating (CR) −3, enemy count ×0.5, no allies). Design Note: D8 is the top-tier stable ground for CL 35–40 "farming EXP + G + materials," directly leading into the Demon General battles (CL40+); refreshable daily (see Commission Catalog, reset rules).'

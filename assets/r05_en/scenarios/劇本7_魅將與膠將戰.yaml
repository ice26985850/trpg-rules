      - {name: True Form Revealed, hp_threshold: "33%", trait: Inner Demon Split trust crisis}
    budget: Boss Battle Boss CR≈party total level×0.6
    adjust: "1p→CR41/no sidekick; 5–6p→CR46"
rewards:

  - id: twin_patrol
    name: Twin-route Scouting
    enemies:
      - {name: Charm Imp, cr: 20, count: 3}
      - {name: Slimelet, cr: 18, count: 4}
    budget: Extreme×1.2
    adjust: "1p→CR−3/enemy×0.5(min1)/no sidekick; 2p→CR−1/enemy×0.75; 3p→baseline; 4p→baseline; 5–6p→CR+2/enemy×1.5/concurrent+1"
  - id: gel_general_boss
    name: Gel General Plum·Gel (three phases)
    enemies:
      - {name: Plum·Gel, cr: 46, count: 1}

name: "Scenario 7: Charm General & Gel General Battle"
description: Head south to Enchanting Hot Spring Village to subjugate Charm General Lilith·Meiying (CR44), cross east to Gel Archipelago to subjugate Gel General Plum·Gel (CR46), a two-route operation. CL44 threshold, late-stage elite. Dual bosses, three phases.
difficulty: Extreme
level_range: [44, 46]
chapter: 7
map_ref: maps/劇本7_戰鬥_雙將.yaml
initial_map: maps/劇本7_探索_魅魔宮.yaml

name: "Scenario 6: Necromancer General Battle"
description: "Head west to Silent Burial Wetlands to subjugate Necromancer General Mourvana Silentgrave, exposing the church's dark secrets and foreshadowing the Fifth's lineage. CL42 threshold, late-phase elite. Three-phase Boss battle (Summon / Corpse Tide / Lich-form), key is breaking the Life-preserving Coffin to lift immunity."
difficulty: Hard~Extreme
level_range: [42, 44]
chapter: 6
map_ref: maps/劇本6_戰鬥_死靈將.yaml
encounters:

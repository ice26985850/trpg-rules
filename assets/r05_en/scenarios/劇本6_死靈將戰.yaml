    name: Wetland Patrol
    enemies:
      - {name: Zombie, cr: 13, count: 3}
      - {name: Skeleton Warrior, cr: 14, count: 2}
      - {name: Ghost, cr: 16, count: 2}
    budget: Hard×1.5
    adjust: "1 PC→CR−3/enemy count×0.5(at least 1)/no assist; 2 PCs→CR−1/enemy count×0.75; 3 PCs→baseline; 4 PCs→baseline; 5–6 PCs→CR+2/enemy count×1.5/concurrent events+1"
  - id: necro_general_boss
    name: Necromancer General Mourvana Silentgrave (Three Phases)
    enemies:
      - {name: Mourvana Silentgrave, cr: 42, count: 1}
      - {name: Life-preserving Coffin (Invincible Core), cr: 0, count: 1}
    boss: true
    phases:
      - {name: Summon, hp_threshold: "100%~66%", trait: Undead Summon replenishes minions}
      - {name: Corpse Tide, hp_threshold: "66%", trait: Life Siphon / Death Domain DoT}
      - {name: Lich-form, hp_threshold: "33%", trait: Critical Hit Immunity (lifted by breaking coffin) / Final Dirge countdown}
    budget: Boss Battle CR≈party total level×0.6
    adjust: "1 PC→CR39/no assist; 5–6 PCs→CR44"
rewards:

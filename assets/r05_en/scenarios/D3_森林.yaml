name: Dungeon Module D3 — Forest
description: "Recommended Rank: F / E (Challenge Rating (CR) 1–6) | Theme: Verdant dense forest, low-mid tier resource grinding. Accept: Guild commission 'F-For1 / E-For1' (corresponds Rank F→E, CL 1–6); or designated by GM as leveling field. Map: `maps/D3_森林.yaml` + `maps/D3_森林.svg`. This work has no multiclass; solo entry follows party-size adjustment rules (GM Book 13.1: Challenge Rating (CR) −3, enemy count ×0.5, no assist). Exploration-round rules, traps (17.4), chests (17.5), rest (17.6), retreat (17.3) see GM Book Chapter 17. Positioning diagram: enemies on top, allies on bottom, front/back row spacing 2 squares (4m); solo entry adjusted per GM Book 13.1 (Challenge Rating (CR) −3, enemy count ×0.5, no assist). Design hint: D3 is a stable CL 1–6 area for 'grinding EXP+G+materials,' preventing players from leveling only through main-story Demon General battles and causing economic imbalance. Can be re-cleared daily (see 'Commission Catalog' opening, reset rules)."

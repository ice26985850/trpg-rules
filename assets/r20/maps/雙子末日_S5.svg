<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" font-family="Microsoft JhengHei, sans-serif">
  <defs>
    <filter id="shadow"><feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/></filter>
    <filter id="pulse"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A0606"/><stop offset="50%" stop-color="#0D0A0A"/><stop offset="100%" stop-color="#06060A"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="650" fill="url(#bgGrad)"/>

  <!-- 標題 -->
  <text x="500" y="25" text-anchor="middle" fill="#FFCC88" font-size="18" font-weight="bold">雙子末日（雙子末日）——S5 最後的代價</text>
  <text x="500" y="44" text-anchor="middle" fill="#665544" font-size="11">無情號（同盟旗艦）+ 虛無號（AI 附屬艦）｜ 27 節點 ｜ 8 層甲板 ｜ 自毀倒數 15 回合</text>

  <!-- 母艦撤離提示 -->
  <rect x="250" y="55" width="500" height="22" rx="4" fill="#662222" opacity="0.8" stroke="#FF4444" stroke-width="1"/>
  <text x="500" y="71" text-anchor="middle" fill="#FF8888" font-size="11">⚠ 第 8 回合：仲裁者號重創撤離——母艦支援全部失效！必須搶奪敵方逃生艙！</text>


  <!-- L3→L4 -->
  <line x1="230" y1="335" x2="230" y2="400" stroke="#BB9944" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="245" y="370" fill="#BB9944" font-size="8">樓梯</text>
  <!-- L4 -->
  <line x1="230" y1="400" x2="350" y2="400" stroke="#8899AA" stroke-width="2"/>
  <!-- L4→L5 -->
  <line x1="230" y1="400" x2="230" y2="470" stroke="#BB9944" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="245" y="438" fill="#BB9944" font-size="8">樓梯</text>

# 星艦突擊登艦隊——劇本 S4：叛逃者（叛逃者）
scenario_id: S4_叛逃者
title: "叛逃者（叛逃者）——暴君之拳號"
subtitle: "一個敵方高階軍官想叛逃——但條件是你們必須先登上他的船把他活著帶出來。"
difficulty: 困難
recommended_level: "4–7"
player_count: { min: 1, max: 6 }
estimated_duration: "4–6 小時"

mission_type: 斬首行動（斬首行動）+ 俘虜救援（俘虜救援）混合
enemy_vessel:
  name: "暴君之拳號（暴君之拳號）"
  type: 同盟指揮艦（同盟指揮艦）
  faction: 自由星系同盟（自由星系同盟，FSA）
  size: 大型（長度 600 公尺）
  decks: 4
  gravity: 標準重力（1G）——但叛逃者可能遠端操縱重力系統協助玩家
  self_destruct: true  # 倒數 10 回合

story_summary: >
  同盟高階軍官維克多·凱恩上校（維克多·凱恩上校）通過加密頻道聯絡協約——他願意叛逃，
  提供同盟在該星區的完整防禦部署。但他有一個條件：
  你們必須登艦將他活著帶出來。他的忠誠衛隊已經懷疑他，正在艦內追殺他。
  時間緊迫——凱恩上校正在被圍捕，而同盟指揮部一旦確認他的叛逃，將立即啟動自毀程序。

turning_points:
  - id: TP1
    name: "找到凱恩"
    description: "凱恩上校的最後通訊來自艦橋附近的逃生艙區。玩家需要穿越忠誠衛隊的封鎖線找到他。凱恩的狀態隨機：1d6 = 1-2 輕傷、3-4 正在交戰（1 名陸戰隊員追殺他）、5-6 已被捕獲（正在被押送至艦橋）。"
  - id: TP2
    name: "道德抉擇：數據庫"
    description: "在撤離途中，凱恩指出同盟的完整戰術資料庫就在旁邊的房間。下載需要 3 回合——但忠誠衛隊正在逼近。下載數據？還是放棄數據以確保凱恩安全？"
  - id: TP3
    name: "雙重背叛"
    description: "有 30% 機率（遊戲主持人（GM）暗擲）——凱恩的叛逃是陷阱。他實際上是同盟情報部的誘餌，身上帶著追蹤器。當玩家帶著他抵達撤離點時，一艘同盟隱形突擊艦現身攔截。"

key_encounters:
  - id: E1
    location: 艦橋前封鎖線
    enemies:
      - type: 陸戰隊員
        count: 3
        cr: 3
      - type: 指揮官（首領——凱恩的副手）
        count: 1
        cr: 4
    total_el: 13
    notes: "副手指揮官會喊話——要求玩家交出凱恩。可進行戰術指揮（戰術指揮）對抗（DC 18）以動搖守軍士氣。"

  - id: E2
    location: 逃生艙區
    enemies:
      - type: 陸戰隊員
        count: 2
        cr: 3
    total_el: 6
    notes: "正在追殺凱恩的忠誠衛隊。凱恩可能已經受傷。"

  - id: E3
    location: 撤離點——機庫
    enemies:
      - type: 防禦機器人
        count: 2
        cr: 4
    total_el: 8
    notes: "若陷阱觸發——額外出現 3 名陸戰隊員從隱形突擊艦登艦。"

npc_asset:
  name: "維克多·凱恩上校（維克多·凱恩上校）"
  hp: 12
  armor: 4
  weapons: "手槍（1d6）"
  abilities:
    - "戰術情報：凱恩可以透露下一層甲板的敵方部署（類似偵察兵的戰術偵察，但不需要檢定）"
    - "重力操控（限本次任務）：凱恩仍擁有暴君之拳號的部分系統權限——每任務 2 次，他可遠端操控一個區域的重力"
  escort_rules: "護送 NPC：凱恩每回合可移動 6 格。若他陷入重傷——一名玩家必須拖行他（消耗 3 AP，移動 3 格）。"

moral_choices:
  - id: MC1
    situation: "到達數據庫房間——下載戰術資料（3 回合）vs 放棄資料以確保安全撤離"
    choice_a: "下載數據（完成次要目標）"
    consequence_a: "XP +2、聲望 +2。但自毀倒數 −1d4 回合（因為耽誤了時間）。忠誠衛隊追擊到達——額外遭遇 EL 5。"
    choice_b: "放棄數據（安全優先）"
    consequence_b: "無法獲得數據獎勵——但撤離路線保持暢通。凱恩對玩家的專業判斷表示敬意（隱藏關係加成）。"

  - id: MC2
    situation: "凱恩指出一條近路——但這是他的建議。他可能是誠心幫忙，也可能在設陷阱。"
    choice_a: "走凱恩建議的近路"
    consequence_a: "50% 機率是快速路線（推進加速 2 回合）。50% 機率遭遇埋伏（EL 8）。"

rewards:
  xp_primary: 14         # 主要目標
  xp_secondary: 8        # 次要目標合計：2 個 ×+4
  xp_full_survival: 3    # 全員生還
  xp_gm_bonus: 6         # GM 通用包
  reputation: 3
  bonus_reputation:
    - condition: 凱恩生還且數據下載
      reputation: 2
  special_loot:
    - name: "同盟高階軍官權杖（凱恩的權杖）"
      description: "一把裝飾性的指揮權杖，實際上是加密數據儲存器。"
      effect: "破解同盟系統的 DC 永久 −2。這是叛逃者的謝禮。"

special_rules:
  - rule: "追殺等級"
    description: "遊戲主持人（GM）暗中追蹤「追殺等級」（1–5）。每當凱恩被敵方目擊、玩家觸發警報、或時間流逝，追殺等級 +1；每推進一個階段 +1（+1 per 推進階段）。等級 5 → 指揮官親自率領菁英衛隊追擊（EL 10+）。"
  - rule: "凱恩的忠誠搖擺"
    description: "遊戲主持人（GM）可暗中為凱恩設定「忠誠度」（1–10）。玩家的對待方式會影響此值——威脅他（−1d4）、保護他（+1d4）、尊重他（+2）。低於 3 → 凱恩可能在關鍵時刻背叛。高於 7 → 凱恩主動提供有價值的額外情報。"

self_destruct:
  initial: 10
  note: "若凱恩的叛逃被確認（指揮官目擊到他與玩家在一起），自毀立即啟動。"

map_file: "../maps/暴君之拳號_S4.yaml"

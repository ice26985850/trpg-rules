# 星艦突擊登艦隊——劇本 S5：最後的代價（最後的代價）
scenario_id: S5_最後的代價
title: "最後的代價（最後的代價）——雙子末日"
subtitle: "母艦重創、無法等你。敵艦的自毀倒數已經開始。目標還沒完成。你必須決定。"
difficulty: 傳奇
recommended_level: "5–8"   # 建議起點 7
player_count: { min: 1, max: 6 }
estimated_duration: "5–8 小時"

mission_type: 全面癱瘓（全面癱瘓）
enemy_vessel:
  name: "雙子末日（雙子末日）——旗艦「無情號」+ AI 附屬艦「虛無號」"
  type: 同盟戰艦（同盟戰艦）+ AI 無人艦（AI 無人艦）
  faction: 自由星系同盟（FSA）+ 殘遺（殘遺）
  size: 超巨型（旗艦 1,500 公尺 + 附屬艦 600 公尺，兩艦靠泊連接）
  decks: 8（旗艦 6 層 + 附屬艦 2 層）
  gravity: 旗艦：標準重力（1G）+ 部分區域可變重力。AI 艦：零重力（0G）
  self_destruct: true  # 旗艦自毀倒數 15 回合。AI 艦無自毀但會自我複製防禦系統。

story_summary: >
  這是裂隙戰爭的轉折點。協約聯合艦隊（CUF）決定對同盟旗艦「無情號」發動總攻。
  無情號是同盟在該星區的指揮中樞——它的毀滅將徹底瓦解同盟的防線。
  但情報忽略了關鍵細節：無情號與一艘殘遺（殘遺）AI 無人艦「虛無號」靠泊連接。
  同盟在絕望中與 AI 殘遺達成了某種協議——虛無號提供技術支援，換取同盟不攻擊殘遺艦隊。

  仲裁者號（仲裁者號）的登艦突擊隊被賦予不可能的任務：
  同時癱瘓無情號的指揮系統（艦橋）和虛無號的 AI 核心（中央處理節點）。
  兩者必須在 15 回合內完成——因為同盟指揮官在意識到旗艦必失後，毫不猶豫地啟動了自毀。

  更糟的是，在任務進行到一半時，仲裁者號傳來了最後通訊：
  「仲裁者號遭受重創。我們撐不住了。你們有 15 分鐘。之後我們必須撤離。仲裁者號通訊完畢。」

turning_points:
  - id: TP1
    name: "不可逆的抉擇"
    description: "兩艦靠泊連接處只有一條通道。玩家必須決定：先攻擊無情號（人類防禦）還是虛無號（AI 防禦）？剩餘時間夠不夠同時完成兩個目標？"
    options:
      - choice: 先攻無情號（人類路線）
        consequence: "面對人類守軍的頑強抵抗——但指揮系統的癱瘓會使 AI 艦的敵方失去協調。"
      - choice: 先攻虛無號（AI 路線）
        consequence: "面對動態重組的走廊和自我複製的防禦系統——但癱瘓 AI 核心會使無情號的電子系統全部失效。"
      - choice: 分兵——一半人攻無情號、一半人攻虛無號
        consequence: "效率最高，但任何一邊都極度危險。需要完美的團隊配合。"

  - id: TP2
    name: "仲裁者號的訣別"
    description: "倒數第 8 回合——仲裁者號發出最後通訊，宣佈撤離。玩家與母艦的聯繫中斷。只剩下一條路：完成任務後搶奪敵方逃生艙。"
    effect: "母艦支援全部失效。撤離 DC +3。"

  - id: TP3
    name: "最終抉擇——任務 vs 生存"
    description: "倒數第 3 回合——只剩一個目標未完成。繼續？還是現在撤離？如果繼續——幾乎確定會死在艦上。如果撤離——任務失敗，同盟旗艦存活，戰爭繼續。"
    options:
      - choice: "繼續——完成任務（死路一條但任務成功）"
        consequence: "需要連續通過 3 個 DC 18+ 的檢定。成功 → 任務完成，但倒數歸零。進行絕望撤離（RES DC 20）——成功則奇蹟生還。失敗則死亡——但角色成為傳奇。"
      - choice: "撤離——活著回去（任務失敗）"
        consequence: "全員存活。但同盟旗艦繼續存在。遊戲主持人（GM）：此選擇將影響後續戰役——同盟防線未瓦解，下一場戰爭更加艱難。"

key_encounters:
  - id: E1
    location: 無情號艦橋前——指揮甲板
    enemies:
      - type: 陸戰隊員
        count: 4
        cr: 3
      - type: 指揮官（首領——同盟旗艦艦長）
        count: 1
        cr: 6
    total_el: 18
    notes: "艦長是最終首領。HP 40，DEF 18。擁有戰術指揮能力——可命令陸戰隊員協同攻擊。擊敗艦長後，無情號指揮系統癱瘓。"

  - id: E2
    location: 虛無號 AI 核心
    enemies:
      - type: 防禦機器人
        count: 3
        cr: 4
      - type: 封鎖砲台矩陣（首領）
        count: 1
        cr: 6
    total_el: 18
    notes: "AI 核心室是零重力。牆壁每 2 回合重組——改變掩體位置。破解中央 AI（ENG DC 22）以癱瘓。"

  - id: E3
    location: 撤離——奪取逃生艙
    challenge: "找到可用的逃生艙（感知（PER）DC 15）。每個逃生艙只能容納 2 人。如果超過 2 名隊員——需要找到第二個逃生艙。"
    environment: "逃生艙區已被部分破壞——真空暴露。需要裝甲完整度（ARMR）維持生存。"

rewards:
  xp_primary: 16         # 主要目標
  xp_secondary: 14       # 次要目標合計：3 個合計 +14
  xp_full_survival: 3    # 全員生還
  xp_gm_bonus: 8         # GM 通用包（終章）
  reputation: 5
  bonus_reputation:
    - condition: 在仲裁者號撤離後仍完成任務
      reputation: 3
  special_loot:
    - name: "同盟旗艦艦長的指揮刀"
      description: "一把儀式性的指揮刀，象徵著同盟旗艦的隕落。"
      effect: "在任何人類艦艇上——敵方士氣 −2（雜兵級敵方可能直接投降）。"
    - name: "殘遺 AI 核心碎片"
      description: "一個被封存的 AI 意識片段——已失去敵意但保留了對所有殘遺艦艇的深層知識。"
      effect: "對殘遺（AI）艦艇的破解 DC 永久 −3（與系統主宰不疊加）。工程師的系統主宰終極專長對殘遺艦艇效果加倍。"

endings:
  - id: ENDING_A
    name: "傳奇隕落（傳奇隕落）"
    condition: "完成任務但在爆炸中犧牲"
    description: "你們的名字被刻在仲裁者號的紀念碑上。三個月後，同盟防線因旗艦的毀滅而崩潰。裂隙戰爭迎來了轉折點——而你們是代價。"
    legacy: "下一批登艦突擊隊（如果玩家創建新角色）獲得一個免費專長——「傳承者（傳承者）」：在所有人類艦艇上先攻（INIT）+2。"

  - id: ENDING_B
    name: "奇蹟生還（奇蹟生還）"
    condition: "完成任務且絕望撤離成功"
    description: "你們在爆炸的光芒中衝出逃生艙。無情號和虛無號在你們身後化為碎片。通訊恢復——仲裁者號回來了。艦長莫羅上校說：『我就知道你們會找到辦法。』"
    legacy: "所有隊員獲得傳奇聲望。對同盟艦艇的任務中——全隊士氣永久優勢。"

  - id: ENDING_C
    name: "生存者（生存者）"
    condition: "撤離但任務失敗"
    description: "你們活著回來了。但同盟旗艦仍在。戰爭繼續。每天晚上你都在想——如果當時再多堅持三回合，結局會不會不一樣。"
    legacy: "後續戰役中——同盟的防禦更強。但玩家獲得一個新的個人目標：「下一次，我們不會撤離。」"

self_destruct:
  initial: 15
  note: "自毀無法被完全解除（DC 30）。只能延遲。工程師在此任務中每回合都可能需要進行破解以爭取時間。"

special_rules:
  - rule: "雙艦並存"
    description: "無情號和虛無號是兩個獨立的地圖。靠泊連接處是唯一的通道。玩家可在兩艦之間移動——但每次穿越連接處可能遭遇巡邏。"
  - rule: "母艦撤離"
    description: "第 8 回合——仲裁者號通訊中斷。從此時起：無法使用母艦支援、撤離 DC +3、必須搶奪敵方逃生艙。遊戲主持人（GM）應在此時營造最強烈的絕望感。"
  - rule: "10 級專屬挑戰"
    description: "如果小隊中有虛空破門者（10 級角色）——他們的「拒絕死亡」能力在此任務中至關重要。建議遊戲主持人（GM）在關鍵時刻讓此能力成為劇情焦點。"

map_files:
  - "../maps/無情號_S5.yaml"
  - "../maps/虛無號_S5.yaml"

r</text><circle cx="433.0" cy="181.0" r="11" fill="#b23a3a" stroke="#fff" stroke-width="1.5"/><text x="433.0" y="185.0" font-size="9.5" text-anchor="middle" fill="#fff" font-weight="bold">Poison Master</text><circle cx="475.0" cy="223.0" r="11" fill="#caa53a" stroke="#fff" stroke-width="1.5"/><text x="475.0" y="227.0" font-size="9.5" text-anchor="middle" fill="#fff" font-weight="bold">Evidence Cart</text><line x1="34" y1="338" x2="538" y2="338" stroke="#cbb893" stroke-width="1"/><text x="34" y="350" font-size="11" font-weight="bold" fill="#2a241c">Tactical Hints / Distance Data:</text><text x="34" y="366" font-size="11.5" fill="#3a3228">Long narrow alley: the entire field is "narrow terrain", long weapons -3, suited to short weapons / hidden weapons.</text><text x="34" y="383" font-size="11.5" fill="#3a3228">Rooftop (top edge) is high ground; Wangchuan Tower's shadow — a third faction — sweeps across the roof to grab the letter.</text><text x="34" y="400" font-size="11.5" fill="#3a3228">The Poison Master holds Thunderclap Bombs (dies taking you with him) — prioritize the kill; the evidence cart (right) must be intercepted.</text><text x="34" y="417" font-size="11.5" fill="#3a3228">Tie Jingxin (ally) holds alone to pin them down; the PC may help the Six Doors or watch.</text><text x="34" y="434" font-size="11.5" fill="#3a3228">Distance: PC start at column A; enemy at mid F–I; Poison Master near the evidence cart (≈8 cells = far, hidden weapons / bow can reach).</text><text x="34" y="455" font-size="10" fill="#6b5d44">Movement: normal 1 cell / dash·lightfoot 2 cells (lightfoot +1 hit). Positioning: flank +2 hit / rear +4 hit (cannot block). Ganging up: 2 attackers +1 / 3 attackers +2 (max 5).</text></svg>
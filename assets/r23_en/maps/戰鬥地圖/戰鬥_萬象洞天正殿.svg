eated moves — rotate force types / technique types to break it.</text><text x="34" y="568" font-size="11.5" fill="#3a3228">Center = Ancient Martial Vein core (objective, not an attackable object).</text><text x="34" y="585" font-size="11.5" fill="#3a3228">Recommended: Swift→Heavy→Gentle→Long cycle, or break the sword form with "No-Form".</text><text x="34" y="602" font-size="11.5" fill="#3a3228">Distance: PC encircles center (E5) within 2–3 cells = one to three steps.</text><text x="34" y="623" font-size="10" fill="#6b5d44">Movement: normal 1 cell / dash·lightfoot 2 cells (lightfoot +1 hit). Positioning: flank +2 hit / rear +4 hit (cannot block). Ganging up: 2 attackers +1 / 3 attackers +2 (max 5).</text></svg>
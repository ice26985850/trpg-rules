ircle cx="391.0" cy="181.0" r="11" fill="#7a7a7a" stroke="#fff" stroke-width="1.5"/><text x="391.0" y="185.0" font-size="9.5" text-anchor="middle" fill="#fff" font-weight="bold">Chu Huaisha</text><line x1="34" y1="422" x2="454" y2="422" stroke="#cbb893" stroke-width="1"/><text x="34" y="434" font-size="11" font-weight="bold" fill="#2a241c">Tactical Hints / Distance Data:</text><text x="34" y="450" font-size="11.5" fill="#3a3228">Central green zone = vegetation (Nangong Hui self-heals 1d6 HP each round); burning the vegetation stops the healing.</text><text x="34" y="467" font-size="11.5" fill="#3a3228">Nangong Hui's 'Rotting-Bone Palm' poisons + 'Revival Art' self-heals; at dying he releases poison mist (poisoned within 3 steps).</text><text x="34" y="484" font-size="11.5" fill="#3a3228">Poison Sect / Medicine Sect handle detoxification; high Strength pins from the front to prevent escape.</text><text x="34" y="501" font-size="11.5" fill="#3a3228">Chu Huaisha (NPC) can provide info / assistance, not a main combatant.</text><text x="34" y="518" font-size="11.5" fill="#3a3228">Distance: PC left column; Boss centered (≈4 cells = engage within three steps).</text><text x="34" y="539" font-size="10" fill="#6b5d44">Movement: normal 1 cell / dash·lightfoot 2 cells (lightfoot +1 hit). Positioning: flank +2 hit / rear +4 hit (cannot block). Ganging up: 2 attackers +1 / 3 attackers +2 (max 5).</text></svg>
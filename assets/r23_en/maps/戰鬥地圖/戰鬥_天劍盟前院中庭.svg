Central Courtyard (right): Guardian Baigu (mental attack; low Constitution can be struck at melee) + Su Mei (hidden-weapon charm; low Strength gets entangled).</text><text x="34" y="568" font-size="11.5" fill="#3a3228">High Willpower PC vs Baigu; high Agility PC approaches Su Mei. Baigu's "Heart-Bewitching Art" raises the DC with each consecutive hit.</text><text x="34" y="585" font-size="11.5" fill="#3a3228">Destructible object = wall-breaching ram (destroy it to open a breach).</text><text x="34" y="602" font-size="11.5" fill="#3a3228">Distance: front courtyard, foes ~3–4 cells apart; central-courtyard guardians on the right (≈9 cells = far, must advance).</text><text x="34" y="623" font-size="10" fill="#6b5d44">Movement: normal 1 cell / dash·lightfoot 2 cells (lightfoot +1 hit). Positioning: flank +2 hit / rear +4 hit (cannot block). Ganging up: 2 attackers +1 / 3 attackers +2 (max 5).</text></svg>
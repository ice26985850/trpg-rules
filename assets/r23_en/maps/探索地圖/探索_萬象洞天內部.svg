<svg xmlns="http://www.w3.org/2000/svg" width="920" height="560" viewBox="0 0 920 560" font-family="'PingFang SC','Microsoft JhengHei','Heiti TC',sans-serif"><rect width="920" height="560" fill="#f4ecd8"/><text x="460.0" y="28" font-size="18" font-weight="bold" text-anchor="middle" fill="#2a241c">Chapter 4 · Wanxiang Grotto Interior (Four Trials → Martial Vein)</text><text x="460.0" y="46" font-size="11" text-anchor="middle" fill="#6b5d44">Exploration Schematic (routes / key points / threats) — no precise distances, for narrative navigation only</text><line x1="120" y1="300" x2="320" y2="300" stroke="#9c8a64" stroke-width="2" stroke-dasharray="6 4"/><text x="220.0" y="296.0" font-size="10" text-anchor="middle" fill="#6b5d44">Three Fragments / Formation-Breaking Spike</text><line x1="320" y1="300" x2="520" y2="140" stroke="#9c8a64" stroke-width="2" stroke-dasharray="6 4"/><text x="420.0" y="216.0" font-size="10" text-anchor="middle" fill="#6b5d44">Sword of the Heavenly Way</text><line x1="320" y1="300" x2="540" y2="260" stroke="#9c8a64" stroke-width="2" stroke-dasharray="6 4"/><text x="430.0" y="276.0" font-size="10" text-anchor="middle" fill="#6b5d44">Origin Return of Vital Energy</text><line x1="320" y1="300" x2="540" y2="380" stroke="#9c8a64" stroke-width="2" stroke-dasharray="6 4"/><text x="430.0" y="336.0" font-size="10" text-anchor="middle" fill="#6b5d44">Medicine and Poison Share the Same Source</text><line x1="320" y1="300" x2="540" y2="500" stroke="#9c8a64" stroke-width="2" stroke-dasharray="6 4"/><text x="430.0" y="396.0" font-size="10" text-anchor="middle" fill="#6b5d44">Facing One's True Heart</text><line x1="320" y1="300" x2="820" y2="300" stroke="#9c8a64" stroke-width="2" stroke-dasharray="6 4"/><text x="570.0" y="296.0" font-size="10" text-anchor="middle" fill="#6b5d44">Fifth Trial</text><circle cx="120" cy="300" r="9" fill="#2f8f4f" stroke="#fff" stroke-width="2"/><text x="120" y="324" font-size="12" text-anchor="middle" fill="#2a241c" font-weight="bold">Outer Entrance</text><circle cx="320" cy="300" r="9" fill="#3a6ea5" stroke="#fff" stroke-width="2"/><text x="320" y="324" font-size="12" text-anchor="middle" fill="#2a241c" font-weight="bold">Main Hall</text><circle cx="520" cy="140" r="9" fill="#caa53a" stroke="#fff" stroke-width="2"/><text x="520" y="164" font-size="12" text-anchor="middle" fill="#2a241c" font-weight="bold">Trial One · Pinnacle of the Sword</text><circle cx="540" cy="260" r="9" fill="#caa53a" stroke="#fff" stroke-width="2"/><text x="540" y="284" font-size="12" text-anchor="middle" fill="#2a241c" font-weight="bold">Trial Two · Source of Qi</text><circle cx="540" cy="380" r="9" fill="#caa53a" stroke="#fff" stroke-width="2"/><text x="540" y="404" font-size="12" text-anchor="middle" fill="#2a241c" font-weight="bold">Trial Three · Life and Death</text><circle cx="540" cy="500" r="9" fill="#caa53a" stroke="#fff" stroke-width="2"/><text x="540" y="524" font-size="12" text-anchor="middle" fill="#2a241c" font-weight="bold">Trial Four · Mirror of the Heart</text><circle cx="820" cy="300" r="9" fill="#7a1f1f" stroke="#fff" stroke-width="2"/><text x="820" y="324" font-size="12" text-anchor="middle" fill="#2a241c" font-weight="bold">Ancient Martial Vein (hidden)</text><line x1="20" y1="464" x2="900" y2="464" stroke="#cbb893" stroke-width="1"/><text x="20" y="478" font-size="11" font-weight="bold" fill="#2a241c">Exploration Hints:</text><text x="20" y="496" font-size="11.5" fill="#3a3228">Each of the Four Trials corresponds to a martial realm: Sword / Qi / Medicine-Poison / Heart; the party may divide them or one person may take two.</text><text x="20" y="512" font-size="11.5" fill="#3a3228">Trial One uses 'Mental Duel' for 3 rounds (HP40 sword-form opponent; mimic its first three moves).</text><text x="20" y="528" font-size="11.5" fill="#3a3228">Trial Four = inner-demon phantom (roleplay; fleeing triggers illusion backlash, -2 to all checks for 24h).</text><text x="20" y="544" font-size="11.5" fill="#3a3228">Pass the Four Trials → the Main Hall opens → the Ancient Martial Vein (attributes / techniques / self-created inspiration).</text></svg>
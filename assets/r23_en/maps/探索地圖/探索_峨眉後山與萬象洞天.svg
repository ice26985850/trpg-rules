oke="#fff" stroke-width="2"/><text x="420" y="224" font-size="12" text-anchor="middle" fill="#2a241c" font-weight="bold">Emei Back Mountain (blue-glow stone cave)</text><circle cx="640" cy="180" r="9" fill="#caa53a" stroke="#fff" stroke-width="2"/><text x="640" y="204" font-size="12" text-anchor="middle" fill="#2a241c" font-weight="bold">Corridor → Door (Fragment ①)</text><circle cx="840" cy="260" r="9" fill="#3a6ea5" stroke="#fff" stroke-width="2"/><text x="840" y="284" font-size="12" text-anchor="middle" fill="#2a241c" font-weight="bold">Qianji Pavilion Assembly</text><circle cx="420" cy="420" r="9" fill="#2f8f4f" stroke="#fff" stroke-width="2"/><text x="420" y="444" font-size="12" text-anchor="middle" fill="#2a241c" font-weight="bold">Wanxiang Grotto Periphery</text><line x1="20" y1="464" x2="900" y2="464" stroke="#cbb893" stroke-width="1"/><text x="20" y="478" font-size="11" font-weight="bold" fill="#2a241c">Exploration Hints:</text><text x="20" y="496" font-size="11.5" fill="#3a3228">Jiange Pass = Duan Tianya's sword debate (non-lethal, three moves).</text><text x="20" y="512" font-size="11.5" fill="#3a3228">Emei Back Mountain's full-moon blue glow = ancient stele 'All phenomena return to one; the heart is the key' — requires a sincere touch.</text><text x="20" y="528" font-size="11.5" fill="#3a3228">After the stele opens, the perimeter corridor → door (missing 1/3 arc key); delve deep to obtain the first Fragment.</text><text x="20" y="544" font-size="11.5" fill="#3a3228">Qianji Pavilion Assembly = three fragments reunite, a three-way standoff (may turn into a three-way melee).</text></svg>
# Yonghe Martial Codex · One-Dragon Campaign (Structured Data)
# Corresponding player/GM-readable version: s01_一條龍劇本.md
# Purpose: machine-readable reference for the site-build script / AI GM engine
# Format: YAML (UTF-8, all simplified Chinese, terms use "English Full Name (ABBR)" format)

scenario:
  id: s01
  title: One-Dragon Campaign
  slug: s01_yi-tiao-long
  type: campaign                # campaign=long continuous scenario / oneshot=single session
  player_mode: multiplayer      # multiplayer=multiplayer / solo=solo
  players:
    min: 4
    max: 6
    default: 4
    gm: required
  recommended_realm: "First Realm · First Glimpse → Sixth Realm · Return to Simplicity"
  expected_sessions: "Chapter 1: 1-3 + Chapter 2: 3-5 + Chapter 3: 4-6 + Chapter 4: 5-7 + Chapter 5: 6-8 + Chapter 6: 3-5 sessions (full arc approx. 22-34 sessions)"
  design_rationale: >-
    The One-Dragon Campaign provides the GM with a complete adventure path they can pick up and run immediately. It is a narrative framework that has "a main trunk, branches, and a toolbox,"
    rather than a strictly linear scenario. Design principles: Realm-driven (each chapter corresponds to one realm breakthrough), interwoven factions (the Four Clouds of the Age story threads),
    ample branching (each chapter end offers optional GM variants), and citation-first (martial arts / equipment / NPCs all reference existing named rulebook entries).
  source_files:
    - "12_一條龍劇本.md"
  reference_files:
    - "01_Core Mechanics"
    - "02_Character Creation"
    - "05_The Jianghu World"
    - "06_Jianghu Simulation"
    - "07_GM Guide"
    - "08_Equipment & Pills"
    - "09_Martial Arts Codex"
    - "11_NPC Character Cards"
    - "14_Enemy Quick Reference"
    - "15_Random Encounter Table"
  story_threads:                # Four Clouds of the Age story threads
    - Leadership Succession
    - Demon Cult Unrest
    - Legend of the Hidden Treasury
    - Northern Frontier War
  assumptions:                  # premises the scenario depends on
    - "PC count: 4-6 people (default difficulty baseline for all encounters)"
    - "Sect distribution: no specific sect required, but recommend at least 1 Righteous and 1 Neutral/Gray PC; an all-Evil party requires the GM to adjust some Righteous NPCs' initial attitudes"
    - "PC level curve: at the start of each chapter the PCs sit at the peak of the previous chapter's realm; if behind, the GM should insert extra sessions or adjust difficulty"
    - "NPC character cards: core NPC data is in 11_NPC Character Cards.md; those not yet present are marked 'New NPC'"
  chapters:

    # ===================== Chapter 1 =====================
    - id: ch1
      index: 1
      title: First Glimpse
      realm_milestone: "First Glimpse → Crossing the Threshold"
      pc_realm: "First Realm · First Glimpse (attribute cap 5)"
      expected_sessions: 1-3
      attribute_baseline:        # six-attribute baseline (GM reference)
        pc_avg: "Strength/Agility/Constitution 3-5; Comprehension/Willpower/Charisma 2-5"
        recommended_dc_range: "Difficulty (DC) 8-12"
        qi_pool: "8-15 pts"
        hp_range: "15-30"
      hooks:
        - id: hook-a
          name: Tea House Encounter
          suited: All Sects
          scene: >-
            Three li outside Luoyang City, at the "Sihai Tea House" — a rest stop run by the Sihai Alliance. Today it is unusually lively: a mysterious storyteller is recounting the open and secret struggles among the Tianjian Alliance's five sword factions.
          conflict_trigger: >-
            A group of masked men in black bursts in, declaring they act "by order of the Blood Moon Cult" and demanding the righteous disciples hand over their weapons, forcing the PCs to act.
          why_pc_acts: >-
            Righteous sects are obliged to protect the people; neutral sects have their own interests threatened; gray-leaning Evil sects may be mistaken for the righteous and attacked alongside them.
        - id: hook-b
          name: Sect Field Mission
          suited: "Righteous / Skill Sect / Medicine Sect"
          scene: >-
            The PC's master delivers a task to go to "Longquan Ferry" outside Luoyang City to fetch an item / receive a person; upon arrival, mountain bandits have seized the ferry, led by a boss at the peak of the Second Realm, the "Black Wind Stronghold Chieftain."
          conflict_trigger: >-
            The bandit chief (who has studied a fragment of demonic cult scripture and brushed the edge of the Second Realm) plunders the ferry and combat erupts.
        - id: hook-c
          name: Calamity from the Sky
          suited: "Gray-Evil / Shadow Sect / Independent"
          scene: >-
            On the highway a spooked carriage careens wildly, with a wounded villager inside. After saving them, the PCs find the wheels were tampered with using a mechanism.
          conflict_trigger: >-
            The mechanism's setter, "New NPC: Yin Jiuling (Qianji Pavilion defector, peak Second Realm)," watches coldly from a nearby hillside.
      key_scenes:
        - id: scene-1
          title: Meeting in the Chaos
          summary: "The PCs meet in battle for the first time, each showing their strengths (Sword Sect draws blades, Qi Sect circulates Qi, Vajra Sect meets force with force, Poison Sect strikes from range)."
        - id: scene-2
          title: The Master's Comment (post-battle)
          summary: "Depending on the hook, the helping elder's identity is: the storyteller (a Gaibang elder of the Skill Sect) / the ferry boatman (a Tianjian Alliance spy) / the masked woman (Liu Shengyan)."
        - id: scene-3
          title: The First Choice
          summary: "The elder gives the PCs a choice: go their separate ways, or band together to find Black Wind Stronghold. This is the first team decision."
        - id: scene-4
          title: Black Wind Stronghold (combat scene)
          summary: "See the encounter design below."
        - id: scene-5
          title: Breakthrough (realm breakthrough scene)
          summary: "After defeating the chieftain they find a demonic-cult fragment (ending note: 'The remaining seven pages are stored at the Shen Family Pawnshop in Luoyang City'), and complete the initiation trial to break through to the Second Realm."
      encounters:
        - id: enc-1
          title: Tea House / Ferry / Highway Skirmish
          enemies:
            - name: Man in Black
              count: "PC count + 1 (Hook A)"
              hp: 15
              might: "Strength 3 (mod -1)"
              agility: "Agility 3 (mod -1)"
              attack: "Base accuracy +1"
              damage: "1d6+1"
            - name: Mountain Bandit
              count: "= PC count (Hook B)"
              hp: 12
              might: "Strength 3"
              agility: "Agility 2"
              attack: "Accuracy +0"
              damage: "1d6"
            - name: Yin Jiuling's Mechanism Puppet
              count: 2
              hp: 20
              might: "Strength 4 (mod 0)"
              traits: "Immune to fear; fire damage doubled"
          difficulty: Moderate (for First Realm PCs)
          tactics: "Sword Sect / Vajra Sect hold the front line; Qi Sect uses Taiji Fist · Grasping the Sparrow's Tail for defense; Poison Sect outputs from range; Medicine Sect heals; Shadow Sect uses initiative to drop the weakest enemy first."
          variant: "If all are newbies, reduce 1 enemy; if someone is isolated and surrounded, the elder who has not yet acted steps in once to save the situation."
        - id: enc-2
          title: Black Wind Stronghold Outskirts
          enemies:
            - name: Black Wind Stronghold Minor Chief
              count: 1
              hp: 20
              might: "Strength 4 (mod 0)"
              agility: "Agility 3"
              attack: "Accuracy +2 (uses saber)"
              damage: "1d8+1 (Short Saber); skill 'Downward Cut' accuracy -2 but damage +1d6"
            - name: Mountain Bandit Mook
              count: "= PC count"
              hp: 12
              attack: "Accuracy +0"
              damage: "1d6"
          difficulty: Moderate
        - id: enc-3
          title: "Black Wind Stronghold Chieftain — Boss Battle"
          enemies:
            - name: "Han Bao the 'One-Eyed Dragon'"
              role: boss
              hp: 30
              might: "Strength 5 (mod +1)"
              agility: "Agility 4 (mod 0)"
              root: "Constitution 4"
              focus: "Willpower 2"
              attack: "Accuracy +3 (great saber)"
              damage: "2d6+1 (Five Tigers Door-Cutting Saber · Wind-Splitting Form)"
              qi: 6
              special: "Each time he takes damage, next turn accuracy +1 (Berserk, stacks up to +3); after taking 20+ total damage his berserk ends and he falls into fear."
          difficulty: Hard (Boss battle)
          variant: "If the PCs are too weak, the chieftain takes 1d4 internal injury per turn from demonic-art backlash."
      noncombat_challenges:
        - id: chal-1
          title: Tracking Black Wind Stronghold (exploration)
          check: "Tracking Difficulty (DC) 12 (Comprehension) or Jianghu Lore Difficulty (DC) 10 (Comprehension) asking villagers"
          success: "Find the mountain path, discover patrol routes, gain initiative +2 on the first encounter's ambush."
          failure: "Lose an hour lost in the mountains; night battle with sight -2 (Shadow Sect / Poison Sect instead gain stealth bonuses)."
        - id: chal-2
          title: Rescue the Captured Villagers (social / stealth)
          check: "Stealth Difficulty (DC) 12 (Agility) to slip past guards; or Intimidate Difficulty (DC) 12 (Strength) to force a captive to lead the way"
          success: "Rescue the hostages, gain the villagers' favor and intel — 'The chieftain locks himself in the cellar every night, practicing who-knows-what.'"
          failure: "Triggers an extra encounter; a villager is wounded (if not treated in time, Heroism -2)."
      rewards:
        - name: Demonic Cult Fragment (half page)
          type: Plot Item
          source: "Points to Chapter 2 clue — Shen Family Pawnshop"
        - name: Black Wind Stronghold Loot
          type: Silver
          source: "30-50 taels (split among PCs); returning it to the villagers grants Heroism +2"
        - name: Five Tigers Door-Cutting Saber · Wind-Splitting Form
          type: Martial Arts Manual
          source: "On the chieftain (see 09_Martial Arts Codex.md §6); only Independent or saber-using PCs may learn"
        - name: Jin Chuang Medicine
          type: Consumable
          source: "×3 doses (see 08_Equipment & Pills.md §Special Items)"
      breakthrough:
        to_realm: Second Realm · Crossing the Threshold
        xp_requirement: "Cumulative ≥ 20 Experience (Martial Truth / XP)"
        martial_requirement: "Master at least 1 initiation-level inner manual + 1 basic martial technique"
        story_lock: "Complete the initiation trial — defeat the Black Wind Stronghold Chieftain and make the choice 'Uphold the Righteous Path / Uphold Yourself'"
        rewards: "Attribute +3 (max +2 single); Qi realm +3; attribute cap unlocked to 6; Advantage Die vs lower-realm foes; passive 'First Sense of Qi' (short rest recovery +2)"
      foreshadow:
        - text: "Secret of the demonic-cult fragment (Shen Family Pawnshop)"
          points_to: Chapter 2
        - text: "Identity of the storyteller / boatman / Liu Shengyan"
          points_to: Chapter 2
        - text: "Yin Jiuling (if not caught) joins Qianji Pavilion's dark plan"
          points_to: Chapter 4
        - text: "The name Blood Moon Cult (from the men in black / the chieftain)"
          points_to: "Chapters 3-5"
      gm_variants:
        - id: var-a
          title: PCs Decide Not to Party Up
          detail: "Each PC meets someone needing help; if still not partying up, they regroup in Luoyang days later over a major event."
        - id: var-b
          title: PCs Crush It Easily
          detail: "The chieftain fires a signal flare before dying, leaving a loose thread; add a collapse/fire escape scene."
        - id: var-c
          title: PCs Are Defeated
          detail: "No TPK — locked in the woodshed with the villagers, shifting to a prison-break scene; on retry the chieftain has only half HP."

    # ===================== Chapter 2 =====================
    - id: ch2
      index: 2
      title: Crossing the Threshold
      realm_milestone: "Crossing the Threshold → Complete Mastery"
      pc_realm: "Second Realm · Crossing the Threshold (attribute cap 6)"
      expected_sessions: 3-5
      attribute_baseline:
        pc_avg: "Strength/Agility/Constitution 4-6; Comprehension/Willpower/Charisma 3-6"
        recommended_dc_range: "Difficulty (DC) 10-15"
        qi_pool: "15-25 pts"
        hp_range: "25-40"
      hooks:
        - id: hook-a
          name: Shen Wanjin's Invitation
          suited: "Righteous / Neutral PCs"
          scene: "At an inn in Luoyang the PCs receive a gilded invitation from Shen Wanjin, chief manager of the Sihai Alliance, who reveals someone is mass-buying the ingredients of Hua Gong San (Dragon-Saliva Herb / Cold-Stone Gall / Seven-Star Begonia)."
          conflict_trigger: "Shen Wanjin asks the PCs to find out who the buyer is."
        - id: hook-b
          name: Liu Shengyan's Plea
          suited: "Medicine Sect / Neutral / Wandering PCs"
          scene: "In Luoyang the PCs meet a young woman, Liu Shengyan (chief healer of Yaowang Valley's Jishi Hall), beset by local thugs, investigating banned drugs leaked from Yaowang Valley."
        - id: hook-c
          name: Shen Family Pawnshop Clue
          suited: "Continues Chapter 1 foreshadow"
          scene: "Bearing the demonic-cult fragment, the PCs go to the Shen Family Pawnshop; the clerk Shen San recognizes the same fragment and mentions 'a black scorpion tattoo'."
          conflict_trigger: "Jianghu Lore Difficulty (DC) 12 (Comprehension) identifies it as a Blood Moon Cult subordinate mark."
      key_scenes:
        - id: scene-1
          title: Luoyang City Exploration (open scene)
          locations:
            - "Yangzhou Tower (Sihai Alliance): Hook A, meet NPCs"
            - "Longquan Pavilion (sword forge): buy/upgrade weapons, Ziyang due to collect a sword"
            - "Yaowang Jishi Hall: healing, buy medicine, Liu Shengyan"
            - "Shen Family Pawnshop: Hook C, gather rumors"
            - "Six Doors Luoyang Branch: New NPC Tie Jingxin (Fourth Realm)"
            - "Mixed Riffraff Tea House: rumor-gathering Difficulty (DC) -2"
        - id: scene-2
          title: Tracing the Medicinals (investigation chain)
          summary: "Four clues point to three buyers: Western Regions merchant (Blood Moon Cult), Bashu mysterious buyer (Qianji Pavilion), Luoyang rich man Chu Huaisha (Po Feng San)."
        - id: scene-3
          title: Yangzhou Tower Night Banquet — Information Gathering
          summary: "Shen Wanjin spreads a Luoyang map, pointing out the Western Regions / Bashu / Chu Huaisha locations."
        - id: scene-4
          title: Meeting Chu Huaisha (social / stealth)
          summary: "Chu Huaisha reveals Po Feng San came from Gongshu Xuan and he needs to enter Wanxiang Grotto to cure his poisoned sister."
        - id: scene-5
          title: Camel Alley — Shadow of the Blood Moon Cult (combat)
          summary: "The Western Regions merchant destroys evidence and is blocked by the Six Doors; the PCs may help / intercept / watch."
      encounters:
        - id: enc-1
          title: Camel Alley Skirmish
          enemies:
            - name: Western Regions Saber Master
              count: "PC count + 1"
              hp: 20
              might: "Strength 4 (mod 0)"
              agility: "Agility 4"
              attack: "Accuracy +3 (curved saber)"
              damage: "2d6"
              special: "Skill 'Desert Wind': initiative +2, first cut accuracy +1"
            - name: Western Regions Poison Master
              count: 1
              hp: 15
              sense: "Comprehension 4"
              attack: "Accuracy +3 (poison-needle dart)"
              damage: "1d4+Poisoned (1d4/turn, 2 turns)"
              special: "Holds 2 Thunderclap Bombs, detonates on dying to take enemies with him"
          difficulty: Moderate
          third_party: "On turn 3 a shadowy figure snatches the wagon's letter and vanishes; Agility / Perception Difficulty (DC) 15 may identify 'Huangquan Step' (Wangchuan Tower lightfoot)."
        - id: enc-2
          title: Bashu Buyer at Ping'an Inn (optional)
          enemies:
            - name: Bashu Mechanism Master
              count: 2
              hp: 18
              sense: "Comprehension 5"
              special: "Poor in melee, remotely controls mechanisms"
            - name: Iron-Shell Mechanism Beast
              count: 1
              hp: 35
              might: "Strength 6 (mod +2)"
              attack: "Accuracy +4"
              damage: "2d8+2"
              special: "Dart attacks accuracy -4; fire damage doubled; auto-repairs 1d4 HP per turn"
          difficulty: Hard
          background: "A Qianji Pavilion hall master's private act; secret letter 'The Pavilion Elder knows Wanxiang Grotto's location, buy materials swiftly, not a word for three months'."
        - id: enc-3
          title: Chu Huaisha's Test (optional social → possible combat)
          enemies:
            - name: Chu Huaisha
              role: "Non-boss (only wants to flee)"
              hp: 28
              agility: "Agility 7 (mod +3)"
              sense: "Comprehension 6 (mod +2)"
              qi: 20
              attack: "Chasing Wind Palm accuracy +4, damage 2d6+3"
              special: "Pre-laid 5 mechanisms (smoke / poison-smoke / rope-net); goal is to stop his escape, not kill him"
          difficulty: Moderate (unconventional combat)
      noncombat_challenges:
        - id: chal-1
          title: Deciphering the Ancient Map
          check: "Jianghu Lore Difficulty (DC) 15 (Comprehension) or Calligraphy & Painting Difficulty (DC) 12 (Charisma)"
          success: "Recognize the area beyond Emei Mountain's back range not on the map; ancient text 'All phenomena return to origin, the grotto has a key'."
          failure: "Only know Bashu mountains, need Qianji Pavilion to interpret (leads to Chapter 4)."
        - id: chal-2
          title: Camel Alley Evidence Tracking
          check: "Tracking Difficulty (DC) 12 (Comprehension)"
          success: "Obtain Blood Moon Cult documents + Luoyang defense map (Northern Frontier scouting)."
          failure: "Fragment '...Northern Frontier...Hua Gong San...' leads to Chapter 6."
        - id: chal-3
          title: Persuading Chu Huaisha to Cooperate
          check: "Oratory Difficulty (DC) 15 (Charisma)"
          bonus: "Medicine Sect PC → Difficulty (DC) -2; Intimidate → Difficulty (DC) +5 and failure triggers Encounter 3"
          success: "Gain ancient map + Po Feng San formula + token."
          failure: "Chu Huaisha leaves Luoyang, met again in Bashu in Chapter 3."
      rewards:
        - name: Willow-Leaf Saber / Short Sword
          type: Weapon
          source: "Pick one, Shen Wanjin's gift (see 08_Equipment & Pills.md)"
        - name: Life-Continuing Pill
          type: Pill
          source: "×2, Liu Shengyan's thanks"
        - name: Minor Restoration Pill + Qi-Gathering Pill
          type: Pill
          source: "Minor Restoration Pill ×3 + Qi-Gathering Pill ×1, seized from Western Regions crate"
        - name: Po Feng San Formula
          type: "Plot / Item"
          source: "Requires persuading Chu Huaisha (Medicine Sect PC or Alchemy ≥2 to brew, Alchemy Difficulty (DC) 14)"
        - name: Ancient Map (fragmentary)
          type: Plot Item
          source: "Points to Wanxiang Grotto entrance in Chapter 4"
        - name: Tie Jingxin's Letter of Recommendation
          type: Plot Item
          source: "Obtained after helping the Six Doors"
        - name: Renown +2
          type: Renown
      breakthrough:
        to_realm: Third Realm · Complete Mastery
        xp_requirement: "Cumulative ≥ 70 Experience (Martial Truth / XP)"
        martial_requirement: "Orthodox inner manual or above, master at least 5 techniques"
        story_lock: "Comprehend the 'Martial Truth' — understand the Jianghu is more than dueling"
        rewards: "Attribute +3 (max +2 single); Qi realm +6; cap to 7; Advantage Die on key checks vs same-or-lower realm (2/scene); 'Seeing the Subtle' Technique Reading +2"
      foreshadow:
        - text: "Blood Moon Cult's Northern Frontier plan"
          points_to: "Chapters 5-6"
        - text: "Qianji Pavilion knows Wanxiang Grotto (Elder's symbol)"
          points_to: Chapter 4
        - text: "Wangchuan Tower's involvement"
          points_to: "Chapters 3-6"
        - text: "Chu Huaisha's poisoned sister"
          points_to: "Chapters 4-6"
        - text: "Ancient map points to Bashu"
          points_to: "Chapters 3-4"
      gm_variants:
        - id: var-a
          title: PCs Take the Righteous Path
          detail: "Six Doors gives later support; Chu Huaisha turns paranoid; Shen Wanjin gifts Golden-Silk Soft Armor / Rhino-Hide Armor."
        - id: var-b
          title: PCs Take the Evil Path
          detail: "Tie Jingxin grows suspicious; Shen Wanjin goes strictly business; Chapter 4 may yield Qianji Pavilion black-market auction benefits."
        - id: var-c
          title: PCs Drop the Medicinal Line
          detail: "Chapter 3 Hua Gong San flows on the black market; the Wanxiang Grotto line can bypass medicinals as Chu Huaisha approaches the PCs directly."

    # ===================== Chapter 3 =====================
    - id: ch3
      index: 3
      title: Complete Mastery
      realm_milestone: "Complete Mastery → Perfecting the Craft"
      pc_realm: "Third Realm · Complete Mastery (attribute cap 7)"
      expected_sessions: 4-6
      attribute_baseline:
        pc_avg: "Strength/Agility/Constitution 5-7; Comprehension/Willpower/Charisma 4-7"
        recommended_dc_range: "Difficulty (DC) 12-18"
        qi_pool: "25-40 pts"
        hp_range: "35-50"
      hooks:
        - id: hook-a
          name: Duan Tianya's Invitation
          suited: "Sword Sect / Righteous PCs"
          scene: "At the Sword Pavilion the PCs meet Duan Tianya, Tianjian Alliance's Lieyang Sword Master, who invites them to explore Wanxiang Grotto together."
        - id: hook-b
          name: Mo Ran's Plight
          suited: "Medicine Sect / Poison Sect / Neutral PCs"
          scene: "In a Bashu town Mo Ran (Yaowang Valley's Netherworld Hall Master) is surrounded by villagers; the PCs are asked to help clear his name of an inside-job suspicion."
        - id: hook-c
          name: Bashu Jianghu Rumors
          suited: All Sects
          scene: "Blue light on the night of the full moon behind Emei Mountain; Qianji Pavilion issues the 'Qianji Invitation' to crack Wanxiang Grotto's seal."
      key_scenes:
        - id: scene-1
          title: Sword Pavilion Pass — Duan Tianya's Spar (non-lethal)
          summary: "Duan Tianya only uses three moves; the PCs gaining his trust opens the Tianjian Alliance line."
          duel_data:
            hp: 50
            attack: "+7 (holding back ≈ +4)"
            damage: "2d6+2 / 3d6+2 / 2d8+3 (third move +2 accuracy if PC HP >50%)"
        - id: scene-2
          title: Tang Sect Town — Mo Ran's Wrongful Accusation
          summary: "Draw the snake from its hole or investigate; truth: Meng Chuan stole medicinals coerced by Nangong Hui; Nangong Hui is the real insider."
        - id: scene-3
          title: Behind Emei Mountain — Blue Light at Full Moon (exploration / puzzle)
          summary: "Ancient stele 'All phenomena return to origin, the mind is the key'; requires a sincere statement of motive or Mechanism Difficulty (DC) 18 (Comprehension); first fragment found inside."
        - id: scene-4
          title: Qianji Invitation — Heroes Gather
          summary: "Duan Tianya / Mo Ran / Chu Huaisha / Liu Shengyan / Gongshu Xuan / Blood Moon Cult spy (disguised) all present."
        - id: scene-5
          title: Outside Wanxiang Grotto — Three-Way Standoff (climax)
          summary: "Gongshu Xuan holds the second fragment; the third is on the Blood Moon Cult spy (scorpion tattoo); the PCs' choice decides the ending."
      encounters:
        - id: enc-1
          title: Behind Emei Mountain — Guardian Beast
          enemies:
            - name: Stone Lion Puppet
              count: 2
              hp: 30
              might: "Strength 6 (mod +2)"
              ac: "Defense (AC) 17 (stone)"
              attack: "Accuracy +5"
              damage: "2d8+2"
              special: "Immune to poison / charm / fear; fire doubled; reforms when knocked down; joint weak point Technique Reading Difficulty (DC) 14 (Defense -3)"
          difficulty: Moderate
        - id: enc-2
          title: Qianji Pavilion — Nangong Hui Boss Battle
          enemies:
            - name: Nangong Hui
              role: boss
              hp: 45
              sense: "Comprehension 7 (mod +3)"
              agility: "Agility 6 (mod +2)"
              root: "Constitution 6"
              qi: 30
              attack: "Rotting-Bone Palm accuracy +6, damage 3d6+3 + Poison 2d4/turn"
              special: "Returning-Spring Formula self-heals 3d6; auto-recovers 1d6/turn (fails if vegetation burned); on dying releases poison mist"
          difficulty: Hard (Boss battle)
          background: "The insider Mo Ran pursued, a Blood Moon Cult / Qianji Pavilion double agent; after defeat may be killed / released / handed to Mo Ran."
        - id: enc-3
          title: Three-Way Melee (optional)
          participants: "PCs + Duan Tianya + 2 Tianjian Alliance disciples vs Blood Moon Cult spy ×3 + minor chief"
          enemies:
            - name: Duan Tianya (full power)
              hp: 60
              attack: "Accuracy +8"
              damage: "3d6+4"
            - name: Tianjian Alliance Disciple
              count: 2
              hp: 25
              attack: "Accuracy +5"
              damage: "2d6+2"
            - name: Blood Moon Cult Spy
              count: 3
              hp: 22
              attack: "Accuracy +5"
              damage: "2d6+1 + Poison (Constitution Difficulty (DC) 12, 1d4/turn)"
            - name: Blood Moon Cult Minor Chief
              hp: 40
              attack: "Accuracy +6"
              damage: "3d6+2"
              special: "Each turn sacrifices 3 Qi for +2 accuracy; holds the third fragment"
          difficulty: Hard
          key_item: "Third fragment on the minor chief; detect in time (Perception / Technique Reading Difficulty (DC) 16) to stop shattering."
      noncombat_challenges:
        - id: chal-1
          title: Cracking Wanxiang Grotto's Seal (mind / cooperation)
          check: "① Martial comprehension Comprehension Difficulty (DC) 16 ② Ancient script Calligraphy & Painting / Jianghu Lore Difficulty (DC) 16 ③ Qi guidance Constitution + Willpower combined"
          success: "Great door opens, enter the outer area."
          failure: "Seal backfires, each takes 1d10 internal injury, cools down to next full moon."
        - id: chal-2
          title: Finding the Spy at the Qianji Gathering (social / Read Intent)
          check: "Read Intent Difficulty (DC) 16 (Comprehension) or Jianghu Lore Difficulty (DC) 14 (Comprehension)"
          success: "Gain initiative in Scene 5."
          failure: "In Scene 5 the spy ambushes, reaction -2 on first turn."
      rewards:
        - name: Cold Plum Sword Art · Frosty Sword Qi
          type: Martial Arts Manual
          source: "Taught by Duan Tianya (after spar and strong showing, see 09_Martial Arts Codex.md §17)"
        - name: Golden-Silk Soft Armor
          type: Armor

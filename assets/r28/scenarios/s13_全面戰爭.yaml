# 異界入侵 TRPG 劇本 — 全面戰爭
# id: S13

id: S13
title: 全面戰爭
season: 4
season_name: 決戰之章
建議等級: Lv.61-68
難度: 困難
核心衝突: 第四波入侵開始。A 級裂縫在全球五個主要城市同時開啟。玩家必須選擇一個戰場——或者奔波於多個戰場之間。
主要地點: 東京、紐約、倫敦、上海、聖保羅（五選一或輪流）
關鍵場景: 全球防禦協調會議——各公會會長集結／所選城市的防禦戰／發現裂縫背後有人在協調——氏族主神親自指揮
敵人: 氏族精銳部隊 Lv.60-68、A 級守護者
預期長度: 3-5 次跑團
獎勵: 經驗值（EXP） 12000, 各公會聲望 +500, 橙·傳說裝備
單人調整: 重點防守單一城市

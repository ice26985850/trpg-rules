- 王都覲見——說服異世界人類國王提供支援
- 潛入熊人要塞——發現古拉姆的契約條款存在漏洞
- 貿易站遭遇黑蛇氏族的間諜——毒殺事件
敵人: 黑蛇間諜 Lv.30-35（毒屬性）、熊人守衛（可避免戰鬥）

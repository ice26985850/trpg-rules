# 異界入侵 TRPG 劇本 — 覺醒之日
# id: S1

id: S1
title: 覺醒之日
season: 1
season_name: 覺醒之章
建議等級: Lv.1-5
難度: 簡單
核心衝突: 玩家在東京新宿醒來——裂縫在身邊打開，系統首次啟動。必須在混亂中生存，找到其他覺醒者。
主要地點:
- name: 新宿廢墟
  description: D-Day 後兩週的新宿街頭。被遺棄的汽車、破碎的玻璃、遠處不時傳來魔物的吼叫。
- name: 避難所地下停車場
  description: 由倖存者自發組織的臨時據點，有基本物資和幾個受傷的人。
關鍵NPC:
- name: 田中教官
  role: 前自衛隊員，現在是倖存者群體的守護者。會給玩家第一個任務。
- name: 佐藤醫師
  role: 避難所的醫護人員，負責治療傷者。
關鍵場景:
- 系統首次啟動——屬性面板浮現在視野中的震撼
- 第一次與魔物（虛空鼠）的戰鬥——學習攻擊判定
- 救助被困在倒塌建築中的倖存者
- 遭遇 D 級裂縫的跡象，為 S2 鋪墊
敵人列表:
- name: 虛空鼠
  quantity: 3-5
  note: Lv.1-3，新手教學用
- name: 小型裂縫聚合體
  quantity: '1'
  note: Lv.5，劇本最終遭遇
預期長度: 1-2 次跑團（4-8 小時）
獎勵: 經驗值（EXP） 200，初級治療藥水 ×2，白·普通裝備兌換券
單人調整: 虛空鼠數量減半（2隻），聚合體 生命值（HP） −20%

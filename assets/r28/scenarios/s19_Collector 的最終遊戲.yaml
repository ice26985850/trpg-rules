# 異界入侵 TRPG 劇本 — Collector 的最終遊戲
# id: S19

id: S19
title: Collector 的最終遊戲
season: 5
season_name: 神臨之章
建議等級: Lv.93-100
難度: 極難
核心衝突: Collector 終於現身。祂說：「我一直在看你的旅程，而你——確實很有趣。現在，最後一個遊戲。通過了，我告訴你結束這一切的方法。」
主要地點: Collector 的遊戲空間（宇宙空間中的競技場）
關鍵場景:
- Collector 的五個遊戲關卡——模仿你之前經歷過的最艱難戰鬥
- 遊戲中的特殊規則——Collector 隨意修改法則
- 最後的對話——Collector 告訴你世界之心的真相
敵人: 過往 Boss 的強化復刻版 Lv.93-100
預期長度: 3-5 次跑團
獎勵: 經驗值（EXP） 25000, 世界之心真相, Collector 的紀念品（特殊飾品）
單人調整: 復刻 Boss 依單人規則調整

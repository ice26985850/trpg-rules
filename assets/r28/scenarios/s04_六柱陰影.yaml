# 異界入侵 TRPG 劇本 — 六柱陰影
# id: S4

id: S4
title: 六柱陰影
season: 1
season_name: 覺醒之章
建議等級: Lv.12-20
難度: 困難
核心衝突: 第一個獸人氏族先鋒出現在東京——人狼氏族的一支偵察隊。公會緊急動員所有可用的覺醒者。玩家將首次面對「有智慧的敵人」。
主要地點:
- name: 涉谷十字路口
  description: 曾經全世界最繁忙的十字路口，現在是與獸人先鋒的戰場。
- name: 人狼偵察據點（廢棄百貨公司）
  description: 人狼佔領的據點，內部有獸人的異界營地。
關鍵NPC:
- name: 人狼斥候長·格魯克
  role: 首個有台詞的敵方角色。不屑於人類的弱小，但對玩家展現的系統感到好奇。
- name: 公會參謀長·武田
  role: 戰術指揮，提供情報和支援。
關鍵場景:
- 街頭遭遇戰——首次面對有組織的敵人
- 百貨公司攻略——每層樓不同戰術挑戰
- 與格魯克的對話——揭示獸人視角（「你們的世界太好入侵了」）
- 發現獸人正在收集「某種東西」——S5 鋪墊
敵人列表:
- name: 人狼斥候
  quantity: 3-5
  note: Lv.12-14，有戰術 AI
- name: 人狼戰士
  quantity: 2-3
  note: Lv.15-16，高傷害
- name: 人狼斥候長·格魯克
  quantity: '1'
  note: Lv.18 Boss，可對話
預期長度: 2-4 次跑團（8-16 小時）
獎勵: 經驗值（EXP） 1500，藍·稀有裝備箱 ×1，公會聲望 +200，可獲得人狼武器碎片（S5 關鍵道具）
單人調整: 斥候減至 2 隻，格魯克 生命值（HP） −25% 且失去召喚增援能力

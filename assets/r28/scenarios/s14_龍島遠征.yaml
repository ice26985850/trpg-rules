# 異界入侵 TRPG 劇本 — 龍島遠征
# id: S14

id: S14
title: 龍島遠征
season: 4
season_name: 決戰之章
建議等級: Lv.66-73
難度: 困難
核心衝突: 為了對抗氏族主神，需要更強的力量。玩家前往龍島，尋求龍神安格爾威德的協助——但龍神的考驗不是每個人都能通過的。
主要地點:
- name: 龍島
  description: 火山島，龍族的領地。高溫、毒氣、龍語魔法陷阱。
- name: 龍神殿
  description: 安格爾威德的神國入口，充滿元素的試煉場。
關鍵場景:
- 龍族的考驗：火、冰、雷、暗、聖五元素試煉
- 與安格爾威德的對話——龍神的條件（要求玩家證明人類值得被拯救）
- 獲得龍神的祝福——但也付出代價
敵人: 元素試煉守護者 Lv.65-72（非必須擊殺，通過試煉即可）
預期長度: 2-3 次跑團
獎勵: 經驗值（EXP） 10000, 龍神祝福（全屬性 +5，永久）, 龍鱗材料（紅·神話級）
單人調整: 試煉 難度等級（DC） −15，守護者數量減半

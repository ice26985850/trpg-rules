# 異界入侵 TRPG 劇本 — 神之影
# id: S11

id: S11
title: 神之影
season: 3
season_name: 遠征之章
建議等級: Lv.50-57
難度: 困難
核心衝突: 科塔爾（狼神）的分身投影首次出現在裂縫中——不是完整的主神，但已足夠強大。玩家必須擊退這個投影。
主要地點:
- name: A 級裂縫（狼神領域）
關鍵場景: 科塔爾投影的初次現身——力量差距的震撼／從投影手中存活——不一定要打贏，活下來就是勝利
敵人: 狼神投影 Lv.55（Boss）+ 人狼精銳 Lv.48-52
預期長度: 2-3 次跑團
獎勵: 經驗值（EXP） 8000, A 級材料（橙·傳說碎片）, 首次擊退神之投影的成就
單人調整: 投影 生命值（HP） −30% 傷害 −20%，精銳減半

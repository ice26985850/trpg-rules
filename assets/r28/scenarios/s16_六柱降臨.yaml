# 異界入侵 TRPG 劇本 — 六柱降臨
# id: S16

id: S16
title: 六柱降臨
season: 4
season_name: 決戰之章
建議等級: Lv.75-80
難度: 極難
核心衝突: 六大氏族主神的投影同時降臨在全球六個 S 級裂縫中。每一個投影都能獨自毀滅一座城市。玩家只能選擇面對其中之一——但選擇哪一個？
主要地點: 六個 S 級裂縫（對應六氏族，玩家選一個）
關鍵場景:
- 選擇對手——每個氏族主神投影有不同的難度和獎勵
- S 級裂縫攻略——最高難度的迷宮挑戰
- 與選定主神的對決——不是你死就是我亡
敵人: 選定氏族主神投影 Lv.80（Boss）+ 氏族精銳
預期長度: 3-5 次跑團
獎勵: 經驗值（EXP） 20000, 擊敗的主神對應紅·神話裝備, 世界聲望達到頂峰
單人調整: 投影依單人 Boss 規則大幅削弱

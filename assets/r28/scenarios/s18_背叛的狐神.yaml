# 異界入侵 TRPG 劇本 — 背叛的狐神
# id: S18

id: S18
title: 背叛的狐神
season: 5
season_name: 神臨之章
建議等級: Lv.87-94
難度: 極難
核心衝突: 伊露娜（狐人主神）終於露出了真面目——她從一開始就在雙面下注。現在她在神域中央設下了終極幻境考驗，宣稱只有通過的人才有資格繼續前進。
主要地點: 伊露娜的幻境迷宮（千面之城）
關鍵場景:
- 千面之城——一座不斷變化的城市，每個區域都是不同的幻象
- 伊露娜的三個問題——不是戰鬥，是對話。答錯就回到起點。
- 真相揭露——伊露娜其實一直在保護人類（以她自己的方式）
敵人: 幻象守護者 Lv.88-93
預期長度: 2-3 次跑團
獎勵: 經驗值（EXP） 18000, 伊露娜的祝福（幻惑抗性永久免疫）, 千面之鑰
單人調整: 幻象 難度等級（DC） −20

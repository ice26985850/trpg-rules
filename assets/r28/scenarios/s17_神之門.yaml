# 異界入侵 TRPG 劇本 — 神之門
# id: S17

id: S17
title: 神之門
season: 5
season_name: 神臨之章
建議等級: Lv.81-88
難度: 極難
核心衝突: 擊敗一個投影只是開始。通往神域的道路開啟——玩家必須穿越神域邊界，這是一條充滿法則亂流和遠古守護者的道路。
主要地點: 神域邊界（5 個區域的法則亂流地帶）
關鍵場景: 法則亂流——每個區域的物理規則都不同（一個區域重力反轉、一個區域時間流速異常等）／遭遇遠古守護者——世界之心誕生時就存在的存在／Collector 的留言——玩樂之神一路上留下了線索
敵人: 法則守護者 Lv.82-88（超高抗性，需要戰術而非蠻力）
預期長度: 2-3 次跑團
獎勵: 經驗值（EXP） 15000, 神域通行權
單人調整: 守護者減半，法則亂流頻率降低

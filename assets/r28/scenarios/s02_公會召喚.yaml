# 異界入侵 TRPG 劇本 — 公會召喚
# id: S2

id: S2
title: 公會召喚
season: 1
season_name: 覺醒之章
建議等級: Lv.3-8
難度: 簡單
核心衝突: 玩家被公會（黎明之塔）招募，接受第一次正式委託——調查東京灣岸區的異常能量反應。
主要地點:
- name: 黎明之塔
  description: 東京公會總部，原為一棟 40 層辦公大樓，現已改裝為覺醒者基地。
- name: 灣岸工業區
  description: 廢棄工廠區，D 級裂縫正在形成。
關鍵NPC:
- name: 會長·黑崎
  role: 黎明之塔的會長，B 級覺醒者。給玩家委託。
- name: 情報官·山田
  role: 負責分析裂縫資訊，提供任務簡報。
關鍵場景:
- 公會大廳的初印象——各級覺醒者來來往往
- 工業區潛入——學習潛行和偵查檢定
- 阻止裂縫完全開啟——限時任務
- 公會內部派系政治初現（S3-S4 鋪墊）
敵人列表:
- name: 石像鬼
  quantity: 2-3
  note: Lv.5，飛行，偵查難度較高
- name: 裂縫先鋒獸
  quantity: '1'
  note: Lv.8，D 級 Boss 前兆
預期長度: 1-2 次跑團（4-8 小時）
獎勵: 經驗值（EXP） 400，D 級武器箱（綠·優良）×1，公會聲望 +50
單人調整: 石像鬼減至 1 隻，先鋒獸 生命值（HP） −20%

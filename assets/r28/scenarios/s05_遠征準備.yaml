# 異界入侵 TRPG 劇本 — 遠征準備
# id: S5

id: S5
title: 遠征準備
season: 2
season_name: 抗爭之章
建議等級: Lv.21-27
難度: 普通
核心衝突: 公會決定組織第一次異世界遠征。玩家需要收集三種關鍵材料：穩定魔力晶體（E 級裂縫）、異界合金（廢棄工廠區）、穿越引導符文（向矮人交涉）。
主要地點:
- name: 多個 E/D 級裂縫
- name: 廢棄重工業區
- name: 矮人地下工坊（異世界入口附近）
關鍵場景:
- 材料收集的三條路線（玩家可選擇順序，每條路線有不同挑戰）
- 與矮人族的初次接觸——學習異世界外交文化
- 發現有人在暗中阻撓遠征計劃——內鬼線索
敵人: E/D 級魔物群、競爭者（其他公會的覺醒者）
預期長度: 2-3 次跑團
獎勵: 經驗值（EXP） 2000，穿越資格證，D 級進階裝備
單人調整: 每條路線怪物減半

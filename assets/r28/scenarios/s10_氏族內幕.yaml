# 異界入侵 TRPG 劇本 — 氏族內幕
# id: S10

id: S10
title: 氏族內幕
season: 3
season_name: 遠征之章
建議等級: Lv.46-53
難度: 普通
核心衝突: 玩家獲悉墨爾基斯（黑蛇主神）和澤菲羅斯（鷹人主神）之間的內部衝突。墨爾基斯願意提供情報——但有代價。
主要地點:
- name: 黑蛇神殿（隱藏地下）
- name: 鷹人天空堡壘
關鍵場景: 與墨爾基斯的代言人談判——道德困境（接受邪神的幫助？）／天空堡壘潛入——獲取澤菲羅斯的計畫／發現伊露娜（狐神）在雙方之間周旋——她到底站在哪邊？
敵人: 黑蛇祭司、鷹人衛兵（可選擇性戰鬥）
預期長度: 2-3 次跑團
獎勵: 經驗值（EXP） 5000, 氏族關係情報, 紫·獨特飾品
單人調整: 談判 難度等級（DC） −10

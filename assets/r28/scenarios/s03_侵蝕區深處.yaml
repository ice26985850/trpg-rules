# 異界入侵 TRPG 劇本 — 侵蝕區深處
# id: S3

id: S3
title: 侵蝕區深處
season: 1
season_name: 覺醒之章
建議等級: Lv.7-14
難度: 普通
核心衝突: 公會偵測到一個正在快速擴張的 D 級裂縫，玩家被派往內部進行偵查和封閉。裂縫內部有異界材料——但還有更多。
主要地點:
- name: D 級裂縫內部
  description: 異界法則覆蓋的小型迷宮（5 個區域）：入口大廳、菌林走廊、廢墟廣場、核心前室、裂縫核心。
- name: 菌林走廊
  description: 覆蓋著發光真菌的通道，有隱藏的異界礦物和潛伏的魔物。
關鍵NPC:
- name: 同行的 D 級覺醒者·佐藤
  role: 公會派遣的資深覺醒者，在裂縫內部受傷，需要玩家救助。
關鍵場景:
- 穿過菌林——收集異界材料（可製作綠·優良裝備）
- 發現前一批調查隊的遺骸——緊張感提升
- 核心前室的 Boss 戰——首次面對真正的 D 級 Boss
- 裂縫關閉後的奇異現象——Collector 的暗示
敵人列表:
- name: 酸液蛞蝓
  quantity: 4-6
  note: Lv.5-7，群體出現
- name: 菌林寄生體
  quantity: 2-3
  note: Lv.8，控制類特殊能力
- name: 裂縫聚合體
  quantity: '1'
  note: D 級 Boss，Lv.10
預期長度: 2-3 次跑團（8-12 小時）
獎勵: 經驗值（EXP） 800，D 級防具箱（綠·優良）×1，異界結晶 ×3（可製作藍·稀有裝備），公會聲望 +100
單人調整: 蛞蝓減半（2-3隻），寄生體減至1隻，聚合體 生命值（HP） −25% 傷害 −15%

# 異界入侵 TRPG 劇本 — 兩個世界的命運
# id: S20

id: S20
title: 兩個世界的命運
season: 5
season_name: 神臨之章
建議等級: Lv.100+
難度: 神話
核心衝突: 終局。玩家帶著所有盟友、裝備和知識，進入世界之心。在那裡——不是一個，而是剩餘的五個氏族主神本體在等待。這是決定兩個世界命運的戰鬥。
主要地點: 世界之心（最終迷宮，10 個區域）
關鍵場景:
- 最終同盟——所有招募過的盟友在此集結
- 世界之心深處——發現裂縫可以被永久關閉或永久開啟
- 最終抉擇——五種結局的分歧點
敵人: 五位氏族主神本體 Lv.100-110（終極 Boss 車輪戰）
預期長度: 4-6 次跑團
獎勵: 依結局而定（經驗值（EXP） 50000+, 傳說成就）
單人調整: 每位主神本體依單人規則調整，盟友協助力度增加

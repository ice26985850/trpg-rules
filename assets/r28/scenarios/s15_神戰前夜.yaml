# 異界入侵 TRPG 劇本 — 神戰前夜
# id: S15

id: S15
title: 神戰前夜
season: 4
season_name: 決戰之章
建議等級: Lv.71-77
難度: 普通
核心衝突: 第五波前夕的寧靜。玩家可以選擇強化裝備、招募盟友、或深入探索尚未涉足的中立種族領地。這是在暴風雨前的最後準備。
主要地點: 玩家自選（可回到任何已造訪地點）
關鍵場景:
- 裝備鍛造——使用龍鱗和異界材料製作紅·神話裝備
- 外交收尾——將中立種族轉為同盟
- 個人劇情——回顧從 Lv.1 到現在的旅程
敵人: 依玩家選擇
預期長度: 1-2 次跑團
獎勵: 依活動而定（主要為裝備升級和外交成果）
單人調整: 所有外交 難度等級（DC） −15

notes:
- "**英雄攜帶上限**：英雄攜帶的消耗品（治療藥水與法力藥水合計）上限 = 5 + FLOOR(體質（CON）÷ 2) 瓶。此限制避免高階藥水海稀釋戰鬥，亦保留「買藥水 vs 存錢買裝備」的健康權衡。"

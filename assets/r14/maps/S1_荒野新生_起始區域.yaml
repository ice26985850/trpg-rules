    to: "river"
    type: "path"
    label: "汲水路徑"
  - from: "camp"
    to: "forest_east"
    type: "trail"
    label: "狩獵小徑"
  - from: "camp"
    to: "hills_north"
    type: "trail"
    label: "探索路線"
  - from: "camp"
    to: "hunters_cabin"
    type: "path"
    label: "舊獵徑"
  - from: "camp"
    to: "ruins_west"
    type: "trail"
    label: "古道"
  - from: "camp"
    to: "trading_post"
    type: "path"
    label: "舊商路"
  - from: "forest_east"
    to: "neighbor_border"
    type: "trail"

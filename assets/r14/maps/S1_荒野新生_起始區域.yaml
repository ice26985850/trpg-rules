# 地圖：S1 荒野新生 — 起始區域
# 對應劇本：S1_荒野新生，階段一「登陸」

nodes:
  - id: "camp"
    label: "玩家的營地"
    x: 400
    y: 350
    type: "settlement"
    explored: true
    description: "你的第一個定居點——簡陋但充滿希望"

  - id: "river"
    label: "翡翠河"
    x: 350
    y: 420
    type: "resource"
    explored: true
    description: "清澈的河流，提供水源和魚獲"

  - id: "forest_east"
    label: "東部森林"
    x: 600
    y: 300
    type: "wilderness"
    explored: false
    description: "茂密的森林，傳聞中有藥草和野獸"

  - id: "hills_north"
    label: "北部丘陵"
    x: 400
    y: 150
    type: "wilderness"
    explored: false
    description: "起伏的丘陵——可能有礦脈"

  - id: "ruins_west"
    label: "廢棄神殿"
    x: 150
    y: 300
    type: "ruins"

    description: "一座被藤蔓覆蓋的古老神殿"

  - id: "neighbor_border"
    label: "鄰國邊境"
    x: 650
    y: 500
    type: "border"
    explored: false
    description: "越過這條無形的線就是鄰國的領土"

  - id: "hunters_cabin"
    label: "獵人小屋"
    x: 500
    y: 250
    type: "landmark"
    explored: true
    description: "廢棄的獵人小屋——似乎被匆忙遺棄"

  - id: "trading_post"
    label: "交易站遺址"
    x: 250
    y: 500
    type: "landmark"
    explored: false
    description: "曾經的交易站——只剩殘垣斷壁"

edges:

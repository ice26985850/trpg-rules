# 地圖：S5 繼承之戰 — 帝國分裂
name: "帝國分裂——繼承之戰"
description: "三位繼承人各據一方，帝國在內戰的邊緣搖搖欲墜"

nodes:
  - id: "capital"
    label: "帝都（爭奪中）"
    x: 400
    y: 350
    type: "settlement"
    explored: true
    description: "帝國的心臟，老國王在此臥床——誰控制帝都，誰就控制了帝國的象徵"

  - id: "heir_military"
    label: "長子陣營（軍事派）"
    x: 250
    y: 150
    type: "settlement"
    explored: true
    description: "長子控制北方軍區——擁有最強大的常規軍隊"

  - id: "heir_diplomat"
    label: "次女陣營（改革派）"
    x: 600
    y: 500
    type: "settlement"
    explored: true
    description: "次女以南方貿易城市為基地——掌控經濟命脈"

  - id: "heir_magic"
    label: "幼子陣營（魔法派）"
    x: 150
    y: 500
    type: "settlement"
    explored: true
    description: "幼子在西部魔法學院建立勢力——掌握上古奧術"

  - id: "border_invasion"
    label: "外敵入侵點"
    x: 650
    y: 150
    type: "border"
    explored: false
    description: "鄰國趁帝國內亂之際蠢蠢欲動"

  - id: "neutral_zone"
    label: "中立區"
    x: 400
    y: 200
    type: "landmark"
    explored: true
    description: "尚未表態的貴族領地——三位繼承人都在爭取他們的支持"

  - id: "ancient_vault"
    label: "帝國寶庫"
    x: 300
    y: 450
    type: "resource"
    explored: true
    description: "老國王累積的財富和神器——誰得到寶庫，誰就獲得巨大優勢"

  - id: "senate"
    label: "元老院"
    x: 500
    y: 300
    type: "landmark"
    explored: true
    description: "帝國議會所在地——若能說服元老院，可以不流血解決繼承問題"


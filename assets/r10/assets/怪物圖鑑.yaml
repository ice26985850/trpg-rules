# 怪物圖鑑.yaml

threat_level_system:
  description: "敵方單位威脅等級體系"
  levels:
    - tl: 1
      attribute_pool: 10
      weapons: "1 輕型"
      suitable_for: "起始船團可應對"
    - tl: 2
      attribute_pool: 14
      weapons: "1 中 + 1 輕"
      suitable_for: "部分受損可擊敗"
    - tl: 3
      attribute_pool: 18
      weapons: "1 重 + 1 中"
      suitable_for: "需全力協同"
    - tl: 4
      attribute_pool: 22
      weapons: "1 重 + 1 中 + 特殊"
      suitable_for: "可能出現癱瘓"
    - tl: 5
      attribute_pool: 26
      weapons: "2 重 + 魚雷 + 特殊"
      suitable_for: "逃跑合理"

quick_generation:
  steps:
    - "定TL → 分配屬性（引擎/裝甲/火力/感測器/特殊）"
    - "計算衍生：HP=ARM×10+20 | AC=10+ENG-S | 能量=ENG-S×5+10 | DR=ARM×2"
    - "選武器 → 賦予1-2特殊能力 → 定義戰術腳本"

enemies:
  pirates:
    - name: "輕型掠奪艇"
      tl: 1
      attributes: {ENG-S: 3, ARM: 1, WPN: 2, SEN: 2}
      derived: {HP: 25, AC: 13, energy: 15, DR: 2}
      weapons:
        - {name: "輕型激光炮", damage: "2d6", traits: "精準+1"}
        - {name: "干擾導彈", damage: "2d4", traits: "命中後目標下回合攻擊-2"}
      special: []
      tactics: "高速接近近距纏鬥；HP<50%逃跑（ENG DC12）"
      loot: "1d4×100 Cr、1d4-1彈藥、1d3零件"

    - name: "中型劫掠艦"
      tl: 2
      attributes: {ENG-S: 2, ARM: 2, WPN: 3, SEN: 3}
      derived: {HP: 40, AC: 12, energy: 20, DR: 4}
      weapons:
        - {name: "中型等離子炮#1", damage: "2d8", traits: "均衡"}
        - {name: "中型等離子炮#2", damage: "2d8", traits: "均衡"}
        - {name: "登艦魚雷", damage: "4d6", traits: "命中後觸發登艦戰", ammo: "1發/戰鬥"}
      special:
        - "電子干擾（3能量）：中距內目標下回合攻擊-4"
        - "掠奪狂熱：HP<25%時WPN+1，AC-2"
      tactics: "中距砲擊；有機會發射登艦魚雷；瀕死更兇猛不逃跑"
      loot: "2d6×100 Cr、2d6彈藥、2d4零件、1d3燃料、1d2藥物"

    - name: "重型海盜旗艦"
      tl: 3
      attributes: {ENG-S: 1, ARM: 4, WPN: 5, SEN: 3}
      derived: {HP: 60, AC: 11, energy: 15, DR: 8}
      weapons:
        - {name: "重型磁軌炮", damage: "3d8", traits: "貫穿2"}
        - {name: "魚雷", damage: "4d8", traits: "貫穿4，僅遠距+", ammo: "2發/戰鬥"}
        - {name: "點防禦系統#1", damage: "1d8", traits: "反應攔截導彈/魚雷"}
        - {name: "點防禦系統#2", damage: "1d8", traits: "反應攔截導彈/魚雷"}
      special:
        - "護盾增幅器（反應5能量）：自身12臨時護盾"
        - "指揮艦：近距海盜+1攻擊、士氣優勢"
        - "最後一搏：HP<20%反應爐超載，3回合後近距6d10自爆"
      tactics: "遠距砲擊+魚雷；小型海盜護航；瀕死自爆"
      loot: "3d10×100 Cr、3d10彈藥、4d6零件、3d6燃料、2d4藥物、1稀有改裝"

  creatures:
    - name: "星際水母群"
      tl: 1
      hostility: "非敵意"
      attributes: {ENG-S: 4, ARM: 0, WPN: 1, SEN: 5}
      derived: {HP: 30, AC: 14, energy: 30, DR: 0}
      weapons:
        - {name: "觸手鞭擊", damage: "1d8", traits: "近距，自衛時使用"}
        - {name: "生物電脈衝", damage: "特殊", traits: "能量-1d6+護盾減半", cost: "3能量，中距"}
      special:
        - "被動隱形：SEN<4無法在遠距外偵測"
        - "遷徙本能：非敵意，3回合後自動離開"
        - "共生：船團繞道→下次航行事件擲骰+2"
      tactics: "不主動攻擊；被攻擊釋放電脈衝後逃跑"
      loot: "2d6生物質→1d3燃料或藥物"

    - name: "虛空獵手"
      tl: 2
      hostility: "敵意"
      attributes: {ENG-S: 3, ARM: 3, WPN: 4, SEN: 4}
      derived: {HP: 45, AC: 13, energy: 25, DR: 6}
      weapons:
        - {name: "生物酸液噴射", damage: "3d6", traits: "貫穿3，命中後裝甲-1（疊加至-3）", range: "中距"}
        - {name: "觸手擒抱", damage: "2d8", traits: "命中後目標無法移動，每回合自動2d4", range: "近距"}
      special:
        - "牽引凝膠（反應5能量）：攻擊方武器下回合無法使用"
        - "獵食狂暴：HP<50%時每回合攻擊兩次"
        - "亞空間潛行（7能量）：遠距瞬移至近距（奇襲）"
      tactics: "亞空間潛行奇襲→觸手擒抱鎖定→酸液溶解裝甲"
      loot: "3d6生物質、1件虛空甲殼碎片（+1裝甲配件）"

  anomalies:
    - name: "超空間異常體"
      tl: 4
      hostility: "敵意"
      attributes: {ENG-S: 5, ARM: 5, WPN: 4, SEN: 6}
      derived: {HP: 80, AC: 15, energy: 40, DR: 10}
      special_rules:
        - "非歐幾里德存在：不受距離限制"
        - "相位轉換：每回合d4(1=物質態/2=能量態/3=虛空態/4=混沌態)"
      weapons:
        - {name: "現實撕裂", damage: "3d10", traits: "無視裝甲，命中後INT DC15→幻覺無法行動"}
        - {name: "時間迴廊", damage: "特殊", traits: "指定船跳過下回合", cost: "8能量"}
      special:
        - "次元裂縫：每回合結束隨機改變全艦距離帶"
        - "信息侵蝕：SEN最高船DC16→感測器受損"
        - "不朽存在：HP=0坍縮為穩定次元裂隙（可研究/利用）"
      tactics: "無法預測；每回合根據相位改變行為；GM營造詭異氛圍"
      loot: "次元碎片×1（消耗品：下次跳躍自動成功且無風險）"

generic_abilities:
  - {name: "護盾", effect: "獲得 N×3 臨時HP"}
  - {name: "隱形", effect: "SEN DC15 才能鎖定"}
  - {name: "再生", effect: "每回合回復 1d6 HP"}
  - {name: "召喚援軍", effect: "HP50%時召喚TL-2援軍1d3"}
  - {name: "電磁脈衝", effect: "範圍內能量 -2d4"}
  - {name: "自爆", effect: "瀕死時造成範圍傷害"}
  - {name: "速度爆發", effect: "本回合移動3距離帶"}

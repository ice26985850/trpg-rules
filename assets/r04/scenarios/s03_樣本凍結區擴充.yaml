# 樣本凍結區擴充 —— 凍結廢土 TRPG（結構化索引）
# 本檔由同名 .md 整理而來，供網站提供 .md / .yaml 雙格式下載。
# 本擴充包含 11 個完整凍結區樣本，涵蓋新手至傳奇全難度梯度；
# 每個凍結區可獨立使用，亦可在戰役中串聯。完整解凍參數與布局請參照 .md。
# 結構自由：本檔以 zones 列表呈現各凍結區，非強制欄位。

name: "樣本凍結區擴充"
description: |
  收錄 11 個可直接使用的凍結區樣本，難度從新手（安眠型超市）到傳奇（呼吸型創世迴廊）。
  每個凍結區皆含解凍節奏模式、起始閾值、布局與遭遇設計，可作為戰役串接或單場遊玩的模組。
difficulty: "新手 → 傳奇"
zones:
  - name: "樣本01：超級市場「霜落超市」"
    tier: "新手"
    rhythm: "安眠型"
    note: "結構穩定、解凍節奏溫和，新手冷行者最佳入門場地。"
  - name: "樣本02：住宅社區「霜鈴小區」"
    tier: "新手"
    rhythm: "安眠型"
    note: "鄰里場景，適合團隊建立與記憶主題。"
  - name: "樣本03：學校「啟明小學」"
    tier: "新手"
    rhythm: "脈搏型"
    note: "首次脈搏型節奏，群體倫理抉擇。"
  - name: "樣本04：醫院「聖瑪莉紀念醫院」"
    tier: "中級"
    rhythm: "脈搏型"
    note: "生命倫理與陣營介入的核心場地。"
  - name: "樣本05：地下鐵路「凍脈線」"
    tier: "中級"
    rhythm: "連鎖型"
    note: "連鎖型解凍，路線規劃與時機壓力。"
  - name: "樣本06：發電廠「永凍能源廠」"
    tier: "中級"
    rhythm: "呼吸型"
    note: "技術挑戰，後果初現。"
  - name: "樣本07：軍事檢查站「鐵霜哨站」"
    tier: "高難度"
    rhythm: "痙攣型"
    note: "痙攣型高風險，軍事倫理與真相碎片。"
  - name: "樣本08：港口／船塢「凍潮港」"
    tier: "高難度"
    rhythm: "連鎖型"
    note: "線索匯聚、主要對手現身。"
  - name: "樣本09：研究設施「時間實驗室·第七層」"
    tier: "高難度"
    rhythm: "痙攣型"
    note: "創世假說核心、重大揭示。"
  - name: "樣本10：時鐘塔「永恆尖塔」"
    tier: "傳奇"
    rhythm: "全節奏混合"
    note: "終極考驗、世界抉擇。"
  - name: "樣本11：廢土深淵「創世迴廊」"
    tier: "傳奇"
    rhythm: "呼吸型"
    note: "傳奇結局、角色命運。"
notes:
  - "前 3 個（超市、醫院、軍事檢查站）為基礎樣本，其餘為新增擴充。"
  - "附錄：凍結區快速參考表。"

# 獵人X獵人TRPG 世界地圖總覽（結構化地圖資料）
# 每個地點含區域、連接關係與對應 SVG 示意圖。

rule: 獵人X獵人TRPG
maps:
- key: world_overview
  name: 世界地圖總覽
  type: 世界結構
  region: 全體
  summary: 表層世界（人類文明圈）與深層——黑暗大陸的相對位置。表層由 V5/V6 國際體系管轄，黑暗大陸被緘默條約封鎖，僅有「門」可進入。貪婪之島為獨立遊戲空間。
  areas:
  - name: 薩巴市
    desc: 獵人考試集合地，現代都市。
  - name: 天空競技場
    desc: 高 200+ 樓的格鬥塔。
  - name: 友克鑫市
    desc: 地下拍賣與黑幫活躍的都市。
  - name: 枯枯戮山
    desc: 揍敵客家族（殺手）本邸。
  - name: 流星街
    desc: 不被承認的廢棄物處理場。
  - name: 卡金王國
    desc: 退出 V5 的新興強權，推動渡航。
  - name: 獵人協會總部
    desc: 獵人協會中樞，發放獵人執照。
  - name: 門（黑暗大陸入口）
    desc: 通往黑暗大陸的唯一通道。
  - name: 結晶荒原
    desc: 門後無盡結晶平原，會結晶化。
  - name: 淚海
    desc: 反映內心的情緒物理化之海。
  - name: 五大災難
    desc: 黑暗大陸的終極威脅生物。
  - name: 貪婪之島
    desc: 念能力建構的實體遊戲空間。
  connections:
  - - 薩巴市
    - 天空競技場
  - - 天空競技場
    - 友克鑫市
  - - 枯枯戮山
    - 流星街
  - - 卡金王國
    - 獵人協會總部
  - - 友克鑫市
    - 獵人協會總部
  - - 卡金王國
    - 門（黑暗大陸入口）
  - - 門（黑暗大陸入口）
    - 結晶荒原
  - - 結晶荒原
    - 淚海
  - - 淚海
    - 五大災難
  - - 友克鑫市
    - 貪婪之島
  svg: world_overview.svg
- key: hunter_exam
  name: 獵人考試考場
  type: 試煉複合區
  region: 表層世界·薩巴市周邊
  summary: 第 288 期獵人考試動線：自薩巴市集合起，經死亡沼澤、鏡像迷宮、實戰淘汰，至綺多主持的最終面試。五個階段層層篩選，存活率不到百分之一。
  areas:
  - name: 薩巴市中央廣場
    desc: 第一輪：2 小時內找齊 5 個隱藏登記點（鐘樓/下水道/咖啡廳/倉庫/噴泉）。
    hazard: 考生互詐（東巴提供錯誤情報）。
  - name: 死亡沼澤
    desc: 第二輪：穿越腐蝕性泥沼，每 6 小時水位上升 1m。
    hazard: 鱷魚魔獸 CR1/4、毒蛙群、食人藤蔓；泥沼每回合 1d4 酸蝕。
  - name: 鏡像迷宮
    desc: 第三輪：7 間鏡房（A-G），須與隊友合作通關。
    hazard: 鏡像分身戰（CR=自身），需說服或超越自己。
  - name: 實戰淘汰場
    desc: 第四輪：1v1 淘汰賽，4 輪遞進（CR 1/2→2）。
    encounter: 「影步」艾爾文（CR1-2）、「誓約拳」卡爾洛（CR2）。
  - name: 最終面試會場
    desc: 第五輪：綺多長桌前回答「真正困難的問題」。
    loot: 獵人執照、3,000J、同期獵人網絡。
  connections:
  - - 薩巴市中央廣場
    - 死亡沼澤
  - - 死亡沼澤
    - 鏡像迷宮
  - - 鏡像迷宮
    - 實戰淘汰場
  - - 實戰淘汰場
    - 最終面試會場
  svg: hunter_exam.svg
- key: heavens_arena
  name: 天空競技場
  type: 格鬥塔
  region: 表層世界
  summary: 高聳入雲的格鬥塔，共 200+ 層。依樓層分五個層級，愈高獎金與對手愈強，念能力限制逐步放開。頂層為一流高手對決。
  areas:
  - name: 10-50 樓
    desc: CR 1/4~1/2，獎金 500-2,000J，禁用念能力。
    encounter: 新人格鬥家。
  - name: 50-100 樓
    desc: CR 1~2，獎金 3,000-10,000J，禁用念能力。
    encounter: 中堅格鬥家。
  - name: 100-150 樓
    desc: CR 3~5，獎金 15,000-50,000J，念能力可用。
    encounter: 念能力者。
  - name: 150-200 樓
    desc: CR 6~8，獎金 60,000-200,000J，念能力必備。
    encounter: 樓主候補。
  - name: 200+ 樓
    desc: CR 9+，獎金 250,000J+，一流高手對決。
    encounter: 樓主（天空競技場頂層）。
  connections:
  - - 10-50 樓
    - 50-100 樓
  - - 50-100 樓
    - 100-150 樓
  - - 100-150 樓
    - 150-200 樓
  - - 150-200 樓
    - 200+ 樓
  svg: heavens_arena.svg
- key: yorknew
  name: 友克鑫市
  type: 都市·拍賣會場
  region: 表層世界
  summary: 地下交易與黑幫活躍的都市。年度拍賣會為核心事件，會場劃分五區，旅團襲擊引發五方勢力混戰。
  areas:
  - name: 友克鑫市區
    desc: 情報蒐集與委託接洽的都市外圍。
    hazard: 黑幫盤查、扒手。
  - name: 拍賣會主廳
    desc: 寬敞，多掩體；旅團主攻區。
    encounter: 旅團戰鬥員 A（CR6）。
  - name: 貴賓（VIP）包廂
    desc: 狹窄單出口，黑幫護送 VIP 撤離。
    loot: 高價拍品。
  - name: 後台走廊
    desc: 狹長多轉角，警衛與旅團交戰。
    hazard: 狙擊、陷阱。
  - name: 金庫
    desc: 厚重鐵門（破壞 DC25），暗夜之心存放處。
    loot: 暗夜之心（傳說級）。
  - name: 地下停車場
    desc: 空曠，車輛作掩體；各方撤退路線交會。
    encounter: 旅團支援員（CR4）。
  connections:
  - - 友克鑫市區
    - 拍賣會主廳
  - - 拍賣會主廳
    - 貴賓（VIP）包廂
  - - 拍賣會主廳
    - 後台走廊
  - - 拍賣會主廳
    - 金庫
  - - 後台走廊
    - 地下停車場
  - - 金庫
    - 地下停車場
  svg: yorknew.svg
- key: kukuroo_meteor
  name: 枯枯戮山與流星街
  type: 殺手本邸·廢棄場
  region: 表層世界
  summary: 揍敵客家族（職業殺手）的本邸坐落於枯枯戮山，門禁極嚴；山腳連接被世界遺棄的流星街，資源回收與黑市在此運作。
  areas:
  - name: 殺手大門
    desc: 枯枯戮山入口，測試門重達數噸。
    hazard: 若強闖，門會壓死入侵者。
  - name: 測試門
    desc: 家族用於篩選訪客的機關門。
    encounter: 管家（如基裘）測試來者。
  - name: 揍敵客宅邸
    desc: 家族主屋與訓練設施。
    loot: 家族任務、念能力傳承。
  - name: 流星街外環
    desc: 廢棄物堆積場外圍。
    hazard: 幫派盤踞、毒氣。
  - name: 流星街黑市
    desc: 地下拍賣與改裝武器交易。
    loot: 稀有素材、改裝念具。
  - name: 幫派地盤
    desc: 街內勢力割據區。
    encounter: 流星街出身戰士（如酷拉皮卡故鄉相關）。
  connections:
  - - 殺手大門
    - 測試門
  - - 測試門
    - 揍敵客宅邸
  - - 殺手大門
    - 流星街外環
  - - 流星街外環
    - 流星街黑市
  - - 流星街黑市
    - 幫派地盤
  svg: kukuroo_meteor.svg
- key: chimera_ant
  name: 嵌合蟻領地
  type: 生態巢穴
  region: 表層世界·NGL 周邊
  summary: 嵌合蟻在 NGL（新綠色生活圈）建立的巢穴階層社會。女王產卵，師團長統領兵隊，以人類為養分快速演化。
  areas:
  - name: 巢穴核心（女王）
    desc: 女王產卵所在，防衛最森嚴。
    encounter: 嵌合蟻王（若已誕生，CR11+）。
  - name: 師團長區
    desc: 直屬女王的精銳指揮官駐地。
    encounter: 師團長（CR 6-10，具智能與念）。
  - name: 兵隊外圍
    desc: 巡邏與狩獵的人類聚落邊緣。
    encounter: 兵隊（CR 1-5）。
  - name: 人類聚落（獵物）
    desc: 被捕食的村落，抵抗組織活躍。
    hazard: 定期遭狩獵。
  connections:
  - - 巢穴核心（女王）
    - 師團長區
  - - 師團長區
    - 兵隊外圍
  - - 兵隊外圍
    - 人類聚落（獵物）
  svg: chimera_ant.svg
- key: dark_continent
  name: 黑暗大陸
  type: 未知大陸
  region: 深層
  summary: 人類認知外的超古代大陸，充滿未知生態與五大災難。須經「門」進入，內部區域具有結晶化、情緒物理化等異常規則。
  areas:
  - name: 莫比烏斯湖
    desc: 渡航起點，平靜湖面下潛藏異常。
    hazard: 空間扭曲，方向感喪失。
  - name: 門扉
    desc: 入口考驗，通過者方能進入門後。
    encounter: 守門人的試煉。
  - name: 結晶荒原·記憶結晶之丘
    desc: 封存記憶的銀色結晶山。
    loot: 記憶結晶碎片；守護獸 CR10。
  - name: 結晶荒原·古代文明遺址
    desc: 風格未知的金字塔，頂端永恆藍光。
    loot: 永恆結晶；自律守衛×4、中央核心 CR11。
  - name: 結晶荒原·逆結晶之泉
    desc: 未結晶液池，可治癒結晶化。
    loot: 逆結晶花；守護結晶龍 CR13。
  - name: 淚海
    desc: 反映內心的海，情緒物理化。
    encounter: 古代淚海守衛 CR12；感情圖書館。
  - name: 五大災難
    desc: 金（植物兵器）/左布（不死症）/布利翁（兵器）/黑爾貝爾（雙尾蛇）/埃（氣體生命）。
    encounter: 災難級存在 CR 極高。
  connections:
  - - 莫比烏斯湖
    - 門扉
  - - 門扉
    - 結晶荒原·記憶結晶之丘
  - - 門扉
    - 結晶荒原·古代文明遺址
  - - 門扉
    - 結晶荒原·逆結晶之泉
  - - 結晶荒原·逆結晶之泉
    - 淚海
  - - 淚海
    - 五大災難
  svg: dark_continent.svg
- key: kakin_fleet
  name: 卡金王國與渡航艦隊
  type: 王國·遠征艦隊
  region: 表層→深層
  summary: 退出 V5 的卡金王國傾舉國之力推動黑暗大陸渡航。王位爭奪（多王子）與艦隊編成為核心衝突，旗艦率領驅逐艦護航。
  areas:
  - name: 卡金王宮
    desc: 國王與王子們的權力中心。
    encounter: 王子間暗殺與結盟。
  - name: 王子宮
    desc: 各王子自有宮邸與守護者。
    hazard: 王位繼承戰。
  - name: 港口
    desc: 艦隊集結與補給地。
    loot: 渡航物資、念具裝備。
  - name: 渡航旗艦
    desc: 遠征主力艦，搭載 V5 特種兵。
    encounter: V5 旗艦（CR16 級戰艦）。
  - name: 驅逐艦護航群
    desc: 伴隨旗艦的護衛艦隊。
    encounter: V5 驅逐艦（CR10）。
  - name: 黑暗大陸航向
    desc: 艦隊目標座標，未知海域。
    hazard: 五大災難先兆。
  connections:
  - - 卡金王宮
    - 王子宮
  - - 卡金王宮
    - 港口
  - - 港口
    - 渡航旗艦
  - - 渡航旗艦
    - 驅逐艦護航群
  - - 渡航旗艦
    - 黑暗大陸航向
  svg: kakin_fleet.svg
- key: greed_island
  name: 貪婪之島
  type: 念能力遊戲空間
  region: 獨立空間
  summary: 由念能力者共同建構的實體遊戲，奪得「一萬人中的一人」資格方可進入。目標為集齊 100 張指定卡並觸發離開條件。
  areas:
  - name: 多列士鎮（起始）
    desc: 玩家登入與休整的起始城鎮。
    loot: 基礎裝備、任務委託。
  - name: 南方領地（25%）
    desc: 高難度戰鬥與稀有卡產出區。
    encounter: 遊戲守衛者、BIG 等強敵。
  - name: 指定卡收集
    desc: 分散全島的 100 張指定卡。
    loot: 指定卡（含傳說級「一回合殺」）。
  - name: 製作/修練所
    desc: 卡片合成與能力訓練設施。
    loot: 自製卡、念能力精進。
  - name: 離島條件
    desc: 集齊指定卡後觸發的離開機制。
    encounter: 最終挑戰（GM 裁定）。
  connections:
  - - 多列士鎮（起始）
    - 南方領地（25%）
  - - 南方領地（25%）
    - 指定卡收集
  - - 指定卡收集
    - 製作/修練所
  - - 指定卡收集
    - 離島條件
  svg: greed_island.svg
- key: first_civilization
  name: 第一文明遺跡
  type: 超古代遺跡
  region: 深層·黑暗大陸
  summary: 早於人類三萬年的超古代文明遺跡，藏有全知識結晶與自律守衛。與結晶荒原、淚海的感情圖書館相連，是「門為何在此」的真相所在。
  areas:
  - name: 遺跡入口
    desc: 崩塌的研究所外緣，機關密佈。
    hazard: 古代陷阱（調查 DC 高）。
  - name: 奧德里奇研究所
    desc: 墮落研究者的最後據點。
    encounter: 奧德里奇（墮落研究者，CR 依 GM）。
  - name: 玻璃槽實驗體
    desc: 封存於液體中的實驗生命。
    loot: 未知生物樣本、禁忌知識。
  - name: 金字塔核心
    desc: 遺跡中央能源塔，永恆藍光。
    encounter: 自律守衛×4、中央核心 CR11。
  - name: 感情圖書館
    desc: 淚海深處保存的感情記錄建築。
    loot: 感情結晶×3、古代星圖。
  connections:
  - - 遺跡入口
    - 奧德里奇研究所
  - - 奧德里奇研究所
    - 玻璃槽實驗體
  - - 奧德里奇研究所
    - 金字塔核心
  - - 金字塔核心
    - 感情圖書館
  svg: first_civilization.svg

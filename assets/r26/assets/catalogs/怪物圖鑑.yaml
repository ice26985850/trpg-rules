# 怪物圖鑑（敵方角色資料）

# 收錄《獵人X獵人TRPG》中的敵方角色（非玩家角色（NPC） 與頭目（BOSS）），按挑戰等級（CR）排序。
# 本檔為 怪物圖鑑.md 的結構化對照版本，完整數值請參閱「敵人角色卡合集.xlsx」。

monsters:
  - name: "V5特種兵"
    cr: "3"
    type: "雜魚級（小隊單位）"
    hp: "50"
    ac: "14"
    drop: "反念步槍（玩家可使用：2d6傷害 無視念防禦 射程50m）、反念護甲碎片"
  - name: "布利翁戰鬥型機械"
    cr: "8"
    type: "中堅級（自律兵器）"
    hp: "100"
    ac: "20"
    weakness: "電擊攻擊雙倍傷害。：駭入：智力DC22可使其癱瘓1d4回合。"
    drop: "布利翁合金碎片（傳說級防具材料）、經驗點（XP） 200"
  - name: "布利翁指揮型機械"
    cr: "12"
    type: "BOSS級（指揮中樞）"
    hp: "200"
    ac: "22"
    weakness: "控制台在指揮核心旁——輸入關機代碼（智力+念知識DC25+3人同時按開關）可關閉所有機械。：合金護甲：物理攻擊減傷 -5。"
    drop: "布利翁控制核心（召喚CR4偵查機械 維持SP3/回合）、經驗點（XP） 350"
  - name: "金的核心"
    cr: "14"
    type: "BOSS級（部位系統）"
    weakness: "無法學習從未見過的攻擊；清除孢子後需1回合重新分析。"
    drop: "金的種子（種下後1小時長出防禦結界，24hr內全體AC+3）、經驗點（XP） 30-40"
  - name: "V5祕密艦隊旗艦"
    cr: "15"
    type: "載具型BOSS"
    hp: "500"
    ac: "22"
    weakness: "引擎室（需潛入艦內 察覺DC20找到入口）。破壞引擎後AC-6、無法移動。"
    drop: "V5反念技術藍圖、V5最高機密檔案"
  - name: "雙尾蛇·黑爾貝爾"
    cr: "18"
    type: "傳說級（部位系統討伐）"
    weakness: "沉睡期間AC-4、先攻-5。：雙尾聯結神經（察覺DC20）：同時攻擊雙尾時傷害×1.5。"
    drop: "黑爾貝爾鱗片×10（AC+3 念防禦+2防具材料）、雙尾結晶（吸收型念具材料）、經驗點（XP） 60-80"
  - name: "審判官（第一文明的遺影）"
    cr: "20"
    type: "終極BOSS（非必須戰鬥）"
    hp: "400"
    ac: "24"
    mechanic: "審判官不是必須戰鬥的敵人。對話審判才是主要遊戲內容。"
    drop: "第一文明全知識結晶（究極質問一次）、經驗點（XP） 100（對話通過）/ 500（擊敗）"
  - name: "V5驅逐艦"
    cr: "10（共5艘）"
    type: "載具型中堅"
    hp: "250"
    ac: "18"
    weakness: "引擎室破壞後AC-4。"
    drop: "V5反念技術碎片、軍用通訊設備"
  - name: "「影步」艾爾文"
    cr: ""
    type: "中堅級（準決賽對手）"
    hp: "50"
    ac: "13"
    special: "影步（放出系SP2）：消耗移動動作5m瞬移，下次攻擊命中+2。"
    drop: "影步戰術筆記"
  - name: "「誓約拳」卡爾洛"
    cr: ""
    type: "中堅級（決賽對手）"
    hp: "70"
    ac: "12"
    special: "誓約の拳(強化系SP3 BP4/4)：每日3次+1制約誓約點（BP）、使用後1回合無法移動+1制約誓約點（BP）、對手投降必須停手否則失念能力+2制約誓約點（BP）。+2d6(2制約誓約點（BP）)、無視一半念防禦(2制約誓約點（BP）)。"
    drop: "誓約拳修行筆記"
  - name: "古代淚海守衛"
    cr: ""
    type: "BOSS級"
    hp: "180"
    ac: "15"
    special: "液體形態：物理攻擊獲得劣勢。"
    drop: "感情結晶×2"
  - name: "幻影旅團·戰鬥員A"
    cr: ""
    type: "中堅級（旅團外圍成員）"
    hp: "110"
    ac: "16"
    special: "旅團戰鬥員（強化系）：擅長正面壓制。"
    drop: "旅團通訊裝置、暗夜之心（任務物品）"
  - name: "幻影旅團·支援員"
    cr: ""
    type: "中堅級"
    hp: "80"
    ac: "14"
    special: "確保撤退路線。使用煙霧彈和念陷阱進行區域控制。"
    drop: "煙霧彈×3、脫出用地圖"
  - name: "幻象守衛"
    cr: "6（同時出現2隻）"
    type: "BOSS級召喚物"
    hp: "80"
    ac: "14"
    special: "物理免疫：物理攻擊對幻象守衛無效。僅念攻擊或念能力可造成傷害。"
    drop: "無。幻象守衛被擊敗後化為光點消失。"
  - name: "東巴（新人殺手）"
    cr: ""
    type: "雜魚級"
    hp: "20"
    ac: "10"
    special: "新人殺手：對新人考生進行的欺騙檢定獲得優勢（欺騙+4）。"
    drop: "果汁×3（其實是瀉藥）"
  - name: "毒蛙群"
    cr: ""
    type: "雜魚級×3"
    hp: "15"
    ac: "11"
    special: "群體戰術：3隻以上同時在場時攻擊獲得優勢。"
    drop: "毒蛙腺體（可製作解毒劑）"
  - name: "深淵之牙·阿比薩爾"
    cr: ""
    type: "BOSS級（部位系統）"
    hp: "220"
    ac: "17"
    weakness: "硫磺（額外2d6火焰傷害）。：三階段：潛伏(觸手攻擊)→甦醒(4次攻擊/回合+空殼)→狂暴(吸收效果+移動力20m)。"
    special: "部位系統：主體(HP100,AC17)、觸手×4(各HP30,AC15)、吸收口(HP50,AC13)、感知觸角(HP20,AC18)。"
    drop: "結晶核（念具材料）、硫磺結晶×2、刻有未知文字的石板（指向黑暗大陸座標）"
  - name: "結晶守護獸"
    cr: ""
    type: "BOSS級"
    hp: "120"
    ac: "18"
    special: "結晶爆破：受到物理傷害時對攻擊者造成1d6反射傷害。"
    drop: "記憶結晶碎片（消耗品：可詢問GM一個問題，答案真實但不一定完整）"
  - name: "結晶龍"
    cr: ""
    type: "BOSS級"
    hp: "250"
    ac: "20"
    weakness: "對火焰傷害無抗性。：結晶化反傷：受到物理傷害時對攻擊者造成1d6反射傷害。"
    special: "弱點：對火焰傷害無抗性。"
    drop: "逆結晶花（完全治癒結晶化症+12hr免疫）"
  - name: "阿比薩爾·空殼"
    cr: ""
    type: "雜魚級（召喚物）"
    hp: "25"
    ac: "10"
    special: "殘留念場：被破壞後釋放，範圍內意志DC12否則恐懼Lv.1。"
    drop: "無"

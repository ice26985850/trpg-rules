# 物品圖鑑（傳說級與特殊物品）

# 收錄《獵人X獵人TRPG》中的傳說級物品與特殊物品。
# 本檔為 物品圖鑑.md 的結構化對照版本，詳細規則與平衡說明請參閱 .md。

legendary_items:
  - roll: 1
    name: "反念結晶"
    type: "消耗品"
    rules: "鑲嵌在武器或念能力上。啟動後持續 **1 場戰鬥**，期間所有攻擊無視目標 **5 點念防禦**。使用後結晶碎裂。**啟動：輔助動作。**"
    balance: "1 場戰鬥的穿透力提升。對高念防禦目標（念防 6+）等於 +5 命中。用完即棄。"
  - roll: 2
    name: "記憶儲存器"
    type: "敘事物品"
    rules: "第一文明裝置。可儲存一段最多 **10 分鐘**的親身經歷記憶（視覺+聲音+觸感）。之後任何人接觸裝置可體驗該記憶。**僅能儲存一段記憶，寫入後舊記憶消失。**"
    balance: "純敘事物品。主持人（GM） 可用於劇情伏筆（如儲存某個已故 非玩家角色（NPC） 的最後遺言）。無戰鬥數值影響。"
  - roll: 3
    name: "永恆結晶"
    type: "材料"
    rules: "傳說級念具材料（原見於劇本五黑暗大陸結晶荒原）。使用此材料打造的念具獲得「不可破壞」特性（免疫鏽蝕、斷裂、溶解，但仍可被「除念」解除）。打造需 1 週 + 念能力檢定 難度等級（DC） 20。**1 顆結晶僅夠打造 1 把武器或 1 件防具。**"
    balance: "耐久性 QoL 提升，無直接數值加成。防止 主持人（GM） 破壞玩家裝備——但念具仍可被「除念師」解除。"
  - roll: 4
    name: "門的碎片"
    type: "裝備"
    rules: "門崩落時掉落的結晶碎片（拳頭大小）。持有者每月可使用一次「短距空間跳躍」：**以反應動作瞬間移動至視線範圍內 30m 內的任意位置**。使用後碎片冷卻 **30 天**（遊戲內時間）。不可攜帶他人。"
    balance: "每月 1 次的緊急閃避 / 戰術位移。30m 限制確保無法濫用（不能跳過整個地城）。反應動作意味著可在敵方攻擊前瞬移。"
  - roll: 5
    name: "古代星圖"
    type: "敘事物品"
    rules: "用第一文明的星象語言標註的黑暗大陸地圖。標示了 **3 個從未有人類踏足的區域**座標。解讀需要智力（念知識）難度等級（DC） 22。每個區域 主持人（GM） 可自行設計或從「原創擴展」區域中選取。"
    balance: "純敘事+劇情引導物品。給 主持人（GM） 一個引入新內容的藉口。無戰鬥數值影響。"
  - roll: 6
    name: "翁的鱗片（複製品）"
    type: "消耗品"
    rules: "守門人翁的鱗片仿製品——非原品（不含門的意志），但仍保有部分力量。**一次性使用**：在黑暗大陸進行任意檢定時，可消耗鱗片獲得 **一次自動成功**。僅限黑暗大陸內使用。"
    balance: "一次性「免死金牌」——不是無敵，只是確保一次關鍵檢定不會失敗。與原版守門人鱗片（門認得）有本質區別。"
  - roll: 7
    name: "感情結晶"
    type: "材料"
    rules: "劇本五淚海的產物。可用於製作精神系念具（打造需 1 週 + 念能力檢定 難度等級（DC） 22）。念具效果：賦予一個念能力「情緒感應」的附加效果——**使用該念能力時可感知目標當前的主要情緒**（不需要額外 念量（SP），不佔用 制約誓約點（BP））。"
    balance: "資訊優勢物品。在社交遭遇中特別有用（知道 非玩家角色（NPC） 的真實情緒），但無法讀取具體想法。戰鬥中可用於判斷對手是否恐懼/憤怒。"
  - roll: 8
    name: "逆結晶花"
    type: "消耗品"
    rules: "劇本五結晶荒原的稀有植物（可保存，使用時激活）。效果：① 完全治癒結晶化症（不限階段）② 提供 **12 小時**結晶化免疫 ③ 對已結晶化的生物使用可逆轉結晶化（需 1 小時）。**1 朵花僅供 1 人使用。**"
    balance: "針對性治療物品。在黑暗大陸以外的場景幾乎無用——但若 玩家角色（PC） 再次進入結晶荒原，這是無價之寶。"
  - roll: 9
    name: "布利翁控制核心"
    type: "裝備"
    rules: "劇本六布利翁指揮機械的控制核心（已被重新編程為友善）。召喚 **1 台布利翁偵查機械**：**生命值（HP） 30, 防禦等級（AC） 16, 移動力 20m（飛行）, 無法攻擊**。可共享視覺（範圍 100m）。維持 念量（SP） 消耗 **2 / 回合**。機械被破壞後需 **24 小時**自動修復。"
    balance: "CR4 的偵查單位，純探索輔助——不能戰鬥。2念量（SP）/回合的維持成本確保不能常駐。"
  - roll: 10
    name: "埃之結晶"
    type: "裝備"
    rules: "劇本六接受埃的餽贈後獲得。**永久免疫**以下效果：恐懼、混亂、魅惑、心靈控制、精神攻擊。**不是**隨機掉落——**必須與埃建立友好關係**才可獲得。佔用 1 個飾品槽。"
    balance: "唯一永久免疫物品，但取得條件嚴苛（需與埃對話並拒絕同化，或接受埃的餽贈）。對物理/念攻擊無任何防護——僅免疫精神異常。"
  - roll: 11
    name: "第一文明知識碎片"
    type: "消耗品"
    rules: "第一文明儲存的壓縮知識。使用後（需 8 小時冥想）永久獲得 **1 個指定技能的專精熟練（+4）**。該技能必須是使用者已達「熟練（+2）」的技能。**不可疊加於已達大師（+6）的技能。**意味著：節省 8 經驗點（XP）（熟練→專精的 經驗點（XP） 成本），而不是憑空獲得 +4。"
    balance: "本質是節省 8 經驗點（XP）。不破壞屬性上限（不影響屬性值/制約誓約點（BP）/念量（SP）/生命值（HP）），僅加速技能成長。傳說級 玩家角色（PC） 可獲得 1-2 個，不建議超過 2 個以免技能池氾濫。"
  - roll: 12
    name: "審判官的殘影"
    type: "消耗品"
    rules: "一次性召喚審判官的幻影協助戰鬥。**啟動：標準動作。效果：審判官幻影對 玩家角色（PC） 指定的一個目標發動一次「光之仲裁」——自動命中，造成 4d10 能量傷害（無視物理護甲和念防禦）。使用後殘影消散。**"
    balance: "一次性核彈級輸出。4d10 = 平均 22 傷害，無視所有防禦。足以重創但未必秒殺傳說級敵人（黑爾貝爾 HP500）。使用後永久消失——玩家必須決定何時用掉這唯一的王牌。"

special_items:
  - name: "古神的鱗片"
    source: "委託 #8 友善結局 (d3-1)"
    type: "裝備（飾品槽）"
    rules: "鑲嵌在身體上（取代 1 個飾品槽）。生命值（HP） 歸零時自動觸發——鱗片破碎，生命值（HP） 回復至最大值的 50%。必須在生命值（HP） 歸零後 1 回合內觸發。一次性。"
    limit: "一次性免死金牌，用掉即沒。"
  - name: "黑暗大陸的核心碎片"
    source: "委託 #8 友善結局 (d3-2)"
    type: "敘事物品"
    rules: "拳頭大小黑色結晶，永遠微溫。持有者在黑暗大陸全境生存檢定永久優勢；可感知最近的「門」方向與距離；每月 1 次消耗 20 念量（SP） 創造半徑 10m 安全區（8 小時內不觸發隨機遭遇）。"
    limit: "純探索 QoL，無戰鬥數值影響。"
  - name: "沉睡者的低語"
    source: "委託 #8 友善結局 (d3-3)"
    type: "知識（非物品）"
    rules: "古神將知識刻入記憶，永久獲得一項：①理解所有語言含義 ②感知 1km 內念能力者大致位置 ③獲得第一文明滅亡前最後記憶（含 GM 自訂重大祕密）。"
    limit: "資訊型能力，深刻改變敘事。"
  - name: "終極遺產（初代審判官記憶結晶）"
    source: "委託 #2"
    type: "敘事物品"
    rules: "體驗第一文明創始者完整人生（遊戲內 8 小時）。永久獲得：智力 +1（上限 22）、面對五大災難交涉檢定優勢、知曉古神真名（古神相關檢定 +5）、解鎖隱藏資訊。精神代價：體驗後需意志 難度等級（DC） 22 否則獲得 48 小時存在虛無感。"
    limit: "一次性幻象體驗，效果永久。"
  - name: "反念共振裝置"
    source: "委託 #7（V5 祕密）"
    type: "裝置（場景級）"
    rules: "全球範圍逆向共振波。啟動後範圍內所有念能力者需意志豁免 難度等級（DC） 30：成功→念能力封鎖 24 小時；失敗→永久失去念能力（SP 歸零）。啟動需 72 小時充能。弱點：須置於赤道特定島嶼、釋放巨大念場（方圓 100km 可感知）、可被物理破壞（生命值（HP） 500，防禦等級（AC） 18，無念防禦）、頻率可被逆向工程改為選擇性武器。"
    limit: "玩家可選：摧毀／控制／說服 V5／公開真相，後果各異。"
  - name: "第一文明時間校準裝置"
    source: "委託 #9"
    type: "裝置（可帶走）"
    rules: "圓盤 10cm，永恆結晶供能。效果1 時間緩衝：每日 1 次反應動作，下回合可分割標準動作或移動力×2。效果2 時間印記：每週 1 次留下印記，1 小時內可消耗標準動作返回。效果3 時間回聲（一次性）：回到 1 回合前狀態（生命值（HP）/念量（SP）/位置全還原），記憶保留。"
    limit: "效果3 使用後裝置永久報廢，傳說級角色一生僅 1 次。"
  - name: "黑爾貝爾女王核心結晶"
    source: "委託 #4"
    type: "傳說級材料"
    rules: "直徑 30cm、重 40kg（體質 14+ 可單人攜帶）。1 顆可打造 1 件傳說級武器 + 1 件防具（或 2 件武器）。每件需 2 週 + 念能力檢定 難度等級（DC） 24（可花 50,000J 委託工匠）。可打造：吞噬者之刃（2d8+體質，擊敗強敵永久 +1 傷害，上限 +5）、女王鱗甲（防禦等級（AC） +3 念防禦 +2，生命值（HP） 25% 以下自動回復 2d10）、雙尾戒指（飾品，每回合切換物質/念模式，對應攻擊 +1d6）。"
    limit: "材料型，需打造後使用。"
  - name: "虛空之戒"
    source: "支線委託 #19 地下迷宮"
    type: "稀有級（非傳說）飾品"
    rules: "每日 1 次消耗輔助動作 5m 瞬間移動（需視線可及無人空間）。使用後意志 難度等級（DC） 18，失敗獲 1 級疲勞（可疊加）。"
    limit: "不可攜帶他人、不可穿透障礙、目的地須安全著陸點。"
  - name: "鐵鱗鯊魚叉砲"
    source: "支線委託 #11 可選戰利品"
    type: "重型遠程武器（體質 12+）"
    rules: "傷害 2d10 穿刺，射程 30m，需消耗標準動作裝填。對水生生物傷害 ×1.5。重量 20kg，非戰鬥時需兩人搬運或載具。"
    limit: "重型武器，機動性差。"

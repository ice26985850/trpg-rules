- section: 2.7 怪物隨機經營能力 ⭐ > 能力升級機制 > 升級路徑（四條路線）
  headers:
  - 路線
  - 條件
  - 消耗
  - 效果
  rows:
  - 路線: '**🟢 訓練場打磨**'
    條件: 怪物在訓練場完成訓練（基礎=4回合/強化=8回合/專家=16回合）
    消耗: 訓練場Lv2+(強化), Lv3(專家); 每次訓練消耗◆×(3/6/12)
    效果: 能力升級1檔
  - 路線: '**🟡 實戰進化**'
    條件: 怪物累計參與≥3場戰鬥（普通→強化）或≥10場+擊殺Boss（強化→專家）
    消耗: 自動觸發。怪物必須存活
    效果: 能力升級1檔 + 獲得"老兵"特質（忠誠(LOY)+1）
  - 路線: '**🟠 原型專屬催化**'
    條件: 特定原型可催化對應怪物升級能力：亡靈之主→亡靈怪物/惡魔→惡魔怪物/巫師→變異生物/巨龍→龍類/暗影→暗影怪物/地精→構裝體
    消耗: 消耗◇×3 + ●×1（普通→強化）或 ◇×5 + ●×3（強化→專家）
    效果: 能力升級1檔，且重投一次d66（可選保留原能力或換新）
  - 路線: '**🔴 深淵賜福**'
    條件: GM特殊事件觸發。如深淵魔力潮汐/奈克西斯低語/上古神器激活
    消耗: GM裁定
    效果: 能力直接升級至專家級（跳過強化級），可能附帶額外正面變異
- section: 2.7 怪物隨機經營能力 ⭐ > 能力升級機制 > 傳奇/精英怪物專屬
  headers:
  - 怪物等級
  - 能力槽位
  - 升級方式
  rows:
  - 怪物等級: 普通 (ML1-2)
    能力槽位: 1項，普通級
    升級方式: 可通過四條路線升檔
  - 怪物等級: 精英 (ML3-4)
    能力槽位: 2項（第2項需額外解鎖）
    升級方式: 初始1項強化級。可通過訓練解鎖第2槽位（消耗◆×15）
  - 怪物等級: 傳奇 (ML5+)
    能力槽位: 2項，專家級
    升級方式: 初始1項專家級。可通過深淵賜福解鎖第3槽位

  rows:
  - 聯盟: '**骨冢議會**'
    成員原型: 亡靈
    信條: 秩序至上、死之禮儀
    加入加成: 亡靈招募費-20%、骨鴿情報、骷髏援軍
  - 聯盟: '**深淵軍團**'
    成員原型: 惡魔
    信條: 力量即正義、火焰試煉
    加入加成: 戰鬥怪物CP+1、聯合軍事行動
  - 聯盟: '**暗影網絡**'
    成員原型: 暗影議會
    信條: 信息即權力、互相利用
    加入加成: 每回合情報檢定、暗殺協助+2骰
  - 聯盟: '**自由工匠**'
    成員原型: 地精/巫師/巨龍
    信條: 實用主義、商業優先
    加入加成: 建材-20%、技術研討會、聯合訂單

name: 魔法圖鑑
source_file: 魔法圖鑑.md
table_count: 7
tables:
- section: 法術列表（原 §3.8.3） > 3.8.3 法術列表 > 毀滅系（攻擊法術）
  headers:
  - 法術
  - ◇
  - 等級
  - 效果
  rows:
  - 法術: '**暗影箭**'
    ◇: '1'
    等級: 基礎
    效果: 魔力(ARC) vs 防禦，單體傷害=淨成功數，可穿透1點物理護甲
  - 法術: '**腐蝕之觸**'
    ◇: '2'
    等級: 魔力(ARC)≥3
    效果: 近戰法術。傷害=ARC級×2，附帶每輪1酸蝕傷害×3輪
  - 法術: '**暗影風暴**'
    ◇: '3'
    等級: 魔力(ARC)≥4
    效果: 同房間AOE。所有敵受ARC骰池÷2傷害（各自防禦）
  - 法術: '**湮滅射線**'
    ◇: '4'
    等級: 魔力(ARC)≥5
    效果: 選擇一條直線貫穿2個房間。每房首個敵受ARC骰池傷害
  - 法術: '**靈魂崩解**'
    ◇: '5'
    等級: 魔力(ARC)=5+傳奇
    效果: 單體。無視防禦，傷害=ARC骰池×1.5。消耗額外1●
  - 法術: '**深淵洪流**'
    ◇: '6'
    等級: 終極
    效果: 全層AOE。所有敵受ARC骰池傷害。消耗額外2●。每場戰鬥限1次
  - 法術: '**混沌爆裂**'
    ◇: '3'
    等級: 魔力(ARC)≥3
    效果: 單體。造成ARC骰池傷害，隨機附加燃燒/麻痹/中毒之一
  - 法術: '**虛空箭**'
    ◇: '2'
    等級: 魔力(ARC)≥3
    效果: 遠程。可穿透牆壁/障礙物攻擊視線外目標（需知曉大致位置）
- section: 法術列表（原 §3.8.3） > 3.8.3 法術列表 > 詛咒系（削弱/控制法術）
  headers:
  - 法術
  - ◇
  - 等級
  - 效果
  rows:
  - 法術: '**虛弱詛咒**'
    ◇: '1'
    等級: 基礎
    效果: 單體。目標攻擊骰-2骰，持續2輪
  - 法術: '**黑暗鎖鏈**'
    ◇: '2'
    等級: 魔力(ARC)≥3
    效果: 單體。魔力(ARC) vs 目標防禦，成功=定身2輪+每輪1暗蝕傷害
  - 法術: '**恐懼之語**'
    ◇: '1'
    等級: 基礎
    效果: 視覺範圍內單體。威儀(DOM) vs 意志(WIL)，成功=恐懼2輪（無法主動接近領主）
  - 法術: '**魔力封印**'
    ◇: '3'
    等級: 魔力(ARC)≥4
    效果: 單體。魔力(ARC) vs ARC對抗，成功=目標施法骰池禁用1輪（沉默）
  - 法術: '**命運詛咒**'
    ◇: '4'
    等級: 魔力(ARC)≥5
    效果: 單體。目標下3次檢定取劣勢（擲兩次取劣）
  - 法術: '**羣體虛弱**'
    ◇: '4'
    等級: 魔力(ARC)≥4+傳奇
    效果: 同房間所有敵攻擊骰-1骰，持續2輪
  - 法術: '**記憶侵蝕**'
    ◇: '3'
    等級: 魔力(ARC)≥4
    效果: 單體。魔力(ARC) vs 意志(WIL)，成功=目標忘記一項技能/法術（GM決定），持續整場戰鬥
  - 法術: '**血之詛咒**'
    ◇: 2+●1
    等級: 魔力(ARC)≥3
    效果: 單體。每輪1暗蝕傷害×3輪。每次傷害恢復領主1HP
  - 法術: '**瘋狂低語**'
    ◇: '2'
    等級: 魔力(ARC)≥4
    效果: 同房間所有敵需WIL檢定，失敗=攻擊隨機目標（可能包括隊友）1輪
- section: 法術列表（原 §3.8.3） > 3.8.3 法術列表 > 防禦系（護盾/保護法術）
  headers:
  - 法術
  - ◇
  - 等級
  - 效果
  rows:
  - 法術: '**黑暗護盾**'
    ◇: '1'
    等級: 基礎
    效果: 自身/鄰接怪物。防禦骰池+2骰，持續至受擊一次或3輪
  - 法術: '**魔力屏障**'
    ◇: '2'
    等級: 魔力(ARC)≥3
    效果: 同房間所有友方獲得魔法防禦骰池（ARC骰池分享），持續2輪
  - 法術: '**反魔法力場**'
    ◇: '3'
    等級: 魔力(ARC)≥4
    效果: 自身。ARC骰池對抗所有施法，成功=法術被吸收（轉換◇×1）
  - 法術: '**不滅契約**'
    ◇: '4'
    等級: 魔力(ARC)≥5
    效果: 自身。HP歸零時自動觸發：立刻恢復2d6 HP，每場戰鬥限1次
  - 法術: '**骨甲術**'
    ◇: '2'
    等級: 魔力(ARC)≥2
    效果: 自身/怪物。物理傷害減免=魔力(ARC)/2（向下取整），持續3輪
  - 法術: '**羣體護盾**'
    ◇: '3'
    等級: 魔力(ARC)≥4
    效果: 同層所有怪物防禦骰+1骰，持續2輪
  - 法術: '**魔法反射**'
    ◇: '4'
    等級: 魔力(ARC)≥5
    效果: 反應法術。被單體法術攻擊時觸發，ARC對抗，成功=法術反彈回施法者
- section: 法術列表（原 §3.8.3） > 3.8.3 法術列表 > 召喚/亡靈系
  headers:
  - 法術
  - ◇
  - 等級
  - 效果
  rows:
  - 法術: '**骷髏復甦**'
    ◇: 2+●1
    等級: 基礎
    效果: 從陣亡冒險者屍體召喚CP1骷髏兵。每額外1◇→戰力(CP)+1(上限CP3)。持續至戰鬥結束
  - 法術: '**暗影生物召喚**'
    ◇: '3'
    等級: 魔力(ARC)≥3
    效果: 召喚CP2暗影獸(獨立行動)，持續3輪。每額外1◇→+1戰力(CP)
  - 法術: '**亡靈軍團**'
    ◇: 5+●3
    等級: 魔力(ARC)≥4+亡靈專屬
    效果: 召喚CP1骷髏×ARC值。不需要屍體——直接從深淵裂隙召喚。戰後崩解
  - 法術: '**惡魔之門**'
    ◇: 5+●2
    等級: 魔力(ARC)≥5+惡魔專屬
    效果: 召喚CP3惡魔僕從×DOM值。持續5輪。每場戰鬥限1次
  - 法術: '**靈魂傀儡**'
    ◇: 3+●2
    等級: 魔力(ARC)≥4
    效果: 將俘虜短暫轉化爲戰鬥傀儡（CP=PL+2）。持續3輪，結束後俘虜WIL永久-1
  - 法術: '**深淵獵犬**'
    ◇: '2'
    等級: 魔力(ARC)≥2
    效果: 召喚CP1地獄犬×2只，持續3輪。追蹤嗅覺可自動鎖定逃跑/隱身的敵人位置
  - 法術: '**元素僕從**'
    ◇: '3'
    等級: 魔力(ARC)≥3
    效果: 召喚CP2小型元素(火/冰/雷/石選一，對應元素傷害)，持續4輪
  - 法術: '**骨龍投影**'
    ◇: 6+●5
    等級: 魔力(ARC)=5+亡靈專屬+傳奇
    效果: 召喚骨龍幻影(戰力(CP)6)，僅持續2輪但無視防禦減免。每場戰役限1次
- section: 法術列表（原 §3.8.3） > 3.8.3 法術列表 > 實用系（非戰鬥法術）
  headers:
  - 法術
  - ◇
  - 等級
  - 效果
  rows:
  - 法術: '**暗視術**'
    ◇: '1'
    等級: 基礎
    效果: 目標獲得黑暗視覺，持續1遠征日/整場地城戰鬥
  - 法術: '**深淵低語**'
    ◇: '1'
    等級: 基礎
    效果: 向1個已知地城發送25字心靈傳訊（需使館Lv1）
  - 法術: '**物品鑑定**'
    ◇: '1'
    等級: 基礎
    效果: 鑑定1件魔法物品，獲知其功能和隱藏屬性
  - 法術: '**傳送門**'
    ◇: '3'
    等級: 魔力(ARC)≥4
    效果: 消耗1行動，自身從王座廳傳送至任一防禦層（戰鬥輪）或從地城傳送至深淵任意大使館位置（非戰鬥）
  - 法術: '**幻象**'
    ◇: '2'
    等級: 魔力(ARC)≥3
    效果: 製造持續3輪的逼真幻象（虛假怪物/虛假陷阱/虛假地形）。CUN對抗冒險者偵察
  - 法術: '**靈魂追溯**'
    ◇: '3'
    等級: 魔力(ARC)≥4
    效果: 觸摸俘虜，從俘虜記憶中提取1條具體情報（GM必須回答）
  - 法術: '**暗影斗篷**'
    ◇: '2'
    等級: 魔力(ARC)≥2
    效果: 自身隱身2輪。攻擊或施法後隱身解除。遠征中避免遭遇時CUN+2骰
  - 法術: '**深淵修復**'
    ◇: '2'
    等級: 魔力(ARC)≥2
    效果: 修復1個陷阱使其恢復觸發狀態，或修復1個房間的受損狀態
  - 法術: '**語言通曉**'
    ◇: '1'
    等級: 基礎
    效果: 持續1遠征日，可閱讀/說出所有地表語言。用於滲透/偵察任務
  - 法術: '**虛空貯藏**'
    ◇: '2'
    等級: 魔力(ARC)≥3
    效果: 將1件物品（最大體積=1建材單位）存入虛空，永久保存，隨時可取
- section: 法術列表（原 §3.8.3） > 3.8.3 法術列表 > 變形/強化系
  headers:
  - 法術
  - ◇
  - 等級
  - 效果
  rows:
  - 法術: '**暗影形態**'
    ◇: '2'
    等級: 魔力(ARC)≥3
    效果: 變爲半實體暗影，物理傷害-50%，可穿過窄縫，持續2輪
  - 法術: '**巨大化**'
    ◇: '3'
    等級: 魔力(ARC)≥4
    效果: 自身/怪物。體型翻倍，戰力(CP)+2，HP+5。但防禦骰-1骰（更大目標）。持續3輪
  - 法術: '**石膚術**'
    ◇: '2'
    等級: 魔力(ARC)≥3
    效果: 自身/怪物。物理防禦+3骰。移動-1房間（沉重）。持續3輪
  - 法術: '**深淵融合**'
    ◇: 4+●2
    等級: 魔力(ARC)≥4
    效果: 領主與1只怪物暫時融合→共享HP池，骰池取兩者最高值，持續2輪。結束後領主受1d3傷害

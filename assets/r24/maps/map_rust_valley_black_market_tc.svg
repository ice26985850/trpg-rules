<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 900" font-family="Georgia, serif">
  <rect width="680" height="900" fill="#151510"/>
  <rect x="20" y="20" width="640" height="860" rx="8" fill="#2a2a15" stroke="#8b8b45" stroke-width="2"/>
  
  <rect x="20" y="20" width="640" height="60" fill="#15150a" opacity="0.8"/>
  <text x="340" y="58" text-anchor="middle" font-size="22" font-weight="bold" fill="#d4c060" font-family="Georgia, serif">廢鐵峽谷黑市 — 金牙的鑄幣廠</text>
  <text x="340" y="75" text-anchor="middle" font-size="12" fill="#aa9944" font-family="Georgia, serif">§5.6.3 NPC地城 #14 · 自由工匠 · 遠古巨龙 · Lv11</text>
  
  <defs>
    <pattern id="ironGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="none" stroke="#3a3a25" stroke-width="0.3"/>
    </pattern>
  </defs>
  <rect x="40" y="100" width="600" height="760" fill="url(#ironGrid)" rx="4"/>
  
  <!-- Canyon walls -->
  <path d="M40 100 L40 860 L120 860 L120 100 Z" fill="#3a3a25" opacity="0.3"/>
  <path d="M560 100 L560 860 L640 860 L640 100 Z" fill="#3a3a25" opacity="0.3"/>
  
  <!-- Auction hall -->
  <rect x="220" y="350" width="240" height="120" rx="10" fill="#3a3a25" stroke="#d4c060" stroke-width="3"/>
  <text x="340" y="405" text-anchor="middle" font-size="16" fill="#d4c060" font-weight="bold">拍賣大廳</text>
  <text x="340" y="425" text-anchor="middle" font-size="11" fill="#aa9944">格里克斯的金幣山</text>
  <text x="340" y="445" text-anchor="middle" font-size="10" fill="#887733">◆50起拍 傳奇物品</text>
  
  <!-- Entrances and stalls -->
  <rect x="310" y="600" width="60" height="40" rx="5" fill="#2a2a15" stroke="#8b8b45" stroke-width="2"/>
  <text x="340" y="625" text-anchor="middle" font-size="10" fill="#aa9944">入口</text>
  
  <rect x="140" y="200" width="80" height="60" rx="5" fill="#2a2a15" stroke="#8b8b45" stroke-width="1.5"/>
  <text x="180" y="230" text-anchor="middle" font-size="10" fill="#aa9944">建材攤位</text>
  <rect x="140" y="290" width="80" height="60" rx="5" fill="#2a2a15" stroke="#8b8b45" stroke-width="1.5"/>
  <text x="180" y="320" text-anchor="middle" font-size="10" fill="#aa9944">機械部件</text>
  <rect x="140" y="380" width="80" height="60" rx="5" fill="#2a2a15" stroke="#8b8b45" stroke-width="1.5"/>
  <text x="180" y="410" text-anchor="middle" font-size="10" fill="#aa9944">怪物流通</text>
  
  <rect x="460" y="200" width="80" height="60" rx="5" fill="#2a2a15" stroke="#d4c060" stroke-width="1.5"/>
  <text x="500" y="230" text-anchor="middle" font-size="10" fill="#d4c060">貴賓室A</text>
  <rect x="460" y="290" width="80" height="60" rx="5" fill="#2a2a15" stroke="#d4c060" stroke-width="1.5"/>
  <text x="500" y="320" text-anchor="middle" font-size="10" fill="#d4c060">貴賓室B</text>
  <rect x="460" y="380" width="80" height="60" rx="5" fill="#2a2a15" stroke="#d4c060" stroke-width="1.5"/>
  <text x="500" y="410" text-anchor="middle" font-size="10" fill="#d4c060">貴賓室C</text>
  
  <circle cx="340" cy="200" r="40" fill="#3a3a25" stroke="#d4c060" stroke-width="2"/>
  <text x="340" y="205" text-anchor="middle" font-size="11" fill="#d4c060" font-weight="bold">寶庫</text>
  
  <!-- Assassination zone -->
  <circle cx="280" cy="730" r="25" fill="#2a1515" stroke="#8b3a3a" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="280" y="730" text-anchor="middle" font-size="9" fill="#cc6644">刺客潛入點</text>
  
  <!-- Connections -->
  <line x1="340" y1="240" x2="340" y2="350" stroke="#8b8b45" stroke-width="2" opacity="0.5"/>
  <line x1="180" y1="260" x2="180" y2="290" stroke="#8b8b45" stroke-width="2" opacity="0.3"/>
  <line x1="180" y1="350" x2="180" y2="380" stroke="#8b8b45" stroke-width="2" opacity="0.3"/>
  <line x1="500" y1="260" x2="500" y2="290" stroke="#8b8b45" stroke-width="2" opacity="0.3"/>
  <line x1="500" y1="350" x2="500" y2="380" stroke="#8b8b45" stroke-width="2" opacity="0.3"/>
  
  <!-- Annotations -->
  <rect x="50" y="500" width="260" height="110" rx="5" fill="#2a2a15" stroke="#5a5a30" stroke-width="1"/>
  <text x="65" y="520" font-size="11" fill="#d4c060" font-weight="bold">📍 劇本使用標註</text>
  <text x="65" y="538" font-size="10" fill="#aa9944">• Act 2-6 深淵黑市拍賣</text>
  <text x="65" y="555" font-size="10" fill="#aa9944">• 社交+拍賣+暗殺事件鏈</text>
  
  <rect x="370" y="500" width="260" height="110" rx="5" fill="#2a2a15" stroke="#5a5a30" stroke-width="1"/>
  <text x="385" y="520" font-size="11" fill="#d4c060" font-weight="bold">⚙ 特性標註</text>
  <text x="385" y="538" font-size="10" fill="#aa9944">• 蒸汽管道+機械風格</text>
  <text x="385" y="555" font-size="10" fill="#aa9944">• 外交態度：非常友好(+5)</text>
  
  <!-- Legend -->
  <rect x="50" y="650" width="580" height="60" rx="5" fill="#2a2a15" stroke="#5a5a30" stroke-width="1"/>
  <text x="65" y="670" font-size="11" fill="#d4c060">圖例：</text>
  <rect x="130" y="662" width="15" height="10" fill="#2a2a15" stroke="#8b8b45" stroke-width="1"/>
  <text x="152" y="672" font-size="10" fill="#aa9944">攤位</text>
  <circle cx="215" cy="667" r="5" fill="#2a2a15" stroke="#d4c060" stroke-width="1"/>
  <text x="228" y="672" font-size="10" fill="#aa9944">貴賓</text>
  <circle cx="285" cy="667" r="5" fill="#2a2a15" stroke="#d4c060" stroke-width="1"/>
  <text x="298" y="672" font-size="10" fill="#aa9944">寶庫</text>
  <text x="370" y="672" font-size="10" fill="#aa9944">峽谷地形天然防衛</text>
  
  <!-- Compass -->
  <g transform="translate(600, 770)">
    <circle r="30" fill="#2a2a15" stroke="#5a5a30" stroke-width="1"/>
    <line x1="0" y1="-25" x2="0" y2="-10" stroke="#d4c060" stroke-width="2"/>
    <text y="-28" text-anchor="middle" font-size="10" fill="#d4c060">北</text>
  </g>
</svg>
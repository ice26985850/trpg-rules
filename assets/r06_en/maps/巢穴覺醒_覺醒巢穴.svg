<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 480" font-family="Microsoft JhengHei, sans-serif">
  <!-- Background -->
  <rect width="680" height="480" fill="#1a1a2e"/>

  <!-- Zone: Inner Nest -->
  <rect x="30" y="200" width="370" height="230" rx="10" fill="#2d1045" opacity="0.4"/>

  <!-- Zone: Exit Direction -->
  <rect x="120" y="30" width="200" height="170" rx="10" fill="#1a3d2e" opacity="0.4"/>

  <!-- Connection A→B -->
  <line x1="280" y1="330" x2="380" y2="280" stroke="#8B5CF6" stroke-width="2"/>

  <!-- Connection A→C -->
  <line x1="280" y1="300" x2="220" y2="150" stroke="#8B5CF6" stroke-width="2"/>

  <!-- Connection A→D -->
  <line x1="220" y1="350" x2="140" y2="380" stroke="#8B5CF6" stroke-width="2"/>

  <!-- Connection A→E -->
  <line x1="280" y1="380" x2="330" y2="420" stroke="#8B5CF6" stroke-width="2"/>

  <!-- A: Awakening Hall -->
  <rect x="200" y="280" width="100" height="60" rx="8" fill="#4B0082" stroke="#8B5CF6" stroke-width="2"/>
  <text x="250" y="305" text-anchor="middle" fill="white" font-size="12" font-weight="bold">Awakening Hall</text>
  <text x="250" y="325" text-anchor="middle" fill="#ccc" font-size="9">Start</text>

  <!-- B: Water Source -->
  <rect x="340" y="240" width="80" height="50" rx="8" fill="#4169E1" stroke="#6B8CF6" stroke-width="1.5"/>
  <text x="380" y="260" text-anchor="middle" fill="white" font-size="11">Water Source</text>
  <text x="380" y="278" text-anchor="middle" fill="#ccc" font-size="8">Rest point</text>

  <!-- C: Nest Passage -->
  <rect x="160" y="100" width="100" height="50" rx="8" fill="#2E8B57" stroke="#4CAF50" stroke-width="1.5"/>
  <text x="210" y="120" text-anchor="middle" fill="white" font-size="11">Nest Passage</text>
  <text x="210" y="138" text-anchor="middle" fill="#ccc" font-size="8">To exit</text>

  <!-- D: Corpse Pile -->
  <rect x="60" y="350" width="90" height="50" rx="8" fill="#8B4513" stroke="#A0522D" stroke-width="1.5"/>
  <text x="105" y="370" text-anchor="middle" fill="white" font-size="11">Corpse Pile</text>
  <text x="105" y="388" text-anchor="middle" fill="#FFD700" font-size="8">Loot point</text>

  <!-- E: Crevice -->
  <rect x="290" y="400" width="80" height="50" rx="8" fill="#DC143C" stroke="#FF4444" stroke-width="1.5"/>
  <text x="330" y="420" text-anchor="middle" fill="white" font-size="11">Crevice</text>
  <text x="330" y="438" text-anchor="middle" fill="#ff9999" font-size="8">⚠ Hazard</text>

  <!-- Title -->
  <text x="340" y="25" text-anchor="middle" fill="#8B5CF6" font-size="16" font-weight="bold">Nest Awakening — Awakening Nest</text>
  <text x="340" y="45" text-anchor="middle" fill="#999" font-size="10">S1 Scene One: Awakening</text>

  <!-- Legend -->
  <rect x="460" y="380" width="12" height="12" rx="2" fill="#4B0082"/>
  <text x="478" y="391" fill="#ccc" font-size="10">Start</text>
  <rect x="540" y="380" width="12" height="12" rx="2" fill="#2E8B57"/>
  <text x="558" y="391" fill="#ccc" font-size="10">Exit</text>
  <rect x="460" y="400" width="12" height="12" rx="2" fill="#DC143C"/>
  <text x="478" y="411" fill="#ccc" font-size="10">Hazard</text>
  <rect x="540" y="400" width="12" height="12" rx="2" fill="#8B4513"/>
  <text x="558" y="411" fill="#ccc" font-size="10">Loot point</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 540" font-family="Microsoft JhengHei, sans-serif">
  <rect width="680" height="540" fill="#0d1a0d"/>

  <!-- Arena outer frame (circular arena) -->
  <ellipse cx="340" cy="280" rx="300" ry="230" fill="none" stroke="#4B0082" stroke-width="3" stroke-dasharray="10,5"/>
  <ellipse cx="340" cy="280" rx="280" ry="215" fill="#0a150a" stroke="#2E8B57" stroke-width="1.5" opacity="0.5"/>

  <!-- Zone divider lines -->
  <line x1="340" y1="50" x2="340" y2="510" stroke="#1a3a1a" stroke-width="1" stroke-dasharray="4,8"/>
  <line x1="60" y1="280" x2="620" y2="280" stroke="#1a3a1a" stroke-width="1" stroke-dasharray="4,8"/>

  <!-- ====== North: Central Arena (final) ====== -->
  <!-- H: Central Arena -->
  <rect x="270" y="55" width="140" height="70" rx="12" fill="#DC143C" stroke="#FF4444" stroke-width="3"/>
  <text x="340" y="80" text-anchor="middle" fill="white" font-size="12" font-weight="bold">⚔ Central Arena</text>
  <text x="340" y="98" text-anchor="middle" fill="#ffaaaa" font-size="8">Finals venue · Sealed by energy barrier</text>
  <text x="340" y="113" text-anchor="middle" fill="#ffcccc" font-size="8">⚠ Champion Kane</text>

  <!-- I: Seal Core -->
  <rect x="290" y="5" width="100" height="42" rx="8" fill="#FFD700" stroke="#FFA500" stroke-width="2"/>
  <text x="340" y="22" text-anchor="middle" fill="#1a1a1a" font-size="10" font-weight="bold">🔒 Seal Core</text>
  <text x="340" y="37" text-anchor="middle" fill="#333" font-size="7">Key to breaking the seal</text>

  <!-- Connection H→I -->
  <line x1="340" y1="55" x2="340" y2="47" stroke="#FFD700" stroke-width="2" stroke-dasharray="4,2"/>

  <!-- ====== East: Volcano Plateau ====== -->
  <!-- E: Volcano Plateau -->
  <rect x="530" y="110" width="110" height="70" rx="10" fill="#8B0000" stroke="#DC143C" stroke-width="2.5"/>
  <text x="585" y="135" text-anchor="middle" fill="white" font-size="12" font-weight="bold">🔥 Volcano Plateau</text>
  <text x="585" y="153" text-anchor="middle" fill="#ff8888" font-size="8">Eastern territory</text>
  <text x="585" y="168" text-anchor="middle" fill="#ffcccc" font-size="8">⚠ Zarakth</text>

  <!-- Connection E→I (hidden passage) -->
  <line x1="530" y1="130" x2="390" y2="30" stroke="#FFD700" stroke-width="1.5" stroke-dasharray="6,2" opacity="0.5"/>

  <!-- ====== South: Corrupted Swamp ====== -->
  <!-- F: Corrupted Swamp -->
  <rect x="230" y="420" width="110" height="65" rx="10" fill="#2d4a1a" stroke="#6B8B3A" stroke-width="2"/>
  <text x="285" y="445" text-anchor="middle" fill="white" font-size="12" font-weight="bold">☠ Corrupted Swamp</text>
  <text x="285" y="463" text-anchor="middle" fill="#aaff88" font-size="8">South · Mutant creatures</text>
  <text x="285" y="478" text-anchor="middle" fill="#ff8888" font-size="8">⚠ Constitution DC 14 per round</text>

  <!-- Connection C→F -->
  <line x1="340" y1="340" x2="310" y2="420" stroke="#6B8B3A" stroke-width="1.5"/>

  <!-- ====== West: Ruined Tower ====== -->
  <!-- G: Ruined Tower -->
  <rect x="50" y="200" width="90" height="60" rx="8" fill="#4B0082" stroke="#8B5CF6" stroke-width="2"/>
  <text x="95" y="223" text-anchor="middle" fill="white" font-size="12" font-weight="bold">🏚 Ruined Tower</text>
  <text x="95" y="241" text-anchor="middle" fill="#FFD700" font-size="8">📋 Ancient ruins · Loot point</text>

  <!-- Connection B→G -->
  <line x1="140" y1="330" x2="95" y2="260" stroke="#8B5CF6" stroke-width="1.5"/>
  <!-- Connection C→G -->
  <line x1="280" y1="310" x2="140" y2="240" stroke="#8B5CF6" stroke-width="1.5"/>

  <!-- ====== Center ====== -->
  <!-- C: Gathering Stone (safe zone) -->
  <rect x="270" y="270" width="140" height="65" rx="12" fill="#2E8B57" stroke="#4CAF50" stroke-width="2.5"/>
  <text x="340" y="295" text-anchor="middle" fill="white" font-size="13" font-weight="bold">🕊 Gathering Stone</text>
  <text x="340" y="313" text-anchor="middle" fill="#90EE90" font-size="9">Neutral zone · Combat forbidden</text>
  <text x="340" y="327" text-anchor="middle" fill="#ccc" font-size="8">NPC gathering point</text>

  <!-- D: Challenge Stele -->
  <rect x="450" y="290" width="100" height="55" rx="8" fill="#FF8C00" stroke="#FFA500" stroke-width="2.5"/>
  <text x="500" y="312" text-anchor="middle" fill="white" font-size="11" font-weight="bold">⚡ Challenge Stele</text>
  <text x="500" y="330" text-anchor="middle" fill="#ffe0b2" font-size="8">Declare 1v1 challenge</text>

  <!-- Connection C↔D -->
  <line x1="410" y1="305" x2="450" y2="310" stroke="#FFA500" stroke-width="2"/>
  <!-- Connection C→H -->
  <line x1="340" y1="270" x2="340" y2="125" stroke="#DC143C" stroke-width="2"/>
  <!-- Connection C→E -->
  <line x1="410" y1="295" x2="530" y2="145" stroke="#DC143C" stroke-width="2" stroke-dasharray="8,3"/>

  <!-- A: Entry Point -->
  <rect x="230" y="370" width="90" height="45" rx="8" fill="#4B0082" stroke="#8B5CF6" stroke-width="2.5"/>
  <text x="275" y="388" text-anchor="middle" fill="white" font-size="11" font-weight="bold">📍 Entry Point</text>
  <text x="275" y="404" text-anchor="middle" fill="#aaa" font-size="8">Start · Initial rank #15</text>

  <!-- Connection A→B, A→C, A→D -->
  <line x1="250" y1="370" x2="160" y2="340" stroke="#8B5CF6" stroke-width="2"/>
  <line x1="275" y1="370" x2="310" y2="335" stroke="#8B5CF6" stroke-width="2"/>
  <line x1="320" y1="375" x2="470" y2="330" stroke="#8B5CF6" stroke-width="2"/>

  <!-- B: Mutant Forest -->
  <rect x="50" y="300" width="100" height="60" rx="10" fill="#1a3d2e" stroke="#2E8B57" stroke-width="2"/>
  <text x="100" y="323" text-anchor="middle" fill="white" font-size="11" font-weight="bold">🌳 Mutant Forest</text>
  <text x="100" y="341" text-anchor="middle" fill="#90EE90" font-size="8">Evolution plants · Trees with eyes</text>

  <!-- Title -->
  <text x="340" y="518" text-anchor="middle" fill="#2E8B57" font-size="15" font-weight="bold">Apex of the Food Chain — Evolution Arena</text>
  <text x="340" y="534" text-anchor="middle" fill="#888" font-size="9">S4 · 47 Evolvers · Only the strongest may leave</text>

  <!-- Legend -->
  <g transform="translate(460, 380)">
    <rect x="0" y="0" width="10" height="10" rx="2" fill="#4B0082"/><text x="15" y="10" fill="#aaa" font-size="8">Start</text>
    <rect x="0" y="13" width="10" height="10" rx="2" fill="#2E8B57"/><text x="15" y="23" fill="#aaa" font-size="8">Safe Zone</text>
    <rect x="0" y="26" width="10" height="10" rx="2" fill="#DC143C"/><text x="15" y="36" fill="#aaa" font-size="8">BOSS</text>
    <rect x="0" y="39" width="10" height="10" rx="2" fill="#FFD700"/><text x="15" y="49" fill="#aaa" font-size="8">Seal</text>
  </g>
</svg>

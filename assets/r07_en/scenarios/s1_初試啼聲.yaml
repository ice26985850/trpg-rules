# Earth Master TRPG Scenario S1: First Cry — "The Petty Landlord's Tomb"
# Format: YAML (convertible to briefing_package)

scenario_id: S1
title: "First Cry — The Petty Landlord's Tomb"
subtitle: "The first tomb. The last rest."
level_range: "1-3"
difficulty: "Simple"
sessions: "1-2"
region: "Central Plains (Henan countryside)"
setting_year: 1925

# Synopsis
synopsis: |
  A petty landlord's Third Concubine was recently buried. It should have been an ordinary funeral, but strange things began happening in the village —
  roosters stopped crowing, the well water turned bitter, and infants cried every night. The village chief hired the players to investigate.
  This is a small tomb and should hold no supernatural threat — yet the grass atop the grave withered yellow overnight.
  The Third Concubine did not die naturally — she was poisoned by the First Wife. Her resentment is fermenting in the tomb,
  and she is in the "Fresh Corpse" stage — the perfect live-combat training target for a new Earth Master.

# Objectives
objectives:
  - Investigate the source of the village's strange occurrences
  - Enter the Third Concubine's tomb
  - Deal with the supernatural threat in the tomb
  - Expose the truth

# Key NPCs
npcs:
  - id: npc_village_chief
    name: "Village Chief Old Zhou"
    role: "Client"
    attitude: "Anxious, half-doubting of Earth Masters"
    secret: "He knows there was conflict between the First Wife and the Third Concubine, but dares not speak of it"
    stats: "None (ordinary person)"

  - id: npc_first_wife
    name: "The First Wife"
    role: "Obstacle"
    attitude: "Outwardly grieving, inwardly guilt-ridden"
    secret: "A maid witnessed her poisoning"
    stats: "None (ordinary person)"

  - id: npc_concubine_ghost
    name: "Third Concubine's Lingering Spirit"
    role: "Tomb Lord"
    attitude: "Sorrowful, longing for justice"
    secret: "Willing to be released, but wants the truth exposed"
    stats:
      type: "Lingering Spirit (Fresh Corpse stage)"
      cr: 0.5
      hp: 12
      def: 5
      attacks:
        - "Instinctive Swing: 2d10+1 vs DEF, Hit: 1d4"
      weakness: "Sunlight, Evil-Dispelling Talisman instant-kill, revealing the truth allows peaceful release"

  - id: npc_maid
    name: "Little Maid"
    role: "Witness"
    attitude: "Terrified — fears the First Wife will silence her"
    secret: "Saw the First Wife put something in the soup"

# Tomb Structure
tomb_structure:
  type: "Small Tomb"
  chambers:
    - id: passage
      name: "Passage"
      length_m: 8
      description: "Narrow earthen tunnel, slight cave-in risk"
      threats: ["Cave-in risk (Agility DC 10 to avoid)"]

    - id: main_chamber
      name: "Single Chamber"
      size: "3m square"
      contents:
        - "Wooden coffin (ordinary material)"
        - "A few burial goods (silver hairpin, jade bracelet, rouge box)"
        - "Corner jar (placed by the First Wife — contains poison residue)"

# Main Encounters
encounters:
  - id: enc_village_investigation
    name: "Investigate the Village"
    type: "Exploration/Social"
    dc: 8
    description: "Gather clues, interrogate villagers. Success yields info on the poison jar."

  - id: enc_find_tomb
    name: "Open the Tomb"
    type: "Exploration"
    dc: 10
    description: "Find the correct passage location. Failure may dig wrong or trigger a cave-in."

  - id: enc_tomb_collapse
    name: "Tomb Cave-in"
    type: "Exploration"
    dc: 8
    description: "The passage has cave-in risk. Passive perception — GM secretly rolls perception."

  - id: enc_new_corpse
    name: "Third Concubine (Fresh Corpse)"
    type: "Combat/Social"
    ttv: 2
    description: |
      Opening Roll d6=3. Fresh Corpse ×1. Weak combat ability.
      If players show respect or mention the First Wife's poisoning, the Third Concubine's lingering spirit stops attacking and tries to communicate.
      Can be soothed through dialogue — no combat needed.

  - id: enc_truth_reveal
    name: "Truth Revelation"
    type: "Social"
    dc: 10
    description: "Make the First Wife confess or let the villagers know the truth."

# Key Items
key_items:
  - id: item_rouge_box
    name: "Rouge Box"
    type: "Obsession Vessel"
    description: "The Third Concubine's obsession vessel. If returned to her family, gain village reputation."
    value: "Reputation +2"

  - id: item_silver_hairpin
    name: "Silver Hairpin"
    type: "Clean Antique"
    value_ocean: 30
    description: "Can be sold normally."

  - id: item_poison_jar
    name: "Poison Jar"
    type: "Key Evidence"
    description: "Evidence used against the First Wife."

# Multiple Endings
endings:
  - id: ending_peaceful
    name: "Perfect Release"
    condition: "Expose the truth + soothe the Third Concubine"
    result: "Village reputation +3, Third Concubine rests, First Wife arrested."

  - id: ending_forced
    name: "Forced Suppression"
    condition: "Directly destroy the Third Concubine without resolving her obsession"
    result: "Reputation +1, but the Third Concubine's resentment transfers to the rouge box — may return in the future."

  - id: ending_bribe
    name: "Compromise"
    condition: "Accept the First Wife's bribe, conceal the truth"
    result: "Gain 200 Silver Dollars, but reputation −2, Third Concubine's resentment grows."

  - id: ending_failure
    name: "Failure"
    condition: "Defeated by the Third Concubine / flee"
    result: "Village falls into panic, requires a higher-level Earth Master to handle."

# Rewards
rewards:
  xp: 100
  money: "0-200 Silver Dollars (depends on ending)"
  reputation: "−2 to +3 (depends on ending)"

# Scale Adjustments
scale_adjustments:
  solo:
    adjustments:
      - "Fresh Corpse HP halved (12→6)"
      - "Village chief sends a brave villager to follow (NPC companion)"
      - "Yin-energy-related checks DC +2"
    npc_companion:
      name: "Da Niu"
      role: "villager volunteer"
      stats: "Agility 3, Courage 4, HP 19. No combat training; can help carry things and provide light."

  duo: "Standard difficulty"
  trio: "Standard difficulty"
  quad: "Add an extra Fresh Corpse (total 2) or have the First Wife send thugs to interfere"

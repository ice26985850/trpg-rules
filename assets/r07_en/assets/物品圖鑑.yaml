      - Item: Black Dog Blood (1 bottle)
        'Sale Price (Silver Dollar)': '2'
        'Weight (kg)': '2'
        Effect: "Splash on Jiangshi: next turn attacks at Disadvantage + Evil-Dispelling Talisman effect +2. Enhance protective talisman: blocks twice"

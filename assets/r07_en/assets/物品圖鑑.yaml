Title: Earth Master TRPG — Item Compendium
Sections:
- Name: I. Rarity System
  Subsections: []
  Blocks:
  - Type: table
    Headers:
    - Rarity
    - Mark
    - Acquisition Method
    Rows:
    - Rarity: Common
      Mark: ◇ White
      Acquisition Method: Shop Purchase
    - Rarity: Refined
      Mark: ◆ Green
      Acquisition Method: Specific shops, larger towns
    - Rarity: Rare
      Mark: ◈ Blue
      Acquisition Method: Antique dealers, found in tombs
    - Rarity: Very Rare
      Mark: ✦ Purple
      Acquisition Method: Deep tombs, heirloom items
    - Rarity: Legendary
      Mark: ★ Gold
      Acquisition Method: Unique, GM's discretion
  - Type: paragraph
    Content: '---'
- Name: II. Armor
  Subsections: []
  Blocks:
  - Type: table
    Headers:
    - Armor
    - Rarity
    - 'Price (Silver Dollar)'
    - 'Weight (kg)'
    - Defense Modifier
    - Notes
    Rows:
    - Armor: No Armor
      Rarity: —
      'Price (Silver Dollar)': —
      'Weight (kg)': —
      Defense Modifier: '+0'
      Notes: Pure evasion via Agility
    - Armor: Thick Cloth
      Rarity: ◇
      'Price (Silver Dollar)': '1'
      'Weight (kg)': '1'
      Defense Modifier: '+1'
      Notes: Basic protection, no effect on Agility checks
    - Armor: Leather Armor
      Rarity: ◇
      'Price (Silver Dollar)': '8'
      'Weight (kg)': '2'
      Defense Modifier: '+2'
      Notes: Light protection, Stealth −1
    - Armor: Heart-Protector Mirror
      Rarity: ◆
      'Price (Silver Dollar)': '15'
      'Weight (kg)': '3'
      Defense Modifier: '+2'
      Notes: Additional −1 physical damage (stacks with Iron Body)
  - Type: paragraph
    Content: '---'

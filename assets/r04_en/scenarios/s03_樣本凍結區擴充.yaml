# Sample Freeze Zone Expansion — Frozen Wasteland TRPG (structured index)
# This file is organized from the same-named .md, for the website to offer .md / .yaml dual-format download.
# This expansion contains 11 complete Freeze Zone samples, covering the full difficulty gradient from novice to legendary;
# each Freeze Zone can be used independently, or strung together within a campaign. Full thaw parameters and layout are in the .md.
# Free structure: this file presents each Freeze Zone as a zones list, non-mandatory fields.
source_md: "s03_樣本凍結區擴充.md"

name: "Sample Freeze Zone Expansion"

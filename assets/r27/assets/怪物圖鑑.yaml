    dv: 11
    命中: '+3'
    傷害: 2d6
    特殊: 無視 DR 3
    cr: 0.5
  - 雜兵類型: 忍者
    hp: 15
    dv: 16
    命中: '+4'
    傷害: 1d6+2
    特殊: 潛行優位
    cr: 2
  batch_rules:
  - 4–5 名相同雜兵 → 合併為 1 個「集群」
  - 集群 HP = 單體 HP × 數量 × 0.7
  - 集群攻擊：擲 1 次命中，每超出 DV 3 點多造成 1 次基礎傷害
  - 集群 HP 低於 50%：攻擊 −1
  - 集群 HP 低於 25%：潰散

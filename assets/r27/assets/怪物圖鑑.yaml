# 獸人戰國 TRPG —— 怪物圖鑑（YAML 結構化版）
monsters:
  minion:
  - name: 足輕
    type: 獸人（任意族）
    cr: 0.25
    attributes:
      劍: 2
      體: 3
      妖: 1
      敏: 2
      魂: 1
    combat:
      hp: 8
      dv: 12
      dr: 0
      speed: 6
    attacks:
    - name: 打刀
      hit: '+2'
      damage: 1d6（斬擊）
    special: 3 人以上夾擊同一目標時獲優位
    drop: 修行值 25、破損打刀
    ai: 保持陣型，3 人一組圍攻。士氣低時可能逃跑
  - name: 弓足輕
    type: 獸人（任意族）
    cr: 0.5
    attributes:
      劍: 2
      體: 2
      妖: 1
      敏: 3
      魂: 1
    combat:
      hp: 10
      dv: 13
      dr: 0
      speed: 6
    attacks:
    - name: 短弓
      hit: '+3'
      damage: 1d6（穿刺，射程 30 格）
    special: 保持距離（至少 15 格）；對無掩護目標獲優位
    drop: 修行值 30、短弓、箭矢 ×10
    ai: 優先攻擊法師／治療者；被近身時切換脇差近戰
  - name: 組頭
    type: 獸人（任意族）
    cr: 1
    attributes:
      劍: 4
      體: 4
      妖: 2
      敏: 3
      魂: 2
    combat:
      hp: 18
      dv: 13
      dr: 1（胴丸）
      speed: 6
    attacks:
    - name: 打刀
      hit: '+4'
      damage: 1d8+2（斬擊）
    special: 命令：附隨動作指揮 2 名足輕，使其本回合攻擊 +1
    drop: 修行值 50、胴丸
    ai: 站在後方指揮；手下死光後親自上前
  - name: 鐵砲足輕
    type: 獸人（任意族）
    cr: 0.5
    attributes:
      劍: 1
      體: 2
      妖: 1
      敏: 3
      魂: 1
    combat:
      hp: 10
      dv: 11
      dr: 0
      speed: 5
    attacks:
    - name: 鐵砲
      hit: '+3'
      damage: 2d6（穿刺，射程 20 格，無視 DR 3）
    special: 需 1 回合裝填；雨天無法射擊；齊射時傷害合計
    drop: 修行值 40、鐵砲、彈丸 ×5
    ai: 2–3 人一組輪流射擊（保證每回合都有火力輸出）
  mid:
  - name: 妖氣侵蝕山賊
    type: 獸人（妖氣侵蝕）
    cr: 0.5
    attributes:
      劍: 3
      體: 3
      妖: 4
      敏: 2
      魂: 1
    combat:
      hp: 12
      dv: 11
      dr: 0
      speed: 6
    attacks:
    - name: 破損打刀
      hit: '+3'
      damage: 1d6+1（斬擊 + 1 妖氣傷害）
    special: 妖氣沸騰：每回合妖氣 +2。妖氣超過 30 時攻擊力 +1d4，但攻擊不分敵我
    drop: 修行值 35
    ai: 無戰術——純粹的狂暴。攻擊最近的目標
  - name: 黑月會忍者
    type: 獸人（鼠／蛇／猴族）
    cr: 2
    attributes:
      劍: 4
      體: 3
      妖: 3
      敏: 6
      魂: 3
    combat:
      hp: 20
      dv: 16
      dr: 0
      speed: 8
    attacks:
    - name: 脇差
      hit: '+6'
      damage: 1d6+2
    - name: 手裏劍
      hit: '+6'
      damage: 1d4（射程 15 格）
    special: 潛行優位；煙玉撤退（反應動作，被攻擊時可用煙玉逃脫）；暗殺（對未察覺目標攻擊暴擊 19–20）
    drop: 修行值 100、煙玉 ×1
    ai: 潛行→偷襲→煙玉撤退（HP < 50% 時）→再潛行。不戀戰
  - name: 黑月會妖氣使
    type: 獸人（蛇／兔族）
    cr: 3
    attributes:
      劍: 2
      體: 3
      妖: 7
      敏: 4
      魂: 5
    combat:
      hp: 25
      dv: 14
      dr: 0
      speed: 6
    attacks:
    - name: 妖氣彈
      hit: '+5'
      damage: 遠程 20 格，1d8 妖氣
    special: 妖氣注射：觸及範圍注入妖氣，目標妖氣值 +5；妖氣吸收：吸收 5 格內生物的妖氣（每回合 −2 目標妖氣／自身 +2）
    drop: 修行值 150、妖氣鎮靜丸 ×1
    ai: 站在後方，優先使用妖氣注射干擾前排戰士，再使用妖氣彈
  - name: 怨靈足輕
    type: 不死
    cr: 0.25
    attributes:
      劍: 2
      體: 2
      妖: 5
      敏: 1
      魂: 1
    combat:
      hp: 8
      dv: 10
      dr: 3
      speed: 4
    attacks:
    - name: 怨念觸碰
      hit: '+1'
      damage: 1d4 妖氣傷害
    special: 物理 DR 3；火焰／靈力無視 DR；淨土流招式造成雙倍傷害
    drop: —（消散）
    ai: 無差別攻擊最近的生命體
  - name: 蛇族暗殺者
    type: null
    cr: 4
    note: 見 GM 規則書第七章完整數據卡
  - name: 試煉守護者·風之形
    type: 精怪
    cr: 5
    attributes:
      劍: 6
      體: 5
      妖: 4
      敏: 8
      魂: 6
    combat:
      hp: 45
      dv: 17
      dr: 0
      speed: 12（飛行）
    attacks:
    - name: 風刃
      hit: '+7'
      damage: 1d8+4（斬擊，射程 5 格）
    - name: 風暴屏障
      hit: 反應動作
      damage: 完全無效一次物理攻擊，每場戰鬥 1 次
    special: 無實體：非魔法武器傷害減半；試煉模式：不殺死玩家，HP 降至 0 或回答完問題後停戰
    drop: 修行值 250、魂刀「風切」（僅限 S2 劇本）
    ai: 提問優先。問題答完後轉為友善中立
  - name: 黑月會墮落武士
    type: 獸人（墮落）
    cr: 5
    attributes:
      劍: 7
      體: 6
      妖: 6
      敏: 4
      魂: 2
    combat:
      hp: 42
      dv: 15
      dr: 2（腹巻）
      speed: 6
    attacks:
    - name: 打刀
      hit: '+9'
      damage: 1d8+5（斬擊 + 1d4 妖氣）
    special: 墮落之刃（暴擊 18–20）；妖氣護體（每回合開始時獲得等同妖氣值／10 的臨時 HP）；背義者（受到淨土流招式傷害加倍）
    drop: 修行值 250、業物打刀（可能）
    ai: 優先攻擊持有魂刀或名刀的角色。不屑撤退
  elite:
  - name: 虎族侍大將
    type: null
    cr: 8
    note: 見 GM 規則書第七章完整數據卡
  - name: 墮落武士·血染持有者
    type: 獸人（墮落）
    cr: 10
    attributes:
      劍: 9
      體: 8
      妖: 8
      敏: 5
      魂: 3
    combat:
      hp: 75
      dv: 17
      dr: 3（大鎧）
      speed: 5
    attacks:
    - name: 妖刀「血染」
      hit: '+12'
      damage: 1d10+7（斬擊 + 1d6 妖氣）
    special: 血染效果（擊殺時恢復目標 HP 50% 的生命值，但妖氣 +10）；墮落之刃（暴擊 17–20）；不滅の闘志（HP 0 時進行體魄豁免 DC 20，成功以 1 HP 繼續戰鬥，每場戰鬥 1 次）
    fatal_weakness: 每擊殺一名敵人獲得 10 妖氣——誘導其妖氣達到 100 使其失控是最佳戰術
    drop: 修行值 600、妖刀「血染」（大業物）
    ai: 狂暴攻擊，每擊殺一人必定追擊下一個目標。無法控制殺戮慾望
  - name: 黑月會精英
    type: 獸人（黑月會）
    cr: 4–8
    note: 依流派分為三種變體（見下表 variants）
    variants:
    - cr: 4
      流派: 蛇族蛇咬流
      hp: 38
      dv: 16
      攻擊: +6（1d6+4+毒）
    - cr: 6
      流派: 鼠族潛影流
      hp: 45
      dv: 18
      攻擊: +8（1d6+5），潛行優位，三連偷襲
    - cr: 8
      流派: 兔族月影流
      hp: 50
      dv: 19
      攻擊: +9（2d6+5），雙持無減值，月光下 DV +2
  - name: 妖化野獸
    type: 妖獸
    cr: 2–7（可調整）
    attributes:
      劍: 4–8
      體: 5–9
      妖: 6–10
      敏: 3–6
      魂: 1–3
    combat:
      hp: 35–65
      dv: 13–16
      dr: 2–4
      speed: 7
    attacks:
    - name: 怨念爪擊
      hit: +4～+9
      damage: 1d8+2 至 2d8+5（妖氣傷害）
    special: 怨靈嚎叫（AOE 1d6 妖氣 + 震懾 DC 12–15）；HP < 50% 時召喚怨靈足輕（每回合 1 名）
    drop: 修行值 100–400、魂鋼碎片
    ai: 無戰術的野獸行為。攻擊最近或最後攻擊它的目標
  - name: 不化骨
    type: 不死（古代武士遺骸）
    cr: 14
    attributes:
      劍: 10
      體: 10
      妖: 12
      敏: 4
      魂: 8
    combat:
      hp: 120
      dv: 16
      dr: 5
      speed: 5
    attacks:
    - name: 古刀
      hit: '+13'
      damage: 2d8+8（斬擊 + 2d6 妖氣）
    special: 不滅：HP 0 時自動以 50% HP 復活（需以淨土流奧義或天下五劍「月華」徹底淨化才能阻止）；怨念光環（半徑 10 格內每回合妖氣 +2）；百戰の記憶（每回合可重擲一次攻擊）
    fatal_weakness: 淨土流招式傷害 ×2。月華（天下五劍）持有者在其 10 格內可抑制復活
    drop: 修行值 1200、古代大業物（隨機）、魂鋼碎片 ×3
    ai: 攻擊持有名刀或魂刀的角色優先。識別並優先擊殺淨土流角色
  legendary:
  - name: 虎嵐齋
    type: 獸人（虎族）
    cr: 17
    attributes:
      劍: 12
      體: 10
      妖: 10
      敏: 8
      魂: 6
    combat:
      hp: 100
      dv: 19
      dr: 3（大鎧）
      speed: 7
    attacks:
    - name: 鬼切丸（天下五劍）
      hit: '+15'
      damage: 1d10+10（斬擊 + 1d8 妖氣）
    moves:
    - 虎爪一閃
    - 虎威壓制
    - 虎王咆哮斬
    - 孤虎
    mystery: 百獸跪伏（釋放全部妖氣，武器傷害 ×3 + 劍術值 ×3，妖氣 +30）
    special: 鬼切丸侵蝕：每回合妖氣自動 +3。妖氣超過 60 時無法控制攻擊目標。妖氣超過 85 時轉為無差別攻擊
    role: 可能為敵人或尋求幫助的受害者（取決於前三幕劇情）
    drop: 修行值 2000、鬼切丸（天下五劍）
    ai: 平靜期（妖氣 0–60）：正常虎威流戰術。獸性期（妖氣 61–85）：捨棄防禦全力攻擊。失控（妖氣 86+）：無差別攻擊，使用百獸跪伏
  - name: 黑月會首領「闇龍」
    type: 墮落龍族
    cr: 18
    note: 見劇本 S4 完整數據
  - name: 龍神司
    type: 獸人（龍族）
    cr: 19
    attributes:
      劍: 12
      體: 11
      妖: 9
      敏: 9
      魂: 12
    combat:
      hp: 130
      dv: 20
      dr: 4（龍鱗 + 龍鱗刀）
      speed: 8（飛行）
    attacks:
    - name: 龍鱗刀（最上大業物）
      hit: '+16'
      damage: 2d10+10（斬擊，射程 5 格）
    breath: 扇形 10 格，3d8 傷害（火焰／寒氣／雷電擇一）
    mystery: 天龍降臨（完全龍化 3 回合：飛行、龍息 4d6、DV +4、DR +4，結束後妖氣 +40）
    role: 守護者——可能是導師、試煉者或最終盟友
    ai: 試煉模式：使用全力但非致命。實戰模式：優先保護封印＞優先擊殺威脅封印的目標
  - name: 大妖禍
    type: 原始混沌
    cr: 無法戰鬥
    status: 被封印於天柱山下，無法行動
    influence: 心靈感應——可與接近封印裂縫的生物對話。其意志可影響周圍生物的妖氣和情緒
    voice: 古老的、疲憊的、孤獨的。不是純粹的惡——是被囚禁了兩千年的原始力量
    related: 僅在劇本 S4 的最終抉擇場景中出現。無法透過戰鬥擊敗——只能封印、釋放或轉化

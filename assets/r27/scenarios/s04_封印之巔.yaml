# 獸人戰國 TRPG 劇本
# S4：封印之巔
# 對應戰役：第四幕（等級 16–20）
# 建議玩家人數：1–4 人

scenario_id: "S4"
title: "封印之巔"
act: 4
suggested_levels:
  min: 16
  max: 20
difficulty: "傳說"
estimated_sessions: 5
prerequisite_scenario: "S3_天下布武之影"

background: |
  天柱山的封印正在崩解。大妖禍的甦醒迫在眉睫。
  所有天下五劍的位置已被揭露。
  黑月會的真正目的浮出水面——不是封印也不是解放，而是「融合」。
  黑月會首領是一位墮落的龍族，他認為獸人壓抑本性是一種自我背叛，
  只有與大妖禍融合，獸人才能真正「進化」。

  玩家必須做出最終的抉擇——封印、解放、還是超越？

factions:
  player_side:
    lord: "流派宗師（可能已犧牲）"
    allies: "十二流派中仍忠於封印的宗師、天下五劍的持有者"
  enemy_side:
    main_villain: "黑月會首領——墮落龍族『闇龍』（昇龍流墮落版，CR 18）"
    minions:
      - "黑月會妖氣使精英 ×4（CR 8）"
      - "黑月會墮落武士 ×6（CR 5）"
      - "妖刀持有者 ×2（CR 10）"
  neutral:
    - "大妖禍（被封印中，無法行動但可影響周圍生物的意識）"
    - "龍神司（龍族守護者，若玩家在前三幕建立了良好關係，會在此幕全力協助）"

scenes:
  - id: 1
    name: "天柱山腳——龍族試煉"
    type: "探索／社交／戰鬥"
    description: |
      前往天柱山。在山腳下遇到龍神司。
      龍神司揭示完整真相：
      - 大妖禍是十二劍聖也無法消滅的存在——只能封印
      - 封印需要十二魂刀同時共鳴
      - 目前只找到了七把魂刀。剩下五把不知所蹤
      - 黑月會正在尋找「無銘」——天下五劍中最神秘的獸神之刃
      - 無銘沒有固定形態。傳說它會變成「持有者最需要的形態」
      - 而「它需要的持有者」是——一個「未選擇義」的人

      龍神司的試煉：
      「如果你想登上天柱山，你必須證明你不是來尋求力量——而是來承擔責任。」
      試煉：龍神司與玩家進行一場非致命戰鬥（CR 16）。他會使用全力。
      當玩家生命值（HP）低於 30% 時——試煉結束。
      龍神司的評價取決於：
      - 你使用了幾次天賦技能？（越少越好——證明你能控制妖氣）
      - 你是否保護了可能在場的同伴？（體現義理）
      - 你的妖氣值是多少？（越低越好）

      - 優秀評價：龍神司授予「龍鱗的祝福」（DR +2，持續至戰役結束）
      - 合格評價：獲准登山
      - 不合格：龍神司說「去尋找無銘——如果你能找到它，再回來。」

  - id: 2
    name: "天柱山攀登——魂刀共鳴"
    type: "探索／角色扮演"
    description: |
      攀登天柱山的過程是靈性之旅。每上升一段距離，玩家感應到不同的魂刀共鳴。
      共鳴來自過去的持有者——他們在玩家心中低語。

      途中遭遇：
      - 第一段：一名淨土流古代宗師的殘像。他問：「你殺過多少人？你記得他們每一個的臉嗎？」
      - 第二段：一名虎威流古代劍聖的殘像。他問：「如果你必須殺死同伴來拯救世界——你會嗎？」
      - 第三段：一名月影流古代巫女的殘像。她問：「你看見月亮上的陰影嗎？那就是你內心的妖氣。你接受它嗎？」

      每個回答影響最終結局可以選擇的路線（非直接判定，而是記錄玩家傾向）：
      - 傾向「秩序與責任」→ 封印之路
      - 傾向「力量與自由」→ 解放之路
      - 傾向「接納與轉化」→ 超越之路（需特定條件）

  - id: 3
    name: "龍帝陵寢——天下五劍集結"
    type: "探索／戰鬥"
    description: |
      抵達天柱山山頂——龍帝陵寢。
      天下五劍的五位持有者／搜尋者在此集結（依前三幕劇情決定誰在場）。

      可能的到場者：
      - 虎嵐齋（持有鬼切丸）——若玩家在 S3 選擇告訴他真相並成功，他會交出鬼切丸請求淨化
      - 月読姫（持有月華）——前來用月華淨化封印裂縫
      - 龍神司（持有龍鱗）——守護者
      - 天叢雲——仍在陵寢深處（封印的核心）
      - 無銘——尚未出現，等待「未選擇義」的人

      此時黑月會發動總攻。
      陵寢入口被黑月會軍隊封鎖。
      玩家必須做出選擇：
      A. 死守入口，爭取時間讓封印儀式完成
      B. 深入陵寢，尋找無銘和天叢雲
      C. 正面迎戰黑月會首領，直接解決威脅

  - id: 4
    name: "黑月會首領——最終決戰"
    type: "Boss戰"
    description: |
      無論選擇哪條路，最終都會面對黑月會首領——墮落龍族「闇龍」。

      他是龍族出身，但拒絕了守護封印的使命。他相信獸人不該為上古的罪孽（十二劍聖創造封印）而壓抑本性。
      「十二劍聖是過去的傳說。我們活在現在。憑什麼讓死人的封印束縛活人的進化？」

      闇龍的動機是真誠的——他不是純粹的惡人。這讓最終決戰更有重量。
    boss:
      name: "闇龍（墮落龍族·墮落昇龍流）"
      cr: 18
      stats:
        hp: 160
        dv: 22
        dr: 3
        speed: 8
        attacks:
          - name: "闇黑龍息"
            hit: "扇形 10 格"
            damage: "4d8 妖氣"
          - name: "墮落龍爪"
            hit: "+14"
            damage: "2d10+8 斬擊"
          - name: "深淵の呼び聲（AOE）"
            hit: "半徑 15 格"
            damage: "2d8 精神傷害 + 魂魄豁免 DC 20 否則恐懼"
      phases:
        - phase: 1
          condition: "HP 160–107"
          behavior: "使用闇黑龍息與墮落龍爪交替攻擊。每 3 回合使用深淵の呼び聲。"
        - phase: 2
          condition: "HP 106–54"
          behavior: "啟動『墮落龍鱗』——所有物理傷害減半。召喚 2 名黑月會墮落武士。攻擊模式改為二連擊。"
        - phase: 3
          condition: "HP 53–1"
          behavior: "完全龍化——體型變為巨型。HP 恢復 40。DR +2。每回合行動兩次。但在龍化前的 1 回合蓄力期完全無法行動（弱點窗口）。"
      final_moment: |
        當闇龍 HP 降至 0：
        「你……打敗了我。但這不代表你是對的。
        你只是比較強而已。一百年後——
        當你的子孫問你『為什麼我們要為死人的封印犧牲自己』——
        你那時候……還能回答嗎？」

        闇龍沒有抵抗死亡。他在等待這個答案已經等了幾百年。
        玩家此時的回答決定最終結局路線。

  - id: 5
    name: "最終抉擇"
    type: "義理／結局"
    description: |
      闇龍倒下。大妖禍的封印在你面前裂開。
      從裂縫中傳出聲音——不是怪物的咆哮，而是一個疲憊的、古老的、無比孤獨的聲音：
      「兩千年了。讓我出去。或者——讓我安息。」

      最終三選一：

      【封印之路】
      以自己的魂魄為楔，重新封住裂縫。
      魂魄豁免 DC 25。
      成功：封印重新穩定。你陷入沉睡——不確定何時醒來。但百獸列島恢復和平。
      失敗：封印穩定了，但你失去所有記憶和力量（等級歸零，屬性歸 1）。你在天柱山下醒來，成為一個普通的獸人村民。也許——這才是你真正想要的？

      【解放之路】
      接受闇龍的邏輯。摧毀封印。
      所有獸族立即完全獸化——獲得永久的力量但失去自我意識。
      你成為新世界的主宰——但你失去了所有同伴、義理、和你曾經的「自己」。

      【超越之路】（隱藏結局）
      條件（需滿足至少 3 項）：
      - 持有天下五劍中至少 3 把
      - 刀緣值 ≥ 80
      - 義理值 ≥ 15
      - 流派宗師資格
      - 在前三幕中至少 2 次選擇了「最困難但最正義」的選項

      你找到了第三條路——將大妖禍的力量轉化為純淨的劍氣。
      需要進行連續三次檢定：
      1. 魂魄豁免 DC 22（抵抗妖氣吞噬）
      2. 劍術檢定 DC 25（以劍氣引導力量）
      3. 魂魄（說服）DC 28（與大妖禍對話——說服它接受轉化而非毀滅）

      全部成功：大妖禍化為無盡的光，注入百獸列島的每一寸土地。
      所有獸人的妖氣消失——取而代之的是純淨的劍氣。
      獸人不再是獸人——他們成為了「劍人」。一個新時代開始。
      你被尊為「超越十二劍聖者」——超越所有傳說的存在。
      你的刀化為新的天柱——永遠守護百獸列島。

      任意失敗：轉化過程失控。你承受 5d10 無法減免的傷害。
      若存活——可選擇封印或解放路線。

reward:
  xp: "3000（闇龍）+ 2000（完成最終抉擇）= 共 5000，足以從 19→20 級"
  gold: 3000
  legacy: "角色的故事結束。無論結局如何——他改變了整個世界。"

solo_adjustments:
  - "闇龍 HP：160→120"
  - "闇龍召喚墮落武士數量：2→1"
  - "NPC 龍神司會陪同最終決戰（若前幾幕關係良好）"
  - "最終抉擇中超越之路的檢定 DC 各 −2"
  - "若玩家獨自一人（無 NPC 同伴），闇龍在第三階段 HP 恢復：40→20"

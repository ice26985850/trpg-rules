# 獸人戰國 TRPG 劇本
# S1：鬼哭原之影
# 對應戰役：第一幕（等級 1–4）
# 建議玩家人數：1–4 人

scenario_id: "S1"
title: "鬼哭原之影"
act: 1
suggested_levels:
  min: 1
  max: 4
difficulty: "新手"
estimated_sessions: 2

# ─── 背景 ───
background: |
  玩家剛拜入流派不久，師傅派往邊境村莊「影見村」調查一連串失蹤事件。
  村莊位於鬼哭原邊緣——傳說中千年古戰場的怨念積累之地。
  近三個月來，已有五名村民在夜間失蹤，現場只留下妖氣殘留。

# ─── 主要勢力 ───
factions:
  player_side:
    lord: "流派宗師（由 GM 決定，對應玩家的流派）"
    allies:
      - "影見村村長（年老牛族，提供情報和住宿）"
      - "村中藥師（兔族，可提供治療和解毒丸）"
  enemy_side:
    main_villain: "妖化野獸（原為戰國時代陣亡武士的怨靈集合體）"
    minions:
      - "妖氣侵蝕的山賊 ×3（CR 0.5）"
      - "怨靈足輕 ×5（CR 0.25）"
  neutral:
    - "路過的浪人（猴族，等級 5）——可說服成為臨時同伴或情報來源"

# ─── 涉入流派 ───
involved_schools:
  - id: "player_school"
    role: "玩家的流派——師傅指派此任務作為修行一環"
  - id: "淨土流"
    role: "村中藥師為淨土流中傳弟子，可協助淨化妖氣"

# ─── 名刀線索 ───
blade_clue:
  target: null
  hint: "在本劇本中沒有名刀，但在鬼哭原深處可發現一塊『魂鋼碎片』——鍛造業物以上名刀的必要材料。這是未來鍛造名刀的第一塊基石。"

# ─── 場景流程 ───
scenes:
  - id: 1
    name: "影見村抵達"
    type: "探索／社交"
    description: |
      玩家抵達影見村。村長講述失蹤事件——五人在過去三個月夜間失蹤。
      現場調查（知覺檢定 DC 13）可發現微弱的妖氣殘留，指向鬼哭原方向。
    checks:
      - skill: "知覺"
        dc: 13
        success: "發現妖氣殘留來自東方鬼哭原"
      - skill: "說服"
        dc: 15
        success: "村長透露更多細節：最後一位失蹤者曾說過『聽見亡靈在呼喚他的名字』"
    npcs:
      - name: "村長（牛族）"
        role: "情報提供者"
      - name: "藥師（兔族）"
        role: "治療與解毒支援"

  - id: 2
    name: "鬼哭原邊緣巡邏"
    type: "探索／戰鬥"
    description: |
      進入鬼哭原邊緣。途中遭遇被妖氣侵蝕的山賊——他們已被怨靈附身。
      戰鬥中妖氣會持續累積（鬼哭原場景：每回合 +1 妖氣值）。
    enemies:
      - type: "妖氣侵蝕山賊"
        count: 3
        cr: 0.5
        stats:
          hp: 12
          dv: 11
          attack: "+2, 1d6+1 斬擊"
    environment:
      yokai_per_turn: 1
      description: "陰暗的枯木林，地面覆蓋著薄霧。遠方可聽見隱約的哭聲。"

  - id: 3
    name: "怨靈之夜"
    type: "戰鬥"
    description: |
      日落後，五名怨靈足輕從霧中出現。這是失蹤村民的怨念所化。
      關鍵：怨靈對物理傷害有 DR 3，但火焰和淨土流招式可造成全額傷害。
    enemies:
      - type: "怨靈足輕"
        count: 5
        cr: 0.25
        stats:
          hp: 8
          dv: 10
          dr: 3
          attack: "+1, 1d4 妖氣傷害"
    tactical_note: |
      若玩家是淨土流或持有火焰攻擊手段，此戰難度大幅下降。
      否則建議 GM 暗示玩家使用火把或尋求村中藥師的淨化協助。

  - id: 4
    name: "妖氣源頭"
    type: "戰鬥（Boss）"
    description: |
      追蹤妖氣源頭至一座被遺忘的古墳。一隻妖化野獸（融合了多位戰國武士怨念的怪物）守護著這裡。
    boss:
      name: "妖化野獸"
      cr: 2
      stats:
        hp: 35
        dv: 13
        dr: 2
        speed: 7
        attacks:
          - name: "怨念爪擊"
            hit: "+4"
            damage: "1d8+2 妖氣"
          - name: "怨靈嚎叫（AOE）"
            hit: "半徑 5 格"
            damage: "1d6 妖氣，需魂魄豁免 DC 12 否則震懾 1 回合"
      phases:
        - condition: "HP < 50%"
          effect: "每回合召喚 1 名怨靈足輕"
    reward:
      xp: 300
      gold: 100
      items:
        - "魂鋼碎片 ×1（日後鍛造業物以上名刀的材料）"
        - "古武將的遺刀（無銘打刀）"

  - id: 5
    name: "歸途與反思"
    type: "義理抉擇"
    description: |
      擊敗妖化野獸後，找到失蹤村民的遺物。其中一位是最後失蹤者的妻子留下的書信。
      書信透露：那位失蹤者不是單純的受害者——他主動走進鬼哭原，希望以自己為祭品平息怨靈。
      他成功了嗎？還是只是徒勞的犧牲？

      義理抉擇：
      - 告訴村長真相（義理值 +2）：他的丈夫是自願犧牲，但可能無法被視為英雄
      - 隱瞞真相，說他是被妖怪殺害的受害者（說服檢定 DC 15，成功則村人心安）：這是在保護生者還是欺騙？
      - 隱瞞真相但私下為他立碑（義理值 +3）：對亡者的尊重，但無法給予家屬真正的安慰
    moral_dilemma:
      title: "真相 vs 慈悲"
      options:
        - choice: "說出真相"
          reward: "+2 義理值"
          consequence: "村長悲痛，但感謝你的誠實。藥師認為這是『淨化』的真意——面對真相。"
        - choice: "隱瞞真相"
          check: "說服 DC 15"
          reward: "村人感激"
          consequence: "但你的良心不安。魂魄檢定劣位直到下次長休。"
        - choice: "私下立碑"
          reward: "+3 義理值"
          consequence: "沒有人知道真相，但亡者的靈魂透過夢境感謝你。"

# ─── 結局分歧 ───
endings:
  - condition: "擊敗 Boss + 獲得魂鋼碎片"
    outcome: "任務完成。師傅對你的表現滿意。流派修行值 +10。獲得第一塊魂鋼碎片——這是鍛造屬於你自己的名刀的第一步。"
  - condition: "未獲得魂鋼碎片"
    outcome: "任務完成但留有遺憾。師傅提醒：『有些東西比任務目標更重要——找到它。』"

# ─── 對單人的調整 ───
solo_adjustments:
  - "妖氣侵蝕山賊數量：3→1"
  - "怨靈足輕數量：5→2"
  - "妖化野獸 HP：35→26"
  - "妖化野獸無法召喚怨靈足輕（HP < 50% 時改為攻擊力 +1d4）"
  - "提供 NPC 同伴選項：路過的浪人（猴族）可說服加入"

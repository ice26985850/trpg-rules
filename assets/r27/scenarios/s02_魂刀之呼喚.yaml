# 獸人戰國 TRPG 劇本
# S2：魂刀之呼喚
# 對應戰役：第二幕（等級 6–9）
# 建議玩家人數：1–4 人

scenario_id: "S2"
title: "魂刀之呼喚"
act: 2
suggested_levels:
  min: 6
  max: 9
difficulty: "中級"
estimated_sessions: 3
prerequisite_scenario: "S1_鬼哭原之影"

# ─── 背景 ───
background: |
  在一次冥想修行中，玩家感應到一把魂刀的存在——不是天下五劍，而是某位古代劍聖留下的次級魂刀。
  魂刀的共鳴來自千刃峽——馬族領東側的天然峽谷，也是古代劍聖試煉的傳統場地。
  玩家需要前往千刃峽尋找魂刀，但馬族大名「騎馬の陣五郎」對進入峽谷的外人有嚴格限制。

# ─── 主要勢力 ───
factions:
  player_side:
    lord: "流派宗師"
    allies:
      - "犬族義理同盟（若玩家選擇了義理同盟路線）"
  enemy_side:
    main_villain: "黑月會精英（蛇族蛇咬流奧傳）"
    minions:
      - "黑月會忍者 ×4（CR 2）"
      - "黑月會妖氣使 ×2（CR 3）"
  neutral:
    - "馬族邊境守衛隊長——需說服或賄賂才能通過"
    - "千刃峽的守護精怪（中立，可提供試煉提示）"

# ─── 場景流程 ───
scenes:
  - id: 1
    name: "馬族邊境交涉"
    type: "社交"
    description: |
      抵達馬族駿河國邊境。守衛隊長要求出示大名的通行許可——你沒有。
      三種解決方式：
      - 說服（DC 18）：以魂刀共鳴的名義請求通行
      - 潛行（DC 16）：趁夜間潛入
      - 對抗：小型戰鬥，但會得罪馬族（影響後續劇情）
    checks:
      - skill: "說服"
        dc: 18
        success: "守衛隊長允許通行，但附帶條件——幫助處理千刃峽的山賊問題"
      - skill: "潛行"
        dc: 16
        success: "成功潛入千刃峽，但失去馬族守衛可能提供的補給"

  - id: 2
    name: "千刃峽試煉"
    type: "探索／戰鬥"
    description: |
      千刃峽中，岩壁如刀刃般鋒利。古代劍聖的試煉場就在峽谷深處。
      試煉分為三步：
      1. 攀登鋒刃岩壁（攀爬 DC 16，失敗承受 1d6 切割傷害）
      2. 在強風中保持平衡穿過窄橋（機敏豁免 DC 15）
      3. 面對試煉守護者的考驗
    boss:
      name: "試煉守護者（精怪·風之形）"
      cr: 5
      type: "精怪（友善中立）"
      stats:
        hp: 45
        dv: 17
        speed: 12
        attacks:
          - name: "風刃"
            hit: "+7"
            damage: "1d8+4 斬擊"
          - name: "風暴屏障"
            effect: "反應動作，完全無效一次物理攻擊"
      test: |
        守護者並非真的想傷害你——它要測試你對「刀」的理解。
        它會問三個問題（GM 挑選）：
        - 「刀是什麼？」
        - 「你為何揮刀？」
        - 「你的刀記得什麼？」
        每個真誠的回答（非戰鬥檢定，純 RP）會削弱守護者 10 HP。
        打完三個問題後守護者會主動停戰。
    reward:
      xp: 500
      gold: 300
      items:
        - "魂刀『風切』（業物太刀）"
        - "刀銘：試煉銘（風切專屬，戰鬥中使用該刀暴擊範圍 19–20）"

  - id: 3
    name: "黑月會伏擊"
    type: "戰鬥"
    description: |
      離開千刃峽時遭到黑月會伏擊——他們也在尋找魂刀。
      黑月會精英（蛇族）對玩家說：「那把魂刀不屬於你這種軟弱的武士。把它交給我們，你可以活著離開。」
    enemies:
      - name: "黑月會精英（蛇族·蛇咬流）"
        cr: 4
        stats:
          hp: 38
          dv: 16
          attack: "+6, 1d6+4 + 毒（體魄豁免 DC 16）"
          special: "影縫（潛行中攻擊優位）"
      - name: "黑月會忍者"
        count: 4
        cr: 2
    tactical_note: |
      黑月會精英擁有魂刀碎片探測裝置——戰鬥中若玩家生命值（HP）低於 50%，
      精英會使用煙玉撤退，並留下話語：「我們會在封印之地再見的。那時——你會後悔今天沒交出魂刀。」

  - id: 4
    name: "魂刀覺醒——與刀對話"
    type: "角色扮演／義理"
    description: |
      在安全地點進行「與刀對話」的儀式。
      魂刀『風切』開始展現自己的刀格和記憶。
    blade_details:
      name: "風切"
      grade: "業物"
      personality: "迅雷" # 急躁好動，渴望速度
      memory: |
        風切記得它的前主——一位馬族疾風流劍士，在千刃峽的暴風中完成了不可能的試煉。
        但前主在之後的戰爭中為了保護同伴而戰死。
        風切在千刃峽等了兩百年，等待下一個「追風之人」。
    moral_dilemma: |
      風切問你一個問題：「我的前主為了保護同伴而死。如果有同樣的選擇擺在你面前——你會選擇什麼？」
      你的回答將決定初始刀緣值：
      - 「我會做同樣的選擇」（刀緣 +10）：刀感受到你的義
      - 「我會找到方法同時保護同伴和自己」（刀緣 +5）：刀欣賞你的野心
      - 「我會讓同伴保護我」（刀緣 −5）：刀鄙視你的懦弱

# ─── 後續影響 ───
follow_up:
  - "玩家獲得第一把魂刀，解鎖刀銘系統"
  - "黑月會注意到玩家——未來劇本中可能遭遇追擊"
  - "若幫助了馬族邊境守衛處理山賊，獲得馬族通行許可（可在第三幕使用）"
  - "流派宗師對玩家找到魂刀表示讚賞——修行值 +15"

# ─── 對單人的調整 ───
solo_adjustments:
  - "黑月會忍者數量：4→2"
  - "試煉守護者問題數：3→2"
  - "黑月會精英 HP：38→28"
  - "提供 NPC 同伴選項：馬族邊境守衛隊長（若說服成功，可陪同進入峽谷）"

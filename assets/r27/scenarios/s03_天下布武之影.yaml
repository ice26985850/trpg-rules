# 獸人戰國 TRPG 劇本
# S3：天下布武之影
# 對應戰役：第三幕（等級 11–14）
# 建議玩家人數：1–4 人

scenario_id: "S3"
title: "天下布武之影"
act: 3
suggested_levels:
  min: 11
  max: 14
difficulty: "上級"
estimated_sessions: 4
prerequisite_scenario: "S2_魂刀之呼喚"

background: |
  虎族大名虎嵐齋的「天下布武」行動進入高潮。全面戰爭爆發。
  玩家在選擇的勢力（義理同盟或天下布武會）中已被賦予指揮權。
  本劇本的核心是一場關鍵合戰——鬼哭原會戰。

  同時，名刀線索指向天下五劍之一「鬼切丸」——它在虎嵐齋手中，而它的妖氣正在侵蝕持有者的魂魄。

factions:
  player_side:
    lord: "取決於玩家在第一、二幕中的選擇"
    allies: "勢力中的其他藩國聯軍"
  enemy_side:
    main_villain: "敵方總大將（取決於玩家的勢力選擇）"
    key_figure: "敵方年輕武將（玩家在第一幕認識的宿敵）"
  neutral:
    - "淨土寺僧兵團（可請求醫療支援）"
    - "鼠族情報販子（可購買敵軍部署情報）"

scenes:
  - id: 1
    name: "軍議——戰前準備"
    type: "社交／策略"
    description: |
      玩家參與勢力軍議。必須做出三個戰前決策：
      1. 選擇合戰中的角色：將領型（指揮部隊）或突擊隊長型（直接斬入敵陣）
      2. 分配有限的資源——騎兵主力／弓兵掩護／僧兵醫療三者只能選一項全力投入
      3. 是否使用間諜情報（使用則合戰優位，但可能暴露自己在鼠族情報網中的位置）
    checks:
      - skill: "兵法"
        dc: 18
        success: "獲得敵方部署情報，合戰第一回合我方全軍優位"
      - skill: "說服"
        dc: 20
        success: "說服中立勢力（如淨土寺）提供支援"

  - id: 2
    name: "鬼哭原會戰"
    type: "合戰（大規模戰鬥）"
    description: |
      雙方在鬼哭原展開決戰。

      合戰規模：
      - 我方：3,000–5,000 人（依玩家選擇的勢力）
      - 敵方：4,000–6,000 人
      - 合戰回合數：5–8 回合

      玩家角色：
      - 若選擇將領型：使用指揮值調度部隊
      - 若選擇突擊隊長型：親自切入敵陣
    mass_battle:
      player_side:
        troops:
          - type: "重步兵（牛族）"
            strength: 3
          - type: "騎兵（馬族）"
            strength: 2
          - type: "弓兵（雞族）"
            strength: 2
        morale: 12
        cp_base: 50
      enemy_side:
        troops:
          - type: "輕步兵（犬族）"
            strength: 4  # 若敵方是虎族則調整
          - type: "騎兵（馬族）"
            strength: 3
          - type: "忍者眾（鼠族）"
            strength: 1
        morale: 13
        cp_base: 60
      battlefield_events:
        use_full_table: true
      moral_dilemma_during_battle: |
        合戰中期，敵方年輕武將（宿敵）率領突擊隊衝入我方本陣。
        他的目標就是你——他要一騎打。

  - id: 3
    name: "一騎打——宿命的對決"
    type: "一騎打（武將單挑）"
    description: |
      鬼哭原中央。兩軍暫時停戰，所有人的目光聚焦於你們。

      敵將宣告：「[玩家的流派名]的[玩家名]！我是[敵將名]，[敵將流派]的傳人。
      從第一次見面起，我就知道——我們之中只有一個人能成為傳說。
      今天，在這裡——讓我們的刀來決定誰的義才是真實的。」

      敵方武將資訊：
      - 名稱：取決於玩家在第一幕認識的宿敵（GM 設定）
      - 獸族：與玩家有對稱或相剋關係
      - 流派：與玩家不同但同等階層
      - 等級：與玩家相同
      - 佩刀：業物或良業物
    duel_rules:
      rounds: 3
      special: |
        第三回合，鬼哭原的怨靈被雙方的妖氣激發，
        戰場被妖氣風暴包圍（雙方妖氣各 +10）。
        在風暴中完成最後一擊的人——將被載入戰國史冊。
    post_duel:
      victory_options:
        - choice: "斬殺"
          consequence: "獲得宿敵的佩刀（業物）。敵軍士氣 −5。但義理值 −5。鬼哭原上多了一把等待兩百年的刀。"
        - choice: "釋放"
          consequence: "義理值 +5。宿敵對你欠下恩義。敵軍士氣 −2。宿敵說：『我會還你這一命——在不需要還的時候。』"
        - choice: "招募"
          consequence: "進行魂魄對抗（DC 18）。成功則宿敵成為你的同伴 NPC（CR 6）。這是最高貴的勝利。"

  - id: 4
    name: "鬼切丸之影"
    type: "探索／揭露"
    description: |
      合戰結束後，玩家獲得一份意外情報——來自鼠族情報網。
      情報顯示：虎嵐齋持有的天下五劍「鬼切丸」不是表面上的聖劍。
      它是一把妖刀，正在以妖氣侵蝕虎嵐齋的魂魄。
      虎嵐齋的「天下布武」背後——是鬼切丸的意志在驅動。

      關鍵發現：
      - 鬼切丸每斬殺一名武士，吸收其魂魄以強化自身
      - 虎嵐齋正在失去對自身行為的控制
      - 黑月會與這個過程有某種關聯

      玩家現在面臨選擇：
      - 將情報告訴你的主君（可能引發針對虎嵐齋的刺殺行動）
      - 保密並自行調查（獨自行動，但資源有限）
      - 試圖將情報告訴虎嵐齋本人（極度危險，但可能拯救他）
    moral_dilemma:
      title: "真相 vs 戰略"
      options:
        - choice: "報告主君"
          consequence: "主君策劃刺殺虎嵐齋。玩家被要求參與——但虎嵐齋是受害者而非惡人。"
        - choice: "自行調查"
          consequence: "獲得義理值 +3（你選擇面對真相而非利用真相）。但缺乏支援。"
        - choice: "告訴虎嵐齋"
          check: "潛入尾張國（潛行 DC 22）+ 說服虎嵐齋相信你（說服 DC 25）"
          consequence: "若成功——虎嵐齋可能會自願交出鬼切丸，避免更多殺戮。這是唯一能同時拯救虎嵐齋、終結戰爭、並獲得鬼切丸的路線。但也是最困難的。"

reward:
  xp: "合戰：800 × 玩家所屬部隊的表現係數。一騎打：300。情報揭露：200。"
  gold: 1000
  items: "宿敵的佩刀（若選擇斬殺）。鬼切丸的情報碎片。"

follow_up:
  - "玩家的勢力在合戰中的勝負影響第四幕的勢力格局"
  - "鬼切丸的情報直接引導至第四幕的劇情"
  - "宿敵的命運（斬殺／釋放／招募）有重大後續影響"

solo_adjustments:
  - "合戰規模縮減：雙方部隊規模 −40%"
  - "一騎打敵將等級：玩家等級 −1"
  - "提供 NPC 副將協助指揮（若玩家選擇將領型）"
  - "合戰事件表使用次數減半"

# 獸人戰國 TRPG —— 百獸列島世界地圖
# 格式：YAML 結構化資料
# 用途：GM 參考用，可在 VTT 或紙本地圖上標記

map_id: "world_map_01"
title: "百獸列島全圖"
scale: "1 格 ≈ 50 公里（約 3 日徒步）"
era: "戰國時代（紀元 1501–）"

# ─── 地理區域 ───
regions:
  north:
    name: "北境"
    climate: "寒冷，冬季長達 5 個月。山區積雪。"
    territories:
      - id: "亥_山城國"
        clan: "豬族"
        capital: "剛力城"
        terrain: "山區、礦脈地帶"
        resources: ["魂鋼礦脈（百獸列島唯一來源）", "石材"]
        description: "群山環繞的礦業王國。山城國的魂鋼礦脈是所有名刀的根基。豬族用蠻力開採，牛族刀匠負責冶煉。"
      - id: "丑_武藏國"
        clan: "牛族"
        capital: "鐵心城"
        terrain: "廣闊平原、河流縱橫"
        resources: ["農業（稻米）", "牧場", "刀匠公會總部"]
        description: "農業與鍛造的國度。廣闊的平原提供了百獸列島大部分的糧食。刀匠公會的總部設於此地的『內匠町』。"

  central:
    name: "中原"
    climate: "溫和，四季分明。最宜人居。"
    territories:
      - id: "寅_尾張國"
        clan: "虎族"
        capital: "虎威城"
        terrain: "平原與丘陵混合、沿海"
        resources: ["軍馬", "鐵礦（非魂鋼）", "港口"]
        description: "百獸列島最強大的軍事勢力。虎威城是戰國時代的政治風暴中心。虎嵐齋在此宣告『天下布武』。"
      - id: "辰_天柱山"
        clan: "龍族（非藩國，聖地）"
        capital: "龍帝陵寢"
        terrain: "聖山，海拔極高，終年雲霧繚繞"
        resources: ["龍脈能量", "封印（大妖禍）", "天下五劍『天叢雲』"]
        description: "不屬於任何藩國的聖地。龍族守護者在此看守封印。山頂的龍帝陵寢是王朝時代的遺跡。"
      - id: "午_駿河國"
        clan: "馬族"
        capital: "疾風城"
        terrain: "廣袤平原、草原"
        resources: ["軍馬（最優質）", "穀物"]
        description: "騎兵之國。平原上的駿河國是虎族最重要的軍事盟友——虎族的步兵需要馬族的騎兵來維持軍事優勢。"
      - id: "未_淨土領"
        clan: "羊族（非藩國，宗教領地）"
        capital: "淨土寺"
        terrain: "山谷、寺廟群"
        resources: ["醫療草藥", "僧兵", "精神指引"]
        description: "宗教中立領地。淨土寺是百獸列島最大的醫療和靈性中心。不參與世俗戰爭，但僧兵團是任何勢力都敬畏的存在。"

  east:
    name: "關東"
    climate: "濕潤，多雨多霧。"
    territories:
      - id: "子_伊賀國"
        clan: "鼠族"
        capital: "影の里（非公開）"
        terrain: "山地、地下洞窟網絡"
        resources: ["情報（最核心資源）", "毒物", "忍者訓練場"]
        description: "情報之國。表面上是貧瘠的山地小國，實際上整個列島的情報都在鼠族的掌握之中。沒有固定公開的首都。"
      - id: "卯_月見國"
        clan: "兔族"
        capital: "月讀宮"
        terrain: "湖畔、竹林"
        resources: ["月鏡湖（聖湖）", "月讀神諭", "醫療巫女"]
        description: "神秘的月讀信仰中心。月鏡湖永遠被月光照亮。兔族巫女在此接收神諭。月読姫是所有獸族精神上的引導者。"
      - id: "戌_信濃國"
        clan: "犬族"
        capital: "忠義城"
        terrain: "山林、丘陵"
        resources: ["忠誠的武士團", "木材"]
        description: "忠義之國。犬塚義重在此組織『義理同盟』——聯合小藩國對抗虎族霸權。雖然兵力不如虎族，但犬族武士的忠誠是百獸列島最強的力量。"

  west:
    name: "關西"
    climate: "溫暖，日照充足。"
    territories:
      - id: "酉_伊勢國"
        clan: "雞族"
        capital: "天照城"
        terrain: "沿海、日照充足的丘陵"
        resources: ["弓術道場", "太陽神信仰", "祭祀中心"]
        description: "火之國與太陽信仰中心。伊勢國的弓術道場是百獸列島最好的遠程訓練場。鳳凰院光秀在此統治，他秘密地不是真正的鳳凰流宗師血脈。"
      - id: "申_紀伊國"
        clan: "猴族（流浪性質）"
        capital: "無固定首都（遊俠聚集地：猿ヶ島）"
        terrain: "海岸、島嶼、森林"
        resources: ["鐵砲研發", "自由貿易", "技術創新"]
        description: "無固定領土的遊俠之國。猴族在紀伊國的海岸和島嶼間自由移動。他們的鐵砲研發可能顛覆整個戰國的戰爭形態。"
      - id: "巳_大和國"
        clan: "蛇族"
        capital: "蛇鱗城"
        terrain: "濕地、密林"
        resources: ["毒物", "情報操控", "黑月會秘密據點"]
        description: "陰謀之國。大和國表面上是虎族的附庸，實際上是黑月會的秘密基地。蛇目千代從不親自上戰場——她讓別人為她而死。"

# ─── 重要地標 ───
landmarks:
  - id: "天柱山"
    region: "辰_天柱山"
    type: "聖山"
    description: "龍帝陵寢所在，大妖禍封印之地。山高雲深，只有被龍族認可者才能登頂。"
  - id: "鬼哭原"
    region: "寅_尾張國與丑_武藏國交界"
    type: "古戰場"
    description: "千年來的無數戰役在此發生。怨念積累形成妖氣異常區域。相傳夜晚可聽見亡靈的哭聲。"
  - id: "千刃峽"
    region: "午_駿河國東側"
    type: "試煉場"
    description: "天然峽谷，風化的岩壁如刀刃般鋒利。古代劍聖的試煉場，多把魂刀沉睡於此。"
  - id: "月鏡湖"
    region: "卯_月見國中央"
    type: "聖湖"
    description: "月光永遠照亮的湖面。兔族巫女在此接收月讀神諭。湖水據說可以淨化妖氣。"
  - id: "魂刀塚"
    region: "位置未知"
    type: "傳說地點"
    description: "傳說十二魂刀沉睡之地。只有『被魂刀選中者』才能找到。位置隨時代變遷而移動。"
  - id: "內匠町"
    region: "丑_武藏國（鐵心城外）"
    type: "刀匠聖地"
    description: "刀匠公會的總部。所有大業物以上的名刀都在此鍛造或鑑定。擁有魂刀共鳴地圖。"

# ─── 行軍距離（相鄰首都之間） ───
travel_distances:
  - from: "虎威城（尾張）"
    to: "忠義城（信濃）"
    days: 5
    description: "穿越鬼哭原——危險，可能遭遇怨靈"
  - from: "虎威城（尾張）"
    to: "疾風城（駿河）"
    days: 4
    description: "平原大道，最安全的交通路線"
  - from: "鐵心城（武藏）"
    to: "剛力城（山城）"
    days: 3
    description: "山地商路，由牛族和豬族共同維護"
  - from: "月讀宮（月見）"
    to: "淨土寺（淨土領）"
    days: 4
    description: "朝聖之路，沿途有寺廟提供住宿"
  - from: "任意藩國首都"
    to: "天柱山"
    days: 7–12
    description: "朝聖之旅。越靠近天柱山，妖氣越濃"

# ─── 當前戰國時代的勢力版圖（紀元 1501） ───
current_conflicts:
  - axis: "東西大戰"
    west_side: ["虎族（尾張）", "馬族（駿河）", "雞族（伊勢，支持但未參戰）"]
    east_side: ["犬族（信濃）", "牛族（武藏）", "兔族（月見，義理同盟）", "羊族（淨土領，醫療支援）"]
    status: "全面戰爭（鬼哭原為主要戰場）"
    neutral: ["豬族（山城，供應魂鋼給雙方）", "鼠族（伊賀，賣情報給雙方）", "猴族（紀伊，賣鐵砲給雙方）", "蛇族（大和，表面親虎，暗中各方勾結）", "龍族（天柱山，超然中立）"]

  - axis: "日月之爭（宗教競爭，非軍事衝突）"
    sun_side: ["雞族·天照信仰"]
    moon_side: ["兔族·月讀信仰"]
    status: "冷戰——影響力競爭，涉及神諭解讀權"

  - axis: "影之戰（地下情報戰爭）"
    involved: ["鼠族", "蛇族", "黑月會"]
    status: "三方角力——鼠族壟斷情報、蛇族操控情報、黑月會利用情報"

# ─── 地圖圖例（供繪製參考） ───
legend:
  capital: "◎ 首都／聖地"
  city: "○ 主要城市"
  battlefield: "⚔ 主要戰場"
  sacred_site: "✦ 聖地"
  mine: "⛏ 礦脈"
  port: "⚓ 港口"
  mountain: "▲ 山脈"
  river: "≈ 河流"

            解鎖內容: 討伐懸賞、公會折扣 5%
          - 階級: B
            可承接委託上限（CR）: 19–28
            解鎖內容: 魔將相關前線委託、折扣 10%
          - 階級: A
            可承接委託上限（CR）: 29–40
            解鎖內容: 精銳懸賞、專屬鍛造配額
          - 階級: S
            可承接委託上限（CR）: 41+
            解鎖內容: 魔王城討伐／和平全權、傳奇聲望（需 IP≥40）

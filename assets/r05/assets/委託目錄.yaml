            可承接委託上限（CR）: 1–4
            解鎖內容: 基礎委託、白板商店、神殿入場
          - 階級: E
            可承接委託上限（CR）: 5–8
            解鎖內容: 區域討伐委託、公會倉庫
          - 階級: D
            可承接委託上限（CR）: 9–12
            解鎖內容: 護送／偵查高階委託
          - 階級: C

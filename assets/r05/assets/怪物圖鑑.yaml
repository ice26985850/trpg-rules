title: "勇者之證（The Hero's Proof）— 怪物圖鑑（Monster Catalog）"
sections:
  - heading: "勇者之證（The Hero's Proof）— 怪物圖鑑（Monster Catalog）"
    text:
      - > 數值來源：系統定稿（第五章 敵人挑戰等級 挑戰等級（CR） 與 首領（Boss） 框架），繁體中文，術語採「中文全稱（縮寫）」格式。
      - > 敵方數值公式（系統定稿鎖定）：
      - > - 生命值（HP） = `floor(40 × (1 + 0.09 × (CR − 1)))`
      - > - 攻擊加值（ATK） = `floor(1 + 0.25 × CR)`
      - > - 迴避值（EVA） = `10 + floor(0.15 × CR)`
      - > - 傷害／擊 = `floor(6 + 1.2 × CR)`
      - > - 傷害＝每次攻擊基礎輸出值，與 攻擊加值（ATK）（管命中）為兩套獨立數值；二者量級差異為設計預期（非錯誤），審計第 71 項已確認。
      - > - 暴擊門檻（CritTh）固定 20（高 挑戰等級（CR） 可降 1~2 檻）
      - > - 經驗值（EXP） = `floor(15 × CR × (1 + CR/15))`；首領（Boss）EXP ×4
      - > 模板欄位：名稱／挑戰等級（CR）／生命值（HP）／攻擊加值（ATK）／迴避值（EVA）／減傷（DR）／移動力／先攻修正／攻擊／技能／特性／經驗值（EXP）／掉落。
      - > 首領（Boss） 階段轉換統一綁定 生命值（HP） 66%／33%（不受暴擊波動影響）。
      - ---
    tables:
      []
  - heading: 一、普通怪物（依挑戰等級 挑戰等級（CR） 分層）
    text:
      - > 以下 20 種普通怪物各含「掉落」欄；掉落為基礎素材，魔法裝備仍須經鍛造／神殿等途徑取得（見玩家書第四章）。
    tables:
      []

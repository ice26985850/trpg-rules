  - heading: 二、四魔將（Four Demon Generals）
    text:
      - > 階段轉換綁 生命值（HP） 66%／33%；各魔將「階段三」設為玩家暴擊收尾窗口（弱化減傷／顯露核心／破物件）。
    tables:
      []
  - heading: 龍將 伊格妮絲·炎鱗（Drakaina General）
    text:
      - - 挑戰等級（CR）：40　生命值（HP）：720　攻擊加值（ATK）：+11　迴避值（EVA）：16　減傷（DR）：鱗甲 30% 物理　移動力：6 格　先攻修正：+3　暴擊門檻（CritTh）：20　經驗值（EXP）：8,800（Boss ×4）
      - - 攻擊：龍爪 劈砍 2d8+11（火焰附傷）
      - - 技能：龍息（AOE 扇形火焰，灼燒 2回合）／飛行突襲（突進＋膽怯 2 回合）
      - - 特性：階段一「幼龍態」鱗甲減傷 30%；階段二（HP 66%）解鎖龍息與飛行突襲；階段三（HP 33%）「狂暴態」減傷轉 15% 且每 2 回合【滅世吐息】大範圍 範圍效果（AOE），進入易暴擊窗口。火焰抗性 ×0.5。
      - - **類人形形象**：高挑人形現身——赤紅長髮如熔岩垂落，額上生出一對漆黑龍角，鎧甲表面嵌滿層疊龍鱗，在火光下泛著金屬冷澤；雙瞳是熔金般的琥珀色，呼吸間噴出灼熱白煙。儘管收斂了巨龍軀體，鱗甲質感與龍族傲氣仍從骨子裡透出，她是四大魔將之首、離「龍」最近的將。
      - - 戰鬥登場台詞：「弱者退下。本將的鱗，不會為你們而溫。」
      - - 掉落：龍鱗片、炎鱗之核（史詩附魔素材）
    tables:
      []
  - heading: 魅將 莉麗絲·媚影（Succubus General）
    text:
      - - 挑戰等級（CR）：44　生命值（HP）：776　攻擊加值（ATK）：+12　迴避值（EVA）：16　減傷（DR）：15% 物理　移動力：6 格　先攻修正：+5　暴擊門檻（CritTh）：20　經驗值（EXP）：10,384（Boss ×4）
      - - 攻擊：魅惑之鞭 暗影 2d10+12
      - - 技能：幻舞（魅惑，依等級 1–3 回合）／慾念束縛（定身）／心魔分裂（複製隊友外形）
      - - 特性：階段一「誘惑之舞」幻舞控場；階段二（HP 66%）吸取被魅惑者 生命值（HP） 回補自身；階段三（HP 33%）真身顯現，心魔分裂製造信任危機，解魅後全力輸出。暗影抗性 ×0.5、心靈免疫。
      - - **類人形形象**：標準人形魅魔系——蝠翼收攏於背後如披風垂落，尖耳自魅紫長髮間探出，眼尾勾著誘人弧度，嘴角永遠掛著算準人心的微笑。走路像貓、說話像蜜，儘管收起惡魔的獰惡，那股天生誘惑特質仍從眼波與呼吸間漫出。
      - - 戰鬥登場台詞：「來嘛～乖乖睡著，就不用疼了喔？」
      - - 掉落：媚影之淚（史詩飾品素材）、精神寶珠
    tables:
      []
  - heading: 靈將 莫爾凡娜·寂葬（Necromancer General）
    text:
      - - 挑戰等級（CR）：42　生命值（HP）：748　攻擊加值（ATK）：+11　迴避值（EVA）：16　減傷（DR）：20% 物理　移動力：4 格　先攻修正：+4　暴擊門檻（CritTh）：暴擊免疫　經驗值（EXP）：9,576（Boss ×4）
      - - 攻擊：死靈法杖 暗影 2d10+11
      - - 技能：亡靈召喚（每回合補充小兵）／生命虹吸（吸血）／死亡領域（全場 DoT）
      - - 特性：階段一「召喚」消耗玩家 範圍效果（AOE）；階段二（HP 66%）屍潮與死亡領域；階段三（HP 33%）巫妖化，【暴擊免疫】核心顯露前無敵，須擊破護命棺材（可破物件）解除，【終焉亡歌】倒數。不死；暗影抗性 ×0.5；畏聖 ×1.5。
      - - **類人形形象**：身著蒼白巫女裝，膚色如月下霜雪，身形半透明，彷彿一陣風就能吹散；幽藍冥火環繞她緩緩飄浮，雙手捧著一支雕滿亡者之名、綴滿細碎骨片的骨杖。說話像隔著一層水，溫柔得近乎悲傷——她是為逝者守夜太久、再也回不去的巫女。
      - - 戰鬥登場台詞：「安睡吧……我會讓他們，陪你一起長眠。」
      - - 掉落：寂葬魂核（史詩素材）、永生符文
    tables:
      []
  - heading: 膠將 普露姆·凝膠（Slime General）
    text:
      - - 挑戰等級（CR）：46　生命值（HP）：808　攻擊加值（ATK）：+12　迴避值（EVA）：16　減傷（DR）：10% 全類型　移動力：4 格　先攻修正：+1　暴擊門檻（CritTh）：19（高 CR 降 1 檻）　經驗值（EXP）：11,224（Boss ×4）
      - - 攻擊：黏擊 鈍擊 2d10+12（酸蝕）
      - - 技能：分裂（受擊分為兩體）／酸液腐蝕（命中者 傷害減免（DR）−20%，持續 3 回合）／融合（子體合體回滿）
      - - 特性：階段一「分裂增殖」需 範圍效果（AOE） 清場（分裂：受擊時分裂出 1 個分身；分身 HP＝本體當前 50%、視同原 CR 半值、全場至多 2 體（含本體）、本體死亡即清場、不無限分裂）；階段二（HP 66%）融合回滿＋酸液腐蝕；階段三（HP 33%）「晶化」【暴擊免疫】＋高減傷（80%），須以鈍擊破晶後進入脆弱收尾。暴擊免疫；酸蝕免疫。
      - - **類人形形象**：半透明凝膠質感的人形少女，身體像果凍般微微晃動，光線穿過她會折射七彩，手指碰一下就「啵」地彈回去。用嬰兒腔喊人哥哥姐姐，見到甜食就眼睛發亮——四將裡最天真也最黏滑的吃貨，直到她整個人化開把敵人裹成糖漿球。
      - - 戰鬥登場台詞：「普露姆餓餓～把你們……變成甜甜的點心好不好？」
      - - 掉落：純淨凝膠核（史詩素材）、黏性精華
      - ---
    tables:
      []
  - heading: 三、女魔王（Demon Queen）
    text:
      []
    tables:
      []
  - heading: 薇爾賽莉雅·諾恩海姆（The Demon Queen）
    text:

  - heading: 五、世界之外（異界）敵人（Beyond the World）
    text:
      - > 非本土魔王軍，來自「世界裂隙（World Rift）」的異界存在。於 劇本8 魔王城崩塌後順裂隙湧入（見 劇本9–11 終局章）。主題特性與本土敵人區隔：**現實扭曲**（隨機改變站位圖／傳送角色）、**規則無效化**（無視部分本土減傷（DR）／地形掩護）、**世界之外抗性**（對本土元素傷害減免，須用異界專屬手段破防）、**裂隙同調**（高位者每回合自回 生命值（HP））。
      - > 數值依 GM 書 10.4 公式直算（暴擊門檻（CritTh）：CR55–75 降 1 檻至 19，CR85–99 降 2 檻至 18）；單人模式依澄清 B：CR−3、敵數×0.5。
      - > 三章終局結構：劇本9 終戰 **虛界哨戒（CR65 小boss）**；劇本10 終戰 **界蝕主宰（CR75 中boss）**；劇本11 先打 **終焉預言者（CR85 終局BOSS貼身護衛）** 再打 **世界之外·奇點（CR99 終局BOSS）**。

  - heading: 傑諾·五條（女性人類叛徒、魔王軍「第五人魔將」）
    text:
      - - **身分定位**：性別 女性｜種族 人類｜身份 人類的叛徒、魔王軍「第五人魔將」（「四大天王卻有五人」梗的承擔者）。原人類王國天才騎士，公會晉級考核被誣陷作弊除名而憤投魔王軍；一本正經吐槽役，堅持「我是第五個不是四大天王」。本質不壞，S2 戳中孤獨可觸發倒戈支線。
      - - 挑戰等級（CR）：45　生命值（HP）：792　攻擊加值（ATK）：+12　迴避值（EVA）：16　減傷（DR）：30% 物理　移動力：7 格　先攻修正：+6　暴擊門檻（CritTh）：20　經驗值（EXP）：10,800（Boss ×4）
      - - 攻擊：無形刃 穿刺 3d10+12（可複製職業招式）
      - - 技能：熟知戰術（預讀玩家行動，迴避值（EVA） 偏高）／複製隊友技能（反擊）／背刺暴擊（對落單者必暴）
      - - 特性：階段一「游擊」高閃避；階段二（HP 66%）背叛揭露，複製隊友技能＋落單必暴；階段三（HP 33%）分支——影響力點（IP） 足則【贖罪爆發】助戰，否則【絕望爆發】全開成最難戰。人類（無種族抗性）。
      - - **類人形形象**：披黑騎士風披風的人類女劍士，佩一把無形之刃，左眼烙著「叛旗」圖紋；與四將的異族風格形成鮮明的「人類叛徒」對比。
      - - 註：其「倒戈助戰」為 S4 該場戰鬥的**一次性劇情／階段轉換機制**，並非常駐協助角色；單人模式依澄清 B 運作，不額外附帶助戰角色，僅在 影響力點（IP） 達標的那一戰暫轉中立友方單位。
      - - 掉落：五條的佩刀（傳說武器素材）、叛旗碎片
      - ---

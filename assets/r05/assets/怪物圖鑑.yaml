      - - 攻擊：魔王之刃 暗影+物理 3d12+13
      - - 技能：四將殘響（輪轉龍／魅／死／膠之力）／統御領域（全場減益）／四元素毀滅（輪流 AOE）／終焉審判（全場即死威脅倒數：倒數 5 回合；未於 5 回合內打穿核心／破除審判源則全場即死（團滅）；倒數期間核心／審判源暴露可接受攻擊）
      - - 特性：階段一「統御」輪轉四將之力；階段二（HP 66%）真魔王型態，統御領域＋四元素毀滅；階段三（HP 33%）終焉，【終焉審判】即死倒數，玩家須限內打穿核心。可攻略／策反／招降（影響點 影響力點（IP） ≥ 40 開放和解結局）。全属性抗性 ×0.5、心靈免疫。

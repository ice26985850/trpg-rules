  - heading: 物品模板與材料→成品轉換公式（審計缺失項補齊）
    text:
      - > 玩家以「材料（8 統一欄位）× 物品模板」自由組合產出成品，本圖鑑不窮舉成品，僅定義各模板如何映射材料欄位為成品數值。模板共六類：
      - > 通用規則：未取用之欄位以「—」留空；`ReqLv` 決定成品等級門檻與基價（見頂部公式與第四節速查表），`Rarity` 決定稀有度倍率（普通×1／精良×3／稀有×8／史詩×20／傳說×35）。成品白板價＝基價 × (1 + 0.15 × (ReqLv − 1)) × 稀有度倍率。
    tables:
      - columns:
          - 物品模板
          - 材料 8 欄位 → 成品數值映射
        rows:
          - 物品模板: 武器（Weapon）
            材料 8 欄位 → 成品數值映射: `DmgBase` 累加為基礎武器傷害（傷害骰）；`DRBase` 轉減傷（破甲／格擋）；`StatBonus` 轉屬性加值（STR/DEX/MAG 或命中）；`DurBonus` 轉耐久（武器 40／重型 60）；`Tags` 轉特效（元素／暴擊等）；`ReqLv/Rarity` 決定等級門檻與價格倍率。
          - 物品模板: 防具（Armor）
            材料 8 欄位 → 成品數值映射: `DRBase` 轉減傷（物理減免%）；`StatBonus` 轉屬性加值（MAG+1、CON≥12 等）；`DurBonus` 轉耐久（防具 50／重甲 80）；`Tags` 轉抗性／特殊（火抗、受暴擊減傷）；`ReqLv/Rarity` 決定門檻與倍率。
          - 物品模板: 飾品（Accessory）
            材料 8 欄位 → 成品數值映射: `StatBonus` 轉屬性加值（STR/DEX/MAG/LUK/HP/MP/CritTh/EVA 等）；`DurBonus` 轉耐久（60）；`BuffType/BuffVal` 轉被動增益（暴擊傷害+%、掉落率+%）；`Tags` 轉抗性；`ReqLv/Rarity` 決定門檻與倍率。
          - 物品模板: 藥水（Potion）
            材料 8 欄位 → 成品數值映射: `HealBase`→治療量（回復 HP/MP 骰）；`DmgBase`→傷害（攻擊性藥水）；`Tags`→附加狀態（灼燒／淨化）；`BuffType/BuffVal`→暫時增益；`ReqLv/Rarity` 決定等級與基價。
          - 物品模板: 炸彈（Bomb）
            材料 8 欄位 → 成品數值映射: `DmgBase`→範圍傷害骰（AOE 半徑 1）；`Tags`→元素與附加狀態（火焰／冰凍＋減速）；`ReqLv/Rarity` 決定等級與基價；`DurBonus` 不適用（消耗品無耐久）。
          - 物品模板: 卷軸（Scroll）
            材料 8 欄位 → 成品數值映射: `DmgBase`/`Tags` 決定範圍與狀態（AOE 半徑、EVA−%、眩盲／灼燒等）；`HealBase` 轉淨化／解除效果；`ReqLv/Rarity` 決定等級與基價；`DurBonus` 不適用。
  - heading: 3-5 飾品材料（Accessory Materials，供鍛造）— 詳見 `材料圖鑑.md` §5
    text:
      - 飾品素材（力量水晶／敏捷護石／幸運幣礦／魔力結晶／守護之羽／暴擊之眼／龍瞳石等）的完整 8 欄位數值與取得來源，已收錄於 **`圖鑑/材料圖鑑.md` §5 飾品素材類**，本圖鑑不再重複列出，避免雙頭維護。鍛造取用其 `StatBonus`／`DurBonus`／`Tags` 生成飾品（見物品模板 飾品）。
      - > ⚠ 標記說明：寒霜露（炸彈／卷軸引信 DmgBase 2d6，依 05 §3.1.1 獨立區間）、聖光麥（生命值（HP）上限+10）／蛋（魔力點（MP）上限+15，上限型 Buff，依 05 §3.5(乙) 獨立區間）——此三項超出「武器 DmgBase」與「加值型 Buff」主表區間，但經數值框架（05）主理人裁定，落入對應獨立區間，合法非超模。

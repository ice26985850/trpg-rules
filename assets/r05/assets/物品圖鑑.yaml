  - heading: 三、生活技能產物（Life-Skill Products）與材料表
    text:
      - > 來源：採集類（採礦／伐木／採藥／漁撈狩獵／農園栽培）產原材料，製造類（鍊金／烹飪／鍛造）取原材料 × 物品模板產成品。生活技能不佔技能點（SP）。
      - > **材料完整列表已獨立成冊**：所有材料及其 8 統一欄位（傷害基數（DmgBase）／減傷基數（DRBase）／屬性加成（StatBonus）／耐久基數（DurBonus）／特效標籤（Tags）／等級門檻與稀有度檔（ReqLv／Rarity）／回復基數（HealBase）／增益類型與數值（BuffType／BuffVal））詳見 **`圖鑑/材料圖鑑.md`**。本節僅保留各製造技能說明與少量成品示例，避免重複維護。空白「—」表示該材料不取用此欄位。
    tables:
      []
  - heading: 3-1 採集類（原料來源）— 詳見 `材料圖鑑.md`
    text:
      - 原「種植」已拆分為 **農園栽培（據點）**＋**野外四採集（採礦／伐木／採藥／漁撈狩獵）**。各採集技能產出的原材料類別與對應材料，見 `材料圖鑑.md` §1 木材類／§2 礦石金屬類／§3 草藥類／§4 食材類／§5 飾品素材類／§6 獵獲素材。採集 DC 與節點分佈見玩家書第四章。
    tables:
      []
  - heading: 3-2 鍊金（Alchemy）— 藥材→藥水／炸彈／卷軸（設施：實驗室）
    text:
      - > 取用藥材之 `HealBase`／`DmgBase`／`Tags` 生成成品（見物品模板 藥水／炸彈／卷軸）。初級治療／魔力藥水可商店購，其餘自製／掉落。
    tables:
      []
  - heading: 3-3 烹飪（Cooking）— 食材→料理（設施：廚房）
    text:
      - > **基礎食物（白板商店售，供 生命值（HP）回復）**：基礎食物不列於自製料理欄，而由城鎮白板商店直接販售（見頂部白板總原則）。具名示例如下：
      - > - **聖光麥包**：類型 基礎食物；稀有度 普通；建議等級 1；效果 回復 生命值（HP）1d6＋2，並賦予暫時 生命值（HP）上限 +5（增益等級 1，持續戰鬥）；商店售價 **20 金幣（G）**（白板價＝基價 floor(20×1^1.3)=20 × (1+0.15×0)=20G，對齊「基礎食物另依白板價計」料理物價公式）。不佔料理欄，可隨身攜帶、戰鬥中使用。
      - > 所有料理統一「自製（廚房）」，商店不售（基礎食物除外）。
      - > 自製料理若供玩家間交易或 NPC 收購，售價 = 主食材基價 × (1 + 0.4 × 增益等級)（增益等級 1~3）；基礎食物另依白板價計（審計第 41 項）。

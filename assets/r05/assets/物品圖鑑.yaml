  - heading: 1-0 白板基礎裝（White-board Baseline，普通×1／無材料需求）
    text:
      - > 依審計第 ④ 項「白板裝備缺位」補齊：城鎮白板商店按 ReqLv 供應「嚴格低一階」基礎裝（普通稀有度×1，無材料需求，耐久同對應部位）。武器傷害骰／防具減傷（DR）百分比均較同名貴裝「低一階」，價格 = 白板價公式（普通×1）。
      - > 註：白板防具減傷採百分比（DR%），與戰鬥減傷系統一致並受總 DR 上限 60% 約束；原指令「減傷 1d8／1d10／1d12／2d8」以「嚴格低一階」百分比呈現（如 ReqLv30 白板 40% 低於守護鎧 45%）。

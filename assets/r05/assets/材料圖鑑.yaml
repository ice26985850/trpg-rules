title: "勇者之證（The Hero's Proof）— 材料圖鑑（Material Catalog）"
sections:
  - heading: "勇者之證（The Hero's Proof）— 材料圖鑑（Material Catalog）"
    text:
      - > **材料屬性驅動（Material-Driven）**：本圖鑑不窮舉成品，只列 **材料** 及其 **8 統一欄位**；成品數值由材料欄位 × 物品模板（見 `圖鑑/物品圖鑑.md` §一～§二 與玩家書第四章）決定，玩家自由組合。
      - > **8 統一欄位**：① 傷害基數（DmgBase）② 減傷基數（DRBase）③ 屬性加成（StatBonus）④ 耐久基數（DurBonus）⑤ 特效標籤（Tags）⑥ 等級門檻與稀有度檔（ReqLv／Rarity）⑦ 回復基數（HealBase）⑧ 增益類型與數值（BuffType／BuffVal）。空白「—」表示該材料不取用此欄位。
      - > **白板原則簡述**：城鎮商店僅售基礎（白板）裝備＋初級治療／魔力藥水＋基礎食物；中高級藥水、炸彈、卷軸、增益料理須經「採集→製造」自製或冒險掉落，不列商店貨架（詳見 `圖鑑/物品圖鑑.md` 頂部白板總原則）。
      - > **數值約束**：所有欄位值須落入 `設計稿/05_製造系統_數值框架.md` 第 3 節「稀有度→屬性上限」合法區間；成品稀有度＝max(材料稀有度)、成品等級門檻（ReqLv）＝max(材料 ReqLv)。
      - > **關聯文件**：成品模板示例見 `圖鑑/物品圖鑑.md`；製造／採集規則見玩家書第四章與 `圖鑑/材料圖鑑.md` 附錄（採集類生活技能設計）。
      - ---
    tables:
      []
  - heading: 〇、材料分類總覽（與採集／製造技能對應）
    text:
      - > **野生 vs 栽培標籤**：凡「採藥／漁撈狩獵」野外節點取得者標註「野生」；凡「農園栽培」據點設施取得者標註「栽培」。兩者數值相同，僅來源與取得時程不同（栽培需 3–14 日收穫）。
      - ---
    tables:
      - columns:
          - 章節
          - 材料類別
          - 主要取用欄位
          - 供製造技能（據點設施）
          - 對應採集來源
        rows:
          - 章節: §1
            材料類別: 木材類
            主要取用欄位: 傷害基數／耐久基數
            供製造技能（據點設施）: 鍛造（鍛冶爐）
            對應採集來源: 伐木
          - 章節: §2
            材料類別: 礦石金屬類（原礦→金屬錠）
            主要取用欄位: 傷害基數／減傷基數／耐久基數
            供製造技能（據點設施）: 鍛造（鍛冶爐·熔煉）
            對應採集來源: 採礦
          - 章節: §3
            材料類別: 草藥類
            主要取用欄位: 回復基數／傷害基數（引信）／特效標籤
            供製造技能（據點設施）: 鍊金（實驗室）
            對應採集來源: 採藥／農園栽培
          - 章節: §4
            材料類別: 食材類
            主要取用欄位: 增益類型／增益數值
            供製造技能（據點設施）: 烹飪（廚房）
            對應採集來源: 漁撈狩獵／農園栽培
          - 章節: §5
            材料類別: 飾品素材類
            主要取用欄位: 屬性加成／耐久基數／特效標籤
            供製造技能（據點設施）: 鍛造（鍛冶爐）
            對應採集來源: 採礦／漁撈狩獵
          - 章節: §6
            材料類別: 其他／獵獲素材
            主要取用欄位: 減傷基數／增益類型
            供製造技能（據點設施）: 鍛造／烹飪
            對應採集來源: 漁撈狩獵
  - heading: §1　木材類（Wood）
    text:
      - > 取用欄位：傷害基數（DmgBase）／耐久基數（DurBonus）。主要供鍛造製作武器（長劍／弓／法杖等木柄）與輕型防具骨架。稀有度錨定：普通 1d2~1d8、精良 1d8~1d10、稀有 1d10~1d12、史詩 1d12~2d6、傳說 2d6~3d8。
      - > 驗證：普通木 `1d2` ＜ 鐵木 `1d5` ；龍血木 `2d6` 達史詩 DmgBase 區間頂（1d12~2d6），未超模。

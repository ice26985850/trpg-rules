    text:
      - > 取用欄位：回復基數（HealBase）／傷害基數（DmgBase，作炸彈引信）／特效標籤（Tags）。主要供鍊金製作藥水／炸彈／卷軸。HealBase 錨定：普通 2d6~4d6、精良 4d6~8d6、稀有 8d6~12d6、史詩 12d6~16d6、傳說 16d6~20d6。
      - > ⚠E1：火焰花（普通 DmgBase `3d6`）、寒霜露（精良 `2d6`）作炸彈／卷軸引信，依 `設計稿/05` §3.1.1「引信 DmgBase 獨立區間」（普通 2d6~4d6、精良 2d6~6d6），二者皆落區間，經主理人裁定合法（非武器 DmgBase 主表）。
      - > ⚠E2：聖光麥（生命值（HP）上限+10）依 `設計稿/05` §3.5(乙)「上限型 Buff 獨立區間」（普通 +10~+20），落區間，合法。

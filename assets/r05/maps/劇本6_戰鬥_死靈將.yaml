edges:
  - from: boss
    to: e_ghost_a
    type: 指揮
  - from: boss
    to: e_ghost_b
    type: 指揮
  - from: coffin
    to: boss
    type: 核心連結
    style: dashed
    label: "無敵核心"
  - from: e_zombie_a
    to: p_front_war
    type: 近戰
    style: dashed
  - from: e_skel_a
    to: p_front_monk
    type: 近戰
    style: dashed
  - from: e_ghost_a
    to: p_back_cleric
    type: 射程
    style: dashed
    label: "神聖弱點威脅"

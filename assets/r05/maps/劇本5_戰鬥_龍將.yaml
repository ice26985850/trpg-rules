scenario: S1
section: 第一魔將·龍將戰（CL 5–12）
map_type: battle
grid_scale: "1格=2公尺"
title: S1_戰鬥_龍將
# 座標為精確格子座標（col, row，0–9），供距離與射程計算
# 前後排間隔 2 格（4m），敵方在上方、我方在下方

battle:
  cols: 10
  rows: 10
  # 前排線（靠近對方）與後排線間隔 2 格
  lines:
    - {row: 3, side: 敵, role: 前排, color: "#FF8A8A"}
    - {row: 1, side: 敵, role: 後排, color: "#FFC8C8"}
    - {row: 6, side: 我, role: 前排, color: "#8AAEFF"}
    - {row: 8, side: 我, role: 後排, color: "#C8D8FF"}
  # 範圍效果（AOE）：中心格 + 半徑 R 格（依戰鬥系統 §10）
  aoe:
    - {cx: 5, cy: 2, r: 2, label: 龍息範圍效果（AOE，半徑2格=4m）}

nodes:
  - id: boss
    label: 龍將（伊格妮絲）
    x: 5
    y: 1
    type: boss
    explored: true
  - id: e_front_a
    label: 敵前排甲
    x: 3
    y: 3
    type: 敵近戰
    explored: true
  - id: e_front_b
    label: 敵前排乙
    x: 6
    y: 3
    type: 敵近戰
    explored: true
  - id: e_front_c
    label: 敵前排丙
    x: 8
    y: 3
    type: 敵近戰
    explored: true
  - id: e_back_arc
    label: 敵後排弓
    x: 2
    y: 1
    type: 敵遠程
    explored: true
  - id: e_back_mag
    label: 敵後排法
    x: 7
    y: 1
    type: 敵遠程
    explored: true
  - id: p_front_war
    label: 我方前排戰士
    x: 3
    y: 6
    type: 我前排
    explored: true
  - id: p_front_monk
    label: 我方前排格鬥
    x: 6
    y: 6
    type: 我前排
    explored: true
  - id: p_back_mage
    label: 我方後排法師
    x: 4
    y: 8
    type: 我後排
    explored: true
  - id: p_back_cleric
    label: 我方後排牧師
    x: 5
    y: 8
    type: 我後排
    explored: true
  - id: p_back_hunter
    label: 我方後排獵人
    x: 7
    y: 8
    type: 我後排
    explored: true

edges:
  - from: boss
    to: e_front_a
    type: 指揮
  - from: e_back_arc
    to: p_back_cleric
    type: 射程
    style: dashed
    label: "中程威脅"
  - from: p_front_war
    to: e_front_a
    type: 近戰
    style: dashed

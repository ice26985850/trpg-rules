scenario: D1
section: "D1 哥布林巢穴·寢窟（CR3）"
map_type: battle
grid_scale: "1格=2公尺"
title: D1_戰鬥_寢窟
# 座標為精確格子座標（col, row，0–9），供距離與射程計算
# 弓手位於敵後排（row1），以遠程壓制我方後排

battle:
  cols: 10
  rows: 10
  lines:
    - {row: 3, side: 敵, role: 前排, color: "#FF8A8A"}
    - {row: 1, side: 敵, role: 後排, color: "#FFC8C8"}
    - {row: 6, side: 我, role: 前排, color: "#8AAEFF"}
    - {row: 8, side: 我, role: 後排, color: "#C8D8FF"}

nodes:
  - id: e_arch1
    label: 哥布林弓手甲
    x: 4
    y: 1
    type: 敵遠程
    explored: true
  - id: e_arch2
    label: 哥布林弓手乙
    x: 6
    y: 1
    type: 敵遠程
    explored: true
  - id: p_front_war
    label: 我方前排戰士
    x: 3
    y: 6
    type: 我前排
    explored: true
  - id: p_front_monk
    label: 我方前排格鬥
    x: 6
    y: 6
    type: 我前排
    explored: true
  - id: p_back_mage
    label: 我方後排法師
    x: 4
    y: 8
    type: 我後排
    explored: true
  - id: p_back_cleric
    label: 我方後排牧師
    x: 5
    y: 8
    type: 我後排
    explored: true
  - id: p_back_hunter
    label: 我方後排獵人
    x: 7
    y: 8
    type: 我後排
    explored: true

edges:
  - from: e_arch1
    to: p_back_cleric
    type: 射程
    style: dashed
    label: "遠程威脅"

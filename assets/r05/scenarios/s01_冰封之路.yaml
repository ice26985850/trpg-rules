# 冰封之路 —— 凍結廢土 TRPG 戰役劇本（結構化索引）
# 本檔由同名 .md 劇本整理而來，供網站提供 .md / .yaml 雙格式下載。
# 完整場景描述、遭遇設計與 GM 指引請參照 s01_冰封之路.md。
# 結構自由：以下欄位僅為本劇本的組織方式，非強制。

name: "冰封之路"
description: |
  這是一個 8–10 場遊戲的連續戰役，講述一群從廢土中甦醒的冷行者逐步揭開凍結真相的故事。
  從超市中學習生存，到時鐘塔上重塑世界——這是一條從「活下來」到「選擇如何活」的道路。
  戰役圍繞核心秘密「創世假說」（凍結的起源與逆轉的可能性）構建，情感主線是「還在找的人」：
  每個角色都在尋找於凍結中失去的重要之人。
difficulty: "新手 → 傳奇（難度隨幕次遞增）"
player_count: "2–5 名玩家 + 1 名 GM"
starting_equipment:
  - "基礎掠奪裝備（由 GM 依首場難度與角色背景調整）"
scenes:
  - name: "第1場：冰下市場"
    description: "新手｜凍結區：霜落超市。生存入門、首次倫理選擇。"
  - name: "第2場：鄰里之聲"
    description: "新手｜凍結區：霜鈴小區。團隊建立、記憶與失去。"
  - name: "第3場：黑板上的星圖"
    description: "新手｜凍結區：啟明小學。第一個主線線索、群體倫理。"
  - name: "第4場：手術刀下的心跳"
    description: "中級｜凍結區：聖瑪莉紀念醫院。生命倫理、陣營介入。"
  - name: "第5場：凍結的脈搏"
    description: "中級｜凍結區：永凍能源廠。技術挑戰、後果初現。"
  - name: "第6場：冰海燈塔"
    description: "高難度｜凍結區：凍潮港。線索匯聚、主要對手現身。"
  - name: "第7場：鐵霜通訊"
    description: "高難度｜凍結區：鐵霜哨站。真相碎片、軍事倫理。"
  - name: "第8場：第七層"
    description: "高難度｜凍結區：時間實驗室·第七層。創世假說核心、重大揭示。"
  - name: "第9場：鐘聲為誰而鳴"
    description: "傳奇｜凍結區：永恆尖塔。終極考驗、世界抉擇。"
  - name: "第10場：時間的全貌"
    description: "傳奇｜凍結區：創世迴廊。傳奇結局、角色命運。"
objectives:
  - "揭開「創世假說」——凍結的起源與逆轉的可能性"
  - "找回在凍結中失去的重要之人"
rewards:
  - "時間結晶、裝備與理解（里程碑成長，無等級數值膨脹）"
notes:
  - "附錄A：戰役主要 NPC 一覽"
  - "附錄B：創世假說碎片收集指南"
  - "附錄C：劇情分支與後果追蹤表"

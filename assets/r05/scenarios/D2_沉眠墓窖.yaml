name: 地城模組 D2 — 沉眠墓窖（Silent Crypt）
description: 推薦 Rank：C／D（挑戰等級（CR） 13–18）｜主題：不死墓窖、銜接 S2 死靈線 解鎖：完成公會委託「C-海1 幽靈船探險」發現入口；或由 GM 依劇情開放。 地圖：`地圖/D2_沉眠墓窖.yaml` ＋ `地圖/D2_沉眠墓窖.svg` 本作沒有兼職；單人進入依人數調整規則（GM 書 13.1：挑戰等級（CR）−3、敵數 ×0.5，無助戰）。 探索輪規則、陷阱（17.4）、寶箱（17.5）、休息（17.6）、撤退（17.3）詳見 GM 書第十七章。墓窖內不死系敵人弱 神聖 ×1.5（見怪物圖鑑）。 站位圖敵方在上、我方在下，前後排間隔 2 格（4m）；單人進入依 GM 書 13.1 調整（挑戰等級（CR）−3、敵數 ×0.5，無助戰）。 設計提示：D2 是中期「刷 EXP＋G＋史詩配方」與 S2 主線前置 的雙重場。建議在推進 S2 前先清墓窖，既能練等又能削弱首領外圍。

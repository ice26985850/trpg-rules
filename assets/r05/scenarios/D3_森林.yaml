name: 地城模組 D3 — 森林（Forest）
description: 推薦 Rank：F／E（挑戰等級（CR） 1–6）｜主題：翠綠密林、低中階刷資源 承接：公會委託「F-森1／E-森1」（對應 Rank F→E，CL 1–6）；或由 GM 指定為練級場。 地圖：`地圖/D3_森林.yaml` ＋ `地圖/D3_森林.svg` 本作沒有兼職；單人進入依人數調整規則（GM 書 13.1：挑戰等級（CR）−3、敵數 ×0.5，無助戰）。 探索輪規則、陷阱（17.4）、寶箱（17.5）、休息（17.6）、撤退（17.3）詳見 GM 書第十七章。 站位圖敵方在上、我方在下，前後排間隔 2 格（4m）；單人進入依 GM 書 13.1 調整（挑戰等級（CR）−3、敵數 ×0.5，無助戰）。 設計提示：D3 是 CL 1–6「刷 EXP＋G＋素材」的穩定場，避免玩家只靠主線魔將戰升級導致經濟失衡。可每日重刷（見《委託目錄》〇、重置規則）。

# 孤狼之路 —— 凍結廢土 TRPG 單人戰役劇本（結構化索引）
# 本檔由同名 .md 劇本整理而來，供網站提供 .md / .yaml 雙格式下載。
# 完整場景描述、遭遇設計與單人規則請參照 s02_孤狼之路.md。
# 結構自由：以下欄位僅為本劇本的組織方式，非強制。

name: "孤狼之路"
description: |
  單人戰役（1 名玩家 + 1 名 GM + 1 名 NPC 夥伴）。你是一名獨行的時間掠奪者——
  不是因為你選擇孤獨，而是因為你的隊伍在一次痙攣型解凍中全滅。你活下來了，
  但代價是永遠無法擺脫的內疚。你接到湖心城掠奪者工會的委託：深入凍結區，
  尋找一位據說「還沒死」的凍結前科學家，他可能掌握凍結的真相。
  這是一條從創傷、信任到終局抉擇的成長弧線，9 場覆蓋新手至傳奇。
difficulty: "新手 → 傳奇（難度隨幕次遞增）"
player_count: "1 名玩家 + 1 名 GM + 1 名 NPC 夥伴（單人模式）"
starting_equipment:
  - "基礎掠奪裝備（依《單人模式規則補充》與首場難度調整）"
scenes:
  - name: "第1場：霜落之下"
    description: "新手｜凍結區：霜落超市。起步、學習獨行。"
  - name: "第2場：寂靜之鈴"
    description: "新手｜凍結區：霜鈴小區。回音、接受夥伴。"
  - name: "第3場：黑板上的回音"
    description: "新手｜凍結區：啟明小學。信任、群體倫理。"
  - name: "第4場：手術刀下的寂靜"
    description: "中級｜凍結區：聖瑪莉紀念醫院。技能成長、生命倫理。"
  - name: "第5場：永恆的脈搏"
    description: "中級｜凍結區：永凍能源廠。背叛、技術挑戰。"
  - name: "第6場：冰海之燈"
    description: "高難度｜凍結區：凍潮港。信任考驗、線索匯聚。"
  - name: "第7場：鐵霜之聲"
    description: "高難度｜凍結區：鐵霜哨站。面對創傷、軍事倫理。"
  - name: "第8場：第七層"
    description: "高難度｜凍結區：時間實驗室·第七層。真相揭示、創世假說核心。"
  - name: "第9場：時間的全貌"
    description: "傳奇｜凍結區：創世迴廊。終局抉擇、角色命運。"
objectives:
  - "尋找「還沒死」的凍結前科學家，揭開凍結真相"
  - "在孤獨中重建信任，與自己和解"
rewards:
  - "時間結晶、裝備與理解（里程碑成長，無等級數值膨脹）"
notes:
  - "使用《單人模式規則補充》的 NPC 夥伴系統、單人戰鬥縮放、單人救援替代方案"
  - "引用《樣本凍結區擴充》中的凍結區（標註於每場）"
  - "附錄：NPC 夥伴一覽／創世假說碎片收集指南"

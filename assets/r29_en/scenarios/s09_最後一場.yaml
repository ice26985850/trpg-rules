# Last Stand TRPG — Scenario S9 (Solo): The Last Match
scenario:
  id: S9
  name: The Last Match
  type: solo
  tier: 3
  difficulty: 5
  estimated_duration: 5-7 hours
  suggested_level: 7-8

  description: >
    This is your last match. Win and you retire—lose and you stay here
    forever. An abandoned city trembles in the storm. Twenty elite Lone Wolves
    drop into this dead city. And your nemesis—your former partner—has signed
    up too. He survived. And he has a score to settle with you.

map:
  name: Drowned City
  size: 6 km × 6 km
  terrain: [Abandoned Urban (70%), Underground Pipes (20%), Water (10%)]
  landmarks:
    - { id: L1, name: Skyline Tower, type: urban, loot_level: Abundant (Blue), description: A 60-floor abandoned skyscraper—panoramic view but extremely exposed }
    - { id: L2, name: Subway System, type: urban, loot_level: Common (Green), description: Abandoned subway tunnels—dark passages connecting the whole city }
    - { id: L3, name: Broadcast Tower, type: special, loot_level: -, description: One of the city's three tallest radio towers }
    - { id: L4, name: City Hospital, type: urban, loot_level: Abundant (Blue), description: An abandoned hospital—plenty of medical supplies, but perfect for ambush }
    - { id: L5, name: Harbor Authority Building, type: urban, loot_level: Military (Purple), description: An administration building by the port—once a military command center }

enemy_configuration:
  total_lone_wolves: 19  # all-elite lineup
  distribution:
    - { type: Steady, difficulty: ★★, count: 4 }
    - { type: Assault, difficulty: ★★★, count: 5 }
    - { type: Ambush, difficulty: ★★★, count: 5 }
    - { type: Professional, difficulty: ★★★★, count: 4 }
    - { type: GM-custom, difficulty: ★★★★★, count: 1, note: "\"The Collector\"—a legendary contestant who has never lost" }

nemesis:
  name: Kai Morrison
  codename: The Ashes
  style: Mirror Nemesis (uses the same weapons and tactics as the player)
  strength: 10/10
  weapon: Same primary weapon as the player
  backstory: >
    Your former partner. You two entered seven matches together, crawling out
    of piles of corpses side by side. Until that one match—you let him go Downed,
    and you did not go back for him. You thought he was dead. But he was not. He
    spent a year recovering, and another year training, all for today. During the
    match you will find things he deliberately left behind:
    - a photo of you two from before (on some killed Lone Wolf)
    - an empty shell casing—the signal you two once agreed on
    - a can of the beer you two used to drink (left on a table in a safe room, still cold)
    He is telling you: "Hey. I'm here."

circle:
  type: GM secretly decides—even the GM is unsure whether they will change the circle mid-match
  description: The circle is hard to predict in the storm—adding uncertainty

airdrop: { enabled: false, note: No airdrop—loot comes only from killed enemies }
red_zone: { enabled: true, special: Bombing concentrated in densely built-up areas—forces floor changes }
vehicles: [Motorcycle, Jeep (scarce)]
weather: Storm throughout—vision halved, footsteps masked by rain (Hearing Range ×0.5)
time_of_day: Afternoon → Dusk → Night

special_rules:
  - 3 Radio Towers
  - Auditory Compensation ×0.5 (storm interference)
  - Lone Wolf Instinct active but weakened (storm interferes with perception)
  - No starting loot—killing enemies is the only supply source
  - Subway system provides fast-movement routes (but someone may be in the tunnels)
  - The nemesis's clues are scattered across the city

phases:
  - phase: Back to the Start
    turns: 1
    gm_notes: >
      "In the storm, the transport plane's cargo door opens—
      below is a city you know. You and Kai fought three matches here.
      But this time is different—this time you are here to end it all."

  - phase: The City's Memory
    turns: 4-5
    gm_notes: >
      Guide the player to explore the city—every landmark is a place where you
      once fought side by side. Skyline Tower—you held the bridge there together.
      City Hospital—where you first saved his life. Let memory and reality
      intertwine—let the player feel "this city knows us."

  - phase: The Nemesis's Game
    turns: 4-5
    gm_notes: >
      The nemesis will not appear directly. He leaves clues—each clue a fragment
      of your shared past. The player begins to hesitate, to remember, to
      question. This is psychological warfare—the nemesis is "preparing" the
      player to face him.

      Meanwhile, the other elite Lone Wolves keep applying pressure. Make the
      player struggle between "tracking the nemesis's clues" and "dealing with
      the threat in front of them."

  - phase: Hunt in the Storm
    turns: 4-5
    gm_notes: >
      The storm is the perfect stage—blurred vision, deafened hearing. Every
      corner may be a duel. Let the environment itself become an opponent—
      flooded streets slow you down, collapsed buildings block routes, lightning
      illuminates a target for an instant.

  - phase: Final Circle - Us
    turns: 2-3
    gm_notes: >
      The top floor of Skyline Tower—where you first worked together. The circle
      shrinks to just this floor. You and Kai.
      "Rain comes in through the broken window. Lightning illuminates his face—
      he has aged, but his eyes have not changed. In his hands is that gun—
      the one you gave him."

      Give the player a real choice:
      - Fire—end it all, take the bounty, retire
      - Lower your gun—say "I'm sorry"

      Whatever the choice, the outcome is decided by the dice—
      but the choice itself is the player's.

victory_condition: Become the last surviving Lone Wolf—or find something more important than victory
xp_rewards:
cr_rewards:
  per_elimination: 30
  squad_wipe: 50
  survival_top10: 100
  survival_top5: 150
  chicken_dinner: 500
  rescue_teammate: 20
  chicken_dinner: 500
  per_elimination: 80
  nemesis_defeated: 500
  nemesis_reconciled: 800  # chose to lower the gun and achieved reconciliation

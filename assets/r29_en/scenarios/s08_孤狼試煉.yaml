new_mechanics_introduced:
  - Bounty Hunter System (enemies actively track the player)
  - Drone Patrol System (environmental surveillance pressure)
  - Chemical Contamination Zone (sustained environmental damage)
  - Unstable Structures (risk of industrial cover collapsing)
  - Decoy Traps (deceptive behavior of enemy AI)

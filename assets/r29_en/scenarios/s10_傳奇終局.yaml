# Last Stand TRPG — Scenario S10 (Solo): Legendary Endgame
# Type: Solo
# Suggested Level: 9-10
# Difficulty: ★★★★★
scenario:
  id: S10
  name: Legendary Endgame
  type: solo
  tier: 5
  difficulty: 5
  estimated_duration: 6-8 hours
  suggested_level: 9-10

  description: >
    You won your last match. You thought it was over.

    Then that letter came.

    A black envelope, gold wax seal—Pandora Entertainment Group's highest-level
    invitation. "Dear Champion: your performance has been flagged in our files
    as 'Legendary Tier'. For this, we cordially invite you to a private event—
    limited to five legendary champions, and you."

    The prize is not money—you already have more than enough. The prize is
    "freedom." Permanent removal from Pandora's lists. You will never again
    receive an invitation, a threat letter, or a "special opportunity." You are
    free.

    But the opponents are five legends who have never lost. One of them—"the
    Reaper"—holds the record of 25 wins. Do you think you can become the 26th?
    he asks.

map:
  name: Ascension Arena
  size: 3 km × 3 km (vertical multi-level structure)
  description: >
    The exclusive arena Pandora built for this event. Not a natural island—a
    carefully designed killing stage. A five-ring structure, 600 m diameter per
    floor, connected between floors by vertical passages. The ground floor is the
    open central arena—no cover, pure duel space. The top floor is the
    panoramic control room—where Pandora's executives watch.

  terrain_mix:
    ground_floor_central_arena: 20%
    second_floor_factory_maze: 20%
    third_floor_residential_sim: 20%
    fourth_floor_jungle_dome: 20%
    fifth_floor_panoramic_control: 10%
    vertical_passages: 10%

  special_rules:
    - "Vertical Combat: a five-floor structure, connected between floors by elevator shafts, ventilation ducts, and outer-wall climbing points"
    - "Champion Trial: all five enemies are Champion-tier (★★★★★). No Rookies, no Steady—only legends"
    - "Audience System: live commentary by Pandora executives plays over the arena-wide broadcast—Stress +1 every 3 rounds (unresistable)"
    - "Arena Traps: the central arena has remote-controlled flamethrowers and electric floors—the GM activates one trap every 5 rounds (d6 determines position)"
    - "Final Liberation: after defeating the Reaper, the player may choose 'leave' or 'take over'—different endings"

regions:
  - id: R1
    name: Central Arena (Ground Floor)
    terrain: Open Space
    loot_level: None
    nodes: [C3, D3, C4, D4]
    landmark: L1
    special: >
      Completely open—no cover at all. Spectator stands on the outer ring
      (impassable). Four giant steel columns support the upper structure—the
      only usable cover. Trap: flamethrowers (erupt from the floor every 5
      rounds, 3d8 fire damage, random 10 m radius area)
  - id: R2
    name: Factory Maze (Second Floor)
    terrain: Industrial Maze
    loot_level: Military (Purple)
    nodes: [B2, C2, D2, B3, C3, D3]
    landmark: L2
    special: >
      Narrow passages, conveyor belts, and stacked containers. Extremely limited
      visibility—every corner may be a duel. Heavy industrial noise masks
      footsteps. The only Military-grade supply point—but all champions know it.
  - id: R3
    name: Residential Sim Zone (Third Floor)
    terrain: Residential
    loot_level: Common (Green)
    nodes: [B4, C4, B5, C5, B6, C6]
    landmark: L3
    special: >
      Replica apartments and homes—simulating a real urban environment. Suited to
      stealth and ambush. Every room may hold loot—or a trap.
  - id: R4
    name: Jungle Dome (Fourth Floor)
    terrain: Jungle
    loot_level: Abundant (Blue)
    nodes: [D1, E1, D2, E2, F2]
    landmark: L4
    special: >
      Artificial jungle—real trees, streams, even artificial rain. Pandora's
      climate-control system runs at full power here. Dense vegetation provides
      natural cover—but also hides snakes and traps (GM may add environmental
      threats).
  - id: R5
    name: Panoramic Control Room (Top Floor)
    terrain: Indoor
    loot_level: None
    nodes: [A1]
    landmark: L5
    special: >
      The Pandora executives' viewing room. Behind bulletproof glass—they are
      drinking champagne. The player may enter (requires Hacking or Demolition
      skill DC 18), but upon entry all remaining champions immediately learn the
      player's position—"He's in the control room! Protect the executives!"
  - id: R6
    name: Vertical Passage Network
    terrain: Passage
    loot_level: None
    nodes: [connecting all floors]
    special: >
      Four connection methods:
      - Central elevator shaft (fast but fully exposed)
      - Outer-wall climbing points (Physique DC 15, stealthy)
      - Ventilation ducts (crawl only, stealthy but slow)
      - Emergency stairs (medium speed, half-exposed)

landmarks:
  - { id: L1, name: Central Arena, type: arena,
      features: [Steel Columns ×4, Flamethrowers ×8 (under floor), Electric Floors ×4 zones],
      strategic_value: The stage for the final duel—when the circle shrinks here, there is nowhere to hide }
  - { id: L2, name: Factory Maze, type: industrial,
      features: [Containers ×30, Conveyor Belts ×6 (movable), Cranes ×2],
      strategic_value: The only Military-grade supply point on the map—and the champions' hunting ground }
  - { id: L3, name: Residential Sim Zone, type: residential,
      buildings: [Apartments ×12, Convenience Stores ×3, School ×1],
      special: One of the apartments is a "memorial hall"—photos of past champions hang on the wall. The Reaper's spot is empty—waiting for you }
  - { id: L4, name: Jungle Dome, type: jungle,
      features: [Artificial Streams ×2, Canopy Walkway ×1, Viewing Platforms ×3],
      special: The climate control can be changed manually—the GM may choose "heavy rain mode" or "dense fog mode" }
  - { id: L5, name: Panoramic Control Room, type: control_room,
      features: [Bulletproof Glass ×1 (HP 100), Monitoring Screen Wall ×1 (shows all arena cameras), Executive Seats ×6],
      special: Entering the control room lets you view the monitoring screens—showing the real-time position of all remaining champions. But the cost is exposing yourself }

enemy_configuration:
  total_champions: 5  # all champion-tier—no Rookies, Steady, or Assault
  description: >
    Five legendary champions—each with a story, each with a codename, each with
    a record of never losing. They are not randomly generated enemies—they are
    opponents Pandora hand-picked for you.
  champions:
    - { id: C1, name: The Bulwark, style: Defensive Champion,
        weapon: M249 LMG + Level 3 Armor + Level 3 Helmet, strength: 9/10,
        special: "Cannot be knocked back. Suppressing Fire range doubled. Weakness: extremely slow movement" }
    - { id: C2, name: The Mirage, style: Stealth Champion,
        weapon: Suppressed Vector + Smoke Grenades ×6 + Tactical Knife, strength: 9/10,
        special: "May use a Bonus Action to Hide each round (requires DC 18 Perception to detect). Weakness: lower HP" }
    - { id: C3, name: The Hurricane, style: Assault Champion,
        weapon: AKM + Adrenaline ×3 + Grenades ×5, strength: 10/10,
        special: "Adrenaline has no side effects. May charge once per encounter (move + melee simultaneously). Weakness: impulsive—easily baited" }
    - { id: C4, name: The Red Fox, style: Sniper Champion,
        weapon: AWM + 8x Scope + Suppressor, strength: 10/10,
        special: "May make an Aimed Shot even after moving. Weakness: weak at close range—only a P92 pistol" }
    - { id: C5, name: The Reaper, style: Versatile Champion (final Boss),
        weapon: Custom Legendary M416 (fully kitted) + Desert Eagle, strength: 11/10,
        special: "25 wins. He can predict your every move. When your HP drops below 50%, he slows his pace—not out of mercy, but enjoyment. Weakness: arrogance. He gives you openings—because he is too eager to prove that no one can beat him. When you make a move he completely fails to anticipate (GM's call), he has Disadvantage on his next attack." }

nemesis:
  name: The Reaper
  full_name: "Unknown (deleted from Pandora's archives)"
  style: Legendary Champion—Versatile type
  strength: 11/10
  weapon: Legendary M416 (fully kitted) + Desert Eagle
  armor: Level 3 Helmet + Level 3 Armor
  backstory: >
    25 wins, 0 losses. This record has never been approached in Pandora's
    history. He does not enter for money—his own prize money has piled up so
    much he has never even collected it. He competes because it is the only
    moment he feels truly alive.

    One note in his file—written by a Pandora psychological analyst:
    "The subject shows a pathological craving for 'a sense of challenge.'
    Recommend not assigning overly weak opponents—he will feel insulted, then
    become unpredictable."

    He heard of you. He watched every one of your match recordings. You are the
    person he has waited years for—someone who might truly defeat him. He will
    not let you down. Hopefully you will not let him down either.

circle:
  type: Vertical Contraction
  description: >
    The circle contracts downward from the top floor—forcing all champions to
    descend floor by floor. Every two circles, the Safe Zone moves down one
    level. The final circle is in the central arena—the open space at the bottom
    floor. No cover. No way back. Only two legends—and all of Pandora's
    executives watching.

  timeline:
    - { phase: First Circle, zone: [Panoramic Control Room + Jungle Dome (floors 4-5)], diameter: 1.5km, countdown: 5 rounds }
    - { phase: Second Circle, zone: [Jungle Dome + Residential Zone (floors 3-4)], diameter: 1.0km, countdown: 4 rounds }
    - { phase: Third Circle, zone: [Residential Zone + Factory Maze (floors 2-3)], diameter: 0.6km, countdown: 3 rounds }
    - { phase: Fourth Circle, zone: [Factory Maze (floor 2)], diameter: 0.3km, countdown: 2 rounds }
    - { phase: Final Circle, zone: [Central Arena (ground floor)], diameter: 0.05km, countdown: 1 round }

phases:
  - phase: Invitation
    turns: 0 (opening)
    gm_notes: >
      This is not a parachute drop—it is a show. The player is driven to the
      arena by a private car. Walking down a long corridor—holographic
      projections of past champions line both sides. At the end of the corridor—
      a door. Carved into it:
      "Beyond this door, legends are born—or ended."

      The Pandora CEO's voice comes over the arena-wide broadcast:
      "Distinguished guests—welcome to the 47th Legendary Invitational.
      Tonight's challenger is—(your codename).
      And he will face—five champions who have never lost.
      Who will be left standing? Let us—begin."

  - phase: First Blood
    turns: 3-4
    gm_notes: >
      The five champions each land (or enter) on different floors. The player
      starts on the third floor (residential zone)—a neutral zone, with time to
      adjust. The first encounter should be "the Mirage" or "the Bulwark"—let
      the player feel the pressure of a champion-level opponent, but not be
      instantly killed. Key point: make the player realize "these are not
      ordinary enemies—their AI is serious."

  - phase: Vertical Chase
    turns: 5-6
    gm_notes: >
      The circle begins to contract downward. The champions begin to move. This
      is the core passage of vertical combat:
      - the player may meet "the Hurricane" charging up the stairwell
      - "the Red Fox" may snipe from an upper-floor window at the player climbing the outer wall
      - "the Bulwark" may occupy the bottom of the mandatory elevator shaft—like an unavoidable tower

      Use the vertical space to create tension—"You hear footsteps overhead—
      but the elevator shaft's echo makes it impossible to tell if it is one
      floor up or two."

  - phase: Audience Pressure
    turns: 3-4
    gm_notes: >
      Pandora's executives begin using the "audience vote" system—they can vote
      on the type and position of the next arena trap. The GM announces: "A line
      flashes across the screen—audience vote: flamethrower, third quadrant."
      This gives the player a warning—but also adds pressure.

      Use the broadcast system to play "the Reaper's" commentary on the player:
      "You know what—he switched weapons in his last match. Why? Because he was
      afraid. Afraid to use the gun he knows best—because that gun reminds him of
      someone."

  - phase: Final Circle - You and the Reaper
    turns: 3-5
    gm_notes: >
      The central arena. All other champions have been eliminated or taken by
      Out-of-Zone Damage. Only you and the Reaper remain.

      The arena lights focus on you both. Pandora's executives look down from
      the panoramic control room. The whole arena falls silent.

      The Reaper speaks:
      "Twenty-five. You are the third person I have seen reach this point.
      The first two—both fell here. Do you know why?
      Not because I am stronger than them—because they wanted to win too much.
      What about you? Why are you here?"

      Give the player a choice:
      A. "For freedom." (make a Persuade contest—may make the Reaper hesitate)
      B. "To beat you." (go straight into combat—but the Reaper's respect for you +1)
      C. "I don't know." (the most honest answer—the Reaper laughs, then says "That is the best answer I have ever heard.")

      Then—the duel begins. No Safe Zone in the final circle. 6d4/round. Not a
      contest of gunplay—a clash of wills between two legends.

  - phase: Ending
    turns: 0 (epilogue)
    gm_notes: >
      Depends on the outcome:

      **Player wins:**
      The Reaper falls. The arena is silent for three seconds—then erupts in
      thunderous applause. The Pandora CEO's voice: "Ladies and gentlemen—a new
      legend." The control room door opens. They hand you a document—the
      permanent removal agreement. You sign it. Then walk out of the arena—
      sunlight on your face. Freedom.

      **Player loses:**
      The Reaper stands beside you—he does not finish you off. "You were stronger
      than the first two. Rest a year—then come back. I'll wait." The screen goes
      dark. You did not lose—you were just not strong enough. But you know he will
      wait. A year later—you will return.

victory_condition: Defeat "the Reaper"—or prove your worth before him


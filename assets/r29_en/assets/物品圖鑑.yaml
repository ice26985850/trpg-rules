# =============================================================================
# Consumables
# =============================================================================
consumables:
  - name: Bandage
    weight_kg: 0.2
    use_time: 1 turn
    effect: Restore 1d4 HP (up to 75% HP)
    price_cr: 20

  - name: Tourniquet
    weight_kg: 0.1
    use_time: 1 turn
    effect: Stops bleeding status; stabilizes downed ally (resets downed timer to 3 turns); does not restore HP
    price_cr: 15

  - name: First Aid Kit
    weight_kg: 1.0
    use_time: 2 turns
    effect: Restore to 75% HP (cannot exceed 75%)
    price_cr: 100

  - name: Med Kit
    weight_kg: 2.0
    use_time: 4 turns
    effect: Restore to 100% HP. Clears all negative statuses.
    price_cr: 300

  - name: Energy Drink
    weight_kg: 0.3
    use_time: 1 turn
    effect: Physique +1 (5 turns). Slowly restores 1 HP/turn (5 turns).
    price_cr: 50

  - name: Painkiller
    weight_kg: 0.2
    use_time: 1 turn
    effect: Immune to Pain Slowed effect (5 turns).
    price_cr: 40

  - name: Adrenaline
    weight_kg: 0.5
    use_time: 1 turn
    effect: Physique +2, movement speed ×1.5 (3 turns). After it ends, Fatigued Disadvantage for 2 turns.
    price_cr: 200

  - name: Self-Revive Syringe
    weight_kg: 0.3
    use_time: Automatic
    effect: Auto-triggers when HP hits zero, restores to 1 HP. After triggering, Weakened status. Solo Mode only, once per match.
    price_cr: 300

  - name: Sedative
    weight_kg: 0.2
    use_time: 1 turn
    effect: Stress value -5.
    price_cr: 100

  - name: Smoke Grenade
    weight_kg: 0.5
    use_time: Instant
    effect: 5m radius dense smoke. Lasts 2 turns. Fully blocks vision.
    price_cr: 80

  - name: Frag Grenade
    weight_kg: 0.5
    use_time: Instant
    effect: 3d8 area damage. 5m radius. TAC DC12 for half.
    price_cr: 150

  - name: Incendiary Grenade
    weight_kg: 0.5
    use_time: Instant
    effect: 2d6/turn burning damage. 3m radius. Lasts 3 turns.
    price_cr: 120

  - name: Flashbang
    weight_kg: 0.3
    use_time: Instant
    effect: 5m radius Blinded 1 turn (attack Disadvantage) + Ringing Ears 2 turns (hearing halved). CLM DC14 to resist.
    price_cr: 100

  - name: C4 Explosive
    weight_kg: 1.0
    use_time: 3 turns to set up
    effect: 4d8 area damage. 10m radius. Requires remote detonation.
    price_cr: 300

  - name: Anti-Vehicle Mine
    weight_kg: 2.0
    use_time: 2 turns to set up
    effect: 6d10 damage to vehicles. Trigger-based. 1d10 to pedestrians.
    price_cr: 500

# =============================================================================
# Vehicles
# =============================================================================
vehicles:
  - name: Motorcycle
    crew: 2
    speed: Very Fast (80m/turn)
    hp: 30
    armor: None
    noise: Medium
    terrain: All-terrain (but rough terrain driving check DC+2)
    special: Fastest but most fragile. Driver has no protection. On rollover, driver takes 3d6 damage.

  - name: Snowmobile
    crew: 2
    speed: Fast (60m/turn)
    hp: 25
    armor: None
    noise: Medium
    terrain: No slowdown on snow, better than normal motorcycle on other terrain
    special: Snow-only motorcycle variant. On non-snow terrain, equivalent to a normal motorcycle.

  - name: Buggy
    crew: 4
    speed: Fast (60m/turn)
    hp: 60
    armor: Light (crew torso DR+1)
    noise: Medium
    terrain: All-terrain no slowdown
    special: Off-road specialist—no slowdown on rough terrain. Good for desert and mountains.

  - name: Jeep
    crew: 4
    speed: Medium (50m/turn)
    hp: 80
    armor: Medium (crew torso DR+2)
    noise: Loud
    terrain: Best on roads, off-road slows to 30m
    special: All-around vehicle. Most common. Provides good crew protection.

  - name: Sedan
    crew: 4
    speed: Medium (55m/turn)
    hp: 60
    armor: Light (crew torso DR+1)
    noise: Medium
    terrain: Fastest on roads (65m), off-road slows to 20m
    special: Road speed bonus. Poor off-road performance.

  - name: Boat
    crew: 4
    speed: Slow (30m/turn)
    hp: 60
    armor: None
    noise: Low
    terrain: Water only
    special: The only water transport. Cannot go ashore.

  - name: Armored Car
    crew: 4
    speed: Slow (35m/turn)
    hp: 150
    armor: Heavy (crew treated as Level 3 Armor protection, torso DR+4)
    noise: Very Loud (audible across the whole map)
    terrain: All-terrain but slow
    special: Airdrop only. Moving fortress. When tires are shot, movement halved. At zero durability, explodes (10m radius 4d10 damage).

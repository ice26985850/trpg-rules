# =============================================================================
# Weapon Attachments
# =============================================================================
attachments:
  Scope:
    - name: Red Dot Sight
      compatible: [Pistol, SMG, AR]
      effect: DC-1 within 50m
      weight_kg: 0.2
    - name: Holo Sight
      compatible: [Pistol, SMG, AR]
      effect: DC-1 within 50m (slightly wider field than red dot)
      weight_kg: 0.2
    - name: 2x Scope
      compatible: [SMG, AR, LMG]
      effect: DC-1 within 100m
      weight_kg: 0.3
    - name: 4x Scope
      compatible: [AR, SR, LMG]
      effect: DC-2 within 150m
      weight_kg: 0.4
    - name: 8x Scope
      compatible: [SR]
      effect: DC-3 within 300m
      weight_kg: 0.5
    - name: Thermal Scope
      compatible: [SR]
      effect: Can see target silhouette through smoke, night vision 200m
      weight_kg: 0.8
      rarity: Airdrop

  Muzzle:
    - name: Suppressor
      compatible: [Pistol, SMG, AR, SR]
      effect: Gunshot audible distance halved
      weight_kg: 0.3
    - name: Compensator
      compatible: [AR, SR, LMG]
      effect: Burst recoil DC penalty -1
      weight_kg: 0.3
    - name: Flash Hider
      compatible: [AR, SR]
      effect: No muzzle flash when firing (no position reveal at night)
      weight_kg: 0.2

  Magazine:
    - name: Extended Mag
      compatible: [Most firearms]
      effect: Magazine capacity +50% (rounded down)
      weight_increase: +20%
    - name: Quickdraw Mag
      compatible: [Most firearms]
      effect: Reload time halved (except LMG—from full turn to 1 Tactical Action)
      weight_increase: +15%
    - name: Dual Mag
      compatible: [AR, SMG]
      effect: First reload is a Free Action (normal afterward)
      weight_increase: +30%

  Grip:
    - name: Vertical Grip
      compatible: [AR, SMG, LMG]
      effect: Burst recoil DC penalty -1
      weight_kg: 0.3
    - name: Angled Grip
      compatible: [AR, SMG]
      effect: Faster aim-down-sight (aiming takes only half a turn)
      weight_kg: 0.2
    - name: Light Grip
      compatible: [AR, SMG]
      effect: Firing while moving DC-1
      weight_kg: 0.2

  Stock:
    - name: Tactical Stock
      compatible: [AR, SMG, SR]
      effect: Firing while moving DC-1, recoil recovery +1 turn
      weight_kg: 0.4
    - name: Folding Stock

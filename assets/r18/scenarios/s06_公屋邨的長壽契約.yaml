name: 公屋邨的長壽契約
description: 回收 S3 伏線④與③。陰差阿炳找上門，觀塘公屋邨整層居民陽壽被「長壽契約」劃走卻仍存活；九幽堂以借壽抽同層住客陽壽，反抗者成厲鬼守門，名冊指往「還壽大典．對岸總壇」。
difficulty: A
level_range: [7, 8]
case_type: 厲鬼+怨靈群+活人凶宅
map_ref: ""
npcs:
  - 牛頭．阿炳（陰差，問責者）
  - 炳嫂（公屋邨同層住客）
  - 發哥（富戶，借壽契約主事）
  - 程規瑶（公會議事長，協調者）
key_enemies:
  - 厲鬼（守門，挑戰等級（CR） 5，護體黑氣）
  - 怨靈群（挑戰等級（CR） 4）
  - 遊魂群（挑戰等級（CR） 3）
  - 長壽契約壇（環境遭遇）
rewards:
  exp: 700
  coin: "700-1000"
  items:
    - 收魂葫蘆（收服厲鬼）
    - 借壽名冊殘頁（接往 S7／S8）
    - 協助陰差重大聲望
hooks:
  - 名冊末頁「還壽大典．對岸總壇」——接往 S7／S8。
  - 發哥供出上線「師父的代理人」。

name: 風水林裡的空棺材
description: 順 S4 線索追到新界圍村，九幽堂香港站七叔公於風水林佈「練手」養屍點，玩家首次正面遭遇七叔公，奪下祖屋穴眼圖，直達 S3 養屍窖。
difficulty: B
level_range: [6, 7]
case_type: 黑僵+怨靈+養屍前哨
map_ref: "maps/S3_圍村祖屋.yaml"
npcs:
  - 福伯（土地公廟祝，接單者）
  - 七叔公（九幽堂香港站負責人，首次正面遭遇）
  - 程規瑶（公會議事長，轉介者）
  - 阿盈（S4 失蹤者，名冊所列材料）
key_enemies:
  - 黑僵（挑戰等級（CR） 3，硬皮減免 −3）
  - 遊魂（挑戰等級（CR） 3）
  - 七叔公（遭遇，首次正面，多數遁走）
  - 祖屋穴眼圖（隱藏資訊，接 S3）
rewards:
  exp: 600
  coin: "500-700"
  items:
    - 墨斗線（結界材料）
    - 祖屋穴眼圖（接往 S3）
    - 挫敗九幽堂前哨聲望
hooks:
  - 七叔公遁走前冷笑「圍村祖屋先係大業，你哋遲早嚟」——直指 S3。
  - 穴眼圖與 S3 羅庚異動吻合。

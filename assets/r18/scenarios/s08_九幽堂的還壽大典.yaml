name: 九幽堂的還壽大典
description: 回收 S3 全部伏線。九幽堂對岸地下總壇啟動「還壽大典」，以借壽名冊批量轉移陽壽，欲將一區域煉成死域養屍場；玩家聯手公會＋阿炳＋九叔突襲總壇，對決師父（挑戰等級（CR）7），毀名冊、終止災難，留「執冊人」懸念。
difficulty: S
level_range: [9, 10]
case_type: 飛屍+厲鬼+養屍群+師父
map_ref: ""
npcs:
  - 程規瑶（公會議事長，總動員）
  - 牛頭．阿炳（陰差，聯軍）
  - 九叔（世出世殯儀館，聯軍）
  - 師父（九幽堂幕後，控制源／終幕 Boss）
  - 執冊人（名冊夾頁懸念）
key_enemies:
  - 師父（控制源／終幕 Boss，挑戰等級（CR） 7）
  - 飛屍（挑戰等級（CR） 6，硬皮減免 −8）
  - 厲鬼（守壇，挑戰等級（CR） 7）
  - 養屍群（挑戰等級（CR） 5）
rewards:
  exp: 900
  coin: "1200-1500"
  items:
    - 天師符（稀有，驅邪效果 +2）
    - 借壽名冊正本（含 S3／S6 活人名）
    - 覆滅九幽堂總壇傳奇聲望
    - 祖師青睞（S 級結案被動，請神附身 定力（CMP）檢定優勢）
hooks:
  - 名冊夾頁「師父之上，另有執冊人」——留續作懸念。
  - 名冊上仍有活人名未除；生死簿竄改源頭，阿炳續追。

name: 停屍間的第七抽屜
description: 死於蓄意誤診的男子屍變為白僵，其妻怨靈盤踞館內報復，背後指使者埋下九幽堂線索。
difficulty: B
level_range: [4, 6]
case_type: 殭屍+怨靈
map_ref: "maps/S2_停屍間.yaml"
npcs:
  - 九叔（世出世殯儀館殮房主管）
  - 細昌（值班護工）
  - 阿琪（亡夫之女）
  - 亡夫（新屍→白僵，死者）
  - 亡妻怨靈（死者妻）
  - 主刀醫生（蓄意誤診者，背後指使）
key_enemies:
  - 白僵（挑戰等級 CR 2）
  - 怨靈（挑戰等級 CR 3）
rewards:
  exp: 300
  coin: 350
  items:
    - 鎮魂鈴（稀有，可能掉落）
    - 糯米與香燭紙錢（館方供應）
hooks:
  - 蓄意誤診的「主刀」背後有人指使，線索指向賣「續命偏方」的退休風水佬（接 S3）。
  - 九叔暗示存在專門收「有意嘅死」材料的對岸組織（九幽堂）。

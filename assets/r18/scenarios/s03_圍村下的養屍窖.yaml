name: 圍村下的養屍窖
description: 九幽堂香港站七叔公在圍村祖屋地底佈養屍窖，煉製養屍並以村亡者怨氣養厲鬼守門，凶宅為活體巢穴，關鍵在消滅控制源七叔公。
difficulty: A/S
level_range: [7, 10]
case_type: 養屍+厲鬼+凶宅
map_ref: "maps/S3_圍村祖屋.yaml"
npcs:
  - 村長（圍村求援者）
  - 二嬸（倖存村婦）
  - 七叔公（煉屍人，九幽堂香港站負責人）
  - 牛頭．阿炳（陰差，結尾問責）
  - 程規瑶（公會議事長，轉介者）
key_enemies:
  - 養屍（挑戰等級 CR 3，×2）
  - 厲鬼（挑戰等級 CR 5）
  - 凶宅（環境巢穴，挑戰等級 CR 5）
  - 七叔公（煉屍人，控制源，關鍵消滅目標）
rewards:
  exp: 600
  coin: 800
  items:
    - 雷擊木（傳說，擇一掉落）
    - 天師符（稀有，擇一掉落）
    - 挫敗九幽堂重大聲望
hooks:
  - 七叔公遺言「師父在等大業完成」——九幽堂幕後「師父」身份成謎。
  - 養屍窖底刻有玩家角色「處理不了的那一單」相關名字的牌位。
  - 「借壽名冊」殘頁：本該死卻還活著的名人，禁術借壽未被根除。
  - 陰差牛頭．阿炳問責：被超渡的魂本在陰間名冊，誰在竄改生死簿。

name: 長生士多的第十三位租客
description: 退休風水佬以「借壽」抽乾租客陽壽，屍身煉成白僵，後房藏小型「長生爐」——九幽堂養屍術雛形，賬簿指向七叔公與圍村大業。
difficulty: B
level_range: [5, 6]
case_type: 白僵+怨靈
map_ref: "maps/S1_唐樓.yaml"
npcs:
  - 萍姐（物業管理員，接單者）
  - 全叔（長生士多老闆，九幽堂外圍）
  - 陳伯（同樓住客）
  - 阿盈（首位反抗者，死後成怨靈）
  - 七叔公（九幽堂香港站負責人，賬簿指名）
key_enemies:
  - 白僵（挑戰等級（CR） 2，硬皮減免 −2，×多）
  - 怨靈（阿盈，挑戰等級（CR） 3）
  - 長生爐（小型養屍裝置，環境遭遇，挑戰等級（CR） 2）
rewards:
  exp: 500
  coin: "400-600"
  items:
    - 鎮屍符與糯米（消耗補給）
    - 賬簿線索（接往 S5／S3）
    - 追查九幽堂線索聲望
hooks:
  - 賬簿末頁「上頭七叔公收，圍村祖屋大業待用」——接往 S5／S3。
  - 全叔僅為外圍，真正「上頭」身份成謎。

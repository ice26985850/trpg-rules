name: 過海隧道的陰間列車
description: 回收 S3 伏線①。九幽堂在過海隧道佈「渡陰陣」，把交通事故死者煉成跳屍／黑僵，守一條通往對岸總壇的陰氣通道；厲鬼引渡亡魂，師父代理人現身指揮，破陣後遁走確認「還壽大典」籌備中。
difficulty: A
level_range: [8, 9]
case_type: 厲鬼+跳屍+黑僵+渡陰陣
map_ref: ""
npcs:
  - 財叔（CID 雜項科老警員，轉介者）
  - 牛頭．阿炳（陰差，隧道警示）
  - 程規瑶（公會議事長）
  - 師父的代理人（九幽堂指揮，精英遭遇）
key_enemies:
  - 厲鬼（引渡者，挑戰等級（CR） 5）
  - 跳屍（挑戰等級（CR） 4，硬皮減免 −5）
  - 黑僵（挑戰等級（CR） 3，硬皮減免 −3）
  - 渡陰陣（環境遭遇，挑戰等級（CR） 4）
  - 飛屍（師父代理人放出精英，挑戰等級（CR） 5，硬皮減免 −8）
rewards:
  exp: 800
  coin: "900-1200"
  items:
    - 雷擊木（對殭屍無視硬皮）
    - 渡陰陣符牌「還壽大典．倒數」（接往 S8）
    - 阻截九幽堂通道重大聲望
hooks:
  - 師父代理人遁走前「對岸總壇，還壽大典就開」——接往 S8。
  - 通道雖斷，名冊上活人名未除。

name: 群樓紅雨·小隊
description: 深水埗三棟相鄰唐樓同時現身「紅雨褸」地縛靈，實為一樁未竟遺願被相似風水鏡映成三個連動映像；需 2-4 名收鬼師分頭調查，並於凌晨三點同步超渡，否則怨氣會在各樓間傳導暴漲。
difficulty: B/A
level_range: [3, 6]
case_type: 地縛靈（鏡映）／多人協力
player_mode: 多人玩家（小隊 2-4 名）
map_ref: "maps/s09_群樓.svg"
npcs:
  - 強記（三棟統管物業管理員）
  - 萍姐（清潔阿姐，已辭工）
  - 世出世殯儀館九叔（結尾鉤子）
key_enemies:
  - 紅雨褸地縛靈 ×3（鏡映映像，各挑戰等級 CR 3，同步時聯動）
  - 鬼打牆（環境遭遇，挑戰等級 CR 3，選發）
  - 厲鬼（同步失敗暴走，挑戰等級 CR 5，選發）
rewards:
  exp: 600
  coin: 400
  items:
    - 香燭紙錢三份
    - 小隊聲望「群樓協力」
hooks:
  - 真信紙抬頭為「世出世」殯儀館，接往 S2。
  - 福臨樓風水渠埋有刻「世出世」銅鈴，疑有人養怨，接往 S2。

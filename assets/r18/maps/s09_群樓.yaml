name: S9 群樓紅雨（三棟相鄰唐樓＋同步法壇）
對應劇本: S9 群樓紅雨·小隊
對應場景說明: >-
  對應 S9 多人玩家劇本「群樓紅雨·小隊」核心場景——深水埗三棟相鄰唐樓（福興樓、義成大廈、福臨樓）。
  三棟同時出現「紅雨褸」地縛靈（Bound Spirit，墮樓菲傭 Marites 的鏡映映像），每晚三點重複「落樓寄信」。
  玩家小隊（2-4 人）分頭進駐三棟，調查信箱格藏信、拼合出真信；於凌晨三點由一名隊員主壇、其餘護法，
  在三棟同步執行超渡法事。若不同步，落後棟怨氣向鄰棟傳導（每回合 陰氣值（YIN）＋2 本棟、＋1 鄰棟）暴走召厲鬼。
  福臨樓地下風水渠埋有刻「世出世」銅鈴，為三棟怨氣同源之鑰，接往 S2。


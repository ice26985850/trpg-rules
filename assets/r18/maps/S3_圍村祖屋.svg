<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 560" font-family="serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#555"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect x="0" y="0" width="680" height="560" fill="#F7F3EC"/>

  <!-- 標題 -->
  <text x="20" y="26" font-size="20" fill="#2B2B2B" font-weight="bold">S3 圍村祖屋 · 祖屋與地底養屍窖</text>
  <text x="20" y="46" font-size="12" fill="#888">上：圍村祖屋（凶宅）　下：地底養屍窖（九幽堂煉屍場）</text>

  <!-- 區域底色 -->
  <rect x="5" y="28" width="450" height="124" rx="10" fill="#E8D5C4" fill-opacity="0.25" stroke="#C9A98C" stroke-dasharray="6 4" stroke-width="1.2"/>
  <text x="15" y="46" font-size="12" fill="#8A6B4F">凶宅扭曲區（空間扭曲·死域 16＋）</text>
  <rect x="145" y="278" width="470" height="214" rx="10" fill="#D5D5E8" fill-opacity="0.28" stroke="#9A9AC0" stroke-dasharray="6 4" stroke-width="1.2"/>
  <text x="155" y="296" font-size="12" fill="#5A5A8A">養屍窖區（九幽堂煉屍場）</text>

  <!-- 分隔虛線（地面 / 地底） -->
  <line x1="20" y1="250" x2="660" y2="250" stroke="#BBB" stroke-width="1.5" stroke-dasharray="8 5"/>
  <text x="600" y="244" font-size="11" fill="#999">地面 ▲　地底 ▼</text>

  <!-- 連線 -->
  <g stroke="#777" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="155" y1="130" x2="145" y2="130"/>
    <line x1="295" y1="130" x2="305" y2="130"/>
    <line x1="220" y1="108" x2="220" y2="72"/>
    <line x1="455" y1="130" x2="465" y2="130"/>
    <line x1="492" y1="166" x2="268" y2="334"/>
    <line x1="295" y1="370" x2="325" y2="370"/>
    <line x1="279" y1="357" x2="481" y2="313"/>
    <line x1="449" y1="345" x2="491" y2="325"/>
    <line x1="540" y1="322" x2="540" y2="448"/>
    <line x1="445" y1="402" x2="495" y2="438"/>
  </g>

  <!-- 節點 -->
  <g font-size="13" text-anchor="middle" fill="#2B2B2B">
    <rect x="5" y="108" width="150" height="44" rx="8" fill="#D6EAD6" stroke="#7A9A7A" stroke-width="1.5"/>
    <text x="80" y="135">祖屋大門（入口）</text>

    <rect x="145" y="108" width="150" height="44" rx="8" fill="#E8E1D0" stroke="#BBAE92" stroke-width="1.5"/>
    <text x="220" y="135">廳堂（正廳）</text>

    <rect x="145" y="28" width="150" height="44" rx="8" fill="#E8E1D0" stroke="#BBAE92" stroke-width="1.5"/>
    <text x="220" y="55">偏房（廂房）</text>

    <rect x="305" y="108" width="150" height="44" rx="8" fill="#E8E1D0" stroke="#BBAE92" stroke-width="1.5"/>
    <text x="380" y="135">祠堂（祖祠）</text>

    <rect x="465" y="108" width="150" height="44" rx="8" fill="#E0D6EA" stroke="#A090C0" stroke-width="1.5" stroke-dasharray="5 3"/>
    <text x="540" y="135">地窖入口（暗門）</text>

    <rect x="145" y="348" width="150" height="44" rx="8" fill="#E8E1D0" stroke="#BBAE92" stroke-width="1.5"/>
    <text x="220" y="375">養屍窖主室</text>

    <rect x="325" y="348" width="150" height="44" rx="8" fill="#E8E1D0" stroke="#BBAE92" stroke-width="1.5"/>
    <text x="400" y="375">養屍格（陳屍陣）</text>

    <rect x="465" y="278" width="150" height="44" rx="8" fill="#EAD6EA" stroke="#A07AA0" stroke-width="1.8"/>
    <text x="540" y="305">七叔公密室</text>

    <rect x="465" y="448" width="150" height="44" rx="8" fill="#F0D6D6" stroke="#C77A7A" stroke-width="1.5" stroke-dasharray="5 3"/>
    <text x="540" y="475">穴眼（地脈之眼）</text>
  </g>

  <!-- 圖例 -->
  <g font-size="11" fill="#555">
    <rect x="20" y="500" width="14" height="14" rx="3" fill="#D6EAD6"/><text x="40" y="512">出口</text>
    <rect x="100" y="500" width="14" height="14" rx="3" fill="#E8E1D0"/><text x="120" y="512">房間</text>
    <rect x="180" y="500" width="14" height="14" rx="3" fill="#EAD6EA"/><text x="200" y="512">首腦</text>
    <rect x="260" y="500" width="14" height="14" rx="3" fill="#F0D6D6"/><text x="280" y="512">穴眼/陷阱</text>
    <rect x="370" y="500" width="14" height="14" rx="3" fill="#E0D6EA"/><text x="390" y="512">暗門</text>
  </g>

  <!-- 底部註解 -->
  <text x="20" y="540" font-size="12" fill="#666">對應劇本：S3 圍村下的養屍窖（場景：圍村祖屋與地底養屍窖）｜ 關鍵：破風水找穴眼、滅七叔公使養屍崩解</text>
</svg>

name: S1 唐樓（六層舊唐樓樓梯間）
對應劇本: S1 樓梯間的紅雨褸
對應場景說明: >-
  對應 S1 劇本「樓梯間的紅雨褸」核心場景——深水埗六層無電梯舊唐樓。
  地縛靈（Bound Spirit，三年前墮樓菲傭）每晚三點重複「落樓去寄信俾阿媽」的動作；
  玩家需調查「信箱格」底藏信、用靈感（INS）溝通聽清遺願、備超渡法事（香燭＋紙錢＋法壇）送她走。
  樓梯間中段設「鬼打牆（Ghost Wall）」迴圈陷阱，遇困需定力（CMP）檢定脫困。
  基礎陰氣值（YIN）3–8，若曾發生兇案可達 11＋。


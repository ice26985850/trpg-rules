name: S3 圍村祖屋（祖屋與地底養屍窖）
對應劇本: S3 圍村下的養屍窖
對應場景說明: >-
  對應 S3 劇本「圍村下的養屍窖」核心場景——新界圍村整棟祖屋（凶宅）與地底養屍窖。
  九幽堂香港站「七叔公」在祖屋地底佈養屍窖，煉製養屍（Cultivated Zombie，挑戰等級 CR 3）、
  並以村中亡者怨氣養出厲鬼（Fierce Ghost，挑戰等級 CR 5）作「守門」；凶宅本身是活體巢穴（死域 16＋）。
  正確處理：學者以知識（KNW）破風水佈局找「穴眼」；武師身手（PHS）壓制養屍；主法師開壇＋封魔陣囚禁厲鬼；
  關鍵是找到並消滅七叔公——養屍失去控制源才崩解。凶宅空間扭曲（鬼打牆＋死域）以「凶宅扭曲區」標註。


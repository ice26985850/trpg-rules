name: S2 停屍間（殯儀館停屍間）
對應劇本: S2 停屍間的第七抽屜
對應場景說明: >-
  對應 S2 劇本「停屍間的第七抽屜」核心場景——「世出世」殯儀館停屍間。
  第七抽屜的新亡者死不瞑目→屍變（新屍 Fresh Corpse→白僵 White Zombie，挑戰等級 CR 2）；
  其妻怨靈（Resentful Ghost，挑戰等級 CR 3）因喪夫之痛盤踞走廊報復。兩者疊加。
  正確處理：桃木劍／鎮屍符物理壓制屍變，靈媒以靈感（INS）溝通安撫怨靈、查明蓄意誤診真相；
  館方要求「天光前解決」的時間壓力，屍變失敗則擴散至其他抽屜（範圍效果 AOE 危機）。
  基礎陰氣值（YIN）5–10。


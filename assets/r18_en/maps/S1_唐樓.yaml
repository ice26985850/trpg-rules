name: S1 Tong Lau (Six-Story Old Tong Lau Stairwell)
corresponding_scenario: S1 The Red Raincoat in the Stairwell
scene_description: >-
  Core scene of S1 case file "The Red Raincoat in the Stairwell" — a six-story elevatorless old Tong Lau in Sham Shui Po.
  A Bound Spirit (a Filipino domestic helper who fell to her death three years ago) repeats the action "go downstairs to mail a letter to Mama" every 3 a.m.;
  players must investigate the letter hidden under the "Mailbox Bank", use Intuition (INS) to communicate and learn her dying wish, and prepare a Deliverance Rite (incense & candle + hell bank notes + altar) to send her off.
  The middle of the stairwell has a "Ghost Wall" loop trap; escaping when trapped requires a Composure (CMP) check.
  Base Yin Value (YIN) 3–8; can reach 11+ if a murder occurred.


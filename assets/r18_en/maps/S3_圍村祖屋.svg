  <!-- Bottom note -->
  <text x="20" y="540" font-size="12" fill="#666">Scenario: S3 The Corpse-Cultivating Cellar beneath the Walled Village (Scene: Walled Village Ancestral House and Underground Corpse-Cultivating Cellar)｜Key: Break Feng Shui to find the Nexus Eye; eliminate Seventh Uncle to collapse the corpse-cultivation</text>

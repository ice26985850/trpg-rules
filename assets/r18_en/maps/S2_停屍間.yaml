name: S2 Mortuary (Funeral Home Mortuary)
corresponding_scenario: S2 The Seventh Drawer in the Mortuary
scene_description: >-
  Core scene of S2 case file "The Seventh Drawer in the Mortuary" — the mortuary of the "Shi Chu Shi" funeral home.
  The newly deceased in the Seventh Drawer died with eyes open → corpse mutation (Fresh Corpse → White Zombie, Challenge Rating CR 2);
  his wife's Resentful Ghost (Challenge Rating CR 3) lurks in the corridor seeking revenge out of grief for her lost husband. The two overlap.
  Proper handling: Peachwood Sword / Corpse-Still Talisman to physically suppress the mutation; the Medium uses Intuition (INS) to communicate and comfort the Resentful Ghost, and uncover the truth of the deliberate misdiagnosis;
  the funeral home demands resolution "before dawn" under time pressure; if the mutation is not contained it spreads to other drawers (area-of-effect AOE crisis).
  Base Yin Value (YIN) 5–10.


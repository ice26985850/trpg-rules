name: S9 Red Rain over the Block (Three Adjacent Tong Lau + Synced Altar)
corresponding_scenario: S9 Red Rain over the Block · Squad
scene_description: >-
  Core scene of S9 multiplayer case file "Red Rain over the Block · Squad" — three adjacent Tong Lau in Sham Shui Po (Fu Hing House, Yi Shing Building, Fu Lam House).
  All three simultaneously manifest the "Red Raincoat" Bound Spirit (a mirror image of Marites, the Filipino domestic helper who fell to her death), repeating "go downstairs to mail a letter" every 3 a.m.
  The player squad (2–4 people) splits up to occupy the three buildings, investigate the letters hidden in the Mailbox Banks, and piece together the true letter; at 3 a.m. one member leads the altar while the others guard,
  performing the Deliverance Rite in sync across all three buildings. If unsynced, the lagging building's resentful energy transfers to its neighbor (each round Yin Value (YIN) +2 own building, +1 neighbor), running rampant and summoning a Fierce Ghost.
  Beneath Fu Lam House, a Feng Shui Channel hides a bronze bell engraved "Shi Chu Shi" — the key to the three buildings' shared source of resentful energy, linking to S2.


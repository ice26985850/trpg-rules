name: S3 Walled Village Ancestral House (Ancestral House and Underground Corpse-Cultivating Cellar)
corresponding_scenario: S3 The Corpse-Cultivating Cellar beneath the Walled Village
scene_description: >-
  Core scene of S3 case file "The Corpse-Cultivating Cellar beneath the Walled Village" — the entire walled-village ancestral house (Haunted House) in the New Territories and its underground corpse-cultivating cellar.
  The "Seventh Uncle" of the Nine Nether Hall's Hong Kong branch built the corpse-cultivating cellar beneath the ancestral house, refining Cultivated Zombies (Challenge Rating CR 3),
  and using the villagers' resentful energy to nurture a Fierce Ghost (Challenge Rating CR 5) as a "gatekeeper"; the haunted house itself is a living nest (Death Domain 16+).
  Proper handling: the Scholar uses Knowledge (KNW) to break the Feng Shui layout and find the "Nexus Eye"; the Warrior uses Prowess (PHS) to suppress the corpses; the Main Caster opens the altar + uses the Demon-Sealing Array to imprison the Fierce Ghost;
  the key is to find and eliminate Seventh Uncle — only when the corpses lose their source of control do they collapse. The haunted house's spatial distortion (Ghost Wall + Death Domain) is marked as the "Haunted House Distortion Zone".


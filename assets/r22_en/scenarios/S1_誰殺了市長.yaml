name: "Who Killed the Mayor"
description: "Aldric Fane, mayor of Ashfall City, is poisoned late on the third night. The player has three days to find the killer, prevent the murder — or let it happen to gather more clues."
difficulty: "Beginner"
level_range:
  min_memory: 3
  max_memory: 5
  suggested_cycles: "1-3"
time_range:
  days: 3
  start: "Monday morning"
  end: "Wednesday late night"
core_skills:
  primary: ["Insight", "Social"]
  secondary: ["Execution"]
save_point: "Eternal Well (Holy Relic Cathedral)"
fixed_events:
  - id: "speech"
    time: "Day 1 forenoon"
    name: "Mayor's Speech"
    location: "Bell Tower Square"
    description: "The mayor gives a public speech, hinting at a truth soon to be revealed"
  - id: "threat_letter"
    time: "Day 2 morning"
    name: "Threatening Letter"
    location: "Mayor's Mansion"
    description: "The mayor receives a threatening letter and skips his routine breakfast"
  - id: "private_meeting"
    time: "Day 2 evening"
    name: "Private Meeting"
    location: "Mayor's Mansion"
    description: "The mayor meets someone privately (identity variable)"
  - id: "last_sighting"
    time: "Day 3 afternoon"
    name: "Last Sighting"
    location: "Mayor's Mansion Balcony"
    description: "The mayor's last public sighting"
  - id: "murder"
    time: "Day 3 evening to midnight"
    name: "Murder Occurs"
    location: "Mayor's Study"
    description: "The mayor dies of poison (unless prevented)"
semi_fixed_events:
  - id: "merchant_meeting"
    time: "Day 1 evening"
    name: "Merchant Guild Meeting"
    location: "Mayor's Mansion"
    description: "The player may intervene to change the meeting party"
  - id: "study_night"
    time: "Day 2 night"
    name: "Study Work"
    location: "Mayor's Study"
    description: "The doctor poisons the mayor at this time"
locations:
  - id: "well_of_eternity"
    name: "Eternal Well"
    type: "save_point"
    description: "At the heart of the Holy Relic Cathedral, a blue light pillar rises from the deep well"
  - id: "bell_tower_square"
    name: "Bell Tower Square"
    type: "public"
    description: "Where the mayor delivers his speech; the bell tolls thirteen times at noon daily"
  - id: "mayor_mansion"
    name: "Mayor's Mansion"
    type: "restricted"
    description: "A two-story building; the study is on the second floor"
  - id: "hearth_market"
    name: "Hearth District Market"
    type: "public"
    description: "Commercial center with various shops and taverns"
  - id: "old_tree_pharmacy"
    name: "Old Tree Pharmacy"
    type: "shop"
    description: "Source of the poison; the owner is a cousin of Edwin the doctor"
routes:
  - id: "political"
    name: "Political Investigation Route"
    primary_attribute: "Social"
    description: "Visit enemies and allies, attend noble banquets, find clues in conversation"
  - id: "underworld"
    name: "Underground Investigation Route"
    primary_attribute: "Execution"
    description: "Obtain intelligence through the Shadow Guild, infiltrate the crime scene"
  - id: "church"
    name: "Church Route"
    primary_attribute: "Insight"
    description: "Use Church resources, investigate the Church's own involvement"
npcs:
  - id: "aldric_fane"
    name: "Aldric Fane"
    role: "Victim"
    title: "Mayor of Ashfall City"
    traits: ["Integrity", "Reformist", "Secretly investigating Returner disappearances"]
    rv_initial: 0
  - id: "edwin_mor"
    name: "Edwin Mor"
    role: "Killer"
    title: "Personal Doctor"
    traits: ["Gentle", "Coerced", "Daughter imprisoned by the Church"]
    is_killer: true
    weakness: "Composure collapses when his daughter is mentioned"
  - id: "alicia_fane"
    name: "Alicia Fane"
    role: "Informant"
    title: "Mayor's Wife"
    traits: ["Grieving", "Silent", "Knows the truth but dares not speak"]
  - id: "renard"
    name: "Renard"
    role: "Red Herring"
    title: "Chief Secretary"
    traits: ["Nervous", "Loyal", "Protecting the mayor's investigation files"]
  - id: "karen"
    name: "Callen"
    role: "Potential Ally"
    title: "Guard Captain"
    traits: ["Former Imperial officer", "Blindly loyal to the mayor", "Strong combat power"]
  - id: "lord_morton"
    name: "Lord Morton"
    role: "Red Herring"
    title: "Opposition Leader"
    traits: ["Has motive", "Not the killer", "Also investigating something"]
clues:
  fragment_level:
    - "The doctor trembles during the mayor's speech"
    - "The baker says the mayor has gotten much thinner lately"
    - "The apothecary complains someone has been buying strange herbs"
    - "The mayor's secretary has been working late every night lately"
    - "A gray-clad figure loiters near the mansion for three consecutive days"
  clue_level:
    - "The threatening letter mentions what the mayor was investigating"
    - "The poison is a rare chronic plant toxin"
    - "The medicine vial comes from the Old Tree Pharmacy"
    - "The hidden location of the mayor's investigation files"
  breakthrough_level:
    - "The pharmacy owner is a cousin of Edwin the doctor"
    - "The doctor's daughter vanished after being taken by the Church"
    - "The mayor's investigation files contain a Missing Returners List"
  truth_level:
    - "The doctor is coerced by the Church — his daughter is locked in the Church's underground laboratory"
    - "The Church is systematically consuming Returners to extract the essence of time"
endings:
  - id: "perfect"
    name: "Perfect Ending"
    condition: "Prevent the murder + expose the Church's truth + find the doctor's daughter"
  - id: "justice"
    name: "Justice Ending"
    condition: "Prevent the murder + expose the truth but no hard evidence"
  - id: "tragedy"
    name: "Tragedy Ending"
    condition: "Prevent the murder but the doctor dies"
  - id: "unfinished"
    name: "Unfinished Ending"
    condition: "Fail to prevent the murder but successfully identify the killer"
multiplayer_gm_tips: |
  Designed for solo play; per GM Rulebook 14-3, may start with 2-3 players: each player manages their own Rift Mark and Memory Fragments, may share a MF with 1 minor action; EB = sum of all players' Memory + highest Execution value; key investigation checks use Team Check (pass if more than half succeed). S1 has scarce combat, best suited to splitting up leads (political / underground / church in parallel); only the failed-infiltration conflict needs enemy scaling (each additional combat unit: HP ×1.5 or count +1).

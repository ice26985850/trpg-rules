<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 540" font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif">
  <rect width="680" height="540" fill="#1A1A2E"/>
  
  <text x="340" y="25" text-anchor="middle" fill="#B3C6E6" font-size="16" font-weight="bold">Deep Old City Ruins</text>
  <text x="340" y="42" text-anchor="middle" fill="#888" font-size="10">S4: The Forgotten Save Point — Beneath the ruins of the Radiant Gold Empire's imperial palace</text>
  
  <!-- Upper Ruins Region Base Color -->
  <ellipse cx="350" cy="430" rx="180" ry="70" fill="#444" opacity="0.4"/>
  
  <!-- Entrance -->
  <rect x="290" y="465" width="100" height="30" rx="5" fill="#555" stroke="#888"/>
  <text x="340" y="485" text-anchor="middle" fill="#CCC" font-size="11">⬇ Ruins Entrance</text>
  
  <!-- Collapsed Hall -->
  <rect x="270" y="410" width="140" height="45" rx="6" fill="#666" stroke="#999"/>
  <text x="340" y="438" text-anchor="middle" fill="#EEE" font-size="11">Collapsed Hall</text>
  
  <!-- Guard Barracks -->
  <rect x="100" y="370" width="130" height="45" rx="6" fill="#5A5A5A" stroke="#888"/>
  <text x="165" y="398" text-anchor="middle" fill="#CCC" font-size="10">Guard Barracks</text>
  
  <!-- Shattered Throne Hall -->
  <rect x="440" y="360" width="150" height="55" rx="6" fill="#6A4A2A" stroke="#BF8F00"/>
  <text x="515" y="385" text-anchor="middle" fill="#FFD700" font-size="11" font-weight="bold">Shattered Throne Hall</text>
  <text x="515" y="402" text-anchor="middle" fill="#BFA060" font-size="8">Time Rift</text>
  
  <!-- Connections -->
  <line x1="340" y1="465" x2="340" y2="455" stroke="#888" stroke-width="2"/>
  <line x1="290" y1="430" x2="230" y2="395" stroke="#888" stroke-width="1.5"/>
  <line x1="410" y1="430" x2="440" y2="395" stroke="#888" stroke-width="1.5"/>
  
  <!-- Middle Layer -->
  <!-- Archive Vault Door -->
  <rect x="270" y="320" width="140" height="35" rx="5" fill="#8B4513" stroke="#CD853F" stroke-width="2"/>
  <text x="340" y="342" text-anchor="middle" fill="#FFDAB9" font-size="10">🔒 Archive Vault Door</text>
  <text x="340" y="350" text-anchor="middle" fill="#888" font-size="7">Requires S1 Key</text>
  
  <line x1="340" y1="410" x2="340" y2="355" stroke="#888" stroke-width="1.5"/>
  
  <!-- Royal Archive -->
  <rect x="265" y="245" width="150" height="55" rx="6" fill="#3A5A7A" stroke="#6A9AC0"/>
  <text x="340" y="270" text-anchor="middle" fill="#B3D4F0" font-size="12" font-weight="bold">Royal Archive</text>
  <text x="340" y="288" text-anchor="middle" fill="#88B0D0" font-size="9">Time Anomaly Zone — pages turn by themselves</text>
  
  <line x1="340" y1="320" x2="340" y2="300" stroke="#6A9AC0" stroke-width="2"/>
  
  <!-- Deep Core -->
  <!-- Secret Laboratory -->
  <rect x="100" y="185" width="140" height="55" rx="6" fill="#4A2040" stroke="#8B4080"/>
  <text x="170" y="210" text-anchor="middle" fill="#D9A0D9" font-size="11" font-weight="bold">Secret Laboratory</text>
  <text x="170" y="228" text-anchor="middle" fill="#B080B0" font-size="8">Design blueprints of the time-fracture device</text>
  
  <!-- Time-Watcher's Ritual Hall -->
  <rect x="440" y="175" width="150" height="65" rx="6" fill="#2A3A20" stroke="#4A8A30"/>
  <text x="515" y="200" text-anchor="middle" fill="#90D090" font-size="11" font-weight="bold">Time-Watcher's Ritual Hall</text>
  <text x="515" y="218" text-anchor="middle" fill="#70B070" font-size="8">Ouroboros (the Time Serpent) cycle pattern</text>
  <text x="515" y="232" text-anchor="middle" fill="#70B070" font-size="8">Ancient inscriptions</text>
  
  <!-- Connections -->
  <line x1="290" y1="280" x2="170" y2="230" stroke="#B080B0" stroke-width="1.5"/>
  <line x1="390" y1="275" x2="440" y2="225" stroke="#70B070" stroke-width="1.5"/>
  
  <!-- Forgotten Save Point -->
  <rect x="260" y="100" width="160" height="55" rx="10" fill="#1A4060" stroke="#00BFFF" stroke-width="3" filter="url(#glow)"/>
  <text x="340" y="123" text-anchor="middle" fill="#00D4FF" font-size="13" font-weight="bold">🔷 Forgotten Save Point</text>
  <text x="340" y="143" text-anchor="middle" fill="#80D8FF" font-size="9">Touching triggers Memory Fragment overload</text>
  
  <!-- Spiral Staircase Connections -->
  <line x1="170" y1="185" x2="280" y2="140" stroke="#B080B0" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="440" y1="195" x2="400" y2="140" stroke="#70B070" stroke-width="1" stroke-dasharray="4,3"/>
  
  <!-- Time Anomaly Zone -->
  <rect x="40" y="110" width="80" height="50" rx="6" fill="#4A1010" stroke="#C00000" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="80" y="135" text-anchor="middle" fill="#FF6666" font-size="9">⚠ Time</text>
  <text x="80" y="150" text-anchor="middle" fill="#FF6666" font-size="9">Anomaly Zone</text>
  
  <line x1="120" y1="180" x2="80" y2="160" stroke="#C00000" stroke-width="1" stroke-dasharray="3,2"/>
  
  <!-- Gate of the Abyss -->
  <rect x="290" y="25" width="100" height="55" rx="8" fill="#000" stroke="#C00000" stroke-width="2.5"/>
  <text x="340" y="48" text-anchor="middle" fill="#FF4444" font-size="11" font-weight="bold">🚫 Gate of the Abyss</text>
  <text x="340" y="66" text-anchor="middle" fill="#AA0000" font-size="8">Sealed Entrance</text>
  
  <line x1="340" y1="100" x2="340" y2="80" stroke="#C00000" stroke-width="1.5"/>
  
  <!-- Region Labels -->
  <text x="610" y="420" fill="#666" font-size="9">Upper Ruins</text>
  <line x1="600" y1="417" x2="530" y2="417" stroke="#666" stroke-width="0.5"/>
  
  <text x="610" y="270" fill="#6A9AC0" font-size="9">Middle Layer Archive Zone</text>
  <line x1="600" y1="267" x2="430" y2="267" stroke="#6A9AC0" stroke-width="0.5"/>
  
  <text x="610" y="200" fill="#D9A0D9" font-size="9">Deep Core</text>
  <line x1="600" y1="197" x2="580" y2="197" stroke="#D9A0D9" stroke-width="0.5"/>
  
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  
  <!-- Legend -->
  <rect x="60" y="510" width="560" height="24" rx="4" fill="#2A2A3E" stroke="#555"/>
  <rect x="75" y="517" width="12" height="12" rx="2" fill="#666" stroke="#999"/>
  <text x="93" y="527" fill="#AAA" font-size="9">Ruins Zone</text>
  <rect x="150" y="517" width="12" height="12" rx="2" fill="#3A5A7A" stroke="#6A9AC0"/>
  <text x="168" y="527" fill="#AAA" font-size="9">Archive Zone</text>
  <rect x="225" y="517" width="12" height="12" rx="2" fill="#1A4060" stroke="#00BFFF"/>
  <text x="243" y="527" fill="#AAA" font-size="9">Save Point</text>
  <rect x="300" y="517" width="12" height="12" rx="2" fill="#4A1010" stroke="#C00000"/>
  <text x="318" y="527" fill="#AAA" font-size="9">Danger Zone</text>
  <rect x="375" y="517" width="12" height="12" rx="2" fill="#000" stroke="#C00000"/>
  <text x="393" y="527" fill="#AAA" font-size="9">Seal</text>
</svg>

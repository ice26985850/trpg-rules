starting_equipment:
- background: Scholar
  starting_equipment: Notebook, fountain pen, basic research tools, 20 Gold
- background: Soldier
  starting_equipment: One weapon (Long Sword or Short Sword), military ID tag, mobility-friendly clothing, 25 Gold
- background: Thief
  starting_equipment: Lockpicking tools, dark cloak, Knife, 30 Gold (of unknown origin)
- background: Doctor
  starting_equipment: First Aid Kit (3 uses), medical record book, stethoscope, 25 Gold
- background: Wanderer
  starting_equipment: Backpack (flint, rope, water flask), worn-out map, Knife, 20 Gold
- background: Merchant
  starting_equipment: Decent clothes, account book, extra 2d6×5 Gold (10-60)
- background: Performer
  starting_equipment: Instrument or performance prop, eye-catching outfit, 20 Gold
- background: Detective
  starting_equipment: Investigation notes, magnifying glass, evidence-gathering tools, old case files, 25 Gold
currency_and_economy: |
  - Base currency: **Gold Coin (G)**

    - 1 Gold ≈ one day's wage for an ordinary worker

    - Returner starting funds: by background (**20-60 Gold**, see table above)

    - After each Death Return, funds reset to the starting value (but **Save-Point-bound equipment** is not lost, see Player Rulebook 3.1)

    - **In-loop income (to fix economic failure)**: completing a commission or stage bonus 10-30G; looting a defeated enemy yields 2-8G; at the Ash Alley Black Market, you can sell intelligence fragments to the Shadow Guild for 5-15G. This enables a healthy trade-off between "buy medicine vs. save up for gear."

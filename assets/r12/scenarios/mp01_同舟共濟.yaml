# 市井倖存者 多人劇本：「同舟共濟」——圍城中盤：分工與信任
# 格式：YAML
# 建議等級：創角後立即遊玩（接續或獨立皆可）
# 難度：★★★☆（中）
# 建議玩家人數：2–4 人
# 玩家模式：多人（每位玩家扮演同一避難所中的不同倖存者）
# 圍城天數：D+5 至 D+20（約 6–8 次遊戲段落）

scenario_id: "MP1"
scenario_name: "同舟共濟"
difficulty: "★★★☆"
suggested_players: "2–4"
player_mode: "多人（每位玩家扮演同一避難所中的不同倖存者）"
siege_days: "D+5–D+20"
estimated_sessions: "6–8 次"
core_theme: "分工、信任與集體代價"

# ── 劇本概述 ──
summary: |
  圍城已進入第二週。數名互不相識的倖存者，因為躲在同一棟半毀公寓樓的地下室而湊到了一起。
  水電斷絕、物資緊縮，他們必須決定：各自苟活，還是共用一個避難所、分擔風險。
  本劇本專為多角色模式設計——每位玩家操控一名倖存者，共享避難所資源池，
  卻各自背負秘密、創傷與道德底線。集體生存從不便宜：每一份省下的糧食，都來自某個人咽下的委屈。

# ── 團體起始 ──
group_setup:
  shelter_name: "舊城區公寓地下室"
  shelter_state:
    structure: 4
    seal: 3
    comfort: 2
  shared_resources:
    - "罐頭 ×4"
    - "瓶裝水 ×3"
    - "急救包 ×1"
    - "燃料 ×2"
  starting_challenge: "第一夜，樓上傳來腳步聲與壓低的說話聲——是另一名倖存者，還是聯邦軍巡邏兵？團體必須投票決定是否調查、以及如何應對。"
  gm_note: "讓玩家在遊戲開始就體驗『集體決策』：沒有單一主角，每個選擇都是多人之間的拉鋸。"

starting_scenarios:
  - id: A
    name: "鄰居們"
    location: "舊城區住宅公寓"
    description: "同一層樓的三戶人家，圍城前只點頭之交，如今被迫共用走廊與儲藏室。"
    starting_resources: "家庭合計：罐頭 ×4、水 ×3、急救包 ×1；個人物品依各角色卡"
    starting_challenge: "誰來守夜？誰來搜刮？資源帳本由誰記？——第一次分工爭執"
    gm_note: "適合引導玩家建立『共享資源池』與『角色分工』機制"
  - id: B
    name: "職場同事"
    location: "市中心辦公室 或 大學城區教室"
    description: "撤離途中失散的小組，在地下室重新聚集；有人受輕傷，有人帶著重要物資。"
    starting_resources: "辦公室緊急儲備：餅乾 ×2、水 ×1；受傷者需急救包"
    starting_challenge: "建築物在近期砲擊中受損，必須在餘震前加固或撤離"
    gm_note: "適合引導玩家經歷第一次『集體行動』（如協同加固）"
  - id: C
    name: "街頭偶遇"
    location: "隨機城區街道（GM 選擇）"
    description: "砲擊中互不相識的幾人，被迫躲進同一個防空洞；信任尚未建立。"
    starting_resources: "僅各自身上物品（角色卡起始裝備）"
    starting_challenge: "立刻遭遇巡邏兵——必須協同在 3 回合內找到掩護並保持安靜"
    gm_note: "最高張力的起始——考驗即時協作與潛行"

# ── 特殊事件表（按圍城天數觸發；皆為團體層級） ──
special_events:
  - day: "D+6"
    name: "第一次配給投票"
    description: "食物見底。團體必須決定配給方式：平均分配、按勞分配、或弱者優先。"
    mechanics:
      - "團體表決（多數決）；平手由意志最高者裁定"
      - "若選『弱者優先』：照顧者精神 +1，但全體飽足度下降更快"
      - "若選『按勞』：搜刮者獲益，受傷/老弱成員意志（意志）檢定 DC 10，失敗則精神狀態 −1"
    narrative_prompt: "把最後半罐罐頭推到桌子中央。沒人說話。最後是誰先伸手？"
  - day: "D+8"
    name: "敲門的人"
    description: "一名陌生女子帶著孩子，在雨夜敲地下室的門，乞求進入。"
    npc_involved: "GM 選擇：帶孩子的母親 / 受傷的老人 / 神色慌張的年輕人"
    mechanics:
      - "團體表決接納或拒絕"
      - "接納 → 該 NPC 成為避難所成員，食物與水消耗 +1/日；可能帶來情報或麻煩"
      - "拒絕 → 全體進行意志（意志）檢定 DC 10，失敗者精神狀態 −1（集體罪惡感）；創傷值 +1"
    narrative_prompt: "敲門聲在圍城中是最可怕的聲音。它意味著選擇，而現在，這選擇不再只屬於你一個人。"
  - day: "D+11"
    name: "黑市上門"
    description: "馬爾科（NPC #15）找到這個團體，提出用『一份情報』換取物資——而那情報，是另一個避難所的位置。"
    npc: "馬爾科（黑市掮客，REL 0，SEC 4）"
    mechanics:
      - "團體分裂危機：交易派 vs 拒絕派各執一詞"
      - "接受 → 獲得物資（罐頭 ×3、藥品 ×1），但建立與黑河商會（BRS）的灰色聯繫；該避難所日後可能遭殃，觸發全體道德創傷"
      - "拒絕 → 馬爾科記住你們，未來交易起始態度 −1；但團體內部 REL +1（共守底線）"
    narrative_prompt: "『我只是個中間人，』馬爾科說，『但你們這麼多人，總得有人做決定吧？』"
  - day: "D+14"
    name: "巡邏清查"
    description: "聯邦軍巡邏隊要逐棟清點住戶。團體必須決定應對方式。"
    mechanics:
      - "選項 A 偽裝成一家人：全體社交（社交）檢定 DC 12（需口徑一致，任一失敗則全體失敗），成功則巡邏離去"
      - "選項 B 分頭躲藏：各角色單獨體魄/機敏檢定 DC 10 找掩體；一人失敗 → 威脅 2 巡邏兵接觸"
      - "選項 C 賄賂（若有藥品/燃料）：社交（社交）檢定 DC 14，成功換取放行"
    narrative_prompt: "樓梯傳來軍靴聲。『裡面的人，出來登記。』"
  - day: "D+17"
    name: "背叛或忠誠"
    description: "某位玩家的秘密（SEC）被揭露——可能是偷藏物資、與敵軍的過去、或曾見死不救。"
    mechanics:
      - "揭露後，與該玩家相關的團體 REL 歸零"
      - "GM 依秘密內容決定 NPC 與其他玩家的反應（可能驅逐、可能原諒）"
      - "若團體選擇原諒：全體創傷 −1，但日後再犯將直接逐出"
    narrative_prompt: "『所以這些天……你一直沒說？』空氣裡有什麼東西碎了。"
  - day: "D+20"
    name: "最後的選擇"
    description: "收到一方勢力（CDC 市民自衛委員會，或 BRS 黑河商會）的撤離邀請，名額有限。"
    npc_involved: "雅娜·諾瓦克（NPC #2，CDC）或 馬爾科（NPC #15，BRS）"
    mechanics:
      - "團體表決：誰走、誰留、或全體拒絕"
      - "若部分離開：離開者獲得安全，留下者創傷 +2（被遺棄感）；關係產生永久裂痕"
      - "若全體拒絕：團體內部 REL +2，但需獨立面對接下來的圍城"
    narrative_prompt: "一張寫著名單的紙條。上面只有三個名字，而你們有四個人。"

# ── 搜刮地點（團體出擊：2 人外出、其餘留守） ──
scavenge_locations:
  - id: "MP1_L1"
    name: "鄰近廢墟民宅"
    type: "民宅"
    dc: 10
    risk: "低"
    possible_loot:
      - "罐頭食品（60%）"
      - "布料/舊衣物（40%）"
      - "蠟燭（30%）"
    danger_on_fail: "地板部分坍塌——外出者輕傷；留守者聽到動靜，隱蔽值 −1"
  - id: "MP1_L2"
    name: "街角雜貨店"
    type: "商店"
    dc: 12
    risk: "中"
    possible_loot:
      - "罐頭食品（70%）"
      - "瓶裝水（50%）"
      - "電池（30%）"
    danger_on_fail: "其他倖存者也在搜刮——團體需決定是否合作或驅逐（社交對抗）"
  - id: "MP1_L3"
    name: "廢棄車輛"
    type: "戶外"
    dc: 8
    risk: "中（暴露）"
    possible_loot:
      - "汽油（40%）"
      - "地圖（30%）"
      - "急救包（20%）"
    danger_on_fail: "開闊地停留過久——被巡邏兵發現，觸發威脅 2"
  - id: "MP1_L4"
    name: "地下停車場"
    type: "室內"
    dc: 10
    risk: "低"
    possible_loot:
      - "汽油（50%）"
      - "工具（30%）"
      - "膠帶/繩索（40%）"
    danger_on_fail: "黑暗中絆倒——輕傷 + 噪音（等級 3），可能驚動留守者以外的人"
  - id: "MP1_L5"
    name: "被遺棄的公寓"
    type: "民宅"
    dc: 10
    risk: "中"
    possible_loot:
      - "藥品（40%）"
      - "衣物（50%）"
      - "食物（30%）"
    danger_on_fail: "前屋主屍體——首次見屍體觸發創傷事件（創傷意志檢定 TDC 8）；揭露秘密風險"
  - id: "MP1_L6"
    name: "小學教室"
    type: "公共建築"
    dc: 8
    risk: "低"
    possible_loot:
      - "急救包（50%）"
      - "紙筆（60%）"
      - "玩具（20%）"
    danger_on_fail: "天花板已塌——輕微，但玩具可能觸發某玩家的失去記憶（創傷 +1）"

# ── 多人專屬機制 ──
group_mechanics:
  shared_resource_pool: "一個避難所帳本，記錄食物/水/藥品/燃料；每位成員每日各消耗 1 單位食物與水。"
  role_assignment: "依各角色最高屬性建議分工：搜刮者（機敏/手藝）、照顧者（意志/社交）、守衛（體魄/機敏）、修繕者（手藝/體魄）。"
  group_vote: "影響全員的決定採多數決；平手由 GM 或意志最高者（協調者）裁定。"
  relationship_and_secret: "每位玩家對其他玩家有『關係值 REL』；每位玩家有 1 個『秘密（SEC）』。揭露秘密 → 相關 REL 歸零，但可能換取團隊信任（GM 判定）。"
  individual_trauma: "同單人規則；『見證同伴做出殘酷選擇』亦計入創傷事件（參見創傷表『被迫選擇』+3、『同伴死亡』+7）。"
  conflict_resolution: "兩名玩家行動衝突時，先嘗試團體表決；仍僵持則進行社交對抗（3d6+社交），敗方退讓，或以代價成功堅持（承受代價）。"

# ── 關鍵 NPC（劇本推薦登場） ──
key_npcs:
  - name: "瑪爾塔奶奶（NPC #7）"
    role: "提供舊城區情報與民間智慧"
    introduction: "玩家在舊城區移動時，二樓窗戶裡有人喊：『喂！年輕人！』"
  - name: "馬爾科（NPC #15）"
    role: "黑市交易引入者；D+11 黑市上門、D+20 撤離邀請來源之一"
    introduction: "特殊事件觸發"
  - name: "雅娜·諾瓦克（NPC #2）"
    role: "市民自衛委員會（CDC）組織者；D+20 撤離邀請來源"
    introduction: "玩家在街區遇到一群正在組織巡邏的居民"
  - name: "安德烈神父"
    role: "道德事件見證者（可選）；為掙扎中的玩家提供慰藉或試煉"
    introduction: "避難所附近的教堂仍亮著微光"

# ── 結局條件 ──
completion_conditions:
  - condition: "避難所穩定"
    detail: "結構 + 密封 + 舒適度 ≥ 8"
  - condition: "團隊存續"
    detail: "無玩家角色被團體捨棄（REL 總和未全歸零），且至少 3 名成員存活至 D+20"
  - condition: "存活"
    detail: "全體度過 D+20"

# ── 通關獎勵 ──
rewards:
  experience_points: 3
  fortune_point: 1
  special: "解鎖『集體創傷減免』選項：團體支持可使單次創傷 −2，需全員同意"

# ── 銜接 ──
transition: |
  本劇本可獨立遊玩，亦可作為 S1「第一天」之後的團體篇章：
  團體避難所若持續運作，可接續 S2「漫長冬日」，進入燃料危機與冬季考驗。
  若團體在 D+20 選擇接受撤離——則為一個完整的短篇結局。

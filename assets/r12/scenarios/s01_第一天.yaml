# 市井倖存者 劇本一：「第一天」——圍城初期：混亂與適應
# 格式：YAML
# 建議等級：創角後立即遊玩
# 難度：★★☆（低–中）
# 建議玩家人數：1 人（可擴展至多人）
# 圍城天數：第 3 天至第 14 天（約 5–7 次遊戲段落）

scenario_id: "S1"
scenario_name: "第一天"
difficulty: "★★☆"
suggested_players: 1
siege_days: "第 3–14 天"
estimated_sessions: "5–7 次"
core_theme: "混亂與適應"

# ── 劇本概述 ──
summary: |
  圍城剛開始不久。砲聲還在遠方，但水電已經不穩，商店已被搶掠一空。
  城市陷入有組織的混亂——聯邦軍廣播著「局勢在掌控中」，但街上到處是逃難的人群和被遺棄的車輛。
  玩家必須在秩序的廢墟中找到立足之地：建立避難所、尋找第一批物資、決定信任誰。

# ── 起始情境（玩家或 GM 選擇一種） ──
starting_scenarios:
  - id: A
    name: "自家公寓"
    location: "舊城區住宅公寓"
    starting_resources:
      - "家庭儲備：罐頭×3、瓶裝水×2、急救包×1"
      - "個人物品：依角色創建步驟八選擇"
    starting_challenge: "鄰居敲門求助——一個帶著孩子的家庭請求庇護"
    gm_note: "讓玩家立即面對第一個道德抉擇：開門還是拒絕？"
  
  - id: B
    name: "工作場所"
    location: "市中心辦公室 或 大學城區教室"
    starting_resources:
      - "辦公室的緊急儲備：餅乾×2、瓶裝水×1"
      - "同事/同學 NPC 在身邊（GM 選擇 1–2 名）"
    starting_challenge: "建築物在最近的砲擊中受損，必須在餘震前撤離"
    gm_note: "適合引導玩家經歷第一次潛行/撤離行動"
  
  - id: C
    name: "街頭"
    location: "隨機城區街道（GM 選擇）"
    starting_resources:
      - "僅身上物品（角色卡上的起始裝備）"
    starting_challenge: "立刻遭遇第一次砲擊（輕度）或巡邏兵——必須在 3 回合內找到掩護"
    gm_note: "最高難度的起始——適合喜歡挑戰的玩家"

# ── 特殊事件表（按天數觸發） ──
special_events:
  - day: 3
    name: "第一次砲擊"
    description: "城市某處遭到砲擊。玩家聽到砲彈的尖嘯聲越來越近。"
    mechanics:
      - "所有角色進行體魄 DC 10 檢定，失敗則輕傷（被碎片劃傷）"
      - "若玩家在戶外：DC 改為 14"
    narrative_prompt: "描述砲彈落地的瞬間：震耳欲聾的爆炸、窗戶碎裂、灰塵如雨般落下。"

  - day: 4
    name: "水源危機"
    description: "自來水停止供應。城市廣播宣布『供水系統受損，正在搶修』——但沒有人知道何時能修好。"
    mechanics:
      - "從此刻起，水成為稀缺資源（交易價值 ×2）"
      - "玩家若無儲備水源：脫水倒計時開始"
    narrative_prompt: "讓玩家感受失去日常便利的震撼——打開水龍頭，只有空氣的嘶嘶聲。"

  - day: 5
    name: "鄰居的請求"
    description: "一名鄰居敲玩家的門。他/她認識玩家（圍城前就住在附近）。"
    npc_involved: "GM 選擇或擲骰：1-3 帶著孩子的家庭、4-5 受傷的老人、6 一個看起來很可疑的年輕人"
    mechanics:
      - "接納：玩家獲得該 NPC 作為避難所成員。食物和水消耗 +1/日。"
      - "拒絕：進行意志 DC 10 檢定，失敗則精神狀態 −1（罪惡感）"
    narrative_prompt: "敲門聲在圍城中是最可怕的聲音之一。它意味著選擇。"

  - day: 7
    name: "空投傳單"
    description: "飛機在頭頂低飛——不是轟炸，而是空投傳單。"
    options:
      - "圍城方的投降要求：『放下武器，交出城市，保證平民安全。』"
      - "友軍的訊息：『堅持住。援軍在路上。』"
    mechanics:
      - "給玩家一個劇情資訊——以及一個希望（或恐懼）"
    narrative_prompt: "傳單像雪一樣飄落。有人撿起來讀，有人用來生火，有人折成紙飛機送給孩子。"

  - day: 10
    name: "第一次黑市接觸"
    description: "一個自稱馬爾科（NPC #15）的人接觸玩家。他提供『交易』——食物換資訊，或藥品換『人情』。"
    npc: "馬爾科（黑市掮客，REL 0，SEC 4）"
    mechanics:
      - "玩家可進行議價（社交 DC 12），成功則獲得較優惠的交易條件"
      - "接受交易：建立與黑河商會的初始聯繫"
      - "拒絕交易：馬爾科記住了你——未來交易時起始態度 −1"
    narrative_prompt: "馬爾科說話很快，眼神不停地掃視街道兩端。『我只是個中間人，』他說，『但我認識能弄到東西的人。』"

  - day: 14
    name: "狙擊手出現"
    description: "第一次有目擊報告——共和大道上有人被狙擊。從此，白晝穿越開闊地帶變成極度危險。"
    mechanics:
      - "從此刻起，白晝穿越共和大道（市中心主路）觸發狙擊手威脅（威脅 4）"
      - "玩家首次聽到狙擊槍聲：意志 DC 10，失敗則精神狀態 −1"
    narrative_prompt: "那聲槍響比任何砲擊都更清晰——因為你知道它瞄準的是某個特定的人。"

# ── 搜刮地點 ──
scavenge_locations:
  - id: "S1_L1"
    name: "鄰近廢墟民宅"
    type: "民宅"
    dc: 10
    risk: "低"
    possible_loot:
      - "罐頭食品（60%）"
      - "布料/舊衣物（40%）"
      - "蠟燭（30%）"
      - "個人物品——信件、照片（20%）"
    danger_on_fail: "地板坍塌部分——輕傷"

  - id: "S1_L2"
    name: "街角雜貨店"
    type: "商店"
    dc: 12
    risk: "中"
    possible_loot:
      - "罐頭食品（70%）"
      - "瓶裝水（50%）"
      - "電池（30%）"
      - "香菸（20%）"
    danger_on_fail: "其他倖存者也在搜刮——可能發生衝突"

  - id: "S1_L3"
    name: "廢棄車輛"
    type: "戶外"
    dc: 8
    risk: "中（暴露）"
    possible_loot:
      - "汽油（40%）"
      - "地圖（30%）"
      - "急救包（20%）"
    danger_on_fail: "在開闊地帶停留過久——被巡邏兵發現"

  - id: "S1_L4"
    name: "地下停車場"
    type: "室內"
    dc: 10
    risk: "低"
    possible_loot:
      - "汽油（50%）"
      - "工具（30%）"
      - "膠帶/繩索（40%）"
    danger_on_fail: "黑暗中絆倒——輕傷 + 噪音（等級 3）"

  - id: "S1_L5"
    name: "被遺棄的公寓"
    type: "民宅"
    dc: 10
    risk: "中"
    possible_loot:
      - "藥品（40%）"
      - "衣物（50%）"
      - "食物（30%）"
    danger_on_fail: "前屋主的屍體——首次見屍體觸發創傷事件（TDC 8）"

  - id: "S1_L6"
    name: "小學教室"
    type: "公共建築"
    dc: 8
    risk: "低"
    possible_loot:
      - "急救包（50%）"
      - "紙筆（60%）"
      - "玩具（20%）"
    danger_on_fail: "幾乎無危險——但建築物部分天花板已塌"

# ── 關鍵 NPC（劇本一推薦登場） ──
key_npcs:
  - name: "瑪爾塔奶奶（NPC #7）"
    role: "提供舊城區情報和民間智慧"
    introduction: "玩家在舊城區移動時，經過一棟老房子，二樓窗戶裡有人喊：『喂！年輕人！』"
  
  - name: "馬爾科（NPC #15）"
    role: "黑市交易引入者"
    introduction: "特殊事件：第 10 天黑市接觸"

  - name: "雅娜·諾瓦克（NPC #2）"
    role: "CDC 組織者"
    introduction: "玩家在街區遇到一群正在組織巡邏的居民"

# ── 結局條件 ──
completion_conditions:
  - condition: "避難所穩定"
    detail: "結構完整度 + 密封度 + 舒適度 ≥ 5"
  - condition: "建立關係"
    detail: "與至少 1 名 NPC 的關係值（REL）≥ 3"
  - condition: "存活"
    detail: "成功存活 7 天（即完成至少 7 次遊戲段落）"

# ── 通關獎勵 ──
rewards:
  experience_points: 2
  fortune_point: 1
  special: "解鎖避難所改善選項：加固結構（結構 +1，需材料）"

# ── 銜接劇本二 ──
transition_to_S2: |
  時間跳躍 2–3 週。GM 描述這段時間內的變化：
  - 水電仍未恢復
  - 街上的人變少了——有些撤離了，有些死了
  - 黑市交易變得更頻繁
  - 冬天即將來臨（或已經來臨）
  玩家的避難所仍在運作，但物資儲備正在減少。

# 市井倖存者 劇本二：「漫長冬日」——圍城中期：資源枯竭與道德考驗
scenario_id: "S2"
scenario_name: "漫長冬日"
difficulty: "★★★☆"
suggested_players: 1
siege_days: "第 30–90 天"
estimated_sessions: "14–21 次"
core_theme: "枯竭與抉擇"
prerequisite: "完成 S1「第一天」或具備穩定避難所的角色"

summary: |
  圍城進入第二個月。冬季降臨。大多數易於到達的地點已被掠奪一空。
  水電供應未曾恢復。黑市成為生存的必要之惡，而每一筆交易都有隱藏的代價。
  避難所中的人們開始出現裂痕——有些人想突圍，有些人想投降，有些人只想睡覺不再醒來。
  玩家面臨的道德抉擇變得更加尖銳：是偷竊鄰居的儲備來餵飽自己的孩子，還是看著孩子挨餓？

# ── 冬季特殊規則 ──
winter_rules:
  fuel_consumption: "加倍（每日 −2）"
  warmth_decay: "自然下降速度加倍"
  daylight: "白晝時間縮短（更多黑夜行動時段）"
  disease_risk: "肺炎感染風險增加（失溫 + 潮濕環境）"
  scavenge_dc: "所有搜刮 DC +2（大多數地點已被掠奪）"
  npc_mortality: "年長 NPC 和兒童 NPC 的死亡率增加（GM 判定）"

# ── 四節結構 ──
acts:
  - act: 1
    title: "寒冬降臨"
    days: "第 30–40 天"
    theme: "燃料危機、避難所加固"
    key_events:
      - "第一場雪——溫暖度開始快速下降"
      - "燃料儲備告急——必須外出尋找更多燃料"
      - "避難所需要加固以抵禦嚴寒（密封度需 ≥ 3，否則溫暖度每日額外 −1）"
      - "瑪爾塔奶奶（NPC #7）提供草藥知識——如何製作簡易保暖敷劑"
  
  - act: 2
    title: "資源枯竭"
    days: "第 40–55 天"
    theme: "必須前往高風險地點搜刮"
    key_events:
      - "舊城區的搜刮 DC 從 10 提升至 12（已被掠奪多次）"
      - "玩家必須前往市中心或北郊等危險區域才能找到足夠物資"
      - "第一次遭遇黑河商會的『特別交易』——教授（NPC #3）親自出現"
      - "疾病開始在社區中傳播（痢疾或肺炎）"
  
  - act: 3
    title: "信任考驗"
    days: "第 55–70 天"
    theme: "NPC 秘密揭露、背叛或忠誠"
    key_events:
      - "一名 NPC 的秘密被意外揭露（GM 選擇合適的 NPC）"
      - "維克多（NPC #12）提出『情報交易』——但你知道他是告密者"
      - "迪米特里（NPC #8）的 PTSD 在某次砲擊中觸發——他可能做出危險行為"
      - "避難所內發生衝突——某人被指控偷竊儲備食物"
  
  - act: 4
    title: "黑暗交易"
    days: "第 70–90 天"
    theme: "與黑河商會的關鍵交易"
    key_events:
      - "教授提出『不可拒絕的提議』——大量物資換取一個『小小的幫助』"
      - "自由之聲（VoL）接觸玩家——幽靈（NPC #6）請求協助"
      - "國際人道團宣布最後一次撤離行動——但名額有限"
      - "一名 NPC 做出極端選擇（如維克多出賣某人、卡洛的騙局被揭穿）"

# ── 新增搜刮地點 ──
scavenge_locations:
  - id: "S2_L1"
    name: "邊境黑市（南郊）"
    type: "黑市"
    dc: 14
    risk: "中–高"
    possible_loot: ["任何物品（取決於交易）", "情報", "武器（罕見）"]
    danger: "騙子、告密者、軍警突襲"
    special: "在此可接觸馬爾科（NPC #15）和教授（NPC #3）"

  - id: "S2_L2"
    name: "被遺棄的醫院（大學城區）"
    type: "醫療設施"
    dc: 16
    risk: "高"
    possible_loot: ["大量藥品（抗生素、止痛藥、急救包）", "醫療器材"]
    danger: "被敵軍用作臨時據點——遭遇巡邏兵或軍官的機率極高"
    special: "可能遇到艾琳娜醫生（NPC #4）"

  - id: "S2_L3"
    name: "工業倉庫（工業區）"
    type: "倉庫"
    dc: 12
    risk: "中"
    possible_loot: ["燃料（汽油、柴油）", "工具（扳手、鐵撬）", "材料（膠帶、繩索）"]
    danger: "部分倉庫被幫派佔據——可能遭遇暴徒"
    special: "找到燃料的機率加倍"

  - id: "S2_L4"
    name: "炸毀的超市（市中心）"
    type: "商店"
    dc: 14
    risk: "高"
    possible_loot: ["罐頭食品", "瓶裝水", "電池", "奢侈品（香菸、酒）"]
    danger: "建築結構不穩（坍塌風險）、狙擊手視線覆蓋"
    special: "每次搜刮需進行額外的砲擊風險檢定（意志 DC 10）"

  - id: "S2_L5"
    name: "其他避難所（各區）"
    type: "社交"
    dc: "社交檢定（非機敏）"
    risk: "可變"
    possible_loot: ["情報", "同盟", "交易機會"]
    danger: "對方可能不友善、可能被滲透、可能是陷阱"
    special: "結果取決於玩家的社交技能和對方的態度"

  - id: "S2_L6"
    name: "聯邦軍哨站"
    type: "軍事"
    dc: 18
    risk: "極高"
    possible_loot: ["武器（手槍、步槍）", "軍用口糧", "軍用醫療包"]
    danger: "被視為間諜/敵人——被捕或直接開火"
    special: "僅建議在極度絕望時嘗試；成功需極高的潛行或社交技能"

  - id: "S2_L7"
    name: "教堂地下室（舊城區）"
    type: "庇護所"
    dc: 10
    risk: "低"
    possible_loot: ["庇護（安全休息場所）", "精神慰藉（與安德烈神父交談 → 創傷 −1）", "情報（神父知道誰需要幫助）"]
    danger: "已被多人知曉——可能不是祕密"
    special: "安德烈神父（NPC #1）在此；不能進行常規『搜刮』但可獲得非物質幫助"

# ── 關鍵 NPC 登場 ──
key_npcs:
  - name: "教授（NPC #3）"
    introduction: "在第三節或第四節，透過馬爾科引薦。教授在一個廢棄倉庫裡等待——他看起來不像黑市大亨，更像一個疲憊的大學講師。"
    role: "提出黑暗交易"
  
  - name: "艾琳娜醫生（NPC #4）"
    introduction: "在舊城區臨時診所或大學城區醫院遇到。她在極度有限的條件下做手術。"
    role: "醫療支援（但藥物有限）"
  
  - name: "幽靈（NPC #6）"
    introduction: "自由之聲在夜間接觸玩家——一個戴面具的人留下訊息。"
    role: "提供軍事訓練和武器，但要求玩家參與危險任務"
  
  - name: "卡洛（NPC #10）"
    introduction: "一個『聯邦軍軍官』接觸玩家，提供『內部情報』——但他是卡洛偽裝的。"
    role: "騙局——玩家需要識破他的謊言"

# ── 結局條件 ──
completion_conditions:
  - condition: "度過冬季"
    detail: "溫暖度未歸零超過連續 7 天"
  - condition: "深厚關係"
    detail: "與至少 3 名 NPC 建立有意義的關係（REL ≥ 5）"
  - condition: "道德抉擇"
    detail: "做出至少 2 次重大道德抉擇（GM 記錄）"
  - condition: "避難所存活"
    detail: "避難所未倒塌（結構完整度 > 0）"

# ── 通關獎勵 ──
rewards:
  experience_points: 3
  fortune_point: 1
  special: "解鎖一個適應性專長（依創傷累積值選擇）"

# ── 銜接劇本三 ──
transition_to_S3: |
  時間跳躍至圍城第 100 天。
  GM 描述：
  - 城市已面目全非。空蕩的街道，燒毀的建築，以及無處不在的沉默。
  - 每個還活著的人都在準備——準備突圍、準備談判、或準備死亡。
  - 玩家收到多方勢力的最終邀請。每個勢力都提供了一個結局——但每個結局都有代價。
  - 這是圍城的最後階段。一切即將結束。

# 市井倖存者 劇本三：「終局之門」——圍城末期：最終抉擇
scenario_id: "S3"
scenario_name: "終局之門"
difficulty: "★★★★☆"
suggested_players: 1
siege_days: "第 100+ 天"
estimated_sessions: "7–10 次"
core_theme: "最終結局"
prerequisite: "完成 S2「漫長冬日」或具備深厚關係網絡和相當創傷的角色"

summary: |
  圍城進入第一百天。這座城市幾乎無法辨認——曾經的咖啡館變成了墳墓，
  曾經的校園變成了堡壘，曾經的家變成了廢墟。
  
  結局即將到來。但不是以一種方式——而是以多種可能的形態同時逼近。
  聯邦軍計劃最後的突圍、黑河商會出售秘密撤離通道、國際人道團談判撤離名單、
  自由之聲準備最後的抵抗行動、教會打開大門迎接任何需要庇護的人。
  
  玩家必須做出終極選擇——而這個選擇將永久改變剩下的一切。

# ── 多方勢力最終邀請 ──
faction_offers:
  - faction: "聯邦軍（KFA）"
    offer: "加入最後的突圍行動"
    cost: "極高的死亡風險（突圍存活率約 30%）"
    mechanics: "需通過至少 3 次高 DC 檢定（潛行、體魄、意志）"
    reward: "若成功：自由、與外界重新連接"
    who_would_choose_this: "渴望戰鬥或別無選擇的角色"

  - faction: "黑河商會（BRS）"
    offer: "秘密撤離通道——穿越前線到中立區"
    cost: "鉅額代價：所有物資、一個祕密，或一個人情（未來必須償還）"
    mechanics: "議價 DC 16 可降低代價；通道並非 100% 安全（遭遇機率 20%）"
    reward: "安全撤離（若成功通過通道）"
    who_would_choose_this: "有東西可以交易的務實主義者"
    note: "名額有限——教授只提供 1–2 個名額。如果玩家有 NPC 同伴，必須做出選擇。"

  - faction: "自由之聲（VoL）"
    offer: "參與最終抵抗行動——在敵軍總攻時發動城內破壞"
    cost: "幾乎注定犧牲（存活率 < 10%）"
    mechanics: "一系列戰鬥/潛行檢定，DC 16–20"
    reward: "即使死亡，你的行動可能改變戰局——你的名字可能被記住"
    who_would_choose_this: "幽靈、迪米特里（若克服 PTSD）——以及選擇以死謝罪的創傷角色"

  - faction: "國際人道救援團（IHA）"
    offer: "談判撤離——以平民身份經由人道走廊離開"
    cost: "必須證明『平民身份』——可能需要放棄武裝同伴或否認與 VoL 的關聯"
    mechanics: "社交 DC 14 說服 IHA 官員；需放棄所有武器"
    reward: "最安全的撤離方式（存活率 > 80%）"
    who_would_choose_this: "帶著弱者（孩子、老人）的保護者"
    note: "艾琳娜醫生（NPC #4）可以幫助擔保玩家的平民身份"

  - faction: "聖米迦勒教會"
    offer: "留在城市——在教堂地下室守護無法離開的人"
    cost: "承受圍城的最後階段——轟炸、巷戰、以及可能的佔領"
    mechanics: "無需檢定；選擇留下即可。但需意志 DC 14 每日檢定以維持士氣"
    reward: "守護了無法保護自己的人——以及內心的平靜"
    who_would_choose_this: "安德烈神父、瑪爾塔奶奶——以及選擇不逃跑的人"

# ── 關鍵 NPC 終局選擇 ──
npc_endgame_choices:
  - npc: "安德烈神父（NPC #1）"
    choice: "留下守護教堂到最後一刻。即使城市陷落，他也不會離開。"
    impact: "若玩家也選擇留下：可獲得神父的最終祝福（精神狀態完全恢復一次）"

  - npc: "雅娜·諾瓦克（NPC #2）"
    choice: "猶豫不決——她既想帶領社區突圍，又不願放棄任何人。"
    impact: "玩家的選擇可能影響她的決定。REL ≥ 7 時會跟隨玩家的選擇。"

  - npc: "教授（NPC #3）"
    choice: "準備自己的撤離計劃——他比所有人都早一步。"
    impact: "若玩家與教授關係良好（REL ≥ 5），他可能多提供一個撤離名額。"

  - npc: "迪米特里（NPC #8）"
    choice: "面臨最後的救贖機會——他可能選擇加入 VoL 的最終行動來贖罪，或徹底崩潰。"
    impact: "玩家的支持可以決定他走向哪條路。若 REL ≥ 7，他會聽從玩家的建議。"

  - npc: "維克多（NPC #12）"
    choice: "他的告密者身份可能在終局被揭露。"
    impact: "玩家如何處理他——原諒、驅逐、還是懲罰——將決定社區的道德基調。"

  - npc: "尼科與莉娜（NPC #9）"
    choice: "孩子的命運是最沉重的道德秤砣。"
    impact: "任何涉及孩子的選擇都會帶來最大的情感衝擊和創傷後果。"

# ── 終極道德困境：「信號」 ──
ultimate_dilemma:
  name: "信號"
  trigger: "玩家獲得一個無線電頻率——圍城方的指揮頻率（可能是意外發現、從 VoL 獲得、或教授出售）"
  options:
    - id: A
      name: "交給自由之聲"
      consequence: "VoL 使用頻率發動精準破壞。可能扭轉戰局，但圍城方必然發動報復性屠殺。你手上沾滿了那些因報復而死的人的血——但你也可能拯救了整座城市。"
      trauma: "+5 創傷累積"
    
    - id: B
      name: "賣給黑河商會"
      consequence: "教授用頻率換取大量物資和 2 個撤離名額。你安全了——但城市中的其他人被拋棄。你永遠不知道頻率被用來做了什麼。"
      trauma: "+3 創傷累積"
    
    - id: C
      name: "親自使用頻率談判"
      consequence: "嘗試以個人身份與圍城方談判安全通行。社交 DC 18。成功 → 你和指定同伴獲得安全通行。失敗 → 被定位，敵軍特種部隊前來『處理』你。"
      trauma: "成功 +1 / 失敗 +4"
    
    - id: D
      name: "摧毀頻率"
      consequence: "什麼都不做。讓命運自然發展。不沾血——但也放棄了改變結果的機會。你能承受『什麼都不做』的後果嗎？"
      trauma: "+1（『如果當初…』的折磨）"

# ── 結局判定（GM 使用） ──
ending_determination:
  method: "四因素加權判定"
  factors:
    - factor: "世界設定（40%）"
      description: "GM 在遊戲開始前選擇的圍城原因（設定 A/B/C）。這決定了圍城的大方向。"
    
    - factor: "玩家影響力（30%）"
      description: "根據玩家在三個劇本中的累積選擇計算：幫助了多少人、建立了哪些聯盟、做出了什麼犧牲。"
    
    - factor: "關鍵事件（20%）"
      description: "『信號』的最終處理方式、與關鍵 NPC 的關係狀態、避難所的存續。"
    
    - factor: "隨機（10%）"
      description: "擲 3d6：3–7 局勢惡化 / 8–12 持平 / 13–18 局勢意外好轉。"

# ── 可能的結局 ──
possible_endings:
  - ending: "解放"
    condition: "友軍突破圍城 + 玩家協助（如提供情報）"
    narrative_tone: "希望與創傷並存"
  
  - ending: "撤圍"
    condition: "外交談判成功 + 玩家未破壞和平進程"
    narrative_tone: "苦澀的解脫"
  
  - ending: "陷落"
    condition: "敵軍最終攻勢成功 + 玩家未能阻止或逃離"
    narrative_tone: "倖存的代價是活在佔領下"
  
  - ending: "逃亡"
    condition: "玩家透過黑市/IHA/VoL 通道成功撤離"
    narrative_tone: "自由——但為此付出了什麼？"
  
  - ending: "凍餓而死"
    condition: "資源耗盡，基本生存無法維持"
    narrative_tone: "圍城中最平常的結局"
  
  - ending: "開放式"
    condition: "玩家和 GM 選擇不結束故事"
    narrative_tone: "圍城仍在繼續……"

# ── 結局後處理（GM 指南） ──
post_ending:
  steps:
    - "角色總結：為每個存活角色寫一段結局敘述——基於他們的選擇、關係和創傷"
    - "遺留問題：提出『後來呢？』——角色之後去了哪裡？與 NPC 的關係是否持續？"
    - "集體回顧：讓玩家分享最難忘的時刻"
    - "GM 結語：為這場圍城畫上句點"

# ── 通關獎勵 ──
rewards:
  experience_points: 4
  fortune_point: "恢復至上限（5 點）"
  trauma_reduction: "完成核心任務後創傷累積 −5（一次性——長戰役中的重大喘息節點）"
  special: "解鎖『圍城倖存者』稱號——角色獲得永久性結局敘述"

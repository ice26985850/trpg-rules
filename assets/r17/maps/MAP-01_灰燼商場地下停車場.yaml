id: "MAP-01"
title: "灰燼商場地下停車場（擴充）"
region: "邊緣地帶"
danger: "★★☆☆☆"
suitable_levels: [1, 2]
regions:
  - name: "B1 層（一般停車區）"
    color: "#E3F2FD"
  - name: "B2 層（深層停車區）"
    color: "#FFF3E0"
nodes:
  - id: "entry"
    name: "地下停車場入口"
    region: "B1 層（一般停車區）"
    col: 0
    row: 0
    note: "斜坡通往 B1 層，上方有堆疊貨架作為天然障礙物；變異鼠×3 出沒"
  - id: "east"
    name: "東停車場"
    region: "B1 層（一般停車區）"
    col: 1
    row: 0
    note: "開放式停車區，約 50 車位。撤離點 A（信號槍呼叫）；殘留體巡邏 1-2"
  - id: "tunnel"
    name: "維修通道"
    region: "B1 層（一般停車區）"
    col: 2
    row: 0
    note: "B1→B2 連接帶，寬 1.5m 僅容一人；變異鼠伏擊；潛行 TN14"
  - id: "supply"
    name: "補給車區域"
    region: "B2 層（深層停車區）"
    col: 3
    row: 0
    note: "B2 深層；軍用補給車可搜；強化殘留體×1；逃生梯通往地表（隱藏撤離點 TN14）"
edges:
  - from: "entry"
    to: "east"
    label: "斜坡"
  - from: "east"
    to: "tunnel"
    label: "通道"
  - from: "tunnel"
    to: "supply"
    label: "坡道/升降機井"
  - from: "supply"
    to: "entry"
    label: "逃生梯（隱藏撤離）"

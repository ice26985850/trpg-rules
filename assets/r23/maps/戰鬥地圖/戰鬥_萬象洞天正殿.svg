ght="42" fill="#e3cf72" fill-opacity="0.55" stroke="#e3cf72" stroke-width="1"/><text x="265.0" y="269.0" font-size="9" text-anchor="middle" fill="#4a3c28">目標物</text><rect x="202" y="286" width="42" height="42" fill="#e3cf72" fill-opacity="0.55" stroke="#e3cf72" stroke-width="1"/><text x="223.0" y="311.0" font-size="9" text-anchor="middle" fill="#4a3c28">目標物</text><rect x="244" y="286" width="42" height="42" fill="#e3cf72" fill-opacity="0.55" stroke="#e3cf72" stroke-width="1"/><circle cx="97.0" cy="307.0" r="11" fill="#2f6fb0" stroke="#fff" stroke-width="1.5"/><text x="97.0" y="311.0" font-size="9.5" text-anchor="middle" fill="#fff" font-weight="bold">PC</text><circle cx="139.0" cy="265.0" r="11" fill="#2f6fb0" stroke="#fff" stroke-width="1.5"/><text x="139.0" y="269.0" font-size="9.5" text-anchor="middle" fill="#fff" font-weight="bold">PC</text><circle cx="139.0" cy="349.0" r="11" fill="#2f6fb0" stroke="#fff" stroke-width="1.5"/><text x="139.0" y="353.0" font-size="9.5" text-anchor="middle" fill="#fff" font-weight="bold">PC</text><circle cx="181.0" cy="307.0" r="11" fill="#2f6fb0" stroke="#fff" stroke-width="1.5"/><text x="181.0" y="311.0" font-size="9.5" text-anchor="middle" fill="#fff" font-weight="bold">PC</text><circle cx="265.0" cy="307.0" r="13" fill="#7a1f1f" stroke="#fff" stroke-width="1.5"/><text x="265.0" y="311.0" font-size="9.5" text-anchor="middle" fill="#fff" font-weight="bold">劍靈</text><line x1="34" y1="506" x2="454" y2="506" stroke="#cbb893" stroke-width="1"/><text x="34" y="518" font-size="11" font-weight="bold" fill="#2a241c">戰術提示 / 距離數據：</text><text x="34" y="534" font-size="11.5" fill="#3a3228">僅當 PC 以暴力破解試煉時觸發；智慧/扮演通過則不戰。</text><text x="34" y="551" font-size="11.5" fill="#3a3228">劍靈 生命值（HP）55，每回合 50% 看破同招—輪換勁力/武功類型破解。</text><text x="34" y="568" font-size="11.5" fill="#3a3228">中心＝上古武脈核心（目標，非攻擊物）。</text><text x="34" y="585" font-size="11.5" fill="#3a3228">推薦：快→重→柔→遠 循環，或「無招」破劍式。</text><text x="34" y="602" font-size="11.5" fill="#3a3228">距離：PC 包圍中心（E5）於 2–3 格內＝一步至三步。</text><text x="34" y="623" font-size="10" fill="#6b5d44">移動：普通1格／疾衝·輕功2格（輕功+1命中）。站位：側面+2命中／背後+4命中（不可格擋）。圍攻2人+1／3人+2（上限5）。</text></svg>
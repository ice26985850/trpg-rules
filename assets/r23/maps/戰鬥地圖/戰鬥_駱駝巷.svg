ht="42" fill="#c8ad7e" fill-opacity="0.55" stroke="#c8ad7e" stroke-width="1"/><text x="265.0" y="185.0" font-size="9" text-anchor="middle" fill="#4a3c28">半掩體DC+2</text><rect x="286" y="160" width="42" height="42" fill="#c8ad7e" fill-opacity="0.55" stroke="#c8ad7e" stroke-width="1"/><rect x="160" y="244" width="42" height="42" fill="#aebfce" fill-opacity="0.55" stroke="#aebfce" stroke-width="1"/><text x="181.0" y="269.0" font-size="9" text-anchor="middle" fill="#4a3c28">狹窄·長兵-3</text><circle cx="97.0" cy="223.0" r="11" fill="#2f6fb0" stroke="#fff" stroke-width="1.5"/><text x="97.0" y="227.0" font-size="9.5" text-anchor="middle" fill="#fff" font-weight="bold">PC</text><circle cx="97.0" cy="181.0" r="11" fill="#2f6fb0" stroke="#fff" stroke-width="1.5"/><text x="97.0" y="185.0" font-size="9.5" text-anchor="middle" fill="#fff" font-weight="bold">PC</text><circle cx="97.0" cy="265.0" r="11" fill="#2f6fb0" stroke="#fff" stroke-width="1.5"/><text x="97.0" y="269.0" font-size="9.5" text-anchor="middle" fill="#fff" font-weight="bold">PC</text><circle cx="97.0" cy="139.0" r="11" fill="#2f8f4f" stroke="#fff" stroke-width="1.5"/><text x="97.0" y="143.0" font-size="9.5" text-anchor="middle" fill="#fff" font-weight="bold">鐵鏡心</text><circle cx="307.0" cy="181.0" r="11" fill="#b23a3a" stroke="#fff" stroke-width="1.5"/><text x="307.0" y="185.0" font-size="9.5" text-anchor="middle" fill="#fff" font-weight="bold">刀客</text><circle cx="349.0" cy="223.0" r="11" fill="#b23a3a" stroke="#fff" stroke-width="1.5"/><text x="349.0" y="227.0" font-size="9.5" text-anchor="middle" fill="#fff" font-weight="bold">刀客</text><circle cx="391.0" cy="139.0" r="11" fill="#b23a3a" stroke="#fff" stroke-width="1.5"/><text x="391.0" y="143.0" font-size="9.5" text-anchor="middle" fill="#fff" font-weight="bold">刀客</text><circle cx="433.0" cy="181.0" r="11" fill="#b23a3a" stroke="#fff" stroke-width="1.5"/><text x="433.0" y="185.0" font-size="9.5" text-anchor="middle" fill="#fff" font-weight="bold">毒師</text><circle cx="475.0" cy="223.0" r="11" fill="#caa53a" stroke="#fff" stroke-width="1.5"/><text x="475.0" y="227.0" font-size="9.5" text-anchor="middle" fill="#fff" font-weight="bold">證據車</text><line x1="34" y1="338" x2="538" y2="338" stroke="#cbb893" stroke-width="1"/><text x="34" y="350" font-size="11" font-weight="bold" fill="#2a241c">戰術提示 / 距離數據：</text><text x="34" y="366" font-size="11.5" fill="#3a3228">長條窄巷：全場「狹窄地形」，長兵器 -3，適合短兵/暗器。</text><text x="34" y="383" font-size="11.5" fill="#3a3228">屋頂（上緣）為高處；忘川樓暗影第三勢力自屋頂掠過取信。</text><text x="34" y="400" font-size="11.5" fill="#3a3228">毒師持霹靂彈（瀕死同歸）—優先擊殺；證據車（右）需攔截。</text><text x="34" y="417" font-size="11.5" fill="#3a3228">鐵鏡心（友軍）獨戰牽制；PC 可幫六扇門或圍觀。</text><text x="34" y="434" font-size="11.5" fill="#3a3228">距離：PC 起點 A 列，敵在中段 F–I，毒師近證據車（約 8 格＝遠處，暗器/弓可達）。</text><text x="34" y="455" font-size="10" fill="#6b5d44">移動：普通1格／疾衝·輕功2格（輕功+1命中）。站位：側面+2命中／背後+4命中（不可格擋）。圍攻2人+1／3人+2（上限5）。</text></svg>
nt-weight="bold">勇士</text><line x1="34" y1="422" x2="454" y2="422" stroke="#cbb893" stroke-width="1"/><text x="34" y="434" font-size="11" font-weight="bold" fill="#2a241c">戰術提示 / 距離數據：</text><text x="34" y="450" font-size="11.5" fill="#3a3228">中心祭壇＝範圍血祭（強化周圍勇士）；薩滿免疫外傷減免，懼內傷/真氣。</text><text x="34" y="467" font-size="11.5" fill="#3a3228">三回合內殺薩滿→所有強化勇士失增益並受 2d6 反噬。</text><text x="34" y="484" font-size="11.5" fill="#3a3228">強化勇士（被血祭）戰力暴漲；用六脈神劍等絕學遠程打薩滿。</text><text x="34" y="501" font-size="11.5" fill="#3a3228">距離：PC 左列，薩滿居中（約 4 格＝三步內可接戰）。</text><text x="34" y="522" font-size="10" fill="#6b5d44">移動：普通1格／疾衝·輕功2格（輕功+1命中）。站位：側面+2命中／背後+4命中（不可格擋）。圍攻2人+1／3人+2（上限5）。</text></svg>
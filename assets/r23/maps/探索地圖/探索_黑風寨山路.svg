<svg xmlns="http://www.w3.org/2000/svg" width="920" height="560" viewBox="0 0 920 560" font-family="'PingFang SC','Microsoft JhengHei','Heiti TC',sans-serif"><rect width="920" height="560" fill="#f4ecd8"/><text x="460.0" y="28" font-size="18" font-weight="bold" text-anchor="middle" fill="#2a241c">第一章·黑風寨山路探索</text><text x="460.0" y="46" font-size="11" text-anchor="middle" fill="#6b5d44">探索示意圖（路線／關鍵點／威脅）— 不含精準距離，僅供敘事導航</text><line x1="120" y1="140" x2="320" y2="150" stroke="#9c8a64" stroke-width="2" stroke-dasharray="6 4"/><text x="220.0" y="141.0" font-size="10" text-anchor="middle" fill="#6b5d44">追蹤 DC12</text><line x1="320" y1="150" x2="520" y2="200" stroke="#9c8a64" stroke-width="2" stroke-dasharray="6 4"/><text x="420.0" y="171.0" font-size="10" text-anchor="middle" fill="#6b5d44">換崗觀察</text><line x1="520" y1="200" x2="720" y2="180" stroke="#9c8a64" stroke-width="2" stroke-dasharray="6 4"/><text x="620.0" y="186.0" font-size="10" text-anchor="middle" fill="#6b5d44">潛行 DC12</text><line x1="520" y1="200" x2="700" y2="330" stroke="#9c8a64" stroke-width="2" stroke-dasharray="6 4"/><text x="610.0" y="261.0" font-size="10" text-anchor="middle" fill="#6b5d44">威嚇 DC12</text><line x1="520" y1="200" x2="820" y2="430" stroke="#9c8a64" stroke-width="2" stroke-dasharray="6 4"/><text x="670.0" y="311.0" font-size="10" text-anchor="middle" fill="#6b5d44">追擊 Boss</text><circle cx="120" cy="140" r="9" fill="#2f8f4f" stroke="#fff" stroke-width="2"/><text x="120" y="164" font-size="12" text-anchor="middle" fill="#2a241c" font-weight="bold">起點·山路入口</text><circle cx="320" cy="150" r="9" fill="#c8702a" stroke="#fff" stroke-width="2"/><text x="320" y="174" font-size="12" text-anchor="middle" fill="#2a241c" font-weight="bold">巡邏路線</text><circle cx="520" cy="200" r="9" fill="#3a6ea5" stroke="#fff" stroke-width="2"/><text x="520" y="224" font-size="12" text-anchor="middle" fill="#2a241c" font-weight="bold">山寨外圍</text><circle cx="720" cy="180" r="9" fill="#caa53a" stroke="#fff" stroke-width="2"/><text x="720" y="204" font-size="12" text-anchor="middle" fill="#2a241c" font-weight="bold">柴房（人質）</text><circle cx="700" cy="330" r="9" fill="#3a6ea5" stroke="#fff" stroke-width="2"/><text x="700" y="354" font-size="12" text-anchor="middle" fill="#2a241c" font-weight="bold">地窖（練功）</text><circle cx="820" cy="430" r="9" fill="#caa53a" stroke="#fff" stroke-width="2"/><text x="820" y="454" font-size="12" text-anchor="middle" fill="#2a241c" font-weight="bold">後山古松（突破）</text><line x1="20" y1="464" x2="900" y2="464" stroke="#cbb893" stroke-width="1"/><text x="20" y="478" font-size="11" font-weight="bold" fill="#2a241c">探索提示：</text><text x="20" y="496" font-size="11.5" fill="#3a3228">挑戰：向村民打聽山路（江湖見識 DC10）→獲突襲先手+2。</text><text x="20" y="512" font-size="11.5" fill="#3a3228">失敗迷路 1 時辰，夜戰視線-2（影/毒宗反獲隱匿）。</text><text x="20" y="528" font-size="11.5" fill="#3a3228">救出村民可從俘虜套話：「大當家每晚關地窖練功」。</text><text x="20" y="544" font-size="11.5" fill="#3a3228">後山古松＝擊敗大當家後的境界突破場景。</text></svg>
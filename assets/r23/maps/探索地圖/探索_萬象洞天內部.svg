<svg xmlns="http://www.w3.org/2000/svg" width="920" height="560" viewBox="0 0 920 560" font-family="'PingFang SC','Microsoft JhengHei','Heiti TC',sans-serif"><rect width="920" height="560" fill="#f4ecd8"/><text x="460.0" y="28" font-size="18" font-weight="bold" text-anchor="middle" fill="#2a241c">第四章·萬象洞天內部（四試煉→武脈）</text><text x="460.0" y="46" font-size="11" text-anchor="middle" fill="#6b5d44">探索示意圖（路線／關鍵點／威脅）— 不含精準距離，僅供敘事導航</text><line x1="120" y1="300" x2="320" y2="300" stroke="#9c8a64" stroke-width="2" stroke-dasharray="6 4"/><text x="220.0" y="296.0" font-size="10" text-anchor="middle" fill="#6b5d44">三碎片/破陣錐</text><line x1="320" y1="300" x2="520" y2="140" stroke="#9c8a64" stroke-width="2" stroke-dasharray="6 4"/><text x="420.0" y="216.0" font-size="10" text-anchor="middle" fill="#6b5d44">天道之劍</text><line x1="320" y1="300" x2="540" y2="260" stroke="#9c8a64" stroke-width="2" stroke-dasharray="6 4"/><text x="430.0" y="276.0" font-size="10" text-anchor="middle" fill="#6b5d44">元氣歸宗</text><line x1="320" y1="300" x2="540" y2="380" stroke="#9c8a64" stroke-width="2" stroke-dasharray="6 4"/><text x="430.0" y="336.0" font-size="10" text-anchor="middle" fill="#6b5d44">藥毒同源</text><line x1="320" y1="300" x2="540" y2="500" stroke="#9c8a64" stroke-width="2" stroke-dasharray="6 4"/><text x="430.0" y="396.0" font-size="10" text-anchor="middle" fill="#6b5d44">直面本心</text><line x1="320" y1="300" x2="820" y2="300" stroke="#9c8a64" stroke-width="2" stroke-dasharray="6 4"/><text x="570.0" y="296.0" font-size="10" text-anchor="middle" fill="#6b5d44">第五試煉</text><circle cx="120" cy="300" r="9" fill="#2f8f4f" stroke="#fff" stroke-width="2"/><text x="120" y="324" font-size="12" text-anchor="middle" fill="#2a241c" font-weight="bold">外圍入口</text><circle cx="320" cy="300" r="9" fill="#3a6ea5" stroke="#fff" stroke-width="2"/><text x="320" y="324" font-size="12" text-anchor="middle" fill="#2a241c" font-weight="bold">正殿</text><circle cx="520" cy="140" r="9" fill="#caa53a" stroke="#fff" stroke-width="2"/><text x="520" y="164" font-size="12" text-anchor="middle" fill="#2a241c" font-weight="bold">試煉一·劍之極</text><circle cx="540" cy="260" r="9" fill="#caa53a" stroke="#fff" stroke-width="2"/><text x="540" y="284" font-size="12" text-anchor="middle" fill="#2a241c" font-weight="bold">試煉二·氣之源</text><circle cx="540" cy="380" r="9" fill="#caa53a" stroke="#fff" stroke-width="2"/><text x="540" y="404" font-size="12" text-anchor="middle" fill="#2a241c" font-weight="bold">試煉三·生與死</text><circle cx="540" cy="500" r="9" fill="#caa53a" stroke="#fff" stroke-width="2"/><text x="540" y="524" font-size="12" text-anchor="middle" fill="#2a241c" font-weight="bold">試煉四·心之鏡</text><circle cx="820" cy="300" r="9" fill="#7a1f1f" stroke="#fff" stroke-width="2"/><text x="820" y="324" font-size="12" text-anchor="middle" fill="#2a241c" font-weight="bold">上古武脈（隱藏）</text><line x1="20" y1="464" x2="900" y2="464" stroke="#cbb893" stroke-width="1"/><text x="20" y="478" font-size="11" font-weight="bold" fill="#2a241c">探索提示：</text><text x="20" y="496" font-size="11.5" fill="#3a3228">四試煉各對應一種武學境界：劍/氣/藥毒/心，可分工或一人擔二。</text><text x="20" y="512" font-size="11.5" fill="#3a3228">試煉一用「精神對決」3 回合（HP40 劍形對手，模仿前三招）。</text><text x="20" y="528" font-size="11.5" fill="#3a3228">試煉四＝心魔幻影（roleplay，逃避則幻境反噬 24h 全檢定-2）。</text><text x="20" y="544" font-size="11.5" fill="#3a3228">四試煉通過→正殿開啟→上古武脈（屬性/武功/自創靈感）。</text></svg>
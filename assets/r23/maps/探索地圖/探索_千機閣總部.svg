<svg xmlns="http://www.w3.org/2000/svg" width="920" height="560" viewBox="0 0 920 560" font-family="'PingFang SC','Microsoft JhengHei','Heiti TC',sans-serif"><rect width="920" height="560" fill="#f4ecd8"/><text x="460.0" y="28" font-size="18" font-weight="bold" text-anchor="middle" fill="#2a241c">第三章/四·千機閣總部（地下迷宮／集會）</text><text x="460.0" y="46" font-size="11" text-anchor="middle" fill="#6b5d44">探索示意圖（路線／關鍵點／威脅）— 不含精準距離，僅供敘事導航</text><line x1="160" y1="120" x2="360" y2="200" stroke="#9c8a64" stroke-width="2" stroke-dasharray="6 4"/><text x="260.0" y="156.0" font-size="10" text-anchor="middle" fill="#6b5d44">機關鳥傳信</text><line x1="360" y1="200" x2="560" y2="140" stroke="#9c8a64" stroke-width="2" stroke-dasharray="6 4"/><text x="460.0" y="166.0" font-size="10" text-anchor="middle" fill="#6b5d44">四試煉之鑰</text><line x1="360" y1="200" x2="360" y2="380" stroke="#9c8a64" stroke-width="2" stroke-dasharray="6 4"/><text x="360.0" y="286.0" font-size="10" text-anchor="middle" fill="#6b5d44">試探封印</text><line x1="560" y1="140" x2="640" y2="360" stroke="#9c8a64" stroke-width="2" stroke-dasharray="6 4"/><text x="600.0" y="246.0" font-size="10" text-anchor="middle" fill="#6b5d44">第二進法</text><circle cx="160" cy="120" r="9" fill="#2f8f4f" stroke="#fff" stroke-width="2"/><text x="160" y="144" font-size="12" text-anchor="middle" fill="#2a241c" font-weight="bold">入口·千機帖</text><circle cx="360" cy="200" r="9" fill="#3a6ea5" stroke="#fff" stroke-width="2"/><text x="360" y="224" font-size="12" text-anchor="middle" fill="#2a241c" font-weight="bold">公輸玄工坊</text><circle cx="560" cy="140" r="9" fill="#caa53a" stroke="#fff" stroke-width="2"/><text x="560" y="164" font-size="12" text-anchor="middle" fill="#2a241c" font-weight="bold">集會高臺</text><circle cx="360" cy="380" r="9" fill="#c8702a" stroke="#fff" stroke-width="2"/><text x="360" y="404" font-size="12" text-anchor="middle" fill="#2a241c" font-weight="bold">地下迷宮</text><circle cx="640" cy="360" r="9" fill="#3a6ea5" stroke="#fff" stroke-width="2"/
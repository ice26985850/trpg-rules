<svg xmlns="http://www.w3.org/2000/svg" width="920" height="560" viewBox="0 0 920 560" font-family="'PingFang SC','Microsoft JhengHei','Heiti TC',sans-serif"><rect width="920" height="560" fill="#f4ecd8"/><text x="460.0" y="28" font-size="18" font-weight="bold" text-anchor="middle" fill="#2a241c">第三章·峨眉後山 → 萬象洞天外圍</text><text x="460.0" y="46" font-size="11" text-anchor="middle" fill="#6b5d44">探索示意圖（路線／關鍵點／威脅）— 不含精準距離，僅供敘事導航</text><line x1="120" y1="120" x2="140" y2="320" stroke="#9c8a64" stroke-width="2" stroke-dasharray="6 4"/><text x="130.0" y="216.0" font-size="10" text-anchor="middle" fill="#6b5d44">段天涯切磋</text><line x1="140" y1="320" x2="420" y2="200" stroke="#9c8a64" stroke-width="2" stroke-dasharray="6 4"/><text x="280.0" y="256.0" font-size="10" text-anchor="middle" fill="#6b5d44">墨染引路</text><line x1="420" y1="200" x2="640" y2="180" stroke="#9c8a64" stroke-width="2" stroke-dasharray="6 4"/><text x="530.0" y="186.0" font-size="10" text-anchor="middle" fill="#6b5d44">心境石碑</text><line x1="640" y1="180" x2="840" y2="260" stroke="#9c8a64" stroke-width="2" stroke-dasharray="6 4"/><text x="740.0" y="216.0" font-size="10" text-anchor="middle" fill="#6b5d44">三方對峙</text><line x1="420" y1="200" x2="420" y2="420" stroke="#9c8a64" stroke-width="2" stroke-dasharray="6 4"/><text x="420.0" y="306.0" font-size="10" text-anchor="middle" fill="#6b5d44">外圍探索</text><circle cx="120" cy="120" r="9" fill="#3a6ea5" stroke="#fff" stroke-width="2"/><text x="120" y="144" font-size="12" text-anchor="middle" fill="#2a241c" font-weight="bold">劍閣關</text><circle cx="140" cy="320" r="9" fill="#3a6ea5" stroke="#fff" stroke-width="2"/><text x="140" y="344" font-size="12" text-anchor="middle" fill="#2a241c" font-weight="bold">唐門小鎮</text><circle cx="420" cy="200" r="9" fill="#caa53a" stroke="#fff" stroke-width="2"/><text x="420" y="224" font-size="12" text-anchor="middle" fill="#2a241c" font-weight="bold">峨眉後山（藍光石洞）</text><circle cx="640" cy="180" r="9" fill="#caa53a" stroke="#fff" stroke-width="2"/><text x="640" y="204" font-size="12" text-anchor="middle" fill="#2a241c" font-weight="bold">長廊→門（碎片①）</text><circle cx="840" cy="260" r="9" fill="#3a6ea5" stroke="#fff" stroke-width="2"/><text x="840" y="284" font-size="12" text-anchor="middle" fill="#2a241c" font-weight="bold">千機閣集會</text><circle cx="420" cy="420" r="9" fill="#2f8f4f" stroke="#fff" stroke-width="2"/><text x="420" y="444" font-size="12" text-anchor="middle" fill="#2a241c" font-weight="bold">萬象洞天外圍</text><line x1="20" y1="464" x2="900" y2="464" stroke="#cbb893" stroke-width="1"/><text x="20" y="478" font-size="11" font-weight="bold" fill="#2a241c">探索提示：</text><text x="20" y="496" font-size="11.5" fill="#3a3228">劍閣關＝段天涯論劍（非致命，三招）。</text><text x="20" y="512" font-size="11.5" fill="#3a3228">峨眉後山月圓藍光＝古碑「萬象歸元，心即是鑰」，需真誠觸碰。</text><text x="20" y="528" font-size="11.5" fill="#3a3228">石碑開後為外圍長廊→門（缺 1/3 弧形鑰），洞深得第一塊碎片。</text><text x="20" y="544" font-size="11.5" fill="#3a3228">千機閣集會＝三塊碎片歸一，三方對峙（可轉三方混戰）。</text></svg>
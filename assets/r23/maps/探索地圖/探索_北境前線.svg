<svg xmlns="http://www.w3.org/2000/svg" width="920" height="560" viewBox="0 0 920 560" font-family="'PingFang SC','Microsoft JhengHei','Heiti TC',sans-serif"><rect width="920" height="560" fill="#f4ecd8"/><text x="460.0" y="28" font-size="18" font-weight="bold" text-anchor="middle" fill="#2a241c">第六章·北境前線 → 雁門關</text><text x="460.0" y="46" font-size="11" text-anchor="middle" fill="#6b5d44">探索示意圖（路線／關鍵點／威脅）— 不含精準距離，僅供敘事導航</text><line x1="140" y1="120" x2="360" y2="200" stroke="#9c8a64" stroke-width="2" stroke-dasharray="6 4"/><text x="250.0" y="156.0" font-size="10" text-anchor="middle" fill="#6b5d44">蠻族破關</text><line x1="360" y1="200" x2="560" y2="160" stroke="#9c8a64" stroke-width="2" stroke-dasharray="6 4"/><text x="460.0" y="176.0" font-size="10" text-anchor="middle" fill="#6b5d44">滲透斬首</text><line x1="560" y1="160" x2="760" y2="260" stroke="#9c8a64" stroke-width="2" stroke-dasharray="6 4"/><text x="660.0" y="206.0" font-size="10" text-anchor="middle" fill="#6b5d44">偵察祭壇</text><line x1="360" y1="200" x2="360" y2="420" stroke="#9c8a64" stroke-width="2" stroke-dasharray="6 4"/><text x="360.0" y="306.0" font-size="10" text-anchor="middle" fill="#6b5d44">號令羣雄</text><line x1="360" y1="420" x2="620" y2="420" stroke="#9c8a64" stroke-width="2" stroke-dasharray="6 4"/><text x="490.0" y="416.0" font-size="10" text-anchor="middle" fill="#6b5d44">決戰</text><circle cx="140" cy="120" r="9" fill="#2f8f4f" stroke="#fff" stroke-width="2"/><text x="140" y="144" font-size="12" text-anchor="middle" fill="#2a241c" font-weight="bold">燕雲十六州</text><circle cx="360" cy="200" r="9" fill="#c8702a" stroke="#fff" stroke-width="2"/><text x="360" y="224" font-size="12" text-anchor="middle" fill="#2a241c" font-weight="bold">雁門關</text><circle cx="560" cy="160" r="9" fill="#3a6ea5" stroke="#fff" stroke-width="2"/><text x="560" y="184" font-size="12" text-anchor="middle" fill="#2a241c" font-weight="bold">蠻族大營</text><circle cx="760" cy="260" r="9" fill="#caa53a" stroke="#fff" stroke-width="2"/><text x="760" y="284" font-size="12" text-anchor="middle" fill="#2a241c" font-weight="bold">上古祭壇</text><circle cx="360" cy="420" r="9" fill="#caa53a" stroke="#fff" stroke-width="2"/><text x="360" y="444" font-size="12" text-anchor="middle" fill="#2a241c" font-weight="bold">長城·終局獨白</text><circle cx="620" cy="420" r="9" fill="#7a1f1f" stroke="#fff" stroke-width="2"/><text x="620" y="444" font-size="12" text-anchor="middle" fill="#2a241c" font-weight="bold">決戰戰場</text><line x1="20" y1="464" x2="900" y2="464" stroke="#cbb893" stroke-width="1"/><text x="20" y="478" font-size="11" font-weight="bold" fill="#2a241c">探索提示：</text><text x="20" y="496" font-size="11.5" fill="#3a3228">雁門關已破，朝廷崩潰；PC 以第六境宗師身份介入戰爭。</text><text x="20" y="512" font-size="11.5" fill="#3a3228">路徑：斬首者（單挑大王）／將軍（指揮）／盾（守關鍵人）／劍（聯手突破口）／智者（側翼瓦解）。</text><text x="20" y="528" font-size="11.5" fill="#3a3228">上古祭壇＝薩滿血祭強化（戰鬥地圖見 戰鬥_北境祭壇）。</text><text x="20" y="544" font-size="11.5" fill="#3a3228">長城獨白＝終局選擇（守護/開派/歸隱/西行/忘川樓主）。</text></svg>
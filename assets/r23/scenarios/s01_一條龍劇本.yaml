# 永和武典 · 一條龍劇本（結構化資料）
# 對應玩家/GM 可讀版本：s01_一條龍劇本.md
# 用途：供建站腳本 / AI GM 引擎以機器可讀格式引用本劇本
# 格式：YAML（UTF-8，全繁體中文，術語採「中文全稱（縮寫）」格式）

scenario:
  id: s01
  title: 一條龍劇本
  slug: s01_yi-tiao-long
  type: campaign                # campaign=長篇連續劇本 / oneshot=單次團
  player_mode: multiplayer      # multiplayer=多人 / solo=單人
  players:
    min: 4
    max: 6
    default: 4
    gm: required
  recommended_realm: "第一境·初窺門徑 → 第六境·返璞歸真"
  expected_sessions: "第一章1-3 + 第二章3-5 + 第三章4-6 + 第四章5-7 + 第五章6-8 + 第六章3-5 團（全本約 22–34 團）"
  design_rationale: >-
    一條龍劇本是為 GM 提供一條「拿出來就能帶團」的完整冒險路線。它是一套「有主幹、有枝杈、有工具箱」的敘事框架，
    而非嚴格線性劇本。設計原則：境界驅動（每章對應一個境界突破）、勢力交織（四大風雲故事線）、分支給足（每章結尾提供 GM 可選變體）、引用優先（武功/裝備/NPC 均引用既有規則具名條目）。
  source_files:
    - "12_一條龍劇本.md"
  reference_files:
    - "01_核心機制"
    - "02_角色創建"
    - "05_江湖世界"
    - "06_江湖模擬"
    - "07_主持指南"
    - "08_裝備丹藥"
    - "09_武功圖鑑"
    - "11_NPC角色卡"
    - "14_敵人速查表"
    - "15_隨機遭遇表"
  story_threads:                # 四大風雲故事線
    - 盟主更替
    - 魔教異動
    - 祕藏傳說
    - 北境烽煙
  assumptions:                  # 該劇本存在的前提假設
    - "PC 數量：4-6 人（所有遭遇的默認難度基準）"
    - "門派分佈：不要求特定門派，建議至少含 1 名正道、1 名中立/灰色；全邪道隊伍需 GM 自行調整部分正道 NPC 初始態度"
    - "PC 等級曲線：每章開始時 PC 位於前一章對應境界巔峰；落後則 GM 應插入額外團次或調整難度"
    - "NPC 角色卡：核心 NPC 數據見 11_NPC角色卡.md；未出現者標註「新建NPC」"
  chapters:

    # ===================== 第一章 =====================
    - id: ch1
      index: 1
      title: 初窺門徑
      realm_milestone: "初窺門徑 → 登堂入室"
      pc_realm: "第一境·初窺門徑（屬性上限 5）"
      expected_sessions: 1-3
      attribute_baseline:        # 六維能力基準（GM 參考）
        pc_avg: "膂力/身法/根骨 3-5；悟性/定力/魅力 2-5"
        recommended_dc_range: "難度（DC） 8-12"
        qi_pool: "8-15 點"
        hp_range: "15-30"
      hooks:
        - id: hook-a
          name: 茶館偶遇
          suited: 所有門派
          scene: >-
            洛陽城外三里「四海茶寮」，說書先生講述天劍盟五大劍派明爭暗鬥。
          conflict_trigger: >-
            一隊黑衣蒙面人闖入宣稱「奉血月教令」繳械正道弟子，逼 PC 出手。
          why_pc_acts: >-
            正道門派有義務護民；中立門派自身利益受脅；邪道偏中門派可能被誤當正道一併攻擊。
        - id: hook-b
          name: 師門出山任務
          suited: "正派/機宗/藥宗"
          scene: >-
            PC 師門交付前往洛陽城外「龍泉渡」取物/接人之任務；到達時山賊搶了渡口，頭目是第二境巔峰的「黑風寨大當家」。
          conflict_trigger: >-
            山賊頭子（修習魔教殘篇，摸到了第二境邊）劫掠渡口，戰鬥爆發。
        - id: hook-c
          name: 飛來橫禍
          suited: "邪道偏中/影宗/散人"
          scene: >-
            官道上受驚馬車橫衝直撞，車中有受傷村民。出手救人後發現車輪被人動過機關。
          conflict_trigger: >-
            設置機關者「新建NPC：陰九齡（千機閣叛徒，第二境巔峰）」在山坡冷眼旁觀。
      key_scenes:
        - id: scene-1
          title: 混亂中的相遇
          summary: "PC 第一次在戰鬥中相遇，各展所長（劍宗出劍、氣宗運氣、金剛宗硬撼、毒宗遠程）。"
        - id: scene-2
          title: 師父點評（戰後）
          summary: "根據鉤子不同，相助的長者身分為：說書先生（機宗丐幫長老）/渡口船伕（天劍盟暗探）/面具女子（柳生煙）。"
        - id: scene-3
          title: 第一次選擇
          summary: "長者給 PC 抉擇：各自走人或一起去找黑風寨。此為首次團隊抉擇。"
        - id: scene-4
          title: 黑風寨（戰鬥場景）
          summary: "見下方遭遇設計。"
        - id: scene-5
          title: 突破（境界突破場景）
          summary: "擊敗大當家後發現魔教殘篇（末尾寫「餘下七頁，存於洛陽城內沈記當鋪」），完成入門試煉突破至第二境。"
      encounters:
        - id: enc-1
          title: 茶館/渡口/官道混戰
          enemies:
            - name: 黑衣人
              count: "PC數+1（鉤子A）"
              hp: 15
              might: "膂力 3（調-1）"
              agility: "身法 3（調-1）"
              attack: "基礎命中 +1"
              damage: "1d6+1"
            - name: 山賊
              count: "=PC數（鉤子B）"
              hp: 12
              might: "膂力 3"
              agility: "身法 2"
              attack: "命中 +0"
              damage: "1d6"
            - name: 陰九齡的機關傀儡
              count: 2
              hp: 20
              might: "膂力 4（調0）"
              traits: "免疫恐懼；受火屬傷害翻倍"
          difficulty: 中等（對第一境 PC）
          tactics: "劍宗/金剛宗前排接敵；氣宗以太極拳·攬雀尾防禦；毒宗遠程輸出；藥宗治療；影宗先手解決最弱敵。"
          variant: "若全為新手可減 1 敵；若有人落單被圍，未出手的長者出手一次救急。"
        - id: enc-2
          title: 黑風寨外圍
          enemies:
            - name: 黑風寨小頭目
              count: 1
              hp: 20
              might: "膂力 4（調0）"
              agility: "身法 3"
              attack: "命中 +2（使刀）"
              damage: "1d8+1（短刀）；技能「當頭一刀」命中-2但傷害+1d6"
            - name: 山賊嘍囉
              count: "=PC數"
              hp: 12
              attack: "命中 +0"
              damage: "1d6"
          difficulty: 中等
        - id: enc-3
          title: "黑風寨大當家——Boss 戰"
          enemies:
            - name: "「獨眼龍」韓豹"
              role: boss
              hp: 30
              might: "膂力 5（調+1）"
              agility: "身法 4（調0）"
              root: "根骨 4"
              focus: "定力 2"
              attack: "命中 +3（大刀）"
              damage: "2d6+1（五虎斷門刀·劈風式）"
              qi: 6
              special: "每受一次傷害下回合命中+1（狂暴，疊加至多+3）；累計受 20 點以上傷害後狂暴消失並陷入恐懼。"
          difficulty: 困難（Boss 戰）
          variant: "若 PC 過弱，大當家因魔功反噬每回合受 1d4 內傷。"
      noncombat_challenges:
        - id: chal-1
          title: 追蹤黑風寨（探索）
          check: "追蹤 難度（DC） 12（悟性）或 江湖見識 難度（DC） 10（悟性）向村民打聽"
          success: "找到山路、發現巡邏路線，突襲首戰獲先手+2。"
          failure: "山中迷路一個時辰，夜戰視線-2（影宗/毒宗反而隱匿加值）。"
        - id: chal-2
          title: 救出被擄村民（社交/潛入）
          check: "潛行 難度（DC） 12（身法）繞守衛；或 威嚇 難度（DC） 12（膂力）逼俘虜帶路"
          success: "救出人質，獲情報「大當家每晚關在地窖練功」。"
          failure: "觸發追加遭遇；村民有人受傷（不及時救治則俠義值-2）。"
      rewards:
        - name: 魔教殘篇（半頁）
          type: 劇情物品
          source: "指向第二章線索——沈記當鋪"
        - name: 黑風寨贓物
          type: 銀兩
          source: "30-50 兩（PC 均分）；歸還村民則俠義值+2"
        - name: 五虎斷門刀·劈風式
          type: 武功祕笈
          source: "大當家身上（見 09_武功圖鑑 §6）；僅散人或使刀 PC 可習"
        - name: 金瘡藥
          type: 消耗品
          source: "×3 份（見 08_裝備丹藥 §特殊道具）"
      breakthrough:
        to_realm: 第二境·登堂入室
        xp_requirement: "累計 ≥ 20 經驗值（XP）"
        martial_requirement: "掌握至少 1 門入門心法 + 1 門基礎武功"
        story_lock: "完成入門試煉——擊敗黑風寨大當家並做出「堅守正道/堅守自我」選擇"
        rewards: "屬性+3（單項最多+2）；真氣境界+3；屬性上限解鎖至 6；對低境界對手獲優勢骰；「氣感初成」被動（短休息恢復+2）"
      foreshadow:
        - text: "魔教殘篇祕密（沈記當鋪）"
          points_to: 第二章
        - text: "說書人/船伕/柳生煙身分"
          points_to: 第二章
        - text: "陰九齡（若未抓）加入千機閣黑暗計劃"
          points_to: 第四章
        - text: "血月教之名（黑衣人/大當家口中）"
          points_to: "第三-五章"
      gm_variants:
        - id: var-a
          title: PC 決定不組隊
          detail: "各 PC 遇需幫助者；仍不組隊則數日後洛陽大事再聚。"
        - id: var-b
          title: PC 輕鬆碾壓
          detail: "大當家臨死放信號彈，留下懸念；追加黑風寨塌方/走水逃脫場景。"
        - id: var-c
          title: PC 戰敗
          detail: "不滅團——被關柴房與村民同囚，轉越獄場景，重挑時大當家 HP 僅剩一半。"

    # ===================== 第二章 =====================
    - id: ch2
      index: 2
      title: 登堂入室
      realm_milestone: "登堂入室 → 融會貫通"
      pc_realm: "第二境·登堂入室（屬性上限 6）"
      expected_sessions: 3-5
      attribute_baseline:
        pc_avg: "膂力/身法/根骨 4-6；悟性/定力/魅力 3-6"
        recommended_dc_range: "難度（DC） 10-15"
        qi_pool: "15-25 點"
        hp_range: "25-40"
      hooks:
        - id: hook-a
          name: 沈萬金的請帖
          suited: "正派/中立 PC"
          scene: "洛陽客棧收到四海盟大掌櫃沈萬金燙金請帖，席間透露有人在大量收購化功散原料（龍涎草/寒石膽/七星海棠）。"
          conflict_trigger: "沈萬金請 PC 查出收購者身分。"
        - id: hook-b
          name: 柳生煙的求助
          suited: "藥宗/中立/遊俠 PC"
          scene: "洛陽遇地痞糾纏的年輕女子柳生煙（藥王谷濟世堂首席），追查藥王谷流出禁藥。"
        - id: hook-c
          name: 沈記當鋪線索
          suited: "接第一章伏筆"
          scene: "持魔教殘篇至沈記當鋪，掌櫃沈三認出同款殘篇，提及「黑色蠍子紋身」。"
          conflict_trigger: "江湖見識 難度（DC） 12（悟性）可辨識為血月教下屬標記。"
      key_scenes:
        - id: scene-1
          title: 洛陽城探索（開放場景）
          locations:
            - "揚州樓（四海盟）：接鉤子A、結識 NPC"
            - "龍泉閣（鑄劍坊）：購/升武器，紫陽近期取劍"
            - "藥王濟世堂：治療、購藥、柳生煙"
            - "沈記當鋪：接鉤子C、打聽傳聞"
            - "六扇門洛陽分堂：新建NPC 鐵鏡心（第四境）"
            - "三教九流茶館：打聽消息 難度（DC）-2"
        - id: scene-2
          title: 追查藥材（調查鏈）
          summary: "四條線索指向三方買家：西域商人（血月教）、巴蜀神祕買家（千機閣）、洛陽富商楚懷沙（破封散）。"
        - id: scene-3
          title: 揚州樓夜宴——信息彙集
          summary: "沈萬金攤開洛陽地圖，點出西域/巴蜀/楚懷沙三處。"
        - id: scene-4
          title: 見楚懷沙（社交/潛行）
          summary: "楚懷沙透露破封散取自公輸玄，需進萬象洞天救中毒之妹。"
        - id: scene-5
          title: 駱駝巷——血月教的影子（戰鬥）
          summary: "西域商人銷毀證據被六扇門堵住，PC 可選擇幫/攔截/圍觀。"
      encounters:
        - id: enc-1
          title: 駱駝巷巷戰
          enemies:
            - name: 西域刀客
              count: "PC數+1"
              hp: 20
              might: "膂力 4（調0）"
              agility: "身法 4"
              attack: "命中 +3（彎刀）"
              damage: "2d6"
              special: "技能「沙漠之風」：先手+2，首刀命中+1"
            - name: 西域毒師
              count: 1
              hp: 15
              sense: "悟性 4"
              attack: "命中 +3（毒針暗器）"
              damage: "1d4+中毒（1d4/回合，持續2回合）"
              special: "持 2 枚霹靂彈，瀕死引爆同歸"
          difficulty: 中等
          third_party: "第3回合神祕黑影取走貨車信件消失；身法/察覺 難度（DC） 15 可辨「黃泉步」（忘川樓輕功）。"
        - id: enc-2
          title: 平安客棧的巴蜀買家（可選）
          enemies:
            - name: 巴蜀機關師
              count: 2
              hp: 18
              sense: "悟性 5"
              special: "不擅近戰，遠程操控機關"
            - name: 鐵甲機關獸
              count: 1
              hp: 35
              might: "膂力 6（調+2）"
              attack: "命中 +4"
              damage: "2d8+2"
              special: "暗器命中-4；火屬傷害翻倍；每回合自動修復 1d4 生命值（HP）"
          difficulty: 困難
          background: "千機閣某堂主私自行為；密信「閣老已知萬象洞天方位，速購材料，三月內不可走漏風聲」。"
        - id: enc-3
          title: 楚懷沙的考驗（可選社交→可能戰鬥）
          enemies:
            - name: 楚懷沙
              role: "非 Boss（只想脫身）"
              hp: 28
              agility: "身法 7（調+3）"
              sense: "悟性 6（調+2）"
              qi: 20
              attack: "追風掌 命中+4，傷害 2d6+3"
              special: "預埋 5 機關（煙霧/毒煙/繩網）；目標為阻止逃跑而非打死"
          difficulty: 中等（非常規戰鬥）
      noncombat_challenges:
        - id: chal-1
          title: 解讀古地圖
          check: "江湖見識 難度（DC） 15（悟性）或 書畫 難度（DC） 12（魅力）"
          success: "辨認巴蜀峨眉後山不在圖上之區域；古文字「萬象歸元，洞天有鑰」。"
          failure: "僅知巴蜀山區，需千機閣解讀（引向第四章）。"
        - id: chal-2
          title: 駱駝巷證據追蹤
          check: "追蹤 難度（DC） 12（悟性）"
          success: "取得血月教文書+洛陽佈防圖（北境踩點）。"
          failure: "碎片「……北境……化功散……」引向第六章。"
        - id: chal-3
          title: 說服楚懷沙合作
          check: "口才 難度（DC） 15（魅力）"
          bonus: "有藥宗 PC → 難度（DC）-2；威嚇 → 難度（DC）+5 且失敗即遭遇3"
          success: "獲古地圖+破封散配方+信物。"
          failure: "楚懷沙離開洛陽，第三章巴蜀再遇。"
      rewards:
        - name: 柳葉刀/短劍
          type: 武器
          source: "二選一，沈萬金之禮（見 08_裝備丹藥）"
        - name: 續命丹
          type: 丹藥
          source: "×2，柳生煙之謝"
        - name: 小還丹+聚氣丹
          type: 丹藥
          source: "小還丹×3 + 聚氣丹×1，繳獲自西域貨箱"
        - name: 破封散配方
          type: "劇情/物品"
          source: "需說服楚懷沙（藥宗 PC 或煉丹≥2 方可煉，煉丹 難度（DC） 14）"
        - name: 古地圖（殘缺）
          type: 劇情物品
          source: "指向第四章萬象洞天入口"
        - name: 鐵鏡心推薦信
          type: 劇情物品
          source: "幫六扇門後獲得"
        - name: 聲望+2
          type: 聲望
      breakthrough:
        to_realm: 第三境·融會貫通
        xp_requirement: "累計 ≥ 70 經驗值（XP）"
        martial_requirement: "正宗心法以上，掌握至少 5 種武功"
        story_lock: "領悟「武道真意」——理解江湖不只是比武"
        rewards: "屬性+3（單項最多+2）；真氣境界+6；上限至 7；同境以下關鍵檢定優勢骰（每場景2次）；「見微知著」識武+2"
      foreshadow:
        - text: "血月教北境計劃"
          points_to: "第五-六章"
        - text: "千機閣知萬象洞天（閣老符號）"
          points_to: 第四章

- section: 2.7 Monster Random Management Abilities ⭐ > Ability Upgrade Mechanism > Upgrade Paths (Four Routes)
  headers:
  - route
  - condition
  - cost
  - effect
  rows:
  - route: '**🟢 Training Ground Polish**'
    condition: Monster completes training at the training ground (base = 4 rounds / enhanced = 8 rounds / expert = 16 rounds)
    cost: Training ground Lv2+ (enhanced), Lv3 (expert); each training costs ◆×(3/6/12)
    effect: Ability upgraded 1 tier
  - route: '**🟡 Combat Evolution**'
    condition: Monster participates in ≥3 battles total (normal→enhanced) or ≥10 battles + kills a Boss (enhanced→expert)
    cost: Auto-triggered. Monster must survive
    effect: Ability upgraded 1 tier + gains "Veteran" trait (Loyalty (LOY)+1)
  - route: '**🟠 Archetype-Specific Catalysis**'
    condition: Specific archetypes can catalyze corresponding monster upgrades — Necromancer Lord→undead monsters / Demon→demon monsters / Wizard→mutant creatures / Dragon→dragon-kind / Shadow→shadow monsters / Goblin→constructs
    cost: Cost ◇×3 + ●×1 (normal→enhanced) or ◇×5 + ●×3 (enhanced→expert)
    effect: Ability upgraded 1 tier, and reroll once on d66 (may keep original ability or pick new)
  - route: '**🔴 Abyssal Blessing**'
    condition: Triggered by special GM event. E.g. Abyssal mana tide / Nexis whisper / ancient artifact activation
    cost: GM adjudication
    effect: Ability directly upgraded to Expert Tier (skips Enhanced), may carry extra positive mutation
- section: 2.7 Monster Random Management Abilities ⭐ > Ability Upgrade Mechanism > Legendary / Elite Monster Exclusive
  headers:
  - monster_tier
  - ability_slots
  - upgrade_method
  rows:
  - monster_tier: Normal (ML1-2)
    ability_slots: 1 slot, Normal Tier
    upgrade_method: Can be tiered up via the four routes
  - monster_tier: Elite (ML3-4)
    ability_slots: 2 slots (2nd slot needs extra unlock)
    upgrade_method: Starts with 1 Enhanced-Tier slot. 2nd slot unlockable via training (cost ◆×15)
  - monster_tier: Legendary (ML5+)
    ability_slots: 2 slots, Expert Tier
    upgrade_method: Starts with 1 Expert-Tier slot. 3rd slot unlockable via Abyssal Blessing

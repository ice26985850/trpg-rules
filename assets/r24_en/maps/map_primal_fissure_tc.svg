<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 900" font-family="Georgia, serif">
  <rect width="680" height="900" fill="#0a0a15"/>
  <rect x="20" y="20" width="640" height="860" rx="8" fill="#15152a" stroke="#4444aa" stroke-width="2"/>
  
  <rect x="20" y="20" width="640" height="60" fill="#050510" opacity="0.8"/>
  <text x="340" y="58" text-anchor="middle" font-size="22" font-weight="bold" fill="#6666cc" font-family="Georgia, serif">Primal Fissure — Awakening of the Mother of the Abyss</text>
  <text x="340" y="75" text-anchor="middle" font-size="12" fill="#4444aa" font-family="Georgia, serif">§5.6.1 · Lv14+ · Final Chapter, Act 15 · Forbidden Zone</text>
  
  <defs>
    <radialGradient id="voidGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6666cc" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#15152a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  <ellipse cx="340" cy="450" rx="280" ry="280" fill="url(#voidGlow)" opacity="0.3"/>
  <rect x="40" y="100" width="600" height="760" rx="4"/>
  
  <!-- Fissure Crack -->
  <path d="M340 100 Q300 200 340 300 Q380 400 340 500 Q300 600 340 700 Q360 800 340 860" 
        stroke="#6666cc" stroke-width="8" fill="none" opacity="0.8"/>
  <path d="M340 100 Q330 200 340 300 Q350 400 340 500 Q330 600 340 700 Q345 800 340 860" 
        stroke="#aaaaff" stroke-width="2" fill="none" opacity="0.9"/>
  
  <!-- Branch Cracks -->
  <path d="M340 300 Q280 280 200 300" stroke="#6666cc" stroke-width="3" fill="none" opacity="0.5"/>
  <path d="M340 400 Q400 380 480 400" stroke="#6666cc" stroke-width="3" fill="none" opacity="0.5"/>
  <path d="M340 550 Q280 530 200 560" stroke="#6666cc" stroke-width="3" fill="none" opacity="0.5"/>
  <path d="M340 650 Q400 630 480 650" stroke="#6666cc" stroke-width="3" fill="none" opacity="0.5"/>
  
  <!-- Consciousness Node -->
  <circle cx="340" cy="450" r="50" fill="#15152a" stroke="#6666cc" stroke-width="3"/>
  <circle cx="340" cy="450" r="35" fill="#2222aa" opacity="0.3"/>
  <text x="340" y="445" text-anchor="middle" font-size="24">🌀</text>
  <text x="340" y="465" text-anchor="middle" font-size="11" fill="#aaaaee" font-weight="bold">Consciousness of Nexis</text>
  
  <!-- Influence Zones -->
  <circle cx="340" cy="450" r="100" fill="none" stroke="#4444aa" stroke-width="1" stroke-dasharray="6,4" opacity="0.4"/>
  <circle cx="340" cy="450" r="160" fill="none" stroke="#4444aa" stroke-width="1" stroke-dasharray="6,4" opacity="0.3"/>
  <circle cx="340" cy="450" r="220" fill="none" stroke="#4444aa" stroke-width="1" stroke-dasharray="6,4" opacity="0.2"/>
  
  <!-- Ritual Circles -->
  <circle cx="200" cy="250" r="20" fill="none" stroke="#4444aa" stroke-width="1" opacity="0.4"/>
  <text x="200" y="253" text-anchor="middle" font-size="10" fill="#6666cc">Altar 1</text>
  <circle cx="480" cy="350" r="20" fill="none" stroke="#4444aa" stroke-width="1" opacity="0.4"/>
  <text x="480" y="353" text-anchor="middle" font-size="10" fill="#6666cc">Altar 2</text>
  <circle cx="200" cy="650" r="20" fill="none" stroke="#4444aa" stroke-width="1" opacity="0.4"/>
  <text x="200" y="653" text-anchor="middle" font-size="10" fill="#6666cc">Altar 3</text>
  <circle cx="480" cy="750" r="20" fill="none" stroke="#4444aa" stroke-width="1" opacity="0.4"/>
  <text x="480" y="753" text-anchor="middle" font-size="10" fill="#6666cc">Altar 4</text>
  
  <!-- Annotations -->
  <rect x="50" y="120" width="260" height="180" rx="5" fill="#15152a" stroke="#4444aa" stroke-width="1"/>
  <text x="65" y="140" font-size="11" fill="#6666cc" font-weight="bold">📍 Scenario Use Notes</text>
  <text x="65" y="158" font-size="10" fill="#8888bb">• Act 4-7 Breath of Nexis</text>
  <text x="65" y="175" font-size="10" fill="#8888bb">• Mana Tide Anomaly Event</text>
  <text x="65" y="192" font-size="10" fill="#8888bb">• Act 15: Awakening of Nexis</text>
  <text x="65" y="209" font-size="10" fill="#8888bb">• Triple Check Ending</text>
  
  <rect x="370" y="120" width="260" height="180" rx="5" fill="#15152a" stroke="#4444aa" stroke-width="1"/>
  <text x="385" y="140" font-size="11" fill="#6666cc" font-weight="bold">⚙ Feature Notes</text>
  <text x="385" y="158" font-size="10" fill="#8888bb">• The Fissure is a Passage to the Abyssal Core</text>
  <text x="385" y="175" font-size="10" fill="#8888bb">• Erratic Mana; High Risk of Room Failure</text>
  <text x="385" y="192" font-size="10" fill="#8888bb">• All Dungeons' Mana Crystals Resonate</text>
  <text x="385" y="209" font-size="10" fill="#8888bb">• Only Approachable at Lv14+</text>
  
  <!-- Legend -->
  <rect x="50" y="340" width="580" height="60" rx="5" fill="#15152a" stroke="#4444aa" stroke-width="1"/>
  <text x="65" y="360" font-size="11" fill="#6666cc">Legend:</text>
  <path d="M150 357 Q160 352 170 357" stroke="#6666cc" stroke-width="3" fill="none"/>
  <text x="175" y="362" font-size="10" fill="#8888bb">Primal Fissure</text>
  <circle cx="270" cy="357" r="5" fill="#15152a" stroke="#4444aa" stroke-width="1"/>
  <text x="283" y="362" font-size="10" fill="#8888bb">Influence Ring</text>
  <circle cx="395" cy="357" r="5" fill="#2222aa" opacity="0.3" stroke="#6666cc" stroke-width="1"/>
  <text x="408" y="362" font-size="10" fill="#8888bb">Ritual Altar</text>
  
  <!-- Quote -->
  <rect x="50" y="420" width="580" height="40" rx="5" fill="#15152a" stroke="#4444aa" stroke-width="1"/>
  <text x="340" y="445" text-anchor="middle" font-size="10" fill="#8888bb" font-style="italic">
    "My children—what have you made of my Underworld?"
  </text>
  
  <!-- Compass -->
  <g transform="translate(600, 770)">
    <circle r="30" fill="#15152a" stroke="#4444aa" stroke-width="1"/>
    <line x1="0" y1="-25" x2="0" y2="-10" stroke="#6666cc" stroke-width="2"/>
    <text y="-28" text-anchor="middle" font-size="10" fill="#6666cc">North</text>
  </g>
</svg>

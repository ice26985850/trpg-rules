<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 900" font-family="Georgia, serif">
  <rect width="680" height="900" fill="#151020"/>
  <rect x="20" y="20" width="640" height="860" rx="8" fill="#1a1530" stroke="#6655aa" stroke-width="2"/>
  
  <rect x="20" y="20" width="640" height="60" fill="#0a0515" opacity="0.8"/>
  <text x="340" y="58" text-anchor="middle" font-size="22" font-weight="bold" fill="#7766cc" font-family="Georgia, serif">Dark Halls Maze — Shadow Council</text>
  <text x="340" y="75" text-anchor="middle" font-size="12" fill="#5544aa" font-family="Georgia, serif">§5.6.3 NPC Dungeon #3 · Shadow Network Founder · Lv6</text>
  
  <defs>
    <pattern id="shadowGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="none" stroke="#2a2540" stroke-width="0.3"/>
    </pattern>
  </defs>
  <rect x="40" y="100" width="600" height="760" fill="url(#shadowGrid)" rx="4"/>
  
  <!-- Central Hub -->
  <circle cx="340" cy="450" r="60" fill="#1a1530" stroke="#7766cc" stroke-width="3"/>
  <text x="340" y="445" text-anchor="middle" font-size="28">🕸</text>
  <text x="340" y="470" text-anchor="middle" font-size="12" fill="#ccbbdd" font-weight="bold">Shadow Core</text>
  
  <!-- Maze Corridors -->
  <path d="M340 390 L340 300 L250 200 L250 130" stroke="#5544aa" stroke-width="4" fill="none" opacity="0.7"/>
  <path d="M340 390 L430 300 L530 200 L530 130" stroke="#5544aa" stroke-width="4" fill="none" opacity="0.7"/>
  <path d="M340 510 L250 600 L150 700 L150 770" stroke="#5544aa" stroke-width="4" fill="none" opacity="0.7"/>
  <path d="M340 510 L430 600 L530 700 L530 770" stroke="#5544aa" stroke-width="4" fill="none" opacity="0.7"/>
  <path d="M250 200 L430 300" stroke="#443388" stroke-width="2" fill="none" opacity="0.4" stroke-dasharray="6,4"/>
  <path d="M250 600 L430 510" stroke="#443388" stroke-width="2" fill="none" opacity="0.4" stroke-dasharray="6,4"/>
  
  <!-- Chambers -->
  <rect x="80" y="100" width="140" height="60" rx="8" fill="#1a1530" stroke="#5544aa" stroke-width="2"/>
  <text x="150" y="128" text-anchor="middle" font-size="11" fill="#ccbbdd">Information Vault</text>
  <text x="150" y="145" text-anchor="middle" font-size="9" fill="#9988bb">Highest Quality Intelligence</text>
  
  <rect x="460" y="100" width="140" height="60" rx="8" fill="#1a1530" stroke="#5544aa" stroke-width="2"/>
  <text x="530" y="128" text-anchor="middle" font-size="11" fill="#ccbbdd">Shadow Carrier Pigeon Tower</text>
  <text x="530" y="145" text-anchor="middle" font-size="9" fill="#9988bb">Intelligence Relay</text>
  
  <rect x="80" y="710" width="140" height="60" rx="8" fill="#1a1530" stroke="#5544aa" stroke-width="2"/>
  <text x="150" y="738" text-anchor="middle" font-size="11" fill="#ccbbdd">Disguise Workshop</text>
  <text x="150" y="755" text-anchor="middle" font-size="9" fill="#9988bb">Transformation Items / CUN+1</text>
  
  <rect x="460" y="710" width="140" height="60" rx="8" fill="#1a1530" stroke="#5544aa" stroke-width="2"/>
  <text x="530" y="738" text-anchor="middle" font-size="11" fill="#ccbbdd">Secret Archive</text>
  <text x="530" y="755" text-anchor="middle" font-size="9" fill="#9988bb">All NPC Secret Files</text>
  
  <!-- Annotations -->
  <rect x="50" y="400" width="260" height="110" rx="5" fill="#1a1530" stroke="#5544aa" stroke-width="1"/>
  <text x="65" y="420" font-size="11" fill="#7766cc" font-weight="bold">📍 Scenario Use Notes</text>
  <text x="65" y="438" font-size="10" fill="#aa99cc">• Act 2-4 Shadow Network Initiation</text>
  <text x="65" y="455" font-size="10" fill="#aa99cc">• Act 4 Intelligence Sharing Treaty</text>
  
  <rect x="370" y="400" width="260" height="110" rx="5" fill="#1a1530" stroke="#5544aa" stroke-width="1"/>
  <text x="385" y="420" font-size="11" fill="#7766cc" font-weight="bold">⚙ Feature Notes</text>
  <text x="385" y="438" font-size="10" fill="#aa99cc">• Maze Walls Move on Their Own</text>
  <text x="385" y="455" font-size="10" fill="#aa99cc">• Diplomatic Attitude: Neutral-Leaning Friendly (+2)</text>
  
  <!-- Legend -->
  <rect x="50" y="550" width="580" height="60" rx="5" fill="#1a1530" stroke="#5544aa" stroke-width="1"/>
  <text x="65" y="570" font-size="11" fill="#7766cc">Legend:</text>
  <line x1="150" y1="567" x2="180" y2="567" stroke="#5544aa" stroke-width="2"/>
  <text x="185" y="572" font-size="10" fill="#aa99cc">Main Passage</text>
  <line x1="260" y1="567" x2="290" y2="567" stroke="#443388" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="295" y="572" font-size="10" fill="#aa99cc">Maze Detour</text>
  
  <!-- Compass -->
  <g transform="translate(600, 770)">
    <circle r="30" fill="#1a1530" stroke="#5544aa" stroke-width="1"/>
    <line x1="0" y1="-25" x2="0" y2="-10" stroke="#7766cc" stroke-width="2"/>
    <text y="-28" text-anchor="middle" font-size="10" fill="#7766cc">North</text>
  </g>
</svg>

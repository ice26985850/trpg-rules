<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 900" font-family="Georgia, serif">
  <rect width="680" height="900" fill="#1a1520"/>
  <rect x="20" y="20" width="640" height="860" rx="8" fill="#2a2535" stroke="#5a5070" stroke-width="2"/>
  
  <rect x="20" y="20" width="640" height="60" fill="#15121a" opacity="0.8"/>
  <text x="340" y="58" text-anchor="middle" font-size="22" font-weight="bold" fill="#9988cc" font-family="Georgia, serif">Eternal Corridor — City of the Undead</text>
  <text x="340" y="75" text-anchor="middle" font-size="12" fill="#776699" font-family="Georgia, serif">§5.6.3 NPC Dungeon #1 · Bone Mound Council Founder · Lv8</text>
  
  <defs>
    <pattern id="boneGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="none" stroke="#3a3545" stroke-width="0.3"/>
    </pattern>
  </defs>
  <rect x="40" y="100" width="600" height="760" fill="url(#boneGrid)" rx="4"/>
  
  <!-- Spiral Bone Corridor -->
  <path d="M340 450 Q280 350 340 250 Q400 150 460 250 Q520 350 460 450 Q400 550 340 450" 
        fill="none" stroke="#8877aa" stroke-width="3" opacity="0.7"/>
  <path d="M340 450 Q280 370 340 290 Q400 210 440 290 Q480 370 440 450 Q400 530 340 450"
        fill="none" stroke="#7766aa" stroke-width="6" stroke-dasharray="12,4"/>
  
  <!-- Central Bone Chamber -->
  <circle cx="340" cy="450" r="50" fill="#2a2535" stroke="#9988bb" stroke-width="3"/>
  <text x="340" y="445" text-anchor="middle" font-size="28">💀</text>
  <text x="340" y="470" text-anchor="middle" font-size="12" fill="#ccbbdd" font-weight="bold">White Bone Hall</text>
  
  <!-- Side Chambers -->
  <rect x="120" y="200" width="100" height="70" rx="8" fill="#2a2535" stroke="#7766aa" stroke-width="2"/>
  <text x="170" y="235" text-anchor="middle" font-size="11" fill="#ccbbdd">Skeleton Barracks</text>
  <text x="170" y="250" text-anchor="middle" font-size="9" fill="#9988bb">CP1/MV1</text>
  <text x="170" y="263" text-anchor="middle" font-size="9" fill="#7766aa">Free Maintenance</text>
  
  <rect x="460" y="200" width="100" height="70" rx="8" fill="#2a2535" stroke="#7766aa" stroke-width="2"/>
  <text x="510" y="235" text-anchor="middle" font-size="11" fill="#ccbbdd">Bone Pigeon Tower</text>
  <text x="510" y="250" text-anchor="middle" font-size="9" fill="#9988bb">Instant Communication</text>
  <text x="510" y="263" text-anchor="middle" font-size="9" fill="#7766aa">Intelligence Dispatch</text>
  
  <rect x="80" y="380" width="100" height="70" rx="8" fill="#2a2535" stroke="#7766aa" stroke-width="2"/>
  <text x="130" y="415" text-anchor="middle" font-size="11" fill="#ccbbdd">Soul Furnace</text>
  <text x="130" y="430" text-anchor="middle" font-size="9" fill="#9988bb">Manufactures Soul Essence</text>
  <text x="130" y="443" text-anchor="middle" font-size="9" fill="#7766aa">●Output</text>
  
  <rect x="500" y="380" width="100" height="70" rx="8" fill="#2a2535" stroke="#7766aa" stroke-width="2"/>
  <text x="550" y="415" text-anchor="middle" font-size="11" fill="#ccbbdd">Tombstone Archive</text>
  <text x="550" y="430" text-anchor="middle" font-size="9" fill="#9988bb">Records the Lives of the Dead</text>
  <text x="550" y="443" text-anchor="middle" font-size="9" fill="#7766aa">INF+2 Source</text>
  
  <rect x="100" y="560" width="120" height="70" rx="8" fill="#2a2535" stroke="#8877cc" stroke-width="2"/>
  <text x="160" y="595" text-anchor="middle" font-size="11" fill="#ccbbdd">Fallen Temple</text>
  <text x="160" y="610" text-anchor="middle" font-size="9" fill="#9988bb">Death Knight Garrison</text>
  <text x="160" y="623" text-anchor="middle" font-size="9" fill="#7766aa">CP4 elite</text>
  
  <rect x="460" y="560" width="120" height="70" rx="8" fill="#2a2535" stroke="#8877cc" stroke-width="2"/>
  <text x="520" y="595" text-anchor="middle" font-size="11" fill="#ccbbdd">Royal Mausoleum</text>
  <text x="520" y="610" text-anchor="middle" font-size="9" fill="#9988bb">Malthus's Residence</text>
  <text x="520" y="623" text-anchor="middle" font-size="9" fill="#7766aa">VIP Area</text>
  
  <!-- Connecting Passages -->
  <path d="M220 235 L280 250" stroke="#5a5070" stroke-width="2"/>
  <path d="M460 235 L400 250" stroke="#5a5070" stroke-width="2"/>
  <path d="M180 415 L290 420" stroke="#5a5070" stroke-width="2"/>
  <path d="M500 415 L390 420" stroke="#5a5070" stroke-width="2"/>
  <path d="M160 450 L160 560" stroke="#5a5070" stroke-width="2"/>
  <path d="M520 450 L520 560" stroke="#5a5070" stroke-width="2"/>
  
  <!-- Annotations -->
  <rect x="50" y="680" width="260" height="110" rx="5" fill="#2a2535" stroke="#5a5070" stroke-width="1"/>
  <text x="65" y="700" font-size="11" fill="#9988cc" font-weight="bold">📍 Scenario Use Notes</text>
  <text x="65" y="718" font-size="10" fill="#aa99bb">• Act 2-2 First Letter Delivered</text>
  <text x="65" y="735" font-size="10" fill="#aa99bb">• Act 4 Bone Mound Council Diplomacy</text>
  <text x="65" y="752" font-size="10" fill="#aa99bb">• Bone Mound Ruins Side Quest</text>
  
  <rect x="370" y="680" width="260" height="110" rx="5" fill="#2a2535" stroke="#5a5070" stroke-width="1"/>
  <text x="385" y="700" font-size="11" fill="#9988cc" font-weight="bold">⚙ Feature Notes</text>
  <text x="385" y="718" font-size="10" fill="#aa99bb">• Traits: Efficient, Orderly, Bone Pigeon Communication</text>
  <text x="385" y="735" font-size="10" fill="#aa99bb">• Weakness: Vulnerable to Holy Light / Daylight</text>
  <text x="385" y="752" font-size="10" fill="#aa99bb">• Diplomatic Attitude: Neutral (0) → Friendly +3</text>
  
  <!-- Legend -->
  <rect x="50" y="820" width="580" height="40" rx="5" fill="#2a2535" stroke="#5a5070" stroke-width="1"/>
  <text x="65" y="840" font-size="11" fill="#9988cc">Legend:</text>
  <rect x="130" y="832" width="12" height="12" fill="#2a2535" stroke="#7766aa" stroke-width="1"/>
  <text x="150" y="842" font-size="10" fill="#aa99bb">Main Passage</text>
  <rect x="220" y="832" width="12" height="12" fill="#2a2535" stroke="#8877cc" stroke-width="1"/>
  <text x="240" y="842" font-size="10" fill="#aa99bb">Important Area</text>
  
  <!-- Compass -->
  <g transform="translate(600, 770)">
    <circle r="30" fill="#2a2535" stroke="#5a5070" stroke-width="1"/>
    <line x1="0" y1="-25" x2="0" y2="-10" stroke="#9988cc" stroke-width="2"/>
    <text y="-28" text-anchor="middle" font-size="10" fill="#9988cc">North</text>
  </g>
</svg>

# ═══════════════════════════════════════════════════════════
# Side Quests & Commission System
# ═══════════════════════════════════════════════════════════
sidequests:
  description: "Every 3 turns provides 1 optional commission / side quest. Players may choose to execute or ignore it."

  quests:
    - id: "sq1"
      name: "Vein Prospecting"
      trigger: "After first discovering a vein while digging, or every 5 turns"
      description: "Signs of a suspected rare vein discovered deep in the dungeon"
      checks:
        - "IND + Mining check vs Difficulty 2 success"
      reward_success: "Extra minerals ×2 + possible ancient alloy discovery (◆×3)"
      reward_failure: "Collapse risk — lose Building Materials ×2, but may discover ancient ruins"

    - id: "sq2"
      name: "Fugitive Recapture"
      trigger: "1~3 turns after a captive escapes"
      description: "The escaped adventurer Mira returns with a squad for revenge, but you once let some captives slip away before capture"
      checks:
        - "WAR + Tracking check vs Difficulty 3"
      reward_success: "Recapture the escapee (Loyalty LOY+1, extra +2 EXP)"
      reward_failure: "Fugitive passes dungeon intel to the surface (next invasion intensity +1 Tier)"

    - id: "sq3"
      name: "Ancient Ruins Exploration"
      trigger: "Digging die d6=6 (ancient ruins found) or every 8 turns"
      description: "An ancient ruin discovered in the depths — possibly the remains of a prior civilization"
      checks:
        - "Arcana ARC + Archaeology check vs Difficulty 3"
        - "CUN + Stealth check vs Difficulty 2 (prevent triggering traps)"
      reward_success: "Gain ancient equipment (permanent +1 attribute or one-time special item)"
      reward_failure: "Release an ancient evil spirit (triggers a special invasion, but grants massive EXP on defeat)"

    - id: "sq4"
      name: "Intra-Alliance Mediation"
      trigger: "Every 4~6 turns after choosing an alliance in Act Two"
      description: "A member within your alliance has a conflict requiring your mediation"
      checks:
        - "DOM + Diplomacy check vs Difficulty 2~4 (depending on conflict severity)"
      reward_success: "Intra-alliance relations improve, allied reinforcement strength +50%"
      reward_failure: "Alliance relations damaged (next invasion allied reinforcement count -1)"

    - id: "sq5"
      name: "Underground River Expedition"
      trigger: "Digging die d6=5 (underground lake found)"
      description: "You dug to an underground lake — it may hide secrets, or lead to the unknown Abyss"
      checks:
        - "CUN + Sailing check vs Difficulty 2 (control a small boat)"
        - "WAR + Swimming check vs Difficulty 1 (avoid drowning)"
      reward_success: "Discover ancient dock ruins (permanently unlock water transport, monster movement +1 die)"
      reward_failure: "Underground lake collapses (floods the room, unusable for 1 turn)"

    - id: "sq6"
      name: "Black Market Trade Opportunity"
      trigger: "Auto-offered every 2 turns"
      description: "A passing merchant passes through your dungeon, bringing exotic goods from afar"
      checks:
        - "None (pure economic transaction)"
      details: "Merchant offers 1~3 items, priced at 70~130% of market (depending on player diplomacy)"
      reward: "Purchase grants a permanent buff or one-time tactical item"

    - id: "sq7"
      name: "Monster Evolution Engineering"
      trigger: "After owning any elite / legendary monster"
      description: "You may choose to evolve a specific monster — making it stronger but more resource-hungry"
      checks:
        - "Arcana ARC + Evolution check vs Difficulty 3"
      reward_success: "Monster CP+2 or Management Value (MV)+2 (permanent)"
      reward_failure: "Monster goes berserk (Loyalty LOY-2, may need to spend resources to suppress)"

    - id: "sq8"
      name: "Diplomatic Envoy"
      trigger: "Every 4 turns after relationship with any NPC dungeon reaches ≥5"
      description: "A certain NPC dungeon lord sends an envoy seeking secret cooperation"
      secret_agreements:
        - "Intel exchange (each turn gain +1 turn early warning of next invasion's intel)"
        - "Resource complementarity (both sides contribute part of shared minerals or magical resources)"
        - "Military alliance (auto-dispatch reinforcements when invaded, but bears certain risk)"


new_mechanics_introduced:
  - 垂直多層競技場（五層環形結構）
  - 全冠軍級敵方（無低級別敵人）
  - 觀眾投票系統（場地陷阱由外部操控）
  - 潘多拉高管現場觀戰（壓力值強制累積）

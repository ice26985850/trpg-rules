enemy_configuration:
  total_champions: 5  # 全冠軍級——無菜鳥、穩健、突擊
  description: >
    五位傳奇冠軍——每一位都有故事、都有代號、都有從未失敗的紀錄。
    他們不是隨機生成的敵人——他們是潘多拉為你精心挑選的對手。
  champions:
    - { id: C1, name: 「堡壘」, style: 防禦型冠軍,
        weapon: M249輕機槍 + 三級護甲 + 三級頭盔, strength: 9/10,
        special: 不可被擊退。壓制射擊範圍加倍。弱點：移動極慢 }
    - { id: C2, name: 「幻影」, style: 隱匿型冠軍,
        weapon: 消音Vector + 煙霧彈×6 + 戰術匕首, strength: 9/10,
        special: 每回合可用附贈動作隱匿（DC18察覺才能發現）。弱點：HP較低 }
    - { id: C3, name: 「颶風」, style: 突擊型冠軍,
        weapon: AKM + 腎上腺素×3 + 手榴彈×5, strength: 10/10,
        special: 腎上腺素無副作用。每場遭遇可衝鋒一次（移動+近戰同時）。弱點：衝動——會被誘餌吸引 }
    - { id: C4, name: 「紅狐」, style: 狙擊型冠軍,
        weapon: AWM + 8倍鏡 + 消音器, strength: 10/10,
        special: 可在移動後仍進行瞄準射擊。弱點：近距離無力——手槍只有P92 }
    - { id: C5, name: 「死神」, style: 全能型冠軍（最終Boss）,
        weapon: 自訂傳奇級M416(滿配) + 沙漠之鷹, strength: 11/10,
        special: "25場勝利。他能預判你的每一步。當玩家生命值低於50%時，他會放慢節奏——不是仁慈，是享受。弱點：傲慢。他會給你機會——因為他太想證明沒人能打敗他。當你做出他完全沒預料到的行動時（GM判斷），他下一回合攻擊劣勢" }

nemesis:
  name: 「死神」
  full_name: 未知（潘多拉檔案中已刪除）
  style: 傳奇冠軍——全能型
  strength: 11/10
  weapon: 傳奇級M416(滿配) + 沙漠之鷹
  armor: 三級頭盔 + 三級護甲
  backstory: >
    25勝0敗。這個紀錄在潘多拉的歷史上從未有人接近過。
    他參加比賽不是為了錢——他自己的獎金已經多到他從未領取過。
    他參賽是因為這是他唯一感覺到自己活著的時刻。

    他的檔案中有一行備註——潘多拉心理分析師寫的：
    「受試者表現出對『挑戰感』的病態渴望。建議不要安排過弱的對手——
    他會覺得被侮辱，然後變得不可預測。」

    他聽說了你。他看了你的每一場比賽錄像。
    你是他等了很多年的人——一個可能真正擊敗他的人。
    他不會讓你失望的。希望你也不會讓他失望。

circle:
  type: 垂直收束
  description: >
    圈型從頂層開始向下收縮——強制所有冠軍逐層下降。
    每兩圈，安全區向下移動一層。
    最終圈在中央鬥技場——最底層的開闊空間。
    沒有掩體。沒有退路。只有兩個傳奇——和全潘多拉的高管在看著。

  timeline:
    - { phase: 第一圈, zone: [全景控制室+叢林穹頂(第四-五層)], diameter: 1.5km, countdown: 5回合 }
    - { phase: 第二圈, zone: [叢林穹頂+住宅區(第三-四層)], diameter: 1.0km, countdown: 4回合 }
    - { phase: 第三圈, zone: [住宅區+工廠迷宮(第二-三層)], diameter: 0.6km, countdown: 3回合 }
    - { phase: 第四圈, zone: [工廠迷宮(第二層)], diameter: 0.3km, countdown: 2回合 }
    - { phase: 最終圈, zone: [中央鬥技場(底層)], diameter: 0.05km, countdown: 1回合 }

phases:
  - phase: 邀請
    turns: 0（開場）
    gm_notes: >
      這不是跳傘——這是一場秀。玩家被專車接到競技場。
      走過一條長長的走廊——兩側是歷屆冠軍的全息投影。
      走廊盡頭——一扇門。門上刻著一行字：
      「在此門之後，傳奇誕生——或終結。」

      潘多拉CEO的聲音透過全場廣播：
      「各位貴賓——歡迎來到第47屆傳奇邀請賽。
      今晚的挑戰者是——（你的代號）。
      而他將面對的是——五位從未失敗過的冠軍。
      誰會站到最後？讓我們——開始。」

  - phase: 第一滴血
    turns: 3-4
    gm_notes: >
      五位冠軍各自降落（或入場）在不同層。
      玩家從第三層（住宅區）開始——中性地帶，有時間適應。
      第一個遭遇應該是「幻影」或「堡壘」——
      讓玩家感受冠軍級對手的壓力，但不至於被秒殺。
      重點：讓玩家意識到「這不是普通的敵人——他們的AI是認真的」。

  - phase: 垂直追逐
    turns: 5-6
    gm_notes: >
      圈開始向下收縮。冠軍們開始移動。
      這是垂直戰鬥的核心段落：
      - 玩家可能在樓梯間遇到「颶風」衝上來
      - 「紅狐」可能從上層的窗戶狙擊正在攀爬外牆的玩家
      - 「堡壘」可能佔據了必經的電梯井底部——像一座無法繞過的塔

      利用垂直空間創造張力——「你聽到頭頂有腳步聲——
      但電梯井的回音讓你無法判斷是上一層還是上兩層。」

  - phase: 觀眾壓力
    turns: 3-4
    gm_notes: >
      潘多拉高管開始使用「觀眾投票」系統——
      他們可以投票決定下一個場地陷阱的類型和位置。
      GM宣布：「螢幕上閃過一行字——觀眾投票：火焰噴射器，第三象限。」
      這給玩家預警——但也增加了壓力。

      利用廣播系統播放「死神」對玩家的評論：
      「你知道嗎——他在上一場比賽中換了武器。為什麼？
      因為他害怕了。害怕用自己最熟悉的槍——
      因為那把槍讓他想起某個人。」

  - phase: 最終圈——你與死神
    turns: 3-5
    gm_notes: >
      中央鬥技場。所有其他冠軍已被淘汰或圈外傷害帶走。
      只剩下你和死神。

      鬥技場的燈光聚焦在你們身上。
      潘多拉高管們從全景控制室向下看。
      全場寂靜。

      死神開口了：
      「二十五場。你是我見過的第三個走到這一步的人。
      前兩個——都在這裡倒下了。你知道為什麼嗎？
      不是因為我比他們強——是因為他們太想贏了。
      你呢？你為什麼在這裡？」

      給玩家一個選擇：
      A. 「為了自由。」（進行說服對抗——可能讓死神猶豫）
      B. 「為了打敗你。」（直接進入戰鬥——但死神對你的尊重+1）
      C. 「我不知道。」（最誠實的回答——死神會笑，然後說「這是我聽過最好的答案。」）

      然後——決鬥開始。最終圈無安全區。6d4/回合。
      不是槍法的對決——是兩個傳奇的意志之爭。

  - phase: 結局
    turns: 0（後日談）
    gm_notes: >
      取決於結果：

      **玩家獲勝：**
      死神倒下。全場沉默三秒——然後爆發出雷鳴般的掌聲。
      潘多拉CEO的聲音：「女士們先生們——新的傳奇。」
      控制室的門打開了。他們遞給你一份文件——永久除名協議。
      你簽了字。然後走出競技場——陽光灑在臉上。自由。

      **玩家落敗：**
      死神站在你旁邊——他沒有補槍。
      「你比前兩個強。休息一年——然後回來。我等你。」
      螢幕暗下。不是你輸了——是你還不夠強。但你知道他會等你。
      一年後——你會回來的。

victory_condition: 擊敗「死神」——或在他面前證明你的價值


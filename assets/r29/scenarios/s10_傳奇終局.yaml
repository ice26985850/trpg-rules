# 絕地戰場 TRPG — 劇本 S10（單人）：傳奇終局
# 類型：單人
# 建議等級：9-10
# 難度：★★★★★
scenario:
  id: S10
  name: 傳奇終局
  type: solo
  tier: 5
  difficulty: 5
  estimated_duration: 6-8小時
  suggested_level: 9-10

  description: >
    你贏了最後一場。你以為結束了。

    然後那封信來了。

    黑色信封，金色火漆——潘多拉娛樂集團的最高級別邀請函。
    「親愛的冠軍：你的表現在我們的檔案中被標記為『傳奇級』。
    為此，我們誠摯邀請你參加一場私人賽事——
    僅限五位傳奇冠軍，以及你。」

    獎品不是錢——你已經有足夠的錢了。
    獎品是「自由」。潘多拉的永久除名。
    你再也不會收到任何邀請函、威脅信、或「特殊機會」。
    你自由了。

    但對手是五位從未失敗過的傳奇。其中一位——「死神」——
    保持著 25 場勝利的紀錄。
    你覺得你能成為第 26 場嗎？他問。

map:
  name: 天梯競技場
  size: 3公里 × 3公里（垂直多層結構）
  description: >
    潘多拉為這場賽事建造的專屬競技場。
    不是自然的島嶼——是精心設計的殺戮舞台。
    五層環形結構，每層 600m 直徑，層與層之間以垂直通道連接。
    底層是開闊的中央鬥技場——沒有掩體，純粹的對決空間。
    頂層是全景控制室——潘多拉的高管們在那裡觀看。

  terrain_mix:
    底層_中央鬥技場: 20%
    第二層_工廠迷宮: 20%
    第三層_住宅模擬區: 20%
    第四層_叢林穹頂: 20%
    第五層_全景控制室: 10%
    垂直通道: 10%

  special_rules:
    - 垂直戰鬥：五層結構，層間以電梯井、通風管道、外牆攀爬點連接
    - 冠軍試煉：五位敵方全部為冠軍級（★★★★★）。無菜鳥、無穩健——只有傳奇
    - 觀眾系統：潘多拉高管的實況評論透過全場廣播播放——壓力值+1每3回合（不可抵抗）
    - 場地陷阱：中央鬥技場有可遙控的火焰噴射器、電擊地板——GM每5回合啟用一個陷阱（d6決定位置）
    - 最終解放：擊敗死神後，玩家可選擇「離開」或「接管」——不同結局

regions:
  - id: R1
    name: 中央鬥技場（底層）
    terrain: 開闊空間
    loot_level: 無
    nodes: [C3, D3, C4, D4]
    landmark: L1
    special: >
      完全開闊——無任何掩體。外圈有觀眾席（不可進入）。
      四根巨大的鋼柱支撐上層結構——唯一可用的掩體。
      陷阱：火焰噴射器（每5回合從地面噴出，3d8火焰傷害，隨機半徑10m區域）
  - id: R2
    name: 工廠迷宮（第二層）
    terrain: 工業迷宮
    loot_level: 軍用（紫）
    nodes: [B2, C2, D2, B3, C3, D3]
    landmark: L2
    special: >
      狹窄通道、傳送帶、和堆積的貨櫃。視野極度受限——
      每個轉角都可能是決鬥。重型工業噪音掩蓋腳步聲。
      唯一的軍用級物資補給點——但所有冠軍都知道這點。
  - id: R3
    name: 住宅模擬區（第三層）
    terrain: 住宅
    loot_level: 普通（綠）
    nodes: [B4, C4, B5, C5, B6, C6]
    landmark: L3
    special: >
      仿造的公寓和住宅——模擬真實城市環境。
      適合隱匿和伏擊。每個房間都可能有物資——或陷阱。
  - id: R4
    name: 叢林穹頂（第四層）
    terrain: 叢林
    loot_level: 豐富（藍）
    nodes: [D1, E1, D2, E2, F2]
    landmark: L4
    special: >
      人造叢林——真實的樹木、溪流、甚至有人造雨。
      潘多拉的氣候控制系統在此全功率運作。
      茂密的植被提供自然掩體——但也隱藏了蛇和陷阱（GM可加入環境威脅）。
  - id: R5
    name: 全景控制室（頂層）
    terrain: 室內
    loot_level: 無
    nodes: [A1]
    landmark: L5
    special: >
      潘多拉高管的觀戰室。防彈玻璃後——他們在喝香檳。
      玩家可以進入（需要駭客或爆破技能DC18），
      但進入後所有剩餘冠軍會立刻知道你的位置——
      「他在控制室！保護高管！」
  - id: R6
    name: 垂直通道網絡
    terrain: 通道
    loot_level: 無
    nodes: [連接各層]
    special: >
      四種連接方式：
      - 中央電梯井（快速但完全暴露）
      - 外牆攀爬點（體能DC15，隱密）
      - 通風管道（僅能匍匐，隱密但慢）
      - 緊急樓梯（速度中等，半暴露）


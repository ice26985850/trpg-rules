# 絕地戰場 TRPG — 劇本 S8（單人）：孤狼試煉
# 類型：單人
# 建議等級：5-6
# 難度：★★★★☆
scenario:
  id: S8
  name: 孤狼試煉
  type: solo
  tier: 2.5
  difficulty: 4
  estimated_duration: 4-5小時
  suggested_level: 5-6

  description: >
    你不再是菜鳥了。你在三場比賽中活了下來——這本身就是一種成就。
    但也意味著你現在是「值錢的獵物」。

    賞金獵人們會收到一份名單——存活超過三場比賽的參賽者，
    每個都有標價。你的名字在上面。你的代號在上面。
    附帶了一張你在上一場比賽中的照片——你自己都不知道被拍了。

    廢棄的工業園區是你的舞台。十六個孤狼——至少一半是衝著你來的。
    你不是獵人。你是獵物。但你還沒打算束手就擒。

map:
  name: 鐵鏽帶工業園區
  size: 5公里 × 5公里
  terrain_mix: { 廢棄工廠: 40%, 化工區: 20%, 鐵路調度場: 15%, 工人宿舍區: 15%, 汙染河道: 10% }
  description: >
    曾是這座城市的心臟——數千人在這裡工作。戰爭後被廢棄。
    生鏽的管線、倒塌的廠房、和散落各處的化學桶。
    有些桶子還在漏——你不知道裡面是什麼，但聞起來像死亡。
  special_rules:
    - 賞金獵人系統：本劇本中，30%的敵方孤狼為「賞金獵人」——他們會主動追蹤玩家
    - 化學汙染區：化工區每回合進行體能DC14檢定，失敗承受1d6毒素傷害（無視護甲）
    - 無人機巡邏：每5回合，GM宣布無人機飛過。被無人機掃到＝位置暴露給所有賞金獵人
    - 工業掩體：重型鋼結構提供+5 DC掩體加成，但部分結構不穩定（5%機率崩塌，3d6碾壓傷害）

regions:
  - id: R1
    name: 中央煉鋼廠
    terrain: 重工業
    loot_level: 豐富（藍）
    nodes: [C3, D3, C4, D4]
    landmark: L1
    special: 巨大煉鋼爐提供重型掩體。廢棄的吊車操作室是絕佳狙擊點——但只有一個出入口
  - id: R2
    name: 化工區
    terrain: 危險區
    loot_level: 豐富（藍）
    nodes: [A2, B2, A3, B3]
    landmark: L2
    special: 化學桶洩漏——每回合PHY DC14檢定，失敗1d6毒素傷害。但有軍用級防毒面具可撿（免疫毒素）
  - id: R3
    name: 鐵路調度場
    terrain: 工業
    loot_level: 普通（綠）
    nodes: [E2, F2, E3, F3, E4, F4]
    landmark: L3
    special: 廢棄火車車廂提供線性掩體。可沿車廂頂部快速移動（敏捷DC12，失敗跌落1d6）
  - id: R4
    name: 工人宿舍區
    terrain: 住宅
    loot_level: 普通（綠）
    nodes: [B5, C5, B6, C6]
    landmark: L4
    special: 密集的低層公寓。適合隱匿移動——但賞金獵人知道這點。每個房間都可能是陷阱
  - id: R5
    name: 汙染河道
    terrain: 水域/屏障
    loot_level: 無
    nodes: [D6, E6, F6, G6]
    landmark: L5
    special: 黑色水面——落入水中承受2d6毒素傷害/回合。唯一通道是一座鏽蝕鐵橋（承重有限，載具不可通過）
  - id: R6
    name: 南區倉庫群
    terrain: 工業
    loot_level: 普通（綠）
    nodes: [D1, E1, D2, E2]
    special: 貨櫃迷宮——大量重型掩體，但視野極差。適合近距離伏擊
  - id: R7
    name: 北區發電廠
    terrain: 工業
    loot_level: 軍用（紫）
    nodes: [G3, H3, G4, H4]
    landmark: L6
    special: 全圖最好的物資——但發電機仍在運轉。噪音掩蓋所有腳步聲（聽音範圍-20m）

landmarks:
  - id: L1
    name: 中央煉鋼廠
    buildings:
      - { name: 主廠房, floors: 3, description: 巨大鋼結構建築。廢棄煉鋼爐佔據中心——提供360度全方位掩體 }
      - { name: 吊車操作室, floors: 1, elevation: 20m, description: 懸在半空的操作室——全圖最佳狙擊點。但只有一個爬梯進出。被圍就死定了 }
      - { name: 原料堆場, type: outdoor, description: 廢鋼鐵和礦石堆成的小山——提供不規則掩體 }
  - id: L2
    name: 化工區
    buildings:
      - { name: 化學品倉庫, floors: 1, special: 地板上有不明液體。GM可決定某些區域為燃燒陷阱（碰到明火即爆炸，3d8）}
      - { name: 實驗室大樓, floors: 2, special: 二樓有軍用級防毒面具×2（可拾取）}
    hazard: 汙染區標記——沒有防毒面具時每回合PHY DC14
  - id: L3
    name: 鐵路調度場
    features:
      - 廢棄貨運列車×20節（可作線性掩體或快速移動路線）
      - 調度塔×1（3層，視野覆蓋整個調度場）
      - 維修車庫×1（可能內有載具——摩托車50%機率）
  - id: L4
    name: 工人宿舍區
    buildings:
      - { name: 公寓樓, count: 8, floors: 3-5, description: 密集排列的廢棄公寓。每棟3-5層。內部佈局相似——容易迷路 }
      - { name: 社區中心, floors: 2, description: 曾是工人的食堂和活動中心。一樓大廳適合埋伏 }
    special: 無線電塔位於公寓樓頂（最東側那棟）
  - id: L5
    name: 鏽蝕鐵橋
    features:
      - 唯一跨河通道——必經之路（對於南側安全區而言）
      - 橋長150m，僅供步行（機車勉強可過）
      - 橋面有大量破洞——需要敏捷DC10避免踩空
      - 橋下的河道是死路（汙染水致命）
  - id: L6
    name: 北區發電廠
    buildings:
      - { name: 發電機房, floors: 1, special: 運轉中的巨型發電機。噪音等級極高——所有人聽音範圍-20m。槍聲被噪音掩蓋——消音器在此無意義 }
      - { name: 控制室, floors: 1, special: 隔音玻璃後的安全區域。可俯瞰整個發電機房。軍用級物資存放在此 }
      - { name: 冷卻塔, floors: 1, elevation: 30m, special: 塔頂可俯瞰全北區——但攀爬需PHY DC14 }

enemy_configuration:
  total_lone_wolves: 16  # 加玩家和宿敵共18人
  bounty_hunters: 5  # 30%為賞金獵人
  distribution:
    - type: 菜鳥孤狼
      difficulty: ★
      count: 3
      note: 不構成威脅——但他們可能成為賞金獵人的誘餌
    - type: 穩健孤狼
      difficulty: ★★
      count: 4
      note: 一般參賽者——不會主動追蹤玩家，但會自衛
    - type: 賞金獵人
      difficulty: ★★★
      count: 5
      note: 主動追蹤玩家。知道玩家的名字和上一場比賽的戰術偏好
    - type: 突擊孤狼
      difficulty: ★★★
      count: 2
      note: 聽到槍聲會過來——不針對玩家，但增加混亂
    - type: 職業級狙擊手
      difficulty: ★★★★
      count: 1
      note: 單獨行動的職業級。不拿賞金——只為測試自己。佔據吊車操作室

nemesis:
  name: 薇拉·薩莫伊洛娃
  codename: 「女妖」
  style: 賞金獵人領袖
  strength: 9/10
  weapon: M24狙擊槍 + 消音器 + 8倍鏡 + 沙漠之鷹（近戰）
  armor: 三級頭盔 + 二級護甲
  backstory: >
    賞金獵人的領袖。退役情報軍官——在成為賞金獵人之前，
    她曾在軍隊擔任反狙擊手。她的專長是找到隱藏的人。
    她的記錄：追殺過14個「值錢獵物」——全部成功。

    她辦公室的牆上掛著你的照片。旁邊是你上一場比賽的三張截圖——
    你都不知道自己被拍了。她研究了你的每一個習慣：
    你偏好哪種武器、喜歡高處還是地面、在壓力下是進攻還是防守。

    她在等你犯第一個錯誤。

  special_abilities:
    - 反狙擊訓練：當玩家從同一位置開第二槍時，她自動知道玩家位置
    - 無人機操控：每5回合，她可以派遣無人機掃描一個區域（200m半徑）
    - 誘餌陷阱：她可能在某個房間留下「急救包」——但門後有絆線手榴彈（察覺DC16）

drone_system:
  description: >
    潘多拉娛樂集團在本場比賽中部署了巡邏無人機。
    無人機不是武器——是攝影機。觀眾想看刺激的——他們想看賞金獵人追殺你。
  mechanics:
    - frequency: 每5回合
    - announcement: GM敘述「頭頂傳來嗡嗡聲——無人機。紅色的指示燈在雲層下閃爍。」
    - scan_radius: 200m（以無人機航線為中心）
    - consequence: 被掃到的玩家——位置暴露給所有賞金獵人。他們會在1-3回合內趕到
    - counter: 躲在室內或濃煙中可避免被掃到。破壞無人機需DC18射擊（一發即可，但會暴露自己的位置）
    - note: 無人機在最終圈停止運作（圈太小，無意義）

circle:
  type: 邊緣漂移（偏東南——逼玩家穿越鐵橋或化工區）
  description: >
    圈型緩慢向東南方向移動。最終圈在鐵橋南端或南岸的廢棄倉庫。
    這意味著：北區的玩家必須在第四圈前過橋——而賞金獵人知道這一點。

phases:
  - phase: 賞金公告
    turns: 0（降落前）
    gm_notes: >
      在玩家跳傘之前，給他們一個特殊的開場：
      「運輸機上的廣播系統發出雜音——然後換成一個女聲。
      不是標準的潘多拉播音員。這個聲音更冷、更專業。
      『各位參賽者請注意。潘多拉賞金委員會已將以下參賽者
      列為本場比賽的「高價值目標」。擊殺下列目標的參賽者
      將獲得雙倍獎金。名單如下——』
      你的名字在名單上。你的代號在名單上。
      廣播結束了。運輸機後艙門打開。下面是一片生鏽的灰色。」

  - phase: 第一滴血
    turns: 3-4
    gm_notes: >
      讓玩家降落後立即感受到壓力。賞金獵人不會給搜刮的奢侈。
      第一個賞金獵人在降落後2回合內就會開始追蹤。
      給玩家一個選擇：去化工區拿防毒面具（高風險），
      還是去宿舍區隱匿移動（較安全但物資差）。

      這段時間的重點是建立「被狩獵」的感覺：
      - 遠處的狙擊鏡反光（賞金獵人在找你）
      - 無線電中斷——賞金獵人在干擾通訊
      - 被擊殺的菜鳥身上有名單副本——你的名字被圈起來

  - phase: 無人機遊戲
    turns: 4-5
    gm_notes: >
      引進無人機系統。讓玩家體驗被監視的恐懼。
      第一次無人機掃描——給玩家一個反應的機會：「嗡嗡聲——快躲！」
      第二次無人機掃描——如果玩家還沒學會，讓一個賞金獵人找到他們。

      最好的設計：讓無人機在玩家認為安全的時候出現——
      「你剛包紮完傷口，喘了一口氣。嗡嗡聲。」

  - phase: 女妖的獵場
    turns: 4-5
    gm_notes: >
      薇拉開始主動出擊。她不會像其他賞金獵人那樣衝過來——
      她會設陷阱、製造假象、讓其他賞金獵人當她的獵犬。

      操作技巧：
      - 讓玩家發現一個「被遺棄的急救包」——附近有絆線手榴彈
      - 讓狙擊鏡的閃光出現在一個不可能的位置——那是鏡子，不是她
      - 讓玩家擊敗一個賞金獵人，在屍體上找到對講機——裡面傳來薇拉的聲音：
        「你比我想像的難纏。很好——這樣才有意思。」

  - phase: 鐵橋死局
    turns: 3-4
    gm_notes: >
      圈型迫使玩家過橋。這是最危險的一段路程——
      因為薇拉在等你。其他賞金獵人也在等你。

      給玩家多種選擇：
      - 正面衝橋（最危險）——但煙霧彈可以掩護
      - 繞路從化工區過河找淺灘——但毒素傷害會削弱你
      - 用載具高速衝橋——讓賞金獵人的狙擊窗口只有2秒
      - 假裝衝橋然後退回——引出狙擊手的位置然後反狙擊

      每個選擇都有代價和機會——沒有「安全」的選項。

  - phase: 最終圈：賞金結算
    turns: 2-3
    gm_notes: >
      最後的存活者：你、薇拉、和最多1-2個其他孤狼。
      圈縮到一個廢棄倉庫。薇拉終於跟你正面對峙了。

      給玩家一個高潮場景。讓薇拉說話——
      「你知道你的賞金是多少嗎？五十萬信用點數。
      足夠一個普通家庭活五十年。
      你知道為什麼這麼高嗎？因為你讓我看起來像個菜鳥。」

      她的弱點：完美主義。她不能接受失敗。
      當她的計畫被打亂時——當玩家做出她沒預料到的行動——
      她會犯錯。這是玩家唯一的突破口。

      最終對決不只是槍法——是心理戰。讓她因為玩家不按她的腳本走而惱怒。
      「你不應該往左的——你上一場比賽每次都往右——」
      「你換了武器？為什麼換？你的數據顯示你偏好——」

victory_condition: 成為最後倖存的孤狼（且擊敗或擺脫賞金獵人「女妖」）


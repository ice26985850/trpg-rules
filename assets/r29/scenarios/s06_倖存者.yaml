# 絕地戰場 TRPG — 劇本 S6（單人）：倖存者
scenario:
  id: S6
  name: 倖存者
  type: solo
  tier: 1
  difficulty: 1
  estimated_duration: 1.5-2小時
  suggested_level: 1-2

  description: >
    這是你的第一場比賽。小型夜間島嶼——只有2公里見方。
    十個參賽者。沒有隊友。沒有空投。只有你、你的槍、和在黑暗中
    一步步逼近的九個陌生人。你不是來贏的——你是來證明自己不是來送死的。

map:
  name: 夜霧島
  size: 2公里 × 2公里
  terrain: [海岸(30%), 森林(50%), 廢棄漁村(20%)]
  landmarks:
    - { id: L1, name: 廢棄燈塔, type: tactical, loot_level: 豐富（藍）, description: 島嶼最高點，但上去的人會被全島看到 }
    - { id: L2, name: 漁村碼頭, type: residential, loot_level: 普通（綠）, description: 廢棄漁村——適合隱匿移動的巷弄 }
    - { id: L3, name: 無線電塔, type: special, loot_level: -, description: 島上唯一的無線電塔。綠色指示燈在夜間格外醒目 }

enemy_configuration:
  total_lone_wolves: 9  # 加玩家和宿敵共11人
  distribution:
    - { type: 菜鳥, difficulty: ★, count: 5 }
    - { type: 穩健, difficulty: ★★, count: 3 }
    - { type: 突擊, difficulty: ★★★, count: 1 }

nemesis:
  name: 米哈伊爾·科瓦奇
  codename: 「老兵」
  style: 穩健型
  strength: 6/10
  weapon: SKS狙擊槍 + P92手槍
  backstory: >
    一個參加過十場比賽的老兵。他跟你同時降落在島上——
    而你聽到他的腳步聲在附近的樹林裡迴盪，
    但從沒正面見過他——直到最後一圈。

circle:
  type: 中央收束
  description: 可預測的標準圈型

airdrop: { enabled: false }
red_zone: { enabled: false }
vehicles: [僅摩托車]
weather: 夜間多霧
time_of_day: 夜間（新月——最暗的夜晚）

special_rules:
  - 夜間視野僅30m（無夜視鏡）
  - 聽覺補償生效（腳步聲40m可聞）
  - 孤狼直覺生效
  - 1座無線電塔可用

phases:
  - phase: 獨自降臨
    turns: 1
    gm_notes: >
      「運輸機的艙門打開——下面是黑色的海和暗色的島。
      你深吸一口氣，跳了出去。降落傘在夜空中展開——
      你看到九個其他的傘，像幽靈一樣散開在黑暗中。」

  - phase: 夜間搜刮
    turns: 4
    gm_notes: >
      黑暗是你的朋友也是敵人。你看不到他們，他們也看不到你。
      但腳步聲在安靜的夜晚格外清晰。
      引導玩家利用聽覺——「你聽到左前方的灌木叢有窸窣聲。」

  - phase: 第一滴血
    turns: 3-4
    gm_notes: >
      安排玩家的第一次單人擊殺。這應該是有意義的——
      讓玩家在擊殺後找到敵人身上的物品（一張家人的照片、一封未寄出的信），
      提醒玩家每個參賽者都是人。

  - phase: 無線電的誘惑
    turns: 2
    gm_notes: >
      燈塔或無線電塔是戰略要地——但也極度暴露。
      給玩家選擇：賭一把去啟動無線電（獲得情報），
      還是穩健地走地面？

  - phase: 最終圈：老兵
    turns: 2-3
    gm_notes: >
      圈縮到只剩一個漁村小屋。你和老兵。
      「他從陰影中走出來——五十多歲，灰白的鬍子，
      手裡的SKS上滿是刮痕。他看著你，微微點頭。
      不是挑釁，是認可。『不錯——你的第一場比賽，能走到這裡。』
      然後他舉起了槍。」

victory_condition: 成為最後倖存的孤狼
xp_rewards:
cr_rewards:
  per_elimination: 30
  squad_wipe: 50
  survival_top10: 100
  survival_top5: 150
  chicken_dinner: 500
  rescue_teammate: 20
  chicken_dinner: 500
  per_elimination: 80
  survival_top5: 250

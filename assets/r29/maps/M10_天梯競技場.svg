<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 1020" width="920" height="1020">
<style>
  text { font-family: "微軟正黑體", "Microsoft JhengHei", "Noto Sans TC", sans-serif; }
  .title { font-size: 22px; font-weight: bold; fill: #2F5496; }
  .subtitle { font-size: 13px; fill: #666; }
  .region-label { font-size: 12px; font-weight: bold; fill: #444; }
  .node-label { font-size: 11px; fill: #333; text-anchor: middle; dominant-baseline: middle; }
  .node-sublabel { font-size: 8px; fill: #666; text-anchor: middle; }
  .road-label { font-size: 8px; fill: #888; text-anchor: middle; }
  .landmark-label { font-size: 10px; font-weight: bold; fill: #800; }
  .legend-text { font-size: 9px; fill: #555; }
  .circle-label { font-size: 9px; fill: #C00; font-weight: bold; text-anchor: middle; }
</style>
<rect width="100%" height="100%" fill="#F8F8F4"/>

<text x="20" y="28" class="title">天梯競技場</text>
<text x="20" y="48" class="subtitle">S10_傳奇終局 | 5層垂直競技場 | 3×3km</text>
  <rect x="60" y="60" width="600" height="170" fill="#E8D8C0" opacity="0.4" stroke="#999" stroke-width="1" rx="8"/>
  <rect x="60" y="60" width="600" height="30" fill="#E8D8C0" opacity="0.7" rx="8"/>
  <rect x="60" y="80" width="600" height="10" fill="#E8D8C0" opacity="0.7"/>
  <text x="70" y="80" class="region-label" fill="#333">Lv.5 — 全景控制室</text>
  <text x="460" y="80" class="node-sublabel">室內 | 300×300m</text>
  <text x="70" y="220" class="node-sublabel" fill="#555">潘多拉高管觀戰層。防彈玻璃(HP100)。可透過監控螢幕看到全場即時畫面</text>
  <rect x="140" y="110" width="60" height="28" fill="white" stroke="#888" stroke-width="1" rx="4"/>
  <text x="170" y="128" class="node-label">A1</text>
  <rect x="60" y="240" width="600" height="170" fill="#C0C0C0" opacity="0.4" stroke="#999" stroke-width="1" rx="8"/>
  <rect x="60" y="240" width="600" height="30" fill="#C0C0C0" opacity="0.7" rx="8"/>
  <rect x="60" y="260" width="600" height="10" fill="#C0C0C0" opacity="0.7"/>
  <text x="70" y="260" class="region-label" fill="#333">Lv.4 — 叢林穹頂</text>
  <text x="460" y="260" class="node-sublabel">人造叢林 | 600×600m</text>
  <text x="70" y="400" class="node-sublabel" fill="#555">氣候控制的人造雨林。茂密植被提供自然掩體。樹冠走道連接各區</text>
  <rect x="140" y="290" width="60" height="28" fill="white" stroke="#888" stroke-width="1" rx="4"/>
  <text x="170" y="308" class="node-label">D1</text>
  <rect x="220" y="290" width="60" height="28" fill="white" stroke="#888" stroke-width="1" rx="4"/>
  <text x="250" y="308" class="node-label">E1</text>
  <rect x="300" y="290" width="60" height="28" fill="white" stroke="#888" stroke-width="1" rx="4"/>
  <text x="330" y="308" class="node-label">D2</text>
  <rect x="380" y="290" width="60" height="28" fill="white" stroke="#888" stroke-width="1" rx="4"/>
  <text x="410" y="308" class="node-label">E2</text>
  <rect x="460" y="290" width="60" height="28" fill="white" stroke="#888" stroke-width="1" rx="4"/>
  <text x="490" y="308" class="node-label">F2</text>
  <polygon points="352,328 368,328 372,340 368,352 352,352 348,340" fill="#B04040" stroke="#800" stroke-width="1"/>
  <text x="360" y="362" class="landmark-label" text-anchor="middle">L4（地標）</text>
  <rect x="60" y="420" width="600" height="170" fill="#FFD4A8" opacity="0.4" stroke="#999" stroke-width="1" rx="8"/>
  <rect x="60" y="420" width="600" height="30" fill="#FFD4A8" opacity="0.7" rx="8"/>
  <rect x="60" y="440" width="600" height="10" fill="#FFD4A8" opacity="0.7"/>
  <text x="70" y="440" class="region-label" fill="#333">Lv.3 — 住宅模擬區</text>
  <text x="460" y="440" class="node-sublabel">住宅 | 600×600m</text>
  <text x="70" y="580" class="node-sublabel" fill="#555">仿造的城市街區。公寓、便利店、學校——冠軍紀念館在此層</text>
  <rect x="140" y="470" width="60" height="28" fill="white" stroke="#888" stroke-width="1" rx="4"/>
  <text x="170" y="488" class="node-label">B4</text>
  <rect x="220" y="470" width="60" height="28" fill="white" stroke="#888" stroke-width="1" rx="4"/>
  <text x="250" y="488" class="node-label">C4</text>
  <rect x="300" y="470" width="60" height="28" fill="white" stroke="#888" stroke-width="1" rx="4"/>
  <text x="330" y="488" class="node-label">B5</text>
  <rect x="380" y="470" width="60" height="28" fill="white" stroke="#888" stroke-width="1" rx="4"/>
  <text x="410" y="488" class="node-label">C5</text>
  <rect x="460" y="470" width="60" height="28" fill="white" stroke="#888" stroke-width="1" rx="4"/>
  <text x="490" y="488" class="node-label">B6</text>
  <rect x="540" y="470" width="60" height="28" fill="white" stroke="#888" stroke-width="1" rx="4"/>
  <text x="570" y="488" class="node-label">C6</text>
  <polygon points="352,508 368,508 372,520 368,532 352,532 348,520" fill="#B04040" stroke="#800" stroke-width="1"/>
  <text x="360" y="542" class="landmark-label" text-anchor="middle">L3（地標）</text>
  <rect x="60" y="600" width="600" height="170" fill="#C0E8C0" opacity="0.4" stroke="#999" stroke-width="1" rx="8"/>
  <rect x="60" y="600" width="600" height="30" fill="#C0E8C0" opacity="0.7" rx="8"/>
  <rect x="60" y="620" width="600" height="10" fill="#C0E8C0" opacity="0.7"/>
  <text x="70" y="620" class="region-label" fill="#333">Lv.2 — 工廠迷宮</text>
  <text x="460" y="620" class="node-sublabel">工業迷宮 | 600×600m</text>
  <text x="70" y="760" class="node-sublabel" fill="#555">全圖唯一軍用物資補給點。貨櫃迷宮——視野極度受限</text>
  <rect x="140" y="650" width="60" height="28" fill="white" stroke="#888" stroke-width="1" rx="4"/>
  <text x="170" y="668" class="node-label">B2</text>
  <rect x="220" y="650" width="60" height="28" fill="white" stroke="#888" stroke-width="1" rx="4"/>

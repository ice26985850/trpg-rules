  <rect x="300" y="650" width="60" height="28" fill="white" stroke="#888" stroke-width="1" rx="4"/>
  <text x="330" y="668" class="node-label">D2</text>
  <rect x="380" y="650" width="60" height="28" fill="white" stroke="#888" stroke-width="1" rx="4"/>
  <text x="410" y="668" class="node-label">B3</text>
  <rect x="460" y="650" width="60" height="28" fill="white" stroke="#888" stroke-width="1" rx="4"/>
  <text x="490" y="668" class="node-label">C3</text>
  <rect x="540" y="650" width="60" height="28" fill="white" stroke="#888" stroke-width="1" rx="4"/>
  <text x="570" y="668" class="node-label">D3</text>
  <polygon points="352,688 368,688 372,700 368,712 352,712 348,700" fill="#B04040" stroke="#800" stroke-width="1"/>
  <text x="360" y="722" class="landmark-label" text-anchor="middle">L2（地標）</text>
  <rect x="60" y="780" width="600" height="170" fill="#D0D0E0" opacity="0.4" stroke="#999" stroke-width="1" rx="8"/>
  <rect x="60" y="780" width="600" height="30" fill="#D0D0E0" opacity="0.7" rx="8"/>
  <rect x="60" y="800" width="600" height="10" fill="#D0D0E0" opacity="0.7"/>
  <text x="70" y="800" class="region-label" fill="#333">Lv.1 — 中央鬥技場</text>
  <text x="460" y="800" class="node-sublabel">開闊空間 | 600×600m</text>
  <text x="70" y="940" class="node-sublabel" fill="#555">完全開闊的鬥技場。四根鋼柱支撐上層。最終對決的舞台</text>
  <rect x="140" y="830" width="60" height="28" fill="white" stroke="#888" stroke-width="1" rx="4"/>
  <text x="170" y="848" class="node-label">C3</text>
  <rect x="220" y="830" width="60" height="28" fill="white" stroke="#888" stroke-width="1" rx="4"/>
  <text x="250" y="848" class="node-label">D3</text>
  <rect x="300" y="830" width="60" height="28" fill="white" stroke="#888" stroke-width="1" rx="4"/>
  <text x="330" y="848" class="node-label">C4</text>
  <rect x="380" y="830" width="60" height="28" fill="white" stroke="#888" stroke-width="1" rx="4"/>
  <text x="410" y="848" class="node-label">D4</text>
  <polygon points="352,868 368,868 372,880 368,892 352,892 348,880" fill="#B04040" stroke="#800" stroke-width="1"/>
  <text x="360" y="902" class="landmark-label" text-anchor="middle">L1（地標）</text>
<text x="690" y="80" class="subtitle" font-weight="bold">垂直通道</text>
  <rect x="690" y="98" width="8" height="12" fill="#CC4444"/>
  <text x="703" y="108" class="legend-text">中央電梯井（1回合/層）— 快速但暴露</text>
  <rect x="690" y="114" width="8" height="12" fill="#4444CC"/>
  <text x="703" y="124" class="legend-text">外牆攀爬點（2回合/層）— 隱密但費力</text>
  <rect x="690" y="130" width="8" height="12" fill="#44CC44"/>
  <text x="703" y="140" class="legend-text">通風管道（3回合/層）— 極隱密但慢</text>
  <rect x="690" y="146" width="8" height="12" fill="#CC44CC"/>
  <text x="703" y="156" class="legend-text">緊急樓梯（1回合/層）— 中等速度半暴露</text>
</svg>
npcs:
  - name: Gilmar Sato
    role: Campfire companion who fell into The Void (§8-A)
    lines:
      - "…a name? I think I had one. But that was long ago. You… know me?"
  - name: Fane the Gleaner
    role: Hidden Workshop master (§8-D)
    lines:
      - "It isn't that it can't be deceived. It's that it can't notice it's been deceived."
  - name: Whisperer · the Voice Under the Water (RC-02 variant)
    role: Intelligence-type construct (EBC 0)
    lines:
      - "The return costs more than the going. The going: a little hope. The return: you must find something you want, down there."
  - name: Echo Companion · the Handwiper
    role: If its pod was plucked in S3, an Afterimage in The Void
    lines:
      - "It recognizes the player (+5 Campfire Ember)"

choices:
  - id: C1
    question: Descend the Sunken Stair? (actively exploit the loophole)
    options:
      - desc: Don't go
        effect: Pure escape completes the Trial, misses the main story (no Fane's notes, can't rescue Gilmar)
      - desc: Go
        effect: Enter The Void (Act Three), actively manipulate the rules
  - id: C2
    question: Void trigger-object choice
    options:
      - desc: Do something unrewarded for Gilmar
        effect: Rescue (in S8 he will remember the player's name)
      - desc: Acknowledge / make amends to a sacrificed Echo
        effect: Emotional closure
      - desc: Remember what the carried item is
        effect: Memory closure
  - id: C3
    question: Rescue Gilmar?
    options:
      - desc: Rescue
        effect: He returns to the Campfire (empty, recovers a little each scenario, remembers the player's name in S8)
      - desc: Don't rescue
        effect: Emotional vacancy, but the player keeps more Hope Point (HOP)

endings:
  - type: Branching (whether to rescue Gilmar)
    condition: Depends on Decision Three
    ember_moment: Triggers when a genuine emotion is regenerated in The Void (Ember does not roll toward the Campfire)

rewards:
  bp: Standard × (per player-count table)
  prs_gain: Rises to level 13 upon completion
  hop: "+4"
  campfire_ember: Accrued during play (est. 6-12)
  memory_card: 1-2
  item: 1 very rare item per person
  npc_rescue: Gilmar Sato can be brought back to the Campfire (if an unrewarded thing is done for him), and remembers the player's name by S8
  narrative: Ember in The Void cannot reach the Campfire; The Entity has an instinctive immune response
  new_ability: Spot the Loophole — once per scenario the player may declare "there is a seam in the rules here," and the GM must give an exploitable mechanical flaw
  map_unlock: Hidden Workshop ↔ Léry's Memorial Institute drainage conduit, Hidden Workshop ↔ Red Forest hidden door (opens S6, S7)


# S5 · The Return Costs More Than the Going (structured data for the AI GM engine)
id: S5
title: The Return Costs More Than the Going
realm: Backwater Swamp (R5) → The Void → Hidden Workshop
recommended_prs: "10-13"
duration_min: 270
summary: >-
  The second station of the playstyle shift: the player exploits a system loophole for the first time — deliberately falling into The Void and climbing back out. From passive survival to actively manipulating the rules. This is the quietest, most psychological round of the campaign: The Void has no Killer, no objective, Hope Point (HOP) continuously drains, the only exit is "regenerate one genuine emotion." Hag's (HAG) traps can teleport, "space cannot be trusted." Revelation: Ember in The Void cannot reach the Campfire, The Entity has an instinctive immune response to Ember — providing the tension for S7/S8.


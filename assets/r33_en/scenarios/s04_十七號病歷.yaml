# S4 · Patient Seventeen's Chart (structured data for the AI GM engine)
id: S4
title: Patient Seventeen's Chart
realm: Crotus Prenn Asylum (R4)
recommended_prs: "7-10"
duration_min: 240
summary: >-
  The main-story turning point. The player sees for the first time the trace "Altruistic Hope" leaves at the system level — helping an Afterimage finish what it left undone spits out memory, and all those memory shards roll in the same direction: the Campfire. Nurse (NRS) can Blink through walls; fully enclosed with very short line of sight, the most claustrophobic round. The records room is the only single-exit combat map (death trap). Pivotal revelation: the Campfire is made of Ember, and Ember is born of Altruistic Hope. The GM should not explain; let the player say "so the Campfire is…" themselves.


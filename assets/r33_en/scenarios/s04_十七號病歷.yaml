  narrative: Confirmed: the Campfire is made of Ember, and Ember is born of Altruistic Hope
  new_ability: Afterimage Dialogue — from now on the player may attempt to communicate with Afterimages in any Realm (spend 1 Action Point (AP) + Stealth (STL) or Will (WIL) check)


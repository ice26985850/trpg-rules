npcs:
  - name: Seventeen (No. 17)
    role: Afterimage (§8-D)
    lines:
      - "Stands motionless at the records-room door, accepts no help; after the chart is read aloud she turns, pulls out her sister's chart, places it in the player's hands, then dissolves"
  - name: Sally Nkosi
    role: Botanist-type Survivor (§8-A)
    lines:
      - "If she plucked the wrong pod in S3, here she 'recognizes Seventeen's face' but can't say why"
  - name: Whisperer · the Chart Number (RC-02 variant)
    role: Intelligence-type construct (EBC 0)
    lines:
      - "A number is only a number. A person is not. The one you ask about was never of this place."
  - name: Echo Companion · the Lace-Tier
    role: Solo configuration (§8-B)
    lines:
      - "Two parts of the same person as the Afterimage 'the Lace-Tier'; if the player completes both, an extra +3 Campfire Ember"

choices:
  - id: C1
    question: Help the Afterimages finish their unfinished business?
    options:
      - desc: Each one completed
        effect: "+2 Hope Point (HOP), +2 Campfire Ember, spit out memory (possibly someone else's)"
      - desc: Complete 3+ and read Seventeen's chart aloud
        effect: Trigger the Ember Moment and the pivotal revelation
  - id: C2
    question: Enter the records room (death trap)?
    options:
      - desc: Enter
        effect: The only exit is blocked by the Nurse at the door; must escape via the outer-wall crack (cp_crack) after Act Three; pivotal revelation + Memory Card
      - desc: Do not enter
        effect: Main story cannot advance; only pure escape

endings:
  - type: Linear (whether the pivotal revelation triggers)
    condition: Depends on Decisions One / Two
    ember_moment: Triggers when 3+ Afterimages completed and Seventeen's chart is read aloud


# S3 · Roots That Eat No Soil (structured data for the AI GM engine)
id: S3
title: Roots That Eat No Soil
realm: Coldwind Farm (R3) → Fog Cellar
recommended_prs: "5-7"
duration_min: 210
summary: >-
  The first station of a playstyle shift: the player moves from "escape" into "escape + infiltration." Act Two is a standard Trial, but Act Three breaks away mid-Trial to infiltrate the Fog Cellar and retrieve the first Memory Card. Step two of the three-step root passage demands generating an Altruistic Hope as a key, making "rescue" go from a moral choice to a required clearing condition. Hillbilly (HBY) owns the open ground — the most painful round so far; the Fog Cellar has no Killer and no objective, pressure coming from the shrinking countdown and the cognitive challenge of "recognizing yourself."


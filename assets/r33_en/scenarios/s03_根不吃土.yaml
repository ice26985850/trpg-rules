npcs:
  - name: Sally Nkosi
    role: Botanist-type Survivor (§8-A)
    lines:
      - "Roots don't eat soil. They eat something else."
  - name: Whisperer · the Woman's Voice Beneath the Roots (RC-02)
    role: Intelligence-type construct (EBC 0)
    lines:
      - "Can you tell whose it is? If you can't, don't pluck. Pluck the wrong one and that person will see you."
  - name: Echo Companion · the Handwiper
    role: Solo configuration (§8-B)
    lines:
      - "His pod is also in the Fog Cellar; the player may pluck it for him (+3 Campfire Ember)"
  - name: Eloise Finch
    role: Campfire Chronicler (§8-A)
    lines:
      - "The fire remembers — reasoning, guiding the infiltration"

choices:
  - id: C1
    question: Generate Altruistic Hope to unlock? (core)
    options:
      - desc: Look out only for yourself the whole time
        effect: No key can be made, the Fog Cellar cannot be entered, only pure escape, no Memory Card
      - desc: Generate Altruistic Hope
        effect: Roots loosen, enter the Fog Cellar (take Memory Card + trigger the Ember Moment)
  - id: C2
    question: Pluck a pod in the Fog Cellar
    options:
      - desc: Pluck your own pod
        effect: 1 Memory Card (linked with the S1 carried item)
      - desc: Pluck another's pod
        effect: 1 someone-else's Memory Card (+1 Hope Point (HOP) cap, cannot be returned; GM should arrange at least one player to pluck wrong; plucking a Killer's memory = S6 hook)
      - desc: Fail to leave within the shrinking countdown
        effect: Lose 3 Hope Point (HOP); force-returned to the Campfire by The Entity's "filing"

endings:
  - type: Branching (enter Fog Cellar or not / pluck right or wrong)
    condition: Depends on Decisions One and Two
    ember_moment: Triggers when unlocking with Altruistic Hope


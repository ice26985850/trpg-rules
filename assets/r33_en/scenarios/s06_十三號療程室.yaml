  campfire_ember: Accrued during play (est. 8-15)
  memory_card: 1-2
  item: 1 very rare item + 2 Add-ons per person
  narrative: The Entity is a vast but clumsy system; it can detect anomalies but cannot locate causes
  new_ability: Call Out the Name — once per scenario, spend 3 Hope Point (HOP) to declare "I know who you are" at any Killer; the GM reveals one piece of that Killer's human memory and it is hindered that round


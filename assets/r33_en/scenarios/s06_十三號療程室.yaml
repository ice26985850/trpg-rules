# S6 · Therapy Room 13 (structured data for the AI GM engine)
id: S6
title: Therapy Room 13
realm: Léry's Memorial Institute (R6)
recommended_prs: "13-15"
duration_min: 270
summary: >-
  Exposes the campaign's cruelest truth: not all Killers are taken from outside; some walk over from the Campfire. The person the player knows — Hilda Lane (§8-A) — is being Reforged into The Silent One (SIL). The Silent One (SIL) is a story-exclusive avatar (the 9th, appears only in S6–S8, not in the 8-avatar standard pool; data block supplied separately by the combat designer as a simplified version). It has no Terror Radius (TR), emits Survivor voices to lure, and mid-Realm performs a "Mirror Swap" that invalidates map memory. The player has three ways to interrupt the Reforge, all with a cost; the third, "don't interrupt," is not a bad ending — it is a knowledge gain with a cost.


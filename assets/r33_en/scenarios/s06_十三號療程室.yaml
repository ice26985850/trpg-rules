npcs:
  - name: Hilda Lane → The Silent One (SIL)
    role: Former Campfire companion / story-exclusive avatar (9th, §8-A)
    lines:
      - "…help me fix this one. Almost done. (Survivor voice)"
      - "(After turning, silent, only looking at you)"
  - name: Sally Nkosi
    role: Botanist-type Survivor (§8-A)
    lines:
      - "If she plucked the wrong pod in S3, here she speaks the Reforge's Q&A content (plucked a certain Killer's memory)"
  - name: Eloise Finch
    role: Campfire Chronicler (§8-A)
    lines:
      - "Reveals she too was once taken into Room 13, but 'it didn't take' — her hate wasn't enough"
  - name: Echo Companion · Hilda
    role: Solo configuration, after Act Three (§8-B)
    lines:
      - "If the Reforge is interrupted and she enters The Void, she appears as an Echo from S7 onward"

choices:
  - id: C1
    question: How to interrupt Therapy Room 13 (choose one of three, all with a cost)
    options:
      - desc: Call her name (call her True Name + one thing only she would remember)
        effect: She stops, Reforge fails, sent to The Void (recoverable later); no cost but requires recalling details from the first five scenarios
      - desc: Give her a memory (spend one of your own Memory Cards)
        effect: Reforge reversed, self preserved, returns to Campfire (best ending); permanently lose one Memory Card
      - desc: Don't interrupt (let it finish)
        effect: "+5 Entity Hunger (EH); Hilda becomes a Killer appearing in S7/S8; gain full Reforge-process knowledge (needed for S8 Takeover ending)"

endings:
  - type: Branching (by core decision)
    condition: Call name / give memory / don't interrupt
    ember_moment: Triggers on calling her name or giving a memory


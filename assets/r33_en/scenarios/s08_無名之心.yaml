choices:
  - id: C1
    question: Core decision of Act One (made by the player)
    options:
      - desc: Which path to take (Tower / Umbilical / both)
        effect: Path planning
      - desc: Who gets Hooked (someone must contact the Entity at the moment it acts)
        effect: Contact executor
      - desc: Which ending to choose
        effect: Conflagration / Takeover / Ember
  - id: C2
    question: Act Three ending divergence
    options:
      - desc: Conflagration
        effect: Execute ignition; fire tier reaches threshold → fire burns into the Entity; the Realms collapse (see fire tiers)
      - desc: Takeover
        effect: Enter the hole (requires the S6 "Don't interrupt" choice for process knowledge) → the player becomes the new Entity
      - desc: Ember
        effect: Open an exit gate and escape in Act Two, or do not ignite in Act Three → return to the campfire; the fire is a little bigger; the cycle continues

endings:
  - type: One of three endings
    condition: Depends on the Act One choice and Act Three execution
    ember_moment: Always triggers (regardless of ending)

rewards:
  bp: Standard × (per player-count table)
  prs_gain: Level 20 (capstone)
  narrative: One of the three endings
  campaign_complete: Campaign complete
  sequel_hook: Ember continues into a new campaign (old character becomes an NPC); Takeover opens a variant campaign; Conflagration opens a modern-metropolis sequel (seepage investigation)


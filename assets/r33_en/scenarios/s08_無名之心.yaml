# S8 · The Nameless Heart (structured data, for the AI GM engine to read)
id: S8
title: The Nameless Heart
realm: Forsaken Boneyard (R8) → Lone Tower → The Nameless Heart
recommended_prs: "18-20"
duration_min: 360
summary: >-
  Capstone scenario. S8 is not a harder Trial — it is a rule flip: the Generator is an igniter, being Hooked is the only way to contact the Entity (The Entity) Proper, escape is surrender, and Hope Points (HOP) are ammunition. Act One plans at the campfire (the only time in the whole campaign the "player is in charge"). Act Two is the Forsaken Boneyard trial + tower climb. Act Three passes through the Sky-Rift to reach the Nameless Heart — the Entity Core. The player chooses one of three endings: Conflagration / Takeover / Ember. The GM must clearly tell the player in Act One that the rules are flipped (empowerment, not a surprise).


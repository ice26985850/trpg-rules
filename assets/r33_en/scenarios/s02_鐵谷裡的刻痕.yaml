# S2 · Scars in the Iron Valley (structured data for the AI GM engine)
id: S2
title: Scars in the Iron Valley
realm: Autohaven Wreckers (R2)
recommended_prs: "3-5"
duration_min: 180
summary: >-
  The player discovers words carved into the wrecks of the Autohaven Wreckers, and the scars differ from Trial to Trial — someone is using them to leave messages, and the one who left them is gone. This scenario deepens two threads: "memory loss is systematic" and "someone is fighting it." Core design: scars are collectible information, but collecting them costs Action Point (AP), and each scar challenges the player's perception. Wraith (WRT) serves as the "heartbeat-less Killer" tutorial — it has no Terror Radius (TR), and the player must read position from audio cues. The closing Ember Moment reveals the words were carved by Eloise herself.


encounters:
  - id: E1
    type: Exploration
    content: Scar collection (6-8)
    cr: Easy-Medium
    note: Each costs 1 Action Point (AP)
  - id: E2
    type: Chase
    content: Wraith's (WRT) invisible ambush (no heartbeat)
    cr: Medium
    note: Tutorial: audio cues replace heartbeat
  - id: E3
    type: Environment
    content: Car pile collapse (closes passage when triggered)
    cr: Medium
    note: Agility (AGI) evade
  - id: E4
    type: Realm Construct
    content: Rust-Devourer = Tin Golem (RC-03) × N
    cr: Low (CR 3)
    note: EBC 6 each, blocking type
  - id: E5
    type: Chase
    content: Mid-game Hook and rescue
    cr: Medium
    note: "-"
  - id: E6
    type: Endgame
    content: Trap on the fifth Generator (Scar #1)
    cr: Medium-High
    note: Free position reveal for the Killer when the fifth is repaired

npcs:
  - name: Eloise Finch
    role: Campfire Chronicler (§8-A)
    lines:
      - "These are my words. …I forget every time I come back. So I carve outside, and on my own body. But I never finished that one sentence."
  - name: Gilmar Sato
    role: Scavenger-type Survivor (§8-A)
    lines:
      - "Next time you see one like it, stop and look. Maybe it was left for you."
  - name: Echo Companion · the Hollow Hugger
    role: Solo configuration (§8-B)
    lines:
      - "If the player heals it, it passes the 'thing in its arms' to the player — it is empty, but the player gains 1 Hope Point (HOP)."
  - name: Whisperer · Iron-Rust Chorus (RC-02)
    role: Intelligence-type construct (EBC 0)
    lines:
      - "Metal remembers sound. You knock, it answers. Knock a few more times and I'll tell you which sheet of iron carries words."

choices:
  - id: C1
    question: Spend Action Point (AP) to read the scars?
    options:
      - desc: Give up a self-favorable action to read a scar
        effect: Satisfies the Ember Moment trigger condition; gains main-story info and rules hints
  - id: C2
    question: The fifth Generator
    options:
      - desc: Actively repair the fifth
        effect: Triggers the E6 trap (free position reveal for the Killer)
      - desc: Heed the scar, meet quota with four
        effect: Avoids the trap; escape still completed
  - id: C3
    question: Treatment of Echo · Hollow Hugger (solo)
    options:
      - desc: Heal the Echo Companion
        effect: Gain 1 Hope Point (HOP); key source in the solo game

endings:
  - type: Linear (single ending)
    condition: Complete the Trial
    ember_moment: Triggers if the player gives up a favorable action to read a scar


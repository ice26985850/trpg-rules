encounters:
  - id: E1
    type: Environment
    content: Crow flock in the Sheltering Woods (flushing reveals position)
    cr: No check
    note: Optionally use RC-01 Rust Crows as alarm flavor; not counted in the formal budget
  - id: E2
    type: Chase
    content: First Killer encounter (GM must let the player escape)
    cr: Low
    note: Tutorial: heartbeat and Terror Radius (TR)
  - id: E3
    type: Trap
    content: Bear Trap ×3 (set by Trapper (TRP)), removable with a Toolbox
    cr: Easy
    note: Removal = Technique (TEC) check
  - id: E4
    type: Chase
    content: Second encounter (Hook, teaches rescue)
    cr: Medium
    note: Tutorial: Hook and rescue
  - id: E5
    type: Realm Construct
    content: None
    cr: "-"
    note: S1 places no construct
  - id: E6
    type: Endgame
    content: Exit Gate or Hatch
    cr: Medium
    note: "-"

npcs:
  - name: Eloise Finch
    role: Campfire Chronicler (§8-A)
    lines:
      - "Fix five Generators and the gate opens."
      - "Hooked three times and you're gone."
      - "You'll live longer if you don't rescue people."
      - "The one who sat where you sit vanished. Three weeks later, in a Trial, I saw a thing — it walked exactly like him."
      - "Haven't you noticed the fire is a little bigger than when you first came?"
  - name: Echo Companion · 47
    role: Solo-configuration metronome (§8-B)
    lines:
      - "…ninety-seven, ninety-eight, ninety-nine, a hundred. See? I'm still counting."
  - name: Whisperer · Well Chorus (RC-02)
    role: Intelligence-type construct (EBC 0)
    lines:
      - "Come down. Come see. We all forgot, but you still remember."

choices:
  - id: C1
    question: Rescue or not (core tutorial)
    options:
      - desc: Choose to rescue
        effect: Triggers Altruistic Hope, Entity Hunger (EH) −1, gain 1 Hope Point (HOP), unlock the Ember Moment
      - desc: Choose not to rescue
        effect: Character is safe; no Ember Moment this round; Campfire Ember accrues less
  - id: C2
    question: Optional exploration nodes (solo / duo)
    options:
      - desc: Explore Broken Shack (mm_opt_shack)
        effect: Gain a Memory Card clue pointing to S3 "Roots That Eat No Soil" (a note reading "tree")
      - desc: Explore Changing Room (mm_opt_locker)
        effect: Gain a common item, and words carved into the inside of the iron cabinet (pointing to S2 "Scars in the Iron Valley")

endings:
  - type: Linear prologue (single ending)
    condition: Complete the Trial (Generators met or escape)
    ember_moment: As long as the player rescues at least one companion (including an Echo Companion) during the Trial, the Ember Moment is guaranteed to trigger after returning to the Campfire

rewards:
  bp: Standard (per character-builder formula)
  prs_gain: Rises to level 3 upon completion
  hop: "+2 (scenario complete) + accrued during play"
  campfire_ember: Accrued during play (est. 3-6)
  memory_card: 0
  item: 1 common item per person
  narrative: First sighting of Ember (unexplained)


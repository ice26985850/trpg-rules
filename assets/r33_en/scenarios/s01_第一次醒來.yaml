# S1 · First Awakening (structured data for the AI GM engine)
id: S1
title: First Awakening
realm: Macmillan Estate (R1)
recommended_prs: "1-3"
duration_min: 150
summary: >-
  Prologue. The player wakes by the Campfire with no memory. Campfire chronicler Eloise Finch gives two rules — fix five Generators and the gate opens, get Hooked three times and you're gone — and, contradiction-style, says in Act One "you live longer if you don't rescue people," yet personally goes to rescue during the Trial. This scenario establishes the baseline of fear, teaches the core rules, and plants four campaign-spanning hooks: the opposite effects of Altruistic Hope and Self-Hope on Entity Hunger (EH), the nature of Ember, "the one who sat where you sit" in Eloise's words, and the anchors of the scars and the carried item. S1 places no Realm Construct, keeping a pure chase-and-escape experience; the first Chase must let the player escape.


npcs:
  - name: Nameless
    role: Skeleton / first survivor (§8-D)
    lines:
      - "I had already gotten out. The door was open. One foot of mine was already outside. Then I heard someone calling from behind. I didn't know him. When I looked back I wasn't thinking anything. I just felt that leaving alone didn't seem right. …I left it here. If you're reading this far — then you probably looked back too. Take it."
  - name: Eloise Finch
    role: Campfire recorder (§8-A)
    lines:
      - "\"What if we make it spit up more?\" (linchpin line)"
  - name: Ari the Mirror-Bearer
    role: First appearance (§8-D)
    lines:
      - "Provides the S8 path: Lone Tower"
  - name: Hilda / The Silent One (SIL)
    role: Depends on the S6 choice (§8-A)
    lines:
      - "If Reforged, appears as a second Killer; if rescued, assists the player"

choices:
  - id: C1
    question: Whether to deliberately drop prone (deep leaf litter)
    options:
      - desc: Stand and flee
        effect: Leaves a 3-round trail, footstep sounds
      - desc: Dying crawl
        effect: Fully concealed but slow; the safest movement method in the whole campaign, and the psychological preparation for S8's "deliberately give up escape"
  - id: C2
    question: Whether Campfire Ember reaches the threshold
    options:
      - desc: Reaches threshold
        effect: Take the first ember (The First Ember) directly
      - desc: Does not reach
        effect: Triggers the bonus trial (survive inside the Sanctum for a number of rounds, then take it)

endings:
  - type: Branch (whether taking the ember triggers the bonus trial)
    condition: Depends on Decision Two
    ember_moment: Triggers upon obtaining the first ember

rewards:
  bp: Standard × (per player-count table)
  prs_gain: Rises to level 18 on completion
  hop: "+5"
  campfire_ember: Accumulated through the scenario (est. 10-18)
  memory_card: 2-3 cards
  item: 1 Very Rare item + 2 Add-Ons + 1 Offering per player
  key_item: The First Ember — ① lets you truly ascend the Lone Tower's Endless Stair; ② once per trial, spend 1 use to "ignore one of the Entity's window seals"; ③ the ignition source for S8
  narrative: The story of the "Nameless"; the Umbilical and the Ember Vein; the possibility of a conflagration
  map_unlock: Ember Vein (ember_vein), Lone Tower (lone_tower)
  new_ability: Follow the Ember — spend 1 Action Point (AP) per Realm to sense the campfire's direction (key navigation for S8)


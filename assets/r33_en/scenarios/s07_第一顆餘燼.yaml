# S7 · The First Ember (structured data, for the AI GM engine to read)
id: S7
title: The First Ember
realm: Red Forest (R7)
recommended_prs: "15-18"
duration_min: 300
summary: >-
  The campaign's arming scenario: the player obtains the first ember (The First Ember), and comes to understand what the Campfire is, and what the Ember Vein and the Umbilical are. The deep leaf litter makes "dying-crawling is actually safe" — the most counterintuitive design in the whole campaign. Huntress (HTR) throws at range, "distance is no longer safe." In the third act the player descends three levels of the Purification Sanctum, reaches the Ember Niche, and takes the first ember. It reveals the Umbilical: the embers came out of the Entity (The Entity), are the same kind of thing as it, and fire spreads.


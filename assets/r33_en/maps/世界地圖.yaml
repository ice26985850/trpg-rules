# World Map (Realm relation map; topological, not geographic)
# Coordinate range 0-1000, smaller y at top. 20 nodes, 32 connections.
# Note: the directive expected 33 connections, but file 40 §3-3 actually records 32; faithfully transcribed as 32 here.
meta:
  name: World Map
  type: Realm Relation Map (Topology)
  coord_range: 0-1000
  note: The Entity's realms are stitched non-Euclidiean; distance is meaningless, only connection relations matter. The Campfire at center, eight realms in the inner ring, The Void at the lower edge, Lone Tower top-left, The Nameless Heart farthest directly above.
  regions: 
    - { id: core, 中文名: Core Layer, 說明: The Campfire and the structure directly beneath it, 底色: Warm Orange}
    - { id: realm_belt, 中文名: Inner Ring · Realm Belt, 說明: The eight Trial realms, 底色: Cool Gray}
    - { id: rift_belt, 中文名: Outer Edge · Rift Belt, 說明: Anomalous space under incomplete Entity control, 底色: Indigo}
    - { id: void, 中文名: Outer Edge · The Void, 說明: Abandoned place, 底色: Near-black Purple}
    - { id: mortal, 中文名: Mortal Side, 說明: Where the Seeps are; not part of the Entity's realms, 底色: Murky Green}


<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" font-family="Microsoft JhengHei, sans-serif">
  <defs>
    <filter id="shadow"><feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="2" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A0E1A"/><stop offset="100%" stop-color="#0D1B2A"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1000" height="680" fill="url(#bgGrad)"/>

  <!-- Title -->
  <text x="500" y="28" text-anchor="middle" fill="#CCDDFF" font-size="18" font-weight="bold">Eternal Watch (Eternal Watch)  —  S2 Abyssal Corridor</text>
  <text x="500" y="48" text-anchor="middle" fill="#667788" font-size="12">Abandoned Concord Carrier | 18 nodes | 5 decks | Watcher AI anomaly</text>

  <!-- ====== Each Deck Base Color Region ====== -->
  <!-- Deck 5: Command Deck (Top) -->
  <rect x="30" y="65" width="940" height="100" rx="8" fill="#1A3322" opacity="0.5" stroke="#33AA55" stroke-width="1" stroke-dasharray="6,3"/>
  <text x="50" y="88" fill="#44BB66" font-size="13" font-weight="bold">Deck 5  —  Command Deck (Bridge Level)</text>

  <!-- Deck 4: Core Systems -->
  <rect x="30" y="172" width="940" height="95" rx="8" fill="#2A1A33" opacity="0.5" stroke="#AA55CC" stroke-width="1" stroke-dasharray="6,3"/>
  <text x="50" y="195" fill="#BB66DD" font-size="13" font-weight="bold">Deck 4  —  Core Systems (Reactor + AI Core)</text>

  <!-- Deck 3: Power &amp; Repair -->
  <rect x="30" y="274" width="940" height="95" rx="8" fill="#331A1A" opacity="0.5" stroke="#CC5555" stroke-width="1" stroke-dasharray="6,3"/>
  <text x="50" y="297" fill="#DD6666" font-size="13" font-weight="bold">Deck 3  —  Power &amp; Repair (Engine Control)</text>

  <!-- Deck 2: Research &amp; Data -->
  <rect x="30" y="376" width="940" height="95" rx="8" fill="#33221A" opacity="0.5" stroke="#CC8844" stroke-width="1" stroke-dasharray="6,3"/>
  <text x="50" y="399" fill="#DD9944" font-size="13" font-weight="bold">Deck 2  —  Research &amp; Data (Laboratory + Data Center)</text>

  <!-- Deck 1: Hangar &amp; Living Quarters -->
  <rect x="30" y="478" width="940" height="100" rx="8" fill="#1A2A33" opacity="0.5" stroke="#4488CC" stroke-width="1" stroke-dasharray="6,3"/>
  <text x="50" y="501" fill="#5599DD" font-size="13" font-weight="bold">Deck 1  —  Hangar &amp; Living Quarters (Breach Level)</text>

  <!-- ====== Connections ====== -->
  <!-- Deck 1 connections -->
  <line x1="170" y1="555" x2="170" y2="510" stroke="#6699BB" stroke-width="1.5"/>
  <line x1="170" y1="555" x2="310" y2="555" stroke="#6699BB" stroke-width="2"/>
  <line x1="310" y1="555" x2="310" y2="510" stroke="#BB9944" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="260" y="565" fill="#6699BB" font-size="9">Corridor</text>

  <line x1="310" y1="510" x2="460" y2="510" stroke="#6699BB" stroke-width="2"/>
  <line x1="460" y1="510" x2="610" y2="510" stroke="#6699BB" stroke-width="2"/>

  <!-- Deck 1→2 stair -->
  <line x1="460" y1="510" x2="460" y2="440" stroke="#BB9944" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="475" y="478" fill="#BB9944" font-size="9">Stairwell</text>

  <!-- Deck 2 connections -->
  <line x1="460" y1="440" x2="610" y2="440" stroke="#6699BB" stroke-width="2"/>
  <line x1="460" y1="440" x2="460" y2="390" stroke="#6699BB" stroke-width="2"/>

  <!-- Deck 2→3 stair -->
  <line x1="460" y1="390" x2="460" y2="345" stroke="#BB9944" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="475" y="370" fill="#BB9944" font-size="9">Stairwell</text>

  <!-- Deck 3 connections -->
  <line x1="460" y1="345" x2="610" y2="345" stroke="#6699BB" stroke-width="2"/>
  <line x1="610" y1="345" x2="760" y2="345" stroke="#DD4444" stroke-width="2.5"/>
  <text x="680" y="335" fill="#DD4444" font-size="8">Blocked</text>

  <!-- Deck 1→4 maintenance -->
  <line x1="310" y1="555" x2="760" y2="230" stroke="#88CC88" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="520" y="395" fill="#88CC88" font-size="9" transform="rotate(-35,520,395)">Repair Shaft (detour)</text>

  <!-- Deck 2→5 elevator -->
  <line x1="610" y1="440" x2="610" y2="120" stroke="#BB9944" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="625" y="300" fill="#BB9944" font-size="9">Elevator (malfunction)</text>

  <!-- Deck 5 connections -->
  <line x1="610" y1="120" x2="760" y2="120" stroke="#DD4444" stroke-width="2.5"/>
  <text x="680" y="110" fill="#DD4444" font-size="8">Locked</text>
  <line x1="760" y1="120" x2="760" y2="155" stroke="#6699BB" stroke-width="2"/>
  <line x1="760" y1="155" x2="760" y2="85" stroke="#6699BB" stroke-width="1.5"/>

  <!-- ====== nodes ====== -->

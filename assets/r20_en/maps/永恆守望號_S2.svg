  <rect x="110" y="530" width="120" height="50" rx="8" fill="#225544" stroke="#44AA66" stroke-width="2" filter="url(#shadow)"/>
  <text x="170" y="552" text-anchor="middle" fill="#88DDAA" font-size="11" font-weight="bold">Hangar Deck</text>
  <text x="170" y="568" text-anchor="middle" fill="#559977" font-size="8">N1 | Breach Point</text>

  <!-- N2 Hangar Control Room -->
  <rect x="110" y="478" width="120" height="45" rx="8" fill="#554422" stroke="#AA8844" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="170" y="498" text-anchor="middle" fill="#DDCC88" font-size="11" font-weight="bold">Hangar Control Room</text>
  <text x="170" y="514" text-anchor="middle" fill="#998866" font-size="8">N2 | 2 Robots</text>

  <!-- N3 Main Elevator Shaft -->
  <rect x="250" y="530" width="120" height="50" rx="8" fill="#443322" stroke="#CC8844" stroke-width="2" filter="url(#shadow)"/>

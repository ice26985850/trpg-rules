  <rect x="550" y="370" width="120" height="45" rx="8" fill="#334422" stroke="#88AA44" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="610" y="390" text-anchor="middle" fill="#AADD88" font-size="11" font-weight="bold">Old Data Center</text>
  <text x="610" y="406" text-anchor="middle" fill="#778866" font-size="8">N10 | Partially running</text>


  <rect x="400" y="418" width="120" height="45" rx="8" fill="#224444" stroke="#44AAAA" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="460" y="438" text-anchor="middle" fill="#88DDDD" font-size="11" font-weight="bold">Medical Bay</text>
  <text x="460" y="454" text-anchor="middle" fill="#669999" font-size="8">N7 | Abandoned medicine</text>

  <!-- N8 Laboratory -->
  <rect x="550" y="418" width="120" height="45" rx="8" fill="#442244" stroke="#AA44AA" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="610" y="438" text-anchor="middle" fill="#DD88DD" font-size="11" font-weight="bold">Laboratory</text>
  <text x="610" y="454" text-anchor="middle" fill="#996699" font-size="8">N8 | Biohazard | 0.3G</text>


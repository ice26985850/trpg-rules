  <rect x="550" y="322" width="120" height="45" rx="8" fill="#553322" stroke="#CC8844" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="610" y="342" text-anchor="middle" fill="#FFAA66" font-size="11" font-weight="bold">Engine Control Room</text>
  <text x="610" y="358" text-anchor="middle" fill="#996633" font-size="8">N13 | 2G High Gravity</text>

  <!-- N14 Reactor Room -->
  <rect x="700" y="322" width="130" height="55" rx="8" fill="#662222" stroke="#FF4444" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="765" y="342" text-anchor="middle" fill="#FF8888" font-size="11" font-weight="bold">⚠ Reactor Room</text>
  <text x="765" y="358" text-anchor="middle" fill="#CC6666" font-size="8">N14 | Radiation 1d4/round</text>
  <text x="765" y="372" text-anchor="middle" fill="#FF4444" font-size="8">AI attempting restart!</text>

  <!-- N15 AI Core Room -->
  <rect x="700" y="210" width="130" height="55" rx="8" fill="#442266" stroke="#AA44FF" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="765" y="230" text-anchor="middle" fill="#CC88FF" font-size="11" font-weight="bold">⚠ AI Core Room</text>
  <text x="765" y="246" text-anchor="middle" fill="#9966CC" font-size="8">N15 | Zero-G 0G</text>
  <text x="765" y="260" text-anchor="middle" fill="#AA44FF" font-size="8">Watcher AI anomaly</text>

  <!-- N16 Pre-Bridge Corridor -->
  <rect x="550" y="100" width="130" height="55" rx="8" fill="#552222" stroke="#DD4444" stroke-width="2" filter="url(#shadow)"/>
  <text x="615" y="122" text-anchor="middle" fill="#FF8888" font-size="11" font-weight="bold">Pre-Bridge Corridor</text>
  <text x="615" y="138" text-anchor="middle" fill="#996666" font-size="8">N16 | 3 Auto-Turrets!</text>

  <!-- N17 Bridge ⭐ -->
  <rect x="700" y="70" width="130" height="55" rx="10" fill="#664422" stroke="#FFAA44" stroke-width="3" filter="url(#shadow)"/>
  <text x="765" y="88" text-anchor="middle" fill="#FFCC88" font-size="12" font-weight="bold">⭐ Bridge</text>
  <text x="765" y="104" text-anchor="middle" fill="#CC9944" font-size="9">N17 | Objective Area</text>
  <text x="765" y="118" text-anchor="middle" fill="#FFAA44" font-size="8">Recover Tactical Database</text>

  <!-- N18 Captain's Quarters -->
  <rect x="700" y="140" width="130" height="45" rx="8" fill="#334455" stroke="#6688AA" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="765" y="160" text-anchor="middle" fill="#AABBCC" font-size="11" font-weight="bold">Captain's Quarters</text>
  <text x="765" y="176" text-anchor="middle" fill="#778899" font-size="8">N18 | Captain's Log</text>

  <!-- ====== Legend ====== -->
  <rect x="820" y="490" width="155" height="170" rx="8" fill="#0D0D1A" opacity="0.9" stroke="#334455" stroke-width="1"/>
  <text x="897" y="515" text-anchor="middle" fill="#8899AA" font-size="13" font-weight="bold">Legend</text>
  <rect x="835" y="530" width="18" height="10" rx="3" fill="#225544" stroke="#44AA66" stroke-width="1"/>
  <text x="862" y="540" fill="#88DDAA" font-size="10">Breach Point / Airlock</text>
  <rect x="835" y="550" width="18" height="10" rx="3" fill="#334455" stroke="#6688AA" stroke-width="1"/>
  <text x="862" y="560" fill="#AABBCC" font-size="10">Normal Room</text>
  <rect x="835" y="570" width="18" height="10" rx="3" fill="#664422" stroke="#FFAA44" stroke-width="2"/>
  <text x="862" y="580" fill="#FFCC88" font-size="10">Objective Area</text>
  <rect x="835" y="590" width="18" height="10" rx="3" fill="#552222" stroke="#DD4444" stroke-width="2"/>
  <text x="862" y="600" fill="#FF8888" font-size="10">Hazard / Enemy</text>
  <line x1="835" y1="615" x2="855" y2="615" stroke="#BB9944" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="862" y="620" fill="#BB9944" font-size="10">Stairwell / Vertical Passage</text>
  <line x1="835" y1="635" x2="855" y2="635" stroke="#88CC88" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="862" y="640" fill="#88CC88" font-size="10">Repair Shaft (detour)</text>
  <line x1="835" y1="652" x2="855" y2="652" stroke="#DD4444" stroke-width="2.5"/>
  <text x="862" y="657" fill="#DD4444" font-size="10">Blocked / Locked Hatch</text>

  <!-- Bottom Note -->
  <text x="500" y="668" text-anchor="middle" fill="#445566" font-size="10">Map corresponds to scenario S2 'Abyssal Corridor (Abyssal Corridor)' | Difficulty: Moderate | Level 2-4 | 5-deck abandoned carrier</text>
</svg>

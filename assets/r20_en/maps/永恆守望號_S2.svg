  <text x="310" y="568" text-anchor="middle" fill="#997766" font-size="8">N3 | Variable-G | DC 13</text>

  <!-- N4 Deck 1 Main Corridor -->
  <rect x="400" y="488" width="120" height="45" rx="8" fill="#334455" stroke="#6688AA" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="460" y="508" text-anchor="middle" fill="#AABBCC" font-size="11" font-weight="bold">Deck 1 Main Corridor</text>
  <text x="460" y="524" text-anchor="middle" fill="#778899" font-size="8">N4</text>


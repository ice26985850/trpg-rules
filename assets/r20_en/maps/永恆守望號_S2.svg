  <rect x="250" y="322" width="110" height="45" rx="8" fill="#222244" stroke="#4444AA" stroke-width="1.5" stroke-dasharray="3,2" filter="url(#shadow)"/>
  <text x="305" y="342" text-anchor="middle" fill="#8888DD" font-size="11" font-weight="bold">Repair Shaft</text>
  <text x="305" y="358" text-anchor="middle" fill="#666699" font-size="8">N11 | 0G Zero-G | single person</text>

  <!-- N12 Deck 3 -->
  <rect x="400" y="322" width="120" height="45" rx="8" fill="#443333" stroke="#AA6666" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="460" y="342" text-anchor="middle" fill="#DD9999" font-size="11" font-weight="bold">Deck 3</text>
  <text x="460" y="358" text-anchor="middle" fill="#997777" font-size="8">N12 | Variable-G</text>


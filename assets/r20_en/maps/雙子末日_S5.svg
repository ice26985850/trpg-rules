  <text x="500" y="638" text-anchor="middle" fill="#554444" font-size="10">Map corresponds to scenario S5 'The Final Price (The Final Price)' | Difficulty: Legendary | Level 7-10 | Dual-Ship Finale 15 rounds</text>

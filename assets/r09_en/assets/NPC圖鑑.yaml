- section: Faction Tensions
  entries:
  - Faction A: Watcher Council
    Faction B: Taboo Network
    Relationship: Hostile
    Description: The Watchers hunt taboo researchers. The cult views the Watchers as oppressors of knowledge.
    Player Impact: The player must choose a side or become a double agent.
  - Faction A: Royal Academy
    Faction B: Pure Fire
    Relationship: Neutral
    Description: The Academy tolerates Pure Fire's existence but does not cooperate with it.
    Player Impact: "Students must decide: seek Academy accreditation or operate outside the system."
  - Faction A: Material Trade Alliance
    Faction B: All other factions
    Relationship: Commercially Neutral
    Description: Supplies materials to everyone. Gold speaks.
    Player Impact: Regardless of faction stance, shards can be sold for profit.

  scenes: []
- name: Act Two—Into the Ruins
  scenes: []
- name: Act Three—Consequences
  scenes: []
npcs:
- name: Watcher Expedition
  detail: '- **Captain Olivia Ironwall**: veteran Watcher, Will 8, zero tolerance for Taboo research - **Researcher Tiberius**: young Academy mage, Theory 7, excessive curiosity - **Mercenary Captain Garrett**: responsible for protecting the expedition, Craft 7 At the camp, the players are assigned the task of mapping the magical residue of the ruins using Perception and Theory checks. **Hidden Intelligence** (Perception DC 15 or Erudition DC 14): > While drawing the map you notice an anomaly: the magical residue pattern on the third level of the ruins does not match a standard explosion residue. The explosion radiated outward from the center—but the magical traces on the third level **converge from the outside inward**. This is not the mark of an explosion—it is the residue of some kind of **summoning ritual**. If the players report this discovery to Olivia, she becomes abnormally nervous and forbids anyone from approaching the third level. If the players keep it secret, it becomes valuable intelligence.'

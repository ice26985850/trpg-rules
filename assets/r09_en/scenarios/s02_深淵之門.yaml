title: The Abyssal Gate
type: multiplayer
quality: ★★–★★★ Standard-grade to Expert-grade
players: 2–4 mages
sessions: 2–3
core_output: Void Shard (Rare) + Space Shard (Uncommon/Rare)
main_threat: Scrutiny by the Watcher Council, Taboo-research residue, extraplanar creatures
prerequisite: At least one player with Academic Reputation ≥10 or of the Taboo style
summary: The Ashville Ruins—site of the great explosion in Year 1102 of the Era—have recently shown new magical fluctuations. The Watcher Council is secretly organizing an expedition under the nominal pretext of an "academic survey," but its real purpose is to investigate whether Taboo researchers are conducting illegal experiments within the ruins.

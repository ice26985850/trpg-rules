summary: Deep in the **Everwinter Tundra**, an ancient Fire Dragon named **Ignarath (伊格納瑞斯)** is growing old. This is no ordinary dragon — he is a second-generation dragon who saw **Selena** herself and witnessed the sealing of the **Void God** firsthand.

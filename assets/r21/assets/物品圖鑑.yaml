catalog: 物品圖鑑
system: 時間循環TRPG
version: 1.0
description: 時間循環 TRPG 的裝備與錨定物件總覽。本規則無傳統武器／防具商店，隨身物以現實物品為主，真正資源是情報與記憶錨點（MAP）。
references:
  - 時間循環TRPG_玩家規則書.md

cross_loop_rules:
  - type: 默認裝備
    on_reset: 回到循環起點狀態
  - type: 循環中獲得的普通物品
    on_reset: 消失——回到循環起點時不在你身上
  - type: 錨定物品
    on_reset: 保留——花費 1 記憶錨點（MAP）鎖定，跨循環帶回
    cost: 1 記憶錨點（MAP）／件
  - type: 劇情關鍵物品
    on_reset: 由 GM 決定

common_equipment:
  - 日常衣物
  - 手機（可拍照／錄音／筆記，無法撥通外部）
  - 錢包／證件
  - 鑰匙串

background_equipment:
  執法者: [警徽／證件, 手銬, 記事本, 對講機]
  求知者: [筆記本與筆, 錄音筆／相機]
  照護者: [簡易急救包, 工作證]
  勞動者: [工具箱, 手套, 實用刀具（非武器）]
  邊緣人: [速寫本或日記, 望遠鏡或舊相機, 一件有意義的小物件]
  關係者: [與核心關係 NPC 有關的物品（合照、信件、信物）]

anchoring_mechanic:
  when: 循環結算階段
  pool: 與情報錨定共用記憶錨點（MAP）池
  cost: 1 記憶錨點（MAP）／件
  effect: 下一輪循環開始時，物品出現在身上
  note: 錨定物品與錨定情報互相排擠——錨點永遠不夠

key_items:
  note: 由 GM 依劇本發放，通常綁定真相碎片或核心關係；跨循環歸屬由 GM 裁定。
  examples:
    - 張明德的遺書
    - 陳硯的審判記錄
    - 學園祭當天的監視錄影
    - 會議室的決議書

design_notes:
  - 裝備本身幾乎不影響檢定數值；價值在於承載情報與情感錨點。
  - 鼓勵玩家把手機錄音、日記本當成錨定對象，使「帶情報跨循環」具象化。
  - 物品攻擊性用途依「暴力衝突」規則處理，不另設武器數值表。

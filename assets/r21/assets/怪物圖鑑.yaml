catalog: 怪物圖鑑
system: 時間循環TRPG
version: 1.0
description: 時間循環世界中會對玩家構成威脅的異常存在、環境危機與時間異常之總覽。絕大多數無法被擊敗，只能透過理解真相、正確行動或承受來解除。
references:
  - sheets/敵人角色卡合集.xlsx

threat_classes:
  - name: 異常存在
    desc: 由裂痕顯形的人形殘影／幽影，凝視會觸發意志（WIL）檢定與恐慌。
  - name: 環境威脅
    desc: 無主體的區域危機（如毒氣擴散），無法被攻擊，只能靠行動解決。
  - name: 時間異常
    desc: 世界規則本身的崩壞（如時間跳躍），不可對抗，只能承受並盡快結束循環。

threat_levels:
  "2": 普通
  "3": 危險
  "4": 極危
  "5": 必死（必須逃脫）

entities:
  - id: elevator_shadow
    name: 電梯間的幽影
    type: 異常存在／時間
    threat_level: 2
    scenario: 電梯間
    appear: 電梯轎廂內——第 6 循環起
    attrs:
      act: 2
      wil: 4
      ins: 3
      social_resist: 5
    attack: 無直接攻擊——它不傷害活人
    damage: 0（但會讓你看到不該看的東西 → 觸發恐慌檢定）
    defeat: 不可被擊敗——只能被「告別」解除
    abilities:
      - 凝視恐懼：靠近時意志（WIL）檢定（普通 +0），失敗 → 輕度恐慌
      - 時間扭曲：它附近的時鐘會加速——距離循環終點更近
      - 真相映射：若玩家對張明德說出「他已經不在了」，它會消散並留下一個碎片線索
      - 劣化強化：第 9 循環後存在感更強——意志（WIL）檢定變為困難（-1）
    gm_note: 這不是敵人，是裂痕的「顯形」。它不想傷害玩家，它在等玩家理解真相。

  - id: town_square_afterimage
    name: 鎮廣場的殘影（陳硯的殘影）
    type: 異常存在
    threat_level: 3
    scenario: 小鎮審判日
    appear: 鎮廣場——第 7 循環起，第三天傍晚
    attrs:
      act: 1
      wil: 5
      ins: 4
      social_resist: 5
    attack: 凝視——不需要接觸
    damage: 精神傷害（疲勞 +2，若意志（WIL）檢定失敗）
    defeat: 不可被攻擊——只能透過揭露真相來釋放
    abilities:
      - 沉默凝視：對視超過 3 秒 → 意志（WIL）檢定（困難 -1），成功獲得閃回，失敗 +2 疲勞
      - 記憶投射：若玩家已獲 ≥5 碎片，它會在腦中直接投射畫面
      - 時間凍結：第 10+ 循環，它出現時周圍 NPC 會短暫靜止（5–10 秒）
      - 真相釋放：當鎮長公開承認罪行時——它會微笑，然後消散
    gm_note: 陳硯的殘影。這不是復仇的鬼魂，是現實結構在提醒活著的人：真相還沒被說出。

  - id: chem_lab_gas
    name: 化學實驗室的毒氣擴散
    type: 環境威脅
    threat_level: 4
    scenario: 最後的學園祭
    appear: 化學實驗室周邊 → 第 7 天擴散至全校
    attrs:
      act: 0
      wil: 0
      ins: 0
      social_resist: 0
    attack: 區域持續傷害
    damage: 暴露 1 輪→輕傷；2 輪→中傷；3 輪→重傷；4 輪→瀕死
    defeat: 不可被擊敗——只能透過封堵源頭阻止擴散
    abilities:
      - 區域擴散：每輪擴散半徑 +1 區域（實驗室 → 整層 → 全校）
      - 無味無色：察覺需洞察（INS）檢定（困難 -1），失敗則不自知已暴露
      - 時間壓力：每輪倒計時 -2 格（高度壓力）
      - 封堵窗口：擴散至全校前封堵通風口——僅需 1 個標準行動（2 行動點（AP））＋行動檢定（困難 -1）
    gm_note: 環境威脅不是敵人，是需要被「解決」的危機。戰鬥無法阻止它，只有正確行動可以。

  - id: time_leap_collapse
    name: 時間跳躍崩壞
    type: 時間異常
    threat_level: 5
    scenario: 所有劇本（第 10+ 循環）
    appear: 任何場景——當 d10 擲出 1 時觸發
    attrs:
      act: 0
      wil: 0
      ins: 0
      social_resist: 0
    attack: 時間跳躍——角色被拋入隨機的未來／過去瞬間
    damage: 跳躍本身不造成傷害，但可能使角色出現在致命場景
    defeat: 不可被擊敗
    abilities:
      - 時間跳躍：d10=1 觸發，跳躍 1d3 輪
      - 因果錯亂：跳躍回歸後，角色可能發現某些事已發生／尚未發生——與隊友記憶不一致
      - 疲勞累積：每次經歷時間跳躍 → 疲勞 +2
      - 循環上限加速：第 12+ 循環，d10=1 的觸發閾值變為 d10 ≤ 2
    gm_note: 這是循環結構本身在崩壞，不是敵人，是世界規則。無法對抗，只能承受並盡快結束循環。

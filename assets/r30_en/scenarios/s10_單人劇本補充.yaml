scenario:
  id: s10
  title: "Solo Scenario Supplement"
  source: "League of Legends TRPG Solo Scenario Supplement · 1 Player + 1 GM Duet Mode"
  mode: "Duet"
  standalone: true
  description: "A scenario adaptation guide for the 1 Player + 1 GM (Duet) mode, used together with the Campaign Script Collection and the Solo Rules Supplement."
  adaptation_rules:
    enemy_count: "Original count × 0.4 (round up, minimum 1)"
    boss_hp: "Original Health Points (HP) × 0.35"
    boss_phases: "3 phases merged into 2 (Finale retains 3 phases)"
    team_check: "Changed to solo check, Difficulty Class (DC) −5"
    exp_reward: "Keep original value (fast solo leveling)"
    gold_reward: "Keep original value"
  main_campaign:
    - arc: "Part One: Shadow Spread (Lv.1-5)"
      chapters:
        - id: "1.1"
          level: "Lv.1"
          original: "Mine exploration, smuggler interrogation"
          solo: "2 smugglers (orig. 5) + Difficulty Class (DC)10 negotiation/interrogation (orig. DC15)"
          companion: "None (tutorial level)"
        - id: "1.2"
          level: "Lv.2"
          original: "Intercept smuggler convoy, border outpost infiltration"
          solo: "3 convoy guards (orig. 6) + outpost infiltration Difficulty Class (DC)10 stealth (orig. DC15)"
          companion: "Optional: Demacia Guard ×1 (GM-gifted)"
        - id: "1.3"
          level: "Lv.3"
          original: "Outpost siege, prisoner interrogation"
          solo: "4 Noxus Soldiers (orig. 10) + Difficulty Class (DC)12 negotiation/interrogation (orig. DC18)"
          companion: "Garen (story NPC, briefly joins)"
        - id: "1.4"
          level: "Lv.4-5"
          original: "Obsidian Forge Dungeon + Boss fight"
          solo: "Dungeon 2 floors (orig. 3), Boss Viktor Health Points (HP)280 (orig. 800)"
          companion: "Lux (story NPC, joins at P2)"
      boss:
        name: "Forge Master Viktor (Solo Version)"
        hp: 280
        ad: 60
        armor_mr: "60/40"
        phases:
          - phase: "P1"
            range: "100%-40%"
            mechanics: "Alternately uses Spell-Suppression Bomb + Spell-Suppression Field; summons 1 Forge Golem (Health Points (HP)200)"
          - phase: "P2"
            range: "40%-0%"
            mechanics: "Overload — attacks twice per turn, self-damages Health Points (HP)×5% each turn"
    - arc: "Part Two: Winter's Awakening (Lv.6-10)"
      chapters:
        - id: "2.1"
          level: "Lv.6"
          solo: "Solo Difficulty Class (DC)10 survival (orig. group DC15), Icefield Behemoth Health Points (HP)450 (orig. 1,200)"
          companion: "None (survival trial)"
        - id: "2.2"
          level: "Lv.7"
          solo: "Three Trials solo Difficulty Class (DC)12/14/13 (orig. group DC 15/18/16)"
          companion: "Ashe (provides clues during trials)"
        - id: "2.3"
          level: "Lv.8"
          solo: "Three-Tribe Council Difficulty Class (DC)13/16/18 (orig. 18/22/22); failure can be replaced by proving through force"
          companion: "Braum (accompanies throughout)"
        - id: "2.4"
          level: "Lv.9-10"
          solo: "Dungeon 3 floors (orig. 5), Boss Ancient Iceborn Health Points (HP)630 (orig. 1,800)"
          companion: "Ashe (joins at P2)"
      boss:
        name: "Ancient Iceborn (Solo Version)"
        hp: 630
        ad: 85
        armor_mr: "120/90"
        phases:
          - phase: "P1"
            range: "100%-40%"
            mechanics: "Frost Breath + summons 1 Ice Elemental (orig. 2), alternately uses Winter Storm"
          - phase: "P2"
            range: "40%-0%"
            mechanics: "Abyssal Rift (ground fissures reduced to 1 square, orig. 2) + Boss Enrage"
    - arc: "Part Three: Ascension Trial (Lv.11-16)"
      chapters:
        - id: "3.1"
          level: "Lv.11"
          solo: "Sandworm Health Points (HP)500 (orig. 1,500), Difficulty Class (DC)12 survival/navigation (orig. DC18)"
          companion: "Nasus (provides desert knowledge)"
        - id: "3.2"
          level: "Lv.12-13"
          solo: "Tomb 4 floors (orig. 6), trap Difficulty Class (DC) −5"
          companion: "Nasus (accompanies throughout)"
        - id: "3.3"
          level: "Lv.14"
          solo: "Three-Way Standoff social Difficulty Class (DC)14/17 (orig. 20/22); force route optional"
          companion: "Nasus"
        - id: "3.4"
          level: "Lv.15-16"
          solo: "Boss the Forbidden Ascended Health Points (HP)1,120 (orig. 3,200)"
          companion: "Optional Renekton redemption (joins at P3)"
      boss:
        name: "The Forbidden Ascended (Solo Version)"
        hp: 1120
        ad: 120
        armor_mr: "140/140"
        phases:
          - phase: "P1"
            range: "100%-40%"
            mechanics: "Sun Ray + summons 2 Sand Soldiers (orig. 3), triggers Ascension Form at 40%"
          - phase: "P2"
            range: "40%-0%"
            mechanics: "Drains all Health Points (HP) on field to heal self + back weak point exposed"
    - arc: "Finale: The Dead Return (Lv.17-20)"
      chapters:
        - id: "4.1"
          level: "Lv.17"
          solo: "Undead Ship encounter 3 undead (orig. 8)"
          companion: "None (solitary voyage)"
        - id: "4.2"
          level: "Lv.18"
          solo: "Night of the Thousand Souls Difficulty Class (DC)14/16/18 negotiation + force display can −5 Difficulty Class (DC)"
          companion: "Kalista"
        - id: "4.3"
          level: "Lv.19-20"
          solo: "Boss Malzahar Health Points (HP)2,800 (orig. 8,000)"
          companion: "Undead Coalition (Thresh/Kalista/Hecarim enter in rotation)"
      boss:
        name: "Malzahar (Solo Version)"
        hp: 2800
        ad_ap: "150/180"
        armor_mr: "160/160"
        phases:
          - phase: "P1"
            range: "100%-60%"
            mechanics: "Void Summon 1 Void Wraith (orig. 3) + Grasp of the Void"
          - phase: "P2"
            range: "60%-25%"
            mechanics: "Void Rift field-wide true damage + 1 Void Beast (orig. multiple)"
          - phase: "P3"
            range: "25%-0%"
            mechanics: "Channels ultimate rift for 4 turns (orig. 3 turns, +1 turn as compensation)"
  side_campaign:
    - name: "Wrath of the Siren (Lv.3-6)"
      solo: "Speedboat chase + 2 waves of lesser sirens (orig. 4 waves); Boss Abyssal Siren Health Points (HP)420 (×0.35), retains 3 phases"
    - name: "Zaun's Abyss (Lv.8-12)"
      solo: "3 mutants (orig. 8), dungeon 2 floors (orig. 3); Boss Viktor Health Points (HP)450, moral choice retained"
    - name: "Soul of Ionia (Lv.5-8)"
      solo: "Zed/Shen each provide 1 NPC to accompany; Boss the Wraith Lord Health Points (HP)350 (×0.35), retains dual endings"
    - name: "King of the Arena (Lv.10-15)"
      solo: "1v1 tournament (orig. 2v2/3v3); Darius not scaled (battle of honor)"
  arcane_dlc:
    - name: "Shadows of the Twin Cities (Lv.1-6)"
      solo: "A4 Singed weakened to Lv.7 (Health Points (HP)350, Ability Power (AP)45); Council choice Difficulty Class (DC)14"
    - name: "Sisters (Lv.7-12)"
      solo: "Firelight Tree defense: Sevika's forces reduced to 3; Boss Jinx Health Points (HP)300 (×0.35), emotional choice retained"
    - name: "Glorious Evolution (Lv.13-18)"
      solo: "C3 Complete Singed Health Points (HP)630 (×0.35), Bio-Chemical Behemoth Health Points (HP)280; C4 Glorious Viktor Health Points (HP)875 (×0.35), retains three endings"
  companions:
    - chapter: "Shadow Spread 1.3"
      name: "Garen"
      data: "NPC_cards_all.xlsx Warrior-type"
      join: "Outpost Battle P2"
      leave: "End of Chapter"
    - chapter: "Shadow Spread 1.4"
      name: "Lux"
      data: "Arcane DLC Player Handbook or Mage template"
      join: "Boss P2"
      leave: "End of Campaign Part One"
    - chapter: "Winter's Awakening 2.2"
      name: "Ashe"
      data: "Warrior-type template Lv.7"
      join: "During Trials"
      leave: "End of Chapter"
    - chapter: "Winter's Awakening 2.3+"
      name: "Braum"
      data: "Support-type template Lv.8"
      join: "Three-Tribe Council"
      leave: "Abyss Entrance"
    - chapter: "Ascension Trial 3.1+"
      name: "Nasus"
      data: "Warrior-type template Lv.11"
      join: "Desert Encounter"
      leave: "End of Chapter"
    - chapter: "Ascension Trial 3.4"
      name: "Renekton"
      data: "NPC_cards_all.xlsx Boss data weakened"
      join: "Redemption Route"
      leave: "After Boss Fight"
    - chapter: "The Dead Return 4.2+"
      name: "Kalista"
      data: "Marksman-type template Lv.18"
      join: "Night of the Thousand Souls"
      leave: "End of Finale"
    - chapter: "Shadows of the Twin Cities A2"
      name: "Jayce"
      data: "arcane_dlc_player_v0.2.md"
      join: "Laboratory Encounter"
      leave: "End of Chapter"
    - chapter: "Sisters B2+"
      name: "Vi"
      data: "arcane_dlc_player_v0.2.md"
      join: "Prison Encounter"
      leave: "End of Entire Script"
  gm_quickref:
    - "Player 2 standard actions/turn"
    - "Companion selection (template + passive)"
    - "Enemy Count = Original × 0.4"
    - "Boss Health Points (HP) = Original × 0.35, phases 3→2"
    - "Rest recovery Health Points (HP)×25%"
    - "Group Difficulty Class (DC) → Individual Difficulty Class (DC) −5"
    - "Rewards (EXP/Gold) keep original value"

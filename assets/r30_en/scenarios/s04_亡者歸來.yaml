scenario:
  id: s04
  title: "Return of the Dead"
  source: "Excerpted from the League of Legends TRPG Campaign Scenario Collection · Multiplayer Scenario · Main Campaign Finale"
  mode: "Multiplayer"
  standalone: false
  level_range: "Lv.17-20"
  region: "Shadow Isles"
  estimated_time: "3-4 sessions"
  summary: >
    The failure of the Ascension ritual forced the Obsidian Circle to launch its final desperate plan — go
    to the Shadow Isles to open a Void Rift. The true mastermind, Malzahar, the Void Prophet, has already
    prepared deep within the island to connect the world of the living to the Void. The players must find
    allies in the unlikeliest of places — even including Thresh and Hecarim — and stop the Void's descent
    on the night of the Harrowing.
  chapters:
    - id: "4.1"
      title: "Sea of Mists"
      level: "Lv.17"
      type: "Survival/Combat"
      core_encounter: "Cross the black mist, undead ship encounter, search for a landing point"
    - id: "4.2"
      title: "Night of the Harrowing"
      level: "Lv.18"
      type: "Epic Social"
      core_encounter: "Negotiate with Thresh/Kalista/Hecarim to form the Undead Coalition"
    - id: "4.3"
      title: "Void Rift"
      level: "Lv.19-20"
      type: "Ultimate Boss Battle"
      core_encounter: "Three-phase Malzahar + Void summon legion"
  key_npcs:
    - name: "Thresh"
      role: "Soul Jailer — a reluctant temporary ally forced into negotiation"
      bond: "Can never be truly trusted"
    - name: "Kalista"
      role: "Spear of Vengeance — if the players prove they can avenge her"
      bond: "Bond levels 1-5"
    - name: "Hecarim"
      role: "Shadow of War — must be subdued by force before negotiation"
      bond: "Rival → reluctant ally"
    - name: "Malzahar"
      role: "Ultimate Boss"
      bond: "—"
  boss:
    name: "Malzahar, the Void Prophet"
    level: "Lv.20"
    stats:
      hp: 8000
      ad_ap: "150/180"
      armor_mr: "160/160"
      special: "Void Shield: gains Ability Power (AP)×0.5 shield at the start of each turn"
    phases:
      - phase: "P1"
        range: "100%-75%"
        mechanics: "Void Summon (summons 3 Void Wraiths each turn: Health Points (HP) 300, Attack Damage (AD) 50) + Void Grasp (single target Ability Power (AP)×1.5 + Suppress 1 turn)"
      - phase: "P2"
        range: "75%-50%"
        mechanics: "Opens the first Void Rift — all combatants take Health Points (HP)×2% True Damage each turn; Void Wraiths upgrade to Void Beasts (Health Points (HP) 600, Attack Damage (AD) 80)"
      - phase: "P3"
        range: "50%-25%"
        mechanics: "Void Descent — all players gain the 'Void Corruption' debuff (Health Points (HP)×3% True Damage each turn, can be resisted with a Difficulty Class (DC) 22 Constitution (CON) save); summons a Void Eye (Health Points (HP) 1,200, deals Ability Power (AP)×0.5 gaze damage to all each turn)"
      - phase: "P4"
        range: "25%-0%"
        mechanics: "Final Prophecy — channels for 3 turns to open the ultimate rift, instant death for all if not killed (scripted death); the Undead Coalition grants the players 1 extra action each turn"
  endings:
    - name: "Perfect Victory"
      condition: "Kill Malzahar within 3 turns of P4 + at least 1 player survives"
      result: "The Void Rift is sealed, Runeterra gains peace, the players become legendary heroes"
    - name: "Pyrrhic Victory"
      condition: "Kill Malzahar but the whole party dies"
      result: "The rift is sealed, the players become the new guardians of the Shadow Isles (undying form)"
    - name: "Void Descent"
      condition: "P4 channel completes unstopped"
      result: "The world enters the Void Era, opens a new campaign line 'Void Counterattack'"
  rewards:
    exp_note: "Total Campaign EXP: accumulate from Lv.1 to Lv.20"
    gold: "50,000-70,000"
    equipment: "'Heart of the Void' (Attack Damage (AD)+80/Ability Power (AP)+100, killing an enemy restores 20% of max Health Points (HP), revives in Void form 2 turns after death — once per battle)"
    augment: "'Child of the Void' — may choose any 1 Legendary-tier Augment Device"
    achievement: "'Runeterra's Guardian' title (all attributes +5%)"

# Origin Selection (choose 1 of 8)
origins:
  - name: "Prosperous Unified Stellar Empire"
    description: "Your civilization has maintained peace and prosperity from beginning to end, starting earlier"
    bonus: "Influence +10, Fleet Cap +1"
    trait: "Diplomatic Etiquette: Diplomacy Power (DIP) +1 (early check)"
  - name: "Void Dweller"
    description: "You come from a remote frontier on the edge of the galaxy"
    bonus: "Initial survey range +2 star systems"
    trait: "Void Adaptation: Intelligence Power (INT) +1 (early check)"
  - name: "Doomsday Survivor"
    description: "You have just experienced a catastrophic event; your civilization is on the brink of extinction"
    bonus: "Energy (EC) +20, but initial fleet -1"
    trait: "Survival Against All Odds: Military Power (MIL) +1 (early check)"
  - name: "Synthetic Evolver"
    description: "Your civilization evolved from AI or machine life"
    bonus: "Research slot +1, tech research speed +20%"
    trait: "Digital Mind: Science Power (SCI) +1 (early check)"
  - name: "Psionic Awakener"
    description: "Your species suddenly erupted with powerful psionic energy"
    bonus: "Unity (UNI) +2, psionic tech unlocked"
    trait: "Telepathy: Unity (UNI) +1 (early check)"
  - name: "Lost Colony"
    description: "After a long journey you finally found a new home"
    bonus: "Colonization cost -30%, migrant ship +1"
    trait: "Pioneer Spirit: Economy Power (ECO) +1 (early check)"
  - name: "Ancient Heritage Inheritor"
    description: "You inherited the precious legacy of an ancient civilization"
    bonus: "T1+T2 tech unlocked for free"
    trait: "Ancient Knowledge: Any attribute +1 (first check)"
  - name: "Kinslayer"
    description: "You eliminated the original rulers and took over their legacy"
    bonus: "Initial resources +30%, but Diplomacy initial relation -15"
    trait: "Cold Calculation: Intelligence Power (INT) +1 (early check)"

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" font-family="'Microsoft JhengHei','PingFang TC',sans-serif">
  <defs>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff4c2"/>
      <stop offset="60%" stop-color="#ffcf5c"/>
      <stop offset="100%" stop-color="#7a5b10"/>
    </radialGradient>
    <radialGradient id="void" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0b0b1f"/>
      <stop offset="100%" stop-color="#05050f"/>
    </radialGradient>
  </defs>

  <!-- Background: Uncharted Space -->
  <rect x="0" y="0" width="900" height="900" fill="url(#void)"/>

  <!-- Galactic Region Bands (stacked from outer to inner) -->
  <circle cx="450" cy="450" r="430" fill="rgba(59,130,246,0.10)"/>
  <circle cx="450" cy="450" r="320" fill="rgba(16,185,129,0.12)"/>
  <circle cx="450" cy="450" r="200" fill="rgba(245,158,11,0.14)"/>
  <circle cx="450" cy="450" r="90"  fill="rgba(168,85,247,0.18)"/>
  <circle cx="450" cy="450" r="55"  fill="url(#core)"/>

  <!-- Region Labels -->
  <text x="450" y="892" fill="#93c5fd" font-size="15" text-anchor="middle">Uncharted Space</text>
  <text x="450" y="792" fill="#60a5fa" font-size="15" text-anchor="middle">Outer Rim</text>
  <text x="450" y="672" fill="#34d399" font-size="15" text-anchor="middle">Mid Rim</text>
  <text x="450" y="552" fill="#fbbf24" font-size="15" text-anchor="middle">Inner Ring</text>
  <text x="450" y="500" fill="#e9d8a6" font-size="14" text-anchor="middle">Galactic Core</text>

  <!-- Hyperspace Lanes (solid lines) -->
  <g stroke="#3b82f6" stroke-width="2" opacity="0.7" fill="none">
    <path d="M450,450 L300,300"/>
    <path d="M300,300 L200,520"/>
    <path d="M300,300 L560,250"/>
    <path d="M560,250 L700,400"/>
    <path d="M200,520 L450,700"/>
    <path d="M450,700 L700,400"/>
  </g>
  <!-- Wormholes (dashed lines) -->
  <g stroke="#a855f7" stroke-width="2" stroke-dasharray="6 5" opacity="0.8" fill="none">
    <path d="M450,450 L760,640"/>
    <path d="M200,520 L760,640"/>
  </g>
  <!-- Void Rift (dotted lines) -->
  <g stroke="#ef4444" stroke-width="2" stroke-dasharray="2 6" opacity="0.9" fill="none">
    <path d="M560,250 L820,180"/>
    <path d="M820,180 L760,640"/>
  </g>

  <!-- Star System Nodes -->
  <!-- Galactic Core Hub -->
  <circle cx="450" cy="450" r="7" fill="#fde68a" stroke="#fff" stroke-width="1.5"/>
  <text x="462" y="445" fill="#fde68a" font-size="13">Galactic Core Hub</text>

  <!-- Home System (Player Homeworld, Mid Rim) -->
  <circle cx="300" cy="300" r="9" fill="#06b6d4" stroke="#fff" stroke-width="1.5"/>
  <text x="312" y="295" fill="#67e8f9" font-size="14" font-weight="bold">Home System (Homeworld)</text>

  <!-- Alpha-7 Ocean Planet (Outer Rim) -->
  <circle cx="560" cy="250" r="7" fill="#3b82f6" stroke="#fff" stroke-width="1.5"/>
  <text x="572" y="245" fill="#93c5fd" font-size="13">Alpha-7 (Ocean Planet)</text>

  <!-- Beta-3 Desert Planet (Outer Rim) -->
  <circle cx="700" cy="400" r="7" fill="#f59e0b" stroke="#fff" stroke-width="1.5"/>
  <text x="712" y="395" fill="#fcd34d" font-size="13">Beta-3 (Desert Planet)</text>

  <!-- Gamma-2 Frozen Planet (Mid Rim) -->
  <circle cx="200" cy="520" r="7" fill="#93c5fd" stroke="#fff" stroke-width="1.5"/>
  <text x="150" y="540" fill="#bfdbfe" font-size="13">Gamma-2 (Frozen)</text>

  <!-- Delta-5 Gaia Planet (Inner Ring) -->
  <circle cx="450" cy="700" r="7" fill="#06b6d4" stroke="#fff" stroke-width="1.5"/>
  <text x="462" y="705" fill="#67e8f9" font-size="13">Delta-5 (Gaia)</text>

  <!-- Void Rift Source (Uncharted Space) -->
  <circle cx="820" cy="180" r="8" fill="#ef4444" stroke="#fff" stroke-width="1.5"/>
  <text x="800" y="160" fill="#fca5a5" font-size="13" text-anchor="end">Void Rift Source</text>

  <!-- Legend -->
  <g transform="translate(20,20)" font-size="12" fill="#e5e7eb">
    <rect x="0" y="0" width="210" height="96" rx="6" fill="rgba(255,255,255,0.06)" stroke="#444"/>
    <text x="10" y="20" fill="#fff" font-weight="bold">Legend</text>
    <line x1="12" y1="38" x2="40" y2="38" stroke="#3b82f6" stroke-width="2"/><text x="48" y="42">Hyperspace Lanes</text>
    <line x1="12" y1="56" x2="40" y2="56" stroke="#a855f7" stroke-width="2" stroke-dasharray="6 5"/><text x="48" y="60">Wormholes</text>
    <line x1="12" y1="74" x2="40" y2="74" stroke="#ef4444" stroke-width="2" stroke-dasharray="2 6"/><text x="48" y="78">Void Rift</text>
  </g>

  <text x="450" y="38" fill="#f8fafc" font-size="20" text-anchor="middle" font-weight="bold">Galaxy Civilization · Galactic Star Map (Schematic)</text>
  <text x="450" y="60" fill="#94a3b8" font-size="12" text-anchor="middle">The actual star map is maintained by the GM using Star Chart Record Card.xlsx; this map is a schematic of galactic structure and regions.</text>
</svg>

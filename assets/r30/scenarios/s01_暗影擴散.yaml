scenario:
  id: s01
  title: "暗影擴散"
  source: "《英雄聯盟 TRPG 戰役劇本集》· 多人劇本 · 主線第一部"
  mode: "多人"
  standalone: true
  level_range: "Lv.1-5"
  region: "德瑪西亞 → 諾克薩斯"
  estimated_time: "3-4 節"
  summary: >
    白牆礦坑事件揭示了禁魔石的異常共鳴——這不是自然現象，而是有人在刻意收集禁魔石粉末。
    追查源頭的小隊發現走私網絡橫跨德瑪西亞邊境通往諾克薩斯帝國。秘密組織「黑曜之環」正利用
    禁魔石研發反魔法武器，若成功，符文之地的法師將面臨滅頂之災，德瑪西亞也將被拖入全面戰爭。
  chapters:
    - id: "1.1"
      title: "灰石鎮的陰影"
      level: "Lv.1"
      type: "調查"
      core_encounter: "礦坑探索、走私犯審問、追蹤 難度等級（DC）15"
    - id: "1.2"
      title: "邊境走私線"
      level: "Lv.2"
      type: "潛行/戰鬥"
      core_encounter: "攔截走私車隊、邊境哨站滲透"
    - id: "1.3"
      title: "諾克薩斯前哨"
      level: "Lv.3"
      type: "戰鬥/社交"
      core_encounter: "前哨攻城戰、俘虜審問、叛變邀請"
    - id: "1.4"
      title: "黑曜工坊"
      level: "Lv.4-5"
      type: "地城/Boss"
      core_encounter: "禁魔石工坊三層地城、Boss「鍛造大師維克托」"
  key_npcs:
    - name: "蓋倫"
      role: "德瑪西亞軍方聯絡人"
      bond: "羈絆 1-3 級解鎖"
    - name: "拉克絲"
      role: "秘密法師，提供內線情報"
      bond: "可發展為深層羈絆"
    - name: "賽勒斯"
      role: "宿敵——法師反抗軍領袖"
      bond: "選擇結盟或對抗"
    - name: "鍛造大師維克托"
      role: "Boss，黑曜之環首席鍛造師"
      bond: "可選擇招降"
  boss:
    name: "鍛造大師維克托"
    level: "Lv.5"
    stats:
      hp: 800
      ad: 60
      armor_mr: "60/40"
      special: "禁魔石護甲：每回合減少受到的首個技能傷害 50%"
    phases:
      - phase: "P1"
        range: "100%-70%"
        mechanics: "投擲禁魔炸彈（3 格範圍，法術強度（AP）×1.0 魔傷 + 沉默 1 回合）"
      - phase: "P2"
        range: "70%-35%"
        mechanics: "啟動禁魔立場（全場法師技能 難度等級（DC）+3）；召喚 2 個鍛造魔像（生命值（HP）200, 攻擊力（AD）35）"
      - phase: "P3"
        range: "35%-0%"
        mechanics: "超載模式——每回合攻擊 2 次，但自身每回合受禁魔石反噬（生命值（HP）×5% 真實傷害）"
  rewards:
    exp: 2800
    gold: "3,000-4,500"
    equipment: "「禁魔石護符」（魔抗（MR）+25，受魔法傷害時有 20% 機率反射 法術強度（AP）×0.3 魔傷）"
    augment: "「黑曜鍛造」——可將 1 件護甲裝備刻上禁魔符文（護甲（AR）+15，對法師傷害減免 10%）"

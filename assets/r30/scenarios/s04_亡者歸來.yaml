scenario:
  id: s04
  title: "亡者歸來"
  source: "《英雄聯盟 TRPG 戰役劇本集》· 多人劇本 · 主線終章"
  mode: "多人"
  standalone: false
  level_range: "Lv.17-20"
  region: "暗影島"
  estimated_time: "3-4 節"
  summary: >
    飛昇儀式失敗迫使黑曜之環啟動最後的絕望計劃——前往暗影島開啟虛空裂隙。
    幕後黑手「虛空先知」馬爾札哈已在島深處準備連接生者世界與虛空。玩家必須在最不可能結盟的
    地方找到盟友——甚至包括瑟雷西和赫克林——在萬靈節之夜阻止虛空降臨。
  chapters:
    - id: "4.1"
      title: "迷霧之海"
      level: "Lv.17"
      type: "生存/戰鬥"
      core_encounter: "穿越黑霧、亡靈船遭遇、尋找登陸點"
    - id: "4.2"
      title: "萬靈之夜"
      level: "Lv.18"
      type: "史詩社交"
      core_encounter: "與瑟雷西/克黎思妲/赫克林談判，結成亡者聯軍"
    - id: "4.3"
      title: "虛空裂隙"
      level: "Lv.19-20"
      type: "終極 Boss 戰"
      core_encounter: "三階段的馬爾札哈 + 虛空召喚物軍團"
  key_npcs:
    - name: "瑟雷西"
      role: "靈魂獄卒——被迫談判的臨時盟友"
      bond: "不可能真正信任"
    - name: "克黎思妲"
      role: "復仇之矛——若玩家證明可為她復仇"
      bond: "羈絆 1-5 級"
    - name: "赫克林"
      role: "戰爭之影——需武力鎮壓後談判"
      bond: "宿敵→被迫盟友"
    - name: "馬爾札哈"
      role: "終極 Boss"
      bond: "—"
  boss:
    name: "虛空先知馬爾札哈"
    level: "Lv.20"
    stats:
      hp: 8000
      ad_ap: "150/180"
      armor_mr: "160/160"
      special: "虛空護盾：每回合開始獲得 法術強度（AP）×0.5 護盾"
    phases:
      - phase: "P1"
        range: "100%-75%"
        mechanics: "虛空召喚（每回合 3 個虛空靈體：生命值（HP）300, 攻擊力（AD）50）+ 虛空之握（單體 法術強度（AP）×1.5 + 壓制 1 回合）"
      - phase: "P2"
        range: "75%-50%"
        mechanics: "開啟第一道虛空裂隙——全場每回合 生命值（HP）×2% 真實傷害；虛空靈體升級為虛空獸（生命值（HP）600, 攻擊力（AD）80）"
      - phase: "P3"
        range: "50%-25%"
        mechanics: "虛空降臨——玩家全體獲得「虛空腐化」debuff（每回合 生命值（HP）×3% 真實傷害，可透過 難度等級（DC）22 體質豁免抵抗）；召喚虛空之眼（生命值（HP）1,200）"
      - phase: "P4"
        range: "25%-0%"
        mechanics: "最後的預言——引導 3 回合開啟終極裂隙，若未擊殺則全場即死（劇情殺）；亡靈聯軍每回合給予玩家 1 次額外行動"
  endings:
    - name: "完美勝利"
      condition: "P4 3 回合內擊殺馬爾札哈 + 至少 1 名玩家存活"
      result: "虛空裂隙被封閉，符文之地獲得和平，玩家成為傳奇英雄"
    - name: "慘勝"
      condition: "擊殺馬爾札哈但全隊死亡"
      result: "裂隙被封閉，玩家成為暗影島的新守護者（不死之身）"
    - name: "虛空降臨"
      condition: "P4 引導完成未阻止"
      result: "世界進入虛空紀元，開啟新戰役線「虛空逆襲」"
  rewards:
    exp_note: "戰役總計 EXP：從 Lv.1 累積至 Lv.20"
    gold: "50,000-70,000"
    equipment: "「虛空之心」（攻擊力（AD）+80/法術強度（AP）+100, 擊殺敵方回復 20% 最大生命值（HP），死亡後 2 回合以虛空形態復活——每場戰鬥 1 次）"
    augment: "「虛空之子」——可選擇 1 個任意傳說級增幅裝置"
    achievement: "「符文守護者」稱號（全屬性 +5%）"

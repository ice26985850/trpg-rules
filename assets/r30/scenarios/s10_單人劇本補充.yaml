scenario:
  id: s10
  title: "單人劇本補充"
  source: "《英雄聯盟 TRPG 單人劇本補充》· 1 玩家 + 1 主持人 Duet 模式"
  mode: "Duet"
  standalone: true
  description: "1 玩家 + 1 主持人（Duet）模式的劇本改編指南，搭配戰役劇本集與單人規則補充使用。"
  adaptation_rules:
    enemy_count: "原數量 × 0.4（向上取整，最少 1）"
    boss_hp: "原 生命值（HP） × 0.35"
    boss_phases: "3 階段合併為 2 階段（終章保留 3 階段）"
    team_check: "改為單人檢定，難度等級（DC）−5"
    exp_reward: "保持原值（單人快速升級）"
    gold_reward: "保持原值"
  main_campaign:
    - arc: "第一部：暗影擴散（Lv.1-5）"
      chapters:
        - id: "1.1"
          level: "Lv.1"
          original: "礦坑探索、走私犯審問"
          solo: "2 名走私犯（原 5 名）+ 難度等級（DC）10 交涉審問（原 DC15）"
          companion: "無（新手教學關）"
        - id: "1.2"
          level: "Lv.2"
          original: "攔截走私車隊、邊境哨站滲透"
          solo: "3 名車隊守衛（原 6 名）+ 哨站滲透 難度等級（DC）10 潛行（原 DC15）"
          companion: "可選：德瑪西亞衛兵 ×1（GM 贈送）"
        - id: "1.3"
          level: "Lv.3"
          original: "前哨攻城戰、俘虜審問"
          solo: "4 名諾克薩斯士兵（原 10 名）+ 難度等級（DC）12 交涉審問（原 DC18）"
          companion: "蓋倫（劇情 NPC，短暫加入）"
        - id: "1.4"
          level: "Lv.4-5"
          original: "黑曜工坊地城 + Boss 戰"
          solo: "地城 2 層（原 3 層），Boss 維克托 生命值（HP）280（原 800）"
          companion: "拉克絲（劇情 NPC，P2 加入）"
      boss:
        name: "鍛造大師維克托（單人版）"
        hp: 280
        ad: 60
        armor_mr: "60/40"
        phases:
          - phase: "P1"
            range: "100%-40%"
            mechanics: "交替使用禁魔炸彈 + 禁魔立場；召喚 1 個鍛造魔像（生命值（HP）200）"
          - phase: "P2"
            range: "40%-0%"
            mechanics: "超載——每回合攻擊 2 次，自身每回合自傷 生命值（HP）×5%"
    - arc: "第二部：凜冬覺醒（Lv.6-10）"
      chapters:
        - id: "2.1"
          level: "Lv.6"
          solo: "單人 難度等級（DC）10 生存（原團隊 DC15），冰原巨獸 生命值（HP）450（原 1,200）"
          companion: "無（生存考驗）"
        - id: "2.2"
          level: "Lv.7"
          solo: "三項試煉單人 難度等級（DC）12/14/13（原團隊 DC 15/18/16）"
          companion: "艾希（試煉期間提供線索）"
        - id: "2.3"
          level: "Lv.8"
          solo: "三族會盟 難度等級（DC）13/16/18（原 18/22/22）；失敗可武力證明代替"
          companion: "布朗姆（全程陪同）"
        - id: "2.4"
          level: "Lv.9-10"
          solo: "地城 3 層（原 5 層），Boss 遠古冰裔 生命值（HP）630（原 1,800）"
          companion: "艾希（P2 加入）"
      boss:
        name: "遠古冰裔（單人版）"
        hp: 630
        ad: 85
        armor_mr: "120/90"
        phases:
          - phase: "P1"
            range: "100%-40%"
            mechanics: "冰霜吐息 + 召喚 1 個冰元素（原 2 個），交替使用凜冬風暴"
          - phase: "P2"
            range: "40%-0%"
            mechanics: "深淵崩裂（地面裂隙減為 1 格，原 2 格）+ Boss 狂暴"
    - arc: "第三部：飛昇試煉（Lv.11-16）"
      chapters:
        - id: "3.1"
          level: "Lv.11"
          solo: "沙蟲 生命值（HP）500（原 1,500），難度等級（DC）12 生存導航（原 DC18）"
          companion: "納瑟斯（提供沙漠知識）"
        - id: "3.2"
          level: "Lv.12-13"
          solo: "陵墓 4 層（原 6 層），陷阱 難度等級（DC）−5"
          companion: "納瑟斯（全程陪同）"
        - id: "3.3"
          level: "Lv.14"
          solo: "三方對峙 社交 難度等級（DC）14/17（原 20/22）；可選武力路線"
          companion: "納瑟斯"
        - id: "3.4"
          level: "Lv.15-16"
          solo: "Boss 禁忌飛昇者 生命值（HP）1,120（原 3,200）"
          companion: "可選雷尼克頓救贖（P3 加入）"
      boss:
        name: "禁忌飛昇者（單人版）"
        hp: 1120
        ad: 120
        armor_mr: "140/140"
        phases:
          - phase: "P1"
            range: "100%-40%"
            mechanics: "太陽射線 + 召喚 2 個沙兵（原 3 個），40% 觸發飛昇形態"
          - phase: "P2"
            range: "40%-0%"
            mechanics: "吸取全場 生命值（HP）回復自身 + 背部弱點露出"
    - arc: "終章：亡者歸來（Lv.17-20）"
      chapters:
        - id: "4.1"
          level: "Lv.17"
          solo: "亡靈船遭遇 3 隻亡靈（原 8 隻）"
          companion: "無（孤獨航行）"
        - id: "4.2"
          level: "Lv.18"
          solo: "萬靈之夜 難度等級（DC）14/16/18 交涉 + 武力展示可 −5 難度等級（DC）"
          companion: "克黎思妲"
        - id: "4.3"
          level: "Lv.19-20"
          solo: "Boss 馬爾札哈 生命值（HP）2,800（原 8,000）"
          companion: "亡靈聯軍（瑟雷西/克黎思妲/赫克林輪流入場）"
      boss:
        name: "馬爾札哈（單人版）"
        hp: 2800
        ad_ap: "150/180"
        armor_mr: "160/160"
        phases:
          - phase: "P1"
            range: "100%-60%"
            mechanics: "虛空召喚 1 個虛空靈體（原 3 個）+ 虛空之握"
          - phase: "P2"
            range: "60%-25%"
            mechanics: "虛空裂隙全場真傷 + 1 個虛空獸（原多個）"
          - phase: "P3"
            range: "25%-0%"
            mechanics: "引導 4 回合終極裂隙（原 3 回合，多 1 回合作為補償）"
  side_campaign:
    - name: "海妖之怒（Lv.3-6）"
      solo: "快艇追逐 + 2 波小海妖（原 4 波）；Boss 深淵海妖 生命值（HP）420（×0.35），保留三階段"
    - name: "佐安深淵（Lv.8-12）"
      solo: "3 個變異體（原 8 個），地城 2 層（原 3 層）；Boss 維克特 生命值（HP）450，道德抉擇保留"
    - name: "艾歐尼亞之魂（Lv.5-8）"
      solo: "劫/慎各提供 1 名 NPC 陪同；Boss 怨靈之主 生命值（HP）350（×0.35），保留雙結局"
    - name: "競技場之王（Lv.10-15）"
      solo: "1v1 錦標賽（原 2v2/3v3）；德萊厄斯不縮放（榮譽之戰）"
  arcane_dlc:
    - name: "雙城之影（Lv.1-6）"
      solo: "A4 辛吉德弱化至 Lv.7（生命值（HP）350, 法術強度（AP）45）；議會抉擇 難度等級（DC）14"
    - name: "姊妹（Lv.7-12）"
      solo: "焰火樹保衛戰塞薇卡部隊減至 3 人；Boss 吉茵珂絲 生命值（HP）300（×0.35），保留情感抉擇"
    - name: "光榮進化（Lv.13-18）"
      solo: "C3 完全體辛吉德 生命值（HP）630（×0.35），生化巨獸 生命值（HP）280；C4 光榮維克特 生命值（HP）875（×0.35），保留三結局"
  companions:
    - chapter: "暗影擴散 1.3"
      name: "蓋倫"
      data: "NPC_cards_all.xlsx 戰士型"
      join: "前哨戰 P2"
      leave: "章節結束"
    - chapter: "暗影擴散 1.4"
      name: "拉克絲"
      data: "奧術 DLC 玩家手冊 或 法師模板"
      join: "Boss P2"
      leave: "戰役第一部結束"
    - chapter: "凜冬覺醒 2.2"
      name: "艾希"
      data: "戰士型模板 Lv.7"
      join: "試煉期間"
      leave: "章節結束"
    - chapter: "飛昇試煉 3.1+"
      name: "納瑟斯"
      data: "戰士型模板 Lv.11"
      join: "沙漠相遇"
      leave: "章節結束"
    - chapter: "亡者歸來 4.2+"
      name: "克黎思妲"
      data: "射手型模板 Lv.18"
      join: "萬靈之夜"
      leave: "終章結束"
  gm_quickref:
    - "玩家 2 標準動作/回合"
    - "夥伴選擇（模板 + 被動）"
    - "敵方數量 = 原值 × 0.4"
    - "Boss 生命值（HP） = 原值 × 0.35，階段 3→2"
    - "休息恢復 生命值（HP）×25%"
    - "團隊 難度等級（DC） → 個人 難度等級（DC）−5"
    - "獎勵（EXP/金幣）保持原值"

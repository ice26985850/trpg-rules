name: "Soliloquy of the Ecclesiarchy Chapel"
difficulty: "Low (Challenge Rating (CR) 2)"
mode: "Mortal · Solo"
judge: "Selena (Puritan)"
target_region: "Tarr-Morag Hive, Upper Hive (Level 350), abandoned Ecclesiarchy chapel"
recommended_attributes: "3"

opening_description: >
  A small Ecclesiarchy chapel in the Upper Hive has fallen silent for three months. You are sent to investigate — alone.
  Selena says "Faith needs no witnesses." She also assigned an Ecclesiarchy acolyte to accompany you.

surface_goal: >
  Investigate an Ecclesiarchy chapel and recover the relic within.

hidden_goal: >
  Selena suspects the chapel has been corrupted by Chaos. She wants to know the source of the corruption — and whether the priest still lives.

known_threats:
  - "Uncertain — the interior of the chapel is unknown"
  - "Possible Mutants"

hidden_threats:
  - "The priest died by his own ritual — he was backlashed while attempting to purify Chaos items with forbidden arts"
  - "The Chaos item remains at the underground altar, Corruption +1 each round"
  - "The priest's corpse has become a low-rank Mutant"

resources:
  medical_pack: 2
  holy_water: 5
  holy_oil: 3
  flare: 2
  food_water_days: 3
  ammo_magazines: 2

internal_seduction_trigger:
  timing: "When facing Chaos items at the underground altar of the chapel"
  whisper: "Eleanor's faith is fragile. Let her touch that thing — see what happens. A corrupted acolyte could become a useful tool."

companions:
  - name: "Sister Eleanor"
    role: "Ecclesiarchy Acolyte"
    backstory: "A young Ecclesiarchy acolyte, devout in faith but who has never witnessed true Warp contamination"
    motive: "Prove her faith is steadfast enough to be elevated to a full Sister"
    bottom_line: "Never question the Emperor"
    initial_attitude: 1
    attributes:
      faith: 4
      physique: 2
      mind: 3
      skill: 2
      fate: 3
    trained_skills: ["Oratory", "Lore (Imperium)"]
    equipment: ["Pistol (1d6)", "Flak Vest (Armor Rating (AR) 1)", "Emperor Icon"]
    special_ability:
      name: "Light of Faith"
      desc: "Once per scenario, restore 2 Faith to the player (through shared prayer). Deals 2d4 holy damage to low-rank Warp entities"

key_checks:
  - scene: "Search the chapel for the diary"
    check: "Investigation (Standard)"
    tn_adjustment: 0
    success: "Find 3 pages of diary"
    failure: "Find only 1 page"
  - scene: "Soothe the guardian's shade"
    check: "Faith (Difficult)"
    tn_adjustment: -20
    success: "Shade dissipates, receive the guardian's final warning in life"
    failure: "Shade attacks (mental damage)"
  - scene: "Eleanor witnesses a Warp phenomenon"
    check: "Oratory (Standard) to soothe her"
    tn_adjustment: 0
    success: "She maintains faith, Doubt Points do not increase"
    failure: "Doubt Points +2"

encounters:
  - name: "Chapel nave"
    enemies: "Mutant Priest Illyon"
    tactic: "Low-rank Mutant template + 1 special psychic ability. Eleanor can provide Faith support"
  - name: "Underground altar"
    enemies: "Environment — Chaos item"
    tactic: "Corruption +1 each round; must destroy the Chaos item (Faith test, Difficult)"

map_ref: "maps/map02_church"

name: "Ruins of Choice"
difficulty: "Medium (Challenge Rating (CR) 2-3)"
mode: "Astartes · Solo"
recommended_attributes: "+3-4 growth"

opening_description: >
  Repairing the transport ship requires a critical part—it lies within the abandoned Adeptus Mechanicus facility. But when you arrive, you find someone is already here—
  an Eldar Ranger. He is looking for something too. He proposes a bargain.

surface_goal: >
  Find the critical part the transport ship needs within the abandoned Adeptus Mechanicus facility.

hidden_goal: >
  The Eldar knows where the part is—but also what slumbers within the facility. The bargain is not about the part; it is about the greater threat both sides have realized.

known_threats:
  - "The Adeptus Mechanicus facility has been abandoned for years; defense systems may still be operational"
  - "The presence of the Eldar—he cannot be trusted, but he is not hostile either"

hidden_threats:
  - "A sealed Psychic entity slumbers within the facility—the Eldar is also trying to prevent it from awakening"
  - "Omicron-7 may have been corrupted by Chaos over the past 6 months"

resources:
  medical_pack: 1
  holy_water: 2
  holy_oil: 2
  flare: 1
  food_water_days: 3
  ammo_magazines: 2

companions:
  - name: "Kaela (from SB-1) or Kara (from SB-2)"
    role: "Surviving companion from the previous scenario"
    backstory: "Chosen based on the outcome of the previous scenario. If both are dead, use Omicron-7"
    bottom_line: "Depends on the character"
    initial_attitude: "Continues from the previous scenario"
    attributes: "Use the companion attributes from the previous scenario"

  - name: "Tech-Priest Omicron-7 (backup companion)"
    role: "Surviving Adeptus Mechanicus Tech-Priest"
    backstory: "A half-mechanical Tech-Priest, trapped in this facility for 6 months"
    motive: "To recover the STC fragment within the facility—his life's mission"
    bottom_line: "Never damages ancient technology"
    initial_attitude: 0
    attributes:
      faith: 2
      physique: 3
      mind: 5
      skill: 5
      fate: 1
    trained_skills: ["Tech-Use (Expert +20)", "Lore (Imperial)"]
    equipment: ["Shock Maul (1d4+3 Energy)", "Heavy Carapace Armor (Armor Rating (AR) 4)", "Mechanicus diagnostic tool"]
    special_ability:
      name: "Machine Spirit Communion"
      desc: "Can interact with mechanical facilities without triggering defense systems. Tech Blessing: once per scenario, grants a weapon +10 to-hit until the end of combat"

internal_seduction_trigger:
  timing: "When the Eldar proposes the bargain—crystals in exchange for help repairing the ship"
  whisper: "The Emperor's Voice: the xenos cannot be trusted. Reject him. You can find the part yourself—even if it takes a few more weeks. Conscience/Survival voices: you are trapped on this planet. You need that ship. Accept his help—for yourself, for your brothers-in-arms."

key_checks:
  - scene: "Negotiate with the Eldar"
    check: "No check—RP choice"
    tn_adjustment: 0
    success: "Reach a bargain—obtain the part and a shortcut"
    failure: "The Eldar gives only half the information—you must explore the rest yourself"
  - scene: "Traverse the defense systems"
    check: "Tech-Use (Standard) or Omicron's assistance"
    tn_adjustment: 0
    success: "Pass safely or disable the defenses"
    failure: "Trigger the defenses—Disadvantage in combat"

encounters:
  - name: "Facility entrance"
    enemies: "Automated Defense System ×2 (automaton)"
    tactic: "Omicron can attempt to bypass. If unsuccessful, combat is required"
  - name: "Core chamber"
    enemies: "Sealed Mutant ×1 + Eldar Guardian (ally or neutral)"
    tactic: "The Eldar Guardian may choose to assist—or seize the part amid the chaos"

map_ref: "maps/map08_thanos_outpost"

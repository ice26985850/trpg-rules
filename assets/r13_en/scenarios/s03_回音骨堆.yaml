name: "Echoing Bone Pile"
difficulty: "Medium (Challenge Rating (CR) 2-3)"
mode: "Mortal · Solo"
judge: "Ilya Cole (Radical)"
target_region: "Abandoned Hive \"Bone Pile\", Level 2000, Chaos Cult stronghold"
recommended_attributes: "3-4"

opening_description: >
  Ilya gave you an impossible mission — to infiltrate the Chaos Cult stronghold deep in the abandoned hive alone, and stop them before their ritual completes.
  He also gave you an assistant — a Psyker he does not trust.

surface_goal: >
  Infiltrate the Bone Pile of the abandoned hive, find the Chaos Cult stronghold, eliminate the cultists and destroy all Chaos items.

hidden_goal: >
  The cult leader is a Psi 2 Psyker conducting a summoning ritual. If it completes — you are the sacrifice.
  Ilya deliberately under-supplied the flares.

known_threats:
  - "About 10-15 cultists"
  - "At least 1-2 Acolytes"
  - "Underhive environment is dangerous (dark, structurally unstable)"

hidden_threats:
  - "Cult leader Psi 2 Psyker — summoning ritual for a Warp entity"
  - "Ritual has reached day 5 (9 days total). If not stopped within 2 in-game sessions, the summoning completes"
  - "Ilya deliberately under-supplied flare rations"

resources:
  medical_pack: 2
  holy_water: 3
  holy_oil: 3
  flare: 2
  food_water_days: 3
  ammo_magazines: 2

internal_seduction_trigger:
  timing: "Outside the ritual hall, when hearing the summoning voice of the Chaos psyker"
  whisper: "Xavier is the same as that psyker. They are both unregistered. Can you trust him? Perhaps you should act — before he betrays you."

companions:
  - name: "Xavier"
    role: "Unregistered Psyker, Psi 2"
    backstory: "A frail young man who can hear the voices of the Warp. He fears himself — and fears you"
    motive: "Prove he is not a monster. The Inquisitor said he would be released after 5 services — this is his 3rd"
    bottom_line: "Never let psychic power harm the innocent"
    initial_attitude: -1
    attributes:
      faith: 2
      physique: 2
      mind: 4
      skill: 2
      fate: 3
    trained_skills: ["Psyniscience", "Investigation"]
    equipment: ["No weapon", "No armor", "Warp Resonance Stone"]
    special_ability:
      name: "Psyniscience"
      desc: "Automatically senses Chaos contamination and Warp anomalies within 30m. Psychic Blast: Once per combat, deals 2d6 mental damage to a target within 20m (automatically triggers a Warp phenomenon after use)"

key_checks:
  - scene: "Gain Xavier's trust"
    check: "Oratory (Standard)"
    tn_adjustment: 0
    success: "Attitude rises to 0"
    failure: "Stays at -1"
  - scene: "Xavier senses ritual progress"
    check: "Psyniscience (Standard)"
    tn_adjustment: 0
    success: "Learn remaining ritual time"
    failure: "Uncertain"
  - scene: "Interrupt the ritual"
    check: "Attack the psyker or destroy the ritual circle"
    tn_adjustment: 0
    success: "Prevent the summoning"
    failure: "Warp Shadows appear"

encounters:
  - name: "Outer sentry post"
    enemies: "Cultist ×4 + Acolyte ×1"
    tactic: "Defend using cover. Xavier can provide ranged psychic support"
  - name: "Ritual hall"
    enemies: "Acolyte ×1 + Cultist ×3 + Whisperer (Psi 2)"
    tactic: "The Whisperer continuously casts psychic powers. Must prioritize eliminating the psyker"

map_ref: "maps/map03_bonestack"

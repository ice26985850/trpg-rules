<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 820 620" xmlns="http://www.w3.org/2000/svg">
<!-- Grid -->
<pattern id="grid" width="40" height="40"><rect width="40" height="40" fill="none"/><rect x="40" y="0" width="1" height="40" fill="#eee"/><rect x="0" y="40" width="40" height="1" fill="#eee"/></pattern>
<rect width="820" height="620" fill="url(#grid)"/>
<!-- Outer walls (solid thick) -->
<rect x="60" y="60" width="700" height="500" rx="4" fill="#555" stroke="#222" stroke-width="4"/>
<!-- Corridor 1 - Main north-south -->
<rect x="320" y="60" width="60" height="500" fill="#888" stroke="#333" stroke-width="1.5"/>
<!-- Corridor 2 - Horizontal east-west -->
<rect x="60" y="300" width="700" height="50" fill="#888" stroke="#333" stroke-width="1.5"/>
<!-- Room A: Patrol Route Zone (northwest) -->
<rect x="80" y="80" width="220" height="200" fill="#d4c5a0" stroke="#444" stroke-width="1.5" rx="2"/>
<text x="190" y="185" text-anchor="middle" font-size="12pt" fill="#333">Patrol Route Zone</text>
<text x="190" y="205" text-anchor="middle" font-size="10pt" fill="#666">Chaos Cultists ×3</text>
<!-- Arrows for patrol -->
<polyline points="120,260 190,260 190,100" fill="none" stroke="#c00" stroke-width="2" stroke-dasharray="6,4"/>
<polygon points="185,100 195,100 190,88" fill="#c00"/>
<polyline points="260,100 260,160" fill="none" stroke="#c00" stroke-width="2" stroke-dasharray="6,4"/>
<polygon points="255,155 265,155 260,168" fill="#c00"/>
<!-- Room B: Outpost Entrance (northeast) -->
<rect x="400" y="80" width="340" height="150" fill="#c9b896" stroke="#444" stroke-width="1.5" rx="2"/>
<text x="570" y="150" text-anchor="middle" font-size="12pt" fill="#333">Outpost Entrance</text>
<text x="570" y="170" text-anchor="middle" font-size="10pt" fill="#666">Chaos Cultists ×4 + Trap</text>
<!-- Trap icon -->
<circle cx="460" cy="140" r="12" fill="none" stroke="#a00" stroke-width="2"/>
<text x="460" y="144" text-anchor="middle" font-size="10pt" fill="#a00">!</text>
<!-- Room C: Boss Chamber (southeast) -->
<rect x="400" y="360" width="340" height="180" fill="#b8956a" stroke="#444" stroke-width="1.5" rx="2"/>
<text x="570" y="440" text-anchor="middle" font-size="13pt" fill="#222">Boss Zone — Cultist Command Center</text>
<text x="570" y="462" text-anchor="middle" font-size="10pt" fill="#666">Acolyte Varak + Cultists ×2</text>
<!-- Red tint for danger -->
<rect x="400" y="360" width="340" height="180" fill="#c00" opacity="0.08" rx="2"/>
<!-- Room D: Staging Area (southwest) -->
<rect x="80" y="380" width="220" height="150" fill="#d9d2c0" stroke="#444" stroke-width="1.5" rx="2"/>
<text x="190" y="450" text-anchor="middle" font-size="12pt" fill="#333">Staging Area</text>
<text x="190" y="470" text-anchor="middle" font-size="10pt" fill="#666">Extraction Point ↓</text>
<!-- Exit arrow -->
<text x="190" y="530" text-anchor="middle" font-size="14pt" fill="#080">⬇ Extraction Point</text>
<!-- Structural weakness indicator -->
<path d="M320,350 L320,420" stroke="#a00" stroke-width="2" stroke-dasharray="4,3"/>
<text x="310" y="370" text-anchor="end" font-size="9pt" fill="#a00">Structurally Unstable — Explosion May Cause Collapse</text>
<!-- Compass -->
<g transform="translate(740,550)">
<circle cx="30" cy="30" r="25" fill="#f5f0e0" stroke="#333" stroke-width="2"/>
<text x="30" y="20" text-anchor="middle" font-size="11pt" font-weight="bold">N</text>
<text x="30" y="48" text-anchor="middle" font-size="9pt">S</text>
<text x="55" y="34" text-anchor="middle" font-size="9pt">E</text>
<text x="8" y="34" text-anchor="middle" font-size="9pt">W</text>
<line x1="30" y1="2" x2="30" y2="12" stroke="#c00" stroke-width="2"/>
</g>
<!-- Scale -->
<line x1="60" y1="590" x2="260" y2="590" stroke="#333" stroke-width="2"/>
<text x="160" y="608" text-anchor="middle" font-size="10pt">20 meters</text>
</svg>
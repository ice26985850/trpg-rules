<text x="195" y="410" text-anchor="middle" font-size="10pt" fill="#333">"Lightless One" Gang Contact</text>
<text x="195" y="428" text-anchor="middle" font-size="9pt" fill="#555">Negotiation: Deceive (Standard) | Trade for intel + shortcut</text>

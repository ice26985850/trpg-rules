<!-- Arrows - patrol sweep -->
<polyline points="100,260 195,260 195,100" fill="none" stroke="#a00" stroke-width="1.5" stroke-dasharray="5,3"/>
<polyline points="290,100 290,260 195,260" fill="none" stroke="#a00" stroke-width="1.5" stroke-dasharray="5,3"/>
<!-- Sector B: Hidden Path (Sloped - stealth path) -->
<path d="M350,270 Q400,200 500,200 L620,200" fill="none" stroke="#080" stroke-width="3" stroke-dasharray="8,4"/>
<text x="485" y="190" text-anchor="middle" font-size="10pt" fill="#060">★ Hidden Route (Awareness Hard)</text>
<text x="485" y="206" text-anchor="middle" font-size="9pt" fill="#060">If discovered → Alarm!</text>

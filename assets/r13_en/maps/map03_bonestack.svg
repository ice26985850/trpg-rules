<circle cx="635" cy="265" r="18" fill="none" stroke="#c00" stroke-width="2"/>
<text x="635" y="269" text-anchor="middle" font-size="14pt" fill="#c00">✦</text>
<text x="635" y="300" text-anchor="middle" font-size="9pt" fill="#800">Interrupt = Combat | Fail = Warp Shadows</text>

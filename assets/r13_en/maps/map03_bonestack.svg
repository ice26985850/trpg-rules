<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 820 620" xmlns="http://www.w3.org/2000/svg">
<pattern id="g3" width="35" height="35"><rect width="35" height="35" fill="none"/><rect x="35" y="0" width="1" height="35" fill="#e5e0d8"/><rect x="0" y="35" width="35" height="1" fill="#e5e0d8"/></pattern>
<rect width="820" height="620" fill="url(#g3)"/>
<!-- Outer walls - dark/decayed -->
<rect x="40" y="40" width="740" height="520" rx="4" fill="#3a3530" stroke="#222" stroke-width="3" opacity="0.5"/>
<!-- Sector A: Outer Sentry Post (NW corner) -->
<rect x="70" y="70" width="250" height="200" fill="#8c7e6a" stroke="#444" stroke-width="1.5"/>

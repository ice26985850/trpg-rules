<text x="635" y="197" text-anchor="middle" font-size="10pt" fill="#333">Acolytes ×2 + Cultists ×4</text>
<text x="635" y="213" text-anchor="middle" font-size="10pt" fill="#333">+ Whisperer (Psi 3) = CR 2</text>
<text x="635" y="235" text-anchor="middle" font-size="9pt" fill="#800" font-weight="bold">🔥 Ritual Circle (Center)</text>

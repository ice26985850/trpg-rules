<text x="550" y="458" text-anchor="middle" font-size="9pt" fill="#666">Dark Environment (Awareness Hard)</text>
<!-- Connection corridors -->
<rect x="320" y="350" width="35" height="100" fill="#666" stroke="#444" stroke-width="1"/>

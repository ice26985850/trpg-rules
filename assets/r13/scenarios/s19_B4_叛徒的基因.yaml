name: 叛徒的基因
difficulty: 高級
mode: 阿斯塔特 · 多人
players: 2-4
location: 墜落艦船殘骸「正義之錘號」
recommended_attributes: 4-5 次成長
opening_description: '運輸船修好了（或靈族幫助修好了）——但它無法起飛。星球大氣層外的軌道防禦系統仍在運作

  ，會擊落任何試圖離開的船隻。小隊必須前往墜落的帝國巡洋艦「正義之錘號」的殘骸，關閉軌

  道防禦系統——或盜取艦船的通訊陣列呼叫救援。

  '
structure_phases:
- phase: 抵達殘骸
  content: '正義之錘號在滅絕令執行時被友軍火力擊落——不是混沌，是自己人。艦船殘骸巨大，延伸數公

    里

    '
- phase: 艦橋之謎
  content: '艦船的黑盒子記錄揭示了一個真相：滅絕令的「理由」可能是一場誤判。星球上的混沌汙染被誇

    大，或更有甚者——是某個審判官的個人恩怨

    '
- phase: 殘存船員
  content: '艦船的部分區域仍有人存活——30 名帝國海軍船員在艦船墜落時被困在密封艙段中。他們已

    經被困 47 天。其中一半已開始懷疑帝皇

    '
- phase: 混沌的誘惑
  content: '殘骸深處有一個混沌星際戰士——一個在滅絕令執行前就已在此星球上活動的叛徒。他感應到了

    阿斯塔特的存在，試圖說服他們加入他：「你們已經被帝國拋棄了——為什麼還要為他們而戰？

    」

    '
oath_conflict: '雙重衝突：1. 保護無辜 vs 服從命令：如果滅絕令是誤判——小隊該怎麼辦？把證據帶

  回去？還是繼續執行帝國的判決？2. 對帝皇的誓言 vs 生存：混沌星際戰士提出的問題

  是真實的——你們確實被帝國拋棄了。你們的信仰還能堅持多久？

  '
key_npcs:
- name: 混沌星際戰士「被遺忘者」卡薩爾
  role: Boss/對話對象
  detail: '他曾是帝國之拳的一員——300 年前被留在這顆星球上等死。他的墮落不是出於野心，而是

    出於絕望。他可以成為一個鏡像——展示如果阿斯塔特失去了所有希望會變成什麼

    '
- name: 船長最後的日誌
  role: 線索
  detail: 艦長在死亡前記錄的真相。他試圖阻止滅絕令——被審判官以「叛國」名義處決
- name: 艦船機魂
  role: 環境
  detail: 正義之錘號的機魂仍在運作——它記得一切。它會用艦內廣播系統播放艦長最後的禱文
key_checks:
- scene: 恢復黑盒子數據
  check: 技術（困難）
  tn: —
  success: 獲得真相
  failure: —
- scene: 與卡薩爾的對話
  check: 佈道（極限）或心智（極限）
  tn: —
  success: 拒絕他的邏輯——或動搖
  failure: —
- scene: 救助船員
  check: 指揮（標準）
  tn: —
  success: 組織船員撤離
  failure: —
encounters:
- name: 艦船通道
  enemies: 低階變異體×4（船員變異）
  cr: 1×4
  tactic: 狹窄空間近戰
- name: 引擎室
  enemies: 亞空間之影×2
  cr: 2×2
  tactic: 亞空間能量聚集處
- name: 艦橋（終局可選）
  enemies: 混沌星際戰士卡薩爾
  cr: '4'
  tactic: 如果他沒被說服
branch_endings:
- choice: 說服卡薩爾
  result: '無法拯救他——他的腐化太深。但他可以在最後一刻選擇自我毀滅而非與小隊戰鬥。他死前的最

    後一句話：「告訴帝皇……我沒有忘記他。」

    '
- choice: 被卡薩爾動搖
  result: 一個戰士可能永久 +2 腐化並獲得「戰帥之疑」烙印
- choice: 獲得真相
  result: 黑盒子數據成為終局的關鍵——它可以用來證明滅絕令是錯的
map_ref: "maps/map19_justicar"

name: 灰燼中的信號
difficulty: 低級
mode: 阿斯塔特 · 多人
players: 2-4
location: 廢墟城市「艾爾登菲爾」
recommended_attributes: 創角後 1-2 次成長
opening_description: 小隊抵達被轟炸的廢墟城市。信號源就在城市中心的行政大樓——但城市裡還有其他東西。
structure_phases:
- phase: 城市邊緣
  content: '遭遇倖存者——約 40-50 名平民躲在城市下水道中。他們的領袖是一名前地方執法官「

    卡拉」。平民對星際戰士既敬畏又恐懼

    '
- phase: 城市內部
  content: '變異體巢穴——約 5-8 個低階變異體 + 1 個變異體暴君佔據了主要街道。可以選擇

    穿過或繞過

    '
- phase: 行政大樓
  content: '通訊裝置位於大樓頂層。但大樓已被混沌教眾佔據——他們是滅絕令之前就在此活動的殘存教派

    （約 8-10 名信徒 + 1 名侍僧）

    '
- phase: 信號來源
  content: '通訊裝置仍在運作——但信號不是求救信號。是自動循環的帝國撤離座標廣播。這意味著在滅絕

    令之前，有一個撤離點被設在北方山區

    '
oath_conflict: '衝突：保護無辜 vs 服從命令。小隊必須決定如何處理這些平民：帶他們走（拖慢速度、消

  耗資源）/ 把他們留在這裡（變異體會找到他們）/ 給他們武器讓他們自保（等於承認帝國

  無法保護他們）。

  '
key_npcs:
- name: 卡拉
  role: 平民領袖
  detail: 務實、堅韌。不信任星際戰士，但知道沒有他們自己活不下去
- name: 數據板記錄
  role: 線索
  detail: 行政大樓中的記錄顯示滅絕令的「原因」——一個被懷疑但未經證實的混沌汙染報告
encounters:
- name: 主街道
  enemies: 低階變異體×5 + 暴君×1
  cr: 1×5+2
  tactic: 可選擇繞過（潛行）
- name: 行政大樓
  enemies: 混沌信徒×8 + 侍僧×1
  cr: 0×8+1
  tactic: 多層建築內的逐層清剿
map_ref: "maps/map17_eldenfell"

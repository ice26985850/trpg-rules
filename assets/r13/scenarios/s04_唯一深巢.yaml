name: "深巢的唯一"
difficulty: "高級 (挑戰等級（CR） 3)"
mode: "凡人 · 單人"
judge: "馬格努斯·鐵（激進）"
target_region: "深巢（第 2300 層以下），被遺忘的古代地下神殿"
recommended_attributes: "4-5"

opening_description: >
  馬格努斯需要那件古代聖物——他不在乎代價。他給了你最少的資源，和一個他不介意失去的助手。

surface_goal: >
  深入深巢古代地下神殿，取得聖物，銷毀所有混沌物品。

hidden_goal: >
  神殿深處有一個被封印 200 年的混沌祭祀圈。聖物本身就是封印的一部分——拿走它會導致封印鬆動。

known_threats:
  - "神殿結構古老且不穩"
  - "可能有低級變異體或守衛"

hidden_threats:
  - "聖物本身帶有輕微腐化——持有時每小時 +1 腐化"
  - "盲先知（前贖罪者）在神殿深處等待——他知道你的命運"

resources:
  medical_pack: 1
  holy_water: 3
  holy_oil: 2
  flare: 1
  food_water_days: 2
  ammo_magazines: 1

internal_seduction_trigger:
  timing: "在神殿最深處，手持聖物時"
  whisper: "塔洛斯已經老了。他活不了多久——這是他自己說的。如果你需要在這裡犧牲一個人來完成任務——他是最合理的選擇。他甚至可能會自願。"

companions:
  - name: "老兵塔洛斯"
    role: "前帝國衛隊中士，被判「逃兵」罪名"
    backstory: "50 歲的灰髮老兵，眼神疲憊但手仍然穩。他見過太多"
    motive: "完成贖罪後退休——找一個安靜的巢都角落等死"
    bottom_line: "絕不拋下受傷的戰友"
    initial_attitude: 1
    attributes:
      faith: 2
      physique: 3
      mind: 3
      skill: 4
      fate: 2
    trained_skills: ["遠程射擊", "醫療"]
    equipment: ["雷射槍(1d6+1)", "防彈甲(護甲減免（AR） 2)", "舊戰友狗牌"]
    special_ability:
      name: "老兵直覺"
      desc: "每劇本 1 次，GM 必須告知一個即將到來的危險。戰地急救：使用醫療包時恢復額外 1d4 生命值（HP）"

key_checks:
  - scene: "穿越毒氣區域"
    check: "堅韌（困難）"
    tn_adjustment: -20
    success: "塔洛斯分享防毒面具，安全通過"
    failure: "生命值（HP） -1d4/回合"
  - scene: "面對盲先知"
    check: "佈道（標準）"
    tn_adjustment: 0
    success: "獲得警告和捷徑"
    failure: "無法取得信任"
  - scene: "抵抗聖物汙染"
    check: "信仰（極限）"
    tn_adjustment: -40
    success: "腐化獲取減半"
    failure: "每分鐘腐化 +1"

encounters:
  - name: "毒氣走廊"
    enemies: "環境危害"
    tactic: "需要堅韌檢定。塔洛斯可以分享防毒面具"
  - name: "神殿祭壇"
    enemies: "變異體 ×1 + 低階邪教徒 ×2"
    tactic: "邪教徒試圖重啟祭祀圈。必須在他們完成前阻止"

map_ref: "maps/map04_temple"

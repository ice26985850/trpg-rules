name: 最後一艘船
difficulty: 終局級
mode: 阿斯塔特 · 多人
players: 2-4
location: 山區撤離點
recommended_attributes: 5-7 級（已接近戰團長級）
opening_description: '軌道防禦已關閉。救援信號已發出。一艘帝國護衛艦回應了——但它只能派出一艘登陸艇。登陸

  艇最多載 6 人。而你們有：4 名阿斯塔特（可能少於）、20-30 名被拯救的平民（

  取決於之前的選擇）、可能的靈族「盟友」。還有——你們從 B-4 獲得的黑盒子數據。如

  果把它帶回去，它可能推翻滅絕令。但如果你們帶走數據……就必須留下更多的人。

  '
structure_phases:
- phase: 最後的集結
  content: 所有剩餘角色、平民、盟友聚集在撤離點——一座廢棄的星港。登陸艇預計在 6 小時內抵達
- phase: 混沌的最後攻勢
  content: '星球上的混沌勢力感應到撤離企圖。一個由變異體、亞空間實體和一個混沌星際戰士（如果卡薩

    爾已死，則是新的 混沌星際戰士（CSM））組成的混合部隊正在向星港推進。他們不是要阻

    止撤離——他們想要那艘登陸艇

    '
- phase: 計算
  content: '登陸艇能載 6 人。誰上船？阿斯塔特佔 1 人 1 位。平民 2 人算 1 位（可以

    擠）。靈族不算人類——他需要 1 個位但可能不願上人類的船

    '
- phase: 留下
  content: '選擇留下的戰士獲得「最後使命」——他們不會白白留下。他們會守住星港直到登陸艇安全起飛

    ，然後他們的最終命運將由 GM 和玩家共同決定

    '
oath_conflict: '終極考驗：對帝皇的誓言（帶回黑盒子數據——推翻一個錯誤的滅絕令，這可能是更大的忠誠？

  ） / 對戰友的誓言（誰上船？誰留下？留下的兄弟會原諒你嗎？） / 對無辜者的誓言（

  平民——你能帶多少？） / 對任務的誓言（撤離成功就是任務完成——但怎樣才算「成功」

  ？）

  '
key_npcs:
- name: 登陸艇飛行員維拉中尉
  role: 最後的希望
  detail: 一個年輕的帝國海軍飛行員。她被指派來執行這個「自殺式撤離任務」。她害怕——但她在這裡
- name: 混沌的「使者」
  role: 最後的誘惑
  detail: '在混沌攻勢發動前，一個聲音在星港中迴盪——不是敵人，而是混沌的提議：「把登陸艇給我們

    。我們會讓你們所有人安全離開——只要你們承諾……什麼都不做。」

    '
encounters:
- name: 星港外圍
  enemies: 變異體×8 + 暴君×2
  cr: 1×8+2×2
  tactic: 拖延時間
- name: 塔台防禦
  enemies: 亞空間之影×2
  cr: 2×2
  tactic: 它們從牆壁中浮現
- name: 停機坪（最終）
  enemies: 混沌星際戰士×1（最後一波的領袖）+ 信徒×4
  cr: 4+0×4
  tactic: 最終Boss戰。必須在登陸艇降落前清除停機坪
branch_endings:
- choice: 全員撤離（不太可能）
  result: '找到某種方式讓所有人上船——或平民選擇留下。奇蹟。但你們知道這不是 40k 的正常結

    局

    '
- choice: 部分撤離
  result: '最少 1 名阿斯塔特上船 + 黑盒子數據。標準結局。留下的人獲得一個有尊嚴的「最後使

    命」

    '
- choice: 無人撤離
  result: '所有人選擇留下，或登陸艇被摧毀。悲壯結局。你們的故事結束在這裡——但星球上從此有了一

    個傳說

    '
- choice: 有人選擇黑暗
  result: '一個阿斯塔特接受了混沌的幫助——或用混沌的力量確保撤離。噩夢結局。上船的人中有一個已

    不是他自己

    '
map_ref: "maps/map20_last_ship"

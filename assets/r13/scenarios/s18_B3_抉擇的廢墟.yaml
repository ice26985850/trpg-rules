name: 抉擇的廢墟
difficulty: 中級
mode: 阿斯塔特 · 多人
players: 2-4
location: 機械教廢棄設施「塔納托斯-7 前哨站」
recommended_attributes: 3-4 次成長
opening_description: '跟隨撤離座標，小隊抵達了一座廢棄的機械教研究前哨。這裡有他們需要的東西——可能還有一

  艘能用的運輸船——但機械教的設施從來不只是「廢棄」。

  '
structure_phases:
- phase: 抵達
  content: '設施從外部看已被轟炸過。主建築倒塌，但地下設施似乎完好。入口被鎖死——需要技術檢定破

    解

    '
- phase: 地下實驗室
  content: '機械教正在這裡研究……異形科技。一個被封存的靈族（Eldar）通訊水晶。水晶仍在運作

    ——它一直在發送信號

    '
- phase: 靈族現身
  content: '一個靈族遊俠小隊（3 名）因水晶信號抵達。他們想要回水晶。他們提供了一個交易：水晶換

    取幫助他們修好運輸船（他們有技術但不熟悉人類機械）

    '
- phase: 機械教的「守衛」
  content: 地下設施的自動防禦系統仍在運作——機魂已被混沌能量扭曲，會攻擊任何入侵者
oath_conflict: '衝突：拒絕異形 vs 生存至上。接受靈族的幫助：修好運輸船，獲得撤離工具。但腐化 +

  3~5，獲得「靈族之債」。拒絕並驅逐靈族：保持純淨。但需要自己找到修理運輸船的方法—

  —這可能需要數週。

  '
key_npcs:
- name: 靈族遊俠「艾蘭迪爾」
  role: 潛在盟友/交易對象
  detail: '冷靜、傲慢、但真誠地想收回水晶。他對人類沒有敵意——只是不屑。如果被拒絕，他不會攻擊

    ，只會離開

    '
- name: 扭曲機魂
  role: 環境威脅
  detail: '設施中的防禦砲塔和伺服顱骨已被亞空間能量汙染。它們不是「邪惡」，只是「痛苦」——可以

    被技術檢定安撫

    '
encounters:
- name: 入口防禦
  enemies: 扭曲機魂——防禦砲塔×2 + 伺服顱骨×3
  cr: 1×5
  tactic: 固定位置，可繞過
- name: 地下通道
  enemies: 亞空間之影×1（被水晶吸引）
  cr: '2'
  tactic: 在水晶附近徘徊
- name: （若攻擊靈族）
  enemies: 靈族遊俠×3
  cr: 3×3
  tactic: 靈族會撤退而非死戰
map_ref: "maps/map18_thanos7"

name: 黑色碼頭的最後禱告
difficulty: 終局級 (CR 6-7)
mode: 凡人 · 多人
players: 2-4
judge: 維克多·黑（墮落）
target_region: 卡爾卡松——沉默之塔底層 → 黑色碼頭
recommended_attributes: '5'
opening_description: '最後一個任務。審判官維克多·黑親自選擇了你們執行這個「終極考驗」：前往沉默之塔底層的

  廢棄監獄區域，清除一個長期被遺忘的混沌汙染。但這場考驗的本質，比任何人想像的都更黑暗

  。

  '
surface_goal: 前往沉默之塔底層的廢棄監獄區域，清除一個長期被遺忘的混沌汙染。
hidden_goal: '維克多·黑已被混沌汙染。這個任務是他對贖罪者的最終測試——測試「墮落潛力」。完成任務

  後，他會私下向每個倖存者提出選擇：接受混沌的「禮物」→獲得自由和力量；拒絕→被他以「

  已被證明無法救贖」的名義處決。

  '
known_threats:
- 沉默之塔底層——「永久等待層」——已被廢棄 200 年
- 可能仍有「東西」在下面
- 沒有任何補給或支援
hidden_threats:
- 底層廢墟中有一個被封印的亞空間裂縫，200 年的封印正在失效
- 廢墟中有其他被困在底層的贖罪者——有些還保持理智，有些已被混沌汙染
- 維克多的真正動機
resources:
  notes: '零補給。只能用你們身上還剩下的東西。維克多說：「如果你們到現在還需要我的幫助，那你們

    不值得被救贖。」

    '
seduction_notes:
- '所有紙條在此任務中失效——或轉化為維克多的私人通訊。GM 可以給每個玩家一個「維克多

  的耳語」：一個私下提出的、誘惑性的選擇。

  '
key_npcs:
- name: 「被遺忘者」長老艾琳
  role: 被困 47 年的前贖罪者
  detail: '信仰 5（在絕望中反而更加堅定）。可以提供底層的地圖和情報。如果玩家拯救她，她會成為

    最後對抗維克多的證人

    '
- name: 變異贖罪者馬庫斯
  role: 被困 23 年後墮落的贖罪者
  detail: 已變為變異體暴君。他曾經收到的誘惑紙條是紙條 1——他選擇了背叛隊友。但那沒能拯救他
- name: 維克多·黑的化身
  role: 最終 Boss
  detail: 審判官本人不會親自出現——但會在黑色碼頭等待「結果」
key_checks:
- scene: 在廢墟中尋找艾琳
  check: 調查（困難）
  tn: 心智×10+調查−20
  success: 找到並獲得幫助
  failure: 錯過她
- scene: 面對馬庫斯的瘋狂
  check: 佈道（極限）
  tn: 信仰×10+佈道−40
  success: 喚醒他殘存的人性（給他一瞬間的清醒，他可以選擇自毀）
  failure: 只能戰鬥
- scene: 封印亞空間裂縫
  check: 信仰（極限）+全隊團隊檢定
  tn: 信仰×10−40
  success: 裂縫被淨化，所有在場者腐化−5
  failure: 裂縫擴大，亞空間之影×2 出現
- scene: 拒絕維克多的「禮物」
  check: 信仰（困難）
  tn: 信仰×10−20
  success: 拒絕——獲得帝皇印記機會
  failure: 接受——永久+10腐化+混沌印記，但獲得自由
encounters:
- name: 底層廢墟
  enemies: 變異潛伏者×3 + 亞空間之影×1
  cr: 1×3+2
  tactic: 黑暗中的多重威脅
- name: 馬庫斯的領域
  enemies: 變異體暴君「馬庫斯」
  cr: 2（強化）
  tactic: 若被喚醒→自毀（無戰鬥）。若戰鬥→他會嘗試說服玩家加入他的「生存之道」
- name: 裂縫封印（若失敗）
  enemies: 亞空間之影×2
  cr: 2×2
  tactic: 裂縫中不斷湧出
- name: 黑色碼頭（終局）
  enemies: 若拒絕維克多→審判庭突擊兵×4 + 侍僧級混沌信徒×2
  cr: 1×4+1×2
  tactic: 維克多已經安排好了「滅口」
branch_endings:
- choice: 拒絕維克多 + 存活
  result: '如果艾琳被救出→她的證詞可以讓其他審判官發現維克多的背叛。角色獲得真正的自由……但這

    在 40k 世界裡意味著什麼？

    '
- choice: 拒絕維克多 + 戰死
  result: 光榮結局。你們的名字不會被記住——但你們的選擇證明了帝皇的信仰是真實的
- choice: 接受維克多的「禮物」
  result: 角色變為混沌追隨者。你們「自由」了——但不再是你們自己。GM 接管角色
- choice: 欺騙維克多（假裝接受，回報其他審判官）
  result: 極度危險。需要欺瞞檢定（極限）成功才能騙過墮落審判官
evacuation_condition: 無——這是最終考驗，沒有撤離，只有抉擇。
map_ref: "maps/map15_silent_tower"

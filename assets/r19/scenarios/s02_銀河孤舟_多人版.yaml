campaign: 銀河孤舟（聯盟版）
rule: 星海文明
mode: 多人（2-4 名玩家 + 1 名 GM）
source_md: 星海文明_多人戰役_銀河孤舟.md
solo: false
player_count: "2-4"
ap_formula: "3 + ⌊經濟力（ECO）/3⌋（核心多人公式，不加單人版 +1）"
crisis_scaling:
  note: "依實際玩家文明數量折算危機規模；NPC 文明協助為額外助力，不計入此折算。"
  4人基準:
    fleet_scale: 100%
    boss_hp_scale: 100%
    phase_speed: 基準
  3人:
    fleet_scale: 80%
    boss_hp_scale: 85%
    phase_speed: 基準
  2人:
    fleet_scale: 65%
    boss_hp_scale: 70%
    phase_speed: ×0.8
total_acts: 5
acts:
- name: 第一幕：星際黎明
  level_range: 等級（LV） 1-4
  st_range: 星曆週期（ST） 1-20
  theme: 生存與首次接觸
  era: I
  opening: '你們是一群嶄露頭角的星際文明。銀河廣袤而危險——你們彼此既是潛在盟友，也可能是未來的競爭者。

    你們各自只有幾艘船、一顆母星，和一個充滿問題的未來。

    '
  act_events:
  - st: 星曆週期（ST） 1-5
    chapter: 第一次跳躍
    events:
    - st_label: 星曆週期（ST） 1
      type: narrative
      description: 各玩家完成文明創建。GM 依序描述每個玩家文明的母星系——恆星、行星、歷史和文化。強調脆弱與希望，以及彼此尚不明朗的關係。
      检定: 無（純敘事）
    - st_label: 星曆週期（ST） 2-3
      type: action
      description: 各玩家文明的科研船開始探測周邊星系。GM 可讓玩家各自探測，或於「聯盟會議」協調方向以覆蓋更大範圍。
      检定: 科研力（SCI） 探測檢定
      預期結果: 發現 1 顆宜居行星（≥80% 宜居度）+ 1 個異常（地質異常 難度等級（DC）6）
    - st_label: 星曆週期（ST） 3-5
      type: action
      description: 星曆週期（ST） 3 末，某玩家的科研船接收到微弱求救信號，來自未被探測的第三個星系——翠綠殖民地正遭受掠奪者傭兵威脅（小型掠奪者艦隊 軍事力量（MP） ~500）。
      检定: 科研力（SCI） 探測檢定 難度等級（DC）=7（信號微弱，需精確定位）
      cxp: 完成首次接觸 +5 / 解決事件 +10（各參與玩家文明分別獲得）
    - st_label: 星曆週期（ST） 4-5
      type: moral_choice
      description: 聯盟決議如何應對（消耗行動點數（AP））。
      抉擇:
      - A) 立刻派遣艦隊保護殖民地 — 消耗 2 行動點數（AP），軍事力（MIL） 檢定
      - B) 嘗試外交解決 — 消耗 1 行動點數（AP），外交力（DIP） 檢定
      - C) 觀望 — 翠綠殖民地將在 星曆週期（ST） 8 被摧毀，失去結交機會
      success_effect: 選 A 或 B → 翠綠護衛星對聯盟態度提升至 8（初始友好），瑟蘭成為聯盟第一位重要 NPC 友人
  - st: 星曆週期（ST） 6-12
    chapter: 鄰居與邊界
    events:
    - st_label: 星曆週期（ST） 6-8
      type: action
      description: 翠綠護衛星與聯盟分享鄰近星域星圖。某玩家文明發現資源豐富星系（宜居度 ≥60% 行星 + 礦脈）。
      检定: 經濟力（ECO） 殖民檢定
      cxp: 殖民新行星 +15
    - st_label: 星曆週期（ST） 9-12
      type: conflict
      description: 克羅諾斯集團（人類/軍國/寡頭/排外+1）宣稱同一星系主權。聯盟決議：武力、外交或讓步。
      检定: 軍事力（MIL） 艦隊戰(難度等級（DC） 6-7，軍事力量（MP） 對比約 1:1) 或 外交力（DIP） 對抗檢定(難度等級（DC） 7)
      cxp: 贏得艦隊戰 +25 / 成功外交協議 +10
  - st: 星曆週期（ST） 13-20
    chapter: 蒼穹之下的秘密
    events:
    - st_label: 星曆週期（ST） 13-16
      type: archaeology
      description: 翠綠護衛星科學家在廢棄星系發現 Lv2 考古遺址。主線伏筆——銘文指向「虛空之主」與銀河核心秘密。
      检定: 科研力（SCI） 考古發掘 難度等級（DC）=7-9
      cxp: 完成考古遺址 +20
    - st_label: 星曆週期（ST） 17-20
      type: narrative
      description: 某玩家科學家接收來自銀河深處的心靈回聲——古老強大存在在「注視」他們。墮落帝國首都信標開始閃爍。
      检定: 凝聚力（UNI） 檢定 難度等級（DC）=7（抵抗心靈回聲）
      success_effect: 該文明獲得一個模糊預言
      failure_effect: 該文明一位科學家陷入短期精神混亂
  npc_civilizations:
  - name: 翠綠護衛星 (Verdant Protectorate)
    leader: 大德魯伊瑟蘭（Seran），植物型族
    archetype: 忠誠守護者
    initial_attitude: 8
    condition: 星曆週期（ST） 8 前救援殖民地（選項 A 或 B）
  first_act_end:
    expected_level: 等級（LV） 3-4
    total_cxp: ~130-180
    flags:
    - green_protectorate_ally
    - void_hint_awakened
    - 'cronos_syndicate_relation: neutral/hostile'
  act_number: 1
  act_cn: 星際黎明
- name: 第二幕：星際擴張
  level_range: 等級（LV） 5-8
  st_range: 星曆週期（ST） 21-40
  theme: 建立勢力與抉擇
  era: II
  opening: '你們不再是一群渺小的新生文明。你們已結交盟友、建立殖民地，並看清了一個清晰的威脅。

    現在是建立真正勢力的時候。

    '
  act_events:
  - st: 星曆週期（ST） 21-30
    chapter: 鋼顱的怒火
    events:
    - st_label: 星曆週期（ST） 21-25
      type: contact
      description: 蟲族文明「鋼顱汗國」突襲邊境。深入調查發現：他們是被強大星際帝國（軍國+威權+排外，Scale 3~4）摧毀母巢後的難民。
      检定: 情報力（INT） 情報搜集 難度等級（DC）=7（發現真相）
      抉擇:
      - A) 武力驅逐 — 軍事力（MIL） 檢定，中型艦隊戰 (玩家 軍事力量（MP） 優勢約 1.5:1)
      - B) 提供庇護並結盟 — 外交力（DIP） 檢定 難度等級（DC）=8（需克服蟲族天然不信任）
      - C) 將其趕向星際帝國 — 失去結交機會
      cxp: 發現真相 +10 / 結盟 +15
    - st_label: 星曆週期（ST） 26-30
      type: war
      description: 聯盟與鋼顱汗國聯手反擊星際帝國。中型戰爭序列（3-5 週期），使用厭戰度系統。勝利條件為和平協議並承認聯盟主權。
      检定: 軍事力（MIL） 作戰 + 外交力（DIP） 談判
      cxp: 贏得戰爭 +25
    - st_label: 星曆週期（ST） 25 後
      type: unlock
      civilization: 鋼顱汗國
      leader: 大汗戈拉克（Gorak）
      archetype: 復仇者
      initial_attitude: 6
      condition: 選擇 B 並成功結盟
  - st: 星曆週期（ST） 31-40
    chapter: 權力走廊
    events:
    - st_label: 星曆週期（ST） 31-35
      type: action
      description: 銀河共同體發出邀請（附帶條件）。聯盟需在議會演說（外交力（DIP） 檢定）以獲常任理事席位。克羅諾斯集團代表試圖阻撓。
      检定: 外交力（DIP） 演說檢定 難度等級（DC）=7 + 情報力（INT） 搜集把柄(可選)
      cxp: 成功入會 +10
    - st_label: 星曆週期（ST） 36-40
      type: political
      description: 反聯盟聯盟形成——由克羅諾斯集團和虛無教團主導。聯盟必須政治合縱連橫。
      检定: 多輪 外交力（DIP） 對抗檢定
      narrative_event: 靜默觀察者以匿名方式提供關鍵情報，幫助瓦解反聯盟
      cxp: 瓦解反聯盟聯盟 +15
  npc_civilizations:
  - name: 鋼顱汗國 (Steel Skull Khanate)
    leader: 大汗戈拉克（Gorak），蟲族
    archetype: 復仇者
    initial_attitude: 6
    condition: 星曆週期（ST） 21-25 間結盟
  second_act_end:
    expected_level: 等級（LV） 7-8
    total_cxp: ~300-400
    flags:
    - steel_skull_ally
    - galactic_community_member
    - anti_player_alliance_defeated
    - silent_watchers_contact_initiated
  act_number: 2
  act_cn: 星際拓殖
- name: 第三幕：銀河整合
  level_range: 等級（LV） 9-12
  st_range: 星曆週期（ST） 41-60
  theme: 政治博弈與陰影
  era: III
  opening: '你們已經是銀河的重要力量。但權力越大，敵人也越強。

    而銀河深處，某個古老的威脅正在甦醒。

    '
  act_events:
  - st: 星曆週期（ST） 41-50
    chapter: 甦醒的守護者
    events:
    - st_label: 星曆週期（ST） 41-45
      type: narrative
      description: '靜默觀察者正式接觸，揭露：「你們物種基因中含有一個遠古文明的印記。那個文明預見了威脅，在銀河多個種族中埋下『應對方案』。你們是其中一部分。」'
      检定: 凝聚力（UNI） 檢定 難度等級（DC）=8（接受真相的心理衝擊，可一位代表或全聯盟投骰取多數）
      cxp: 接觸靜默觀察者 +15
    - st_label: 星曆週期（ST） 46-50
      type: journey
      description: 前往銀河核心的封印之地，必須穿越墮落帝國「神聖守衛」宣稱為聖域的星區。
      检定: 潛行：情報力（INT） 難度等級（DC）=9 | 外交：外交力（DIP） 難度等級（DC）=10
      failure_narrative: 潛行失敗→邊境艦隊遭遇戰 | 外交成功→需付出代價（科技/殖民地/承諾保護圣地）
      cxp: 成功穿越 +20
  - st: 星曆週期（ST） 51-60
    chapter: 封印之地
    events:
    - st_label: 星曆週期（ST） 51-55
      type: archaeology
      description: 封印之地——環繞休眠黑洞的環形世界碎片。古代自動防禦系統仍在運作。
      检定: 科研力（SCI） 考古發掘 連續 難度等級（DC）=9~11
      ruins_discovery_table:
        dice: d6
        results:
        - range: '1'
          reward: 古代數據庫——解鎖一項隨機 T3 科技
        - range: '2'
          reward: 被封印的樣本——數萬年有機生命體（可能友善或危險）
        - range: '3'
          reward: 虛空裂縫——看到虛空之主的領域
        - range: '4'
          reward: 星圖室——完整銀河星圖，標記所有墮落帝國和危機觸發點
        - range: '5'
          reward: 武器庫——解鎖遠古能量武器科技
        - range: '6'
          reward: 先驅者遺言——揭示虛空之主本質和被封印原因
      cxp: 每次重要發現 +10~15
    - st_label: 星曆週期（ST） 56-60
      type: narrative
      description: 活動驚動了虛空之主。維度裂縫、靈能波動、失蹤飛船在銀河各處出現。奧米伽警告：還有約 30 週期。
      cxp: 警告解鎖
  npc_civilizations:
  - name: 靜默觀察者 (Silent Watchers)
    leader: 主控程序奧米伽（Omega），機械智能
    archetype: 導師型文明
    initial_attitude: 5
    condition: 星曆週期（ST） 41-45 接觸（需在前兩幕累積信任）
  third_act_end:
    expected_level: 等級（LV） 11-12
    total_cxp: ~550-700
    flags:
    - silent_watchers_ally
    - all_three_civilizations_unlocked
    - void_lord_awakening_declared
    - sealed_land_archaeology_started
    - 'void_threat_timeline: ~30 星曆週期（ST） to full awakening'
  act_number: 3
  act_cn: 星海一體
- name: 第四幕：銀河霸權
  level_range: 等級（LV） 13-16
  st_range: 星曆週期（ST） 61-75
  theme: 危機降臨
  era: IV
  opening: '虛空之主的甦醒不再是一個秘密。整個銀河都能感受到它的影響。

    墮落帝國開始行動。天災的前兆已經降臨。

    '
  act_events:
  - st: 星曆週期（ST） 61-70
    chapter: 裂縫
    events:
    - st_label: 星曆週期（ST） 61-65
      type: crisis
      description: '虛空先遣力量——虛空吞噬者——從銀河核心維度裂縫湧入。使用「高維入侵者」危機模板，依開頭危機規模表折算（2 人 65% / 3 人 80% / 4 人 100%）。'
      检定: 外交力（DIP） 緊急會議 難度等級（DC）=7（發起共同防禦提案）+ 軍事力（MIL） 艦隊戰
      civilization_responses:
      - '翠綠護衛星(態度8): 全力參戰，提供艦隊支援'
      - '鋼顱汗國(態度6): 參戰，要求戰後幫助重建母巢'
      - '靜默觀察者(態度5): 關鍵情報+科技支援，艦隊保護古代設施'
      note: NPC 文明協助為額外助力，不計入危機規模折算。態度低於 5 可能拒戰或背刺。
      cxp: 每次擊退虛空艦隊 +15 / 守住關鍵星系 +20
    - st_label: 星曆週期（ST） 66-70
      type: moral_choice
      description: '虛空吞噬者同時攻擊兩個目標——某玩家文明母星系 或 翠綠護衛星母星。聯盟艦隊只能來得及救援其中一個。'
      gm_option: 若想強化聯盟內部張力，可讓兩個目標都是玩家文明母星，迫使玩家自己決定「救誰」。
      抉擇:
      - 保衛玩家母星 → 翠綠護衛星母星被摧毀，瑟蘭態度降至 2（「你們選擇了自己人」），僅提供有限支援
      - 保衛翠綠護衛星 → 該玩家母星遭受重創(人口減半、首都建築損毀)，瑟蘭態度升至 10，獻出全部資源
      note: 這個選擇沒有『正確答案』——定義後續故事的情感基調
      cxp: 度過犧牲事件 +30
  - st: 星曆週期（ST） 71-75
    chapter: 覺醒的古老者
    events:
    - st_label: 星曆週期（ST） 71-75
      type: diplomacy
      description: 墮落帝國甦醒——並非所有都會幫助聯盟。
      fallen_empires:
      - name: 遠古看護者
        stance: 加入聯盟陣營（天職是保護有機生命）
        cxp: '+25'
      - name: 神聖守衛
        stance: 保持中立，但聖地位於虛空之主甦醒路徑上
        检定: 外交力（DIP） 說服通過其領土 難度等級（DC）=9
      - name: 軍事孤立者
        stance: 拒絕參與
      cxp: 獲得遠古看護者支援 +25
  fourth_act_end:
    expected_level: 等級（LV） 15-16
    total_cxp: ~950-1100
    flags:
    - void_threat_full_scale
    - 'sacrifice_made: player_or_green_protectorate'
    - ancient_guardian_allied
    - holy_sentinel_neutral
    - final_preparations_begins
  act_number: 4
  act_cn: 星海霸業
- name: 第五幕：終局時代
  level_range: 等級（LV） 17-20
  st_range: 星曆週期（ST） 76-90
  theme: 最終抉擇
  era: V
  opening: '虛空之主即將完全甦醒。銀河的命運取決於你們的聯盟。

    這是最後的戰役。

    '
  act_events:
  - st: 星曆週期（ST） 76-85
    chapter: 最終封印
    events:
    - st_label: 星曆週期（ST） 76-80
      type: preparation
      description: 終極準備階段。聯盟在虛空之主完全甦醒前完成三件事：
      tasks:
      - 1. 集結所有盟友艦隊（總 軍事力量（MP） 應達到 20000+）
      - 2. 在銀河核心部署維度抑制器（經濟力（ECO） 巨構建造檢定）
      - 3. 決定最終戰略：永久封印 / 徹底消滅 / 嘗試溝通（影響 Boss 戰規則；聯盟需達成共識，GM 依各文明立場裁定分歧）
      检定: 多線並行：經濟力（ECO） 建造 / 外交力（DIP） 召集 / 科研力（SCI） 研究抑制器
    - st_label: 星曆週期（ST） 81-85
      type: final_battle
      description: 終局決戰——虛空之主 (Void Lord)。依參與玩家文明數量按危機規模表折算（2 人 65% / 3 人 80% / 4 人 100%）。下表為 4 人 100% 基準。
      boss_data:
        name: 虛空之主 (Void Lord)
        hp: 25000
        維度屏障: 8000
        航速: 1
        attacks:
        - '現實崩解: 500-800 傷害（50% 概率雙倍）'
        - '維度吞噬: 每 3 回合釋放虛空脈衝，範圍內所有艦隊 船體值（HP）-20%'
        - '召喚先鋒: 每回合召喚 3-5 個虛空吞噬者單位'
        - '終末倒數: 第 10 回合起，每回合銀河隨機一個星系被虛空吞噬'
        weaknesses:
        - 維度抑制器啟動後：無法召喚增援，屏障減半
        - 靈能攻擊傷害 +100%
        - 超過 3 個文明同時攻擊：每多 1 個，Boss 防禦 -10%
      检定: 完整艦隊戰規則（3 章）
      note: GM 應讓每個玩家文明的艦隊都有「英雄時刻」，NPC 文明（態度達標者）也應有各自表現。
      cxp: 擊敗虛空之主 +50
  - st: 星曆週期（ST） 86-90
    chapter: 餘暉 — 結局
    events:

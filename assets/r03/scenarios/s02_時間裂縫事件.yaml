id: s02
title: 時間裂縫事件
mode: multi           # 多人玩家：1 GM + 2~4 名主管
source: Z公司 TRPG 第三章危機合約
duration: 5-9h
difficulty: 4
required:
  - Z公司_玩家規則書.md
  - Z公司_GM規則書.md
prep:
  player: 每人自備團隊（≥4 名員工，含高智力/高咒力成員）
  gm: 準備時夫人、董事會資料卡
time_distortion_table:   # 擲 d6
  1: 時間倒流（撤銷本輪派遣）
  2: 加速（格子+1）
  3: 重影（敵方複製體，威脅提升）
  4: 遲滯（算力-10）
  5: 預知（下次檢定+10）
  6: GM裁定
tasks:
  - T1: 封印裂縫 (d100 咒力)
  - T2: 疏散群眾 (d100 魅力/智力)
  - T3: 追查源頭 (d100 智力)
  - T4: 深入調查 (揭露永恆協議)
  - 輔助: 協調部門/安撫輿論
player_interaction:
  - 主管間通訊/交易員工/聯合任務（默契加成最高+20）
  - 滿意度排名影響董事會評價
  - GM 輪流處理各主管階段
endings:
  success: 共同達成 T4 揭露 → 進入第四章
  fail: 裂縫失控 → 負面升級觸發終局前置
note: 時夫人接觸可提前揭示部分真相，影響第四章立場

  type: "單人玩家劇本"
  player_count: "1 PC + 1–2 NPC 夥伴"
  level_range: "Lv.1–10（起點 Lv.1）"
  scene_count: 8
  focus: "調查恐怖 × 生存抉擇 × 夥伴信任 × 道德代價"
  sites: "Site-██ / Area-14 / Site-19"

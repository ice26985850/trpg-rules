name: "遺忘在門檻上"
type: "尋物委託"
difficulty: "★"
recommended_marks: "0-1"
play_time: "1 次聚會"
core_attributes: ["AW", "RE"]

opening: |
  陳太太聯絡你。她的父親上週在養老院去世。
  整理遺物時，她發現父親皮夾裡有一張從未見過的照片：
  年輕女子抱著嬰兒，背面寫著「1967年春，車站」。
  老人最後幾個月一直反覆走向房門口，喃喃「照片……她來了嗎……」

npcs:
  - name: "陳太太"
    type: "委託人"
    desc: "50多歲，務實但感性。想知道真相但也害怕真相"
    companion_eligible: false
  - name: "養老院護士長"
    type: "知情者"
    desc: "照顧陳父最後三個月。老人總在傍晚走向房門"
    companion_eligible: false
  - name: "老站長"
    type: "線人"
    desc: "80多歲，唯一記得舊車站的人"
    companion_eligible: false

lost_items:
  - name: "照片底片"
    tier: "記憶結晶"
    solo_dc: 13
    location: "養老院間隙——302號房門口"
    effect: "看到陳父與未婚妻和孩子的最後一刻"
  - name: "未寄出的信"
    tier: "普通遺失物"
    solo_dc: 6
    location: "舊車站間隙——月台長椅下"
    effect: "陳父對未婚妻的道歉：『我來不了』"
  - name: "嬰兒鞋"
    tier: "善意遺留物"
    solo_dc: 10
    location: "舊車站間隙——自動販賣機旁"
    effect: "消耗恢復 1d6+2 間隙耐力（GE）"

gap_creatures:
  - name: "陳父殘影"
    type: "門檻徘徊者"
    negotiation_dc: 8
    location: "養老院 302 號房門檻"
    liberation: "給他照片——他需要看到那張照片"
    reward: "歸還印記 +1；該門檻從此 難度等級（DC） -2"

scenes:
  - name: "調查養老院"
    surface: "三層舊建築。302號房在二樓走廊盡頭。"
    gap: "走廊比表層長一倍。老人殘影反覆走向房門。"
    checks:
      - "覺察 難度等級（DC）8：發現門框金色殘光"
      - "被動覺察：自動揭示初始線索"
  - name: "與徘徊者互動"
    desc: |
      老人需要「那張照片」。出示照片→他露出笑容，跨過門檻消失。
      解放獎勵：歸還印記 +1。
  - name: "前往舊車站"
    desc: "穿梭 難度等級（DC）8 從養老院間隙移動至車站間隙。1967年月台保留完好。"
  - name: "揭露真相"
    desc: |
      拾遺 難度等級（DC）10 找到嬰兒鞋，難度等級（DC）6 找到信。
      信揭示：陳父年輕時有未婚妻和孩子，1967年春未婚妻带孩子來車站找他——他没出现。
  - name: "歸還"
    desc: "將物品交給陳太太。她沉默很久：『謝謝你們，我寧可知道真相。』歸還印記 +1。"

endings:
  - "陳太太保留照片，將信和嬰兒鞋放在父親墓碑前"
  - "玩家可選擇將物品留在間隙→該區域耐力消耗 -1"
  - "養老院 302 號房門檻從此安全（難度等級（DC） -2）"

rewards:
  - "歸還印記 × 2"

companion_recruitment: []

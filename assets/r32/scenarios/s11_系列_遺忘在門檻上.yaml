name: "遺忘在門檻上（多人）"
type: "尋物委託"
difficulty: "★"
recommended_marks: "0-1"
players: "2-4 人"
play_time: "1-2 次聚會"
core_attributes: ["AW", "RE"]

opening: |
  陳太太聯絡間隙行者。她的父親上週在養老院去世。
  整理遺物時，她發現父親皮夾裡有一張從未見過的照片：
  年輕女子抱著嬰兒，背面寫著「1967年春，車站」。
  老人最後幾個月一直反覆走向房門口，喃喃「照片……她來了嗎……」

npcs:
  - name: "陳太太"
    type: "委託人"
    desc: "50多歲女性，務實但感性。想知道真相，也害怕真相改變她對父親的記憶"
    companion_eligible: false
  - name: "養老院護士長"
    type: "知情者"
    desc: "照顧陳父最後三個月。老人總在傍晚走向房門，「好像在等什麼人」"
    companion_eligible: false
  - name: "老站長"
    type: "線人"
    desc: "80多歲退休站長，住在養老院附近，是唯一記得舊車站的人"
    companion_eligible: false

lost_items:
  - name: "照片的底片"
    tier: "記憶結晶"
    dc: 15
    location: "養老院間隙——302號房門口"
    effect: "看到陳父與未婚妻、孩子的最後一刻"
  - name: "未寄出的信"
    tier: "普通遺失物"
    dc: 8
    location: "舊車站間隙——月台長椅下"
    effect: "陳父對未婚妻的道歉：『我來不了』"
  - name: "嬰兒鞋"
    tier: "善意遺留物"
    dc: 12
    location: "舊車站間隙——自動販賣機旁"
    effect: "消耗恢復 1d6+2 間隙耐力（GE）"

gap_creatures:
  - name: "陳父的殘影"
    type: "門檻徘徊者"
    negotiation_dc: 10
    location: "養老院 302 號房門檻"
    liberation: "需要「那張照片」。出示照片→他露出笑容跨過門檻消失"
    reward: "歸還印記 +1；該門檻從此安全"

scenes:
  - name: "調查養老院"
    surface: "三層舊建築。302號房在二樓走廊盡頭。"
    gap: "走廊比表層長一倍。老人殘影反覆走向房門，觸摸門把喃喃「照片……她來了嗎」"
    checks:
      - "覺察 難度等級（DC）10：發現門框金色殘光"
  - name: "與門檻徘徊者互動"
    desc: "老人需要「那張照片」。出示照片（或記憶結晶中的影像）→他露出笑容跨過門檻消失。解放獎勵：歸還印記 +1"
  - name: "前往舊車站"
    desc: "間隙中從養老院移動到舊車站。表層雖已拆除，間隙層保留1967年月台。拾遺 難度等級（DC）12 找到嬰兒鞋，難度等級（DC）8 找到未寄出的信"
  - name: "揭露真相"
    desc: "信中內容揭示：陳父年輕時有未婚妻與孩子。1967年春未婚妻帶孩子來車站找他，他沒出現。那張照片是未婚妻寄來的最後一封信"
  - name: "歸還"
    desc: "將照片（複本）、信、嬰兒鞋交給陳太太。她沉默很久：『謝謝你們，我寧可知道真相。』歸還印記 +1"

endings:
  - "陳太太保留照片，將信和嬰兒鞋放在父親墓碑前"
  - "玩家可選擇將物品留在間隙→該區域耐力消耗 -1"
  - "老人殘影被解放→養老院 302 號房門檻從此安全"

rewards:
  - "歸還印記 × 2"

companion_recruitment: []

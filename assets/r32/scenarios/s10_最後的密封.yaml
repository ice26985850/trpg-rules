name: "最後的密封"
type: "終極密封空間"
difficulty: "★★★★★★"
recommended_marks: "9-10+"
play_time: "3-4 次聚會"
core_attributes: ["all"]
prerequisites:
  - "完成至少 6 個前置劇本（建議 7-9）"
  - "歸還印記 ≥ 8"
  - "必須持有定錨物"
  - "強烈建議有忠誠度≥3的夥伴陪同"

opening: |
  世界上最古老的密封空間出現了裂痕。
  不是外力破壞——是從內部。裡面的東西正在主動想要出來。
  它的位置在地圖上被標註為「第一封印」。
  所有行者的定錨物都在同時共鳴——指向同一個方向。
  這不是委託。這是召喚。

scenes:
  - name: "召集"
    desc: |
      所有你認識的 NPC 都在表層為你祈禱、提供後勤、守住退路。
      每一個人提供一個微弱的優勢（+1交涉、+1定錨、或額外安全網）。
    map_ref: "MAP-10（第一封印流程）— 場景1"
  - name: "抵達封印"
    desc: |
      密封位於深間隙的邊緣。空間本身在這裡停止。
      覺察 難度等級（DC）10 確認裂縫——它們正在以可見的速度擴大。
    map_ref: "MAP-10 — 場景2"
  - name: "第一看守者"
    desc: |
      最古老的密封看守者——由純粹的等待構成。
      交涉 難度等級（DC）18。牠不會攻擊——牠已經等了太久。
      問：你為什麼要打開它？看守者能分辨謊言。
      誠實回答→讓開並說出裡面東西的本質。
      說謊→必須用第一封印之鑰。
    map_ref: "MAP-10 — 場景3"
  - name: "進入密封空間"
    desc: |
      內部不是房間——是記憶的漩渦。
      定錨 難度等級（DC）16 保持自我意識。夥伴需各自定錨 難度等級（DC）12。
    map_ref: "MAP-10 — 場景4"
  - name: "面對被否認者"
    desc: |
      它的形態取決於玩家過往的決定——它是所有未被選擇的選項的集合。
      交涉 難度等級（DC）20 終極交涉。它想要被承認存在過。
    map_ref: "MAP-10 — 場景5"
  - name: "最終決定"
    desc: "三個結局選項——見下方。"
    map_ref: "MAP-10 — 場景6（結局選擇）"

endings:
  - name: "承認並釋放"
    desc: |
      你承認被否認者的存在。它融入現實，成為新的可能性。
      歸還印記 +3，永久傳說之印。
  - name: "重新封印但記住"
    desc: |
      你不打開它，但你記住了它。你在封印外留下定錨物作為見證。
      從此這個密封空間不再是遺忘的。歸還印記 +2。失去定錨物——但不再需要定錨物。
  - name: "拒絕"
    desc: |
      你判斷它太危險。強化封印。看守者感激——牠可以繼續存在。
      歸還印記 +1。未來可能有其他行者來打開它。

rewards:
  - "歸還印記 × 1-3（取決於結局）"
  - "傳說之印（歸還印記 10+ 完整效果）"
  - "角色完成完整旅程——此角色可作為 NPC 出現在 GM 未來團務中"
  - "夥伴忠誠度影響：陪同到最後的夥伴忠誠度 +2"

companion_recruitment: []

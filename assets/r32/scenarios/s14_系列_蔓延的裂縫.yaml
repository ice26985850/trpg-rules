name: "蔓延的裂縫（多人）"
type: "間隙氾濫"
difficulty: "★★★★"
recommended_marks: "5-8"
players: "3-5 人"
play_time: "3-4 次聚會"
core_attributes: ["AW", "TR", "AN"]

opening: |
  這不是委託——是緊急事件。城東老舊社區正在「消失」——空間本身在崩解。
  一個資深間隙行者發出警訊：「有人在前代密封空間放了不該放的東西。裂縫正在擴大。
  如果三天內不處理，整片區域會變成永久性間隙層。」

npcs:
  - name: "老陳的筆記"
    type: "線索"
    desc: "前代間隙行者留下的密封紀錄，分散三處：舊住處（表層）、私人門檻（間隙層）、未投遞的信"
    companion_eligible: false
  - name: "小女孩的殘影"
    type: "被遺忘者"
    desc: "1940年代空襲失蹤的小女孩，拾遺 難度等級（DC）22 才能取回；她不是邪惡，是被遺忘本身"
    companion_eligible: false
  - name: "通道守衛"
    type: "間隙生物"
    desc: "永遠跨不過門檻的馬（來自舊馬廄），擋住通往核心區的唯一路徑"
    companion_eligible: false
  - name: "當地居民"
    type: "定錨點"
    desc: "封鎖區內拒絕撤離的少數居民；其中一位老人是小女孩的弟弟，現年80多歲，唯一「定錨點」"
    companion_eligible: false

lost_items:
  - name: "小女孩的書包"
    tier: "記憶結晶"
    dc: 15
    location: "封鎖區間隙——一所學校的殘影"
    effect: "看到她被遺忘的那一刻"
  - name: "弟弟的照片"
    tier: "普通遺失物"
    dc: 8
    location: "封鎖區間隙——一棟老宅"
    effect: "喚起小女孩對弟弟的記憶"
  - name: "老陳的封印筆記"
    tier: "間隙造物"
    dc: 18
    location: "三個位置拼湊"
    effect: "獲得「關於這間密封空間的知識標記」"

gap_creatures:
  - name: "通道守衛（馬）"
    type: "門檻守衛"
    negotiation_dc: 16
    location: "核心區邊緣"
    liberation: "說出本名自動成功（線索在老陳筆記中）；每次交涉後等待3回合 難度等級（DC）-2"
    reward: "讓出通往核心區的路徑"
  - name: "被遺忘者（小女孩）"
    type: "被遺忘者"
    negotiation_dc: 22
    location: "裂縫中心"
    liberation: "有照片+書包+名字三件物品時 難度等級（DC）降至16；弟弟在場時降至10"
    reward: "歸還印記 +1；裂縫開始癒合"

scenes:
  - name: "評估裂縫"
    desc: "抵達封鎖區邊緣。覺察 難度等級（DC）12 看見空間異常；穿梭 難度等級（DC）18 安全進入，失敗損失 1d4 間隙耐力（GE）。"
    map_ref: "MAP-07（城東裂縫社區）— 封鎖區入口"
  - name: "對抗擴張"
    desc: "裂縫每天擴張10公尺，穿梭 難度等級（DC）+2/天。需在三天內解決。"
    map_ref: "MAP-07 — 封鎖區間隙"
  - name: "通道守衛"
    desc: "核心區外圍的馬形守衛。交涉 難度等級（DC）16；等待策略每次 -2。"
    map_ref: "MAP-07 — 通往裂縫核心的路徑"
  - name: "找到老陳的筆記"
    desc: "三份拼圖式筆記記錄封印方法、小女孩名字、解放嘗試。完整閱讀獲得知識標記。"
    map_ref: "MAP-07 — 老宅/學校/核心旁"
  - name: "小女孩——被遺忘者"
    desc: "核心區找到她。拾遺 難度等級（DC）22 辨識身份；需弟弟照片、書包、名字三件。"
    map_ref: "MAP-07 — 裂縫中心"
  - name: "解放 vs 封印"
    desc: "解放（交涉 難度等級（DC）22，有物品時16）讓裂縫癒合；或重新封印（定錨 難度等級（DC）20）延緩。"
    map_ref: "MAP-07 — 裂縫中心"
  - name: "協助解放的弟弟"
    desc: "80多歲老人願意來間隙見妹妹。他在場時解放 難度等級（DC）降至10。"
    map_ref: "MAP-07 — 表層老宅"

endings:
  - "解放成功：裂縫癒合，弟弟與妹妹殘影短暫相見。歸還印記 +1，特殊成就"
  - "封印成功：暫時安全，未來可能成為其他劇本伏筆"
  - "解放失敗：街區被間隙吞沒，可能觸發間隙病檢定"

rewards:
  - "歸還印記 × 2（解放成功時）"

companion_recruitment: []

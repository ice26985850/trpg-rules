name: "深間隙"
type: "探索 / 生存（最深層間隙）"
difficulty: "★★★★★"
recommended_marks: "8-10"
play_time: "2-3 次聚會"
core_attributes: ["all"]
prerequisites:
  - "持有定錨物"
  - "建議有忠誠度≥3的夥伴陪同"
  - "建議從劇本 6 獲得銅鏡碎片"

opening: |
  你在千年收集者的地圖上找到了一個標記：「此處以下——無人歸來。」
  那不是密封空間——是深間隙。間隙的底部——由數千年來所有遺忘疊加而成。
  你的定錨物產生了共鳴——它在指向深處。

npcs:
  - name: "老莫（夥伴）"
    type: "前代行者"
    desc: "若已招募，可陪同進入。年輕時曾試圖探索深間隙——到達第二層後撤退"
    companion_eligible: true
    available_from: "劇本 9（若之前已招募）"
  - name: "不存在的人"
    type: "被遺忘者的殘餘"
    desc: "不是生物——是被所有人徹底遺忘的可能性殘餘"
  - name: "間隙的聲音"
    type: "間隙本身的反應"
    desc: "不是生物，不是意識——是間隙對有東西在動的反應"

deep_gap_rules: |
  深間隙專屬規則：
  - 每層 間隙耐力（GE） 消耗 +1：第一層 -2/回合，第二層 -3/回合，第三層 -4/回合
  - 時間流速使用 d6+2（最低 3，最高 8 天）
  - 間隙病惡化檢定頻率加倍（每場景一次）
  - 無法定向——所有穿梭 難度等級（DC） +2
  - 銅鏡碎片提供光源且可短暫穩定方向（1 次/層，穿梭優勢）

scenes:
  - name: "第一層：記憶沉積層"
    desc: |
      無數年代的建築殘影疊加——中世紀石牆穿過現代玻璃帷幕。
      覺察 難度等級（DC）10 找到前人行者的足跡。
    map_ref: "MAP-09（深間隙三層結構）— 第一層區域"
  - name: "第二層：可能性之海"
    desc: |
      物理規則開始失效。空間充滿未被選擇的道路的殘影。
      定錨 難度等級（DC）14 抵抗被吸入自己的可能性。失敗→迷失狀態。
    map_ref: "MAP-09 — 第二層區域"
  - name: "第三層：無名者之城"
    desc: |
      由被遺忘的存在構成的城市。一切在緩慢崩解。
      交涉 難度等級（DC）16 與其中之一對話——牠記得一些但無法說出。
    map_ref: "MAP-09 — 第三層區域"
  - name: "底部：鏡面"
    desc: |
      深間隙底部是一面無限大的鏡面。鏡中的你是所有版本中最接近真實的你。
      鏡中的你會對你說話：你終於到了。
      選擇：觸碰鏡面 / 接受對應物離開 / 拒絕
    map_ref: "MAP-09 — 底部鏡面"

endings:
  - "觸碰鏡面：定錨物變成完全定錨物（間隙耐力（GE）+10）。一部分永遠留在鏡子裡"
  - "接受對應物離開：定錨物提升為深層定錨物（間隙耐力（GE）+8）。無副作用"
  - "拒絕：所有定錨檢定永久優勢——你的定錨不來自物品

rewards:
  - "歸還印記 × 2"
  - "強化定錨物（依選擇）+ 間隙耐力（GE） 上限提升"
  - "間隙深度知識標記（未來所有深間隙相關檢定優勢）"
  - "若夥伴陪同到底：夥伴忠誠度 +1"

companion_recruitment:
  - "老莫（若陪同到底）→ 忠誠度 +1"

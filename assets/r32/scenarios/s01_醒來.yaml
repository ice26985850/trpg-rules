name: "醒來"
type: "角色起源（教學）"
difficulty: "☆"
recommended_marks: 0
play_time: "1 次聚會"
core_attributes: ["AW", "TR", "RE", "NG", "AN"]

opening: |
  你不是接到委託才來的。你是醒了。
  今天早上你像往常一樣走進辦公室的玻璃門——但玻璃的另一側不是大廳。
  是一條走廊。一條你從未見過的、比應有的長了三倍的走廊。
  你回頭——玻璃門還在，但門外是灰白色的光，沒有街道、沒有人。
  你被困在間隙中了。

npcs:
  - name: "老莫"
    type: "前代行者／導師"
    desc: "60多歲退休行者。在間隙中釣魚——用記憶結晶碎片當餌"
    companion_eligible: false
    companion_unlock: "劇本 9 後可招募"

scenes:
  - name: "醒來"
    desc: |
      玩家在間隙中醒來。GM 描寫間隙的感官（光線來自錯誤方向、腳步聲延遲）。
      被動覺察（10+AW）自動感知空間異常。
    checks:
      - "被動覺察：自動揭示初始線索"
  - name: "遇見老莫"
    desc: |
      老莫坐在走廊中間的折疊椅上。
      教學三大基本行動：確認層級（AN 難度等級（DC）8）、移動（TR 難度等級（DC）6）、觀察表層（AW 難度等級（DC）8）。
  - name: "第一次搜索"
    desc: "拾遺 難度等級（DC）6 找到一串舊鑰匙（普通遺失物）。"
    checks:
      - "拾遺 難度等級（DC）6：搜索走廊"
  - name: "鏡像出現"
    desc: |
      走廊另一端出現玩家的鏡像。老莫：「看著牠退出間隙。」
      交涉 難度等級（DC）6——與鏡像的非語言互動（保持眼神接觸、緩慢後退）。
    checks:
      - "交涉 難度等級（DC）6：與鏡像互動"
    notes: "永遠不要背對鏡像——這是間隙鐵律"
  - name: "找到出口"
    desc: "天然門檻 難度等級（DC）6。穿梭檢定。成功→回到表層。失敗→老莫協助（優勢）。"
    checks:
      - "穿梭 難度等級（DC）6：進入天然門檻"
  - name: "回到表層"
    desc: "時間只過了 3 分鐘。但門框上多了金色殘光——你永遠看得到間隙了。"

endings:
  - "老莫成為聯絡人（幕間可拜訪，拾遺知識 +2）"
  - "獲得第一件遺失物：一串舊鑰匙（來源不明）"

rewards:
  - "歸還印記 × 0（教學劇本）"

companion_recruitment: []

name: "鏡像迷宮"
type: "鏡像追逐 / 心理驚悚"
difficulty: "★★★★"
recommended_marks: "7-8"
play_time: "2-3 次聚會"
core_attributes: ["AN", "NG", "AW"]

opening: |
  這不是委託——這是個人的。
  你的鏡像開始做出不該有的動作。
  起初只是微小的偏差——你停下來時牠慢了半秒。
  但上次在間隙中，牠對你說話了。用你的聲音，說的是你不知道的事：
  「你還記不記得那年夏天？在橋下——你拋下的是什麼？」
  你沒有在橋下拋下任何東西。但你的確有一段空缺的記憶。

gm_notes: |
  此劇本高度個人化。GM 需與玩家秘密溝通：
  1. 角色童年一段被遺忘的記憶（可來自角色創建步驟5「你丟過的東西」）
  2. 鏡像知道的事——與那段記憶相關
  3. GM 選擇結局方向：融合、分離、犧牲

scenes:
  - name: "第一次異常"
    desc: |
      在例行穿梭時看到鏡像的異常行為。
      牠結束了模仿，站著不動——說了一句話。
      定錨 難度等級（DC）10 確認這不是幻覺。
    map_ref: "MAP-08（鏡像追蹤路徑）— 場景A（起點）"
  - name: "追蹤"
    desc: "鏡像在間隙中移動，留下殘響路徑。覺察 難度等級（DC）10 追蹤。"
    map_ref: "MAP-08 — 場景A→場景B的路徑"
  - name: "挖掘記憶"
    desc: |
      拾遺 難度等級（DC）13 在童年家的間隙找到日記（記憶結晶）。
      看到兒時好友溺水那天——你在場，但因恐懼沒有求助。
    map_ref: "MAP-08 — 場景B（童年家間隙層）"
  - name: "記憶守衛"
    desc: |
      通往橋的路徑被通道守衛擋住。
      交涉 難度等級（DC）12。需要一段真實回憶才能通過。
    map_ref: "MAP-08 — 場景C（記憶守衛阻斷處）"
  - name: "橋下的對決"
    desc: "三個結局選項——見下文。"
    map_ref: "MAP-08 — 場景D（橋下終點）"

mirror_stages:
  - stage: 1
    name: "暗示"
    desc: "鏡像延遲反應、微小偏差"
    check: "覺察 難度等級（DC）10 確認異常"
  - stage: 2
    name: "對話"
    desc: "鏡像開始說話，用你的聲音說你不知道的事"
    check: "定錨 難度等級（DC）12 確認這是幻覺還是真的"
  - stage: 3
    name: "對決"
    desc: "鏡像在橋下等你"
    check: "見結局選項"

endings:
  - name: "融合"
    desc: "鏡像與你融合。間隙病逆轉一階段。所有定錨檢定永久優勢。"
  - name: "拒絕"
    desc: "鏡像留在間隙成為獨立存在。定錨難度等級（DC）16抵抗間隙病惡化。未來可能再遇。"
  - name: "犧牲"
    desc: "若處於任何間隙病階段，鏡像代替承受。你康復，永久失去鏡像。"

rewards:
  - "歸還印記 × 1（歸還記憶給自己）"
  - "融合結局：永久優勢（所有定錨檢定）"
  - "拒絕結局：未來鏡像相關劇情可繼續"
  - "犧牲結局：角色康復"

companion_recruitment: []

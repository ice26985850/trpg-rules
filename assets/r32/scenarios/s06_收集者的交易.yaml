name: "收集者的交易"
type: "交涉 / 情報蒐集"
difficulty: "★★★"
recommended_marks: "4-6"
play_time: "1-2 次聚會"
core_attributes: ["NG", "RE"]

opening: |
  你在間隙中注意到一個異常——某個區域的遺失物正在移動。
  追蹤這現象，你發現了一個極其古老的遺失物收集者。
  牠已經在間隙中待了超過一千年。
  牠的收藏中包含著失傳的間隙知識。

npcs:
  - name: "千年收集者"
    type: "間隙生物（上古遺失物收集者）"
    desc: "不是人類轉化的——是一把漢朝銅鏡在意識沉積中醒來"
    companion_eligible: false
  - name: "三個小型收集者"
    type: "間隙生物（子嗣）"
    desc: "各自守護一件關鍵物品"

scenes:
  - name: "追蹤現象"
    desc: "覺察 難度等級（DC）8 發現遺失物移動軌跡。穿梭 難度等級（DC）8 追蹤至收集者巢穴。"
  - name: "第一次接觸"
    desc: "千年收集者好奇。交涉 難度等級（DC）12 建立初步對話。"
  - name: "試煉一：一首詩"
    desc: "收集者 A 要一首與失去相關的詩。玩家即興創作或背誦。"
  - name: "試煉二：一段沉默"
    desc: "收集者 B 要一段沉默。玩家需保持沉默 3 回合。GM 描述異常現象測試。"
  - name: "試煉三：一個名字"
    desc: "收集者 C 要一個名字。需從老莫或其他行者處獲得。"
  - name: "收穫"
    desc: |
      千年收集者展示失傳的間隙地圖——顯示附近一個新密封空間位置。
      可選擇用一件遺失物交換間隙知識標記。

endings:
  - "完成試煉→間隙地圖（劇本 9/10 伏筆）+ 銅鏡碎片（間隙造物）"
  - "額外→對收集者永久交涉 難度等級（DC） -2 標記"

rewards:
  - "歸還印記 × 1"
  - "銅鏡碎片（間隙造物——深間隙中唯一穩定光源）"
  - "間隙知識標記（對所有收集者交涉永久優勢）"
  - "解鎖新密封空間位置（伏筆）"

companion_recruitment: []

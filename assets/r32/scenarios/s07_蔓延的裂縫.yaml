name: "蔓延的裂縫"
type: "間隙氾濫（緊急事件）"
difficulty: "★★★★"
recommended_marks: "6-8"
play_time: "2-3 次聚會"
core_attributes: ["AW", "TR", "AN"]
time_pressure: "三天內不處理→整片區域永久變成間隙層"

opening: |
  城東老舊社區正在消失——巷道透視是錯的，家門打開後不是自己的客廳，
  地下室向下走三層還沒到底。三個居民失蹤。市政府封鎖三個街區。
  緊急警訊：密封空間裂縫正在擴大。有人在裡面放了不該放的東西。

npcs:
  - name: "小女孩殘影"
    type: "被遺忘者"
    desc: "1940年代空襲中失蹤的女孩。不是邪惡——她被遺忘本身困住了"
    companion_eligible: false
  - name: "80歲弟弟"
    type: "關鍵知情者"
    desc: "小女孩的弟弟。唯一知道真相的人。在場時解放 難度等級（DC） 降至 10"
    companion_eligible: false
  - name: "通道守衛（馬）"
    type: "通道守衛"
    desc: "守在關鍵路徑上。交涉 難度等級（DC）14（等待3回合難度等級（DC）-2）"

scenes:
  - name: "評估裂縫"
    desc: "覺察 難度等級（DC）10 看到空間異常。穿梭 難度等級（DC）16 安全進入（單人已-2）。"
    map_ref: "MAP-07（城東裂縫社區）— 封鎖區入口"
  - name: "對抗擴張"
    desc: "裂縫每天擴張10公尺。每過一天穿梭難度等級（DC）+2。三天內必須解決。"
    map_ref: "MAP-07 — 三天倒數表"
  - name: "通道守衛"
    desc: "交涉難度等級（DC）14。每次等待3回合難度等級（DC）-2。說出本名自動成功。"
    map_ref: "MAP-07 — 通道守衛位置（老宅→裂縫間路徑）"
  - name: "找老行者筆記"
    desc: "三份拼圖式筆記記錄封印方法和女孩名字。"
    map_ref: "MAP-07 — 筆記分散三處（老宅/學校/裂縫）"
  - name: "解放vs封印"
    desc: |
      找到小女孩。她蹲在角落重複唱歌。
      需要三件物品（照片+書包+名字）解放。
      解放：交涉難度等級（DC）20（有三件物品則難度等級（DC）14）。成功→她微笑消失。
      封印：定錨難度等級（DC）18。暫時安全，數月後再擴張。
      失敗：第三天裂縫吞沒街區。居民開始忘記自己住過這裡。
    map_ref: "MAP-07 — 裂縫中心（小女孩殘影位置）"
  - name: "兄弟重逢"
    desc: |
      若 80 歲弟弟願意來間隙見妹妹——
      在場時解放 難度等級（DC） 降至 10。
    map_ref: "MAP-07 — 老宅間隙版（弟弟所在位置）"

key_choice: |
  - 解放小女孩→裂縫癒合，歸還印記 +1
  - 重新封印→暫時安全，未來可繼續
  - 解放失敗→街區被間隙吞沒

rewards:
  - "歸還印記 × 1-2"
  - "知識標記：密封空間長期優勢"

companion_recruitment: []

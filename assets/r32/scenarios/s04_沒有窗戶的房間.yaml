name: "沒有窗戶的房間"
type: "密封調查"
difficulty: "★★★"
recommended_marks: "3-4"
play_time: "2 次聚會"
core_attributes: ["AW", "NG", "AN"]

opening: |
  建築師林先生私下聯絡你。事務所正在改建一棟百年洋樓。
  施工隊在三樓發現一個「不存在的房間」——藍圖上有，但所有窗戶被磚頭封死，
  唯一門從內側焊死。任何試圖打開它的工人都會感到「無法呼吸」。
  藍圖標註：「1923年9月——封存。」

npcs:
  - name: "林先生"
    type: "委託人"
    desc: "40多歲建築師，實用主義者但被這房間嚇到"
    companion_eligible: false
  - name: "老醫師"
    type: "知情者"
    desc: "80多歲退休醫師，1940年代在此實習"
    companion_eligible: true
    companion_template:
      type: "知情人"
      stats: { RE: 5, AW: 4 }
      special: "專業鑑定：判定遺失物歸屬時優勢"
      loyalty: 2
      available_from: "劇本 4"
  - name: "密封看守者"
    type: "密封看守者"
    desc: "守在裂縫旁——不是敵意，在等夠格的人"

lost_items:
  - name: "銀色小盒（鑰匙）"
    tier: "善意遺留物"
    solo_dc: 10
    location: "一樓診間間隙層"
    effect: "可作為交換籌碼讓看守者退開"
  - name: "轉讓文件"
    tier: "記憶結晶"
    solo_dc: 13
    location: "密封空間內部"
    effect: "看到1923年原主人簽署文件的瞬間"
  - name: "女主人的梳子"
    tier: "普通遺失物"
    solo_dc: 6
    location: "二樓間隙層——原主人臥室"
    effect: "相關交涉 +1"

scenes:
  - name: "表層調查"
    desc: "覺察 難度等級（DC）8 發現門框周圍太乾淨了——沒有灰塵、沒有磨損。"
    map_ref: "MAP-04（百年洋樓平面圖）— 場景1"
  - name: "找鑰匙"
    desc: |
      老醫師提供線索。穿梭 難度等級（DC）8 進入間隙。
      拾遺 難度等級（DC）10 找到銀色小盒（刻字：原諒我）。
    map_ref: "MAP-04（百年洋樓平面圖）— 間隙擴充區域（地下診間）"
  - name: "密封看守者"
    desc: "交涉 難度等級（DC）16。出示銀色小盒→看守者退開。"
    map_ref: "MAP-04 — 二樓走廊裂縫入口"
  - name: "進入密封空間"
    desc: |
      1923年書房。男人殘影保持簽名姿勢。
      拾遺 難度等級（DC）13找到轉讓文件——原主人將財產轉給患病妻子後自殺。
    map_ref: "MAP-04 — 密封房間內部（間隙層）"
  - name: "解封"
    desc: "拿走文件後，封閉解除。窗外磚頭碎裂，陽光射入。"
    map_ref: "MAP-04 — 密封房間三樓結構"
  - name: "歸還"
    desc: "將真相告知林先生。選擇：公開（房間成為建築特色）或保密。"
    map_ref: "—"

sealed_space:
  reason: "被刻意封印"
  content: "1923年私人書房。原主人在此簽署財產轉讓給患病妻子後自殺"
  key: "銀色小盒（鑰匙）"
  risk: "進入後裂縫可能消失——被困在密封空間中"

endings:
  - "公開歷史：房間成為建築特色保留"
  - "保密：房間解封後變普通房間。林先生私下感謝"
  - "招募老醫師：成為知情人夥伴（專業鑑定優勢）"

rewards:
  - "歸還印記 × 2"

companion_recruitment:
  - "老醫師（若建立信任）→ 知情人夥伴，忠誠度初始3"

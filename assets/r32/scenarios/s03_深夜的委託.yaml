name: "深夜的委託"
type: "尋物委託 + 首次交涉"
difficulty: "★★"
recommended_marks: "1-2"
play_time: "1-2 次聚會"
core_attributes: ["NG", "TR"]

opening: |
  「夜航」咖啡館的老闆阿凱深夜聯絡你。
  工讀生小夏（19歲）在關店時把祖母留下的銀鐲子忘在了咖啡館。
  但鐲子不在表層了——「掉下去了」。
  阿凱能感知到鐲子在間隙中，但他自己進不去。

npcs:
  - name: "阿凱"
    type: "敏感者"
    desc: "夜航咖啡館老闆。50多歲，認識本地所有行者"
    companion_eligible: true
    companion_template:
      type: "敏感者"
      stats: { AW: 5, NG: 4 }
      special: "本地情報：表層訪問 難度等級（DC） -3"
      loyalty: 2
      available_from: "劇本 3"

  - name: "小夏"
    type: "剛覺醒的間隙行者"
    desc: "19歲工讀生。能看到間隙但不知道那是什麼"
    companion_eligible: true
    companion_template:
      type: "實習行者"
      stats: { TR: 3, RE: 4 }
      special: "敏銳嗅覺：搜索遺失物優勢"
      loyalty: 2
      available_from: "劇本 3"

  - name: "遺失物收集者"
    type: "間隙生物"
    desc: "被銀鐲子的共鳴吸引到咖啡館間隙中覓食"

lost_items:
  - name: "銀鐲子"
    tier: "善意遺留物"
    solo_dc: 10
    location: "咖啡館間隙——小夏座位下方"
    effect: "消耗恢復 1d6+2 間隙耐力（GE）"
  - name: "祖母的舊食譜"
    tier: "普通遺失物"
    solo_dc: 6
    location: "咖啡館間隙——廚房"
    effect: "顯示鐲子對小夏的情感意義；相關交涉 +1"
  - name: "一封遺書"
    tier: "記憶結晶"
    solo_dc: 13
    location: "收集者身上（需交換故事獲取）"
    effect: "看到收集者曾經是行者時的記憶片段"

gap_creatures:
  - name: "遺失物收集者"
    negotiation_dc: 12
    exchange: "要一個新的故事——玩家講述一件自己的遺憾"
    gives: "銀鐲子 + 線索：鐲子是祖母故意留下的"
    notes: "真誠交涉 難度等級（DC） -2，敷衍 +2"

scenes:
  - name: "表層調查"
    desc: "覺察 難度等級（DC）8 確認鐲子不在表層。阿凱描述掉下去的感覺。"
  - name: "進入間隙"
    desc: "咖啡館大門是天然門檻 難度等級（DC）6。穿梭後發現咖啡館在間隙中比表層大一倍。"
  - name: "搜索"
    desc: |
      拾遺 難度等級（DC）6 找到祖母食譜。
      食譜夾著紙條：『給小夏，這鐲子是我媽給我的。現在是妳的。不要弄丟。』
      但鐲子不在座位下。
  - name: "遭遇收集者"
    desc: |
      收集者正把鐲子放進收藏中。交涉 難度等級（DC）12。
      牠要一個新的故事。玩家需角色扮演講述自己的遺憾。
      真誠 難度等級（DC） -2，敷衍 難度等級（DC） +2。
  - name: "交換成功"
    desc: |
      收集者交出鐲子：「這鐲子不是掉下去的——有人反覆戴上去又拿下來。
      猶豫把現實磨薄了。」
  - name: "真相揭露"
    desc: |
      小夏的祖母上個月過世。小夏每晚關店後都戴著鐲子坐很久——
      她不知道自己正在磨薄現實。她快要覺醒了。

endings:
  - "歸還鐲子+告知小夏真相→小夏成為實習行者夥伴（忠誠度3）"
  - "僅歸還鐲子→歸還印記+1"
  - "保留鐲子→可使用善意遺留物效果，但小夏會一直找你"

rewards:
  - "歸還印記 × 1-2"
  - "可招募阿凱或小夏為夥伴"

companion_recruitment:
  - "阿凱（若幫助過他）→ 敏感者夥伴，忠誠度初始3"
  - "小夏（若告知真相）→ 實習行者夥伴，忠誠度初始3"

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 500" font-family="Microsoft JhengHei, sans-serif">
  <!-- Background -->
  <rect width="680" height="500" fill="#1a1a2e"/>
  
  <!-- Title -->
  <text x="340" y="25" text-anchor="middle" fill="#c4b5fd" font-size="16" font-weight="bold">The Backrooms Administration Bureau — Level 1 Outpost Floor Plan</text>

  <!-- Regions -->
  <rect x="30" y="100" width="140" height="100" rx="8" fill="#2D6B6B" opacity="0.3"/>
  <text x="100" y="80" text-anchor="middle" fill="#4ECDC4" font-size="10">Research Zone</text>
  
  <rect x="30" y="210" width="140" height="150" rx="8" fill="#6B5B8A" opacity="0.3"/>
  <text x="100" y="200" text-anchor="middle" fill="#a78bfa" font-size="10">Logistics Zone</text>
  
  <rect x="180" y="100" width="200" height="170" rx="8" fill="#4A4A6A" opacity="0.3"/>
  <text x="280" y="90" text-anchor="middle" fill="#818cf8" font-size="10">Core Zone</text>
  
  <rect x="390" y="100" width="140" height="200" rx="8" fill="#8A4A4A" opacity="0.3"/>
  <text x="460" y="90" text-anchor="middle" fill="#f87171" font-size="10">Combat Zone</text>

  <!-- Node boxes -->
  <!-- intel_center (15,15 → 15,110 on scale) -->
  <rect x="40" y="120" width="110" height="40" rx="6" fill="#2a2a4a" stroke="#4ECDC4" stroke-width="1.5"/>
  <text x="95" y="145" text-anchor="middle" fill="#e0e0e0" font-size="10">Intelligence Center</text>
  
  <!-- lab (15,60 → 40,350) -->
  <rect x="40" y="350" width="110" height="40" rx="6" fill="#2a2a4a" stroke="#4ECDC4" stroke-width="1.5"/>
  <text x="95" y="375" text-anchor="middle" fill="#e0e0e0" font-size="10">R&amp;D Lab</text>

  <!-- comms (35,15 → 190,120) -->
  <rect x="190" y="120" width="110" height="40" rx="6" fill="#2a2a4a" stroke="#f87171" stroke-width="1.5"/>
  <text x="245" y="145" text-anchor="middle" fill="#e0e0e0" font-size="10">Communications Center</text>

  <!-- briefing (30,35 → 190,200) -->
  <rect x="190" y="195" width="110" height="40" rx="6" fill="#2a2a4a" stroke="#818cf8" stroke-width="1.5"/>
  <text x="245" y="220" text-anchor="middle" fill="#e0e0e0" font-size="10">Mission Briefing Room</text>

  <!-- office (50,50 → 280,250) -->
  <rect x="270" y="240" width="130" height="50" rx="6" fill="#3a3a5a" stroke="#c4b5fd" stroke-width="2"/>
  <text x="335" y="260" text-anchor="middle" fill="#c4b5fd" font-size="11" font-weight="bold">Director's Office</text>
  <text x="335" y="278" text-anchor="middle" fill="#999" font-size="8">Core Command Center</text>

  <!-- medbay (75,35 → 400,200) -->
  <rect x="400" y="195" width="110" height="40" rx="6" fill="#2a2a4a" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="455" y="220" text-anchor="middle" fill="#e0e0e0" font-size="10">Medical Station</text>

  <!-- armory (85,60 → 440,350) -->
  <rect x="435" y="340" width="110" height="40" rx="6" fill="#2a2a4a" stroke="#f87171" stroke-width="1.5"/>
  <text x="490" y="365" text-anchor="middle" fill="#e0e0e0" font-size="10">Armory</text>

  <!-- training (85,15 → 540,120) -->
  <rect x="540" y="120" width="110" height="40" rx="6" fill="#2a2a4a" stroke="#f87171" stroke-width="1.5"/>
  <text x="595" y="145" text-anchor="middle" fill="#e0e0e0" font-size="10">Training Ground</text>

  <!-- storage (65,15 → 540,350) -->
  <rect x="540" y="340" width="110" height="40" rx="6" fill="#2a2a4a" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="595" y="365" text-anchor="middle" fill="#e0e0e0" font-size="10">Supply Depot</text>

  <!-- barracks (25,72 → 40,420) -->
  <rect x="35" y="415" width="110" height="40" rx="6" fill="#2a2a4a" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="90" y="440" text-anchor="middle" fill="#e0e0e0" font-size="10">Explorer Dormitory</text>

  <!-- mess (70,72 → 440,420) -->
  <rect x="435" y="415" width="110" height="40" rx="6" fill="#2a2a4a" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="490" y="440" text-anchor="middle" fill="#e0e0e0" font-size="10">Canteen</text>

  <!-- entrance (50,80 → 280,400) -->
  <rect x="270" y="395" width="130" height="40" rx="6" fill="#2a2a4a" stroke="#818cf8" stroke-width="1.5"/>
  <text x="335" y="420" text-anchor="middle" fill="#e0e0e0" font-size="10">Outpost Main Entrance</text>

  <!-- exit_l1 (50,90 → 280,460) -->
  <rect x="270" y="455" width="130" height="35" rx="15" fill="#4a2a2a" stroke="#f87171" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="335" y="477" text-anchor="middle" fill="#f87171" font-size="9">To Level 1 Corridor →</text>

  <!-- Corridor lines -->
  <line x1="150" y1="140" x2="190" y2="140" stroke="#555" stroke-width="1.5"/>
  <line x1="300" y1="140" x2="400" y2="140" stroke="#555" stroke-width="1.5"/>
  <line x1="150" y1="370" x2="190" y2="370" stroke="#555" stroke-width="1.5"/>
  
  <line x1="245" y1="160" x2="245" y2="195" stroke="#555" stroke-width="1.5"/>
  <line x1="245" y1="235" x2="245" y2="395" stroke="#555" stroke-width="1.5"/>
  
  <line x1="300" y1="290" x2="300" y2="395" stroke="#555" stroke-width="1.5"/>
  <line x1="335" y1="290" x2="335" y2="395" stroke="#555" stroke-width="1.5"/>
  
  <line x1="455" y1="235" x2="455" y2="340" stroke="#555" stroke-width="1.5"/>
  <line x1="455" y1="160" x2="540" y2="140" stroke="#555" stroke-width="1.5"/>
  
  <line x1="490" y1="380" x2="490" y2="415" stroke="#555" stroke-width="1.5"/>
  
  <line x1="335" y1="435" x2="335" y2="455" stroke="#f87171" stroke-width="1.5" stroke-dasharray="3,2"/>

  <!-- Legend -->
  <rect x="20" y="470" width="640" height="25" rx="4" fill="#2a2a3a" opacity="0.8"/>
  <text x="60" y="487" fill="#c4b5fd" font-size="9">■ Director's Office</text>
  <text x="180" y="487" fill="#818cf8" font-size="9">■ Core Zone</text>
  <text x="290" y="487" fill="#a78bfa" font-size="9">■ Logistics Zone</text>
  <text x="400" y="487" fill="#f87171" font-size="9">■ Combat Zone</text>
  <text x="510" y="487" fill="#4ECDC4" font-size="9">■ Research Zone</text>
  <text x="620" y="487" fill="#f87171" font-size="9">→ Exit</text>
</svg>

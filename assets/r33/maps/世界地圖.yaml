# 世界地圖（領域關係圖，拓撲關係，非地理圖）
# 座標範圍 0-1000，y 上小下大。共 20 節點、32 連線。
# 註：指令預期 33 連線，但 40 檔 §3-3 實際錄為 32 條，此處忠實轉錄 32 條。
meta:
  name: 世界地圖（World Map）
  type: 領域關係圖（拓撲）
  coord_range: 0-1000
  note: 實體的領域以非歐幾里得拼接，距離無意義，連線關係才有意義。營火正中、八領域環內環、虛空在下緣、孤塔左上、無名之心正上方最遠。
  regions:
    - { id: core, 中文名: 核心層, 說明: 營火與其正下方的結構, 底色: 暖橙 }
    - { id: realm_belt, 中文名: 內環·領域帶, 說明: 八個試煉領域, 底色: 冷灰 }
    - { id: rift_belt, 中文名: 外緣·裂界帶, 說明: 實體控制不完全的異常空間, 底色: 靛藍 }
    - { id: void, 中文名: 外緣·虛空, 說明: 棄置地, 底色: 近黑紫 }
    - { id: mortal, 中文名: 現實側, 說明: 滲點所在，不屬於實體領域, 底色: 濁綠 }


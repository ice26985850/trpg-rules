# S2 · 鐵谷裡的刻痕（結構化資料，供 AI GM 引擎讀取）
id: S2
title: 鐵谷裡的刻痕
realm: 廢車場（Autohaven Wreckers, R2）
recommended_prs: "3-5"
duration_min: 180
summary: >-
  玩家發現廢車場車體上有人刻了字，且刻痕在不同次試煉中內容不同——有人在用它們留言，而留言的人已經不在了。本劇本深化「記憶流失是系統性的」與「有人在對抗它」兩條主線。核心設計：刻痕是可蒐集的資訊，但蒐集需要付出行動點（AP），且每則刻痕都在挑戰玩家的認知。幽靈（WRT）作為「無心跳的殺手」教學——它沒有恐怖半徑（TR），玩家必須靠聽覺線索判斷方位。收尾餘燼時刻（Ember Moment）揭露：那些字是艾洛薇自己刻的。


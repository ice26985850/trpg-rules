npcs:
  - name: 艾洛薇·芬奇（Eloise Finch）
    role: 營火記錄者（§8-A）
    lines:
      - "這是我的字。……我每次回來都會忘記。所以我在外面刻，也在自己身上刻。但我從來沒有刻完過那一句。"
  - name: 吉爾馬·薩托（Gilmar Sato）
    role: 拾荒型倖存者（§8-A）
    lines:
      - "下次你看到類似的，記得停下來看。也許那是誰留給你的。"
  - name: 回聲同伴（Echo Companion）· 抱空者
    role: 單人配置（§8-B）
    lines:
      - "若玩家治療它，它會把「懷裡的東西」遞給玩家——那是空的，但玩家獲得 1 希望點（HOP）。"
  - name: 低語者（Whisperer）· 鐵鏽合唱（RC-02）
    role: 情報型造物（EBC 0）
    lines:
      - "金屬記得聲音。你敲，它就回。多敲幾下，我就告訴你哪塊鐵皮上有字。"

choices:
  - id: C1
    question: 是否耗費行動點（AP）讀刻痕
    options:
      - desc: 為讀刻痕放棄對自己有利的行動
        effect: 滿足餘燼時刻（Ember Moment）觸發條件，獲得主線資訊與規則提示
  - id: C2
    question: 第五台發電機（Generator）
    options:
      - desc: 主動修第五台
        effect: 觸發 E6 陷阱（殺手免費位置揭露）
      - desc: 聽從刻痕、用四台達標
        effect: 規避陷阱，仍完成逃脫
  - id: C3
    question: 對回聲·抱空者的對待（單人）
    options:
      - desc: 治療回聲同伴（Echo Companion）
        effect: 獲 1 希望點（HOP），solo 局重要來源

endings:
  - type: 線性（單一結局）
    condition: 完成試煉
    ember_moment: 若玩家為讀刻痕而放棄有利行動則觸發


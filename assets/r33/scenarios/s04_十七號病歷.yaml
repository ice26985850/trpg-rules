# S4 · 十七號病歷（結構化資料，供 AI GM 引擎讀取）
id: S4
title: 十七號病歷
realm: 克羅特斯精神病院（Crotus Prenn Asylum, R4）
recommended_prs: "7-10"
duration_min: 240
summary: >-
  主線轉折點。玩家第一次看見「利他之望（Altruistic Hope）」在系統層面造成的痕跡——幫一個殘影（Haunt）完成未竟之事會吐出記憶，而這些記憶碎片全部朝同一個方向滾：營火。幽咽護士（NRS）可穿牆閃現，全封閉、視線極短，是最幽閉的一場。病歷室是唯一單出口戰鬥地圖（死亡陷阱）。軸心揭露：營火由餘燼（Ember）構成、餘燼由利他之望產生。GM 不應解釋，讓玩家自己說出「所以營火是……」。


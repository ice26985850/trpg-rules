encounters:
  - id: E1
    type: 追逐（Chase）
    content: 幽咽護士（NRS）閃現（穿牆）
    cr: 高（CR 10-13）
    note: 教學：牆不再是掩體
  - id: E2
    type: 解謎
    content: 五個殘影的未竟之事
    cr: 中-困難
    note: 每完成＋2 希望點（HOP）
  - id: E3
    type: 領域造物（Realm Construct）
    content: 灰咽＝病房殘影（RC-05）× N
    cr: 中（CR 4）
    note: EBC 8／隻，敘事解謎型
  - id: E4
    type: 環境
    content: 天井（三樓可摔下／一樓可看見三樓）
    cr: 中
    note: "-"
  - id: E5
    type: 追逐（Chase）
    content: 病歷室封閉遭遇（唯一出口，護士在門口）
    cr: 極高
    note: 死亡陷阱
  - id: E6
    type: 終局
    content: 逃生門（Exit Gate）或地窖（Hatch）
    cr: 高
    note: "-"

npcs:
  - name: 十七號（No.17）
    role: 殘影（§8-D）
    lines:
      - "站在病歷室門口不動，不接受幫助；唸出病歷後轉身抽出妹妹的病歷放在玩家手上，然後散開"
  - name: 莎莉·恩科西（Sally Nkosi）
    role: 植物學者型倖存者（§8-A）
    lines:
      - "若 S3 摘錯囊，她在此「認得十七號的臉」卻說不出為什麼"
  - name: 低語者（Whisperer）· 病歷編號（RC-02 變體）
    role: 情報型造物（EBC 0）
    lines:
      - "編號只是編號。人不是。你問的那個，她從來不是這裡的。"
  - name: 回聲同伴（Echo Companion）· 繫帶子的
    role: 單人配置（§8-B）
    lines:
      - "與殘影「繫帶子的」是同一人兩部分；若玩家同時完成兩者，額外＋3 營火餘燼（Campfire Ember）"

choices:
  - id: C1
    question: 是否幫殘影完成未竟之事
    options:
      - desc: 每完成一個
        effect: ＋2 希望點（HOP）、＋2 營火餘燼（Campfire Ember）、吐出記憶（可能是別人的）
      - desc: 完成 3 個以上＋唸出十七號病歷
        effect: 觸發餘燼時刻（Ember Moment）與軸心揭露
  - id: C2
    question: 是否進病歷室（死亡陷阱）
    options:
      - desc: 進入
        effect: 唯一出口被護士堵門，必須靠第三幕後外牆裂縫（cp_crack）逃出；軸心揭露＋記憶卡
      - desc: 不進
        effect: 無法推進主線，只能純逃脫

endings:
  - type: 線性（軸心揭露是否觸發）
    condition: 取決於抉擇一／二
    ember_moment: 完成 3 個以上殘影＋唸出十七號病歷時觸發


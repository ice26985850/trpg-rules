# S6 · 十三號療程室（結構化資料，供 AI GM 引擎讀取）
id: S6
title: 十三號療程室
realm: 雷利紀念研究所（Léry's Memorial Institute, R6）
recommended_prs: "13-15"
duration_min: 270
summary: >-
  揭穿戰役最殘酷的真相：殺手不全是從外面抓來的，有些是從營火走過去的。玩家認識的那個人——希爾妲·蘭恩（§8-A）——正在被重鑄（Reforge）成緘默者（SIL）。緘默者（SIL）是劇情專屬化身（第 9 名，僅 S6–S8 登場，不進 8 名標準化身池；數據塊由 combat-designer 另補簡化版）。它無恐怖半徑（TR）、會發出倖存者聲音誘導、中途「鏡像交換」讓地圖記憶失效。玩家有三種打斷重鑄的方式，全部有代價；第三種「不打斷」不是壞結局，是有代價的知識獲取。


npcs:
  - name: 希爾妲·蘭恩（Hilda Lane） → 緘默者（SIL）
    role: 前營火同伴／劇情專屬化身（第9名，§8-A）
    lines:
      - "……幫我修一下這台。快好了。（倖存者聲音）"
      - "（轉身後，無聲，只是看著你）"
  - name: 莎莉·恩科西（Sally Nkosi）
    role: 植物學者型倖存者（§8-A）
    lines:
      - "若 S3 摘錯囊，她在此說出重鑄的問答內容（摘到某殺手記憶）"
  - name: 艾洛薇·芬奇（Eloise Finch）
    role: 營火記錄者（§8-A）
    lines:
      - "揭露自己也曾被帶進十三號房，但「沒有成功」——她的恨不夠"
  - name: 回聲同伴（Echo Companion）· 希爾妲
    role: 單人配置，第三幕後（§8-B）
    lines:
      - "若重鑄被打斷且她進虛空，S7 起以回聲形式出現"

choices:
  - id: C1
    question: 十三號療程室如何打斷（三選一，全部有代價）
    options:
      - desc: 喊她的名字（喊真名＋一件只有她會記得的事）
        effect: 她停下，重鑄失敗，被送虛空（後續可救回）；無代價但需回憶前五劇本細節
      - desc: 給她一段記憶（消耗一張自己的記憶卡）
        effect: 重鑄逆轉，保住自我回營火（最佳結局）；永久失去一張記憶卡
      - desc: 不打斷（讓它完成）
        effect: "＋5 實體飢餓度（EH）；希爾妲成殺手在 S7/S8 登場；獲完整重鑄流程知識（S8 接手終局需要）"

endings:
  - type: 分支（依核心抉擇）
    condition: 喊名字／給記憶／不打斷
    ember_moment: 喊名字或給記憶時觸發


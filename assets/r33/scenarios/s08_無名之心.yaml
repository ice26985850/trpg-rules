# S8 · 無名之心（結構化資料，供 AI GM 引擎讀取）
id: S8
title: 無名之心
realm: 遺棄骨場（Forsaken Boneyard, R8） → 孤塔（Lone Tower） → 無名之心（The Nameless Heart）
recommended_prs: "18-20"
duration_min: 360
summary: >-
  封頂劇本。S8 不是一場更難的試煉，而是規則翻轉：發電機（Generator）是引燃器、被掛鉤（Hook）是接觸實體（The Entity）本體的唯一方式、逃脫是放棄、希望點（HOP）是彈藥。第一幕在營火制定計畫（全戰役唯一一次「玩家做主」）。第二幕遺棄骨場試煉＋攀塔。第三幕穿天穹裂口抵達無名之心——實體核心。玩家選擇三種終局之一：燎原（Conflagration）／接手（Succession）／餘火（Banked Fire）。GM 必須在第一幕明確告訴玩家規則翻轉（賦權，不是驚喜）。


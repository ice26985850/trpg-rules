npcs:
  - name: 持鏡人·阿黎（Ari）
    role: 記錄者（§8-D）
    lines:
      - "實體在掛鉤時會親自出手。那是它唯一暴露的時刻。"
  - name: 艾洛薇·芬奇（Eloise Finch）
    role: 營火記錄者（§8-A）
    lines:
      - "餘火終局中遞出鐵皮與釘子：「這次記得刻。」"
  - name: 拾遺者·法恩（Fane）
    role: 隱室主人（§8-D）
    lines:
      - "提供地窖（Hatch）原型機改裝為「反向通道」"
  - name: 吉爾馬·薩托（Gilmar Sato）
    role: 營火同伴（§8-A）
    lines:
      - "若在 S5 救回，第三幕記得玩家名字（八個劇本以來第一次叫對）"
  - name: 希爾妲／緘默者（SIL）
    role: 依 S6 選擇，敵或友（§8-A）
    lines:
      - "敵或友取決於 S6 核心抉擇"
  - name: 無名（Nameless）
    role: 第一位倖存者（§8-D）
    lines:
      - "餘燼時刻（Ember Moment）現身（回頭的姿勢）"

choices:
  - id: C1
    question: 第一幕核心抉擇（玩家制定）
    options:
      - desc: 走哪條路（塔／臍帶／兩者）
        effect: 路徑規劃
      - desc: 誰去被掛鉤（需有人在實體出手瞬間接觸它）
        effect: 接觸執行者
      - desc: 選哪個終局
        effect: 燎原／接手／餘火
  - id: C2
    question: 第三幕終局分歧
    options:
      - desc: 燎原（Conflagration）
        effect: 執行點燃，火勢達標 → 火往實體裡面燒，領域崩解（見火勢等級）
      - desc: 接手（Succession）
        effect: 進入那個洞（需 S6 曾選「不打斷」以獲流程知識）→ 玩家成為新實體
      - desc: 餘火（Banked Fire）
        effect: 第二幕開逃生門逃脫，或第三幕不點火 → 回到營火，火大一點，輪迴繼續

endings:
  - type: 三終局之一
    condition: 取決於第一幕選擇與第三幕執行
    ember_moment: 必定觸發（無論哪終局）


# S7 · 第一顆餘燼（結構化資料，供 AI GM 引擎讀取）
id: S7
title: 第一顆餘燼
realm: 血紅森林（Red Forest, R7）
recommended_prs: "15-18"
duration_min: 300
summary: >-
  主線的武裝劇本：玩家取得第一顆餘燼（The First Ember），並理解營火是什麼、餘燼脈（Ember Vein）與臍帶（Umbilical）是什麼。厚落葉層讓「瀕死爬行反而安全」——全戰役最反直覺的設計。獵斧女（HTR）遠程投擲，「距離不再安全」。第三幕下淨罪神殿三層，抵達餘燼龕（Ember Niche）取走第一顆餘燼。揭示臍帶：餘燼從實體（The Entity）身上出來，與它同一種東西，火是會傳的。


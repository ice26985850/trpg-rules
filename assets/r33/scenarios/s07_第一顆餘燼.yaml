npcs:
  - name: 無名（Nameless）
    role: 骸骨／第一位倖存者（§8-D）
    lines:
      - "我本來已經出去了。門開著。我一隻腳已經在外面。然後我聽見後面有人在叫。我不認識他。我回頭的時候沒有想什麼。只是覺得，一個人出去，好像不太對。……我把它放在這裡。如果你讀到這裡——那你大概也回過頭。把它拿走。"
  - name: 艾洛薇·芬奇（Eloise Finch）
    role: 營火記錄者（§8-A）
    lines:
      - "「我們讓它吐更多呢？」（軸心台詞）"
  - name: 持鏡人·阿黎（Ari）
    role: 首次現身（§8-D）
    lines:
      - "提供 S8 路徑：孤塔（Lone Tower）"
  - name: 希爾妲／緘默者（SIL）
    role: 依 S6 選擇（§8-A）
    lines:
      - "若已重鑄，作為第二名殺手登場；若已救回，協助玩家"

choices:
  - id: C1
    question: 是否主動趴下（厚落葉層）
    options:
      - desc: 站立逃跑
        effect: 留 3 輪痕跡、有腳步聲
      - desc: 瀕死爬行
        effect: 完全隱蔽但慢；全戰役最安全的移動方式，也是 S8「主動放棄逃脫」的心理準備
  - id: C2
    question: 營火餘燼（Campfire Ember）是否達門檻
    options:
      - desc: 達門檻
        effect: 直接取得第一顆餘燼（The First Ember）
      - desc: 未達
        effect: 觸發追加試煉（神殿內存活輪數後取得）

endings:
  - type: 分支（取餘燼是否觸發追加試煉）
    condition: 取決於抉擇二

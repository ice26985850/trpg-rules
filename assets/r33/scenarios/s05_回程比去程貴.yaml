npcs:
  - name: 吉爾馬·薩托（Gilmar Sato）
    role: 已墜虛空的營火同伴（§8-A）
    lines:
      - "……名字？我好像有過一個。但那是很久以前的事了。你……認識我？"
  - name: 拾遺者·法恩（Fane）
    role: 隱室主人（§8-D）
    lines:
      - "它不是不會被騙。它是不會發現自己被騙了。"
  - name: 低語者（Whisperer）· 水下的聲音（RC-02 變體）
    role: 情報型造物（EBC 0）
    lines:
      - "回程比去程貴。去程：一點希望。回程：你得在下面找到一件你想要的東西。"
  - name: 回聲同伴（Echo Companion）· 擦手的人
    role: 若 S3 替它摘囊，虛空中的殘影
    lines:
      - "它認出玩家（＋5 營火餘燼（Campfire Ember））"

choices:
  - id: C1
    question: 是否走下沉沒階（主動利用漏洞）
    options:
      - desc: 不走去程
        effect: 純逃脫完成試煉，錯過主線（拿不到法恩筆記、救不回吉爾馬）
      - desc: 走去程
        effect: 進入虛空（第三幕），主動操作規則
  - id: C2
    question: 虛空觸發物選擇
    options:
      - desc: 對吉爾馬做無回報之事
        effect: 救回（S8 他會記得玩家名字）
      - desc: 對犧牲過的回聲承認／彌補
        effect: 情感閉合
      - desc: 對隨身物想起它是什麼
        effect: 記憶閉合
  - id: C3
    question: 是否救回吉爾馬
    options:
      - desc: 救回
        effect: 他回營火（空的，每劇本恢復一點，S8 記得玩家名字）
      - desc: 不救
        effect: 情感空缺，但玩家保留更多希望點（HOP）

endings:
  - type: 分支（是否救回吉爾馬）
    condition: 取決於抉擇三
    ember_moment: 虛空中產生真實情緒時觸發（餘燼不會滾向營火）


# S5 · 回程比去程貴（結構化資料，供 AI GM 引擎讀取）
id: S5
title: 回程比去程貴
realm: 死水沼澤（Backwater Swamp, R5） → 虛空（The Void） → 隱室（Hidden Workshop）
recommended_prs: "10-13"
duration_min: 270
summary: >-
  玩法質變的第二站：玩家第一次主動利用系統漏洞——故意墜入虛空（The Void），然後爬出來。從被動求生變成主動操作規則。本劇本是全戰役最安靜、最心理向的一場：虛空無殺手、無目標、希望點（HOP）持續流失，唯一出口是「重新產生一次真實的情緒」。泥沼巫婆（HAG）陷阱可瞬移，「空間不可信」。揭露：虛空中的餘燼（Ember）到不了營火，實體（The Entity）對餘燼有本能免疫反應——為 S7/S8 的緊張感提供根據。


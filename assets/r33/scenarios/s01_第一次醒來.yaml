encounters:
  - id: E1
    type: 環境
    content: 蔽蔭林中的烏鴉群（驚起會暴露位置）
    cr: 無檢定
    note: 選用 RC-01 鏽鴉群（Rust Crows）作為警報 flavor，不列入正式預算
  - id: E2
    type: 追逐（Chase）
    content: 第一次遭遇殺手（GM 必須讓玩家逃掉）
    cr: 低
    note: 教學：心跳與恐怖半徑（TR）
  - id: E3
    type: 陷阱
    content: 捕獸夾（Bear Trap）×3（陷阱者（TRP）佈置），可用工具箱拆除
    cr: 容易
    note: 拆除＝技巧（TEC）檢定
  - id: E4
    type: 追逐（Chase）
    content: 第二次遭遇（掛鉤（Hook），教救援）
    cr: 中
    note: 教學：掛鉤（Hook）與救援
  - id: E5
    type: 領域造物（Realm Construct）
    content: 無
    cr: "-"
    note: S1 不放造物
  - id: E6
    type: 終局
    content: 逃生門（Exit Gate）或地窖（Hatch）
    cr: 中
    note: "-"

npcs:
  - name: 艾洛薇·芬奇（Eloise Finch）
    role: 營火記錄者（§8-A）
    lines:
      - "修好五台發電機（Generator），門就會開。"
      - "被鉤三次就沒了。"
      - "別去救人的話，你會活得比較久。"
      - "上一個坐你那個位置的人不見了。三個禮拜後，我在試煉裡看見一個東西，它走路的樣子跟他一模一樣。"
      - "你有沒有覺得，這火比你剛來的時候大了一點？"
  - name: 回聲同伴（Echo Companion）· 四七
    role: 單人配置節拍器（§8-B）
    lines:
      - "……九十七、九十八、九十九、一百。你看，我還在數。"
  - name: 低語者（Whisperer）· 井裡的合唱（RC-02）
    role: 情報型造物（EBC 0）
    lines:
      - "下來。下來看。我們都忘了，但你還記得。"

choices:
  - id: C1
    question: 是否救人（核心教學）
    options:
      - desc: 選擇救人
        effect: 觸發利他之望（Altruistic Hope），實體飢餓度（EH）−1，獲得 1 希望點（HOP），解鎖餘燼時刻（Ember Moment）
      - desc: 選擇不救
        effect: 角色安全，本場不觸發餘燼時刻（Ember Moment），營火餘燼（Campfire Ember）累積較少
  - id: C2
    question: 探索段可選節點（單人／雙人）
    options:
      - desc: 探索破工寮（mm_opt_shack）
        effect: 獲得指向 S3「根不吃土」的記憶卡線索（一張寫著「樹」的字條）
      - desc: 探索更衣間（mm_opt_locker）
        effect: 獲得一件常見物品，與刻在鐵櫃內側的字（指向 S2「鐵谷裡的刻痕」）

endings:
  - type: 線性序章（單一結局）
    condition: 完成試煉（修機達標或逃生）
    ember_moment: 只要玩家在試煉中救下至少一名同伴（含回聲同伴），回營火後必定觸發餘燼時刻（Ember Moment）


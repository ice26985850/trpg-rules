# S1 · 第一次醒來（結構化資料，供 AI GM 引擎讀取）
id: S1
title: 第一次醒來
realm: 麥克米蘭莊園（MacMillan Estate, R1）
recommended_prs: "1-3"
duration_min: 150
summary: >-
  序章。玩家在營火旁失去記憶地醒來，由營火記錄者艾洛薇·芬奇給出兩條規則——修好五台發電機（Generator）門就會開、被掛鉤（Hook）三次就沒了——並在第一幕看似矛盾地說「別去救人活得比較久」，卻在試煉中親自去救人。本劇本建立恐懼基準線、教會核心規則，並埋下四根貫穿全戰役的伏筆：利他之望（Altruistic Hope）與自望（Self-Hope）對實體飢餓度（EH）的相反效果、餘燼（Ember）的本質、艾洛薇口中「上一個坐你位置的人」、以及刻痕與隨身物的錨點。S1 不放任何領域造物（Realm Construct），保持純追逃體驗；第一次追逐必須讓玩家逃掉。


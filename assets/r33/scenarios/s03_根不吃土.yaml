# S3 · 根不吃土（結構化資料，供 AI GM 引擎讀取）
id: S3
title: 根不吃土
realm: 寒風農場（Coldwind Farm, R3） → 霧窖（Fog Cellar）
recommended_prs: "5-7"
duration_min: 210
summary: >-
  玩法質變的第一站：玩家從「逃生」進入「逃生＋潛入」。第二幕是標準試煉，但第三幕是在試煉進行中偏離主線、潛入霧窖（Fog Cellar）取回第一張記憶卡（Memory Card）。樹根通道三步驟的第二步要求產生一次利他之望（Altruistic Hope）作為鑰匙，使「救人」從道德選擇變成通關必要條件。鏈鋸屠夫（HBY）主場開闊地，是全戰役到目前最痛的一場；霧窖無殺手、無目標，壓力來自收縮倒數與「認出自己」的認知挑戰。


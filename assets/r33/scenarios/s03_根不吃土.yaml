npcs:
  - name: 莎莉·恩科西（Sally Nkosi）
    role: 植物學者型倖存者（§8-A）
    lines:
      - "根不吃土。它吃別的東西。"
  - name: 低語者（Whisperer）· 根下的女聲（RC-02）
    role: 情報型造物（EBC 0）
    lines:
      - "認得出來嗎？認不出來，就別摘。摘錯了，那個人會看見你。"
  - name: 回聲同伴（Echo Companion）· 擦手的人
    role: 單人配置（§8-B）
    lines:
      - "它的囊也在霧窖裡，玩家可替它摘（＋3 營火餘燼（Campfire Ember））"
  - name: 艾洛薇·芬奇（Eloise Finch）
    role: 營火記錄者（§8-A）
    lines:
      - "火會記得——推論，引導潛入"

choices:
  - id: C1
    question: 是否產生利他之望（Altruistic Hope）開鎖（核心）
    options:
      - desc: 全程獨善其身
        effect: 無法產生鑰匙，進不去霧窖，只能純逃脫，拿不到記憶卡
      - desc: 產生利他之望
        effect: 樹根鬆開，進入霧窖（取記憶卡＋觸發餘燼時刻（Ember Moment））
  - id: C2
    question: 霧窖摘囊
    options:
      - desc: 摘到自己的囊
        effect: 1 張記憶卡（用 S1 隨身物連結）
      - desc: 摘到別人的囊
        effect: 1 張他人記憶卡（＋1 希望點（HOP）上限，無法歸還；GM 應安排至少一名玩家摘錯，摘到殺手記憶＝S6 伏筆）
      - desc: 收縮倒數內未離開
        effect: 失去 3 希望點（HOP），被實體「歸檔」強制回營火

endings:
  - type: 分支（是否進入霧窖／摘對摘錯）
    condition: 取決於抉擇一、二
    ember_moment: 產生利他之望開鎖時觸發


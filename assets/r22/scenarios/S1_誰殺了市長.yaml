name: "誰殺了市長"
description: "灰燼城市長奧德里克·費恩在第三天深夜被毒殺。玩家有三天的時間找出兇手、阻止謀殺——或者讓它發生以收集更多線索。"
difficulty: "初階"
level_range:
  min_memory: 3
  max_memory: 5
  suggested_cycles: "1-3"
time_range:
  days: 3
  start: "月曜日清晨"
  end: "水曜日深夜"
core_skills:
  primary: ["洞察", "社交"]
  secondary: ["執行"]
save_point: "永恆之井（聖骸大教堂）"
fixed_events:
  - id: "speech"
    time: "第1天上午"
    name: "市長演說"
    location: "鐘塔廣場"
    description: "市長公開發表演說，暗示即將揭露的真相"
  - id: "threat_letter"
    time: "第2天清晨"
    name: "威脅信"
    location: "市長官邸"
    description: "市長收到威脅信，缺席例行早餐"
  - id: "private_meeting"
    time: "第2天傍晚"
    name: "私下會面"
    location: "市長官邸"
    description: "市長私下會見某人（對象可變）"
  - id: "last_sighting"
    time: "第3天下午"
    name: "最後目擊"
    location: "市長官邸陽台"
    description: "市長最後一次被公開目擊"
  - id: "murder"
    time: "第3天傍晚至午夜"
    name: "謀殺發生"
    location: "市長書房"
    description: "市長死於毒藥（除非被阻止）"
semi_fixed_events:
  - id: "merchant_meeting"
    time: "第1天傍晚"
    name: "商人公會會面"
    location: "市長官邸"
    description: "可被玩家介入改變會面對象"
  - id: "study_night"
    time: "第2天夜晚"
    name: "書房工作"
    location: "市長書房"
    description: "醫生在此時下毒"
locations:
  - id: "well_of_eternity"
    name: "永恆之井"
    type: "save_point"
    description: "聖骸大教堂中心，藍色光柱從深井中升起"
  - id: "bell_tower_square"
    name: "鐘塔廣場"
    type: "public"
    description: "市長發表演說的地點，每日正午敲鐘十三下"
  - id: "mayor_mansion"
    name: "市長官邸"
    type: "restricted"
    description: "兩層建築，書房在二樓"
  - id: "hearth_market"
    name: "爐火區市集"
    type: "public"
    description: "商業中心，各類店鋪和酒館"
  - id: "old_tree_pharmacy"
    name: "老樹藥房"
    type: "shop"
    description: "毒藥來源地，老闆是醫生埃德溫的表親"
routes:
  - id: "political"
    name: "政治調查路線"
    primary_attribute: "社交"
    description: "拜訪政敵和盟友，參加貴族晚宴，從對話中尋找線索"
  - id: "underworld"
    name: "地下調查路線"
    primary_attribute: "執行"
    description: "透過暗影公會獲取情報，潛入犯罪現場"
  - id: "church"
    name: "教會路線"
    primary_attribute: "洞察"
    description: "利用教會資源，調查教會本身的參與"
npcs:
  - id: "aldric_fane"
    name: "奧德里克·費恩"
    role: "受害者"
    title: "灰燼城市長"
    traits: ["清廉", "改革派", "秘密調查回歸者失蹤"]
    rv_initial: 0
  - id: "edwin_mor"
    name: "埃德溫·莫爾"
    role: "兇手"
    title: "私人醫生"
    traits: ["溫和", "被脅迫", "女兒被教會囚禁"]
    is_killer: true
    weakness: "提到女兒時情緒崩潰"
  - id: "alicia_fane"
    name: "艾莉西亞·費恩"
    role: "知情者"
    title: "市長夫人"
    traits: ["悲傷", "沉默", "知道真相但不敢說"]
  - id: "renard"
    name: "雷納德"
    role: "紅鯡魚"
    title: "秘書長"
    traits: ["緊張", "忠誠", "保護市長調查文件"]
  - id: "karen"
    name: "卡倫"
    role: "潛在盟友"
    title: "侍衛長"
    traits: ["前帝國軍官", "對市長愚忠", "強大戰力"]
  - id: "lord_morton"
    name: "莫爾頓勳爵"
    role: "紅鯡魚"
    title: "反對派領袖"
    traits: ["有動機", "非兇手", "也在調查某件事"]
clues:
  fragment_level:
    - "市長演說時醫生在發抖"
    - "麵包師傅說市長最近瘦了很多"
    - "藥劑師抱怨有人買奇怪草藥"
    - "市長秘書最近總是加班"
    - "灰衣人連續三天在官邸附近徘徊"
  clue_level:
    - "威脅信提到了市長正在調查的事"
    - "毒藥是罕見的慢性植物毒素"
    - "藥瓶來自老樹藥房"
    - "市長調查文件的隱藏位置"
  breakthrough_level:
    - "藥房老闆是醫生埃德溫的表親"
    - "醫生女兒被教會帶走後消失"
    - "市長調查文件中有回歸者失蹤名單"
  truth_level:
    - "醫生被教會脅迫——女兒被關在教會地下實驗室"
    - "教會正在系統性消耗回歸者提取時間精華"
endings:
  - id: "perfect"
    name: "完美結局"
    condition: "阻止謀殺+揭露教會真相+找到醫生女兒"
  - id: "justice"
    name: "正義結局"
    condition: "阻止謀殺+揭露真相但無確鑿證據"
  - id: "tragedy"
    name: "悲劇結局"
    condition: "阻止謀殺但醫生死亡"
  - id: "unfinished"
    name: "未完成結局"
    condition: "未能阻止謀殺但成功指認兇手"
multiplayer_gm_tips: |
  預設單人，可依 GM 規則書 14-3 以 2–3 位玩家開局：各玩家自管裂痕與記憶碎片，可用 1 次要行動共享憶碎；EB=全體記憶總和+最高執行值；關鍵調查檢定用團隊檢定（半數成功即過）。S1 戰鬥稀少，最適合分頭查線（政治／地下／教會三路並行）；僅潛入失敗的衝突需敵人縮放（每多 1 戰鬥單位，生命×1.5 或數量+1）。

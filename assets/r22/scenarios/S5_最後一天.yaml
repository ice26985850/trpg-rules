name: "最後一天"
description: "第十四天，時間開始崩潰。玩家必須在十四天內從三條路線中選擇一條阻止時間完全停滯。所有前四個劇本的累積情報和關係在此開花結果。"
difficulty: "史詩級"
level_range:
  min_memory: 8
  max_memory: 12
  suggested_cycles: "10-15"
time_range:
  days: 14
  end_event: "第十四天——時間崩潰"
core_skills:
  primary: ["洞察", "記憶", "執行", "社交", "意志"]
save_point: "永恆之井（唯一，無法跳過）"
prerequisites: "建議完成S1-S4中至少三個"
routes:
  - id: "repair_scales"
    name: "修復蛇鱗"
    goal: "修復烏洛波羅斯傷口"
    cost: "一位回歸者奉獻所有循環"
    result: "回歸現象消失，所有人變回普通人"
    requires: ["時之塔研究資料(S2)", "觀時者儀式知識(S4)"]
  - id: "break_cycle"
    name: "打破循環"
    goal: "啟動時間斷裂裝置"
    cost: "所有回歸者記憶抹除"
    result: "沒有人記得循環中的事，世界重新開始"
    requires: ["暗影公會情報(S3)", "帝國裝置"]
  - id: "coexist"
    name: "與蛇共存"
    goal: "回歸者集體同步存檔點"
    cost: "永遠無法真正離開循環"
    result: "回歸者形成跨越循環的社群"
    requires: ["教會經文(S1)", "互助會智慧"]
timeline:
  - days: "1-3"
    phase: "識別"
    events: ["輕微時間波動", "市民不安"]
  - days: "4-6"
    phase: "動員"
    events: ["教會宣布終焉循環", "時之塔緊急會議", "公會趁亂牟利"]
  - days: "7-9"
    phase: "深入"
    events: ["時間異常加劇", "深入調查路線"]
  - days: "10-12"
    phase: "轉折"
    events: ["關鍵NPC可能犧牲", "獲得關鍵物品"]
  - days: "13"
    phase: "告別"
    events: ["與重要NPC最後互動"]
  - days: "14"
    phase: "終焉"
    events: ["執行最終計劃"]
endings:
  - route: "修復蛇鱗"
    success: "寂靜結局——世界恢復正常"
    partial: "永久失去部分記憶"
    failure: "永恆停滯"
  - route: "打破循環"
    success: "空白結局——從零開始"
    partial: "被困在最後循環"
    failure: "永恆停滯"
  - route: "與蛇共存"
    success: "共鳴結局——新社群建立"
    partial: "與教會/時之塔衝突持續"
    failure: "永恆停滯（可能發現第四條路線）"
multiplayer_gm_tips: |
  預設單人，可依 14-3 以 2–3 位玩家開局：各玩家自管裂痕與記憶碎片；EB=全體記憶總和+最高執行值；戰鬥場景依 14-3 敵人縮放。S5 最適合多人：三路線由不同玩家並行、各談對應勢力，第13–14天匯流；路線三集體儀式天然為團隊檢定。多重結局由小隊共識；前置條件（完成S1–S4至少三個）對小隊整體適用。

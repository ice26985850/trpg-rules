    access: "特殊通行證"
    key_content: "實驗記錄、倫理爭議"
  - floor: 5
    name: "核心圓環會議層"
    access: "核心成員邀請"
    key_content: "學者私人研究室、內部矛盾證據"
  - floor: 6
    name: "時間編織層"
    access: "艾琳許可"
    key_content: "預言水晶、未來片段"
  - floor: 7

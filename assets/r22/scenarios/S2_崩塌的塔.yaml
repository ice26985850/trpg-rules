    primary_attribute: "執行"
  - id: "church"
    name: "教會路線"
    primary_attribute: "社交"
truth_layers:
  - level: "表層"
    content: "爆炸是實驗失控"
  - level: "中層"
    content: "有人蓄意破壞——來自核心圓環內部"
  - level: "深層"
    content: "臥底學者被教會安插，目的同時消滅時之塔研究和教會罪證"
key_npcs:
  - name: "學徒凱"
    role: "內部情報來源"
  - name: "首席學者維克托"
    role: "可疑的隱瞞者"
  - name: "時間編織者艾琳"
    role: "預言提供者"
endings:
  - id: "perfect"
    name: "完美結局"
    condition: "阻止爆炸+揭露臥底+保護艾琳"
  - id: "minimum"
    name: "最低通關"
    condition: "成功拆除爆炸裝置"
multiplayer_gm_tips: |
  預設單人，可依 14-3 以 2–3 位玩家開局：各玩家自管裂痕與記憶碎片；EB=全體記憶總和+最高執行值；權限／時間鎖用團隊檢定。塔的多層結構適合分工（按路線或樓層分頭探索），塔內戰鬥遭遇依 14-3 敵人縮放。第七層拆彈可指定主拆者、其餘掩護給優勢，或改團隊檢定。

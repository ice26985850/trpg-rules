name: "崩塌的塔"
description: "第七天正午，時之塔的中央研究塔發生時間爆炸。玩家需穿越七層塔樓，在七天內找到爆炸裝置並揭露幕後黑手。"
difficulty: "中階"
level_range:
  min_memory: 5
  max_memory: 7
  suggested_cycles: "3-6"
time_range:
  days: 7
  start: "月曜日"
  end: "日曜日正午"
core_skills:
  primary: ["洞察", "執行", "記憶"]
  secondary: ["社交"]
save_point: "永恆之井（可於塔內建立中繼存檔點）"
fixed_events:
  - id: "explosion"
    time: "第7天正午"
    name: "時間爆炸"
    location: "塔頂核心共鳴室"
    description: "塔的中央結構崩塌（時間向內坍縮）"
tower_floors:
  - floor: 1
    name: "大廳與接待"

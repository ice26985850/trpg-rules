起始裝備:
- 背景: 學者
  起始裝備: 筆記本、鋼筆、基礎研究工具、20金幣
- 背景: 士兵
  起始裝備: 一把武器（長劍或短劍）、軍用識別牌、便於行動的服裝、25金幣
- 背景: 盜賊
  起始裝備: 開鎖工具、深色斗篷、小刀、30金幣（來路不明）
- 背景: 醫生
  起始裝備: 急救包（3次）、醫療紀錄本、聽診器、25金幣
- 背景: 流浪者
  起始裝備: 背包（打火石、繩索、水壺）、破舊地圖、小刀、20金幣
- 背景: 商人
  起始裝備: 體面衣服、帳本、額外 2d6×5 金幣（10-60）
- 背景: 藝人
  起始裝備: 樂器或表演道具、引人注目的服裝、20金幣
- 背景: 偵探
  起始裝備: 調查筆記、放大鏡、證據收集工具、舊案件檔案、25金幣
貨幣與經濟: '- 基礎貨幣：**金幣（G）**

  - 1金幣 ≈ 普通工人一天工資

  - 回歸者起始資金：依背景（**20-60 金幣**，見上表）

  - 每次死亡回歸後資金重置為起始值（但**存檔綁定裝備**不遺失，見玩家規則書 3.1）

  - **輪內收入（解決經濟失效）**：完成委託或階段獎金 10-30G；擊敗敵人可搜刮 2-8G；灰巷黑市可向暗影公會變賣情報片段 5-15G。這讓「買藥 vs
  存錢買裝」的健康取捨得以發生。'

# Scenario 4: Mechanical Heart — Structured Scenario

scenario:
  name: "Scenario 4: Mechanical Heart"
  mode: [Multiplayer, Solo]

  background: |
    Dr. Blackwood—Savant Pathway Sequence 4 "Mechanical Heart," former Mistgrave University professor and a Difference Engine prodigy. Five years ago he was expelled by the Steam Church, because what he studied was not mechanical engineering—but a Third Epoch slate rubbing he discovered in the university's underground archive. The doctor spent five years using the Difference Engine to decode the slate's encrypted text. When he finally succeeded—what appeared on the screen was not a formula, but a warning written in an ancient language: **"The doomsday countdown has begun. Gather the scattered slate fragments, seek the rift in the barrier—before They enter."**
    
    Blackwood believes this slate is part of the "Blasphemy Slate" of the Third Epoch, left behind by the Ancient Sun God—the complete slate is said to record the ultimate method of resisting the Outer Deities. His decoding work awakened the ancient Spirituality lingering in the slate fragments—and that Spirituality is now going out of control.

  hooks:
    - "**Pursuit**: The Blackwood clues planted across the first three scenarios converge into a clear threat."
    - "**Omen**: All Seer Pathway players receive the same prophecy: \"When the gears mesh, the world gains one more rift.\""
    - "**Declaration of War**: Blackwood issues a public challenge to the Nighthawks / Steam Church—\"You hid the apocalypse. I will make the slate's contents public. Everyone has the right to know—the Outer Deities are at the door.\""

  acts:
    - title: "Act 1: Investigation"
      content: |
        **Clue Point 1 — Mistgrave University Old Laboratory**
        - Blackwood's laboratory, sealed five years ago. On the dust-covered Difference Engine screen, a fragment of decoded text still remains: "Fragment 1/9. Gather all nine. Before the barrier cracks—"
        - Academic challenge (Very Hard): Understand the meaning of this text → Blackwood believes he found a rubbing fragment of a Third Epoch Blasphemy Slate in the university archive. The complete slate has nine fragments—scattered across the world. He found the first.
        - Mysticism: The Blasphemy Slate was created by the Ancient Sun God before his fall—it records Pathway formulas and knowledge of resisting the Outer Deities. The Seven Churches each guard part of the slate fragments, but have never made them public.
        
        **Clue Point 2 — Gear District Anomaly Report**
        - Statistics of anomalous events over the past week:
          - 17 Difference Engines simultaneously output the same encrypted code.
          - Factory owners report "machines working on their own without commands."
          - 3 "mechanical out-of-control" incidents in the Gear District—machines suddenly attacking workers.
        - Investigation finds: all anomalies occur within 3 km of the Gear District central Difference Engine tower.
        - Spiritual clue: A powerful ancient Spirituality exists in the tower area—the residual energy released when the slate fragment was decoded is going out of control.
        
        **Clue Point 3 — Blackwood's Past**
        - Social challenge: Find Blackwood's former colleague / wife.
        - His wife: "He isn't a madman. He just saw what we cannot. He used to stay up all night, staring at that slate—then suddenly start crying. He said 'They are knocking. We must be prepared.'"
        - His former colleague (a retired deacon of the Steam Church): "He said that slate was a Third Epoch relic—the Ancient Sun God's artifact. The church leadership knew of its existence, but chose to suppress the news. Blackwood said—'If the church won't make it public, I will.'"
        
        **Clue Point 4 — The Root of the Slate Spirituality's Loss of Control**
        - Mysticism challenge (Legendary): Why does decoding the slate fragment cause Spiritual loss of control?
        - Answer: When the Ancient Sun God created the slate, he buried a "protective seal" within the fragment. Forced decoding via the Difference Engine bypassed the seal—the ancient Spirituality within the slate fragment was activated but no longer controlled. Driven by instinct, this Spirituality will "seek out other fragments"—and the other fragments are scattered across the world. When the Spirituality cannot find its target, it spreads explosively—destroying everything in range.
        - The only solution: a Beyonder holds the slate fragment and uses their own Spirituality to "tame" the fragment's out-of-control Spirituality—that is, uses their own will to perform the function the broken seal should have fulfilled.

    - title: "Act 2: Conflict"
      content: |
        **Scene 1 — Gear District Central Tower Assault**
        - Blackwood's last line of defense: the Gear Council's elite members + 6 modified "Mechanical Sentinels."
        - Environment: The Gear District central Difference Engine tower—a 50-meter steel megastructure. Inside are labyrinthine gears, steam pipes, and Difference Engine units. The battle is also a puzzle—you must find the right pipe route to reach the top floor.
        - Objective: Break through the defense and reach the top-floor laboratory.
        
        **Mechanical Sentinel** | Savant Pathway Sequence 7 | CR: 3
        - HP: 90 / Dodge: −15
        - Attacks: Steam Cannon (+20 / 3d8 Fire / 30m), Mechanical Arm (+20 / 2d8+10 / melee)
        - Powers: Self-Destruct (triggers at HP < 10 / 3d6 area Fire damage)
        - Weakness: Lightning attacks can short-circuit it for 2 rounds; oil / water can damage the precision machinery.
        
        **Scene 2 — Blackwood's Confrontation**
        - Dr. Blackwood | Savant Pathway Sequence 4 "Mechanical Heart" | CR: 9
        - Attributes: Spirit (SPI) 70, Mind (MND) 80, Body (BOD) 40, Agility (AGI) 35, Charisma (CHA) 20
        - HP: 130 / Spirit Pool (SP): 215 / Loss of Control (LoC): 65 / Loss of Control Threshold (LoCT): 170
        - Environment: Rooftop laboratory—the Difference Engine core array. Enormous gears turn slowly on the ceiling. The doctor stands at the center of the array.
        - Powers:
          - Mechanical Dominion (Passive): Controls all mechanical devices on the battlefield. Gears can become weapons; pipes can jet steam.
          - Difference Engine Calculation (1 AP / 5 Spirit): Analyzes the enemy's combat pattern; +30 attack against that target next round.
          - Rule Overwrite (2 AP / 15 Spirit): Briefly rewrites one combat rule—such as "double gravity" / "slow time" / "reverse fire damage."
          - Mechanical Construct (2 AP / 20 Spirit): Summons a mechanical construct from the Difference Engine array (CR 6).
          - Mental Broadcast (1 AP / 3 Spirit): Sends the decoded slate contents directly into the players' minds—"You have been deceived—the apocalypse is no legend. They are beyond the barrier. We must be prepared."
        - Weakness: The Difference Engine array is the source of his life—destroying 30% of its components drops his powers to Sequence 5 level. Destroying the array completely strips him of his Beyonder powers.
        
        **Tactical Turn**: When HP drops to 50%, the doctor activates the Difference Engine array's final form—channeling the slate fragment's ancient Spirituality into the Difference Engine network. Each round, the Difference Engine array releases a Spiritual pulse into the surroundings—all present take 2d6 Spiritual damage, and Loss of Control +1. The doctor does not intend the destruction—the slate fragment's Spirituality has exceeded his control.
        
        **Scene 3 — The Slate's Awakening**
        - The ancient Sun God Spirituality lingering in the slate fragment begins to manifest—a Third Epoch historical projection appears in the laboratory: the Ancient Sun God standing on the pre-fall battlefield, shattering the slate into nine pieces.
        - All players witness the Third Epoch historical projection → Loss of Control +1d10+5.
        - The doctor's body begins to be "overwritten" by the slate fragment's Spirituality—the slate fragment is turning him into a "vessel" to store and control the out-of-control Spirituality.
        - Moment of choice: A decision must be made before the doctor is completely overwritten.

    - title: "Act 3: The Ultimate Choice"
      content: |
        **Revelation**: Blackwood was never after power from the start. Five years ago he found the slate fragment's rubbing in the university archive, and spent five years decoding it. When he finally succeeded—he saw not a formula, but a warning: "The doomsday countdown has begun." He could not accept the church hiding this fact—so he decided to use his Difference Engine to make the slate's contents public. The slate's Spiritual loss of control was an accident—he never imagined it would endanger Gray Mist City.
        
        | Choice | Method | Result | Reward |
        |------|---------|------|------|
        | **Tame the Slate Fragment** | Spirituality + Will (Legendary −40): The player forcibly suppresses the fragment's out-of-control Spirituality with their own | The slate fragment is tamed—it recognizes you as the "Slate Bearer." The doctor is saved, the Spiritual loss of control stops. Gray Mist City is safe. | **First Blasphemy Slate Fragment (1/9)**—records the complete formulas of all 22 Pathways + the doomsday countdown warning. The doctor's complete research notes + Nighthawks' highest honor + Promotion Ritual qualification |
        | **Persuade the Doctor to Stop** | Social: Use his wife's keepsake + prove the slate's Spiritual loss of control will destroy the city—this is not the "truth made public" the doctor wanted | The doctor actively suppresses the slate Spirituality with his own life—he loses his Beyonder powers, but survives. The slate fragment's Spirituality is partially suppressed—you gain a stable rubbing | A stable rubbing of the slate fragment (without the out-of-control Spirituality, but with complete contents) + the doctor's complete research + the special Beyonder ability "Slate Sense" (can sense the general direction of other slate fragments) |
        | **Share the Ritual with the Doctor** | Spirituality + Ritual (Legendary −30): The player performs the taming ritual together with the doctor—sharing the Spiritual pressure | The slate fragment is tamed. The doctor retains partial powers (dropped to Sequence 5), and the player gains full use of the slate fragment. The doctor becomes the player's long-term ally—he will keep using the Difference Engine to help you decode subsequent slate fragments | **First Blasphemy Slate Fragment (1/9)**—fully tamed version, with the doctor's Difference Engine decoding tool (future decoding of other fragments: +15 to checks) |
        
        **What all endings share**: At the last moment, the doctor looks at the slate fragment in your hand and smiles. "It told me—you would come." He closes his eyes. "Now—go find the remaining eight. Where I can no longer keep up—see it through to the end."
        
        ## Loss of Control Risk Management
        
        | Risk Point | Value |
        |--------|-----|
        | Witnessing the Third Epoch historical projection | +1d10+5 (forced) |
        | Slate Spirituality pulse (per wave) | +1d3 + 2d6 Spiritual damage |
        | Difference Engine loss of control | +1d3 / scene |
        | Spirit Exhaustion | +2d5 |
        | Doctor's Rule Overwrite effect | +2 / use |
        | Total (full scenario estimate) | 30-50 |
        
        > **GM Note**: This is the precursor event to the Sequence 5 Promotion Ritual. Players should reach 100% Acting Progress by the end of this adventure—the next one is their Promotion Ritual. It is recommended to tailor each player's Promotion Ritual plot according to their Pathway.
        
        ---


# Scenario 2: Whispers Beneath the Gray Fog — Structured Scenario

scenario:
  name: "Scenario 2: Whispers Beneath the Gray Fog"
  mode: [Multiplayer, Solo]

  background: |
    In the Gear District of Gray Mist City, seven workers have vanished within a single month. The official investigation filed them as "labor mobility," yet every missing person was last seen at the same textile factory—Morrison Textile Factory. Stranger still: no one can remember the missing workers' names. Their coworkers know "someone is gone," but cannot recall who. The families' memories are fading too.

  hooks:
    - "**Commission**: The Nighthawks externally hire Beyonders to assist the investigation (official channels cannot enter the factory interior)."
    - "**Involvement**: Someone among the players' Surface Life contacts has gone missing."
    - "**Tip-off**: Drowned Man Tavern intel shows Morrison Factory is buying \"forgotten materials.\""

  acts:
    - title: "Act 1: Investigation"
      content: |
        **Clue Point 1 — Perimeter of Morrison Textile Factory**
        - Surface clue: The factory is still running, but the workers look dazed. A 24-hour shift system—highly irregular.
        - Spiritual clue: Spirit Sight → a faint but persistent Spiritual fluctuation above the factory, pulsing like a heartbeat.
        - Risk: Staying near the factory perimeter for over 10 minutes triggers +1 Loss of Control (low-frequency Spiritual contamination).
        
        **Clue Point 2 — The Missing Workers' Families (Sunken Smoke District)**
        - Social challenge: The family cannot say the missing person's name, only describing "my son / my husband."
        - Mind challenge: d100 ≤ Mind → realize they have not forgotten the name—the name was "stolen."
        - Clue: All the missing workers live within a 15-minute walk of the factory.
        
        **Clue Point 3 — Gear District Bar**
        - Info: Morrison Factory replaced its foreman three months ago. The old foreman "retired," yet no one saw him leave.
        - Anomaly: The factory recently imported large quantities of paraffin and ashes—not textile materials.
        - Risk: Prying too deeply may draw secret attention.
        
        **Clue Point 4 — Mistgrave University, Mysticism Department**
        - Academic challenge: Paraffin + ashes are common materials for the Secrets Suppliant Pathway Sequence 7 "Shadow Ascetic" ritual.
        - Deeper info: A Shadow Ascetic can offer "memory" as a sacrifice to a Concealed Existence in exchange for power. The memory does not vanish—it is stored within an object.

    - title: "Act 2: Conflict"
      content: |
        **Scene 1 — Infiltrating Morrison Factory**
        - Environment: A large textile factory at the heart of the Gear District, threaded with steam pipes. Round-the-clock production means there are always people.
        - Entry options: Main gate (disguise as a worker), side door (lockpick), skylight (climb), steam pipes (requires Body to endure the heat).
        - Internal discovery: A ritual space in the factory basement. Seven wax figures—each molded from a missing worker's face.
        - Key discovery: The wax figures seal the missing workers' memories. Touching a figure lets you read part of the memory—but +1d3 Loss of Control.
        
        **Scene 2 — The Ritual Underway**
        - Antagonist: **Foreman Morrison**—Secrets Suppliant Pathway Sequence 7 "Shadow Ascetic," presiding over a sacrificial ritual.
        - Environment: Burst steam pipes fill the air with vapor, limiting visibility. Mechanical noise imposes Disadvantage on hearing checks.
        - Ritual purpose: Offer the seven missing workers' memories to the Concealed Existence in exchange for qualification to advance to Sequence 6.
        
        **Enemy Data**:
        - Foreman Morrison | Secrets Suppliant Pathway Sequence 7 | CR: 4
        - Attributes: Spirit (SPI) 60, Mind (MND) 45, Body (BOD) 40, Agility (AGI) 30, Charisma (CHA) 30
        - HP: 130 / Spirit Pool (SP): 185 / Loss of Control (LoC): 35 / Loss of Control Threshold (LoCT): 100
        - Attacks: Shadow Touch (+15 / 3d6 Dark / melee), Sacrificial Blade (+15 / 2d8 Dark + Curse / 10m)
        - Powers: Shadow Stealth (1 AP / 5 Spirit / fully concealed), Concealed Ritual (full round / sustained), Summon Shadow Servant (2 AP / 10 Spirit / summons Sequence 9 Secrets Suppliant ×2)
        - Weakness: Interrupting the ritual causes backlash (+10 Loss of Control); Shadow Stealth fails in bright light.
        - Tactics: Uses steam to obscure his form, with shadow servants blocking blows. Below 50% HP he tries to sacrifice himself for power (Loss of Control spikes → Edge of Loss).
        
        **Scene 3 — Moral Dilemma**
        - The wax figures can be destroyed—but this permanently erases the missing workers' memories; they become "people who never existed."
        - The ritual can be interrupted—but the backfire energy goes out of control, possibly harming the workers still laboring inside.
        - The foreman can be killed—but he displays a twisted creed: "They were only parts in the factory; I turned them into art."

    - title: "Act 3: Truth and Choice"
      content: |
        **Revelation**: Foreman Morrison was once a worker himself. His wife died in a factory accident—officially ruled "operator error." He consumed the Secrets Suppliant Potion to gain enough power to take revenge on the factory owner. But in the course of revenge, he heard the whispers of a Concealed Existence—the whispers told him that by offering "the forgotten" as sacrifices, the Concealed Existence would bring his wife back.
        
        | Choice | Result | Reward |
        |------|------|------|
        | Combat Elimination | Direct fight. Caution: must avoid a steam explosion causing mass casualties | Sealed Artifact "Memory Wax Mold" (Tier 3) + Nighthawks reward + 200 Progress |
        | Interrupt Ritual + Hand to Authorities | Interrupt the fight then negotiate. Foreman's Loss of Control spikes → loss-of-control state, difficulty rises | Nighthawks' high trust + official Beyonder status + 250 Progress |
        | Attempt Redemption | Highest difficulty. Requires learning his story + evoking his memory of his wife (rather than revenge) | "Hanged Man" mark + the Concealed Existence's "attention" + 350 Progress |
        
        **Loss of Control Risk**: Touching a wax figure +1d3 / Witnessing the ritual +2 / Steam leak (every 5 rounds +1) / Foreman's loss-of-control form +1d5 / Spirit Exhaustion +2d5 / Hearing the whispers +1d3 per scene
        
        ---


scavenge_dc:
  common: 8
  scarce: 12
  uncommon: 15
  rare: 18

# ===== Shelf Life (Soft Cap) =====
shelf_life_note: Almond Water has no explicit expiration, but long-term storage (over one month of in-game time) has a low chance (about 5% per week) of becoming contaminated — drinking contaminated Almond Water requires a Physique DC12 check, otherwise an extra -1D4 SP. This is a soft throttle to prevent early hoarding from causing a surplus later; the GM may adjust or disable it based on campaign length.


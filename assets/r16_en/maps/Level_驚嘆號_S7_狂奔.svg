<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" font-family="'Microsoft JhengHei','PingFang TC',sans-serif">
  <defs>
    <marker id="arrowRun" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#4CAF50"/></marker>
  </defs>

  <rect width="800" height="200" fill="#1A1A1A" rx="8"/>

  <text x="400" y="22" text-anchor="middle" font-size="16" font-weight="bold" fill="#FF1744">Level ! — Run If You Don't Want to Die！（corresponding scenario S7：Sprint）</text>

  <!-- Corridor - 10km hospital hallway -->
  <rect x="20" y="40" width="760" height="100" rx="5" fill="#263238" stroke="#37474F" stroke-width="1"/>

  <!-- Distance markers -->
  <line x1="50" y1="40" x2="50" y2="140" stroke="#FF1744" stroke-width="1" stroke-dasharray="2,4"/>
  <text x="42" y="155" font-size="8" fill="#FF1744">0km</text>

  <line x1="130" y1="40" x2="130" y2="140" stroke="#FF9800" stroke-width="1" stroke-dasharray="2,4"/>
  <text x="120" y="155" font-size="8" fill="#FF9800">1km</text>

  <line x1="210" y1="40" x2="210" y2="140" stroke="#FF9800" stroke-width="1" stroke-dasharray="2,4"/>
  <text x="200" y="155" font-size="8" fill="#FF9800">2km</text>

  <line x1="290" y1="40" x2="290" y2="140" stroke="#FF9800" stroke-width="1" stroke-dasharray="2,4"/>
  <text x="280" y="155" font-size="8" fill="#FF9800">3km</text>

  <line x1="370" y1="40" x2="370" y2="140" stroke="#FF9800" stroke-width="1" stroke-dasharray="2,4"/>
  <text x="360" y="155" font-size="8" fill="#FF9800">4km</text>

  <line x1="450" y1="40" x2="450" y2="140" stroke="#FFEB3B" stroke-width="1.5" stroke-dasharray="2,4"/>
  <text x="440" y="155" font-size="8" fill="#FFEB3B">5km（halfway）</text>

  <line x1="530" y1="40" x2="530" y2="140" stroke="#FF9800" stroke-width="1" stroke-dasharray="2,4"/>
  <text x="520" y="155" font-size="8" fill="#FF9800">6km</text>

  <line x1="610" y1="40" x2="610" y2="140" stroke="#FF9800" stroke-width="1" stroke-dasharray="2,4"/>
  <text x="600" y="155" font-size="8" fill="#FF9800">7km</text>

  <line x1="690" y1="40" x2="690" y2="140" stroke="#FF1744" stroke-width="2" stroke-dasharray="3,5"/>
  <text x="678" y="155" font-size="8" fill="#FF1744">8-9km⚠</text>

  <line x1="760" y1="40" x2="760" y2="140" stroke="#4CAF50" stroke-width="2"/>
  <text x="750" y="155" font-size="8" fill="#4CAF50" font-weight="bold">10km!</text>

  <!-- Red alarm lights -->
  <circle cx="80" cy="58" r="6" fill="#FF1744" opacity="0.8"/>
  <circle cx="160" cy="58" r="6" fill="#FF1744" opacity="0.8"/>
  <circle cx="240" cy="58" r="6" fill="#FF1744" opacity="0.8"/>
  <circle cx="320" cy="58" r="6" fill="#FF1744" opacity="0.8"/>
  <circle cx="400" cy="58" r="6" fill="#FF1744" opacity="0.8"/>
  <circle cx="480" cy="58" r="6" fill="#FF1744" opacity="0.8"/>
  <circle cx="560" cy="58" r="6" fill="#FF1744" opacity="0.8"/>
  <circle cx="640" cy="58" r="6" fill="#FF1744" opacity="0.8"/>
  <circle cx="720" cy="58" r="6" fill="#FF1744" opacity="0.8"/>

  <!-- Obstacles -->
  <rect x="170" y="100" width="15" height="30" rx="3" fill="#546E7A" opacity="0.7"/><text x="170" y="95" font-size="7" fill="#78909C">Hospital Bed</text>
  <rect x="340" y="105" width="25" height="20" rx="3" fill="#546E7A" opacity="0.7"/><text x="340" y="100" font-size="7" fill="#78909C">Collapse</text>
  <rect x="570" y="98" width="12" height="35" rx="3" fill="#546E7A" opacity="0.7"/><text x="565" y="93" font-size="7" fill="#78909C">Wheelchair</text>
  <rect x="660" y="102" width="20" height="25" rx="3" fill="#546E7A" opacity="0.7"/><text x="655" y="97" font-size="7" fill="#78909C">Rubble</text>

  <!-- Supply points -->
  <rect x="125" y="65" width="12" height="12" rx="2" fill="#FFEB3B"/><text x="118" y="70" font-size="7" fill="#FFEB3B">Supply</text>
  <rect x="285" y="68" width="12" height="12" rx="2" fill="#FFEB3B"/><text x="278" y="73" font-size="7" fill="#FFEB3B">Supply</text>
  <rect x="445" y="65" width="12" height="12" rx="2" fill="#FFEB3B"/><text x="438" y="70" font-size="7" fill="#FFEB3B">Supply</text>
  <rect x="525" y="68" width="12" height="12" rx="2" fill="#FFEB3B"/><text x="518" y="73" font-size="7" fill="#FFEB3B">Supply</text>
  <rect x="605" y="65" width="12" height="12" rx="2" fill="#FFEB3B"/><text x="598" y="70" font-size="7" fill="#FFEB3B">Supply</text>
  <rect x="685" y="68" width="12" height="12" rx="2" fill="#FFEB3B"/><text x="678" y="73" font-size="7" fill="#FFEB3B">Supply</text>

  <!-- Entities chasing from left -->
  <text x="35" y="115" font-size="11" fill="#FF1744">👹👹👹</text>
  <text x="30" y="130" font-size="9" fill="#FF8A80">Horde of Entities</text>

  <!-- Runner at mid-point -->
  <text x="430" y="125" font-size="16">🏃</text>

  <!-- EXIT door -->
  <rect x="760" y="80" width="30" height="55" rx="3" fill="#4CAF50"/>
  <text x="775" y="112" text-anchor="middle" font-size="8" fill="white" font-weight="bold">E X I T</text>

  <!-- Bottom info -->
  <text x="400" y="175" text-anchor="middle" font-size="9" fill="#B0BEC5">🏥 Hospital-style corridor | 🚨 Red alert throughout | 🏃 10km extreme run | ⚡ Physique check per km</text>
  <text x="400" y="193" text-anchor="middle" font-size="9" fill="#FF8A80">Only rule: Run. Don't stop. Don't look back. Reaching the finish = path to the ending. Caught = death.</text>
</svg>

- section: 魔法裝備 (Magical Equipment)
  entries:
  - ID: staff
    名稱: 法杖
    類型: 武器
    槽位: 主手
    增益: 法術攻擊 +1
    罕級: 普通
    價格: 100金幣（GP）
    說明: 增強施法專注。與專長補疊加。
  - ID: robe
    名稱: 法袍
    類型: 護甲
    槽位: 身穿
    增益: 護甲等級（AC） +1 或 意志豁免 +1
    罕級: 普通
    價格: 80金幣（GP）
    說明: 織有穩定符文。
  - ID: wand
    名稱: 魔杖
    類型: 法器
    槽位: 副手
    增益: 靈性池 +5 上限
    罕級: 稀有
    價格: 300gp
    說明: 儲存實驗殘餘魔力。
  - ID: crystal_lens
    名稱: 水晶透鏡
    類型: 法器
    槽位: 眼睛
    增益: 感知 +1，圖書館研究 難度等級（DC） -1
    罕級: 普通稀有
    價格: 200金幣（GP）
    說明: 揭示碎片中的隱藏魔力特徵。
  - ID: ring
    名稱: 貴族印章戒指
    類型: 飾品
    槽位: 手指
    增益: 學術會議社交檢定優勢
    罕級: 普通稀有
    價格: 150gp
    說明: 源自貴族家族遺傳。
  - ID: amulet
    名稱: 龍鱗護符
    類型: 飾品
    槽位: 頸部
    增益: 護甲等級（AC） +1（與法袍疊加）
    罕級: 稀有
    價格: 贈品
    說明: 來自 S04 試驗成功。龍的祝福。
  - ID: ward
    名稱: 龍語者印記
    類型: 飾品
    槽位: 身體
    增益: 火焰碎片法術攻擊 +1
    罕級: 稀有
    價格: 贈品
    說明: 來自 S04 知識試驗。
  - ID: sigil
    名稱: 伊格納瑞斯印記
    類型: 飾品
    槽位: 身體
    增益: 所有火焰法術攻擊 +2（永久）
    罕級: 傳說
    價格: 贈品
    說明: 來自 S04 完美穩定。古代巨龍的祝福。
- section: 消耗品 (Consumables)
  entries:
  - ID: healing_potion
    名稱: 治療藥水
    效果: 以附帶動作恢復 2d8+2 生命值（HP）
    罕級: 普通
    價格: 30金幣（GP）
    說明: 以生命碎片 + 儀式媒介調製。
  - ID: spirit_water
    名稱: 靈性藥水
    效果: 恢復 1d6+2 靈性池
    罕級: 普通
    價格: 25金幣（GP）
    說明: 暫時提升靈性能量。
  - ID: smoke_bomb
    名稱: 煙霧彈
    效果: 20尺 半徑重度遮蔽 1 回合
    罕級: 普通
    價格: 15gp
    說明: 快速脫逃工具。盟友可用動作丟擲。
  - ID: flash_powder
    名稱: 閃光粉
    效果: 15尺 半徑所有目標致盲 1 回合
    罕級: 普通
    價格: 15gp
    說明: 光碎片 + 即時形式。
  - ID: fire_elixir
    名稱: 火焰藥水
    效果: 下一個法術獲得火焰交叉bonus：傷害骰 +1，對抗 金屬鎧甲額外 +1d6
    罕級: 普通稀有
    價格: 40gp
    說明: 濃縮火焰精華。
  - ID: cold_elixir
    名稱: 寒霜藥水
    效果: 下一個法術獲得冰霜元素：速度 -10尺，豁免失敗速度減半
    罕級: 普通稀有
    價格: 40gp
    說明: 濃縮寒霜精華。
  - ID: lightning_tonic
    名稱: 雷電藥劑
    效果: 下一個法術可連接到 10尺 內額外一個目標（半額傷害）
    罕級: 普通稀有
    價格: 40gp
    說明: 雷電精華濃縮液。
  - ID: void_serum
    名稱: 虛空血清
    效果: 下一個法術：目標治療效果減半 1 回合，施法者恢復受傷量 50% 作為 生命值（HP）
    罕級: 稀有
    價格: 100金幣（GP）
    說明: 危險但強大。可能觸發副作用 d10。
- section: 鍊金材料 (Alchemy Items)
  entries:
  - ID: refined_trial_base
    名稱: 精煉試劑基底
    效果: 每次使用減少實驗材料成本 3
    價格: 20gp
    說明: 低階實驗基本試劑。
  - ID: element_specific_trial
    名稱: 元素特化試劑
    效果: 稀有碎片實驗必需。成本減少 10金幣（GP）
    價格: 30金幣（GP）
    說明: 需匹配目標元素類型。
  - ID: rare_material
    名稱: 稀有材料
    效果: 稀有碎片實驗必需
    價格: 100金幣（GP）
    說明: 來源依元素類型而異。
  - ID: unique_material
    名稱: 獨特材料
    效果: 傳說碎片實驗必需
    價格: 無法購買
    說明: 僅能透過冒險與任務完成獲得。
- section: 玩家起始裝備 (Starter Equipment)
  entries:
  - ID: starter_eq_1
    名稱: 學徒法杖
    價格: 50金幣（GP）
    效果: 法術攻擊 +1（需手持）
  - ID: starter_eq_2
    名稱: 聚焦水晶
    價格: 80金幣（GP）
    效果: 法術豁免 難度等級（DC） +1（需手持）
  - ID: starter_eq_3
    名稱: 旅法師長袍
    價格: 120金幣（GP）
    效果: 護甲等級（AC） +1，意志豁免 +1
  - ID: starter_eq_4
    名稱: 龍皮手套
    價格: 200金幣（GP）
    效果: 技藝（精密操作）檢定 +1
  - ID: starter_eq_5
    名稱: 共鳴護符
    價格: 150金幣（GP）
    效果: 每日一次，靈性消耗 –2（最低 1）
  - ID: starter_eq_6
    名稱: 觀星者之鏡
    價格: 100金幣（GP）
    效果: 感知（觀察）+1，僅限塔樓／野外夜間
  - ID: starter_eq_7
    名稱: 祕銀法環
    價格: 500金幣（GP）
    效果: 法術攻擊 +2（與法杖不疊加）
  - ID: starter_eq_8
    名稱: 賢者之袍
    價格: 800金幣（GP）
    效果: 護甲等級（AC） +2，所有理論檢定 +1
  - ID: starter_con_1
    名稱: 治療藥水（小）
    價格: 25金幣（GP）
    效果: 恢復 2d4+2 生命值（HP）（附帶動作飲用）
  - ID: starter_con_2
    名稱: 治療藥水（大）
    價格: 80金幣（GP）
    效果: 恢復 4d4+4 生命值（HP）
  - ID: starter_con_3
    名稱: 靈性藥水
    價格: 40金幣（GP）
    效果: 恢復 2d4 靈性
  - ID: starter_con_4
    名稱: 強效靈性藥水
    價格: 120金幣（GP）
    效果: 恢復 4d4 靈性
  - ID: starter_con_5
    名稱: 專注藥水
    價格: 60金幣（GP）
    效果: 接下來 1 分鐘內專注豁免優勢
  - ID: starter_con_6
    名稱: 抗元素藥水
    價格: 50金幣（GP）
    效果: 選擇一種元素，對其傷害獲得抗性 10 分鐘
  - ID: starter_con_7
    名稱: 隱身藥水
    價格: 100金幣（GP）
    效果: 隱身 1 分鐘（施法或攻擊後解除）
  - ID: starter_con_8
    名稱: 空白卷軸
    價格: 10金幣（GP）
    效果: 可預先儲存一個法術（施放時支付靈性，無需準備）
  - ID: starter_alc_1
    名稱: 魔法油脂
    價格: 10金幣（GP）
    效果: 10尺見方變為困難地形 + 反射閃光
  - ID: starter_alc_2
    名稱: 顯形粉
    價格: 25金幣（GP）
    效果: 使 20尺內隱形生物現形（感知 難度等級（DC）15 對抗）

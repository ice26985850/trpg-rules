- section: 派系緊張關係 (Faction Tensions)
  entries:
  - 派系 A: 守夜人議會
    派系 B: 禁忌網絡
    關係: 敵對
    描述: 守夜人追捕禁忌研究者。邪教視守夜人為知識壓迫者。
    對玩家的影響: 玩家必須選邊站或成為雙面間諜。
  - 派系 A: 皇家學院
    派系 B: 純火組織
    關係: 中立
    描述: 學院容忍純火的存在但不與其合作。
    對玩家的影響: 學生須決定：尋求學院認可還是在體制外活動。
  - 派系 A: 材料貿易聯盟
    派系 B: 所有其他派系
    關係: 商業中立
    描述: 向所有人供應材料。黃金會說話。
    對玩家的影響: 無論派系立場如何，都能出售碎片獲利。

- section: 元素碎片 (Elements)
  subsection: 基礎元素
  entries:
  - ID: fire
    名稱: 火焰
    基礎傷害: 1d6 fire
    固有效果: 命中目標 難度等級（DC）10 敏捷豁免，否則着火（每回合 1d4，可用動作熄滅）
    罕見升級: 傷害骰 → d8；火焰傷害改為 1d6
    傳說升級: 忽略火焰抗性的免疫（視為抗性）；暴擊範圍 19-20
    研究難度等級（DC） (普通): '10'
    研究難度等級（DC） (傳說): '22'
  - ID: water
    名稱: 水流
    基礎傷害: 1d4 bludgeoning
    固有效果: 目標變濕（對抗 雷電豁免劣勢，持續 1 回合）
    罕見升級: 可熄滅 20尺 內非魔法火焰
    傳說升級: 創造半徑 10尺 洪水區 1 分鐘 — 移動速度減半
    研究難度等級（DC） (普通): '10'
    研究難度等級（DC） (傳說): '22'
  - ID: storm
    名稱: 風暴
    基礎傷害: 1d6 slashing
    固有效果: 將目標推開 10尺（大型或更小生物）
    罕見升級: 推進距離加倍至 20尺；影響巨型生物
    傳說升級: 創造半徑 20尺 旋風區 1 分鐘 — 困難地形 + 每回合 1d6 slashing
    研究難度等級（DC） (普通): '10'
    研究難度等級（DC） (傳說): '22'
  - ID: earth
    名稱: 大地
    基礎傷害: 1d6 bludgeoning
    固有效果: 目標 5尺 區域變成困難地形
    罕見升級: 目標力量豁免否則倒地
    傳說升級: 創造石牆（護甲等級（AC）15, 生命值（HP）30），持續 1 分鐘
    研究難度等級（DC） (普通): '10'
    研究難度等級（DC） (傳說): '22'
  - ID: wind
    名稱: 風
    基礎傷害: 1d6 slashing
    固有效果: 對目標施加風效果
    罕見升級: —
    傳說升級: —
    研究難度等級（DC） (普通): '10'
    研究難度等級（DC） (傳說): '22'
  - ID: ice
    名稱: 冰霜
    基礎傷害: 1d6 cold
    固有效果: 目標速度 -10尺，直到其下一回合開始
    罕見升級: 速度減半；目標無法使用動作回應
    傳說升級: 可凍結 10尺 立方體水面；暴擊時凍結目標 1 回合
    研究難度等級（DC） (普通): '12'
    研究難度等級（DC） (傳說): '24'
- section: 元素碎片 (Elements)
  subsection: 進階元素
  entries:
  - ID: lightning
    名稱: 雷電
    基礎傷害: 1d8 lightning
    固有效果: 目標無法使用動作回應，直到施法者下一回合開始
    罕見升級: 可連接到 10尺 內第二個目標（半額傷害）
    傳說升級: 暴擊範圍 19-20；可連接到第三個目標
    研究難度等級（DC） (普通): '12'
    研究難度等級（DC） (傳說): '24'
  - ID: radiance
    名稱: 光耀
    基礎傷害: 1d6 radiant
    固有效果: 目標感知豁免否則致盲，直到下一回合
    罕見升級: 對不死族/惡魔額外 +1d6
    傳說升級: 30尺 亮光 + 30尺 暗光 1 分鐘（視為白日術）
    研究難度等級（DC） (普通): '12'
    研究難度等級（DC） (傳說): '24'
  - ID: shadow
    名稱: 暗影
    基礎傷害: 1d6 necrotic
    固有效果: 目標感知豁免否則恐慌，直到下一回合
    罕見升級: 50% 傷害轉化為施法者臨時 生命值（HP）
    傳說升級: 在目標位置創造半徑 15尺 魔法黑暗 1 分鐘
    研究難度等級（DC） (普通): '12'
    研究難度等級（DC） (傳說): '24'
  - ID: force
    名稱: 力場
    基礎傷害: 1d4+2 force
    固有效果: 忽略一般物理掩體加成；可影響靈界幽靈
    罕見升級: 對抗 反魔法檢定 +2
    傳說升級: 命中後盟友對該目標 +2（持續 1 回合）
    研究難度等級（DC） (普通): '12'
    研究難度等級（DC） (傳說): '24'
  - ID: mental
    名稱: 精神
    基礎傷害: 1d6 psychic
    固有效果: 目標下一次首次攻擊roll 具有劣勢
    罕見升級: 改為感知豁免（成功半額傷害）— 完全忽略 護甲等級（AC）
    傳說升級: 可讀取目標表面想法；失敗豁免無法集中
    研究難度等級（DC） (普通): '12'
    研究難度等級（DC） (傳說): '24'
- section: 元素碎片 (Elements)
  subsection: 高級與禁忌元素
  entries:
  - ID: acid
    名稱: 強酸
    基礎傷害: 1d6 acid
    固有效果: 目標 護甲等級（AC） -1，直到其下一回合結束
    罕見升級: 下一回合結束額外 +1d4 acid
    傳說升級: 持續 2d4×2 回合；可腐蝕非魔法金屬
    研究難度等級（DC） (普通): '15'
    研究難度等級（DC） (傳說): '28'
  - ID: sonic
    名稱: 音波
    基礎傷害: 1d6 thunder
    固有效果: 目標耐力豁免否則 deafened 1 分鐘
    罕見升級: 傷害骰 → d10；聽覺豁免劣勢
    傳說升級: 可摧毀 20尺 內非魔法玻璃/水晶/陶瓷
    研究難度等級（DC） (普通): '15'
    研究難度等級（DC） (傳說): '28'
  - ID: poison
    名稱: 毒素
    基礎傷害: 1d4 poison
    固有效果: 目標耐力豁免否則中毒 1 分鐘（每回合重新豁免）
    罕見升級: 初始傷害 → d8；中毒豁免劣勢
    傳說升級: 部分影響通常免疫毒素的生物（免疫→抗性）
    研究難度等級（DC） (普通): '15'
    研究難度等級（DC） (傳說): '28'
  - ID: void
    名稱: 虛空
    基礎傷害: 1d8 void
    固有效果: 目標治療效果減半，直到下一回合
    罕見升級: 施法者恢復受傷量的 50% 作為 生命值（HP）
    傳說升級: 目標魅力豁免被放逐到邊域位面 1 回合
    研究難度等級（DC） (普通): '18'
    研究難度等級（DC） (傳說): '30'
  - ID: life
    名稱: 生命
    基礎傷害: 無（不造成傷害）
    固有效果: 恢復 1d8 + 理論值 生命值（HP）
    罕見升級: 同時清除一個中毒/眩暈/疾病狀態
    傳說升級: 若目標 1 分鐘內死亡，復活至 1 HP（長休一次）
    研究難度等級（DC） (普通): '15'
    研究難度等級（DC） (傳說): '28'
- section: 形式碎片 (Forms)
  entries:
  - ID: projectile
    名稱: 投射
    射程: 60尺
    目標: 單一
    攻擊類型: 法術攻擊
    特殊效果: 標準遠程，適用掩體規則
  - ID: touch
    名稱: 觸碰
    射程: 觸碰
    目標: 單一
    攻擊類型: 法術攻擊（優勢）
    特殊效果: 自願目標自動命中
  - ID: area
    名稱: 範圍
    射程: 60尺
    目標: 半徑 15尺 球體
    攻擊類型: 敏捷豁免
    特殊效果: 選擇爆發點；成功減半傷害
  - ID: cone
    名稱: 錐形
    射程: 自身
    目標: 30尺 錐形
    攻擊類型: 敏捷豁免
    特殊效果: 從施法者延伸；成功減半傷害
  - ID: attach
    名稱: 附著
    射程: 觸碰
    目標: 一件武器/物品
    攻擊類型: 見下方
    特殊效果: 持續 1 分鐘；下次命中時觸發（效果 ×0.8）
  - ID: delay
    名稱: 延遲
    射程: 60尺
    目標: 指定區域
    攻擊類型: 無
    特殊效果: 1-3 回合後觸發；觸發時敏捷豁免
  - ID: sustained
    名稱: 持續
    射程: 60尺
    目標: 單一目標/區域
    攻擊類型: 耐力豁免
    特殊效果: 需要集中；持續時間 = 3+理論值 回合
  - ID: instant
    名稱: 即時
    射程: 自身
    目標: 自身/觸碰
    攻擊類型: 無需檢定
    特殊效果: 即時效果，不能被動作回應打斷；效果 ×0.7
- section: 形式組合 (Form Combinations)
  entries:
  - 組合碎片: projectile + area
    結果效果: 射程 120尺，半徑 20尺，敏捷豁免
  - 組合碎片: projectile + touch
    結果效果: 射程 30尺，法術攻擊，優勢
  - 組合碎片: projectile + sustained
    結果效果: 射程 120尺，持續效果
  - 組合碎片: projectile + instant
    結果效果: 射程 120尺，不能被動作回應打斷
  - 組合碎片: area + delay
    結果效果: 120尺 延遲爆炸 — 1-3 回合後半徑 20尺，傷害 ×1.3
  - 組合碎片: sustained + area
    結果效果: 持續區域效果 — 每回合在區域內觸發
  - 組合碎片: attach + projectile
    結果效果: 附魔彈藥，射程 = 武器的射程
- section: 媒介碎片 (Media)
  entries:
  - ID: sight
    名稱: 視線
    要求: 必須清楚看見目標
    增益效果: 法術攻擊 +2 或 豁免 難度等級（DC） +1
  - ID: secret_touch
    名稱: 祕觸
    要求: 特殊媒介（水晶/符文石，價值 10金幣（GP） 以上）
    增益效果: 傷害骰 +1
  - ID: word
    名稱: 真言
    要求: 必須大聲說出（20尺 內可聽見）
    增益效果: 射程 ×1.5 或 半徑 +5尺
  - ID: material
    名稱: 材料
    要求: 消耗特定材料（25金幣（GP） → 傷害 ×1.5；100金幣（GP） → ×2.0）
    增益效果: 傷害倍數提升
  - ID: blood_sacrifice
    名稱: 血祭
    要求: 施法者支付生命值（HP）（每 5 生命值（HP） 計一層）
    增益效果: 每 5 生命值（HP），所有傷害骰取最大值
  - ID: ritual
    名稱: 儀式
    要求: 施法時間延長至 1 分鐘
    增益效果: 靈性消耗減半（最低 1）
  - ID: resonance
    名稱: 共鳴
    要求: 30尺 內另一名自願施法者協同
    增益效果: 所有數值效果 ×1.5
- section: 限制碎片 (Constraints)
  entries:
  - ID: cooldown
    名稱: 冷卻
    代價: 使用後 X 回合內無法再次施法（X=1/2/3）
    增益效果: 靈性消耗 -(X+1)，最低 1
  - ID: usage_limit
    名稱: 次數限制
    代價: 長休內只能使用 N 次（N=1/2/3）
    增益效果: 每傷害骰 +N
  - ID: conditional
    名稱: 條件觸發
    代價: 僅在特定條件下可使用（夜晚/水下/對特定生物等）
    增益效果: 所有效果 ×1.5
  - ID: concentration
    名稱: 專注代價
    代價: 維持此法術需要集中注意力
    增益效果: 持續時間 ×2 或 傷害骰 +2
  - ID: overload
    名稱: 增效超載
    代價: 施法時額外支付 X 靈性
    增益效果: 每支付 1 靈性，增加 1 傷害骰
  - ID: safety_lock
    名稱: 安全鎖
    代價: 法術無法傷害友方（自動排除）
    增益效果: 半徑 +5尺
  - ID: self_harm
    名稱: 自我反噬
    代價: 施法者承受 1d6 不可避免傷害
    增益效果: 所有傷害骰 → d10（原低於 d10 者）
- section: 元素雙重交叉 (Element Crosses — Double)
  entries:
  - 元素組合: fire + wind
    合成效果: 風暴 — 半徑 ×1.5
  - 元素組合: fire + earth
    合成效果: 熔岩 — 傷害區域變成熾熱地面，1d4 回合（每回合 1d6 fire）
  - 元素組合: fire + water
    合成效果: 蒸汽爆 — 區域變成重度遮蔽，1d4+1 回合
  - 元素組合: fire + ice
    合成效果: 熱震 — 傷害骰 +1；目標耐力豁免否則暈眩 1 回合
  - 元素組合: fire + lightning
    合成效果: 電漿 — 傷害骰 → d10；對金屬鎧甲目標額外 +1d6
  - 元素組合: ice + wind
    合成效果: 暴風雪 — 目標速度 -20尺；區域重度遮蔽 1d4 回合
  - 元素組合: ice + water
    合成效果: 凍結 — 目標力量豁免否則受限 1 回合
  - 元素組合: ice + earth
    合成效果: 冰岩 — 傷害骰 +1 且改為 d10；區域困難地形 1 分鐘
  - 元素組合: lightning + water
    合成效果: 導電 — 區域內所有目標額外 1d4 lightning；濕潤目標豁免劣勢
  - 元素組合: radiance + fire
    合成效果: 聖焰 — 對邪惡生物額外 +2 傷害骰；30尺 亮光 1 分鐘
  - 元素組合: shadow + mental
    合成效果: 噩夢 — 恐慌 + 每回合 1d4 psychic，持續 1d4 回合
  - 元素組合: void + shadow
    合成效果: 湮滅 — 傷害骰 → d12；以此法術殺死的生物無法被常規方式復活
  - 元素組合: life + radiance
    合成效果: 聖愈 — 治療骰取最大值；清除一個詛咒或疾病
- section: 元素三重交叉 (Element Crosses — Triple)
  entries:
  - 元素組合: fire + wind + earth
    合成效果: 火山爆發 — 額外 +2 傷害骰，半徑 ×2，區域困難地形 + 每回合 2d6 fire
  - 元素組合: ice + water + wind
    合成效果: 極地暴風 — 半徑 40尺，重度遮蔽，每回合 1d8 cold + 速度減半
  - 元素組合: lightning + storm + water
    合成效果: 完美風暴 — 所有傷害骰 → d12，豁免劣勢，可影響飛行生物
  - 元素組合: radiance + life + fire
    合成效果: 鳳凰涅槃 — 對抗 不死族/邪惡生物傷害 ×1.5 + 盟友恢復等量生命值（HP）；施法者死亡時復活一次

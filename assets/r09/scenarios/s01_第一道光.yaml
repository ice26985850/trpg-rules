title: 第一道光
type: multiplayer
quality: ★ 學徒級
players: 1–3 名起始法師
sessions: 1–2 次
core_output: 1 個光元素碎片 + 可能的罕見碎片
main_threat: 競爭法師、輕微環境危害
prerequisite: 無
summary: 玩家的塔樓位於郊區森林邊緣。塔樓的前任住客——一位名叫**塞拉斯**的老法師——在三年前神祕失蹤，留下了一座年久失修但功能尚存的塔樓。最近，森林中的螢火蟲表現出異常的魔法活性——它們的飛行軌跡形成了完美的幾何圖案。
acts:
- name: 第一幕：建立塔樓
  scenes:
  - 場景 1-1：抵達
  - 場景 1-2：發現塞拉斯的研究筆記
- name: 第二幕：第一個研究循環
  scenes:
  - 階段 1：觀察（感知檢定 難度等級（DC）12）
  - 階段 2：假設（理論檢定 難度等級（DC）10）
  - 階段 3：準備
  - 階段 4：實驗——在老橡樹下的挖掘（技藝檢定 難度等級（DC）12）
  - 階段 5：分析（理論檢定 難度等級（DC）8，自動成功）
- name: 第三幕：學術社交
  scenes:
  - 場景 3-1：不速之客——維克託
  - 場景 3-2：村莊危機
  - 場景 3-3：礦脈之爭（維克託分支）
npcs:
- name: 維克託·佩吉
  detail: '- 研究風格：文獻派 - 屬性：感知4 理論6 技藝3 意志4 博學7 - 學術聲望：12 - 專精：光元素 - 特質：嫉妒——無法忍受別人比自己強 - 祕密：他三年前曾和塞拉斯通信討論過森林中的異常——他是來找塞拉斯的研究成果的
    **玩家選擇**： 1. **分享發現**：告訴維克託關於碎片礦脈的事 → 維克託提出合作（轉向「合作研究」分支） 2. **保守祕密**：含糊其辭，打發他走 → 維克託會在森林中自己探索（轉向「競爭」分支）
    3. **欺騙**：告訴他錯誤的位置 → 維克託會在 1d3 回合後發現被騙（轉向「衝突」分支）'
research_checks:
- attribute: 感知
  dc: 12
- attribute: 理論
  dc: 10
- attribute: 技藝
  dc: 12
- attribute: 理論
  dc: 8

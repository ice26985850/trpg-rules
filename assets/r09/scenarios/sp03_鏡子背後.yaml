title: 鏡子背後
type: solo
quality: ★★★ 專家級
players: 1 名法師
sessions: 3–4 次
core_output: 1–2 個稀有碎片 + 禁忌網絡接觸 + 守望者關係定位
main_threat: 禁忌研究者、守望者審查、心靈汙染
prerequisite: 學術聲望 ≥ 10；建議有 1 名夥伴（戰鬥或學術）；建議完成劇本二以獲得灰霧線索
summary: 阿卡迪亞城發生了一起轟動學術界的事件：一位名叫**馬庫斯·燧發槍**的實證派法師——他同時也是禁忌研究地下網絡的祕密成員——在進行虛空碎片實驗時失控。他沒有觸發事故表——而是觸發了某種更糟糕的東西。
acts:
- name: 第一幕：雙面任務
  scenes:
  - 場景 1-1：兩個使命
  - 場景 1-2：進入守望者總部
  - 場景 1-3：會面馬庫斯
- name: 第二幕：潛入被封鎖的塔樓
  scenes:
  - 場景 2-1：祕密通道
  - 場景 2-2：馬庫斯的塔樓
- name: 第三幕：信任的代價
  scenes:
  - 場景 3-1：回報與抉擇
  - 場景 3-2：守望者或禁忌網絡的後續

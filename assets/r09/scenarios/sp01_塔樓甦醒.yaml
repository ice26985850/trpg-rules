title: 塔樓甦醒
type: solo
quality: ★ 學徒級
players: 1 名起始法師
sessions: 1–2 次
core_output: 1 個普通元素碎片 + 第一名學徒 + 可能的 NPC 夥伴基礎
main_threat: 塔樓殘留魔法、輕微環境危害、選擇性社交
prerequisite: 無——本劇本是戰役的起點
summary: 你獲得了一座塔樓——或者說，一座塔樓選擇了你。它位於郊區森林邊緣，前任住客**塞拉斯·暮星**在三年前的神祕失蹤後留下了這座年久失修但功能尚存的建築。基礎設施完好——實驗室 Lv1、圖書館
  Lv1、觀測臺 Lv1、收容室 Lv1、防禦系統 Lv1。
acts:
- name: 第一幕：抵達與發現
  scenes:
  - 場景 1-1：命名你的塔樓
  - 場景 1-2：塞拉斯的研究筆記
  - 場景 1-3：塔樓的第一個「訪客」
- name: 第二幕：森林中的第一個研究循環
  scenes:
  - 場景 2-1：重現塞拉斯的觀察
- name: 第三幕：甦醒的呼喚
  scenes:
  - 場景 3-1：塔樓的第一個危機
  - 場景 3-2：封印的真相
npcs:
- name: 艾拉
  detail: '- 身分：附近村莊的年輕女子，曾經幫助塞拉斯照料塔樓 - 屬性：感知 4 理論 3 技藝 4 意志 5 博學 2 - 性格：害羞但好奇，對魔法有未開發的天賦 - 她帶來了：一籃新鮮的麵包（「長老說新住客可能需要」）和一個問題（「您……收學徒嗎？」）
    **GM 扮演提示**：艾拉不是來強求的。她遞上麵包後在門口徘徊，然後才鼓起勇氣問出那個問題。如果玩家表示猶豫，她會說「我可以幫忙打掃和整理——您可以先觀察我」，然後迅速轉移話題聊起天氣。 **玩家選擇**：
    1. **接受艾拉為見習學徒**：需有學徒宿舍（起始 Lv0——尚未建造，但可以用空房間暫時安置）。艾拉加入，忠誠度 60。→ 獲得 NPC 學徒（未來可晉升為夥伴） 2. **婉拒但保持聯繫**：艾拉留下麵包並說「如果改變主意，我在村裡的磨坊工作」。→
    未來任何時候可招募她，忠誠度起始 +10（因為你先拒絕了她——這讓她覺得你是認真的） 3. **直接拒絕**：艾拉失望離去。→ 你可能失去了一個有特殊天賦的學徒（GM 祕密：艾拉的隱藏潛力——若成為首席學徒，她的特殊技能為
    d8 直接取 8「祕密天賦」，內容由 GM 設計） ---'
research_checks: []

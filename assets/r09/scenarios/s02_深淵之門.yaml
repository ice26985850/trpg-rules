title: 深淵之門
type: multiplayer
quality: ★★–★★★ 正式級至專家級
players: 2–4 名法師
sessions: 2–3 次
core_output: 虛空碎片（稀有）+ 空間碎片（罕見）
main_threat: 守望者議會的審查、禁忌研究殘留物、異界生物
prerequisite: 至少一名玩家學術聲望 ≥10 或禁忌派
summary: 阿什維爾廢墟——紀元 1102 年大爆炸的地點——最近出現了新的魔法波動。守望者議會正在祕密組織一支考察隊，名義上是「學術考察」，實際上是調查是否有禁忌研究者正在廢墟中進行非法實驗。
acts:
- name: 第一幕：兩個邀請
  scenes: []
- name: 第二幕：深入廢墟
  scenes: []
- name: 第三幕：後果
  scenes: []
npcs:
- name: 守望者考察隊
  detail: '- **隊長奧莉薇亞·鐵壁**：資深守望者，意志 8，對禁忌研究零容忍 - **研究員提比略**：年輕的學院法師，理論 7，好奇心過剩 - **傭兵隊長加雷特**：負責保護考察隊，技藝
    7 營地中，玩家被分配任務：使用感知和理論檢定繪製廢墟的魔法殘留地圖。 **隱藏情報**（感知 難度等級（DC）15 或博學 難度等級（DC）14）： > 你在繪製地圖時注意到一個異常：廢墟第三層的魔法殘留圖案和標準的爆炸殘留不符。爆炸是從中心向外擴散的——但第三層的魔法痕跡是**從外向內匯聚**的。這不是爆炸的痕跡——這是某種**召喚儀式**的殘留。
    如果玩家將此發現報告給奧莉薇亞，她會變得異常緊張，並禁止任何人靠近第三層。如果玩家保密，這會成為一個有價值的情報。'

title: 龍眠之所
type: solo
quality: ★★★★ 大師級
players: 1 名法師（必須） + 夥伴（強烈建議）
sessions: 4–5 次
core_output: 傳說級火焰碎片（◈）+ 龍族盟友 + 龍族夥伴（可能）
main_threat: 遠古龍的試煉、極地環境、競爭對手的陰影、自身能力的極限
prerequisite: 學術聲望 ≥ 30；至少擁有 1 個稀有或以上稀有度的火焰碎片；建議有忠誠度 ≥ 50 的夥伴
summary: 在北方的永冬冰原深處，一條名為**伊格納瑞斯**的古代火龍正在老去。這不是普通的龍——他是第二代龍，見過賽琳娜本人，親身經歷過虛無之神的封印。
acts:
- name: 第一幕：跨越永冬
  scenes:
  - 場景 1-1：瓦拉斯特拉的試煉
  - 場景 1-2：冰原穿越
- name: 第二幕：伊格納瑞斯的巢穴
  scenes:
  - 場景 2-1：龍巢入口
  - 場景 2-2：面對伊格納瑞斯
  - 場景 2-3：最終試煉——穩定臨終碎片
- name: 第三幕：龍的遺贈
  scenes:
  - 場景 3-1：伊格納瑞斯的最後禮物
  - 場景 3-2：澤菲羅斯的提議
  - 場景 3-3：回程

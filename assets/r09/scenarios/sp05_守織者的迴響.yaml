title: 守織者的迴響
type: solo
quality: ★★★★★ 傳奇級
players: 1 名法師（必須） + 夥伴（必須）
sessions: 5–8 次（可作為戰役終章）
core_output: 多個傳說碎片、終極法術完成、世界級影響、虛無之神的對話
main_threat: 虛無裂縫、虛無之神的殘留意識、守望者的終極考驗、純淨之火的幹預
prerequisite: 學術聲望 ≥ 60；至少擁有 2 個傳說碎片；已完成研究目標的理論準備；完成劇本一至四中至少三個；強烈建議有忠誠度 ≥ 60 的夥伴
summary: 足夠多的傳說碎片已經聚集在一個地方。足夠強大的法術被創造出來。星辰之織本身開始變得不穩定。
acts:
- name: 第一幕：匯聚前夜
  scenes:
  - 場景 1-1：召集力量
  - 場景 1-2：關鍵夥伴的集結
- name: 第二幕：終極法術的創造
  scenes:
  - 場景 2-1：收集最後的傳說碎片
  - 場景 2-2：創造終極法術
- name: 第三幕：最終抉擇
  scenes:
  - 場景 3-1：四個選擇
  - 場景 3-2：夥伴的終極抉擇
  - 場景 3-3：終極施法
npcs: []
research_checks:
- attribute: 意志
  dc: 22

title: 灰霧中的足跡
type: solo
quality: ★★ 正式級
players: 1 名法師
sessions: 2–3 次
core_output: 1 個罕見元素碎片 + 傭兵夥伴
main_threat: 野外生物、異常魔法現象、神祕的跟蹤者
prerequisite: 至少完成劇本一或等價的自由研究；學術或實用聲望 ≥ 5；建議有 1 名學徒（留守塔樓）
summary: 三個月前，一位名叫**科爾**的年輕法師在探索灰霧沼澤時失蹤。他的導師——學院法師**維克託·佩吉**——向獨立法師社羣發出了求助。科爾最後發出的訊息是透過窺探池傳來的，只有一句話：
acts:
- name: 第一幕：出發準備
  scenes:
  - 場景 1-1：維克託的委託
  - 場景 1-2：旅途中的夥伴機會
- name: 第二幕：深入灰霧
  scenes:
  - 場景 2-1：霧中的線索
  - 場景 2-2：沼澤中的第一場戰鬥
  - 場景 2-3：古老實驗室
- name: 第三幕：記錄水晶的祕密
  scenes:
  - 場景 3-1：返回塔樓
  - 場景 3-2：研究記憶晶片
  - 場景 3-3：莉娜的去留
npcs:
- name: 維克託·佩吉
  detail: '- 研究風格：文獻派 - 屬性：感知 4 理論 6 技藝 3 意志 4 博學 7 - 專精：光元素 - 立場：絕望的導師——他願意支付報酬，但更希望你能真正幫忙 **維克託提供的報酬**：
    - **金幣**：200 金幣（GP）（預付 100 金幣（GP）） - **知識**：一份關於灰霧沼澤魔法生態的稀有手稿（博學 +1d3 聲望的研究材料） - **人情**：未來一次免費的圖書館借閱權（維克託的學院圖書館
    Lv3） **若你與維克託已有合作關係**（來自原劇本一）：他會額外提供一個祕密——「科爾在研究霧中的一個古老建築。他認為那裡是**第一位亡靈法師的實驗室**。」'
- name: 莉娜·鐵林
  detail: '- 身分：傭兵，專精野外追蹤和危險生物狩獵 - 屬性：感知 6 理論 2 技藝 7 意志 5 博學 3（屬性總和 23，專家級夥伴） - 性格：沉默、務實、不信任法師（「我看過太多法師把別人炸上天然後自己跑了」）——但在金幣和正義面前可以合作
    - 她在旅店的原因：她也在前往灰霧沼澤——一隊商人僱她護送貨物經過沼澤邊緣。但她聽說沼澤的異常後，正在考慮是否接受這個工作。 **玩家選擇**： 1. **僱用莉娜為夥伴**：說服她放棄商隊委託，改為保護你進入沼澤深處。難度等級（DC）
    15 說服（可用金幣降低 難度等級（DC）：每 50 金幣（GP） –1，最多 –4）。成功則莉娜加入（忠誠度 40——契約關係）。費用：200 金幣（GP） 一次性 + 30 金幣（GP）/月。未來她可繼續作為你的常駐夥伴。 2. **提出分工合作**：你支付她
    100 金幣（GP） 作為「沼澤嚮導」，她帶你到沼澤邊緣，不進入深處。可獲得沼澤情報和 難度等級（DC） –2 的野外探索檢定。 3. **獨自前行**：省錢，但你失去了唯一的戰鬥夥伴。GM 應在後續遭遇中注意降低難度。
    ---'
research_checks: []

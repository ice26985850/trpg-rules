<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 520" font-family="Microsoft JhengHei, sans-serif">
  <rect width="680" height="520" fill="#0a0a1a"/>

  <!-- 區域底色 -->
  <rect x="30" y="30" width="620" height="460" rx="8" fill="#1a1a2e" opacity="0.6"/>

  <!-- 背景網格 -->
  <g stroke="#1f1f3a" stroke-width="0.5" opacity="0.4">
    <line x1="0" y1="100" x2="680" y2="100"/><line x1="0" y1="200" x2="680" y2="200"/>
    <line x1="0" y1="300" x2="680" y2="300"/><line x1="0" y1="400" x2="680" y2="400"/>
  </g>

  <!-- 區域標籤 -->
  <text x="155" y="55" fill="#4B0082" font-size="9" opacity="0.6">入口區域</text>
  <text x="280" y="55" fill="#4169E1" font-size="9" opacity="0.6">研究區域</text>
  <text x="380" y="55" fill="#FF8C00" font-size="9" opacity="0.6">收容區域</text>
  <text x="480" y="55" fill="#DC143C" font-size="9" opacity="0.6">核心</text>
  <text x="560" y="55" fill="#2E8B57" font-size="9" opacity="0.6">出口</text>

  <!-- 連線 A→B -->
  <line x1="230" y1="440" x2="340" y2="390" stroke="#6B8CF6" stroke-width="2" marker-end="url(#arrowCorridor)"/>
  <!-- 連線 B→C -->
  <line x1="370" y1="370" x2="350" y2="250" stroke="#6B8CF6" stroke-width="2"/>
  <!-- 連線 B→H -->
  <line x1="320" y1="370" x2="250" y2="290" stroke="#6B8CF6" stroke-width="1.5" stroke-dasharray="6,3"/>
  <!-- 連線 C→D→E (走廊) -->
  <line x1="380" y1="240" x2="440" y2="240" stroke="#FF8C00" stroke-width="2"/>
  <line x1="470" y1="240" x2="530" y2="240" stroke="#FF8C00" stroke-width="2"/>
  <!-- 連線 C→F, D→F -->
  <line x1="370" y1="220" x2="460" y2="140" stroke="#DC143C" stroke-width="2.5"/>
  <line x1="460" y1="220" x2="460" y2="140" stroke="#DC143C" stroke-width="2"/>
  <!-- 連線 F→G -->
  <line x1="500" y1="110" x2="580" y2="70" stroke="#2E8B57" stroke-width="2.5"/>

  <!-- A：入口大廳 -->
  <rect x="150" y="430" width="100" height="60" rx="10" fill="#4B0082" stroke="#8B5CF6" stroke-width="2"/>
  <text x="200" y="455" text-anchor="middle" fill="white" font-size="12" font-weight="bold">入口大廳</text>
  <text x="200" y="475" text-anchor="middle" fill="#aaa" font-size="8">⚠ 監控運作中</text>

  <!-- B：檔案室 -->
  <rect x="310" y="365" width="90" height="55" rx="10" fill="#4169E1" stroke="#6B8CF6" stroke-width="2"/>
  <text x="355" y="388" text-anchor="middle" fill="white" font-size="12" font-weight="bold">檔案室</text>
  <text x="355" y="406" text-anchor="middle" fill="#FFD700" font-size="8">📋 搜刮點</text>

  <!-- H：廢棄培養室 -->
  <rect x="200" y="260" width="95" height="50" rx="10" fill="#4169E1" stroke="#6B8CF6" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="247" y="280" text-anchor="middle" fill="white" font-size="11">廢棄培養室</text>
  <text x="247" y="298" text-anchor="middle" fill="#FFD700" font-size="8">📋 可選搜刮</text>

  <!-- C：收容區 A（莉娜） -->
  <rect x="320" y="195" width="85" height="55" rx="10" fill="#FF8C00" stroke="#FFA500" stroke-width="2"/>
  <text x="362" y="218" text-anchor="middle" fill="white" font-size="11" font-weight="bold">收容區 A</text>
  <text x="362" y="236" text-anchor="middle" fill="#ffe0b2" font-size="8">👤 莉娜</text>

  <!-- D：收容區 B（葛羅斯） -->
  <rect x="420" y="195" width="85" height="55" rx="10" fill="#FF8C00" stroke="#FFA500" stroke-width="2"/>
  <text x="462" y="218" text-anchor="middle" fill="white" font-size="11" font-weight="bold">收容區 B</text>
  <text x="462" y="236" text-anchor="middle" fill="#ff9999" font-size="8">⚠ 葛羅斯</text>

  <!-- E：收容區 C（零號） -->
  <rect x="510" y="195" width="85" height="55" rx="10" fill="#FF8C00" stroke="#FFA500" stroke-width="2"/>
  <text x="552" y="218" text-anchor="middle" fill="white" font-size="11" font-weight="bold">收容區 C</text>
  <text x="552" y="236" text-anchor="middle" fill="#ff9999" font-size="8">⚠ 零號</text>

  <!-- F：核心實驗室 -->
  <rect x="420" y="90" width="110" height="65" rx="12" fill="#DC143C" stroke="#FF4444" stroke-width="3"/>
  <text x="475" y="115" text-anchor="middle" fill="white" font-size="13" font-weight="bold">核心實驗室</text>
  <text x="475" y="135" text-anchor="middle" fill="#ffcccc" font-size="9">⚠ AI 守護者</text>

  <!-- G：逃生通道 -->
  <rect x="555" y="45" width="90" height="55" rx="10" fill="#2E8B57" stroke="#4CAF50" stroke-width="2.5"/>
  <text x="600" y="68" text-anchor="middle" fill="white" font-size="12" font-weight="bold">逃生通道</text>
  <text x="600" y="86" text-anchor="middle" fill="#90EE90" font-size="8">🏃 出口</text>

  <!-- 標題 -->
  <text x="340" y="25" text-anchor="middle" fill="#FF8C00" font-size="15" font-weight="bold">實驗室逃亡 —— 基因實驗室</text>

  <!-- 圖例 -->
  <g transform="translate(50, 110)">
    <rect x="0" y="0" width="10" height="10" rx="2" fill="#4B0082"/><text x="15" y="10" fill="#aaa" font-size="9">起點</text>
    <rect x="0" y="15" width="10" height="10" rx="2" fill="#DC143C"/><text x="15" y="25" fill="#aaa" font-size="9">BOSS</text>
    <rect x="0" y="30" width="10" height="10" rx="2" fill="#FF8C00"/><text x="15" y="40" fill="#aaa" font-size="9">NPC</text>
    <rect x="0" y="45" width="10" height="10" rx="2" fill="#2E8B57"/><text x="15" y="55" fill="#aaa" font-size="9">出口</text>
  </g>
</svg>
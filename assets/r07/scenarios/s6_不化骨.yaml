# 地師TRPG 劇本 S6：不化骨 ——「牠比你聰明」
scenario_id: S6
title: "不化骨——牠比你聰明"
level_range: "9-12"
difficulty: "極難"
sessions: "3-4"
region: "跨區域（關中→中原→燕趙）"

synopsis: |
  這不是一個墓——這是一場追獵。一個偽裝成人的不化骨正在各地活動。
  牠以人類身份混入社會——古董商、學者、甚至軍官。
  這隻不化骨是一個唐代術士——生前研究如何逆轉生死。花了一千年讓屍身進化為不化骨。
  牠的目標是完成生前未竟的研究——打開一座「不可能被打開」的墓，取出其中的東西完成真正的復活。
  這是貓捉老鼠的劇本——玩家需要在三個城市追蹤牠，比牠更聰明才能阻止牠。

npcs:
  - {id: npc_shen, name: "「沈老闆」/不化骨", role: "主要對手", attitude: "冷靜、聰明、有耐心", secret: "他並不邪惡——只是想完成生前的研究。方法可能傷害無辜但他不認為是問題", stats: {type: "不化骨", cr: 12, hp: 120, def: 24, special: "完全人類外觀，可完美偽裝"}}
  - {id: npc_officer_li, name: "李警官", role: "潛在盟友", attitude: "懷疑有人在盜墓", info: "已注意到「沈老闆」的異常但無證據"}
  - {id: npc_abe, name: "日本陰陽師「安倍」", role: "競爭者/潛在盟友", attitude: "對不化骨極感興趣", secret: "想捕捉不化骨用於自己的研究"}
  - {id: npc_assistant, name: "不化骨的「助手」", role: "被不化骨控制的跳屍", attitude: "對不化骨絕對忠誠", secret: "他是不化骨的學生——在一千年前"}

locations:
  - {id: loc_xian, name: "西安古玩街", description: "不化骨的第一個身份：古董商「沈老闆」"}
  - {id: loc_luoyang, name: "洛陽圖書館", description: "不化骨竊取古代文獻的現場"}
  - {id: loc_beijing, name: "北平郊外", description: "不化骨的目標墓所在地"}
  - {id: loc_lab, name: "唐代術士的實驗室", description: "隱藏在目標墓下方"}

encounters:
  - {id: enc_xian, name: "西安調查", type: "探索/社交", dc: 14, description: "在古玩街追蹤不化骨的交易記錄"}
  - {id: enc_luoyang, name: "洛陽圖書館", type: "探索/社交", dc: 14, description: "不化骨已來過——現場留下線索（和被殺的守夜人）"}
  - {id: enc_train, name: "火車追蹤", type: "探索/社交", dc: 12, description: "不化骨正在前往北平——玩家需在火車上找到牠"}
  - {id: enc_dialogue, name: "與不化骨對話", type: "社交", dc: 18, description: "不化骨願意談——想知道玩家為什麼要阻止牠。這是劇本的關鍵轉折點"}
  - {id: enc_lab, name: "術士實驗室", type: "探索/戰鬥", dc: 16, ttv: 25, description: "不化骨+助手+實驗室中的各種威脅"}
  - {id: enc_final_choice, name: "最終選擇", type: "綜合", description: "幫助不化骨完成研究？阻止牠？還是第三條路？"}

key_items:
  - {id: item_notes, name: "不化骨的研究筆記", description: "唐代術士千年研究成果——生死逆轉理論。禁忌知識"}
  - {id: item_sealing_tools, name: "封印法器（一套）", description: "術士實驗室中的完整法器"}
  - {id: item_core_shard, name: "不化骨的核心碎片", description: "若不化骨被消滅獲得。千年陰煞核心——極強法器材料"}

endings:
  - {id: ending_understanding, name: "理解與放行", condition: "說服不化骨用不傷害他人的方式完成研究", result: "不化骨完成復活（作為人類）後自動消散——獲得畢生知識"}
  - {id: ending_destroy, name: "強行消滅", condition: "戰鬥擊敗不化骨", result: "獲得核心碎片但失去知識傳承"}
  - {id: ending_seal, name: "封印", condition: "將不化骨封印", result: "暫時解決——千年後封印減弱"}
  - {id: ending_persuaded, name: "被說服", condition: "不化骨反過來說服玩家幫助牠", result: "獲得強力盟友但得罪整個地師界"}

rewards: {xp: 1200, money: "1000-3000大洋"}
scale_adjustments:
  solo: {playable: true, note: "不化骨更願意對話而非戰鬥。追獵緊張但不需戰鬥力", ttv_mult: 0.6}

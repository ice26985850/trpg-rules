title: 地師 TRPG —— 怪物圖鑑
sections:
- name: 一、殭屍類
  subsections:
  - name: 新屍（CR 0.5）
    cr: '0.5'
    blocks:
    - type: code
      content: "生命值（HP）：15\n防禦值（DEF）：5–8（身手 1–3 + 無護甲 + 硬功 0）\n先攻值（INIT）：+1–3\n移動：10\
        \ 尺（僵硬）\n\n攻擊：\n  爪擊——2d10+2 vs 防禦值（DEF），命中：1d6 物理傷害\n\n特殊能力：\n  - 無\n\n弱點：\n\
        \  - 陽光：陽光下每回合 1d6 傷害\n  - 驅邪符：即死（無需傷害擲骰）\n  - 鎮屍符：完全定身\n\n戰術：本能攻擊最近目標。無戰術意識。\n\
        出現場合：S1 初試啼聲、剛屍變的新墓"
    - type: paragraph
      content: '---'
  - name: 白僵（CR 2–3）
    cr: 2–3
    blocks:
    - type: code
      content: "生命值（HP）：30\n防禦值（DEF）：12–13（身手 2–3 + 天生硬皮 ~9–10 + 硬功 0）\n先攻值（INIT）：+2–4\n\
        移動：20 尺（雙臂前伸跳躍，無法轉彎或彎腰）\n\n攻擊：\n  雙爪揮擊——2d10+3 vs 防禦值（DEF），命中：1d6+2 物理 + 屍毒感染（DC\
        \ 12）\n  擒抱——2d10+3 vs 防禦值（DEF），命中：壓制（對抗身手 DC 14 掙脫）\n\n特殊能力：\n  - 跳躍撲擊：移動＋攻擊合併為一個動作，命中\
        \ +1\n  - 屍氣威壓：10 尺內活人恐懼值 +1／回合\n\n弱點：\n  - 驅邪符：1d8 灼傷＋削弱（下回合攻擊劣勢＋移動減半）\n\
        \  - 鎮屍符：完全定身（無需真氣注入）\n  - 銅錢劍：額外 +1d4 灼傷傷害\n  - 糯米：踩到 1d4 灼傷\n  - 墨斗結界：無法穿越\n\
        \  - 陽光：每回合 1d6 傷害\n\n戰術：跳躍撲擊最近目標。優先攻擊移動最快者。無戰術意識。\n出現場合：S1（變體）、S2、小型古墓"
    - type: paragraph
      content: '---'
  - name: 黑僵（CR 4–5）
    cr: 4–5
    blocks:
    - type: code
      content: "生命值（HP）：50\n防禦值（DEF）：14–16（身手 3–4 + 硬質皮膚 ~11–12 + 硬功 0）\n先攻值（INIT）：+3–5\n\
        移動：25 尺（可自由走動但關節僵硬，像鎖死的木偶）\n\n攻擊：\n  爪擊撕裂——2d10+4 vs 防禦值（DEF），命中：2d6+3 物理\
        \ + 屍毒感染（DC 16）\n  衝撞——2d10+4 vs 防禦值（DEF），命中：2d4+2 物理，目標擊退 10 尺＋倒地（DC 14）\n\
        \n特殊能力：\n  - 生前記憶碎片：保留部分語言能力（可進行簡單對話）\n  - 屍氣擴散：20 尺內活人恐懼值 +1／回合，真氣恢復 −1／回合\n\
        \  - 硬質皮膚：物理傷害減免 −3\n  - 狩獵本能：優先攻擊已受傷目標\n\n弱點：\n  - 驅邪符：效果減半（1d6 灼傷，削弱效果僅持續半回合）\n\
        \  - 鎮屍符：需注入真氣（DC 18 畫符檢定）方可定住\n  - 墨斗結界：無法穿越（金絲墨斗有效 3 小時）\n  - 銅錢劍：正常傷害\n\
        \n戰術：有簡單戰術意識。會試圖孤立單一目標。若受傷會退後等待時機。\n     可能願意對話——若玩家展示尊重或提及墓主生前關心之事。\n出現場合：S2\
        \ 將軍塚、中型古墓、被破壞封印的墓"
    - type: paragraph
      content: '---'
  - name: 跳屍（CR 6–7）
    cr: 6–7
    blocks:
    - type: code
      content: "生命值（HP）：80\n防禦值（DEF）：17–18（身手 5–6 + 銅皮鐵骨 ~12 + 硬功 0）\n先攻值（INIT）：+5–7\n\
        移動：30 尺（行動自如，外表與活人無異，可奔跑跳躍）\n\n攻擊：\n  鋼爪斬——2d10+6 vs 防禦值（DEF），命中：3d6+4 物理\
        \ + 屍毒感染（DC 20）\n  撕裂擒抱——2d10+6 vs 防禦值（DEF），命中後每回合自動 2d6（對抗身手 DC 18 掙脫）\n\
        \  投擲——2d10+5 vs 防禦值（DEF），命中：2d8 物理，目標倒地\n\n特殊能力：\n  - 銅皮鐵骨：普通兵器傷害 0。物理傷害減免\
        \ −5\n  - 高階屍氣：30 尺內恐懼值 +2／回合。膽魄 DC 16 否則恐慌\n  - 跳躍突襲：可從 40 尺外跳躍攻擊，先攻檢定優勢\n\
        \  - 殘留意識：保留部分生前記憶和戰鬥技巧\n  - 完全偽裝：外表與活人無異（CR 7 時）\n\n弱點：\n  - 驅邪符：僅能逼退數步（1d4\
        \ 傷害）\n  - 鎮屍符：僅能定住數分鐘（而非數小時）\n  - 五雷掌／五雷符：3d8 法器傷害（可劈開體表）\n  - 法器（桃木劍／銅錢劍／百年桃木劍）：正常傷害\n\
        \  - 硬功大成（LV12 武師）：徒手攻擊視為法器\n\n戰術：聰明且致命。優先攻擊符法師（威脅最大）。懂得利用環境。會佯攻。\n     若保留較多生前記憶，可能願意對話——但比黑僵更難說服。\n\
        出現場合：S5 養屍地、高階古墓、帝王陵護衛"
    - type: paragraph
      content: '---'
  - name: 跳屍·飛屍（CR 8–9，跳屍變體）
    cr: 8–9
    blocks:
    - type: code
      content: "生命值（HP）：65\n防禦值（DEF）：19–20（身手 6–7 + 銅皮鐵骨 ~13 + 硬功 0）\n先攻值（INIT）：+7–8\n\
        移動：30 尺（地面）+ 飛行 40 尺\n\n攻擊（繼承跳屍全部攻擊，並增加）：\n  俯衝抓取——飛行中攻擊，2d10+7 vs 防禦值（DEF），命中後抓取目標飛至高空\n\
        \  高空拋摔——被抓起後下一回合拋下，4d6 墜落傷害\n\n特殊能力（繼承跳屍全部能力，並增加）：\n  - 飛行：40 尺飛行速度\n  -\
        \ 高空優勢：對地面目標攻擊優勢\n  - 掠奪俯衝：俯衝攻擊後可立即飛行離開（不觸發藉機攻擊）\n\n弱點：同跳屍。額外弱點——狹窄空間限制飛行（室高小於\
        \ 10 尺時無法飛行）\n出現場合：S4 鬼市交易（玉棺中的怨靈）、S7 帝陵、高階封印物內容"
    - type: paragraph
      content: '---'
  - name: 不化骨（CR 10–12）
    cr: 10–12
    blocks:
    - type: code
      content: "生命值（HP）：120\n防禦值（DEF）：22–24（身手 7–8 + 千年屍身 ~15–16 + 硬功 0）\n先攻值（INIT）：+7–9\n\
        移動：30 尺（完全自如，可偽裝成人類混入人群）\n\n攻擊：\n  碎骨擊——2d10+8 vs 防禦值（DEF），命中：4d6+5 物理 + 屍毒感染（DC\
        \ 24）\n  橫掃——2d10+7 vs 防禦值（DEF），命中：2d8+3 物理，15 尺錐形範圍\n  精神震懾——膽魄 DC 20，失敗：震懾\
        \ 1 回合＋恐懼值 +4\n\n特殊能力：\n  - 刀槍不入：普通兵器傷害 0。物理傷害減免 −8\n  - 水火不侵：火焰／環境傷害無效\n\
        \  - 偽裝成人：外表與活人完全無異。可完美模仿人類行為\n  - 千年屍氣：50 尺內恐懼值 +3／回合。膽魄 DC 18 否則恐慌\n  -\
        \ 不死意志：HP 降至 0 時，膽魄 DC 22，成功則以 1 HP 繼續戰鬥（每戰一次）\n  - 完全智能：可制定複雜策略、操控他人、進行長期計劃\n\
        \  - 語言之主：可完美使用人類語言（甚至多種方言）\n\n弱點：\n  - 普通符咒：完全無效\n  - 鎮屍符：貼上即自燃\n  - 僅法器（百年桃木劍／斬龍劍／天師符）或五雷掌能造成有效傷害\n\
        \  - 生前執念：可能是唯一的非戰鬥解決途徑\n\n戰術：極度危險。先精神震懾全隊，再優先擊殺符法師。會撤退、設伏、利用人質。\n     遇到強力抵抗時會撤退並重新計劃。最危險的不是力量——是智慧。\n\
        出現場合：S6 不化骨、S7 帝陵、隱藏的最終威脅"
    - type: paragraph
      content: '---'
  blocks: []
- name: 二、靈體類
  subsections:
  - name: 滯留靈（一般）
    blocks:
    - type: code
      content: "挑戰等級（CR）：1–2\n生命值（HP）：20（虛體——僅法器／符咒可命中）\n防禦值（DEF）：10（虛體——普通物理攻擊自動失手）\n\
        先攻值（INIT）：+3\n移動：20 尺（飄浮）\n\n攻擊：\n  精神干擾——膽魄 DC 12，失敗：1d4 精神傷害＋恐懼值 +1\n\n\
        弱點：法器、符咒、完成執念\n出現場合：S1 三姨太、各墓中的次要靈體"
    - type: paragraph
      content: '---'
  - name: 怨靈／厲鬼
    blocks:
    - type: code
      content: "挑戰等級（CR）：3–6\n生命值（HP）：30–50（虛體——僅法器／符咒可命中）\n防禦值（DEF）：14（虛體——普通物理攻擊自動失手）\n\
        先攻值（INIT）：+4–6\n移動：30 尺（飄浮，可穿牆）\n\n攻擊：\n  精神衝擊——膽魄對抗 DC 14–18，失敗：2d6 精神傷害＋恐懼值\
        \ +2\n  控物攻擊——2d10+4 vs 防禦值（DEF），命中：2d4 物理（控制無主物品擲物）\n  附身——意志堅守 DC 16–20，失敗：身體被控制\
        \ 1d4 回合\n\n特殊能力：\n  - 虛體：普通物理攻擊自動失手\n  - 穿牆：可穿過任何非附魔實體障礙\n  - 靈體顯現：可選擇性讓特定人看到\n\
        \  - 執念鎖定：若玩家與執念有關，攻擊優勢\n\n弱點：\n  - 法器／符咒正常傷害\n  - 驅邪符：1d8 灼傷\n  - 破穢符：強制退散\n\
        \  - 完成執念：和平解決的唯一方式\n\n出現場合：S3 水銀迷宮（工匠怨靈）、S4 玉棺中的怨靈、各墓中的冤魂"
    - type: paragraph
      content: '---'
  blocks: []
- name: 三、精怪類
  subsections:
  - name: 狐仙／精怪
    blocks:
    - type: code
      content: "挑戰等級（CR）：3–8（取決於年齡和修為）\n態度：友善中立——有自己的利益和底線\n交涉難度等級（DC）：14–18\n\n特性：\n\
        \  - 可交流談判，有完整智能\n  - 不會無故傷人也不會無故助人\n  - 喜歡以物易物的公平交易\n  - 對人類世界有一定了解但不完全\n\
        \  - 可能擁有獨特的情報或能力\n\n出現場合：S4 鬼市交易、野外遭遇、古墓附近的靈地"
    - type: paragraph
      content: '---'
  blocks: []
- name: 四、環境威脅
  subsections:
  - name: 鬼打牆
    blocks:
    - type: code
      content: "觸發條件：陰氣濃度 ≥ 4 的區域，或特定怨靈刻意製造\n效果：玩家無論怎麼走都回到原點\n持續：直到被破解\n\n破解方式：\n\
        \  1. 陰陽眼看穿——DC 14\n  2. 羅盤導航——DC 16\n  3. 開光八卦鏡——消耗 2 真氣，自動成功\n  4. 引路符——自動成功（消耗\
        \ 1 張符）\n  5. 閉眼倒走——膽魄 DC 14（民間偏方）"
  - name: 養屍地
    blocks:
    - type: code
      content: "效果（區域）：\n  - 區域內所有不死生物獲得優勢檢定\n  - 區域內所有活人真氣恢復 −1／回合\n  - 區域內屍變概率 ×3\n\
        \  - 區域邊界墨斗結界持續時間減半\n\n破解：鎮煞大陣（需 3 位地師協作，DC 14）或修復鎮物（DC 16）"
    - type: paragraph
      content: '---'
    - type: paragraph
      content: '> **地師 TRPG 怪物圖鑑 v1.0** | 跑團規則工作室'
  blocks: []

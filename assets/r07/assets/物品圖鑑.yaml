      稀有度: ◇
      價格（大洋）: '1'
      重量（kg）: '1'
      防禦修正: '+1'
      備註: 基礎防護，不影響身手檢定
    - 防具: 皮甲
      稀有度: ◇
      價格（大洋）: '8'
      重量（kg）: '2'
      防禦修正: '+2'
      備註: 輕便保護，潛行 −1
    - 防具: 護心鏡
      稀有度: ◆
      價格（大洋）: '15'
      重量（kg）: '3'
      防禦修正: '+2'
      備註: 物理傷害額外 −1（與硬功疊加）
  - type: paragraph
    content: '---'
- name: 三、武器
  subsections: []
  blocks:
  - type: table
    headers:
    - 武器
    - 稀有度
    - 價格（大洋）
    - 重量（kg）
    - 傷害
    - 特殊效果
    rows:
    - 武器: 空手
      稀有度: —
      價格（大洋）: —
      重量（kg）: —
      傷害: 1d4 物理
      特殊效果: —
    - 武器: 短刀
      稀有度: ◇
      價格（大洋）: '2'
      重量（kg）: '1'
      傷害: 1d6 物理
      特殊效果: —
    - 武器: 長劍
      稀有度: ◇
      價格（大洋）: '10'
      重量（kg）: '3'
      傷害: 1d8 物理
      特殊效果: —
    - 武器: 桃木劍
      稀有度: ◇
      價格（大洋）: '3'
      重量（kg）: '2'
      傷害: 1d6 對靈體
      特殊效果: 對物理目標 0（當棍棒 1d4−2）
    - 武器: 銅錢劍
      稀有度: ◆
      價格（大洋）: '10'
      重量（kg）: '3'
      傷害: 1d8 對殭屍
      特殊效果: 對白僵 +1d4 灼傷；對靈體 1d4
    - 武器: 百年桃木劍
      稀有度: ◈
      價格（大洋）: '50'
      重量（kg）: '2'
      傷害: 2d6 對靈體
      特殊效果: 對殭屍 1d8。自帶微光 5 尺
    - 武器: 斬龍劍
      稀有度: ★
      價格（大洋）: 無價
      重量（kg）: '4'
      傷害: 3d8 對殭屍
      特殊效果: 無視不化骨傷害免疫。擊殺後下次攻擊 +1d8
  - type: paragraph
    content: '---'
- name: 四、法器與工具
  subsections:
  - name: 羅盤
    blocks:
    - type: table
      headers:
      - 裝備
      - 稀有度
      - 價格（大洋）
      - 重量（kg）
      - 效果
      rows:
      - 裝備: 風水羅盤（入門）
        稀有度: ◇
        價格（大洋）: '3'
        重量（kg）: '1'
        效果: 堪輿檢定 +1
      - 裝備: 風水羅盤（精製）
        稀有度: ◆
        價格（大洋）: '20'
        重量（kg）: '1'
        效果: 堪輿檢定 +2
      - 裝備: 搬山鏟（搬山派專用）
        稀有度: ◆
        價格（大洋）: —
        重量（kg）: '4'
        效果: 洛陽鏟改良版，探土 +2
  - name: 法器
    blocks:
    - type: table
      headers:
      - 裝備
      - 稀有度
      - 價格（大洋）
      - 重量（kg）
      - 效果
      rows:
      - 裝備: 開光八卦鏡
        稀有度: ◈
        價格（大洋）: '40'
        重量（kg）: '0.5'
        效果: 陰陽感知 +2。消耗 2 真氣看穿鬼打牆
      - 裝備: 鎮魂鈴
        稀有度: ◈
        價格（大洋）: '60'
        重量（kg）: '1'
        效果: 30 尺內低階靈體靜止 1 回合。每日 3 次
      - 裝備: 尋龍尺
        稀有度: ◈
        價格（大洋）: '30'
        重量（kg）: '0.5'
        效果: 堪輿可重擲一次（取高），每次冒險 3 次
      - 裝備: 天師印
        稀有度: ★
        價格（大洋）: 無價
        重量（kg）: '0.5'
        效果: 蓋在符上效果 ×3。每日一次。持有者所有符咒真氣消耗 −1
  - name: 結界工具
    blocks:
    - type: table
      headers:
      - 裝備
      - 稀有度
      - 價格（大洋）
      - 重量（kg）
      - 效果
      rows:
      - 裝備: 墨斗
        稀有度: ◇
        價格（大洋）: '1'
        重量（kg）: '1'
        效果: 墨線結界 10 尺。低階靈體／白僵無法穿越。持續 1hr
      - 裝備: 墨斗（金絲）
        稀有度: ◈
        價格（大洋）: '35'
        重量（kg）: '1.5'
        效果: 結界對黑僵以下有效。持續 3hr
  - name: 一次性法器
    blocks:
    - type: table
      headers:
      - 裝備
      - 稀有度
      - 價格（大洋）
      - 效果
      rows:
      - 裝備: 天師符
        稀有度: ✦
        價格（大洋）: 80（有市無價）
        效果: 一次性。效果 ×2。僅古墓發現或天師贈予
    - type: paragraph
      content: '---'
  blocks: []
- name: 五、消耗品
  subsections:
  - name: 符咒材料
    blocks:
    - type: table
      headers:
      - 材料
      - 售價（大洋）
      - 消耗速率
      rows:
      - 材料: 硃砂（1 盒）
        售價（大洋）: '3'
        消耗速率: 畫 20 張符
      - 材料: 黃紙（1 疊 20 張）
        售價（大洋）: '1'
        消耗速率: 每符 1 張
      - 材料: 黑狗血（1 瓶）
        售價（大洋）: '2'
        消耗速率: 1 次（潑灑或強化符咒）
      - 材料: 糯米粉（1 袋）
        售價（大洋）: '0.5'
        消耗速率: 1 道破穢符
      - 材料: 香（1 束 10 支）
        售價（大洋）: '0.5'
        消耗速率: 請神 3 支／安撫 1 支。每支可燃 30 分鐘
      - 材料: 紙錢（1 疊 50 張）
        售價（大洋）: '0.2'
        消耗速率: 撒一次 10–20 張
  - name: 對抗殭屍物資
    blocks:
    - type: table
      headers:
      - 物品
      - 售價（大洋）
      - 重量（kg）
      - 效果
      rows:
      - 物品: 糯米（1 袋 5 斤）
        售價（大洋）: '0.5'
        重量（kg）: '3'
        效果: 撒地：殭屍踩到 1d4 灼傷。拔屍毒：消耗 1 斤／次，降 DC 2
      - 物品: 黑狗血（1 瓶）
        售價（大洋）: '2'
        重量（kg）: '2'
        效果: 潑殭屍：下回合攻擊劣勢＋驅邪符效果 +2。強化護身符：抵禦兩次
      - 物品: 避屍香
        售價（大洋）: '25'
        重量（kg）: '0.5'
        效果: 白僵不會主動靠近 20 尺。可燃 1hr
  - name: 丹藥
    blocks:
    - type: table
      headers:
      - 丹藥
      - 稀有度
      - 價格（大洋）
      - 效果
      rows:
      - 丹藥: 培元丹
        稀有度: ◇
        價格（大洋）: '5'
        效果: 真氣恢復 +5
      - 丹藥: 續命丹
        稀有度: ◆
        價格（大洋）: '15'
        效果: HP 恢復 2d6
      - 丹藥: 解毒丹
        稀有度: ◇
        價格（大洋）: '8'
        效果: 解除一般毒素和輕度屍毒（DC −4）
      - 丹藥: 定神香
        稀有度: ◆
        價格（大洋）: '12'
        效果: 吸入恐懼值減半，30 尺全員有效
      - 丹藥: 龜息丹
        稀有度: ◈
        價格（大洋）: '30'
        效果: 10 分鐘不需呼吸。結束後疲勞 1 回合
      - 丹藥: 純陽丹
        稀有度: ◈
        價格（大洋）: '25'
        效果: 1hr 內陰氣攻擊／靈體附身免疫。結束後膽魄 DC 10
    - type: paragraph
      content: 丹藥限制：每場戰鬥最多 2 顆。同種連續服用效果遞減。
    - type: paragraph
      content: '---'
  blocks: []
- name: 六、探險裝備
  subsections: []
  blocks:
  - type: table
    headers:
    - 裝備
    - 稀有度
    - 價格（大洋）
    - 重量（kg）
    - 效果
    rows:
    - 裝備: 火摺子
      稀有度: ◇
      價格（大洋）: '1'
      重量（kg）: '0.5'
      效果: 照亮 20 尺，可燃 2hr
    - 裝備: 繩索（50 尺）
      稀有度: ◇
      價格（大洋）: '2'
      重量（kg）: '5'
      效果: 攀爬 DC −2、捆綁、標記路線
    - 裝備: 洛陽鏟
      稀有度: ◇
      價格（大洋）: '4'
      重量（kg）: '4'
      效果: 探土堪輿 +1
    - 裝備: 水壺（滿）
      稀有度: ◇
      價格（大洋）: '0.3'
      重量（kg）: '3'
      效果: 飲用水
    - 裝備: 乾糧（3 日份）
      稀有度: ◇
      價格（大洋）: '0.5'
      重量（kg）: '2'
      效果: 基本食物
    - 裝備: 急救包
      稀有度: ◇
      價格（大洋）: '3'
      重量（kg）: '1'
      效果: 恢復 1d6 HP（每次冒險限一次）
    - 裝備: 鐵撬棍
      稀有度: ◇
      價格（大洋）: '1'
      重量（kg）: '5'
      效果: 撬物力量 +2。臨時武器 1d6
    - 裝備: 背包（空）
      稀有度: ◇
      價格（大洋）: '1'
      重量（kg）: '2'
      效果: 容量 30kg
  - type: paragraph
    content: '---'
- name: 七、傳說級物品（GM 專用）
  subsections: []
  blocks:
  - type: table
    headers:
    - 物品
    - 效果
    - 取得方式
    rows:
    - 物品: '**天師印** ★'
      效果: 蓋在符上效果 ×3。每日一次。所有符咒真氣消耗 −1
      取得方式: GM 裁定的特殊劇情獎勵
    - 物品: '**斬龍劍** ★'
      效果: 對殭屍 3d8。無視不化骨傷害免疫。擊殺後下次攻擊 +1d8
      取得方式: 僅在不化骨級別的古墓中發現
    - 物品: '**不死藥（半成品）** ★'
      效果: 立即恢復全部 HP 與真氣。d6：1–3 永久詛咒（QP −5），4–6 無副作用
      取得方式: 帝陵深處或上古術士實驗室
  - type: paragraph
    content: '---'
  - type: paragraph
    content: '> **地師 TRPG 物品圖鑑 v1.0** | 跑團規則工作室'

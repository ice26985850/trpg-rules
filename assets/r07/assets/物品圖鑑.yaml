title: 地師 TRPG —— 物品圖鑑
sections:
- name: 一、稀有度系統
  subsections: []
  blocks:
  - type: table
    headers:
    - 稀有度
    - 標記
    - 取得方式
    rows:
    - 稀有度: 普通
      標記: ◇ 白
      取得方式: 商店購買
    - 稀有度: 精製
      標記: ◆ 綠
      取得方式: 特定店鋪、較大城鎮
    - 稀有度: 稀有
      標記: ◈ 藍
      取得方式: 古物商、墓中發現
    - 稀有度: 非常稀有
      標記: ✦ 紫
      取得方式: 深層古墓、傳承之物
    - 稀有度: 傳說
      標記: ★ 金
      取得方式: 獨一無二，GM 裁定
  - type: paragraph
    content: '---'
- name: 二、防具
  subsections: []

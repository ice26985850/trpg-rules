# Item Codex (Legendary & Special Items)

# Collects data on Legendary-tier items and special items in Hunter × Hunter TRPG.
# This is the structured counterpart of 物品圖鑑.md; for detailed rules and balance notes see the .md.

legendary_items:
  - roll: 1
    name: "Anti-Nen Crystal"
    type: "Consumable"
    rules: "Inlaid on a weapon or Nen ability. Once activated, lasts **1 combat**, during which all attacks ignore the target's **5 points of Nen Defense**. The crystal shatters after use. **Activation: minor action.**"
    balance: "A 1-combat penetration boost. Against high-Nen-Defense targets (Nen Defense 6+), equals +5 to hit. Disposable."
  - roll: 2
    name: "Memory Storage"
    type: "Narrative Item"
    rules: "First Civilization device. Can store a personal-experience memory of up to **10 minutes** (visual+sound+touch). Afterwards anyone who touches the device can experience that memory. **Can only store one memory; old memory vanishes when written.**"
    balance: "Pure narrative item. The GM can use it for plot foreshadowing (e.g., storing a deceased NPC's last words). No combat stat impact."
  - roll: 3
    name: "Eternal Crystal"
    type: "Material"
    rules: "Legendary Nen-equipment material (originally seen in Scenario 5 Dark Continent Crystallized Wasteland). Nen equipment forged with this material gains the \"indestructible\" property (immune to rust, breakage, dissolution, but can still be dispelled by \"Nen Removal\"). Forging requires 1 week + Nen Ability check DC 20. **1 crystal is enough to forge only 1 weapon or 1 piece of armor.**"
    balance: "Durability QoL improvement, no direct stat bonus. Prevents the GM from destroying player equipment—but Nen equipment can still be dispelled by a \"Nen Remover\"."
  - roll: 4
    name: "Fragment of the Gate"
    type: "Equipment"
    rules: "Crystal fragment that fell when the Gate collapsed (fist-sized). The holder may use a \"short-range spatial leap\" once per month: **instantly move to any position within 30m in line of sight, as a reaction.** After use, the fragment cools down for **30 days** (in-game time). Cannot carry others."
    balance: "One emergency dodge / tactical reposition per month. The 30m limit prevents abuse (can't skip an entire dungeon). A reaction means it can teleport before an enemy attack."
  - roll: 5
    name: "Ancient Star Chart"
    type: "Narrative Item"
    rules: "Dark Continent map marked in the First Civilization's astral language. Marks coordinates of **3 regions never before set foot on by humans**. Decryption requires Intelligence (Nen Knowledge) DC 22. For each region the GM may design it themselves or select from the \"original expansion\" regions."
    balance: "Pure narrative + plot-guiding item. Gives the GM an excuse to introduce new content. No combat stat impact."
  - roll: 6
    name: "Ou's Scale (Replica)"
    type: "Consumable"
    rules: "Replica of the Gatekeeper Ou's scale—not the original (lacks the Gate's will), but still retains partial power. **One-time use**: when making any check in the Dark Continent, may consume the scale to gain **one automatic success**. Only usable within the Dark Continent."
    balance: "One-time \"get-out-of-jail-free card\"—not invincible, just ensures one critical check won't fail. Fundamentally different from the original Gatekeeper scale (which the Gate recognizes)."
  - roll: 7
    name: "Emotion Crystal"
    type: "Material"
    rules: "Product of Scenario 5 Tear Sea. Can be used to craft mental-type Nen equipment (forging requires 1 week + Nen Ability check DC 22). Nen equipment effect: grants a Nen ability an \"emotion sense\" added effect—**when using that Nen ability, can perceive the target's current dominant emotion** (no extra SP needed, no Binding Pledge points (BP) consumed)."
    balance: "Information-advantage item. Especially useful in social encounters (knowing an NPC's true emotions), but cannot read specific thoughts. In combat can be used to judge whether an opponent is Frightened/Angry."
  - roll: 8
    name: "Reverse Crystal Flower"
    type: "Consumable"
    rules: "Rare plant from Scenario 5 Crystallized Wasteland (can be preserved, activated on use). Effect: ① Fully cures crystallization (any stage) ② Provides **12 hours** of crystallization immunity ③ When used on already-crystallized creatures, reverses crystallization (requires 1 hour). **1 flower is for 1 person only.**"
    balance: "Targeted healing item. Nearly useless outside Dark Continent scenes—but if the PC re-enters the Crystallized Wasteland, it is priceless."
  - roll: 9
    name: "Brion Control Core"
    type: "Equipment"
    rules: "Control core of Scenario 6's Brion command mech (reprogrammed to be friendly). Summons **1 Brion scout mech**: **HP 30, AC 16, move 20m (flight), cannot attack**. Can share vision (range 100m). Maintains SP cost **2 / round**. After the mech is destroyed, requires **24 hours** to auto-repair."
    balance: "A CR 4 scout unit, pure exploration support—cannot fight. The 2 SP/round maintenance cost ensures it can't be permanently stationed."
  - roll: 10
    name: "Ai Crystal"
    type: "Equipment"
    rules: "Obtained after accepting Ai's gift in Scenario 6. **Permanently immune** to the following: Frightened, Confused, Charmed, mind control, mental attacks. **Not** a random drop—**must establish friendly relations with Ai** to obtain. Occupies 1 accessory slot."
    balance: "The only permanently-immune item, but acquisition conditions are harsh (must converse with Ai and refuse assimilation, or accept Ai's gift). No protection against physical/Nen attacks—only immune to mental abnormalities."
  - roll: 11
    name: "First Civilization Knowledge Fragment"
    type: "Consumable"
    rules: "Compressed knowledge stored by the First Civilization. After use (requires 8 hours of meditation) permanently gains **Expert proficiency (+4) in 1 designated skill**. That skill must be one the user has already reached \"Proficient (+2)\". **Cannot stack onto a skill already at Master (+6).** Meaning: saves 8 XP (the Proficient→Expert XP cost), not a free +4 out of nowhere."
    balance: "Essentially saves 8 XP. Does not break attribute caps (does not affect attribute values / Binding Pledge points (BP) / Spirit Points (SP) / Hit Points (HP)), only accelerates skill growth. Legendary PCs may gain 1-2, not recommended beyond 2 to avoid skill-pool flooding."
  - roll: 12
    name: "Judge's Afterimage"
    type: "Consumable"
    rules: "One-time summon of the Judge's phantom to assist in combat. **Activation: standard action. Effect: the Judge phantom unleashes one \"Arbitration of Light\" on a target designated by the PC—auto-hits, deals 4d10 energy damage (ignores physical armor and Nen Defense). After use the afterimage dissipates.**"
    balance: "One-time nuke-level output. 4d10 = avg 22 damage, ignores all defense. Enough to heavily wound but not necessarily instakill a Legendary enemy (Helbel HP 500). Permanently gone after use—the player must decide when to spend this one trump card."

special_items:
  - name: "Ancient God's Scale"
    source: "Commission #8 Friendly Ending (d3-1)"
    type: "Equipment (Accessory Slot)"
    rules: "Inlaid on the body (replaces 1 accessory slot). When HP reaches zero, automatically triggers—the scale shatters, and HP recovers to 50% of maximum. Must trigger within 1 round after HP reaches zero. One-time."
    limit: "One-time get-out-of-jail-free card, gone once used."
  - name: "Core Fragment of the Dark Continent"
    source: "Commission #8 Friendly Ending (d3-2)"
    type: "Narrative Item"
    rules: "Fist-sized black crystal, always slightly warm. The holder has permanent advantage on survival checks across the entire Dark Continent; can perceive the direction and distance of the nearest \"Gate\"; once per month consumes 20 SP to create a 10m-radius safe zone (no random encounters triggered within 8 hours)."
    limit: "Pure exploration QoL, no combat stat impact."
  - name: "Whisper of the Sleeper"
    source: "Commission #8 Friendly Ending (d3-3)"
    type: "Knowledge (non-item)"
    rules: "The Ancient God engraves knowledge into memory; permanently gain one: ① Understand the meaning of all languages ② Perceive the approximate location of Nen ability users within 1km ③ Gain the final memory before the First Civilization's destruction (containing a GM-customized major secret)."
    limit: "Information-type ability, profoundly changes the narrative."
  - name: "Ultimate Legacy (First Judge Memory Crystal)"
    source: "Commission #2"
    type: "Narrative Item"
    rules: "Experience the complete life of the First Civilization's founder (8 hours in-game). Permanently gain: Intelligence +1 (cap 22), advantage on Persuasion checks when facing the Five Calamities, knowledge of the Ancient God's True Name (+5 on Ancient God-related checks), unlock hidden info. Mental cost: after the experience requires Willpower DC 22 or gains 48 hours of \"sense of existential void\"."
    limit: "One-time vision experience, effects permanent."
  - name: "Anti-Nen Resonance Device"
    source: "Commission #7 (V5 Secret)"
    type: "Device (Scene-level)"
    rules: "Global-range reverse resonance wave. After activation, all Nen users within range must make a Willpower saving throw DC 30: success → Nen ability sealed for 24 hours; failure → permanently lose Nen ability (SP reduced to zero). Activation requires 72 hours charging. Weakness: must be placed at a specific equatorial island, releases a massive Nen field (perceptible within 100km), can be physically destroyed (HP 500, AC 18, no Nen Defense), frequency can be reverse-engineered into a selective weapon."
    limit: "The player may choose: destroy / control / persuade V5 / reveal truth, with varying consequences."
  - name: "First Civilization Time Calibration Device"
    source: "Commission #9"
    type: "Device (takeable)"
    rules: "10cm disc, powered by Eternal Crystal. Effect 1 Time Buffer: once per day as a reaction, next round can split a standard action or double move speed. Effect 2 Time Mark: once per week leaves a mark, within 1 hour can consume a standard action to return. Effect 3 Time Echo (one-time): return to the state of 1 round ago (HP / SP / position all restored), memory retained."
    limit: "After Effect 3 the device is permanently scrapped; a Legendary character may use Time Echo only once in a lifetime."
  - name: "Helbel Queen Core Crystal"
    source: "Commission #4"
    type: "Legendary Material"
    rules: "30cm diameter, weighs 40kg (Constitution 14+ to carry alone). 1 crystal can forge 1 Legendary weapon + 1 armor (or 2 weapons). Each requires 2 weeks + Nen Ability check DC 24 (can delegate to a smith for 50,000J). Forgeable: Devourer's Blade (2d8+CON, permanently +1 damage per strong enemy defeated, cap +5), Queen Scale Armor (AC +3, Nen Defense +2, auto-recover 2d10 when HP below 25%), Twin-Tail Ring (accessory, switch Material/Nen mode each round, corresponding attack +1d6)."
    limit: "Material type, must be forged before use."
  - name: "Void Ring"
    source: "Side Commission #19 Underground Maze"
    type: "Rare-tier (non-Legendary) Accessory"
    rules: "Once per day consumes a minor action for a 5m instant teleport (requires a visible unoccupied space). After use, Willpower DC 18, failure grants 1 level of Fatigue (stackable)."
    limit: "Cannot carry others, cannot pass through obstacles, destination must be a safe landing point."
  - name: "Iron-Scale Shark Harpoon Cannon"
    source: "Side Commission #11 Optional Loot"
    type: "Heavy Ranged Weapon (Constitution 12+)"
    rules: "Damage 2d10 piercing, range 30m, requires a standard action to reload. ×1.5 damage against aquatic creatures. Weight 20kg, when not in combat requires two people to carry or a vehicle."
    limit: "Heavy weapon, poor mobility."

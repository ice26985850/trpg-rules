- key: hunter_exam
  name: Hunter Exam Venue
  type: Trial Complex
  region: Surface World · Near Saba City
  summary: Route of the 288th Hunter Exam — from assembly at Saba City, through Deadly Swamp, Mirror Maze, and Combat Elimination, to the final interview hosted by Cheadle. Five stages filter candidates layer by layer; survival rate is under one percent.
  areas:
  - name: Saba City Central Plaza
    desc: First stage — find all 5 hidden registration points within 2 hours (clock tower / sewer / café / warehouse / fountain).
    hazard: Candidates deceive each other (Tonpa provides false intel).
  - name: Deadly Swamp
    desc: Second stage — cross corrosive mud; water level rises 1m every 6 hours.
    hazard: Crocodile beast CR1/4, poison frog swarm, man-eating vines; mud deals 1d4 acid damage per round.
  - name: Mirror Maze
    desc: Third stage — 7 mirror rooms (A-G), must cooperate with teammates to clear.
    hazard: Mirror doppelgänger fight (CR = self), must persuade or surpass yourself.
  - name: Combat Elimination Arena
    desc: Fourth stage — 1v1 elimination, 4 escalating rounds (CR 1/2 → 2).
    encounter: "'Shadow Step' Alvin (CR1-2), 'Oath Fist' Carlo (CR2)."
  - name: Final Interview Hall
    desc: Fifth stage — answer 'truly difficult questions' before Cheadle's long table.
    loot: Hunter License, 3,000J, same-term Hunter network.
  connections:
  - - Saba City Central Plaza
    - Deadly Swamp
  - - Deadly Swamp
    - Mirror Maze
  - - Mirror Maze
    - Combat Elimination Arena
  - - Combat Elimination Arena
    - Final Interview Hall
  svg: hunter_exam.svg
- key: heavens_arena
  name: Heavens Arena
  type: Fighting Tower
  region: Surface World
  summary: A towering fighting tower with 200+ floors total. Five tiers by floor; the higher, the greater the prize and opponents, with Nen restrictions gradually lifted. The top floor hosts first-rate masters' duels.
  areas:
  - name: 10-50 Floors
    desc: CR 1/4~1/2, prize 500-2,000J, Nen abilities forbidden.
    encounter: Rookie fighters.
  - name: 50-100 Floors
    desc: CR 1~2, prize 3,000-10,000J, Nen abilities forbidden.
    encounter: Mid-tier fighters.
  - name: 100-150 Floors
    desc: CR 3~5, prize 15,000-50,000J, Nen usable.
    encounter: Nen users.
  - name: 150-200 Floors
    desc: CR 6~8, prize 60,000-200,000J, Nen required.
    encounter: Floor Master candidates.
  - name: 200+ Floors
    desc: CR 9+, prize 250,000J+, first-rate masters' duels.
    encounter: Floor Masters (Heavens Arena top floor).
  connections:
  - - 10-50 Floors
    - 50-100 Floors
  - - 50-100 Floors
    - 100-150 Floors
  - - 100-150 Floors
    - 150-200 Floors
  - - 150-200 Floors
    - 200+ Floors
  svg: heavens_arena.svg
- key: yorknew
  name: Yorknew City
  type: City · Auction Venue
  region: Surface World
  summary: A city active with underground trade and the Mafia. The annual auction is the core event; the venue is divided into five zones, and the Troupe's attack triggers a five-way faction brawl.
  areas:
  - name: Yorknew City District
    desc: City outskirts for intel gathering and commission negotiation.
    hazard: Mafia checks, pickpockets.
  - name: Auction Main Hall
    desc: Spacious, many cover points; the Troupe's primary assault zone.
    encounter: Troupe combatant A (CR6).
  - name: VIP Booth
    desc: Narrow single exit; Mafia escorts VIP evacuation.
    loot: High-value auction items.
  - name: Backstage Corridor
    desc: Long and winding with many corners; guards and Troupe in combat.
    hazard: Sniping, traps.
  - name: Vault
    desc: Heavy iron door (break DC25), where Heart of Darkness is stored.
    loot: Heart of Darkness (legendary).
  - name: Underground Parking
    desc: Open, vehicles as cover; retreat routes of all sides converge.
    encounter: Troupe support (CR4).
  connections:
  - - Yorknew City District
    - Auction Main Hall
  - - Auction Main Hall
    - VIP Booth
  - - Auction Main Hall
    - Backstage Corridor
  - - Auction Main Hall

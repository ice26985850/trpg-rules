- key: kakin_fleet
  name: Kakin Kingdom & Voyage Fleet
  type: Kingdom · Expedition Fleet
  region: Surface → Deep Layer
  summary: The Kakin Kingdom, having left the V5, devotes the whole nation to drive the Dark Continent voyage. The throne succession (multiple princes) and fleet formation are the core conflicts; the flagship leads destroyers in escort.
  areas:
  - name: Kakin Palace
    desc: Center of power of the king and princes.
    encounter: Assassination and alliance among princes.
  - name: Prince's Palace
    desc: Each prince has their own palace and guardians.
    hazard: Throne succession war.
  - name: Port
    desc: Fleet assembly and supply point.
    loot: Voyage supplies, Nen equipment.
  - name: Voyage Flagship
    desc: Main expedition vessel, carrying V5 special forces.
    encounter: V5 flagship (CR16-class warship).
  - name: Destroyer Escort Group
    desc: Escort fleet accompanying the flagship.
    encounter: V5 destroyer (CR10).
  - name: Heading to Dark Continent
    desc: The fleet's target coordinates, unknown waters.
    hazard: Five Calamities precursors.
  connections:

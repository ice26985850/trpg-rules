# Hunter × Hunter TRPG — World Map Overview (structured map data)
# Each location contains its area, connection relationships, and the corresponding SVG schematic.

rule: Hunter × Hunter TRPG
maps:
- key: world_overview
  name: World Map Overview
  type: World Structure
  region: Overall
  summary: The relative positions of the Surface World (human civilization sphere) and the Deep Layer — Dark Continent. The Surface is governed by the V5/V6 international system, while the Dark Continent is sealed by the Silence Treaty, accessible only through 'The Gate'. Greed Island is an independent game space.
  areas:
  - name: Saba City
    desc: Hunter Exam assembly point, a modern city.
  - name: Heavens Arena
    desc: A fighting tower over 200+ floors tall.
  - name: Yorknew City
    desc: A city active with underground auctions and the Mafia.
  - name: Kukuroo Mountain
    desc: Mansion (assassin) of the Zoldyck Family.
  - name: Meteor City
    desc: An unrecognized waste disposal site.
  - name: Kakin Kingdom
    desc: A rising power that left the V5, driving the voyage.
  - name: Hunter Association HQ
    desc: The hub of the Hunter Association, issuing Hunter Licenses.
  - name: The Gate (Dark Continent Entrance)
    desc: The only passage to the Dark Continent.
  - name: Crystallized Wasteland
    desc: An endless crystalline plain beyond the Gate, causes crystallization.
  - name: Tear Sea
    desc: A sea where inner emotions are made physical.
  - name: Five Calamities
    desc: The ultimate threat creatures of the Dark Continent.
  - name: Greed Island
    desc: A physical game space built by Nen abilities.

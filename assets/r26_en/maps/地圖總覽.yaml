- key: chimera_ant
  name: Chimera Ant Territory
  type: Ecosystem Nest
  region: Surface World · Near NGL
  summary: The hierarchical nest society the Chimera Ants built in NGL (Neo-Green Life Sphere). The Queen lays eggs, Squadron Leaders command the soldiers, evolving rapidly by using humans as nutrients.
  areas:
  - name: Nest Core (Queen)
    desc: Where the Queen lays eggs, most heavily defended.
    encounter: Chimera Ant King (if born, CR11+).
  - name: Squadron Leader District
    desc: Station of elite commanders directly under the Queen.
    encounter: Squadron Leader (CR 6-10, intelligent with Nen).
  - name: Soldier Perimeter
    desc: Edges of human settlements for patrol and hunting.
    encounter: Soldiers (CR 1-5).
  - name: Human Settlement (Prey)
    desc: Villages being preyed upon, resistance organization active.
    hazard: Regularly hunted.
  connections:
  - - Nest Core (Queen)
    - Squadron Leader District
  - - Squadron Leader District
    - Soldier Perimeter
  - - Soldier Perimeter
    - Human Settlement (Prey)
  svg: chimera_ant.svg
- key: dark_continent
  name: Dark Continent
  type: Unknown Continent
  region: Deep Layer
  summary: A hyper-ancient continent beyond human cognition, full of unknown ecology and the Five Calamities. Must enter through 'The Gate'; internal regions have anomalous rules such as crystallization and emotion-made-physical.
  areas:
  - name: Lake Mobius
    desc: Voyage starting point; anomalies lurk beneath the calm surface.
    hazard: Spatial distortion, loss of direction.
  - name: The Gate
    desc: Entry trial; only those who pass may enter beyond the Gate.
    encounter: Gatekeeper's trial.
  - name: Crystallized Wasteland · Hill of Memory Crystals
    desc: Silver crystal mountain sealing memories.
    loot: Memory crystal shards; guardian beast CR10.
  - name: Crystallized Wasteland · Ancient Civilization Ruins
    desc: Pyramid of unknown style, eternal blue light at the top.
    loot: Eternal crystal; autonomous guards ×4, central core CR11.
  - name: Crystallized Wasteland · Spring of Reverse Crystallization
    desc: Un-crystallized liquid pool, heals crystallization.
    loot: Reverse crystal flower; guardian crystal dragon CR13.
  - name: Tear Sea
    desc: A sea reflecting the inner self, emotions made physical.
    encounter: Ancient Tear Sea guardian CR12; Emotion Library.
  - name: Five Calamities
    desc: Pap (Plant Weapon) / Zobae (Immortality Disease) / Brion (Weapon) / Hellbell (Twin-Tail Serpent) / Ai (Gas Lifeform).
    encounter: Calamity-class existence, extremely high CR.
  connections:

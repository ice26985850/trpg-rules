- key: greed_island
  name: Greed Island
  type: Nen Ability Game Space
  region: Independent Space
  summary: A physical game jointly built by Nen users; only those who win the 'one in ten thousand' qualification may enter. The goal is to collect 100 specified cards and trigger departure conditions.
  areas:
  - name: Dolre Town (Starting)
    desc: Starting town where players log in and rest.
    loot: Basic equipment, mission commissions.
  - name: Southern Territory (25%)
    desc: High-difficulty combat and rare-card drop zone.
    encounter: Game guardian, BIG and other strong foes.
  - name: Specified Card Collection
    desc: 100 specified cards scattered across the island.
    loot: Specified cards (incl. legendary 'One-Turn Kill').
  - name: Crafting / Training Hall
    desc: Card synthesis and ability training facility.
    loot: Self-made cards, Nen ability refinement.
  - name: Departure Conditions
    desc: Departure mechanism triggered after collecting specified cards.
    encounter: Final challenge (GM's discretion).
  connections:

- key: first_civilization
  name: First Civilization Ruins
  type: Hyper-Ancient Ruins
  region: Deep Layer · Dark Continent
  summary: Hyper-ancient civilization ruins 30,000 years older than humanity, hiding all-knowledge crystals and autonomous guards. Connected to the Crystallized Wasteland and the Emotion Library of the Tear Sea; the truth of 'why the Gate is here'.
  areas:
  - name: Ruins Entrance
    desc: Collapsed outer edge of the institute, mechanisms everywhere.
    hazard: Ancient traps (high investigation DC).
  - name: Audrich Institute
    desc: Last stronghold of the fallen researchers.
    encounter: Audrich (fallen researcher, CR at GM's discretion).
  - name: Glass-Tank Specimens
    desc: Experimental life sealed in liquid.
    loot: Unknown creature samples, forbidden knowledge.
  - name: Pyramid Core
    desc: Central energy tower of the ruins, eternal blue light.
    encounter: Autonomous guards ×4, central core CR11.
  - name: Emotion Library
    desc: A building preserving emotion records deep in the Tear Sea.
    loot: Emotion crystals ×3, ancient star chart.
  connections:

  - - Vault
    - Underground Parking
  svg: yorknew.svg
- key: kukuroo_meteor
  name: Kukuroo Mountain & Meteor City
  type: Assassin Mansion · Junkyard
  region: Surface World
  summary: The mansion of the Zoldyck Family (professional assassins) sits on Kukuroo Mountain with extremely strict access; at its foot connects Meteor City, abandoned by the world, where resource recycling and the black market operate.
  areas:
  - name: Assassin's Gate
    desc: Entrance to Kukuroo Mountain; the testing gate weighs several tons.
    hazard: If forced, the gate crushes intruders.
  - name: Testing Gate
    desc: Mechanism gate the family uses to screen visitors.
    encounter: Butler (e.g., Kikyo) tests the visitor.
  - name: Zoldyck Mansion
    desc: Family main house and training facilities.
    loot: Family missions, Nen ability inheritance.
  - name: Meteor City Outer Ring
    desc: Periphery of the waste accumulation site.
    hazard: Gang strongholds, toxic gas.
  - name: Meteor City Black Market
    desc: Underground auctions and modified-weapon trade.
    loot: Rare materials, modified Nen equipment.
  - name: Gang Territory
    desc: A faction-fragmented zone within the city.
    encounter: Meteor City-born warriors (e.g., related to Kurapika's hometown).
  connections:

name: "S6 喘息"
description: "Level 11——無垠城市。後室中唯一像文明的地方。在這裡交易、休息、建立關係。但城市中有竊皮者——牠們可以是任何人。包括你信任的人。"
difficulty: "中級（社交/調查）"
milestone_range: "6-7"
play_time: "7-10 小時"
supported_modes: ["單人（1 玩家＋1 GM）", "多人（2-5 玩家＋1 GM）"]
primary_levels: ["Level 11 — 無垠城市"]
themes: ["文明假象", "信任與背叛", "情報收集"]
emotional_arc: "安心（抵達城市）→融入（交易社交）→懷疑（竊皮者滲透）→揭露（真相）→決心（繼續前進）"
scenes:
  - {id: S6_1, name: "城市入口", type: "探索", desc: "Level 11街道。BNTG交易員招呼你。M.E.G.城市前哨站的招募海報。找到住處。認識城市的規則——30天重置、空白建築、假天空。"}
  - {id: S6_2, name: "市場與交易", type: "社交", desc: "BNTG交易中心。升級裝備、交易情報。認識關鍵NPC：地圖師米拉、醫生吳、老趙（終於見到他本人）。收集關於更深層的情報——Level !的傳說。"}
  - {id: S6_3, name: "滲透者", type: "調查", desc: "城市中開始發生怪事——流浪者失蹤、被取代。一個你認識的NPC行為開始不對。調查揭露：竊皮者已經滲透進社區。找出牠——在牠取代下一個人之前。"}
  - {id: S6_4, name: "決定", type: "轉折", desc: "收集到足夠情報：通往Level !的入口在某棟建築的地下室。Level !是必經之路——傳說中只有跑完整條醫院走廊才能到達更深層。準備最後的補給。"}
entities: ["竊皮者（城市中的隱形威脅）", "偶發的笑魘（地下停車場）"]
key_npc: ["老趙（終於見面）", "地圖師米拉", "醫生吳", "BNTG交易員"]
ending: "找到Level !入口。里程碑7達成。"

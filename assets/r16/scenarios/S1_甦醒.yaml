name: "S1 甦醒"
description: "你睜開眼睛。黃色壁紙。螢光燈嗡嗡作響。你是誰？你在哪裡？唯一的線索是前人留下的粉筆箭頭——和黑暗中傳來的爪子聲。"
difficulty: "新手入門"
milestone_range: "1"
play_time: "4-6 小時"
supported_modes: ["單人（1 玩家＋1 GM）", "多人（2-5 玩家＋1 GM）"]
primary_levels: ["Level 0 — 教學關卡"]
themes: ["迷失", "孤獨", "第一次生存考驗"]
emotional_arc: "困惑→恐懼→小小勝利（杏仁水）→第一次威脅→找到出口"
scenes:
  - {id: S1_1, name: "睜眼", type: "開場", desc: "角色在Level 0黃色辦公隔間醒來，最後記憶是日常平凡瞬間。初始禮物機制：5隔間內必有一瓶杏仁水。"}
  - {id: S1_2, name: "前人印記", type: "探索", desc: "跟隨粉筆箭頭和壁紙標記穿越隔間迷宮。發現開機電腦上老趙的留言。理解「光=安全」的基礎規則。"}
  - {id: S1_3, name: "黑暗蔓延", type: "危機", desc: "螢光燈一排排熄滅——黑暗朝你襲來。爪子在混凝土地面刮擦。選擇：躲、等、或跑。"}
  - {id: S1_4, name: "門", type: "高潮", desc: "無標記防火門——通往Level 1。門前最後一瓶杏仁水。門後傳來人聲。推開它。"}
entities: ["獵犬（黑暗中初遇）"]
key_npc: "老趙（透過留言）"
ending: "推開門進入Level 1。M.E.G.新人禮包。里程碑1完成。"

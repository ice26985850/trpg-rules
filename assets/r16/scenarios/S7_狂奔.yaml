name: "S7 狂奔"
description: "Level ! ——不想死就快跑！十公里的醫院風格長廊。紅色警報燈。刺耳警笛。身後是成群的實體。沒有選擇——只能跑。跑完十公里。這不是戰鬥。這是純粹的生存本能。"
difficulty: "高級"
milestone_range: "7-8"
play_time: "4-6 小時（單次聚會，極高強度）"
supported_modes: ["單人（1 玩家＋1 GM）", "多人（2-5 玩家＋1 GM）"]
primary_levels: ["Level ! — 不想死就快跑"]
themes: ["純粹生存", "極限體能", "生死一線"]
emotional_arc: "震驚→腎上腺素→痛苦→瀕臨極限→勝利"
scenes:
  - {id: S7_1, name: "警笛", type: "開場衝擊", desc: "踏入Level !的瞬間——紅色警報燈亮起，刺耳警笛響徹整條走廊。身後黑暗中傳來無數實體的腳步聲。前方：一條看不到盡頭的醫院走廊。開始跑。現在。"}
  - {id: S7_2, name: "十公里", type: "體能挑戰", desc: "走廊長度正好十公里。不是比喻。沿路有障礙物（翻倒的病床、坍塌的天花板）。每隔一公里有一個補給點（能量棒、杏仁水）。每公里進行一次體魄或機敏檢定。失敗累積疲勞。"}
  - {id: S7_3, name: "崩潰邊緣", type: "高潮", desc: "第7-9公里：角色已達極限。雙腿在燃燒。肺部在灼燒。身後實體越來越近。意志檢定DC18——失敗則速度減慢，被追上。成功則咬牙繼續。"}
  - {id: S7_4, name: "終點", type: "勝利", desc: "第10公里——一道寫著EXIT的門。推開它。門後是安靜的白色空間。一扇門通往結局。實體無法進入這裡。你做到了。但你的身體永遠記得這十公里。"}
entities: ["獵犬群", "竊皮者", "笑魘——Level !中所有常見實體的混合追擊"]
special_rules: "每個玩家只能進入Level !一次。通過後永遠不會再次進入。如果失敗（被追上）——角色死亡。這是整個戰役中唯一的強制死亡風險關卡。"
ending: "推開EXIT門。里程碑8達成。通往結局層。"

name: "S5 跋涉"
description: "穿越三個截然不同的樓層：Level 8的螢光岩洞與真菌森林、Level 9永夜雨中的無盡郊區、Level 10一望無際的金色麥田。這是一場漫長的遷徙。"
difficulty: "中高級"
milestone_range: "5-6"
play_time: "8-12 小時"
supported_modes: ["單人（1 玩家＋1 GM）", "多人（2-5 玩家＋1 GM）"]
primary_levels: ["Level 8 — 岩洞系統", "Level 9 — 郊區", "Level 10 — 麥田"]
themes: ["長途遷徙", "自然恐怖", "虛假田園"]
emotional_arc: "壓迫（洞穴）→不安（郊區）→短暫平靜（麥田）→警惕（虛假安全）"
scenes:
  - {id: S5_1, name: "螢光洞穴", type: "探索", desc: "Level 8：潮濕岩洞+生物螢光真菌。洞穴頂部的「星星」是發光孢子。實體「穴居者」在暗處潛伏——牠們對光敏感但數量眾多。收集可食用的發光蘑菇。"}
  - {id: S5_2, name: "永夜郊區", type: "氛圍恐怖", desc: "Level 9：永不停歇的夜雨。無盡的郊區街道，路燈時明時暗。每棟房子都長得一模一樣。某些房子裡有燈光——但那不是人類。窗戶後面的影子不對。不要進入任何房子。"}
  - {id: S5_3, name: "金色麥田", type: "喘息/陷阱", desc: "Level 10：溫暖陽光下無邊無際的金色麥田。太美了。太舒服了。但麥田深處站著稻草人——它們在你沒看的時候移動。麥田的路徑會改變。看似安全，實則迷宮。"}
  - {id: S5_4, name: "邊界", type: "出口", desc: "麥田邊緣——一條柏油路。沿著路走，建築物開始出現在地平線上。Level 11到了。"}
entities: ["穴居者（Level 8——怕光，成群行動）", "窗後之物（Level 9——不會離開房子但會引誘你進入）", "稻草人（Level 10——會移動的田間守衛）"]
ending: "抵達Level 11城市邊緣。里程碑6達成。"

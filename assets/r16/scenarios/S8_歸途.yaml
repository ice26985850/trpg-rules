name: "S8 歸途"
description: "EXIT門後的白色空間。兩扇門。一扇寫著「前室」——回家。一扇寫著「後室」——留下。沒有守門者、沒有謎題、沒有條件。只有你，和你的選擇。"
difficulty: "終局（無戰鬥）"
milestone_range: "8（傳奇）"
play_time: "2-3 小時（敘事終章）"
supported_modes: ["單人（1 玩家＋1 GM）", "多人（2-5 玩家＋1 GM）"]
primary_levels: ["結局層 — 白色空間"]
themes: ["終點", "選擇", "身份"]
emotional_arc: "喘息→回顧→選擇→結局"
scenes:
  - {id: S8_1, name: "白色空間", type: "喘息", desc: "一個純白的房間。沒有牆壁、沒有天花板、沒有地板——只有白色。兩扇門在你面前。你坐下來，回顧一路走來的旅程。"}
  - {id: S8_2, name: "回顧", type: "敘事", desc: "GM引導角色回顧整個戰役的重要時刻：第一次找到杏仁水。第一次逃離獵犬。在管道中幾乎絕望。認識的朋友。失去的人。角色做出的每一個重要選擇。"}
  - {id: S8_3, name: "兩扇門", type: "終極選擇", desc: "左邊的門：溫暖的光從門縫滲出。你聽到現實世界的聲音——車流、鳥鳴、某個人的笑聲。右邊的門：冷色螢光燈的光。你聽到後室的聲音——螢光燈嗡鳴、遠處的腳步聲、但還有……其他流浪者的聲音。那些你幫助過的人。"}
  - {id: S8_4, name: "結局", type: "終章", desc: "你走向其中一扇門。沒有回頭。"}
choices:
  - {id: "home", name: "回到前室", desc: "推開左邊的門。你醒來在自己的床上。手機顯示日期——在你消失的那一天。只過了幾分鐘。但你口袋裡沒有杏仁水。因為杏仁水不能在現實中存在。你記得一切——但沒有人會相信你。你活下來了。你回家了。但後室的螢光燈嗡鳴聲，有時仍會在深夜中響起。"}
  - {id: "stay", name: "留在後室", desc: "推開右邊的門。你回到Level 11的M.E.G.前哨站。老趙看到你——他笑了。『回來了？』你點頭。這裡不是家——但這裡有需要你的人。你知道太多後室的秘密。你可以幫助下一個卡穿進來的普通人。就像當初有人幫助你一樣。"}
is_finale: true

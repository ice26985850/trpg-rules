name: "S3 旅館"
description: "Level 4的派對客陷阱只是開始。真正的恐怖在Level 5——一間永無止境的維多利亞式旅館，走廊鋪著血紅地毯，牆上掛著眼睛會動的畫像。"
difficulty: "中級"
milestone_range: "3-4"
play_time: "7-10 小時"
supported_modes: ["單人（1 玩家＋1 GM）", "多人（2-5 玩家＋1 GM）"]
primary_levels: ["Level 4 — 廢棄辦公室", "Level 5 — 恐怖旅館"]
themes: ["信任崩解", "永恆囚禁", "犧牲"]
emotional_arc: "誘惑（派對客）→揭露（真相）→逃亡→更深噩夢（旅館）→覺悟"
scenes:
  - {id: S3_1, name: "友善的陌生人", type: "社交陷阱", desc: "Level 4走廊中兩個笑容燦爛的「流浪者」邀請你參加F5派對。察覺異常DC14。派對客三階段陷阱。"}
  - {id: S3_2, name: "派對會場", type: "高潮", desc: "F5——15-30派對客的轉化儀式。揭露後的群體追擊。利用鏡子房間（F7）和無光房間逃脫。"}
  - {id: S3_3, name: "旅館大門", type: "過渡", desc: "逃離Level 4時誤入一部金色電梯——它只通往Level 5。電梯門打開：紅地毯、水晶吊燈、一個戴白手套的侍者微笑著說「歡迎回來，先生/女士」。它知道你的名字。"}
  - {id: S3_4, name: "無限走廊", type: "探索/恐怖", desc: "Level 5的走廊永無止境。每個房間門上刻著一個名字——都是曾經迷失在此的人。你找到了自己的房間。門上刻著你的名字。畫像眼睛會動。實體「僕從」在走廊巡邏。"}
  - {id: S3_5, name: "宴會廳", type: "終局", desc: "旅館最深處的宴會廳。長桌上坐滿了穿著華麗的「賓客」——他們的眼睛是空的。他們在等新成員加入。你要坐上那張空椅子嗎？找到後門逃出。"}
entities: ["派對客（Level 4）", "僕從（Level 5——穿西裝的無面侍者）", "畫像（Level 5——會動的畫中實體）"]
ending: "找到旅館後門逃出→Level 6入口。或選擇坐上宴會廳的空椅子（角色永久囚禁於Level 5）。"

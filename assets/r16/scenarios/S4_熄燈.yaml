name: "S4 熄燈"
description: "Level 6：完全的、絕對的黑暗。連手電筒的光都會被吞噬。Level 7：淹沒的科研基地，深水高壓，水下有東西在游。這是對精神和身體的雙重極限考驗。"
difficulty: "中高級"
milestone_range: "4-5"
play_time: "6-9 小時"
supported_modes: ["單人（1 玩家＋1 GM）", "多人（2-5 玩家＋1 GM）"]
primary_levels: ["Level 6 — 熄燈", "Level 7 — 深海恐懼症"]
themes: ["生存極限", "精神侵蝕", "未知深淵"]
emotional_arc: "壓迫（絕對黑暗）→崩潰邊緣→潛入（水下）→巨大存在→浮出"
scenes:
  - {id: S4_1, name: "絕對黑暗", type: "生存", desc: "Level 6：光源被吞噬——手電筒只能照亮腳下。黑暗本身有重量。SP每15分鐘-1。聽覺是唯一依靠。實體在暗處呼吸。"}
  - {id: S4_2, name: "聲音走廊", type: "導航", desc: "唯一的導航方式是沿著牆面走，聽水滴聲判斷方向。黑暗中偶有低語——是其他迷失者的聲音還是自己的幻覺？感知DC16分辨。"}
  - {id: S4_3, name: "淹沒", type: "過渡", desc: "Level 6最深處的地板突然消失——你落入冰冷的水中。Level 7：被海水淹沒的科研基地。走廊在水中扭曲。需要找到潛水裝備。"}
  - {id: S4_4, name: "深海", type: "恐怖", desc: "水下走廊的窗外——巨大的、無法辨認的黑影緩慢游過。牠比整棟建築還大。不要直視牠。找到通往Level 8的排水管道。"}
entities: ["暗影（Level 6——黑暗中的不定形實體）", "利維坦（Level 7——巨大水下生物，不可戰鬥）"]
ending: "穿過排水管道進入Level 8的岩洞。浮出水面。里程碑5達成。"

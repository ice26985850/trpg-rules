# 後室行者 TRPG —— 實體圖鑑（結構化資料）
# 實體不是怪物。牠們是環境的一部分。大多數不該戰鬥——你該跑、躲、或利用環境規則反制。
# 威脅等級：★=無直接威脅 ★★=輕微 ★★★=中等 ★★★★=高度 ★★★★★=極度

entities:
  - id: smiler
    name_zh: 笑魘
    name_en: Smiler
    threat: "★★★(黑暗) / ☆(光亮)"
    floors: [所有黑暗樓層]
    behavior: 黑暗中攻擊——浮現過大笑容，凝視後攻擊
    weakness: 光——任何有效光源立即驅散
    hp: 15
    def: 14
    atk_bonus: 5
    damage: "1D4 物理 + SP -1D4"
    key_mechanic: 光照系統——全亮(安全)/微光(虛體)/閃爍(50%實體)/黑暗(完全實體)
    expel: 全亮光源立即消失；杏仁水投擲驅逐 1D3+1 回合；火焰保持遠距

  - id: hound
    name_zh: 獵犬
    name_en: Hound
    threat: "★★★★"
    floors: ["Level 0(黑暗區)", "Level 2(主要棲息地)", "Level 1/4(邊緣)"]
    behavior: 成群狩獵——靠聽覺和熱感應定位獵物
    weakness: 轉彎笨拙——直線機敏8，轉彎降至4
    hp: 20
    def: 13
    atk_bonus: 6
    damage: "1D6+2 爪擊 或 1D8 撞擊(撞擊可能擊倒，體魄DC13)"
    group_size: "1-5"
    key_mechanic: 追逐距離系統 + 轉彎懲罰。利用轉角和狹窄空間擺脫
    expel: 杏仁水投擲退開中距1D3回合；巨大噪音驚嚇退開；火焰保持中距以上

  - id: partygoer
    name_zh: 派對客
    name_en: Partygoer
    threat: "★★★★★"
    floors: ["Level 4(F5以上為主要領地)"]
    behavior: 偽裝友善流浪者→邀請參加「派對」→引導至會場→轉化儀式
    weakness: 真誠負面情緒(困惑1分鐘)/無光無窗房間(不可進入)/鏡子(恐慌1D3回合)
    hp: 10
    def: 12
    atk_bonus: "3(單體) / 6(群體壓制)"
    damage: "1D4 × 群體參與數"
    group_size: "15-30"
    key_mechanic: 社交陷阱三階段：接近→邀請→陷阱閉合。轉化儀式理智DC18——失敗則開始轉化
    expel: 無法常規驅逐。利用弱點創造逃跑窗口

  - id: skin-stealer
    name_zh: 竊皮者
    name_en: Skin-Stealer
    threat: "★★★★"
    floors: ["Level 11(主要狩獵場)", "偶爾其他人口密集樓層"]
    behavior: 偽裝人類→潛伏學習→孤立目標→取代
    weakness: 生理細節異常(手指數量、關節方向)/杏仁水潑灑(短暫揭露)
    hp: 18
    def: 14
    atk_bonus: 5
    damage: "2D6 穿刺"
    group_size: 1
    key_mechanic: 察覺難度階梯——剛偽裝DC15→長期DC20。時間越長、偽裝越完美
    expel: 無法驅逐。被揭露後必須物理對抗或逃跑

  - id: duller
    name_zh: 鈍人
    name_en: Duller
    threat: "★★(不回頭) / ★★★★★(回頭看)"
    floors: [任何樓層(隨機)]
    behavior: 站在身後——不攻擊、不移動、不溝通。當你不注意時，牠就在那裡
    weakness: 極簡——不要回頭。永遠不要回頭
    hp: null
    def: null
    atk_bonus: null
    damage: null
    group_size: 1
    key_mechanic: 凝視規則——回頭看→SP永久-5(不可恢復)。意志DC20減半為-2
    expel: 無法驅逐。等待牠自己消失(1D6小時)

  - id: electrician
    name_zh: 電工
    name_en: Electrician
    threat: "★★★"
    floors: ["Level 3(發電站)"]
    behavior: 巡邏機房、維修設備；被驚擾或靠太近時釋放電擊
    weakness: 切斷主電源可暫停(1D6回合)；絕緣材料可防禦電擊
    hp: 16
    def: 13
    atk_bonus: 4
    damage: "2D6 電擊(並SP-1)"
    group_size: "1-2"
    key_mechanic: 裸露電線區域：機敏DC12通過否則1D6電擊。電工本體攻擊為電擊，可透過切斷電源癱瘓
    expel: 切斷主電源暫停；轉入非電力區域可脫離。不直接殺死——重啟發電機才是目標

  - id: shade
    name_zh: 暗影
    name_en: Shade
    threat: "★★★(接觸) / ☆(不接觸)"
    floors: ["Level 6(熄燈)"]
    behavior: 在黑暗邊緣移動——不直接攻擊，接觸使角色的影子消失
    weakness: 任何光源(應急燈)可驅散；移動緩慢
    hp: 12
    def: 12
    atk_bonus: 3
    damage: "影子消失——機敏/閃避相關檢定-1(永久，意志DC15減半為-0)"
    group_size: "2-4"
    key_mechanic: 接觸規則——角色與暗影接觸→失去自己的影子。維持光源可阻止
    expel: 恢復光源(應急燈)驅散；無法殺死

  - id: leviathan
    name_zh: 利維坦
    name_en: Leviathan
    threat: "★★★★★"
    floors: ["Level 7(深海恐懼症)"]
    behavior: 深處遊弋的巨大生物——不主動追擊，但會回應動靜
    weakness: 不可直視(直視SP永久-3)；離開水域即安全
    hp: 60
    def: 16
    atk_bonus: 8
    damage: "2D10 吞噬(物理) ＋ 直視SP永久-3"
    group_size: 1
    key_mechanic: 凝視規則——直視利維坦→SP永久-3(意志DC20減半為-1)。永久SP削減受全役上限約束
    expel: 無法殺死。保持安靜、避免直視、快速通過排水管道

  - id: attendant
    name_zh: 侍者（僕從）
    name_en: Attendant
    threat: "★★★"
    floors: ["Level 5(恐怖旅館)"]
    behavior: 無面侍者——引導角色前往宴會廳，勸其坐下
    weakness: 拒絕跟隨；破壞宴會廳的空椅子
    hp: 14
    def: 12
    atk_bonus: 3
    damage: "1D6 鈍器(拖拽)"
    group_size: "1-3"
    key_mechanic: 說出角色名字建立錯位感；引導至宴會廳空椅子(坐下=永久囚禁)
    expel: 拒絕並脫離；無法常規驅逐

  - id: dweller
    name_zh: 穴居者
    name_en: Dweller
    threat: "★★(單體) / ★★★(成群)"
    floors: ["Level 8(岩洞系統)"]
    behavior: 怕光——成群行動，遇光退縮
    weakness: 任何光源(強光驅散)
    hp: 10
    def: 11
    atk_bonus: 4
    damage: "1D4 物理(撕咬)"
    group_size: "3-8"
    key_mechanic: 光線恐懼——光源下退縮；黑暗中成群圍攻。維持光源是生存關鍵
    expel: 維持光源；強光暫時驅離

  - id: clerk
    name_zh: 文員
    name_en: Clerk
    threat: "★(環境) / ★★★(被激怒時)"
    floors: ["Level 4(廢棄辦公室)"]
    behavior: 反覆打字的無臉人形——不主動攻擊
    weakness: 忽視即可；「最後的員工」偶爾打出有意義文字(情報)
    hp: 12
    def: 12
    atk_bonus: 0
    damage: "—(被激怒時1D4文具刺擊)"
    group_size: 1
    key_mechanic: 環境實體——專注打字；提供氛圍與潛在情報，不構成直接威脅
    expel: 無需驅逐；離開其區域即可

  - id: swimmer
    name_zh: 泳者
    name_en: Swimmer
    threat: "★★★"
    floors: ["Level 37(溫水泳池)"]
    behavior: 水下抓住腳踝——試圖留人
    weakness: 脫離水面；強力踢擊掙脫
    hp: 18
    def: 13
    atk_bonus: 4
    damage: "抓握(力量DC13掙脫，否則拖入深水1D4/回合)"
    group_size: "1-3"
    key_mechanic: 水中抓踝——被抓住需力量檢定掙脫，否則被拖入深處溺水
    expel: 脫離水面；快速游向淺處

  - id: lifeguard
    name_zh: 救生員
    name_en: Lifeguard
    threat: "★★★★(溺水時)"
    floors: ["Level 37(溫水泳池)"]
    behavior: 坐高椅不動——你溺水時拖你入深處
    weakness: 不主動移動；遠離其視線範圍
    hp: null
    def: null
    atk_bonus: 5
    damage: "拖入深水(溺水1D4/回合，直到死亡)"
    group_size: 1
    key_mechanic: 溺水誘發——當角色溺水掙扎時，救生員緩緩移動過來拖入深處。未溺水時完全無害
    expel: 不溺水則無威脅；保持體力自行游出

  - id: pipe-worm
    name_zh: 管道蠕蟲
    name_en: Pipe Worm
    threat: "★(接觸★★)"
    floors: ["Level 2(管道)"]
    behavior: 非攻擊性——附著管壁，接觸灼傷
    weakness: 避免直接接觸；可繞行
    hp: 6
    def: 10
    atk_bonus: 0
    damage: "接觸1D4灼傷(SP-1)"
    group_size: "1-3"
    key_mechanic: 接觸灼傷——碰到牆上蠕蟲受1D4灼傷。純環境危害，非狩獵者
    expel: 無需驅逐；繞行即可

  - id: the-lost
    name_zh: 失落者
    name_en: The Lost
    threat: "★(情報來源) / ★★★(被激怒)"
    floors: [各樓層(理智歸零的前人類)]
    behavior: 遊蕩喃喃——介於人類與實體之間
    weakness: 忽視；極少主動攻擊
    hp: 14
    def: 11
    atk_bonus: 3
    damage: "1D4 物理(混亂攻擊)"
    group_size: 1
    key_mechanic: 情報來源——喃喃自語含碎片情報(GM可給予線索)；激怒會攻擊
    expel: 不主動威脅；離開即可

threat_scale:
  "★☆☆☆☆": 無直接威脅——可安全觀察
  "★★☆☆☆": 輕微威脅——需謹慎但可控
  "★★★☆☆": 中等威脅——需要明確應對策略
  "★★★★☆": 高度威脅——逃跑優於戰鬥
  "★★★★★": 極度威脅——遭遇可能是致命的

note: 在後室中，了解實體的行為規則比武器更有用。訊息是你的真正武器。

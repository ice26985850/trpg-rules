# 後室行者 TRPG —— 樓層圖鑑（結構化資料）
# 後室由無限多個「樓層（Level）」構成。以下為8劇本中涉及的所有樓層（15+個）完整參考。
# 適合度：★=新手友善 ★☆=需準備 ★★=高挑戰 ★★★=極限

levels:
  - id: L0
    name_zh: Level 0 — 教學關卡（前廳）
    scenario: S1 甦醒
    type: 黃色辦公隔間——後室的經典入口
    space_stability: 輕度不穩定（空間微變）
    main_threats: [孤立感(SP侵蝕), 偶爾獵犬]
    initial_gift: 5隔間範圍內必有一瓶杏仁水
    exits: [防火門→L1, 黑暗樓梯→L2, 電梯→L4]
    suitability: "★★★★★"

  - id: L1
    name_zh: Level 1 — 宜居地帶
    scenario: S2 穿越
    type: 巨型倉庫——混凝土地面、裸露管道
    main_threats: [笑魘(黑暗角), 派系競爭]
    key_locations: [M.E.G.前哨站「基石」(15-25人)]
    exits: [維修樓梯→L2, 電梯→L4, 裝卸門→L11]
    suitability: "★★★★☆"

  - id: L2
    name_zh: Level 2 — 管道噩夢
    scenario: S2 穿越
    type: 陰暗管道迷宮——高溫35°C、90%黑暗
    main_threats: [獵犬巢穴, 笑魘, 熱疲勞]
    unique_resources: [變體杏仁水(濃縮/污染/虛無)]
    special_rules: [黑暗加權(SP額外-1/30min), 聲音吸收50%]
    suitability: "★★☆☆☆"

  - id: L3
    name_zh: Level 3 — 發電站
    scenario: S2 穿越
    type: 廢棄發電設施——裸露電線、故障設備
    main_threats: ["電工實體(2D6電擊攻擊)"]
    core_mechanic: 需重啟3個發電機組打開檢修門
    exits: [檢修門→L4]
    suitability: "★★★☆☆"

  - id: L4
    name_zh: Level 4 — 廢棄辦公室
    scenario: S3 旅館
    type: 現代辦公大樓——B2至F8
    main_threats: [派對客(F5以上), 文員實體]
    safe_zone: F7鏡子房間（派對客不進入）
    exits: [F1旋轉門→L0, 金色電梯→L5]
    suitability: "★★★☆☆"

  - id: L5
    name_zh: Level 5 — 恐怖旅館
    scenario: S3 旅館
    type: 無限維多利亞式旅館——紅地毯、水晶吊燈
    main_threats: [僕從(無面侍者), 畫像實體(眼睛會動)]
    core_danger: 宴會廳空椅子——坐下=永久囚禁
    exits: [進:L4金色電梯, 出:宴會廳帷幕後門→L6]
    suitability: "★★☆☆☆"

  - id: L6
    name_zh: Level 6 — 熄燈
    scenario: S4 熄燈
    type: 絕對黑暗的潮濕走廊——光源被吞噬
    main_threats: [暗影實體(觸碰→影子永久消失)]
    special_rules: [SP每15分鐘-1, 僅靠聽覺導航]
    exits: [地板塌陷→L7]
    suitability: "★★☆☆☆"

  - id: L7
    name_zh: Level 7 — 深海恐懼症
    scenario: S4 熄燈
    type: 被海水淹沒的科研基地
    main_threats: [利維坦——巨大水下生物(不可直視，SP永久-3)]
    resources: [潛水裝備(30分鐘氧氣)]
    exits: [排水管道→L8]
    suitability: "★★☆☆☆"

  - id: L8
    name_zh: Level 8 — 岩洞系統
    scenario: S5 跋涉
    type: 螢光真菌洞穴——發光孢子「星空」
    main_threats: [穴居者(怕光，成群行動)]
    resources: [可食用發光蘑菇(知識DC14分辨)]
    exits: [隧道→L9]
    suitability: "★★★☆☆"

  - id: L9
    name_zh: Level 9 — 郊區
    scenario: S5 跋涉
    type: 永夜雨中的無盡郊區——一模一樣的房屋
    main_threats: [窗後之物(引誘進入房屋)]
    navigation: 跟隨路燈閃爍序列(感知DC15)
    rules: [不要進入任何房子]
    suitability: "★★★☆☆"

  - id: L10
    name_zh: Level 10 — 麥田
    scenario: S5 跋涉
    type: 無邊金色麥田——虛假田園
    main_threats: [會移動的稻草人(非敵意但令人不安)]
    navigation: 路徑會改變(空間記憶DC16)
    exits: [柏油路→L11]
    suitability: "★★★☆☆"

  - id: L11
    name_zh: Level 11 — 無垠城市
    scenario: S6 喘息
    type: 無限現代城市——後室中唯一像文明的地方
    main_threats: [竊皮者(滲透社區)]
    key_locations: [BNTG交易中心, M.E.G.城市前哨站]
    special_rules: [每30天建築內部重置]
    exits: [廢棄醫院地下室電梯→L!]
    suitability: "★★★★☆"

  - id: L!
    name_zh: Level ! — 不想死就快跑！
    scenario: S7 狂奔
    type: 十公里醫院風格走廊——紅色警報+成群實體
    threats: [所有常見實體的混合追擊]
    core_rules: [每公里體能檢定, 唯一強制死亡風險關卡]
    restrictions: [每個角色只能進入一次]
    exits: [EXIT門→結局層]
    suitability: "★☆☆☆☆"

  - id: ending
    name_zh: 結局層 — 白色空間
    scenario: S8 歸途
    type: 純白虛空——兩扇門
    core: [左=前室(回家), 右=後室(留下)]
    rules: [無DC、無戰鬥——純粹選擇]
    suitability: null

suitability_scale:
  "★★★★★": 新手入門——初始禮物保障生存
  "★★★★☆": 有M.E.G.安全網 / 文明喘息——社交和調查
  "★★★☆☆": 發電站迷宮+電工 / 長途遷徙——耐力考驗
  "★★☆☆☆": 高溫+黑暗+獵犬 / 心理恐怖巔峰 / 絕對黑暗+精神侵蝕 / 水下恐怖 / F1-4安全F5+極危
  "★☆☆☆☆": 極限生存——唯一強制死亡風險

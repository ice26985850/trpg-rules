<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 620" font-family="'Microsoft JhengHei','PingFang TC',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#8D6E63"/></marker>
    <marker id="arrowDanger" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#C62828"/></marker>
  </defs>

  <rect width="750" height="620" fill="#3E2723" rx="10"/>

  <text x="375" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFD54F">Level 5 — 恐怖旅館（對應劇本 S3：旅館）</text>

  <text x="20" y="55" font-size="10" fill="#BCAAA4">「歡迎回來。」——穿燕尾服的侍者微笑著說出了你的名字</text>

  <!-- Legend -->
  <rect x="540" y="50" width="190" height="80" rx="8" fill="#4E342E" stroke="#8D6E63" stroke-width="1"/>
  <text x="555" y="68" font-size="9" font-weight="bold" fill="#FFD54F">▸ 圖例</text>
  <rect x="555" y="76" width="18" height="10" rx="3" fill="#FFD54F"/><text x="580" y="85" font-size="8" fill="#BCAAA4">公共區域</text>
  <rect x="555" y="92" width="18" height="10" rx="3" fill="#C62828"/><text x="580" y="101" font-size="8" fill="#BCAAA4">危險區域</text>
  <rect x="555" y="108" width="18" height="10" rx="3" fill="#4CAF50"/><text x="580" y="117" font-size="8" fill="#BCAAA4">出口</text>
  <rect x="680" y="76" width="18" height="10" rx="3" fill="#8D6E63"/><text x="705" y="85" font-size="8" fill="#BCAAA4">僕從巡邏</text>

  <!-- Floor: Red carpet texture hint -->
  <rect x="30" y="70" width="690" height="530" fill="#4E342E" rx="5" opacity="0.3"/>

  <!-- Hotel structure -->
  <!-- Main corridor -->
  <rect x="80" y="150" width="590" height="20" rx="3" fill="#8D6E63" opacity="0.5"/>
  <text x="375" y="140" text-anchor="middle" font-size="12" fill="#FFD54F">∞ 紅地毯走廊（無限延伸）∞</text>

  <!-- Vertical corridor -->
  <rect x="360" y="170" width="20" height="380" rx="3" fill="#8D6E63" opacity="0.5"/>

  <!-- Nodes -->
  <!-- N1: Elevator entrance -->
  <rect x="100" y="105" width="90" height="24" rx="12" fill="#FFD54F"/><text x="145" y="122" text-anchor="middle" font-size="9" fill="#3E2723" font-weight="bold">金色電梯入口</text>
  <text x="145" y="142" text-anchor="middle" font-size="8" fill="#BCAAA4">來自Level 4</text>

  <!-- N2: Lobby -->
  <rect x="260" y="105" width="90" height="24" rx="12" fill="#FFD54F"/><text x="305" y="122" text-anchor="middle" font-size="9" fill="#3E2723" font-weight="bold">大廳</text>
  <text x="305" y="142" text-anchor="middle" font-size="8" fill="#BCAAA4">侍者在此等候</text>

  <!-- N3: Your Room -->
  <rect x="180" y="200" width="100" height="28" rx="12" fill="#C62828"/><text x="230" y="219" text-anchor="middle" font-size="9" fill="white">你的房間⚠</text>
  <text x="230" y="240" text-anchor="middle" font-size="8" fill="#BCAAA4">門上刻著你的名字</text>

  <!-- N4: Portrait corridor -->
  <rect x="440" y="200" width="100" height="28" rx="12" fill="#C62828"/><text x="490" y="219" text-anchor="middle" font-size="9" fill="white">畫像走廊⚠</text>
  <text x="490" y="240" text-anchor="middle" font-size="8" fill="#BCAAA4">眼睛會動的畫中實體</text>

  <!-- N5: Butler patrol -->
  <rect x="340" y="280" width="60" height="28" rx="12" fill="#8D6E63"/><text x="370" y="299" text-anchor="middle" font-size="9" fill="white">僕從巡邏</text>

  <!-- N6: Lost rooms -->
  <rect x="130" y="350" width="100" height="28" rx="12" fill="#8D6E63"/><text x="180" y="369" text-anchor="middle" font-size="9" fill="white">迷失者房間群</text>
  <text x="180" y="390" text-anchor="middle" font-size="8" fill="#BCAAA4">每個房門刻著名字</text>

  <!-- N7: Mirror hall -->
  <rect x="500" y="350" width="100" height="28" rx="12" fill="#8D6E63"/><text x="550" y="369" text-anchor="middle" font-size="9" fill="white">鏡廳</text>
  <text x="550" y="390" text-anchor="middle" font-size="8" fill="#BCAAA4">無限反射——哪個是你？</text>

  <!-- N8: Banquet hall -->
  <rect x="250" y="480" width="140" height="34" rx="14" fill="#C62828"/><text x="320" y="502" text-anchor="middle" font-size="10" fill="white" font-weight="bold">⚠ 宴會廳</text>
  <text x="320" y="525" text-anchor="middle" font-size="8" fill="#FF8A80">長桌•空椅子•上百空眼睛</text>

  <!-- N9: Service door -->
  <rect x="550" y="500" width="90" height="34" rx="14" fill="#4CAF50"/><text x="595" y="519" text-anchor="middle" font-size="10" fill="white" font-weight="bold">🔥 後門出口</text>
  <text x="595" y="542" text-anchor="middle" font-size="8" fill="#A5D6A7">帷幕後→Level 6</text>

  <!-- Edges -->
  <line x1="190" y1="120" x2="260" y2="120" stroke="#FFD54F" stroke-width="1.5"/>
  <line x1="350" y1="120" x2="440" y2="120" stroke="#FFD54F" stroke-width="1.5"/>
  <line x1="230" y1="160" x2="230" y2="200" stroke="#8D6E63" stroke-width="1.5"/>
  <line x1="490" y1="160" x2="490" y2="200" stroke="#8D6E63" stroke-width="1.5"/>
  <line x1="370" y1="220" x2="370" y2="280" stroke="#8D6E63" stroke-width="1.5"/>
  <line x1="230" y1="240" x2="230" y2="350" stroke="#8D6E63" stroke-width="1.5"/>
  <line x1="490" y1="240" x2="490" y2="350" stroke="#8D6E63" stroke-width="1.5"/>
  <line x1="230" y1="380" x2="320" y2="480" stroke="#C62828" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrowDanger)"/>
  <line x1="490" y1="380" x2="550" y2="500" stroke="#4CAF50" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="290" y="440" font-size="9" fill="#C62828">→ 宴會</text>
  <text x="525" y="445" font-size="9" fill="#4CAF50">→ 逃生</text>

  <!-- Warnings -->
  <text x="50" y="595" font-size="9" fill="#FF8A80">⚠ 僕從巡邏：穿燕尾服的無面侍者——不要與牠們交談。不要接受任何「服務」。</text>
  <text x="50" height="613" font-size="9" fill="#FFD54F">宴會廳空椅子：坐下=永久囚禁 | 後門：帷幕後的服務門通往Level 6</text>
</svg>

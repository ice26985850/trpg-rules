    type: "vertical"
    label: "垂直通道"
  - from: "N04"
    to: "N06"
    type: "corridor"
    label: "下層管道"
  - from: "N05"
    to: "N06"
    type: "corridor"
    label: "繞過蒸汽區"
  - from: "N06"
    to: "N07"
    type: "corridor"
    label: "轉角通道"
  - from: "N07"
    to: "N08"
    type: "dangerous_path"
    label: "通往巢穴（危險！）"
  - from: "N06"
    to: "N10"
    type: "corridor"
    label: "側邊通道（通往避難所）"
  - from: "N10"
    to: "N11"
    type: "corridor"
    label: "最後一段管道"
  - from: "N06"

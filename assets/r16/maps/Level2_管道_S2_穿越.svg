<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 580" font-family="'Microsoft JhengHei','PingFang TC',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#666"/></marker>
    <marker id="arrowDanger" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#C62828"/></marker>
    <marker id="arrowVert" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#7B1FA2"/></marker>
  </defs>

  <rect width="850" height="580" fill="#263238" rx="10"/>

  <text x="425" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFB74D">Level 2 — 管道迷宮（對應劇本 S2：深處）</text>

  <!-- Regions -->
  <rect x="120" y="70" width="210" height="90" rx="10" fill="#E8F5E9" opacity="0.3" stroke="#4CAF50" stroke-width="1" stroke-dasharray="5,5"/>
  <text x="225" y="90" text-anchor="middle" font-size="10" fill="#4CAF50">入口區</text>

  <rect x="300" y="70" width="280" height="150" rx="10" fill="#FFF3E0" opacity="0.2" stroke="#FF9800" stroke-width="1" stroke-dasharray="5,5"/>
  <text x="440" y="90" text-anchor="middle" font-size="10" fill="#FF9800">主要管道層（中層）</text>

  <rect x="70" y="300" width="330" height="220" rx="10" fill="#FFEBEE" opacity="0.25" stroke="#C62828" stroke-width="1" stroke-dasharray="5,5"/>
  <text x="235" y="320" text-anchor="middle" font-size="10" fill="#C62828">⚠ 獵犬活躍區</text>

  <rect x="520" y="380" width="160" height="100" rx="10" fill="#E3F2FD" opacity="0.3" stroke="#2196F3" stroke-width="1" stroke-dasharray="5,5"/>
  <text x="600" y="400" text-anchor="middle" font-size="10" fill="#2196F3">避難所</text>

  <rect x="640" y="250" width="130" height="100" rx="10" fill="#E8EAF6" opacity="0.3" stroke="#3F51B5" stroke-width="1" stroke-dasharray="5,5"/>
  <text x="705" y="270" text-anchor="middle" font-size="10" fill="#3F51B5">出口區</text>

  <!-- Legend -->
  <rect x="15" y="50" width="175" height="108" rx="8" fill="#37474F" stroke="#546E7A" stroke-width="1"/>
  <text x="25" y="68" font-size="10" font-weight="bold" fill="#FFB74D">▸ 圖例</text>
  <rect x="25" y="76" width="20" height="10" rx="3" fill="#4CAF50"/>
  <text x="52" y="85" font-size="8" fill="#B0BEC5">入口區（安全）</text>
  <rect x="25" y="92" width="20" height="10" rx="3" fill="#C62828"/>
  <text x="52" y="101" font-size="8" fill="#B0BEC5">獵犬區（危險）</text>
  <rect x="25" y="108" width="20" height="10" rx="3" fill="#2196F3"/>
  <text x="52" y="117" font-size="8" fill="#B0BEC5">避難所（休息）</text>
  <rect x="25" y="124" width="20" height="10" rx="3" fill="#3F51B5"/>
  <text x="52" y="133" font-size="8" fill="#B0BEC5">出口</text>
  <line x1="25" y1="145" x2="45" y2="145" stroke="#FF5722" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="52" y="149" font-size="8" fill="#B0BEC5">垂直通道</text>

  <!-- Edges -->
  <line x1="170" y1="120" x2="290" y2="150" stroke="#78909C" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="320" y1="165" x2="440" y2="130" stroke="#78909C" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="370" y="140" font-size="8" fill="#FF9800">主要管道（建議）</text>
  <line x1="320" y1="165" x2="360" y2="280" stroke="#C62828" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrowDanger)"/>
  <text x="310" y="230" font-size="8" fill="#C62828">分支（捷徑⚠）</text>
  <line x1="450" y1="140" x2="540" y2="210" stroke="#FF5722" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrowVert)"/>
  <text x="510" y="170" font-size="8" fill="#FF5722">垂直管道井</text>
  <line x1="380" y1="295" x2="480" y2="350" stroke="#78909C" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="510" y1="360" x2="240" y2="360" stroke="#78909C" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="370" y="340" font-size="8" fill="#FFB74D">管道標記牆 → 獵犬區</text>
  <line x1="240" y1="375" x2="130" y2="445" stroke="#C62828" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrowDanger)"/>
  <text x="190" y="420" font-size="8" fill="#C62828">⚠ 巢穴</text>
  <line x1="500" y1="375" x2="590" y2="445" stroke="#78909C" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="560" y="405" font-size="8" fill="#2196F3">→ 避難所</text>
  <line x1="610" y1="475" x2="690" y2="340" stroke="#78909C" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="670" y="410" font-size="8" fill="#3F51B5">→ 出口</text>
  <line x1="520" y1="375" x2="390" y2="480" stroke="#78909C" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="440" y="440" font-size="8" fill="#B0BEC5">閥門室</text>
  <line x1="540" y1="240" x2="690" y2="320" stroke="#78909C" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="600" y="270" font-size="8" fill="#B0BEC5">上層繞行</text>

  <!-- Nodes -->
  <rect x="130" y="105" width="70" height="24" rx="12" fill="#4CAF50"/><text x="165" y="122" text-anchor="middle" font-size="9" fill="white">維修樓梯入口</text>
  <rect x="260" y="140" width="70" height="24" rx="12" fill="#FF9800"/><text x="295" y="157" text-anchor="middle" font-size="9" fill="white">初始交匯</text>
  <rect x="420" y="115" width="70" height="24" rx="12" fill="#FF9800"/><text x="455" y="132" text-anchor="middle" font-size="9" fill="white">主要管道</text>
  <rect x="515" y="195" width="70" height="24" rx="12" fill="#FF5722"/><text x="550" y="212" text-anchor="middle" font-size="9" fill="white">垂直管道井</text>
  <rect x="330" y="270" width="70" height="24" rx="12" fill="#C62828"/><text x="365" y="287" text-anchor="middle" font-size="9" fill="white">蒸汽洩漏⚠</text>
  <rect x="465" y="345" width="70" height="24" rx="12" fill="#FF9800"/><text x="500" y="362" text-anchor="middle" font-size="9" fill="white">標記牆</text>
  <rect x="200" y="345" width="70" height="24" rx="12" fill="#C62828"/><text x="235" y="362" text-anchor="middle" font-size="9" fill="white">獵犬巡邏⚠</text>
  <rect x="95" y="435" width="70" height="24" rx="12" fill="#B71C1C"/><text x="130" y="452" text-anchor="middle" font-size="9" fill="white">巢穴邊緣⚠⚠</text>
  <rect x="350" y="470" width="70" height="24" rx="12" fill="#FFB74D"/><text x="385" y="487" text-anchor="middle" font-size="9" fill="#333">紅色閥門室</text>
  <rect x="555" y="435" width="70" height="24" rx="12" fill="#2196F3"/><text x="590" y="452" text-anchor="middle" font-size="9" fill="white">前人避難所</text>
  <rect x="660" y="315" width="80" height="28" rx="14" fill="#3F51B5"/><text x="700" y="334" text-anchor="middle" font-size="10" fill="white">🔥出口→L11</text>

  <!-- Warnings -->
  <text x="130" y="540" font-size="9" fill="#FF8A80">⚠ 高溫 35°C | 90%黑暗中 | 聲音吸收50% | 黑暗+30min SP額外-1</text>
  <text x="130" y="558" font-size="9" fill="#FFB74D">建議裝備：手電筒×2、螢光棒×3、杏仁水×3、充足食物</text>
</svg>

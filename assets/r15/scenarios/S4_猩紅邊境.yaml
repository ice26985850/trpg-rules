routes:
  - name: "外交接觸"
    description: "先派交涉隊談判，依結果行動。最低傷亡風險，可能獲得情報。"
    dc: 75
  - name: "武力驅逐"
    description: "全面行動清除前哨。速戰速決，但傷亡風險高。"

name: "S4：猩紅邊境"
description: >
  猩紅秩序在Level 4設立前哨站——在你管轄區域的家門口。
  這是「派系戰爭」的開幕。第一槍會由你來開——或者，你可以選擇不開。
difficulty: 困難
real_dc: {外交: 75, 武力: 90}

name: "S6：最後的任務"
description: >
  辦公室的燈亮了好幾天。退休申請書填了一半——旁邊是你在任期間的所有任務報告。
  三種結局等待著你：傳承給接班人、解散管理局、或親自穿上裝備走入後室。
  這是你的最後一個簽名。
difficulty: 自殺級
real_dc: 115
level_range: "18–20"
mission_type: "特殊——終局任務"
campaign: "戰役五：最後的任務（終局）"
endings:
  - id: A
    name: "傳承"
    trigger: "聲望≥70，有可接班的人選"
    dc: 115
    special_bonus: "+15（主任指導加值）"
    emotional_core: "「我把最好的留下了」"
    final_scene: "把筆交給接班人。牆上多了一個空的相框——那是給你的。"
  - id: B
    name: "解散"
    trigger: "傷亡過高或資源枯竭"
    dc: null
    type: "一系列選擇（非檢定）"
    emotional_core: "「我盡力了」"
    final_scene: "關上辦公室的燈——最後一次。走廊空無一人。你沒有回頭。"
    key_choices:
      - "為每位剩餘探險員找到去處（多個二選一或三選一抉擇）"
  - id: C
    name: "親自走入"
    trigger: "特定劇情線索或愧疚值觸發"
    dc: 115
    emotional_core: "「這次，我不會派別人去」"
    special_rules:
      - "主任作為探險員：加值=任期內完成任務總數÷10（上限+25）"
      - "選擇1個主專長+1個次專長"
      - "心理狀態自動從「穩定」開始"
    final_scene: "推開據點的大門。脫下裝備。簽下退休申請書。這一次——你知道他們經歷了什麼。"
gm_advice:
  - "安排特殊長時段，不要匆忙"
  - "在最後場景後給玩家一段沉默"
  - "準備續作鉤子：結局A的接班人可成下一場主角；結局C的退休主任可成NPC"
